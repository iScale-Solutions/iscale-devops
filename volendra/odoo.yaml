AWSTemplateFormatVersion: 2010-09-09
Description: Regular Odoo setup

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
          - DatabaseStackName
          - UseOwnDatabase
          - LoadBalancerStackName
          - UseOwnLoadBalancer
          - UseSharedEFS
      - Label:
          default: Load Balancer Configuration
        Parameters:
          - ClientDomainName
          - LoadBalancerCertificateArn
          - LoadBalancerPriority
          - LoadBalancerHostName
      - Label:
          default: EFS Configuration
        Parameters:
          - SharedEFSID
          - SharedEFSSecurityGroup
      - Label:
          default: DB Instance Configuration
        Parameters:
          - AllowDatabaseRemoteAccess
          - AllowDatabaseBlur
          - DatabaseUser
          - DatabaseUserPassword
          - DBSnapshotIdentifier
          - MasterUser
          - MasterUserPassword
      - Label:
          default: EC2 Instance Configuration
        Parameters:
          - InstanceKeyName
          - InstanceAMI
          - InstanceSubnet
      - Label:
          default: Scheduler Configuration
        Parameters:
          - StartScheduleExpression
          - StopScheduleExpression
      - Label:
          default: Deploy Configuration
        Parameters:
          - CreateCodePipeline

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      AllowDatabaseBlur:
        default: Allow database blur
      AllowDatabaseRemoteAccess:
        default: Allow Database remote access
      CreateCodePipeline:
        default: Create Code Pipeline
      DatabaseStackName:
        default: Database Stack Name
      LoadBalancerCertificateArn:
        default: Load Balancer Certificate ARN
      LoadBalancerPriority:
        default: Load Balancer Rule Priority
      LoadBalancerStackName:
        default: Load Balancer Stack Name
      NetworkStackName:
        default: Network Stack Name
      SNSStackName:
        default: SNS Topic Stack Name
      ClientDomainName:
        default: Domain Name
      InstanceKeyName:
        default: Instance Key Name
      InstanceAMI:
        default: Instance AMI
      InstanceSubnet:
        default: Instance Subnet to use
      SharedEFSID:
        default: Shared EFS ID (if using shared EFS, else leave blank)
      SharedEFSSecurityGroup:
        default: Shared EFS Security Group (if using shared EFS, else leave blank)
      StartScheduleExpression:
        default: Start Schedule CRON Expression
      StopScheduleExpression:
        default: Stop Schedule CRON Expression
      UseOwnLoadBalancer:
        default: Use own ELB for this setup?
      UseOwnDatabase:
        default: Use own database for this setup?

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 9
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
      - PreProd
  AllowDatabaseBlur:
    Description: Set to true to allow blur script to be enabled
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  AllowDatabaseRemoteAccess:
    Description: Set to true to allow a developer to access the DB removely (only when using own DB)
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  ClientDomainName:
    Description: The client's domain name (e.g. example.com, iscale-software.com).
    Type: String
    AllowedPattern: ^[a-z0-9]+([\-\.]{1}[a-z0-9]+)*\.[a-z]{2,7}$
    Default: iscale-software.com
    MinLength: 1
  CreateCodePipeline:
    Description: Set to TRUE to create a code pipeline
    Type: String
    Default: FALSE
    AllowedValues:
      - FALSE
      - TRUE
  DatabaseStackName:
    Description: The name of the database stack (only when NOT using own database)
    Type: String
    Default: ''
  DatabaseUser:
    Description: The name of the database user
    Type: String
    Default: dbuser
  DatabaseUserPassword:
    Description: The password of the database user
    NoEcho: true
    Type: String
    Default: ''
  DBSnapshotIdentifier:
    Description: The name or Amazon Resource Name (ARN) of the DB snapshot to restore. If you specied root user, make sure it matches
    Type: String
    Default: ''
  InstanceAMI:
    Description: Instance AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-0bc06212a56393ee1
  InstanceKeyName:
    Description: Instance Key Name
    Type: String
    Default: ''
  InstanceSubnet:
    Description: Subnet to use for the instance
    Type: String
    AllowedValues:
      - Public
      - Private
    Default: Public
  LoadBalancerCertificateArn:
    Description: Load Balancer Certificate ARN (only needed when using own ELB)
    Type: String
    Default: ''
  LoadBalancerHostName:
    Description: (Optional) Custom Hostname for load balancer URL
    Type: String
    Default: ''
    MaxLength: 12
  LoadBalancerPriority:
    Description: The priority for ELB Listener. Not required if using own ELB
    Type: Number
    Default: 750
    MinValue: 1
    MaxValue: 50000
  LoadBalancerStackName:
    Description: The name of the load balancer stack (only when NOT using own ELB)
    Type: String
    Default: iscale-dev-stg-uw2-alb
  MasterUser:
    Description: The name of the master user for the database instance.
    Type: String
    Default: root
  MasterUserPassword:
    Description: Master User Password
    NoEcho: true
    Type: String
    Default: ''
  NetworkStackName:
    Description: The name of the network stack.
    Type: String
    Default: iscale-dev-dev-uw2-network
    MinLength: 1
  SharedEFSID:
    Description: The name of the shared EFS (if using Shared EFS, else leave blank)
    Type: String
    Default: ''
  SharedEFSSecurityGroup:
    Description: The name of the shared EFS Security Group (if using Shared EFS, else leave blank)
    Type: String
    Default: ''
  SNSStackName:
    Description: the name of the SNS stack.
    Type: String
    Default: pchc-prd-ase1-sns
    MinLength: 1
  StartScheduleExpression:
    Description: Schedule expression when to start the objects
    Type: String
    Default: cron(0 0 ? * MON-FRI *)
  StopScheduleExpression:
    Description: Schedule expression when to stop the objects
    Type: String
    Default: cron(0 10 ? * MON-FRI *)
  UseOwnLoadBalancer:
    Description: Do you want to create a dedicated ELB for this Odoo Setup? If no, you will reuse an existing ELB stack
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  UseOwnDatabase:
    Description: Do you want to create a dedicated database for this Odoo Setup? If no, you will reuse an existing database stack
    Type: String
    Default: true
    AllowedValues:
      - true
      - false
  UseSharedEFS:
    Description: Do you want to use an existing, shared EFS ?
    Type: String
    Default: false
    AllowedValues:
      - true
      - false

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasAllowDatabaseRemoteAccess: !Equals [!Ref AllowDatabaseRemoteAccess, true]
  HasBlur: !Equals [!Ref AllowDatabaseBlur, true]
  HasCodePipeline: !Equals [!Ref CreateCodePipeline, TRUE]
  HasMasterUserPassword: !Not [!Equals [!Ref MasterUserPassword, '']]
  HasDatabaseUserPassword: !Not [!Equals [!Ref DatabaseUserPassword, '']]
  HasDBSnapshotIdentifier: !Not [!Equals [!Ref DBSnapshotIdentifier, '']]
  HasLoadBalancerHostName: !Not [!Equals [!Ref LoadBalancerHostName, '']]
  HasOwnDatabase: !Equals [!Ref UseOwnDatabase, true]
  HasOwnLoadBalancer: !Equals [!Ref UseOwnLoadBalancer, true]
  HasSharedEFS: !Equals [!Ref UseSharedEFS, true]
  HasStartScheduleExpression: !Not [!Equals [!Ref StartScheduleExpression, '']]
  HasStopScheduleExpression: !Not [!Equals [!Ref StopScheduleExpression, '']]
  HasScheduleExpression: !Or [!Condition HasStartScheduleExpression, !Condition HasStopScheduleExpression]

Resources:

  ELBStack:
    Condition: HasOwnLoadBalancer
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/loadbalancer.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        CertificateArn: !Ref LoadBalancerCertificateArn
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName

  DBStack:
    Condition: HasOwnDatabase
    DeletionPolicy: Retain
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/database.yaml
      Parameters:
        Name: !Ref Name
        DatabaseName: !Join ['',[!Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name]]]
        DatabaseUser: !Ref DatabaseUser
        DatabaseUserPassword: !If [HasDatabaseUserPassword, !Ref DatabaseUserPassword, !Ref 'AWS::NoValue']
        DeletionProtection: !If [IsProd, true, false]
        EnableCPUCreditAlarm: !If [IsProd, true, false]
        EnableEnhancedMonitoring: !If [IsProd, true, false]
        EnvName: !Ref EnvName
        Engine: aurora-postgresql
        EngineVersion: 12.7
        Family: aurora-postgresql12
        InstanceType: db.t3.medium #Can only be medium or large for t class
        MasterUser: !Ref MasterUser
        MasterUserPassword: !If [HasMasterUserPassword, !Ref MasterUserPassword, !Ref 'AWS::NoValue']
        Port: 5432
        NetworkStackName: !Ref NetworkStackName
        NetworkType: !If [HasAllowDatabaseRemoteAccess, Public, !Ref 'AWS::NoValue']
        PubliclyAccessible: !If [HasAllowDatabaseRemoteAccess, true, false]
        OrgName: !Ref OrgName
        SnapshotIdentifier: !If [HasDBSnapshotIdentifier, !Ref DBSnapshotIdentifier, !Ref 'AWS::NoValue']
        SNSStackName: !Ref SNSStackName
        StorageEncrypted: true

  DeployStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/deployment.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        CreateCodePipeline: !If [HasCodePipeline, TRUE, FALSE]
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName
  
  AppServerStack:
    DependsOn:
      - DeployStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/appserver-basic.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        ClientDomainName: !Ref ClientDomainName
        DatabaseEndpoint: !If
          - HasOwnDatabase
          - Fn::GetAtt:
            - DBStack
            - Outputs.ClusterEndpointAddress
          - Fn::ImportValue:
              !Sub '${DatabaseStackName}-ClusterEndpointAddress'
        DatabasePort: !If 
          - HasOwnDatabase
          - Fn::GetAtt:
            - DBStack
            - Outputs.ClusterPort
          - Fn::ImportValue:
              !Sub '${DatabaseStackName}-ClusterPort'
        DatabaseSecurityGroupId: !If 
          - HasOwnDatabase
          - Fn::GetAtt:
            - DBStack
            - Outputs.SecurityGroupId
          - Fn::ImportValue:
              !Sub '${DatabaseStackName}-SecurityGroupId'
        ExternalEFSID: !If [HasSharedEFS, !Ref SharedEFSID, !Ref 'AWS::NoValue']
        ExternalEFSSecurityGroup: !If [HasSharedEFS, !Ref SharedEFSSecurityGroup, !Ref 'AWS::NoValue']
        LoadBalancerPriority: !Ref LoadBalancerPriority
        LoadBalancerStackName: !If [HasOwnLoadBalancer, !Select [ 1, !Split [ '/', !Ref ELBStack]], !Ref LoadBalancerStackName]
        InstanceAMI: !Ref InstanceAMI
        InstanceKeyName: !Ref InstanceKeyName
        InstanceSpotPrice: 2.5
        InstanceSubnet: !Ref InstanceSubnet
        InstanceType: t3.medium
        LoadBalancerHostName: !If [HasLoadBalancerHostName, !Ref LoadBalancerHostName, !Ref 'AWS::NoValue']
        SNSStackName: !Ref SNSStackName
        NetworkStackName: !Ref NetworkStackName
        SharedSecretId: !If 
          - HasOwnDatabase
          - !Ref 'AWS::NoValue'
          - Fn::ImportValue:
              !Sub '${DatabaseStackName}-DBSecretManagerKeyId'
  BackupStack:
    DependsOn:
      - AppServerStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/backup.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        BackupARNList: !If
          - HasOwnDatabase
          - !Join
            - ','
            - - Fn::GetAtt:
                - DBStack
                - Outputs.DBClusterARN
              - Fn::GetAtt:
                - AppServerStack
                - Outputs.AppServerEFSArn
          - !Join
            - ',' 
            - - Fn::ImportValue:
                  !Sub '${DatabaseStackName}-DBClusterARN'
              - Fn::GetAtt:
                - AppServerStack
                - Outputs.AppServerEFSArn

  SchedulerStack:
    Condition: HasScheduleExpression
    DependsOn:
      - AppServerStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: FALSE
        DatabaseClusterArn: !If
          - HasOwnDatabase
          - Fn::GetAtt:
              - DBStack
              - Outputs.DBClusterARN
          - !Ref 'AWS::NoValue'
        CodeDeployApplicationName:
          Fn::GetAtt:
            - DeployStack
            - Outputs.CodeDeployApplicationName
        CodeDeployDeploymentGroupName:
          Fn::GetAtt:
            - DeployStack
            - Outputs.CodeDeployDeploymentGroupName

####
# Blur Section
####
  
  SSMServiceRole:
    Condition: HasBlur
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ssm.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, ssm-service-role]]
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              -
                Effect: Allow
                Action:
                  - SNS:Publish
                Resource:
                  Fn::ImportValue:
                    !Sub '${SNSStackName}-TopicArn'

  BlurExecutionRole:
    Condition: HasBlur
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, blur-execution-role]]
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: '*'
              - Effect: Allow
                Action:
                  - ssm:SendCommand
                Resource: arn:aws:ssm:*:*:document/*
              - Effect: Allow
                Action:
                  - ssm:SendCommand
                Resource: arn:aws:ec2:*:*:instance/*
                Condition:
                  StringLike:
                    ssm:resourceTag/Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:CreateLogGroup
                  - logs:DescribeLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*

  BlurSSMDocument:
    Condition: HasBlur
    Type: AWS::SSM::Document
    Properties:
      Content: !Sub
        - |
            {
              "schemaVersion": "1.2",
              "description": "Run a shell script or specify the commands to run.",
              "parameters": {
                "commands": {
                  "type": "StringList",
                  "description": "(Required) Specify a shell script or a command to run.",
                  "minItems": 1,
                  "displayType": "textarea"
                },
                "workingDirectory": {
                  "type": "String",
                  "default": "${workdir}",
                  "description": "(Optional) The path to the working directory on your instance.",
                  "maxChars": 4096
                },
                "executionTimeout": {
                  "type": "String",
                  "default": "3600",
                  "description": "(Optional) The time in seconds for a command to complete before it is considered to have failed. Default is 3600 (1 hour). Maximum is 172800 (48 hours).",
                  "allowedPattern": "([1-9][0-9]{0,4})|(1[0-6][0-9]{4})|(17[0-1][0-9]{3})|(172[0-7][0-9]{2})|(172800)"
                }
              },
              "runtimeConfig": {
                "aws:runShellScript": {
                  "properties": [
                    {
                      "id": "0.aws:runShellScript",
                      "runCommand": "{{ commands }}",
                      "workingDirectory": "{{ workingDirectory }}",
                      "timeoutSeconds": "{{ executionTimeout }}"
                    }
                  ]
                }
              }
            }
        - workdir: /var/iscale-odoo/scripts/
      DocumentType: Command
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

  BlurLambdaFunction:
    Condition: HasBlur
    Type: AWS::Lambda::Function
    Properties:
      Description: Blur Prod database and upload it in Dev Instance
      FunctionName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, blur]]
      Handler: index.lambda_handler
      Role: !GetAtt BlurExecutionRole.Arn
      Runtime: python3.6
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, blur]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName
      Timeout: 900
      Environment:
        Variables:
          SSM_SERVICE_ROLE: !GetAtt SSMServiceRole.Arn
          SNS_ARN:
            Fn::ImportValue:
              !Sub '${SNSStackName}-TopicArn'
          DOCUMENT_NAME: !Ref BlurSSMDocument
          VALUE: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Code:
        ZipFile: |
          import boto3
          import logging
          import os

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
              
          def lambda_handler(event, context):
            documentName=os.environ['DOCUMENT_NAME']
            db_name=event['db_name']
            value=os.environ['VALUE']
            snsTopicArn=os.environ['SNS_ARN']
            ssmServiceRole=os.environ['SSM_SERVICE_ROLE']
            blur_command = 'sudo /var/iscale-odoo/scripts/blur.sh ' + db_name + ' >> /var/log/blur.log '

            try:
              ssm = boto3.client('ssm')
              response = ssm.send_command(
                          DocumentName=documentName,
                          Parameters={'commands': [blur_command]},
                          Targets=[
                                {
                                    'Key': 'tag:Name',
                                    'Values': [value]
                                },
                            ],
                          NotificationConfig={
                              'NotificationArn': snsTopicArn,
                              'NotificationEvents': ['All'],
                              'NotificationType': 'Command'
                            },
                          ServiceRoleArn=ssmServiceRole
                          )
              logger.info(response)
            except Exception:
              logger.exception('Error Encountered')

  BlurLambdaLogGroup:
    Condition: HasBlur
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['/', ['/aws/lambda', !Ref BlurLambdaFunction]]
      RetentionInDays: 14

  BlurLambdaExecutionGroup:
    Condition: HasBlur
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, blur-group]]
      Path: /
      Policies:
        - PolicyName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, allow-blur-access]]
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt [BlurLambdaFunction, Arn]

Outputs:
  DeploymentUserGroup:
    Description: Add your BitBucket user into this group
    Value:
      Fn::GetAtt:
        - DeployStack
        - Outputs.DeploymentUserGroup

  AppServerTargetGroup:
    Description: AppServer Target Group where odoo resides
    Value:
      Fn::GetAtt:
        - AppServerStack
        - Outputs.AppServerTargetGroup
    Export:
      Name: !Sub '${AWS::StackName}-AppServerTargetGroup'

  ApplicationELBDNSName:
    Description: DNS Name of the ELB in front of the odoo setup
    Value: !If
      - HasOwnLoadBalancer
      - Fn::GetAtt:
        - ELBStack
        - Outputs.DNSName
      - Fn::ImportValue:
          Fn::Sub: '${LoadBalancerStackName}-DNSName'
    Export:
      Name: !Sub '${AWS::StackName}-ApplicationELBDNSName'

  ApplicationELBListenerArn:
    Description: AppServer Target Group where odoo resides
    Value: !If
      - HasOwnLoadBalancer
      - Fn::GetAtt:
        - ELBStack
        - Outputs.ApplicationListenerArn
      - Fn::ImportValue:
          Fn::Sub: '${LoadBalancerStackName}-ApplicationListenerArn'
    Export:
      Name: !Sub '${AWS::StackName}-ApplicationELBListenerArn'