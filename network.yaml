AWSTemplateFormatVersion: 2010-09-09
Description: Network Resources

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      -
        Label:
          default: Resource Configuration
        Parameters:
          - OrgName
          - EnvName
      -
        Label:
          default: Network Configuration
        Parameters:
          - SetupName
          - InstanceKeyName
          - LocalDomainName

    ParameterLabels:
      SetupName:
        default: Setup Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      InstanceKeyName:
        default: Bastion Key Name
      LocalDomainName:
        default: Local VPC domain name

Parameters:
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-hosting
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  SetupName:
    Description: Setup Name (E.g 'ABC Production')
    MinLength: 1
    Type: String
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9]*'
    ConstraintDescription: Setup Name cannot be empty
  InstanceKeyName:
    Description: EC2 KeyPair Name
    MinLength: 1
    Type: 'AWS::EC2::KeyPair::KeyName'
    ConstraintDescription: Must be the name of an existing EC2 KeyPair.
  LocalDomainName:
    Description: Local VPC domain name (E.g 'hosting.prod')
    MinLength: 1
    Type: String
    ConstraintDescription: Domain Name cannot be empty

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml
  Network:
    VPC:
      Cidr: 10.0.0.0/24
      PublicSubnetAZ1: 10.0.0.0/26
      PublicSubnetAZ2: 10.0.0.64/26
      PrivateSubnetAZ1: 10.0.0.128/26
      PrivateSubnetAZ2: 10.0.0.192/26

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml

Resources:
  
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      EnableDnsSupport: true
      EnableDnsHostnames: true
      CidrBlock: !FindInMap 
        - Network
        - VPC
        - Cidr
      Tags:
        - Key: Name
          Value: !Ref SetupName
  
  VPCFlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - vpc-flow-logs.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: VPCFlowLogsAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource:
                  - '*'
  
  VPCFlowLogsGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Join ['-', [!Ref VPC, 'FlowLogs']]
      RetentionInDays: 365
  
  VPCFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      DeliverLogsPermissionArn: !GetAtt 
        - VPCFlowLogRole
        - Arn
      LogGroupName: !Ref VPCFlowLogsGroup
      ResourceId: !Ref VPC
      ResourceType: VPC
      TrafficType: ALL
  
  InternetGateway:
    DependsOn: VPC
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Join [' ', [!Ref SetupName, 'Internet Gateway']]
  
  GatewayToInternet:
    DependsOn: VPC
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway
  
  NATGatewayAZ1:
    DependsOn: GatewayToInternet
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt 
        - NATGatewayEIP1
        - AllocationId
      SubnetId: !Ref PublicSubnetAZ1
      Tags:
        - Key: Name
          Value: !Join 
            - ' - '
            - - !Ref SetupName
              - NAT Gateway
              - !Select 
                - '0'
                - !GetAZs 
                  Ref: 'AWS::Region'
  
  NATGatewayAZ2:
    DependsOn: GatewayToInternet
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt [NATGatewayEIP2, AllocationId]
      SubnetId: !Ref PublicSubnetAZ2
      Tags:
        - Key: Name
          Value: !Join 
            - ' - '
            - - !Ref SetupName
              - NAT Gateway
              - !Select 
                - '1'
                - !GetAZs 
                  Ref: 'AWS::Region'
  
  NATGatewayEIP1:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  
  NATGatewayEIP2:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Join [' - ', [!Ref SetupName, 'Public Route Table']]
  
  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  
  PublicSubnetAZ1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      MapPublicIpOnLaunch: true
      CidrBlock: !FindInMap 
        - Network
        - VPC
        - PublicSubnetAZ1
      AvailabilityZone: !Select 
        - '0'
        - !GetAZs 
          Ref: 'AWS::Region'
      Tags:
        - Key: Name
          Value: !Join 
            - ''
            - - 'Public subnet '
              - !Select 
                - '0'
                - !GetAZs 
                  Ref: 'AWS::Region'
  
  PublicSubnetAZ1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetAZ1
      RouteTableId: !Ref PublicRouteTable
  
  PublicSubnetAZ2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      MapPublicIpOnLaunch: true
      CidrBlock: !FindInMap 
        - Network
        - VPC
        - PublicSubnetAZ2
      AvailabilityZone: !Select 
        - '1'
        - !GetAZs 
          Ref: 'AWS::Region'
      Tags:
        - Key: Name
          Value: !Join 
            - ''
            - - 'Public subnet '
              - !Select 
                - '1'
                - !GetAZs 
                  Ref: 'AWS::Region'
  
  PublicSubnetAZ2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetAZ2
      RouteTableId: !Ref PublicRouteTable
  
  PrivateRouteTableAZ1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Join 
            - ' '
            - - !Select 
                - '0'
                - !GetAZs 
                  Ref: 'AWS::Region'
              - Private Route Table
  
  PrivateRouteAZ1ToInternet:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableAZ1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGatewayAZ1
  
  PrivateSubnetAZ1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetAZ1
      RouteTableId: !Ref PrivateRouteTableAZ1
  
  PrivateSubnetAZ1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !FindInMap 
        - Network
        - VPC
        - PrivateSubnetAZ1
      AvailabilityZone: !Select 
        - '0'
        - !GetAZs 
          Ref: 'AWS::Region'
      Tags:
        - Key: Name
          Value: !Join 
            - ''
            - - 'Private subnet '
              - !Select 
                - '0'
                - !GetAZs 
                  Ref: 'AWS::Region'
  
  PrivateSubnetAZ2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !FindInMap 
        - Network
        - VPC
        - PrivateSubnetAZ2
      AvailabilityZone: !Select 
        - '1'
        - !GetAZs 
          Ref: 'AWS::Region'
      Tags:
        - Key: Name
          Value: !Join 
            - ''
            - - 'Private subnet '
              - !Select 
                - '1'
                - !GetAZs 
                  Ref: 'AWS::Region'
  
  PrivateRouteTableAZ2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Join 
            - ' '
            - - !Select 
                - '1'
                - !GetAZs 
                  Ref: 'AWS::Region'
              - Private Route Table
  
  PrivateRouteAZ2ToInternet:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableAZ2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGatewayAZ2
  
  PrivateSubnetAZ2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetAZ2
      RouteTableId: !Ref PrivateRouteTableAZ2
  
  PublicNetworkAcl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Application
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: VPC Network Acl
  
  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Bastion access on SSH port
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '22'
          ToPort: '22'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Join 
            - ' '
            - - !Ref SetupName
              - Bastion Security Group
  
  LocalDNS:
    Type: AWS::Route53::HostedZone
    Properties:
      HostedZoneConfig:
        Comment: !Join [' ', ['Local domain for', !Ref VPC]]
      Name: !Ref LocalDomainName
      VPCs:
        - VPCId: !Ref VPC
          VPCRegion: !Ref 'AWS::Region'
      HostedZoneTags:
        - Key: Name
          Value: !Join [' ', ['Local domain for', !Ref VPC]]

Outputs:
  Region:
    Value: !Ref 'AWS::Region'
  
  SetupName:
    Description: Setup Name
    Value: !Ref SetupName
    Export:
      Name: !Sub '${AWS::StackName}-SetupName'
  
  VpcId:
    Description: Name of the VPC
    Value: !Ref VPC
    Export:
      Name: !Sub '${AWS::StackName}-VpcId'
  
  VPC:
    Description: Name of the VPC
    Value: !Ref VPC
    Export:
      Name: !Sub '${AWS::StackName}-VPC'
  
  InstanceKeyName:
    Description: Name of the server key pair
    Value: !Ref InstanceKeyName
    Export:
      Name: !Sub '${AWS::StackName}-InstanceKeyName'
  
  BastionSecurityGroup:
    Description: Name of the Bastion Security Group
    Value: !Ref BastionSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-BastionSecurityGroup'
  
  PublicSubnetId1:
    Description: Name of the Public subnet for AZ1
    Value: !Ref PublicSubnetAZ1
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnetId1'
  
  PublicSubnetId2:
    Description: Name of the Public subnet for AZ2
    Value: !Ref PublicSubnetAZ2
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnetId2'
  
  PrivateSubnetId1:
    Description: Name of the Public subnet for AZ1
    Value: !Ref PrivateSubnetAZ1
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnetId1'
  
  PrivateSubnetId2:
    Description: Name of the Public subnet for AZ2
    Value: !Ref PrivateSubnetAZ2
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnetId2'
  
  #in this template internal and private subnets are same
  InternalSubnetId1:
    Description: Name of the Internal subnet for AZ1
    Value: !Ref PrivateSubnetAZ1
    Export:
      Name: !Sub '${AWS::StackName}-InternalSubnetId1'
  
  InternalSubnetId2:
    Description: Name of the Internal subnet for AZ2
    Value: !Ref PrivateSubnetAZ2
    Export:
      Name: !Sub '${AWS::StackName}-InternalSubnetId2'
  
  PublicSubnetAZ1:
    Description: Name of the Public subnet for AZ1
    Value: !Ref PublicSubnetAZ1
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnetAZ1'
  
  PublicSubnetAZ2:
    Description: Name of the Public subnet for AZ2
    Value: !Ref PublicSubnetAZ2
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnetAZ2'
  
  PrivateSubnetAZ1:
    Description: Name of the Private subnet for AZ1
    Value: !Ref PrivateSubnetAZ1
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnetAZ1'
  
  PrivateSubnetAZ2:
    Description: Name of the Private subnet for AZ2
    Value: !Ref PrivateSubnetAZ2
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnetAZ2'
  
  LocalHostedZoneId:
    Description: HostedZoneId of the local DNS
    Value: !Ref LocalDNS
    Export:
      Name: !Sub '${AWS::StackName}-LocalDNSHostedZoneId'
  
  LocalDomainName:
    Description: Local Domain Name
    Value: !Ref LocalDomainName
    Export:
      Name: !Sub '${AWS::StackName}-LocalDomainName'
  
  VpcCidrBlock:
    Description: VPC CIDR Block
    Value: !FindInMap 
      - Network
      - VPC
      - Cidr
    Export:
      Name: !Sub '${AWS::StackName}-VpcCidrBlock'
