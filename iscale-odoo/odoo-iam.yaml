    Description: Access Key Id for the bitbucket user
    Value: !Ref BitBucketAccessKey
  
  BitBucketUserAccessKeySecret:
    Description: Secret Key for the bitbucket user
    Value: !GetAtt [BitBucketAccessKey, SecretAccessKey]