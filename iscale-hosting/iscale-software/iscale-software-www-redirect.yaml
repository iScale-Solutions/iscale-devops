AWSTemplateFormatVersion: 2010-09-09
Description: iScale Software redirect to iScale Solutions website
Metadata: 

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
          - ClientDomainName
          - SSLCertificateArn
      - Label:
          default: Stack Configuration
        Parameters:
          - LoadBalancerStackName

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      ClientDomainName:
        default: Domain Name
      LoadBalancerStackName:
        default: Load Balancer Stack Name
      SSLCertificateArn:
        default: Domain SSL Certificate ARN

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    Default: www
    MaxLength: 32 # Max length for target group name is only 32 characters.
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  ClientDomainName:
    Description: The client's domain name (e.g. example.com, iscale-software.com)
    Type: String
    AllowedPattern: ^[a-z0-9]+([\-\.]{1}[a-z0-9]+)*\.[a-z]{2,7}$
    Default: iscale-software.com
    MinLength: 1
  LoadBalancerStackName:
    Description: The name of the load balancer stack.
    Type: String
    Default: HostingProductionELB
  SSLCertificateArn:
    Description: ARN of the ELB SSL Certificate
    Type: String
    Default: arn:aws:acm:us-west-2:178070162686:certificate/eef01775-8203-4029-8372-ed72ccbdedd8
    MinLength: 1

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml

Resources:

  DomaniListenerCertificate:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    Properties: 
      Certificates: 
        - CertificateArn: !Ref SSLCertificateArn
      ListenerArn: 
        Fn::ImportValue:
          !Sub "${LoadBalancerStackName}-SSLListener" 
  
  
  #HTTP already redirects to HTTPS, so the only redirection is www -> shop and domain.com -> shop.domain.com
  WWWRedirectToSolutionsListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: 443
            Host: www.iscale-solutions.com
            StatusCode: HTTP_301
      Conditions:
        - Field: host-header
          Values:
            - !Join ['.', [www, !Ref ClientDomainName]]
      ListenerArn:
        Fn::ImportValue:
          Fn::Sub: '${LoadBalancerStackName}-ApplicationListenerArn'
      Priority: 122

  NoWWWRedirectToSolutionsListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: 443
            Host: www.iscale-solutions.com
            StatusCode: HTTP_301
      Conditions:
        - Field: host-header
          Values:
            - !Ref ClientDomainName
      ListenerArn:
        Fn::ImportValue:
          Fn::Sub: '${LoadBalancerStackName}-ApplicationListenerArn'
      Priority: 123
