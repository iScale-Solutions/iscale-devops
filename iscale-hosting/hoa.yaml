  #           Version: '2012-10-17'
  #           Statement:
  #             - 
  #               Effect: Allow
  #               Action:
  #                 - ec2:DescribeImages
  #               Resource: "*"
  #             - 
  #               Effect: Allow
  #               Action: 
  #                 - logs:CreateLogStream
