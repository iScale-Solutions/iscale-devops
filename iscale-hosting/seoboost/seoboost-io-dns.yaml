  WordpressDomainRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: A
      TTL: 3600
      ResourceRecords:
        - 160.153.138.178

  WWWRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Join ['.',[www, !Ref DomainName]]
      Type: CNAME
      TTL: 3600
      ResourceRecords:
        - !Ref DomainName
