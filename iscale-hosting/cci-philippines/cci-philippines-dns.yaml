  EventsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Join ['.',[events, !Ref ClientDomainName]]
      ResourceRecords:
       - 94.23.218.225
      Type: A
      TTL: 14400
      Comment: Events

  AgendaRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Join ['.',[agenda, !Ref ClientDomainName]]
      ResourceRecords: 
        - ghs.google.com
      TTL: 14400
      Type: CNAME
      Comment: Agenda

  BlogRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Join ['.',[blog, !Ref ClientDomainName]]
      ResourceRecords: 
        - ghs.google.com
      TTL: 14400
      Type: CNAME
      Comment: Google Blog

  GoogleDocsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Join ['.',[docs, !Ref ClientDomainName]]
      ResourceRecords: 
        - ghs.google.com
      TTL: 14400
      Type: CNAME
      Comment: Google Docs
  
  GlueUpDKIMRecord1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Join ['.',[gumail10232,_domainkey, !Ref ClientDomainName]]
      ResourceRecords: 
        - gumail10232.ccifrance-philippines-aa9d4832258b48599.glueupmail.com
      TTL: 14400
      Type: CNAME
      Comment: GlueUp DKIM

  GlueUpDKIMRecord2:
