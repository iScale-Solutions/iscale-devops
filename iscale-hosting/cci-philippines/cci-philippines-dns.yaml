  GooglePopRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Join ['.',[pop, !Ref ClientDomainName]]
      ResourceRecords: 
        - ghs.google.com
      TTL: 14400
      Type: CNAME
      Comment: Google POP record

  GoogleSMTPRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Join ['.',[smtp, !Ref ClientDomainName]]
      ResourceRecords: 
        - ghs.google.com
      TTL: 14400
      Type: CNAME
      Comment: Google SMTP record

  WWWRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Join ['.',[www, !Ref ClientDomainName]]
      ResourceRecords:
      - 192.185.157.191
      TTL: 14400
      Type: A
      Comment: WWW record

  NoWWWRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref ClientDomainName
      ResourceRecords:
      - 192.185.157.191
      TTL: 14400
      Type: A
      Comment: Domain record

  FTPRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Join ['.',[ftp, !Ref ClientDomainName]]
      ResourceRecords: 
        - !Join ['.',[www, !Ref ClientDomainName]]
      TTL: 14400
      Type: CNAME
      Comment: FTP record

  CPanelRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Join ['.',[cpanel, !Ref ClientDomainName]]
      ResourceRecords: 
        - !Join ['.',[www, !Ref ClientDomainName]]
      TTL: 14400
      Type: CNAME
      Comment: FTP record

  GoogleMXRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref ClientDomainName
      ResourceRecords:
        - 1 ASPMX.L.GOOGLE.COM
        - 5 ALT1.ASPMX.L.GOOGLE.COM
        - 5 ALT2.ASPMX.L.GOOGLE.COM
        - 10 ALT3.ASPMX.L.GOOGLE.COM
        - 10 ALT4.ASPMX.L.GOOGLE.COM
      TTL: 14400
      Type: MX
      Comment: Google MX Records
  
  DomainTXTRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref ClientDomainName
      ResourceRecords: 
        - '"v=spf1 include:_spf.google.com ~all"'
        - '"google-site-verification=iZtvkra8-737baq9Q_YyEfgo9DRHhQi7qbkSjY8kqRA"'
        - '"v=DMARC1; p=none; rua=jerome@ccifrance-philippines.org"'
      TTL: 14400
      Type: TXT
      Comment: Domain TXT Record

