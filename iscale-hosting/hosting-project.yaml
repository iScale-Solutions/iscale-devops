AWSTemplateFormatVersion: '2010-09-09'
Description: ProjectTemplate - Creates a VPC, a public subnet, an IAM user with access key, and restricts permissions to the VPC and region as much as possible.

Parameters:
  ProjectName:
    Type: String
    Description: Name of the project (used for resource naming)
    MaxLength: 9
    MinLength: 1
  VPCCidr:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for the VPC (default /24 = 256 IPs)
  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.2.0/26
    Description: CIDR block for the first public subnet (default /26 = 64 IPs)
  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.2.64/26
    Description: CIDR block for the second public subnet (default /26 = 64 IPs)
  PrivateSubnet1Cidr:
    Type: String
    Default: 10.0.2.128/26
    Description: CIDR block for the first private subnet (default /26 = 64 IPs)
  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.2.192/26
    Description: CIDR block for the second private subnet (default /26 = 64 IPs)

Resources:
  ProjectIAMSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}-deploy-user-credentials"
      Description: IAM access key and secret for GitHub Actions/CoPilot
      SecretString: !Sub |
        {
          "AccessKeyId": "${ProjectAccessKey}",
          "SecretAccessKey": "${ProjectAccessKey.SecretAccessKey}"
        }

  ProjectVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VPCCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-vpc"

  ProjectPublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProjectVPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-subnet-1"

  ProjectPublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProjectVPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-subnet-2"

  ProjectPrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProjectVPC
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-private-subnet-1"

  ProjectPrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProjectVPC
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-private-subnet-2"

  ProjectInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-igw"
  
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref ProjectVPC
      InternetGatewayId: !Ref ProjectInternetGateway

  ProjectRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ProjectVPC
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-rtb"

  ProjectRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref ProjectRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref ProjectInternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProjectPublicSubnet1
      RouteTableId: !Ref ProjectRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProjectPublicSubnet2
      RouteTableId: !Ref ProjectRouteTable

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProjectPrivateSubnet1
      RouteTableId: !Ref ProjectRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProjectPrivateSubnet2
      RouteTableId: !Ref ProjectRouteTable

  ProjectIAMUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub "${ProjectName}-deploy-user"

  ProjectAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref ProjectIAMUser

  ProjectIAMPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${ProjectName}-deploy-policy"
      Users: [ !Ref ProjectIAMUser ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Allow CloudFormation actions in this region only
          - Effect: Allow
            Action: cloudformation:*
            Resource: "*"
            Condition:
              StringEquals:
                "aws:RequestedRegion": { "Ref": "AWS::Region" }
          # Allow IAM role policy management for project roles
          - Effect: Allow
            Action:
              - iam:*
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}*"
          # Allow EC2, ELB, RDS, Lambda, API Gateway, ECS, EFS, etc. in this region
          - Effect: Allow
            Action:
              - ec2:*
              - elasticloadbalancing:*
              - rds:*
              - lambda:*
              - apigateway:*
              - ecs:*
              - efs:*
              - logs:*
              - events:*
              - cloudwatch:*
              - elasticache:*
              - eks:*
              - kinesis:*
              - glue:*
              - athena:*
              - redshift:*
              - dms:*
              - mq:*
              - network-firewall:*
              - route53resolver:*
              - sagemaker:*
              - secretsmanager:*
              - servicediscovery:*
              - sns:*
              - sqs:*
              - stepfunctions:*
              - transfer:*
              - vpc-lattice:*
              - vpcendpoint:*
              - vpcaccess:*
              - xray:*
            Resource: "*"
            Condition:
              StringEquals:
                "aws:RequestedRegion": { "Ref": "AWS::Region" }
          # Deny EC2, ELB, RDS, Lambda, ECS, EFS outside the VPC
          - Effect: Deny
            Action:
              - ec2:*
              - elasticloadbalancing:*
              - rds:*
              - ecs:*
              - efs:*
              - elasticache:*
              - eks:*
              - mq:*
              - network-firewall:*
              - route53resolver:*
              - servicediscovery:*
              - vpc-lattice:*
              - vpcendpoint:*
              - vpcaccess:*
            Resource: "*"
            Condition:
              StringNotEquals:
                "ec2:Vpc": !Ref ProjectVPC
          # Allow IAM actions only for this user (for access key management)
          - Effect: Allow
            Action:
              - iam:GetUser
              - iam:ListAccessKeys
              - iam:CreateAccessKey
              - iam:DeleteAccessKey
            Resource: !GetAtt ProjectIAMUser.Arn
          # Allow S3 actions (optionally restrict to project-named buckets)
          - Effect: Allow
            Action: s3:*
            Resource: "*"

Outputs:

  VPCId:
    Description: VPC ID
    Value: !Ref ProjectVPC

  PublicSubnet1Id:
    Description: Public Subnet 1 ID
    Value: !Ref ProjectPublicSubnet1

  PublicSubnet2Id:
    Description: Public Subnet 2 ID
    Value: !Ref ProjectPublicSubnet2
  
  PrivateSubnet1Id:
    Description: Private Subnet 1 ID
    Value: !Ref ProjectPrivateSubnet1
  
  PrivateSubnet2Id:
    Description: Private Subnet 2 ID
    Value: !Ref ProjectPrivateSubnet2

  ProjectIAMUserName:
    Description: IAM deploy user name
    Value: !Ref ProjectIAMUser
  
  ProjectAccessKeyId:
    Description: IAM access key ID
    Value: !Ref ProjectAccessKey

  IAMSecretArn:
    Description: ARN of the IAM credentials secret
    Value: !Ref ProjectIAMSecret
