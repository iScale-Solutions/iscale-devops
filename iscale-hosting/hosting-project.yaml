AWSTemplateFormatVersion: 2010-09-09
Description: >
  Project bootstrap stack (VPC + 2 public subnets + 2 private subnets + Route53 zone +
  IAM permission boundary + Project deploy role + Project IAM user with access key).
  Uses Project-tag ABAC for service access and IAM permission boundaries for role creation.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterLabels:
      ProjectName:
        default: 'Project Name'
      DomainName:
        default: 'Domain Name'
      VpcCidr:
        default: 'VPC CIDR Block'
      ProjectTagKey:
        default: 'Project Tag Key'

Parameters:
  ProjectName:
    Type: String
    Description: Project short name (1-9 letters/numbers) used in resource names and tag values.
    AllowedPattern: '^[A-Za-z0-9]{1,9}$'
    ConstraintDescription: 'Must be 1-9 characters of letters/numbers only.'

  DomainName:
    Type: String
    Description: Domain name for this project hosted zone (e.g., example.com). Project access will be limited to this zone.
    AllowedPattern: '^(?=.{1,253}$)(?!-)[A-Za-z0-9-]{1,63}(?<!-)(\.(?!-)[A-Za-z0-9-]{1,63}(?<!-))*\.[A-Za-z]{2,63}$'
    ConstraintDescription: 'Must be a valid DNS domain, e.g., example.com'

  VpcCidr:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR for the project VPC (default 10.0.2.0/24). Will be split into 4 subnets (/26).
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/(1[6-9]|2[0-8])$'
    ConstraintDescription: 'Must be a valid IPv4 CIDR between /16 and /28.'

  ProjectTagKey:
    Type: String
    Default: Project
    Description: Tag key used for ABAC. (Template enforces 'Project' to keep IAM conditions consistent.)
    AllowedValues:
      - Project

Resources:
  # -----------------------------
  # Networking (project-specific)
  # 4 subnets total from /24 -> 4 x /26 (256 IPs spread over 4 subnets)
  # -----------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpc'
        - Key: !Ref ProjectTagKey
          Value: !Ref ProjectName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-igw'
        - Key: !Ref ProjectTagKey
          Value: !Ref ProjectName

  AttachIgw:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-rtb-public'
        - Key: !Ref ProjectTagKey
          Value: !Ref ProjectName

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachIgw
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # Private route table: NO default route (no NAT). Private subnets have no direct internet path.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-rtb-private'
        - Key: !Ref ProjectTagKey
          Value: !Ref ProjectName

  # Subnet CIDRs: 4 x /26 from the given VPC CIDR
  # Index 0-3. We'll assign:
  # 0 = public-a, 1 = public-b, 2 = private-a, 3 = private-b
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 6]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-subnet-public-a'
        - Key: !Ref ProjectTagKey
          Value: !Ref ProjectName

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 6]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-subnet-public-b'
        - Key: !Ref ProjectTagKey
          Value: !Ref ProjectName

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 6]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-subnet-private-a'
        - Key: !Ref ProjectTagKey
          Value: !Ref ProjectName

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 6]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-subnet-private-b'
        - Key: !Ref ProjectTagKey
          Value: !Ref ProjectName

  AssocPublicSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  AssocPublicSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  AssocPrivateSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  AssocPrivateSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # -----------------------------
  # Default S3 Bucket for Project
  # -----------------------------
  ProjectBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-bucket-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: !Ref ProjectTagKey
          Value: !Ref ProjectName

  # -----------------------------
  # S3 VPC Endpoint
  # -----------------------------
  S3VPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcId: !Ref Vpc
      RouteTableIds:
        - !Ref PublicRouteTable
        - !Ref PrivateRouteTable
      VpcEndpointType: Gateway
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: 's3:*'
            Resource: '*'
      Tags:
        - Key: !Ref ProjectTagKey
          Value: !Ref ProjectName

  # -----------------------------
  # IAM: Permission Boundary (clamp)
  # -----------------------------
  ProjectPermissionBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'PB-${ProjectName}'
      Description: !Sub 'Permission boundary for project ${ProjectName}.'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowReadOnlyDiscovery
            Effect: Allow
            Action:
              - "ec2:Describe*"
              - "eks:Describe*"
              - "eks:List*"
              - "ecs:Describe*"
              - "ecs:List*"
              - "ecr:Describe*"
              - "ecr:List*"
              - "iam:Get*"
              - "iam:List*"
              - "route53:List*"
              - "cloudfront:List*"
              - "acm:ListCertificates"
              - "kms:List*"
              - "kms:Describe*"
              - "s3:ListAllMyBuckets"
              - "backup:List*"
              - "backup:Get*"
              - "ssm:Get*"
              - "ssm:List*"
              - "cloudformation:Describe*"
              - "cloudformation:List*"
              - "cloudformation:Get*"
            Resource: "*"
          - Sid: AllowCreateUpdateProjectCloudFormationStacks
            Effect: Allow
            Action:
              - "cloudformation:CreateStack"
              - "cloudformation:UpdateStack"
              - "cloudformation:TagResource"
            Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/*/*"
            Condition:
              StringEquals:
                "aws:RequestTag/Project": !Ref ProjectName

          - Sid: IAMRoleOps
            Effect: Allow
            Action:
              - "iam:CreateRole"
              - "iam:DeleteRole"
              - "iam:UpdateRole"
              - "iam:AttachRolePolicy"
              - "iam:DetachRolePolicy"
              - "iam:PutRolePolicy"
              - "iam:DeleteRolePolicy"
              - "iam:PutRolePermissionsBoundary"
              - "iam:DeleteRolePermissionsBoundary"
              - "iam:TagRole"
              - "iam:UntagRole"
              - "iam:PassRole"
            Resource: "arn:aws:iam::*:role/*"

          - Sid: DenyIAMPolicyEscalation
            Effect: Deny
            Action:
              - "iam:CreatePolicyVersion"
              - "iam:SetDefaultPolicyVersion"
              - "iam:DeletePolicyVersion"
              - "iam:PutUserPolicy"
              - "iam:PutGroupPolicy"
              - "iam:AttachUserPolicy"
              - "iam:AttachGroupPolicy"
              - "iam:CreateAccessKey"
              - "iam:UpdateAssumeRolePolicy"
            Resource: "*"

  # -----------------------------
  # IAM: Project deploy role (for CloudFormation)
  # -----------------------------
  ProjectDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "Project-${ProjectName}-DeployRole"
      Description: !Sub "Project deploy role for ${ProjectName}. Use with CloudFormation. ABAC by Project tag."
      PermissionsBoundary: !Ref ProjectPermissionBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Adjust this to your CI/SSO principal(s). Root here is a placeholder.
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "sts:AssumeRole"
      Tags:
        - Key: !Ref ProjectTagKey
          Value: !Ref ProjectName
      Policies:
        - PolicyName: !Sub "Project-${ProjectName}-Permissions"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EC2FullControlInsideProjectVpc
                Effect: Allow
                Action: "ec2:*"
                Resource: "*"
                Condition:
                  StringEquals:
                    "ec2:Vpc": !Ref Vpc

              - Sid: ELBFullControl
                Effect: Allow
                Action: "elasticloadbalancing:*"
                Resource: "*"

              - Sid: ECRProjectOnly
                Effect: Allow
                Action: "ecr:*"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/Project": !Ref ProjectName

              - Sid: ECRCreateMustTag
                Effect: Allow
                Action:
                  - "ecr:CreateRepository"
                  - "ecr:TagResource"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:RequestTag/Project": !Ref ProjectName

              - Sid: ECSProjectOnly
                Effect: Allow
                Action: "ecs:*"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/Project": !Ref ProjectName

              - Sid: ECSCreateMustTag
                Effect: Allow
                Action:
                  - "ecs:CreateCluster"
                  - "ecs:TagResource"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:RequestTag/Project": !Ref ProjectName

              - Sid: EKSProjectOnly
                Effect: Allow
                Action: "eks:*"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/Project": !Ref ProjectName

              - Sid: EKSCreateMustTag
                Effect: Allow
                Action:
                  - "eks:CreateCluster"
                  - "eks:CreateNodegroup"
                  - "eks:TagResource"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:RequestTag/Project": !Ref ProjectName

              - Sid: LambdaProjectOnly
                Effect: Allow
                Action: "lambda:*"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/Project": !Ref ProjectName

              - Sid: LambdaCreateMustTag
                Effect: Allow
                Action:
                  - "lambda:CreateFunction"
                  - "lambda:TagResource"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:RequestTag/Project": !Ref ProjectName

              - Sid: DataServicesProjectOnly
                Effect: Allow
                Action:
                  - "rds:*"
                  - "dynamodb:*"
                  - "redshift:*"
                  - "elasticache:*"
                  - "docdb:*"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/Project": !Ref ProjectName

              - Sid: SSMProjectOnly
                Effect: Allow
                Action: "ssm:*"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/Project": !Ref ProjectName

              - Sid: SecretsProjectOnly
                Effect: Allow
                Action: "secretsmanager:*"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/Project": !Ref ProjectName

              - Sid: KMSProjectOnly
                Effect: Allow
                Action: "kms:*"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/Project": !Ref ProjectName

              - Sid: KMSCreateMustTag
                Effect: Allow
                Action:
                  - "kms:CreateKey"
                  - "kms:TagResource"
                  - "kms:UntagResource"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:RequestTag/Project": !Ref ProjectName

              - Sid: S3CreateBucketAndList
                Effect: Allow
                Action:
                  - "s3:CreateBucket"
                  - "s3:ListAllMyBuckets"
                Resource: "*"

              - Sid: S3TagBucketToClaimProject
                Effect: Allow
                Action:
                  - "s3:PutBucketTagging"
                  - "s3:GetBucketTagging"
                Resource: "arn:aws:s3:::*"
                Condition:
                  StringEquals:
                    "aws:RequestTag/Project": !Ref ProjectName
                  ForAllValues:StringEquals:
                    "aws:TagKeys":
                      - "Project"

              - Sid: S3FullControlOnlyOnProjectTaggedBuckets
                Effect: Allow
                Action: "s3:*"
                Resource:
                  - "arn:aws:s3:::*"
                  - "arn:aws:s3:::*/*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/Project": !Ref ProjectName

              - Sid: DenyS3TaggingIfProjectTagDoesNotMatch
                Effect: Deny
                Action: "s3:PutBucketTagging"
                Resource: "arn:aws:s3:::*"
                Condition:
                  StringNotEquals:
                    "aws:RequestTag/Project": !Ref ProjectName

              - Sid: BackupProjectOnly
                Effect: Allow
                Action: "backup:*"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/Project": !Ref ProjectName

              - Sid: BackupCreateMustTag
                Effect: Allow
                Action:
                  - "backup:CreateBackupVault"
                  - "backup:CreateBackupPlan"
                  - "backup:CreateBackupSelection"
                  - "backup:TagResource"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:RequestTag/Project": !Ref ProjectName

              - Sid: Route53FullControlOnProjectZoneOnly
                Effect: Allow
                Action: "route53:*"
                Resource:
                  - !Sub "arn:aws:route53:::hostedzone/${DomainName}"
                  - "arn:aws:route53:::change/*"
                  - "arn:aws:route53:::healthcheck/*"

              - Sid: ACMRequestOnlyForDomain
                Effect: Allow
                Action:
                  - "acm:RequestCertificate"
                  - "acm:AddTagsToCertificate"
                  - "acm:RemoveTagsFromCertificate"
                  - "acm:DeleteCertificate"
                  - "acm:DescribeCertificate"
                  - "acm:GetCertificate"
                Resource: "*"
                Condition:
                  StringLike:
                    "acm:RequestedDomainName":
                      - !Ref DomainName
                      - !Sub "*.${DomainName}"

              - Sid: ACMManageOnlyForDomain
                Effect: Allow
                Action: "acm:*"
                Resource: "*"
                Condition:
                  StringLike:
                    "acm:DomainName":
                      - !Ref DomainName
                      - !Sub "*.${DomainName}"

              - Sid: CloudFrontListAll
                Effect: Allow
                Action:
                  - "cloudfront:List*"
                  - "cloudfront:Get*"
                Resource: "*"

              - Sid: CloudFrontCreateMustTag
                Effect: Allow
                Action:
                  - "cloudfront:CreateDistribution"
                  - "cloudfront:CreateDistributionWithTags"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:RequestTag/Project": !Ref ProjectName

              - Sid: CloudFrontWriteOnlyOnProjectTagged
                Effect: Allow
                Action:
                  - "cloudfront:UpdateDistribution"
                  - "cloudfront:DeleteDistribution"
                  - "cloudfront:TagResource"
                  - "cloudfront:UntagResource"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/Project": !Ref ProjectName

              - Sid: MessagingAndIntegrationProjectOnly
                Effect: Allow
                Action:
                  - "sqs:*"
                  - "sns:*"
                  - "events:*"
                  - "appsync:*"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/Project": !Ref ProjectName

              - Sid: MessagingAndIntegrationCreateMustTag
                Effect: Allow
                Action:
                  - "sqs:CreateQueue"
                  - "sns:CreateTopic"
                  - "events:CreateRule"
                  - "appsync:CreateGraphqlApi"
                  - "appsync:TagResource"
                  - "events:TagResource"
                  - "sns:TagResource"
                  - "sqs:TagQueue"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:RequestTag/Project": !Ref ProjectName

              - Sid: AllowCreateRoleOnlyWithBoundaryAndProjectTag
                Effect: Allow
                Action:
                  - "iam:CreateRole"
                  - "iam:TagRole"
                  - "iam:UntagRole"
                  - "iam:PutRolePermissionsBoundary"
                Resource: "arn:aws:iam::*:role/*"
                Condition:
                  StringEquals:
                    "aws:RequestTag/Project": !Ref ProjectName
                    "iam:PermissionsBoundary": !Ref ProjectPermissionBoundary

              - Sid: AllowPolicyAttachmentOnlyWhenRoleIsProjectTagged
                Effect: Allow
                Action:
                  - "iam:AttachRolePolicy"
                  - "iam:DetachRolePolicy"
                  - "iam:PutRolePolicy"
                  - "iam:DeleteRolePolicy"
                Resource: "arn:aws:iam::*:role/*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/Project": !Ref ProjectName
                    "iam:PermissionsBoundary": !Ref ProjectPermissionBoundary

              - Sid: AllowPassRoleOnlyForProjectTaggedRolesWithBoundary
                Effect: Allow
                Action: "iam:PassRole"
                Resource: "arn:aws:iam::*:role/*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/Project": !Ref ProjectName
                    "iam:PermissionsBoundary": !Ref ProjectPermissionBoundary

              - Sid: DenyRemovingOrChangingPermissionsBoundary
                Effect: Deny
                Action:
                  - "iam:DeleteRolePermissionsBoundary"
                  - "iam:PutRolePermissionsBoundary"
                Resource: "arn:aws:iam::*:role/*"
                Condition:
                  StringNotEquals:
                    "iam:PermissionsBoundary": !Ref ProjectPermissionBoundary

  # -----------------------------
  # IAM: Project User + Access Key
  # SecretAccessKey stored in Secrets Manager (output Secret ARN).
  # -----------------------------
  ProjectUserPolicy1:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'Project-${ProjectName}-UserPolicy1'
      Description: !Sub 'Project user permissions (part 1) for ${ProjectName}.'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          # EC2, ELB, ECR, ECS, EKS, Lambda, DataServices, SSM, Secrets, KMS, S3 (basic)
          - Sid: EC2FullControlInsideProjectVpc
            Effect: Allow
            Action: 'ec2:*'
            Resource: '*'
            Condition:
              StringEquals:
                'ec2:Vpc': !Ref Vpc
          - Sid: ELBFullControl
            Effect: Allow
            Action: 'elasticloadbalancing:*'
            Resource: '*'
          - Sid: ECRProjectOnly
            Effect: Allow
            Action: 'ecr:*'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:ResourceTag/Project': !Ref ProjectName
          - Sid: ECRCreateMustTag
            Effect: Allow
            Action:
              - 'ecr:CreateRepository'
              - 'ecr:TagResource'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:RequestTag/Project': !Ref ProjectName
          - Sid: ECSProjectOnly
            Effect: Allow
            Action: 'ecs:*'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:ResourceTag/Project': !Ref ProjectName
          - Sid: ECSCreateMustTag
            Effect: Allow
            Action:
              - 'ecs:CreateCluster'
              - 'ecs:TagResource'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:RequestTag/Project': !Ref ProjectName
          - Sid: EKSProjectOnly
            Effect: Allow
            Action: 'eks:*'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:ResourceTag/Project': !Ref ProjectName
          - Sid: EKSCreateMustTag
            Effect: Allow
            Action:
              - 'eks:CreateCluster'
              - 'eks:CreateNodegroup'
              - 'eks:TagResource'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:RequestTag/Project': !Ref ProjectName
          - Sid: LambdaProjectOnly
            Effect: Allow
            Action: 'lambda:*'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:ResourceTag/Project': !Ref ProjectName
          - Sid: LambdaCreateMustTag
            Effect: Allow
            Action:
              - 'lambda:CreateFunction'
              - 'lambda:TagResource'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:RequestTag/Project': !Ref ProjectName
          - Sid: DataServicesProjectOnly
            Effect: Allow
            Action:
              - 'rds:*'
              - 'dynamodb:*'
              - 'redshift:*'
              - 'elasticache:*'
              - 'docdb:*'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:ResourceTag/Project': !Ref ProjectName
          - Sid: SSMProjectOnly
            Effect: Allow
            Action: 'ssm:*'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:ResourceTag/Project': !Ref ProjectName
          - Sid: SecretsProjectOnly
            Effect: Allow
            Action: 'secretsmanager:*'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:ResourceTag/Project': !Ref ProjectName
          - Sid: KMSProjectOnly
            Effect: Allow
            Action: 'kms:*'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:ResourceTag/Project': !Ref ProjectName
          - Sid: KMSCreateMustTag
            Effect: Allow
            Action:
              - 'kms:CreateKey'
              - 'kms:TagResource'
              - 'kms:UntagResource'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:RequestTag/Project': !Ref ProjectName
          - Sid: S3CreateBucketAndList
            Effect: Allow
            Action:
              - 's3:CreateBucket'
              - 's3:ListAllMyBuckets'
            Resource: '*'

  ProjectUserPolicy2:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'Project-${ProjectName}-UserPolicy2'
      Description: !Sub 'Project user permissions (part 2) for ${ProjectName}.'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          # S3 (tagging/full), Backup, Route53, ACM, CloudFront, Messaging, IAM
          - Sid: S3TagBucketToClaimProject
            Effect: Allow
            Action:
              - 's3:PutBucketTagging'
              - 's3:GetBucketTagging'
            Resource: 'arn:aws:s3:::*'
            Condition:
              StringEquals:
                'aws:RequestTag/Project': !Ref ProjectName
              ForAllValues:StringEquals:
                'aws:TagKeys':
                  - Project
          - Sid: S3FullControlOnlyOnProjectTaggedBuckets
            Effect: Allow
            Action: 's3:*'
            Resource:
              - 'arn:aws:s3:::*'
              - 'arn:aws:s3:::*/*'
            Condition:
              StringEquals:
                'aws:ResourceTag/Project': !Ref ProjectName
          - Sid: DenyS3TaggingIfProjectTagDoesNotMatch
            Effect: Deny
            Action: 's3:PutBucketTagging'
            Resource: 'arn:aws:s3:::*'
            Condition:
              StringNotEquals:
                'aws:RequestTag/Project': !Ref ProjectName
          - Sid: BackupProjectOnly
            Effect: Allow
            Action: 'backup:*'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:ResourceTag/Project': !Ref ProjectName
          - Sid: BackupCreateMustTag
            Effect: Allow
            Action:
              - 'backup:CreateBackupVault'
              - 'backup:CreateBackupPlan'
              - 'backup:CreateBackupSelection'
              - 'backup:TagResource'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:RequestTag/Project': !Ref ProjectName
          - Sid: Route53FullControlOnDomainHostedZone
            Effect: Allow
            Action: 'route53:*'
            Resource:
              - !Sub 'arn:aws:route53:::hostedzone/${DomainName}'
              - 'arn:aws:route53:::change/*'
              - 'arn:aws:route53:::healthcheck/*'
          - Sid: ACMRequestOnlyForDomain
            Effect: Allow
            Action:
              - 'acm:RequestCertificate'
              - 'acm:AddTagsToCertificate'
              - 'acm:RemoveTagsFromCertificate'
              - 'acm:DeleteCertificate'
              - 'acm:DescribeCertificate'
              - 'acm:GetCertificate'
            Resource: '*'
            Condition:
              StringLike:
                'acm:RequestedDomainName':
                  - !Ref DomainName
                  - !Sub '*.${DomainName}'
          - Sid: ACMManageOnlyForDomain
            Effect: Allow
            Action: 'acm:*'
            Resource: '*'
            Condition:
              StringLike:
                'acm:DomainName':
                  - !Ref DomainName
                  - !Sub '*.${DomainName}'
          - Sid: CloudFrontListAll
            Effect: Allow
            Action:
              - 'cloudfront:List*'
              - 'cloudfront:Get*'
            Resource: '*'
          - Sid: CloudFrontCreateMustTag
            Effect: Allow
            Action:
              - 'cloudfront:CreateDistribution'
              - 'cloudfront:CreateDistributionWithTags'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:RequestTag/Project': !Ref ProjectName
          - Sid: CloudFrontWriteOnlyOnProjectTagged
            Effect: Allow
            Action:
              - 'cloudfront:UpdateDistribution'
              - 'cloudfront:DeleteDistribution'
              - 'cloudfront:TagResource'
              - 'cloudfront:UntagResource'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:ResourceTag/Project': !Ref ProjectName
          - Sid: MessagingAndIntegrationProjectOnly
            Effect: Allow
            Action:
              - 'sqs:*'
              - 'sns:*'
              - 'events:*'
              - 'appsync:*'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:ResourceTag/Project': !Ref ProjectName
          - Sid: MessagingAndIntegrationCreateMustTag
            Effect: Allow
            Action:
              - 'sqs:CreateQueue'
              - 'sns:CreateTopic'
              - 'events:CreateRule'
              - 'appsync:CreateGraphqlApi'
              - 'appsync:TagResource'
              - 'events:TagResource'
              - 'sns:TagResource'
              - 'sqs:TagQueue'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:RequestTag/Project': !Ref ProjectName
          - Sid: AllowCreateRoleOnlyWithBoundaryAndProjectTag
            Effect: Allow
            Action:
              - 'iam:CreateRole'
              - 'iam:TagRole'
              - 'iam:UntagRole'
              - 'iam:PutRolePermissionsBoundary'
            Resource: 'arn:aws:iam::*:role/*'
            Condition:
              StringEquals:
                'aws:RequestTag/Project': !Ref ProjectName
                'iam:PermissionsBoundary': !Ref ProjectPermissionBoundary
          - Sid: AllowPolicyAttachmentOnlyWhenRoleIsProjectTagged
            Effect: Allow
            Action:
              - 'iam:AttachRolePolicy'
              - 'iam:DetachRolePolicy'
              - 'iam:PutRolePolicy'
              - 'iam:DeleteRolePolicy'
            Resource: 'arn:aws:iam::*:role/*'
            Condition:
              StringEquals:
                'aws:ResourceTag/Project': !Ref ProjectName
                'iam:PermissionsBoundary': !Ref ProjectPermissionBoundary
          - Sid: AllowPassRoleOnlyForProjectTaggedRolesWithBoundary
            Effect: Allow
            Action: 'iam:PassRole'
            Resource: 'arn:aws:iam::*:role/*'
            Condition:
              StringEquals:
                'aws:ResourceTag/Project': !Ref ProjectName
                'iam:PermissionsBoundary': !Ref ProjectPermissionBoundary
          - Sid: DenyRemovingOrChangingPermissionsBoundary
            Effect: Deny
            Action:
              - 'iam:DeleteRolePermissionsBoundary'
              - 'iam:PutRolePermissionsBoundary'
            Resource: 'arn:aws:iam::*:role/*'
            Condition:
              StringNotEquals:
                'iam:PermissionsBoundary': !Ref ProjectPermissionBoundary

  ProjectUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub "project-${ProjectName}-user"
      PermissionsBoundary: !Ref ProjectPermissionBoundary
      Tags:
        - Key: !Ref ProjectTagKey
          Value: !Ref ProjectName
      ManagedPolicyArns:
        - !Ref ProjectUserPolicy1
        - !Ref ProjectUserPolicy2

  ProjectUserAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref ProjectUser
      Status: Active

  ProjectUserAccessKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "project/${ProjectName}/iam-access-key"
      Description: !Sub "Access key secret for project user project-${ProjectName}-user"
      Tags:
        - Key: !Ref ProjectTagKey
          Value: !Ref ProjectName
      SecretString: !Sub
        - |
          {
            "AccessKeyId": "${AKID}",
            "SecretAccessKey": "${SAK}"
          }
        - AKID: !Ref ProjectUserAccessKey
          SAK: !GetAtt ProjectUserAccessKey.SecretAccessKey

Outputs:
  ProjectName:
    Value: !Ref ProjectName
    Export:
      Name: !Sub "${AWS::StackName}-ProjectName"

  ProjectBucketName:
    Description: Name of the default S3 bucket for the project.
    Value: !Ref ProjectBucket

  ProjectTagKey:
    Value: !Ref ProjectTagKey
    Export:
      Name: !Sub "${AWS::StackName}-ProjectTagKey"

  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"

  PublicSubnetAId:
    Value: !Ref PublicSubnetA
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetAId"

  PublicSubnetBId:
    Value: !Ref PublicSubnetB
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetBId"

  PrivateSubnetAId:
    Value: !Ref PrivateSubnetA
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetAId"

  PrivateSubnetBId:
    Value: !Ref PrivateSubnetB
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetBId"

  ProjectUserAccessKeyId:
    Description: AccessKeyId for the project user (safe to output).
    Value: !Ref ProjectUserAccessKey

  ProjectUserSecretArn:
    Description: ARN of the Secrets Manager secret containing AccessKeyId + SecretAccessKey.
    Value: !Ref ProjectUserAccessKeySecret