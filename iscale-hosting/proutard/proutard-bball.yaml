AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Bouncy Balls — serverless static hosting for the React/JSX game.
  S3 (private) + CloudFront (CDN) + Route 53 (DNS).
  Serves both proutard.com and www.proutard.com.
  NOTE: Deploy the certificate stack in us-east-1 first, then pass that
  certificate ARN into this hosting stack.

Parameters:
  DomainName:
    Type: String
    Default: proutard.com
    Description: The domain the game will be served from (apex; www is added automatically)

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z08418783KKQEE1YH1AKP
    Description: >
      The Route 53 hosted zone ID for DomainName. Used for alias records that
      point the domain to CloudFront.

  CertificateArn:
    Type: String
    Description: >
      ACM certificate ARN for DomainName and www.DomainName. For CloudFront,
      this certificate must be created in us-east-1. Deploy
      proutard-bball-cert.yaml there first and pass its CertificateArn output.
    AllowedPattern: "^arn:aws(-[a-z]+)?:acm:us-east-1:[0-9]{12}:certificate/[a-f0-9-]+$"
    ConstraintDescription: Must be an ACM certificate ARN from us-east-1.

  AppPath:
    Type: String
    Default: bouncy-balls
    AllowedPattern: "^[a-z0-9][a-z0-9-]*$"
    ConstraintDescription: Lowercase letters, numbers and hyphens only, no slashes.
    Description: >
      Folder the game is served from. Default 'bouncy-balls' means the game
      lives at https://proutard.com/bouncy-balls/ and the site root redirects
      there. This value MUST match Vite's `base` config and the S3 upload prefix.

Resources:

  # ----- S3 bucket that stores the built static files (private) -----
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      # No BucketName -> CloudFormation generates a globally-unique name.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ----- Bucket policy: only CloudFront (via OAC) may read objects -----
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # ----- CloudFront Function: URI rewriting at the edge (viewer-request) -----
  # Needed because DefaultRootObject only applies to "/", NOT to subfolders.
  # Without this, https://proutard.com/bouncy-balls/ would not serve index.html.
  RewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect root to the app folder; append index.html to directory requests.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          // Send the bare domain to the game folder.
          if (uri === '/' || uri === '') {
            return {
              statusCode: 302,
              statusDescription: 'Found',
              headers: { 'location': { value: '/${AppPath}/' } }
            };
          }

          // /bouncy-balls -> /bouncy-balls/  (keeps relative links honest)
          if (uri === '/${AppPath}') {
            return {
              statusCode: 302,
              statusDescription: 'Found',
              headers: { 'location': { value: '/${AppPath}/' } }
            };
          }

          // Directory request -> serve its index.html
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          }

          return request;
        }

  # ----- Origin Access Control (modern replacement for OAI) -----
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ----- CloudFront distribution (the CDN) -----
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Bouncy Balls CDN — ${DomainName}"
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        # No DefaultRootObject: the RewriteFunction redirects "/" to /${AppPath}/
        PriceClass: PriceClass_100   # US/Canada/Europe. Use PriceClass_All for worldwide edge coverage.
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          # Managed cache policy "CachingOptimized"
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RewriteFunction.FunctionMetadata.FunctionARN
        # SPA fallback: serve the game's index.html for client-side routes
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: !Sub "/${AppPath}/index.html"
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: !Sub "/${AppPath}/index.html"
            ErrorCachingMinTTL: 10
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  # ----- DNS: point both apex and www at CloudFront (A + AAAA aliases) -----
  DNSRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt CloudFrontDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2   # Fixed hosted-zone ID for all CloudFront distributions
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt CloudFrontDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Sub "www.${DomainName}"
          Type: A
          AliasTarget:
            DNSName: !GetAtt CloudFrontDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Sub "www.${DomainName}"
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt CloudFrontDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  BucketName:
    Description: S3 bucket to upload your built files to
    Value: !Ref WebsiteBucket
  UploadTarget:
    Description: Sync your Vite dist/ folder to exactly this path (note the prefix)
    Value: !Sub "s3://${WebsiteBucket}/${AppPath}/"
  DistributionId:
    Description: CloudFront distribution ID (used for cache invalidation)
    Value: !Ref CloudFrontDistribution
  CloudFrontDomain:
    Description: CloudFront domain name
    Value: !GetAtt CloudFrontDistribution.DomainName
  SiteURL:
    Description: Your live game
    Value: !Sub "https://${DomainName}/${AppPath}/"
  ViteBaseConfig:
    Description: Set this as `base` in vite.config.js or assets will 404
    Value: !Sub "/${AppPath}/"
