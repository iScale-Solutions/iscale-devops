AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Balls Battle CloudFront certificate. Deploy this stack in us-east-1 because
  CloudFront requires ACM viewer certificates to live in us-east-1.

Parameters:
  DomainName:
    Type: String
    Default: proutard.com
    Description: The apex domain for the game certificate; www is added automatically.

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z08418783KKQEE1YH1AKP
    Description: >
      The Route 53 hosted zone ID for DomainName. Must be in the same AWS
      account as this stack, or automatic DNS validation cannot work.

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub "www.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub "www.${DomainName}"
          HostedZoneId: !Ref HostedZoneId

Outputs:
  CertificateArn:
    Description: Pass this ARN to the Balls-Battle deployment in the app repository.
    Value: !Ref Certificate
    Export:
      Name: !Sub "${AWS::StackName}-CertificateArn"
