  HostingSSLValidationRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Join ['.',[_eabbe25b2525f0ce66ea1874902d0879, !Ref DomainName]]
      Type: CNAME
      TTL: 14400
      ResourceRecords:
        - _fe18829dca90638972f6a257efa377b7.jddtvkljgg.acm-validations.aws.

  TXTDomainRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      ResourceRecords:
        - '"google-site-verification=OdF-h6LEnsEgKT6xsL6ibneXUIlrFGRVIfO9NcUKg3U"'
        - '"v=spf1 include:_spf.google.com -all"'
      TTL: 14400
      Comment: Domain TXT record
      Type: TXT