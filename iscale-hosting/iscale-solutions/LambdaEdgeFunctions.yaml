AWSTemplateFormatVersion: 2010-09-09
Description: This cloudformation template provisions resources for iScale Solutions

Resources:
  CloudFrontLambdaEdgeRole:
    Type: "AWS::IAM::Role"
    Properties:
     AssumeRolePolicyDocument:
       Version: 2012-10-17
       Statement:
         -
          Effect: "Allow"
          Principal:
            Service:
              - "lambda.amazonaws.com"
              - "edgelambda.amazonaws.com"
          Action:
            - "sts:AssumeRole"
     ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  
  LambdaDefaultIndexFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs12.x
      Role: !GetAtt [CloudFrontLambdaEdgeRole, Arn]
      Handler: index.handler
      Code:
        ZipFile: |
         'use strict';
         exports.handler = (event, context, callback) => {
            var request = event.Records[0].cf.request;

            // Extract the URI from the request
            var olduri = request.uri;

            // Match any '/' that occurs at the end of a URI. Replace it with a default index
            var newuri = olduri.replace(/\/$/, '\/index.html');
    
            // Replace the received URI with the URI that includes the index page
            request.uri = newuri;
    
            // Return to CloudFront
            return callback(null, request);
         }  
      Description: Tweaks the URL to call index.html when entering a directory
 
  LambdaDefaultIndexVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref LambdaDefaultIndexFunction
      Description: v1

  LambdaStaticSiteCachingFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs12.x
      Role: !GetAtt [CloudFrontLambdaEdgeRole, Arn]
      Handler: index.handler
      Code:
        ZipFile: |
          exports.handler = async (event, context) => {
            const response = event.Records[0].cf.response;
            const headers = response.headers;
            const headerNameSrc = 'X-Amz-Meta-Last-Modified';
            const headerNameDst = 'Last-Modified';
  
            if (headers[headerNameSrc.toLowerCase()]) {
              headers[headerNameDst.toLowerCase()] = [{
                key: headerNameDst,
                value: headers[headerNameSrc.toLowerCase()][0].value,
              }];
            }
    
            //Security headers
            headers['strict-transport-security'] = [{key: 'Strict-Transport-Security', value: 'max-age=63072000; includeSubdomains; preload'}]; 
            headers['content-security-policy'] = [{key: 'Content-Security-Policy', value: "font-src 'self' data: https://fonts.gstatic.com https://cdn1.pegasaas.io https://fonts.googleapis.com https://www.cognitoforms.com https://s0.wp.com;"}]; 
            headers['x-content-type-options'] = [{key: 'X-Content-Type-Options', value: 'nosniff'}]; 
            headers['x-frame-options'] = [{key: 'X-Frame-Options', value: 'DENY'}]; 
            headers['x-xss-protection'] = [{key: 'X-XSS-Protection', value: '1; mode=block'}]; 
            headers['referrer-policy'] = [{key: 'Referrer-Policy', value: 'same-origin'}]; 

            //add some cache control for 24 hours
            headers['cache-control'] = [{key: 'Cache-Control', value: 'max-age=86400'}]; 
            return response;
          };
      Description: Adds security and caching headers for static site

  LambdaStaticSiteCachingFunctionVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref LambdaStaticSiteCachingFunction
      Description: v1

Outputs:
  DefaultIndexLambda:
    Description: Lambda Edge function for default index.html
    Value: !Ref LambdaDefaultIndexVersion
  StaticSiteCachingLambda:
    Description: Lambda Edge function for security and caching
    Value: !Ref LambdaStaticSiteCachingFunctionVersion

