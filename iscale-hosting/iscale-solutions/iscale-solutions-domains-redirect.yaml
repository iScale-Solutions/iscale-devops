AWSTemplateFormatVersion: 2010-09-09
Description: Domain redirects to iscale-solutions.com This MUST be run in us-east-1 for SSL

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      DomainName:
        default: Domain Name

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 9
    Default: redirects
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  DomainName:
    Description: The domain name to be redirected to
    Type: String
    Default: iscale-solutions.com

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
      
Resources:

  ## iscalesolutions.com ##
  iScaleSolutionsDotComHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: iscalesolutions.com
      HostedZoneConfig:
        Comment: !Join [' ', ['Redirects to', !Ref DomainName]]

  iScaleSolutionsDotComSSLCert:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: iscalesolutions.com
      SubjectAlternativeNames:
        - www.iscalesolutions.com
      ValidationMethod: DNS

  iScaleSolutionsDotComSSLValidationRecord1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref iScaleSolutionsDotComHostedZone
      Name: _9c0ce09ee688c0d752b0a0dcf9c44f69.iscalesolutions.com
      Type: CNAME
      TTL: 14400
      ResourceRecords:
        - _e9f5e17c6596bf1bca68e7b6b3ba818d.xlfgrmvvlj.acm-validations.aws.

