AWSTemplateFormatVersion: 2010-09-09
Description: This cloudformation template provisions resources for iScale Solutions

Resources:
  CloudFrontLambdaEdgeRole:
    Type: "AWS::IAM::Role"
    Properties:
     AssumeRolePolicyDocument:
       Version: 2012-10-17
       Statement:
         -
          Effect: "Allow"
          Principal:
            Service:
              - "lambda.amazonaws.com"
              - "edgelambda.amazonaws.com"
          Action:
            - "sts:AssumeRole"
     ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  
  LambdaDefaultIndexFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs12.x
      Role: !GetAtt [CloudFrontLambdaEdgeRole, Arn]
      Handler: index.handler
      Code:
        ZipFile: |
         'use strict';
         exports.handler = (event, context, callback) => {
            var request = event.Records[0].cf.request;

            // Extract the URI from the request
            var olduri = request.uri;

            // Match any '/' that occurs at the end of a URI. Replace it with a default index
            var newuri = olduri.replace(/\/$/, '\/index.html');
    
            // Replace the received URI with the URI that includes the index page
            request.uri = newuri;
    
            // Return to CloudFront
            return callback(null, request);
         }  
      Description: Tweaks the URL to call index.html when entering a directory
      TracingConfig:
        Mode: Active
 
  LambdaVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref LambdaDefaultIndexFunction
      Description: v1

