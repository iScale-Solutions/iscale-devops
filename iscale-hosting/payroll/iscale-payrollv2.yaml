          DB_INSTANCE_IDENTIFIER: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], payroll]]
      Code:
        ZipFile: |

          import boto3
          import logging
          import os

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          asg = boto3.client('autoscaling')

          def get_auto_scaling_group_name(region,key,value):
            names=[]
            client = boto3.client('autoscaling', region_name=region)
            paginator = client.get_paginator('describe_auto_scaling_groups')
            page_iterator = paginator.paginate()
            
            filter='AutoScalingGroups[] | [?contains(Tags[?Key==`{}`].Value, `{}`)]'
            asgs = page_iterator.search(filter.format(key, value))
            
            for asg in asgs:
              names.append(asg["AutoScalingGroupName"])

            return names[0]

          def get_instance_ids(AutoScalingGroupName):
            instance_ids=[]
            instances = asg.describe_auto_scaling_groups(AutoScalingGroupNames=[AutoScalingGroupName])['AutoScalingGroups'][0]['Instances']
            for inst in instances:
              instance_ids.append(inst['InstanceId'])

            return instance_ids
              
          def lambda_handler(event, context):
            region=os.environ['REGION']
            key=os.environ['KEY']
            value=os.environ['VALUE']
            dbInstanceIdentifier=os.environ['DB_INSTANCE_IDENTIFIER']

            try:
              ec2 = boto3.client('ec2',region_name=region)
              rds = boto3.client('rds')

              autoScalingGroupName = get_auto_scaling_group_name(region,key,value)
