AWSTemplateFormatVersion: 2010-09-09
Description: This cloudformation template provisions resources for iScale payroll

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      -
        Label:
          default: "Resource Configuration"
        Parameters:
          - Name
          - OrgName
          - EnvName
      -
        Label:
          default: "Stack Configuration"
        Parameters:
          - NetworkStackName
          - LoadBalancerStackName
          - SNSStackName
          - DatabaseStackName
      -
        Label:
          default: "EC2/Auto-Scaling Group Configuration"
        Parameters:
          - AssociatePublicIp
          - InstanceAMI
          - InstanceType
          - PolicyArns
          - EnableMonitoring
          - KeyName
          - TopicArn
          - EnableCPUCreditAlarm
          - MaxSize
          - MinSize
          - SpotPrice
      -
        Label:
          default: "S3 Configuration"
        Parameters:
          - Versioning
      -
        Label:
          default: "Load Balancer Configuration"
        Parameters:
          - HealthCheckIntervalSeconds
          - HealthCheckPath
          - HealthCheckTimeoutSeconds
          - HealthyThresholdCount
          - UnhealthyThresholdCount
          - HttpCodes
          - HTTPSRulePriority
          - InstancePort
          - ClientDomainName
          - SSLCertificateARN
      -
        Label:
          default: "Scheduler Configuration"
        Parameters:
          - StartScheduleExpression
          - StopScheduleExpression

    ParameterLabels:
      Name:
        default: "Resource Name"
      OrgName:
        default: "Organization Name"
      EnvName:
        default: "Environment Name"
      NetworkStackName:
        default: "Network Stack Name"
      LoadBalancerStackName:
        default: "Load Balancer Stack Name"
      SNSStackName:
        default: "SNS Topic Stack Name"
      DatabaseStackName:
        default: "Database Stack Name"
      AssociatePublicIp:
        default: "Associate Public IP"
      InstanceAMI:
        default: "Instance AMI ID"
      InstanceType:
        default: "Instance Type"
      PolicyArns:
        default: "Policy ARNs"
      EnableMonitoring:
        default: "Enable Monitoring"
      KeyName:
        default: "Key Name"
      EnableCPUCreditAlarm:
        default: "Enable CPU Credit Alarm"
      MaxSize:
        default: "Max Size"
      MinSize:
        default: "Min Size"
      SpotPrice:
        default: "Spot Price"
      Versioning:
        default: "Versioning"
      HealthCheckIntervalSeconds:
        default: "Health Check Interval in Seconds"
      HealthCheckPath:
        default: "Health Check Path"
      HealthCheckTimeoutSeconds:
        default: "Health Check Timeout in Seconds"
      HealthyThresholdCount:
        default: "Healthy Threshold Count"
      UnhealthyThresholdCount:
        default: "Unhealthy Threshold Count"
      HttpCodes:
        default: "Health Check HTTP Codes"
      InstancePort:
        default: "Instance Port"
      ClientDomainName:
        default: "Domain Name"
      HTTPSRulePriority:
        default: "HTTPS Listener rule Priority"
      SSLCertificateARN:
        default: "SSL Certificate ARN"
      StartScheduleExpression:
        default: "Scheduled Expression (Start)"
      StopScheduleExpression:
        default: "Scheduled Expression (Stop)"

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    Default: payrollv2
    MaxLength: 32 # Max length for target group name is only 32 characters.
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-hosting
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  NetworkStackName:
    Description: The name of the network stack.
    Type: String
    Default: iscale-hosting-prd-uw2-internal-network
  LoadBalancerStackName:
    Description: The name of the load balancer stack.
    Type: String
    Default: iscale-hosting-prd-uw2-internal-loadbalancer
  SNSStackName:
    Description: the name of the SNS stack.
    Type: String
    Default: iscale-hosting-prd-uw2-payroll-sns
  DatabaseStackName:
    Description: the name of the database stack.
    Type: String
    Default: iscale-hosting-prd-uw2-payroll-db
  AssociatePublicIp:
    Description: Set to true if associating public ip address to instance is enabled and AssociateEIP is true. Otherwise, set to false.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  InstanceAMI:
    Description: AMI image used by the EC2 instance.
    Type: String
    Default: ami-0dfbd72fd829354a4
  InstanceType:
    Description: The instnace type of the EC2 instance (e.g. t2.micro, t2.small, c4.large, etc).
    Type: String
    Default: t3.small
  PolicyArns:
    Description: List of policy Arns associated to the EC2 instance.
    Type: String
    Default: "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"
  EnableMonitoring:
    Description: Set to true if monitoring is enabled for the EC2 instance. Otherwise, disabled.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  KeyName:
    Description: Name of the Key Pair to use.
    Type: String
    Default: ""
  EnableCPUCreditAlarm:
    Description: Set to true if CPU credit alarm is enabled (Applicable only for t* instance types. E.g. t2.small, t3.small). Otherwise, disabled.
    Type: String
    Default: true
    AllowedValues:
      - true
      - false
  MaxSize:
    Description: The maximum number of Amazon EC2 instances in the Auto Scaling group
    Type: Number
    Default: 1
  MinSize:
    Description: The minimum number of Amazon EC2 instances in the Auto Scaling group
    Type: Number
    Default: 1
  SpotPrice:
    Description: The maximum hourly price to be paid for any Spot Instance launched to fulfill the request. Spot Instances are launched when the price you specify exceeds the current Spot price.
    Type: String
    Default: 2
  Versioning:
    Description: Enables multiple versions of all objects in this bucket. You might enable versioning to prevent objects from being deleted or overwritten by mistake or to archive objects so that you can retrieve previous versions of them.
    Type: String
    Default: Enabled
    AllowedValues:
      - Enabled
      - Suspended
  HealthCheckIntervalSeconds:
    Description: The approximate amount of time, in seconds, between health checks of an individual target.
    Type: Number
    Default: 10
  HealthCheckPath:
    Description: The ping path that is the destination on the targets for health checks.
    Type: String
    Default: /
  HealthCheckTimeoutSeconds:
    Description: The amount of time, in seconds, during which no response from a target means a failed health check.
    Type: Number
    Default: 2
  HealthyThresholdCount:
    Description: The number of consecutive health checks successes required before considering an unhealthy target healthy.
    Type: Number
    Default: 2
  UnhealthyThresholdCount:
    Description: The number of consecutive health check failures required before considering a target unhealthy.
    Type: Number
    Default: 3
  HttpCodes:
    Description: The HTTP codes to use when checking for a successful response from a target.
    Type: String
    Default: 200,302
  InstancePort:
    Description: The port on which the targets receive traffic.
    Type: Number
    Default: 80
  ClientDomainName:
    Description: The client's domain name (e.g. example.com, iscale-solutions.com).
    Type: String
    Default: iscale-solutions.com
  HTTPSRulePriority:
    Description: The priority for HTTPS listener rule.
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 50000
  SSLCertificateARN:
    Description: ARN of the domain SSL certificate
    Type: String
  StartScheduleExpression:
    Description: Schedule expression when to start the the asg/rds instance.
    Type: String
    Default: cron(0 0 ? * MON-FRI *)
  StopScheduleExpression:
    Description: Schedule expression when to stop the the asg/rds instance.
    Type: String
    Default: cron(0 13 ? * MON-FRI *)

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  IsEnableCPUCreditAlarm: !Equals [!Ref EnableCPUCreditAlarm, true]
  IsAssociatePublicIp: !Equals [!Ref AssociatePublicIp, true]
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]
  IsSsl: !Equals [!Ref InstancePort, '443']

Resources:

####
# Certificate Section
####

  DefaultListenerCertificate:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    Properties: 
      Certificates: 
        - CertificateArn: !Ref SSLCertificateARN
      ListenerArn:
        Fn::ImportValue:
          !Sub "${LoadBalancerStackName}-ApplicationListenerArn"

####
# EFS Section
####

  DefaultFileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    Properties:
      Encrypted: true
      KmsKeyId: !GetAtt DefaultKey.Arn
      LifecyclePolicies:
        - TransitionToIA: AFTER_30_DAYS
      FileSystemTags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, efs]]
        - 
          Key: Environment
          Value: !Ref EnvName
        - 
          Key: Organization
          Value: !Ref OrgName
      
  DefaultKey:
    Type: AWS::KMS::Key
    Properties:
      KeyPolicy:
        Version: 2012-10-17
        Id: key-default-1
        Statement:
          - 
            Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Join ['',['arn:aws:iam::', !Ref 'AWS::AccountId', ':root']]
            Action:
              - 'kms:*'
            Resource: '*'
          - 
            Sid: Allow administration of the key
            Effect: Allow
            Principal:
              AWS: !Join ['',['arn:aws:iam::', !Ref 'AWS::AccountId', ':role/MasterAccountAccessRole']]
            Action:
              - "kms:Create*"
              - "kms:Describe*"
              - "kms:Enable*"
              - "kms:List*"
              - "kms:Put*"
              - "kms:Update*"
              - "kms:Revoke*"
              - "kms:Disable*"
              - "kms:Get*"
              - "kms:Delete*"
              - "kms:ScheduleKeyDeletion"
              - "kms:CancelKeyDeletion"
            Resource: '*'
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        - 
          Key: Environment
          Value: !Ref EnvName
        - 
          Key: Organization
          Value: !Ref OrgName

  DefaultMountTarget1: 
    Type: AWS::EFS::MountTarget
    Properties: 
      FileSystemId: !Ref DefaultFileSystem
      SubnetId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-PrivateSubnetId1"
      SecurityGroups: 
        - !Ref EFSSecurityGroup

  DefaultMountTarget2: 
    Type: AWS::EFS::MountTarget
    Properties: 
      FileSystemId: !Ref DefaultFileSystem
      SubnetId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-PrivateSubnetId2"
      SecurityGroups: 
        - !Ref EFSSecurityGroup

####
# EC2 Section
####

  DefaultTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckIntervalSeconds: !Ref HealthCheckIntervalSeconds
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckProtocol: !If [IsSsl, "HTTPS", "HTTP"]
      HealthCheckTimeoutSeconds: !Ref HealthCheckTimeoutSeconds
      HealthyThresholdCount: !Ref HealthyThresholdCount
      UnhealthyThresholdCount: !Ref UnhealthyThresholdCount
      Matcher: 
        HttpCode: !Ref HttpCodes
      Port: !Ref InstancePort
      Protocol: !If [IsSsl, "HTTPS", "HTTP"]
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        - 
          Key: Environment
          Value: !Ref EnvName
        - 
          Key: Organization
          Value: !Ref OrgName

  DefaultTargetGroup2:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckIntervalSeconds: !Ref HealthCheckIntervalSeconds
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckProtocol: !If [IsSsl, "HTTPS", "HTTP"]
      HealthCheckTimeoutSeconds: !Ref HealthCheckTimeoutSeconds
      HealthyThresholdCount: !Ref HealthyThresholdCount
      UnhealthyThresholdCount: !Ref UnhealthyThresholdCount
      Matcher: 
        HttpCode: !Ref HttpCodes
      Port: !Ref InstancePort
      Protocol: !If [IsSsl, "HTTPS", "HTTP"]
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        - 
          Key: Environment
          Value: !Ref EnvName
        - 
          Key: Organization
          Value: !Ref OrgName

  # These listeners are for SSL
  HTTPSListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties: 
      Actions: 
        - Type: forward
          TargetGroupArn: !Ref DefaultTargetGroup
      Conditions: 
        - Field: host-header
          Values: 
            - !Join ['.', ['zion', !Ref ClientDomainName]]
      ListenerArn:
        Fn::ImportValue:
          !Sub "${LoadBalancerStackName}-ApplicationListenerArn" 
      Priority: !Ref HTTPSRulePriority

####
# AutoScaling Group Section
####

  AppServerLaunchConfig: 
    Type: AWS::AutoScaling::LaunchConfiguration
    Metadata: 
      AWS::CloudFormation::Init: 
        configSets:
          Odoo:
            - InstallLogAgent
            - InstallCustomData
          
        InstallLogAgent:
          # packages:
          #   yum:
          #     awslogs: []
          
          # commands:
          #   command01:
          #     command: cp -fv /var/awslogs/etc/awscli.region /var/awslogs/etc/aws.conf
          #   command02:
          #     command: rm -fv /var/awslogs/etc/awscli.region
          #   command03:
          #     command: service awslogs start
          #   command04:
          #     command: chkconfig awslogs on
          
          files:
            /var/awslogs/etc/config/cfn-init.conf:
              content: !Sub
                |
                [/var/log/cfn-init.log]
                datetime_format = %b %d %H:%M:%S
                file = /var/log/cfn-init.log
                buffer_duration = 5000
                log_stream_name = {instance_id}
                initial_position = start_of_file
                log_group_name = /var/log/cfn-init.log
            
            /var/awslogs/etc/config/cfn-init-cmd.conf:
              content: !Sub
                |
                [/var/log/cfn-init-cmd.log]
                datetime_format = %b %d %H:%M:%S
                file = /var/log/cfn-init-cmd.log
                buffer_duration = 5000
                log_stream_name = {instance_id}
                initial_position = start_of_file
                log_group_name = /var/log/cfn-init-cmd.log
            
            /var/awslogs/etc/config/ssm.conf:
              content: !Sub
                |
                [/var/log/amazon/ssm/amazon-ssm-agent.log]
                datetime_format = %b %d %H:%M:%S
                file = /var/log/amazon/ssm/amazon-ssm-agent.log
                buffer_duration = 5000
                log_stream_name = {instance_id}
                initial_position = start_of_file
                log_group_name = /var/log/amazon/ssm/amazon-ssm-agent.log
            
            /var/awslogs/etc/config/deployments.conf:
              content: !Sub
                |
                [codedeploy-agent-deployments.log]
                datetime_format = %b %d %H:%M:%S
                file = /opt/codedeploy-agent/deployment-root/deployment-logs/codedeploy-agent-deployments.log
                buffer_duration = 5000
                log_stream_name = {instance_id}
                initial_position = start_of_file
                log_group_name = /var/log/codedeploy-agent-deployments.log
            
            # /var/awslogs/etc/config/blur.conf:
            #   content: !Sub
            #     |
            #     [blur.log]
            #     datetime_format = %b %d %H:%M:%S
            #     file = /var/log/blur.log
            #     buffer_duration = 5000
            #     log_stream_name = {instance_id}
            #     initial_position = start_of_file
            #     log_group_name = /var/log/blur.log

            /var/awslogs/etc/awscli.region:
              content: !Sub
                |
                [plugins]
                cwlogs = cwlogs
                [default]
                region = ${AWS::Region}
                
        InstallCustomData:
          # packages:
          #   yum: 
          #     jq: []
          files:
            /var/lib/cloud/instance/custom-data.sh: 
              content: !Sub
                - |
                  STACK_NAME=${AWS::StackName}
                  AWS_REGION=${AWS::Region}
                  DOMAIN=${DOMAIN}
                  ENVIRONMENT=${ENVIRONMENT}
                  CLIENT_NAME=${CLIENT_NAME}
                  APPLICATION_SITE=${APPLICATION_SITE}
                  INSTANCE_ROLE=${INSTANCE_ROLE}
                  SECRET_ID=${SECRET_ID}
                  EFS_NAME=${EFS_NAME}
                  DB_HOST=${DB_HOST}
                  BASE_URL=https://${DOMAIN}/
                - DOMAIN: !Join [".", ["zion", !Ref ClientDomainName]]
                  ENVIRONMENT: !Ref EnvName
                  CLIENT_NAME: payroll
                  APPLICATION_SITE: !Ref OrgName
                  INSTANCE_ROLE: !Ref DefaultIamRole
                  EFS_NAME: !Join ['.',[!Ref DefaultFileSystem, efs, !Ref 'AWS::Region', amazonaws.com]]
                  SECRET_ID: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], payroll]]
                  DB_HOST:
                    Fn::ImportValue:
                      !Sub "${DatabaseStackName}-EndpointAddress"
              permissions: 0700
              owner: root
              group: root
    
    Properties:
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref 'AWS::NoValue']
      ImageId: !Ref InstanceAMI
      SecurityGroups: [!GetAtt DefaultSecurityGroup.GroupId]
      InstanceType: !Ref InstanceType
      AssociatePublicIpAddress: !Ref AssociatePublicIp
      IamInstanceProfile: !GetAtt DefaultIamInstanceProfile.Arn
      InstanceMonitoring: !Ref EnableMonitoring
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash -xe
            # Install the files and packages from the metadata
            apt-get -y install python-pip
            pip install https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-latest.tar.gz
            /usr/local/bin/cfn-init -v --stack ${AWS::StackName} --resource AppServerLaunchConfig -c Odoo --region ${AWS::Region} --role ${ROLE}
            # Start up the cfn-hup daemon to listen for changes to the EC2 metadata
            /usr/local/bin/cfn-hup || error_exit 'Failed to start cfn-hup'
            # Signal the status from cfn-init
            /usr/local/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource AppServerLaunchConfig  --region ${AWS::Region}
          - ROLE: !Ref DefaultIamRole

####
# VPC Section
####

  DefaultSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      GroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      VpcId: #vpc-0eeeb47ddc550dcb5
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  DefaultSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      GroupId: !GetAtt DefaultSecurityGroup.GroupId
      IpProtocol: TCP
      FromPort: !Ref InstancePort
      ToPort: !Ref InstancePort
      SourceSecurityGroupId: #sg-0b8f5f31b0f5bcd2e
        Fn::ImportValue:
          !Sub "${LoadBalancerStackName}-SecurityGroupId"

  # SSH access from VPC
  # DefaultSecurityGroupIngress2:
  #   Type: AWS::EC2::SecurityGroupIngress
  #   Properties:
  #     GroupId: !GetAtt DefaultSecurityGroup.GroupId
  #     IpProtocol: "tcp"
  #     FromPort: 22
  #     ToPort: 22
  #     CidrIp:
  #       Fn::ImportValue:
  #         !Sub "${NetworkStackName}-VpcCidrBlock"
  
  # SSH access from bastion
  DefaultSecurityGroupIngress2:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt DefaultSecurityGroup.GroupId
      IpProtocol: "tcp"
      FromPort: 22
      ToPort: 22
      CidrIp: 0.0.0.0/0

  DefaultSecurityGroupEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt DefaultSecurityGroup.GroupId
      IpProtocol: -1
      FromPort: -1
      ToPort: -1
      CidrIp: "0.0.0.0/0"

  EFSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # GroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, efs]]
      GroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, efs]]
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, efs]]

  EFSSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      GroupId: !GetAtt EFSSecurityGroup.GroupId
      IpProtocol: TCP
      FromPort: 2049
      ToPort: 2049
      SourceSecurityGroupId: !GetAtt DefaultSecurityGroup.GroupId

####
# IAM Section
####

  DefaultIamInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Roles:
        - !Ref DefaultIamRole

  DefaultIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - 
            Sid: "1"
            Effect: "Allow"
            Action: "sts:AssumeRole"
            Principal:
              Service: "ec2.amazonaws.com"
      ManagedPolicyArns:
        - !Ref PolicyArns
      Policies:
        - 
          PolicyName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - 
                Effect: "Allow"
                Action: 
                  - s3:GetBucketLocation
                  - s3:ListAllMyBuckets
                Resource: arn:aws:s3:::*
              - 
                Effect: "Allow"
                Action: 
                  - s3:ListBucket
                Resource: '*'
              - 
                Effect: "Allow"
                Action: 
                  - s3:PutObject
                  - s3:GetObject
                Resource: '*'
              - 
                Effect: "Allow"
                Action: 
                  - secretsmanager:GetSecretValue
                Resource: '*'
              -
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:PutLogEvents
                  - logs:CreateLogStream
                  - logs:DescribeLogStream
                Resource: arn:aws:logs:*:*:*
              -
                Effect: Allow
                Action:
                  - cloudformation:DescribeStackResource
                Resource: '*'
              

  SSMServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Effect: Allow
            Principal:
              Service:
                - ssm.amazonaws.com
            Action: 
              - sts:AssumeRole
      Policies:
        - 
          PolicyName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, sns-service-role]]
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              -
                Effect: Allow
                Action:
                  - SNS:Publish
                Resource:
                  Fn::ImportValue:
                    !Sub "${SNSStackName}-TopicArn"

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: 
              - sts:AssumeRole
      Policies:
        - 
          PolicyName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, lambdaexecution-role]]
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - 
                Effect: Allow
                Action: 
                  - ec2:Start*
                  - ec2:Stop*
                  - ec2:DescribeInstances
                  - ec2:ReportInstanceStatus
