AWSTemplateFormatVersion: 2010-09-09
Description: Resources for proseso-consulting.com hosting
Metadata: 

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      -
        Label:
          default: "Resource Configuration"
        Parameters:
          - Name
          - OrgName
          - EnvName
      -
        Label:
          default: "Stack Configuration"
        Parameters:
          - NetworkStackName
          - LoadBalancerStackName
          - SNSStackName
      -
        Label:
          default: "EC2 Configuration"
        Parameters:
          - InstanceAMI
          - InstanceType
          - KeyName
          - EnableCPUCreditAlarm
      -
        Label:
          default: "Load Balancer Configuration"
        Parameters:
          - HttpCodes
          - InstancePort
          - ClientDomainName
          - ClientAdminHostName
          - AdminRulePriority
          - StaticRulePriority
          - AdminSSLCertificateArn
      -
        Label:
          default: "Static Hosting Configuration"
        Parameters:
          - ClientStaticHostName
          - StaticCertificateArn
          - LambdaDefaultIndexARN
          - LambdaStaticSiteCachingARN

    ParameterLabels:
      Name:
        default: "Resource Name"
      OrgName:
        default: "Organization Name"
      EnvName:
        default: "Environment Name"
      NetworkStackName:
        default: "Network Stack Name"
      LoadBalancerStackName:
        default: "Load Balancer Stack Name"
      SNSStackName:
        default: "SNS Topic Stack Name"
      StaticCertificateArn:
        default: "CloudFront SSL Certificate ARN"
      InstanceAMI:
        default: "Instance AMI ID"
      InstanceType:
        default: "Instance Type"
      KeyName:
        default: "Key Name"
      EnableCPUCreditAlarm:
        default: "Enable CPU Credit Alarm"
      InstancePort:
        default: "Instance Port"
      LambdaDefaultIndexARN:
        default: "Lambda Default Index ARN"
      LambdaStaticSiteCachingARN:
        default: "Lambda Static Site Caching ARN"
      ClientDomainName:
        default: "Client Domain Name"
      ClientAdminHostName:
        default: "Client Admin Hostname"
      ClientStaticHostName:
        default: "Client Static Hostname"
      AdminRulePriority:
        default: "Admin Listener Priority"
      StaticRulePriority:
        default: "Static Listener Priority"
      AdminSSLCertificateArn:
        default: "Admin ELB SSL Certificate ARN"

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    Default: website
    MaxLength: 9
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: proseso
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  NetworkStackName:
    Description: The name of the network stack.
    Type: String
    Default: HostingProductionNetwork
  LoadBalancerStackName:
    Description: The name of the load balancer stack.
    Type: String
    Default: HostingProductionELB
  SNSStackName:
    Description: the name of the SNS stack.
    Type: String
    Default: iscale-hosting-prd-uw2-sns
  ClientStaticHostName:
    Description: Static Host Name for the site (e.g. www)
    Type: String
    Default: www
  StaticCertificateArn:
    Description: ARN of the SSL Certificate for CloudFront (must be in us-east-1)
    Type: String
    # AllowedPattern: "^arn\:aws\:acm\:us-east-1\:"
    Default: arn:aws:acm:us-east-1:178070162686:certificate/c730162d-d269-4e85-9b33-42423db7eba1
  InstanceAMI:
    Description: AMI image for EC2.
    Type: String
    Default: ami-01fee56b22f308154 #Default AWS Linux
    # Default: ami-0cdfde001e26fba6e #iScale Hosting image
  InstanceType:
    Description: The EC2 instance type (t3.micro, t3.small, t3.large, etc).
    Type: String
    Default: t3.small
  KeyName:
    Description: Name of the Key Pair to use.
    Type: String
    Default: ""
  EnableCPUCreditAlarm:
    Description: Set to true if CPU credit alarm is enabled (Applicable only for t* instance types. E.g. t2.small, t3.small). Otherwise, disabled.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  InstancePort:
    Description: The port on which the targets receive traffic.
    Type: Number
    Default: 80
  LambdaDefaultIndexARN:
    Description: Default Index Lambda function ARN
    Type: String
    Default: arn:aws:lambda:us-east-1:178070162686:function:LambdaEdgeFunctions-LambdaDefaultIndexFunction-GQXH6N0VHIMU:1
  LambdaStaticSiteCachingARN:
    Description: Default Lambda Static Site Caching function ARN
    Type: String
    Default: arn:aws:lambda:us-east-1:178070162686:function:LambdaEdgeFunctions-LambdaStaticSiteCachingFunctio-B438ZA4X5Y8C:2
  ClientDomainName:
    Description: The client's domain name (e.g. example.com, iscale-solutions.com).
    Type: String
    Default: proseso-consulting.com
  ClientAdminHostName:
    Description: The client admin host name (e.g. admin, web-admin, etc).
    Type: String
    Default: webadmin
  AdminRulePriority:
    Description: The priority for listener rule 1.
    Type: Number
    Default: 357
    MinValue: 1
    MaxValue: 50000
  StaticRulePriority:
    Description: The priority for listener rule 2.
    Type: Number
    Default: 358
    MinValue: 1
    MaxValue: 50000
  AdminSSLCertificateArn:
    Description: WebAdmin (ELB) SSL Certificate ARN
    Type: String
    Default: arn:aws:acm:us-west-2:178070162686:certificate/34da5e32-0311-45a7-b5c5-41e3361f19d8

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]

Resources:

####
# Certificate Section
####

  AdminSSLListenerCertificate:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    Properties: 
      Certificates: 
        - CertificateArn: !Ref AdminSSLCertificateArn
      ListenerArn:
        Fn::ImportValue:
          !Sub "${LoadBalancerStackName}-ApplicationListenerArn"

####
# EFS Section
####

  AppServerFileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    Properties:
      Encrypted: true
      LifecyclePolicies:
        - TransitionToIA: AFTER_30_DAYS
      FileSystemTags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, efs]]
        - 
          Key: Environment
          Value: !Ref EnvName
        - 
          Key: Organization
          Value: !Ref OrgName

  EfsMountTargetPublicSubnet1: 
    Type: AWS::EFS::MountTarget
    Properties: 
      FileSystemId: !Ref AppServerFileSystem
      SubnetId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-PublicSubnetId1"
      SecurityGroups: 
        - !Ref EfsSecurityGroup

  EfsMountTargetPublicSubnet2: 
    Type: AWS::EFS::MountTarget
    Properties: 
      FileSystemId: !Ref AppServerFileSystem
      SubnetId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-PublicSubnetId2"
      SecurityGroups: 
        - !Ref EfsSecurityGroup

####
# EC2 Section
####

  WebAdminTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckIntervalSeconds: 10
      HealthCheckPath: /health.php
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 2
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200,301
      # Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, "webadmin"]]
      Port: !Ref InstancePort
      Protocol: HTTP
      TargetType: instance
      Targets:
        - Id: !Ref WebAdminInstance2
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, "webadmin"]]
        - 
          Key: Environment
          Value: !Ref EnvName
        - 
          Key: Organization
          Value: !Ref OrgName

  AdminHTTPSURLListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties: 
      Actions: 
        - Type: forward
          TargetGroupArn: !Ref WebAdminTargetGroup
      Conditions: 
        - Field: host-header
          Values: 
            - !Join ['.', [!Ref ClientAdminHostName, !Ref ClientDomainName]]
      ListenerArn:
        Fn::ImportValue:
          !Sub "${LoadBalancerStackName}-ApplicationListenerArn" 
      Priority: !Ref AdminRulePriority

  StaticURLListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties: 
      Actions: 
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: 443
            Host: !Join ['.', [!Ref ClientStaticHostName, !Ref ClientDomainName]]
            Path: "/#{path}"
            Query: "#{query}"
            StatusCode: HTTP_301
      Conditions: 
        - Field: host-header
          Values: 
            - !Ref ClientDomainName
      ListenerArn:
        Fn::ImportValue:
          !Sub "${LoadBalancerStackName}-ApplicationListenerArn"
      Priority: !Ref StaticRulePriority

  WebAdminInstance2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref InstanceAMI
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref 'AWS::NoValue']
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref WebAdminIamInstanceProfile
      DisableApiTermination: false
      NetworkInterfaces: 
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          GroupSet: [!GetAtt WebAdminSecurityGroup.GroupId] 
          SubnetId: 
            Fn::ImportValue:
              !Sub "${NetworkStackName}-PublicSubnetId1"
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash -xe
            # yum update -y
            # Install the files and packages from the metadata
            yum install -y aws-cfn-bootstrap
            /opt/aws/bin/cfn-init -v --stack ${AWS::StackName} --resource WebAdminInstance2 -c WebAdmin --region ${AWS::Region} --role ${ROLE}
            # Start up the cfn-hup daemon to listen for changes to the EC2 metadata
            /opt/aws/bin/cfn-hup || error_exit 'Failed to start cfn-hup'
            # Signal the status from cfn-init
            /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource WebAdminInstance2  --region ${AWS::Region}
          - ROLE: !Ref WebAdminIamRole      
    Metadata: 
      AWS::CloudFormation::Init:
        configSets: 
          WebAdmin: 
            - InstallLogAgent
            - InstallEFS
        InstallLogAgent:
          Fn::Transform:
            Name: AWS::Include
            Parameters:
              Location: s3://iscale-dev-cloudformation/include/installLogAgent.yaml
        InstallEFS:
          Fn::Transform:
            Name: AWS::Include
            Parameters:
              Location: s3://iscale-dev-cloudformation/include/installEFS.yaml

####
# VPC Section
####

  WebAdminSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      GroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  WebAdminSecurityGroupHTTPIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt WebAdminSecurityGroup.GroupId
      IpProtocol: TCP
      FromPort: !Ref InstancePort
      ToPort: !Ref InstancePort
      SourceSecurityGroupId:
        Fn::ImportValue:
          !Sub "${LoadBalancerStackName}-SecurityGroupId"

  WebAdminSecurityGroupSSHIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt WebAdminSecurityGroup.GroupId
      CidrIp: 0.0.0.0/0
      IpProtocol: TCP
      FromPort: 22
      ToPort: 22
  
  WebAdminSecurityGroupEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt WebAdminSecurityGroup.GroupId
      IpProtocol: -1
      FromPort: -1
      ToPort: -1
      CidrIp: "0.0.0.0/0"

  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, efs]]
      GroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, efs]]
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, efs]]

  EfsSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      GroupId: !GetAtt EfsSecurityGroup.GroupId
      IpProtocol: TCP
      FromPort: 2049
      ToPort: 2049
      SourceSecurityGroupId: !GetAtt WebAdminSecurityGroup.GroupId
  
  EfsSecurityGroupEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt EfsSecurityGroup.GroupId
      IpProtocol: -1
      FromPort: -1
      ToPort: -1
      CidrIp: "0.0.0.0/0"

####
# IAM Section
####

  WebAdminIamInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Roles:
        - !Ref WebAdminIamRole

  WebAdminIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - 
            Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: ec2.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AWSForWordPressPluginPolicy
      Policies:
        - PolicyName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              -
                Effect: Allow
                Action: 
                  - cloudwatch:PutMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - ec2:DescribeTags
                  - autoscaling:DescribeTags
                Resource: "*"
              - 
                Effect: Allow
                Action:
                  - s3:*
                Resource: 
                  - !Join ['/', [!GetAtt [StaticWebsiteS3Bucket, Arn], '*']]
                  - !GetAtt [StaticWebsiteS3Bucket, Arn]
              -
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:ListInvalidations
                Resource:
                  - !Join ['',['arn:aws:cloudfront::', !Ref 'AWS::AccountId', ':distribution/', !Ref StaticWebsiteCloudFront]]
        - PolicyName: StackResourcesAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStackResource
                Resource: '*'

  StaticWebsiteUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - 
          PolicyName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - 
                Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - !Join ['/', [!GetAtt [StaticWebsiteS3Bucket, Arn], '*']]
                  - !GetAtt [StaticWebsiteS3Bucket, Arn]
              -
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:ListInvalidations
                Resource:
                  - !Join ['',['arn:aws:cloudfront::', !Ref 'AWS::AccountId', ':distribution/', !Ref StaticWebsiteCloudFront]]

  StaticWebsiteUserAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName:
        Ref: StaticWebsiteUser

####
# CloudWatch Section
####

  CPUUtilizationCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join [ '-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], cpu-utilization]]
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - 
          Fn::ImportValue:
            !Sub "${SNSStackName}-TopicArn"
      OKActions:
        - 
          Fn::ImportValue:
            !Sub "${SNSStackName}-TopicArn"

  StatusChecksCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join [ '-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], status-checks] ]
      MetricName: StatusCheckFailed
      Namespace: AWS/EC2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Minimum
      Threshold: 1
      AlarmActions:
        - 
          Fn::ImportValue:
            !Sub "${SNSStackName}-TopicArn"
      OKActions:
        - 
          Fn::ImportValue:
            !Sub "${SNSStackName}-TopicArn"

  DiskSpaceUtilizationCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join [ '-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], disk-space-utilization]]
      MetricName: DiskSpaceUtilization
      Namespace: System/Linux
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Maximum
      Threshold: 85
      AlarmActions:
        - 
          Fn::ImportValue:
            !Sub "${SNSStackName}-TopicArn"
      OKActions:
        - 
          Fn::ImportValue:
            !Sub "${SNSStackName}-TopicArn"
      Dimensions:
        - Name: Filesystem
          Value: /dev/nvme0n1p1
        - Name: MountPath
          Value: /
####
# S3 Section
####
  StaticWebsiteS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption: 
        ServerSideEncryptionConfiguration: 
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html

####
# CloudFront Section
####

  CloudFrontOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: CloudFront Access to the S3 static origin
 
  StaticWebsiteCloudFront:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
        - DomainName: !GetAtt [StaticWebsiteS3Bucket, DomainName]
          Id: StaticWebsiteS3BucketOrigin
          S3OriginConfig:
            OriginAccessIdentity: !Join ["", ['origin-access-identity/cloudfront/', !Ref CloudFrontOriginAccessIdentity]]
        Enabled: 'true'
        Comment: !Join [" ", [ "Static website for", !Join [".", [!Ref ClientStaticHostName, !Ref ClientDomainName]]]]
        HttpVersion: http2
        DefaultRootObject: index.html
        Aliases:
        - !Join [".", [!Ref ClientStaticHostName, !Ref ClientDomainName]]
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          TargetOriginId: StaticWebsiteS3BucketOrigin
          LambdaFunctionAssociations:
          - EventType: origin-request
            IncludeBody: false
            LambdaFunctionARN: !Ref LambdaDefaultIndexARN
          - EventType: origin-response
            IncludeBody: false
            LambdaFunctionARN: !Ref LambdaStaticSiteCachingARN
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: all
          Compress: true
          ViewerProtocolPolicy: redirect-to-https
          MinTTL: 3600
          MaxTTL: 86400
        PriceClass: PriceClass_All
        ViewerCertificate: 
          SslSupportMethod: sni-only
          AcmCertificateArn: !Ref StaticCertificateArn

  WebAdminDNSRecord:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneName: !Join ['', [!Ref ClientDomainName, '.']] 
      Comment: WebAdmin Record
      RecordSets:
        - Name: !Join [".", [!Ref ClientAdminHostName, !Ref ClientDomainName]]
          Type: A
          AliasTarget:
            HostedZoneId:
              Fn::ImportValue:
                Fn::Sub: "${LoadBalancerStackName}-PublicELBCanonicalHostedZoneID"
            DNSName:
              Fn::ImportValue:
                Fn::Sub: "${LoadBalancerStackName}-PublicELBDNS"

Outputs:

  SecurityGroupId:
    Description: The security group id of the EC2 instance
    Value: !GetAtt WebAdminSecurityGroup.GroupId
    Export: 
      Name: !Sub ${AWS::StackName}-SecurityGroupId

  InstanceRoleArn:
    Description: The instance role arn attached to the EC2 Instance
    Value: !GetAtt WebAdminIamRole.Arn
    Export: 
      Name: !Sub ${AWS::StackName}-InstanceRoleArn

  S3StaticBucket:
    Description: The S3 bucket holding the static website
    Value: !Ref StaticWebsiteS3Bucket

  StaticWebsiteUserAccessKeyId:
    Description: Access Key Id for the static S3 bucket
    Value: !Ref StaticWebsiteUserAccessKey
  
  StaticWebsiteUserAccessKeySecret:
    Description: Secret Key for the static S3 bucket
    Value: !GetAtt [StaticWebsiteUserAccessKey, SecretAccessKey]




