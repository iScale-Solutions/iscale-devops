AWSTemplateFormatVersion: 2010-09-09
Description: This cloudformation configuration provisions an RDS instance with monitoring, replication, backups, HA and DR capabilities for iscale-payroll

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      -
        Label:
          default: "Resource Configuration"
        Parameters:
          - Name
          - OrgName
          - EnvName
      -
        Label:
          default: "Database Configuration"
        Parameters:
          - MultiAz
          - MasterUser
          - DatabaseName
          - Port
          - StorageEncrypted
          - InstanceType
          - Engine
          - EngineVersion
          - AllocatedStorage
          - BackupRetentionPeriod
          - BackupWindow
          - SnapshotIdentifier
          - SourceDbInstanceIdentifier
          - AutoMinorVersionUpgrade
          - Family
          - MonitoringInterval
          - EnableEnhancedMonitoring
      -
        Label:
          default: "CloudWatch Configuration"
        Parameters:
          - LogRetentionPeriod
          - EnableCPUCreditAlarm
      -
        Label:
          default: "Cloudformation Stack Configuration"
        Parameters:
          - NetworkStack
          - SNSStack

    ParameterLabels:
      Name:
        default: "Resource Name"
      OrgName:
        default: "Organization Name"
      EnvName:
        default: "Environment Name"
      MultiAz:
        default: "Multi AZ"
      MasterUser:
        default: "Master Username"
      DatabaseName:
        default: "Database Name"
      Port:
        default: "Port"
      StorageEncrypted:
        default: "Storage Encrypted"
      InstanceType:
        default: "RDS Instance Type"
      Engine:
        default: "Engine"
      EngineVersion:
        default: "Engine Version"
      AllocatedStorage:
        default: "Allocated Storage"
      BackupRetentionPeriod:
        default: "Backup Retention Period"
      BackupWindow:
        default: "Backup Window"
      SnapshotIdentifier:
        default: "Snapshot Identifier"
      SourceDbInstanceIdentifier:
        default: "Source Database Instance Identifier"
      AutoMinorVersionUpgrade:
        default: "Auto-Minor Version Upgrade"
      Family:
        default: "Family"
      MonitoringInterval:
        default: "Monitoring Interval"
      EnableEnhancedMonitoring:
        default: "Enable Enhanced Monitoring"
      LogRetentionPeriod:
        default: "Log Retention Period"
      EnableCPUCreditAlarm:
        default: "Enable CPU Credit Alarm"
      EnableEnhancedMonitoring:
        default: "Enable Enhanced Monitoring"
      NetworkStack:
        default: "Network Stack"
      SNSStack:
        default: "SNS Stack"

Parameters: 
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    Default: payroll
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-hosting
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
  MultiAz:
    Description: Set to true if MultiAZ is enabled. Otherwise, disabled.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  MasterUser:
    Description: The name of the master user for the database instance. 
    Type: String
    Default: master
    ConstraintDescription: Can be any printable ASCII character except "/", "\", or "@".
  DatabaseName:
    Description: The name of the database
    Type: String
    Default: payroll
  Port:
    Description: The port number on which the database accepts connections.
    Type: Number
    Default: 5432
  StorageEncrypted:
    Description: Set to true if DB instance encryption is enabled. Otherwise, disabeld.
    Type: String
    Default: true
    AllowedValues:
      - true
      - false
  InstanceType:
    Description: The compute and memory capacity of the DB instance, for example, db.m4.large.
    Type: String
    Default: db.t3.micro
  Engine:
    Description: The name of the database engine that you want to use for this DB instance.
    Type: String
    Default: postgres
    AllowedValues:
      - aurora 
      - aurora-mysql
      - aurora-postgresql
      - mariadb
      - mysql
      - oracle-ee
      - oracle-se2
      - oracle-se1
      - oracle-se
      - postgres
      - sqlserver-ee
      - sqlserver-se
      - sqlserver-ex
      - sqlserver-web
  EngineVersion:
    Description: The version number of the database engine to use.
    Type: String
    Default: 10.11
  AllocatedStorage:
    Description: The amount of storage (in gigabytes) to allocate for the DB instance.
    Type: Number
    Default: 20
  BackupRetentionPeriod:
    Description: The number of days for which automated backups are retained. Setting this parameter to a positive number enables backups. Setting this parameter to 0 disables automated backups.
    Default: 30
    Type: Number
  BackupWindow:
    Description: The daily time range during which automated backups are created if automated backups are enabled using the BackupRetentionPeriod parameter.
    Type: String
    Default: ""
    ConstraintDescription: Must be in the format hh24:mi-hh24:mi. Must be in Universal Coordinated Time (UTC). Must not conflict with the preferred maintenance window. Must be at least 30 minutes.
  SnapshotIdentifier:
    Description: The name or Amazon Resource Name (ARN) of the DB snapshot that's used to restore the DB instance.
    Type: String
    Default: ""
  SourceDbInstanceIdentifier:
    Description: If you want to create a Read Replica DB instance, specify the ID of the source DB instance.
    Type: String
    Default: ""
  AutoMinorVersionUpgrade:
    Description: Set to true to automatically apply minor engine upgrades.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  Family:
    Description: The DB parameter group family name
    Type: String
    Default: postgres10
  MonitoringInterval:
    Description: The interval, in seconds, between points when Enhanced Monitoring metrics are collected for the DB instance
    Type: Number
    Default: 0
  EnableEnhancedMonitoring:
    Description: Set to true if enahanced monitoring is enabled. Otherwise, disabled.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  LogRetentionPeriod:
    Description: The number of days to retain the log events in the specified log group
    Type: Number
    Default: 365
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]
  EnableCPUCreditAlarm:
    Description: Set to true if CPU credit alarm is enabled (Applicable only for t* instance types. E.g. t2.small, t3.small). Otherwise, disabled.
    Type: String
    Default: true
    AllowedValues:
      - true
      - false
  NetworkStack:
    Description: The name of the cloudformation Networ stack
    Type: String
    Default: iscale-hosting-prd-uw2-internal-network
  SNSStack:
    Description: The name of the cloudformation SNS stack
    Type: String
    Default: iscale-hosting-prd-uw2-sns

Mappings: 
  EnvShort:
    Production:
      Name: prd
    Staging:
      Name: stg
    Development:
      Name: dev
    Test:
      Name: test
  RegionShort:
    us-east-2:
      Name: ue2
    us-east-1:
      Name: ue1
    us-west-1:
      Name: uw1
    us-west-2:
      Name: uw2
    ap-east-1:
      Name: ae1
    ap-south-1:
      Name: as1
    ap-northeast-1:
      Name: ane1
    ap-northeast-2:
      Name: ane2
    ap-northeast-3:
      Name: ane3
    ap-southeast-1:
      Name: ase1
    ap-southeast-2:
      Name: ase2
    ca-central-1:
      Name: cc1
    cn-north-1:
      Name: cn1
    cn-northwest-1:
      Name: cnw1
    eu-central-1:
      Name: ec1
    eu-west-1:
      Name: ew1
    eu-west-2:
      Name: ew2
    eu-west-3:
      Name: ew3
    eu-north-1:
      Name: en1
    me-south-1:
      Name: ms1
    sa-east-1:
      Name: se1
    us-gov-east-1:
      Name: uge1
    us-gov-west-1:
      Name: ugw1

Conditions: 
  IsAurora: !Or [!Equals [!Ref Engine, aurora], !Equals [!Ref Engine, aurora-mysql], !Equals [!Ref Engine, aurora-postgresql]]
  IsNotAurora: !Not [Condition: IsAurora]
  HasSnapshot: !Not [!Equals [!Ref SnapshotIdentifier, ""]]
  HasSourceDbInstanceIdentifier: !Not [!Equals [!Ref SourceDbInstanceIdentifier, ""]]
  HasBackupWindow: !Not [!Equals [!Ref BackupWindow, ""]]
  IsEnableCPUCreditAlarm: !Equals [!Ref EnableCPUCreditAlarm, true]
  IsEncrypted: !Equals [!Ref StorageEncrypted, true]
  IsEnableEnhancedMonitoring: !Equals [!Ref StorageEncrypted, true]

Resources: 

####
# KMS Section
####

  DefaultKmsKey:
    Condition: IsEncrypted
    Type: AWS::KMS::Key
    Properties:
      KeyPolicy:
        Version: 2012-10-17
        Id: key-default-1
        Statement:
          - 
            Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Join ['',['arn:aws:iam::', !Ref 'AWS::AccountId', ':root']]
            Action:
              - 'kms:*'
            Resource: '*'
          - 
            Sid: Allow administration of the key
            Effect: Allow
            Principal:
              AWS: !Join ['',['arn:aws:iam::', !Ref 'AWS::AccountId', ':role/MasterAccountAccessRole']]
            Action:
              - "kms:Create*"
              - "kms:Describe*"
              - "kms:Enable*"
              - "kms:List*"
              - "kms:Put*"
              - "kms:Update*"
              - "kms:Revoke*"
              - "kms:Disable*"
              - "kms:Get*"
              - "kms:Delete*"
              - "kms:ScheduleKeyDeletion"
              - "kms:CancelKeyDeletion"
            Resource: '*'
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        - 
          Key: Environment
          Value: !Ref EnvName
        - 
          Key: Organization
          Value: !Ref OrgName

  DefaultKmsAlias:
    Condition: IsEncrypted
    Type: AWS::KMS::Alias
    Properties: 
      AliasName: !Join ['-',[!Join ['/', ["alias", !Ref OrgName]], !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      TargetKeyId: !Ref DefaultKmsKey

####
# Lambda Section
####

  PasswordGenerator:
    Type: "Custom::PasswordGenerator"
    Properties:
      ServiceToken: !GetAtt DefaultLambdaFunction.Arn

  DefaultLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, password-generator]]
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.6
      Timeout: 900
      Code:
        ZipFile: |

          import cfnresponse
          import json
          import logging
          import time
          import base64
          import string
          import random

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):

            responseData={}
            physicalResourceId={}
            request_type = event['RequestType']

            try:

              if request_type in ['Create', 'Update']:
                responseData['DatabasePassword']=generate_random_password(20)
                responseData['AdminPassword']=generate_random_password(20)
              
              send(event, context, cfnresponse.SUCCESS, responseData, physicalResourceId)
              return

            except Exception:

              logger.exception('Error Encountered')
              send(event, context, cfnresponse.FAILED, responseData, physicalResourceId)
              return

          def send(event, context, responseStatus, responseData, physicalResourceId=None):
            resourceId = physicalResourceId or context.log_stream_name
            responseBody = {'Status': responseStatus,
                            'Reason': 'See the details in CloudWatch Log Stream: ' + context.log_stream_name,
                            'PhysicalResourceId': resourceId,
                            'StackId': event['StackId'],
                            'RequestId': event['RequestId'],
                            'LogicalResourceId': event['LogicalResourceId'],
                            'Data': responseData}
            logger.info('RESPONSE BODY:' + json.dumps(responseBody))
            cfnresponse.send(event, context, responseStatus, responseData, resourceId)

          def generate_random_password(password_length=20):
            """
            Generates a random password sent back to CF
            :param password_length: Length of the password in number of characters
            :return: String of the password
            """
            password = ''
            char_set = string.ascii_uppercase + string.ascii_lowercase + string.digits + '-'
            while '-' not in password:
                password = ''.join(random.sample(char_set * 6, int(password_length)))

            return password

####
# RDS Section
####

  DefaultSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      GenerateSecretString:
        SecretStringTemplate: !Sub
          - |
            {
              "ROOT_USER": "${ROOT_USER}",
              "DB_PORT": "${DB_PORT}",
              "DB_NAME": "${DB_NAME}",
              "DB_USER": "${DB_USER}",
              "DB_PASSWORD": "${DB_PASSWORD}",
              "ADMIN_PASSWORD": "${ADMIN_PASSWORD}"
            }
          - ROOT_USER: !Ref MasterUser
            DB_PORT: !Ref Port
            DB_NAME: !Ref DatabaseName
            DB_USER: odoo
            DB_PASSWORD: !GetAtt PasswordGenerator.DatabasePassword
            ADMIN_PASSWORD: !GetAtt PasswordGenerator.DatabasePassword
        GenerateStringKey: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        PasswordLength: 30
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  DefaultSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties: 
      DBSubnetGroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      DBSubnetGroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      SubnetIds: 
        - Fn::ImportValue: 
            !Sub "${NetworkStack}-InternalSubnetId1"
        - Fn::ImportValue: 
            !Sub "${NetworkStack}-InternalSubnetId2"
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  DefaultParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties: 
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Family: !Ref Family
      Parameters: 
        log_statement: ddl
        log_min_duration_statement: 1000
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  DefaultRDSCluster:
    Type: "AWS::RDS::DBCluster"
    DependsOn:
    - DefaultIamRole
    Condition: IsAurora
    Properties: 
      AssociatedRoles: !GetAtt DefaultIamRole.Arn
      BackupRetentionPeriod: !Ref BackupRetentionPeriod
      DatabaseName: !Ref DatabaseName
      DBClusterIdentifier: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      DBClusterParameterGroupName: !Ref DefaultParameterGroup
      DBSubnetGroupName: !Ref DefaultSubnetGroup
      EnableCloudwatchLogsExports:
        - audit
        - error
        - slowquery
      Engine: !Ref Engine
      EngineVersion: !Ref EngineVersion
      EngineMode: provisioned
      KmsKeyId: !If [IsEncrypted, !GetAtt DefaultKmsKey.Arn, !Ref 'AWS::NoValue']
      MasterUsername: !Ref MasterUser
      MasterUserPassword: !Join ['', ['{{resolve:secretsmanager:', !Ref DefaultSecret, ':SecretString:', !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]] ,'}}' ]]
      Port: !Ref Port
      PreferredBackupWindow: !If [ HasBackupWindow, !Ref BackupWindow, !Ref 'AWS::NoValue']
      SnapshotIdentifier: !If [ HasSnapshot, !Ref SnapshotIdentifier, !Ref 'AWS::NoValue']
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
  
  DefaultDbInstance:
    Type: AWS::RDS::DBInstance
    DependsOn:
    - PostgresqlLogGroup
    - UpgradeLogGroup
    - DefaultIamRole
    Properties:
      AllocatedStorage: !Ref AllocatedStorage
      DBInstanceClass: !Ref InstanceType
      AutoMinorVersionUpgrade: !Ref AutoMinorVersionUpgrade
      BackupRetentionPeriod: !Ref BackupRetentionPeriod
      DBClusterIdentifier: !If [IsAurora, !Ref DefaultRDSCluster, !Ref 'AWS::NoValue']
      DBInstanceIdentifier: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      DBName: !Ref DatabaseName
      DeletionProtection: true
      DBParameterGroupName: !Ref DefaultParameterGroup
      DBSnapshotIdentifier: !If [ HasSnapshot, !Ref SnapshotIdentifier, !Ref 'AWS::NoValue']
      DBSubnetGroupName: !Ref DefaultSubnetGroup
      EnableCloudwatchLogsExports:
        - postgresql
        - upgrade
      Engine: !Ref Engine
      EngineVersion: !Ref EngineVersion
      KmsKeyId: !If [IsEncrypted, !GetAtt DefaultKmsKey.Arn, !Ref 'AWS::NoValue']
      MasterUsername: !Ref MasterUser
      MasterUserPassword: !Join ['', ['{{resolve:secretsmanager:', !Ref DefaultSecret, ':SecretString:', !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]] ,'}}' ]]
      MonitoringRoleArn: !If [IsEnableEnhancedMonitoring, !GetAtt DefaultIamRole.Arn, !Ref 'AWS::NoValue']
      MonitoringInterval: !If [IsEnableEnhancedMonitoring, !Ref MonitoringInterval, 0]
      MultiAZ: !Ref MultiAz
      Port: !Ref Port
      PreferredBackupWindow: !If [IsAurora, !Ref 'AWS::NoValue', !If [ HasBackupWindow, !Ref BackupWindow, !Ref 'AWS::NoValue']]
      PubliclyAccessible: false
      SourceDBInstanceIdentifier: !If [ HasSourceDbInstanceIdentifier, !Ref SourceDbInstanceIdentifier, !Ref 'AWS::NoValue']
      StorageEncrypted: !Ref StorageEncrypted
      StorageType: gp2
      VPCSecurityGroups:
        - !GetAtt DefaultSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  DefaultEventSubscription: 
    Type: "AWS::RDS::EventSubscription"
    Properties: 
      Enabled: true
      EventCategories: 
        - availability
        - configuration change
        - creation
        - deletion
        - failover
        - low storage
        - maintenance
        - notification
        - read replica
        - recovery
        - restoration
      SnsTopicArn:
        Fn::ImportValue: 
          !Sub "${SNSStack}-TopicArn"
      SourceIds: 
        - !Ref DefaultDbInstance
      SourceType: db-instance
    
####
# VPC Section
####

  DefaultSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Join [ '-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], db] ]
      GroupDescription: !Join [ '-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], db] ]
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStack}-VpcId"

  DefaultSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt DefaultSecurityGroup.GroupId
      IpProtocol: "tcp"
      FromPort: !Ref Port
      ToPort: !Ref Port
      CidrIp:
        Fn::ImportValue:
          !Sub "${NetworkStack}-VpcCidrBlock"

####
# IAM Section
####

  DefaultIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - 
            Sid: "1"
            Effect: "Allow"
            Action: "sts:AssumeRole"
            Principal:
              Service: "monitoring.rds.amazonaws.com"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Path: "/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Principal:
              Service:
                - "lambda.amazonaws.com" 
            Action: 
              - "sts:AssumeRole"
      Policies:
        - 
          PolicyName: "LambdaDefaultFunctionPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - 
                Effect: "Allow"
                Action: 
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"

####
# CloudWatch Section
####

  DefaultLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['/', ['/aws/lambda', !Ref DefaultLambdaFunction]]

  # PostgreSQL log / metrics / alarms

  PostgresqlLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionPeriod
      LogGroupName: !Join [ '/', [/aws/rds/instance, !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name,]], postgresql]]

  # Error Denied
  ErrorDeniedMetricFilter: 
    Type: AWS::Logs::MetricFilter
    Properties: 
      LogGroupName: !Ref PostgresqlLogGroup
      FilterPattern: "[timestamp, id, message=\"*password authentication failed*\"]"
      MetricTransformations: 
        - 
          MetricValue: 1
          MetricNamespace: LogMetrics
          MetricName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], error-denied]]

  ErrorDeniedCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], db-error-denied]]
      MetricName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], error-denied]]
      Namespace: LogMetrics
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Sum
      Threshold: 0
      AlarmActions:
        - Fn::ImportValue: 
            !Sub "${SNSStack}-TopicArn"
      OKActions:
        - Fn::ImportValue: 
            !Sub "${SNSStack}-TopicArn"
      TreatMissingData: notBreaching 

  # Fatal Errors
  FatalMetricFilter: 
    Type: AWS::Logs::MetricFilter
    Properties: 
      LogGroupName: !Ref PostgresqlLogGroup
      FilterPattern: "[time, id, message_type=\"*FATAL*\"]"
      MetricTransformations: 
        - 
          MetricValue: 1
          MetricNamespace: LogMetrics
          MetricName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], fatal]]

  # Error Errors
  ErrorsMetricFilter: 
    Type: AWS::Logs::MetricFilter
    Properties: 
      LogGroupName: !Ref PostgresqlLogGroup
      FilterPattern: "[time, id, message_type=\"*ERROR*\"]"
      MetricTransformations: 
        - 
          MetricValue: 1
          MetricNamespace: LogMetrics
          MetricName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], errors]]

  ErrorsCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], db-errors]]
      MetricName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], error]]
      Namespace: LogMetrics
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Sum
      Threshold: 0
      AlarmActions:
        - Fn::ImportValue: 
            !Sub "${SNSStack}-TopicArn"
      OKActions:
        - Fn::ImportValue: 
            !Sub "${SNSStack}-TopicArn"
      TreatMissingData: notBreaching

  # Error Warnings
  WarningsMetricFilter: 
    Type: AWS::Logs::MetricFilter
    Properties: 
      LogGroupName: !Ref PostgresqlLogGroup
      FilterPattern: "[time, id, message_type=\"*WARNING*\"]"
      MetricTransformations: 
        - 
          MetricValue: 1
          MetricNamespace: LogMetrics
          MetricName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], warnings]]

# Upgrade log

  UpgradeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionPeriod
      LogGroupName: !Join [ '/', [/aws/rds/instance, !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], upgrade]]

# Standard metrics/alarms

  FreeStorageCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], db-free-storage-space]]
      MetricName: !If [IsAurora, FreeLocalStorage, FreeStorageSpace]
      Namespace: "AWS/RDS"
      ComparisonOperator: LessThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Average
      Threshold: 5368709120 # 5GB
      AlarmActions:
        - Fn::ImportValue: 
            !Sub "${SNSStack}-TopicArn"
      OKActions:
        - Fn::ImportValue: 
            !Sub "${SNSStack}-TopicArn"
      Dimensions:
        - Name: !If [IsAurora, DBClusterIdentifier, DBInstanceIdentifier]
          Value: !If [IsAurora, !Ref DefaultRDSCluster, !Ref DefaultDbInstance]

  CPUUtilizationCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], db-cpu-utilization]]
      MetricName: CPUUtilization
      Namespace: "AWS/RDS"
      ComparisonOperator: LessThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue: 
            !Sub "${SNSStack}-TopicArn"
      OKActions:
        - Fn::ImportValue: 
            !Sub "${SNSStack}-TopicArn"
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DefaultDbInstance

  CPUCreditBalanceCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsEnableCPUCreditAlarm
    Properties:
      AlarmName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], db-cpu-credit-balance]]
      MetricName: CPUCreditBalance
      Namespace: "AWS/EC2"
      ComparisonOperator: LessThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Minimum
      Threshold: 24
      AlarmActions:
        - Fn::ImportValue: 
            !Sub "${SNSStack}-TopicArn"
      OKActions:
        - Fn::ImportValue: 
            !Sub "${SNSStack}-TopicArn"
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DefaultDbInstance

Outputs:

  SecurityGroupId:
    Description: The security group id of the rds instance
    Value: !GetAtt DefaultSecurityGroup.GroupId
    Export: 
      Name: !Sub ${AWS::StackName}-SecurityGroupId

  EndpointAddress:
    Description: The endpoint address of the rds instance
    Value: !GetAtt DefaultDbInstance.Endpoint.Address
    Export: 
      Name: !Sub ${AWS::StackName}-EndpointAddress

  ClusterEndpointAddress:
    Condition: IsAurora
    Description: The endpoint address of the rds cluster
    Value: !GetAtt DefaultRDSCluster.Endpoint.Address
    Export: 
      Name: !Sub ${AWS::StackName}-ClusterEndpointAddress

  ClusterReadEndpointAddress:
    Condition: IsAurora
    Description: The read endpoint address of the rds cluster
    Value: !GetAtt DefaultRDSCluster.ReadEndpoint.Address
    Export: 
      Name: !Sub ${AWS::StackName}-ClusterReadEndpointAddress

  DatabasePassword:
    Description: DatabasePassword
    Value: !GetAtt PasswordGenerator.DatabasePassword
    Export: 
      Name: !Sub ${AWS::StackName}-DatabasePassword

  AdminPassword:
    Description: AdminPassword
    Value: !GetAtt PasswordGenerator.AdminPassword
    Export: 
      Name: !Sub ${AWS::StackName}-AdminPassword