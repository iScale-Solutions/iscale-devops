    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Join ['.',[_19e0d00e349028d0464c22859db05c1a, !Ref DomainName]]
      Type: CNAME
      TTL: 14400
      ResourceRecords:
        - _72bb2c46b68c326892f3c2a8e055e58b.hkmpvcwbzw.acm-validations.aws.

  SESDomainVerificationRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Join ['.',[_amazonses, !Ref DomainName]]
      ResourceRecords:
