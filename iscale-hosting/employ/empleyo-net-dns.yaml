  ###
  # WWW records are pointing to the Wordpress.com account
  ###

  WWWRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Join ['.', [www, !Ref DomainName]]
      Type: CNAME
      TTL: 14400
      ResourceRecords:
        - !Ref DomainName

  WWWNoRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: A
      TTL: 14400
      ResourceRecords:
        - 192.0.78.24
        - 192.0.78.25