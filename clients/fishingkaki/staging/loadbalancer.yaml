AWSTemplateFormatVersion: 2010-09-09
Description: |
  This cloudformation template provisions a custom resource.
  This creates a load balancer, target group and route53 resource record.
  These resources will be terminated/recreated on a specific schedule.

Parameters: 

  OrgName:
    Description: The organization (iscale)
    Type: String
    Default: fishingkaki
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen
  EnvName:
    Description: The environment (Production, Staging, Development, etc)
    Type: String
    Default: Staging
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  BackendInstanceId:
    Description: The id of the backend instance that will be registered to the target group.
    Type: String
    Default: i-0eab6a440636bc259
  WebInstanceId:
    Description: The id of the web instance that will be registered to the target group.
    Type: String
    Default: i-0d1c347a06be83194
  ForumInstanceId:
    Description: The id of the forum instance that will be registered to the target group.
    Type: String
    Default: i-0eab6a440636bc259
  ClientDomainName:
    Description: The client's domain name (e.g. example.com, iscale-solutions.com).
    Type: String
    Default: fishingkaki.com.ph
  HostedZoneId:
    Description: The ID of the hosted zone that you want to create the record in.
    Type: String
    Default: Z2FD4L7QZLLQWY
  NetworkStackName:
    Description: The name of the network stack.
    Type: String
    Default: fishingkaki-stg-ase1-network
  SNSStackName:
    Description: the name of the SNS stack.
    Type: String
    Default: fishingkaki-prd-ase1-sns
  ElbType:
    Description: The type of Load Balancer.
    Type: String
    Default: application
    AllowedValues:
      - application
      - network
  Scheme:
    Description: Whether your Load Balancer is public (internet-facing) or private (internal).
    Type: String
    Default: internet-facing
    AllowedValues:
      - internal
      - internet-facing
  SslPolicy:
    Description: The SSL Policy used by the load balancer
    Type: String
    Default: ELBSecurityPolicy-TLS-1-2-2017-01
  ElbSource:
    Description: The source CiDR block which the load balancer accepts traffic.
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '((\d{1,3})\.){3}\d{1,3}/\d{1,2}'
  ElbPort:
    Description: The Load Balancer port.
    Type: Number
    Default: 443
  ElbProtocol:
    Description: The Load Balancer protocol.
    Type: String
    Default: HTTPS
    AllowedValues:
      - HTTP
      - HTTPS
      - TCP
      - TCP_UDP
      - TLS
      - UDP
  HealthCheckIntervalSeconds:
    Description: The approximate amount of time, in seconds, between health checks of an individual target
    Type: Number
    Default: 10
  HealthCheckPath:
    Description: The ping path that is the destination on the targets for health checks
    Type: String
    Default: /health.php
  HealthCheckTimeoutSeconds:
    Description: The amount of time, in seconds, during which no response from a target means a failed health check.
    Type: Number
    Default: 2
  HealthyThresholdCount:
    Description: The number of consecutive health checks successes required before considering an unhealthy target healthy
    Type: Number
    Default: 2
  UnhealthyThresholdCount:
    Description: The number of consecutive health check failures required before considering a target unhealthy
    Type: Number
    Default: 3
  HttpCodes:
    Description: The HTTP codes to use when checking for a successful response from a target
    Type: Number
    Default: 200
  InstancePort:
    Description: The port on which the targets receive traffic.
    Type: Number
    Default: 80
  CertificateArn:
    Description: The default certificate Arn to be attached to the Load Balancer.
    Type: String
    Default: arn:aws:acm:ap-southeast-1:482643916846:certificate/4fbdca70-e69a-458c-94a6-b981844220b7
  EnableWebAcl:
    Description: Set to true to enable Web ACL. Otherwise, set to false.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  EnableAlarm:
    Description: Set to true to enable cloudwatch alarm. Otherwise, set to false.
    Type: String
    Default: true
    AllowedValues:
      - true
      - false

Mappings: 
  EnvShort:
    Production:
      Name: prd
    Staging:
      Name: stg
    Development:
      Name: dev
    Test:
      Name: test
  RegionShort:
    us-east-2:
      Name: ue2
    us-east-1:
      Name: ue1
    us-west-1:
      Name: uw1
    us-west-2:
      Name: uw2
    ap-east-1:
      Name: ae1
    ap-south-1:
      Name: as1
    ap-northeast-1:
      Name: ane1
    ap-northeast-2:
      Name: ane2
    ap-northeast-3:
      Name: ane3
    ap-southeast-1:
      Name: ase1
    ap-southeast-2:
      Name: ase2
    ca-central-1:
      Name: cc1
    cn-north-1:
      Name: cn1
    cn-northwest-1:
      Name: cnw1
    eu-central-1:
      Name: ec1
    eu-west-1:
      Name: ew1
    eu-west-2:
      Name: ew2
    eu-west-3:
      Name: ew3
    eu-north-1:
      Name: en1
    me-south-1:
      Name: ms1
    sa-east-1:
      Name: se1
    us-gov-east-1:
      Name: uge1
    us-gov-west-1:
      Name: ugw1
  ElbTypeShort:
    application:
      Name: alb
    network:
      Name: nlb

Conditions:
  IsApplication: !Equals [!Ref ElbType, application]
  IsNetwork: !Equals [!Ref ElbType, network]
  IsElbSsl: !Equals [!Ref ElbPort, 443]
  IsInstanceSsl: !Equals [!Ref InstancePort, 443]
  IsEnableWebAcl: !Equals [!Ref EnableWebAcl, true]
  IsEnableAlarm: !Equals [!Ref EnableAlarm, true]

Resources:

####
# VPC Section
####

  DefaultSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Join [ '-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !FindInMap [ ElbTypeShort, !Ref ElbType, Name]]]
      GroupDescription: !Join [ '-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !FindInMap [ ElbTypeShort, !Ref ElbType, Name]]]
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
          - 
            Key: Name
            Value: !Join [ '-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !FindInMap [ ElbTypeShort, !Ref ElbType, Name]]]
          - 
            Key: Environment
            Value: !Ref EnvName
          - 
            Key: Organization
            Value: !Ref OrgName

  DefultSecurityGroupIngress1:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt DefaultSecurityGroup.GroupId
      IpProtocol: "tcp"
      FromPort: !Ref ElbPort
      ToPort: !Ref ElbPort
      CidrIp: !Ref ElbSource

  DefultSecurityGroupIngress2:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt DefaultSecurityGroup.GroupId
      IpProtocol: "tcp"
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref ElbSource

  DefultSecurityGroupEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt DefaultSecurityGroup.GroupId
      IpProtocol: -1
      FromPort: -1
      ToPort: -1
      CidrIp:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcCidrBlock"

####
# EC2 Section
####

  DefaultLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties: 
      IpAddressType: ipv4
      LoadBalancerAttributes: 
        - 
          Key: idle_timeout.timeout_seconds
          Value: 300
      Name: !Join [ '-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !FindInMap [ ElbTypeShort, !Ref ElbType, Name]]]
      Scheme: !Ref Scheme
      SecurityGroups: [!If [ IsApplication, !GetAtt DefaultSecurityGroup.GroupId, !Ref 'AWS::NoValue']]
      Subnets:
        - 
          Fn::ImportValue:
            !Sub "${NetworkStackName}-PublicSubnetId1"
        - 
          Fn::ImportValue:
            !Sub "${NetworkStackName}-PublicSubnetId2"
      Type: !Ref ElbType
      Tags:
          - 
            Key: Name
            Value: !Join [ '-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !FindInMap [ ElbTypeShort, !Ref ElbType, Name]]]
          - 
            Key: Environment
            Value: !Ref EnvName
          - 
            Key: Organization
            Value: !Ref OrgName

  # This listener redirects HTTP request to https
  DefaultLoadBalancerListener1:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: IsApplication
    Properties:
      DefaultActions: 
        - Type: "redirect"
          RedirectConfig:
            Protocol: "HTTPS"
            Port: "443"
            Host: "#{host}"
            Path: "/#{path}"
            Query: "#{query}"
            StatusCode: "HTTP_301"
      LoadBalancerArn: !Ref DefaultLoadBalancer
      Port: 80
      Protocol: HTTP

  # Listener for application load balancer
  DefaultLoadBalancerListener2:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: IsApplication
    Properties: 
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions: 
        - Type: "forward"
          TargetGroupArn: !Ref ApplicationTargetGroup
      LoadBalancerArn: !Ref DefaultLoadBalancer
      Port: !Ref ElbPort
      Protocol: !If [IsElbSsl, HTTPS, HTTP]
      SslPolicy: !Ref SslPolicy

  # Listener for application load balancer
  DefaultLoadBalancerListener3:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: IsNetwork
    Properties: 
      DefaultActions: 
        - Type: "forward"
          TargetGroupArn: !Ref NetworkTargetGroup
      LoadBalancerArn: !Ref DefaultLoadBalancer
      Port: !Ref ElbPort
      Protocol: !Ref ElbProtocol

  # Default Target Group

  # Application Target Group
  ApplicationTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: IsApplication
    Properties:
      Name: !Join [ '-', [ !Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !FindInMap [ ElbTypeShort, !Ref ElbType, Name ]] ]
      HealthCheckIntervalSeconds: !Ref HealthCheckIntervalSeconds
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckProtocol: !If [IsInstanceSsl, "HTTPS", "HTTP"]
      HealthCheckTimeoutSeconds: !Ref HealthCheckTimeoutSeconds
      HealthyThresholdCount: !Ref HealthyThresholdCount
      UnhealthyThresholdCount: !Ref UnhealthyThresholdCount
      Matcher: 
        HttpCode: !Ref HttpCodes
      Port: !Ref InstancePort
      Protocol: !If [IsInstanceSsl, "HTTPS", "HTTP"]
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
        - 
          Key: Name
          Value: !Join [ '-', [ !Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !FindInMap [ ElbTypeShort, !Ref ElbType, Name ]] ]
        - 
          Key: Environment
          Value: !Ref EnvName
        - 
          Key: Organization
          Value: !Ref OrgName

  # Network Target Group
  NetworkTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: IsNetwork
    Properties:
      Name: !Join [ '-', [ !Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !FindInMap [ ElbTypeShort, !Ref ElbType, Name ]] ]
      Port: !Ref InstancePort
      Protocol: !Ref InstancePort
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
        - 
          Key: Name
          Value: !Join [ '-', [ !Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !FindInMap [ ElbTypeShort, !Ref ElbType, Name ]] ]
        - 
          Key: Environment
          Value: !Ref EnvName
        - 
          Key: Organization
          Value: !Ref OrgName

  # Web Target Group
  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], webv2]]
      HealthCheckPath: /
      HealthCheckProtocol: "HTTP"
      Port: 80
      Protocol: "HTTP"
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], webv2]]
        - 
          Key: Environment
          Value: !Ref EnvName
        - 
          Key: Organization
          Value: !Ref OrgName

  # Web listener Rule
  WebListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties: 
      Actions: 
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup
      Conditions: 
        - Field: host-header
          Values: 
            - !Join ['.',[fkv2web-staging, !Ref ClientDomainName]]
      ListenerArn: !Ref DefaultLoadBalancerListener2
      Priority: 100

  # Backend Target Group
  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], backendv2]]
      HealthCheckPath: /
      HealthCheckProtocol: "HTTP"
      Port: 80
      Protocol: "HTTP"
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], backendv2]]
        - 
          Key: Environment
          Value: !Ref EnvName
        - 
          Key: Organization
          Value: !Ref OrgName

  # Backend listener Rule
  BackendListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties: 
      Actions: 
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup
      Conditions: 
        - Field: host-header
          Values: 
            - !Join ['.',[fkv2backend-staging, !Ref ClientDomainName]]
      ListenerArn: !Ref DefaultLoadBalancerListener2
      Priority: 101

  # Forum Target Group
  ForumTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], forumv2]]
      HealthCheckPath: /
      HealthCheckProtocol: "HTTP"
      Port: 80
      Protocol: "HTTP"
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], forumv2]]
        - 
          Key: Environment
          Value: !Ref EnvName
        - 
          Key: Organization
          Value: !Ref OrgName

  # Forum listener Rule
  ForumListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties: 
      Actions: 
        - Type: forward
          TargetGroupArn: !Ref ForumTargetGroup
      Conditions: 
        - Field: host-header
          Values:
            - !Join ['.',[forum-staging, !Ref ClientDomainName]]
      ListenerArn: !Ref DefaultLoadBalancerListener2
      Priority: 102

####
# WAF Section
####

  DefaultWebAcl:
    Type: AWS::WAFRegional::WebACL
    Condition: IsEnableWebAcl
    Properties: 
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], waf]]
      MetricName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], waf]]
      DefaultAction: 
        Type: ALLOW

  DefaultWebAclAssociation:
    Type: AWS::WAFRegional::WebACLAssociation
    Condition: IsEnableWebAcl
    Properties: 
      ResourceArn: !Ref DefaultLoadBalancer
      WebACLId: !Ref DefaultWebAcl

####
# Route53 Section
####

  # Web DNS Record
  WebDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Join ['.',[fkv2web-staging, !Ref ClientDomainName]]
      Type: A
      AliasTarget:
        DNSName: !GetAtt DefaultLoadBalancer.DNSName
        EvaluateTargetHealth: true
        HostedZoneId: !GetAtt DefaultLoadBalancer.CanonicalHostedZoneID

  # Backend DNS Record
  BackendDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Join ['.',[fkv2backend-staging, !Ref ClientDomainName]]
      Type: A
      AliasTarget:
        DNSName: !GetAtt DefaultLoadBalancer.DNSName
        EvaluateTargetHealth: true
        HostedZoneId: !GetAtt DefaultLoadBalancer.CanonicalHostedZoneID

  # Forum DNS Record
  ForumDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Join ['.',[forum-staging, !Ref ClientDomainName]]
      Type: A
      AliasTarget:
        DNSName: !GetAtt DefaultLoadBalancer.DNSName
        EvaluateTargetHealth: true
        HostedZoneId: !GetAtt DefaultLoadBalancer.CanonicalHostedZoneID

####
# IAM Section
####

  DefaultIamRole:
    Type: AWS::IAM::Role
    Properties:
      Path: "/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Principal:
              Service:
                - "lambda.amazonaws.com" 
            Action: 
              - "sts:AssumeRole"
      Policies:
        - 
          PolicyName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name]]]
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - 
                Effect: "Allow"
                Action: 
                  - elasticloadbalancing:RegisterTargets
                  - elasticloadbalancing:DeregisterTargets
                  - route53:ChangeResourceRecordSets
                Resource: "*"
              - 
                Effect: "Allow"
                Action: 
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"

####
# Custom Section
####

  AttachTargetGroup:
    Type: "Custom::AttachTargetGroup"
    Properties:
      ServiceToken: !GetAtt DefaultLambdaFunction.Arn
      WebTargetGroupArn: !Ref WebTargetGroup
      WebInstanceId: !Ref WebInstanceId
      BackendTargetGroupArn: !Ref BackendTargetGroup
      BackendInstanceId: !Ref BackendInstanceId
      ForumTargetGroupArn: !Ref ForumTargetGroup
      ForumInstanceId: !Ref ForumInstanceId
      Region: !Ref 'AWS::Region'

####
# Cloudwatch Section
####

  DefaultLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['/', ['/aws/lambda', !Ref DefaultLambdaFunction]]

  UnhealthyHostCountCloudWatchAlarm1:
    Type: AWS::CloudWatch::Alarm
    Condition: IsEnableAlarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], webv2-unhealthy-host-count]]
      MetricName: UnHealthyHostCount
      Namespace: "AWS/ApplicationELB"
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Maximum
      Threshold: 1
      AlarmActions:
        - Fn::ImportValue:
              !Sub "${SNSStackName}-TopicArn"
      OKActions:
        - Fn::ImportValue:
              !Sub "${SNSStackName}-TopicArn"
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt DefaultLoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt WebTargetGroup.TargetGroupFullName

  UnhealthyHostCountCloudWatchAlarm2:
    Type: AWS::CloudWatch::Alarm
    Condition: IsEnableAlarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], backendv2-unhealthy-host-count]]
      MetricName: UnHealthyHostCount
      Namespace: "AWS/ApplicationELB"
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Maximum
      Threshold: 1
      AlarmActions:
        - Fn::ImportValue:
              !Sub "${SNSStackName}-TopicArn"
      OKActions:
        - Fn::ImportValue:
              !Sub "${SNSStackName}-TopicArn"
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt DefaultLoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt BackendTargetGroup.TargetGroupFullName

  UnhealthyHostCountCloudWatchAlarm3:
    Type: AWS::CloudWatch::Alarm
    Condition: IsEnableAlarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], forum-unhealthy-host-count]]
      MetricName: UnHealthyHostCount
      Namespace: "AWS/ApplicationELB"
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Maximum
      Threshold: 1
      AlarmActions:
        - Fn::ImportValue:
              !Sub "${SNSStackName}-TopicArn"
      OKActions:
        - Fn::ImportValue:
              !Sub "${SNSStackName}-TopicArn"
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt DefaultLoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt ForumTargetGroup.TargetGroupFullName

####
# Lambda Section
####

  DefaultLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], attach-targetgroupv2]]
      Handler: index.lambda_handler
      Role: !GetAtt DefaultIamRole.Arn
      Runtime: python3.6
      Timeout: 900
      Code:
        ZipFile: |

          import boto3
          import cfnresponse
          import json
          import logging
          import time

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          elb = boto3.client('elbv2')

          def lambda_handler(event, context):

            logger.info('Event:' + json.dumps(event))
            request_type = event['RequestType']
            
            responseData={}
            physicalResourceId={}

            webTargetGroupArn=event['ResourceProperties']['WebTargetGroupArn']
            backendTargetGroupArn=event['ResourceProperties']['BackendTargetGroupArn']
            forumTargetGroupArn=event['ResourceProperties']['ForumTargetGroupArn']

            webInstanceId=event['ResourceProperties']['WebInstanceId']
            backendInstanceId=event['ResourceProperties']['BackendInstanceId']
            forumInstanceId=event['ResourceProperties']['ForumInstanceId']

            region=event['ResourceProperties']['Region']

            try:
              if request_type in ['Create', 'Update']:
                elb.register_targets(
                      TargetGroupArn=webTargetGroupArn,
                      Targets=[
                          {
                              'Id': webInstanceId,
                              'Port': 80
                          },
                      ]
                  )

                elb.register_targets(
                      TargetGroupArn=backendTargetGroupArn,
                      Targets=[
                          {
                              'Id': backendInstanceId,
                              'Port': 80
                          },
                      ]
                  )

                # elb.register_targets(
                #       TargetGroupArn=forumTargetGroupArn,
                #       Targets=[
                #           {
                #               'Id': forumInstanceId,
                #               'Port': 80
                #           },
                #       ]
                #   )

              if request_type == 'Delete':
                elb.deregister_targets(
                      TargetGroupArn=webTargetGroupArn,
                      Targets=[
                          {
                              'Id': webInstanceId,
                              'Port': 80
                          },
                      ]
                  )

                elb.deregister_targets(
                      TargetGroupArn=backendTargetGroupArn,
                      Targets=[
                          {
                              'Id': backendInstanceId,
                              'Port': 80
                          },
                      ]
                  )

                # elb.deregister_targets(
                #       TargetGroupArn=forumTargetGroupArn,
                #       Targets=[
                #           {
                #               'Id': forumInstanceId,
                #               'Port': 80
                #           },
                #       ]
                #   )

              send(event, context, cfnresponse.SUCCESS, responseData, physicalResourceId)
              return
            except Exception:

              logger.exception('Error Encountered')
              send(event, context, cfnresponse.FAILED, responseData, physicalResourceId)
              return

          def send(event, context, responseStatus, responseData, physicalResourceId=None):
            resourceId = physicalResourceId or context.log_stream_name
            responseBody = {'Status': responseStatus,
                            'Reason': 'See the details in CloudWatch Log Stream: ' + context.log_stream_name,
                            'PhysicalResourceId': resourceId,
                            'StackId': event['StackId'],
                            'RequestId': event['RequestId'],
                            'LogicalResourceId': event['LogicalResourceId'],
                            'Data': responseData}
            logger.info('RESPONSE BODY:' + json.dumps(responseBody))
            cfnresponse.send(event, context, responseStatus, responseData, resourceId)

