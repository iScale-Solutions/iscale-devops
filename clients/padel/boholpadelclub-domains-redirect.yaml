      Name: bohol-padel-club.com

  BoholDashPadelDashClubDotComSSLCert:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: bohol-padel-club.com
      SubjectAlternativeNames:
        - www.bohol-padel-club.com
      ValidationMethod: DNS

  BoholDashPadelDashClubDotComSSLValidationRecord1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref BoholDashPadelDashClubDotComHostedZone
      Name: _f2e44ccb4b48539848045a6834a4154e.bohol-padel-club.com.
      Type: CNAME
      TTL: 14400
      ResourceRecords:
        - _34939d5b6ed2a0f2a52e8260cde2fddc.xlfgrmvvlj.acm-validations.aws.

  BoholDashPadelDashClubDotComSSLValidationRecord2:
