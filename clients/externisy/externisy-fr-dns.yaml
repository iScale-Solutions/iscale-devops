  EW3DKIMRecord1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Join ['.',[chanchbnxeuolsyb3s56mfr2kuvy2fm2._domainkey, !Ref DomainName]]
      ResourceRecords: 
        - chanchbnxeuolsyb3s56mfr2kuvy2fm2.dkim.amazonses.com
      TTL: 14400
      Type: CNAME
      Comment: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], dkim1]]

  EW3DKIMRecord2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Join ['.',[a2vbafqvyu7iizwgh6ndsfsajvcnhtht._domainkey, !Ref DomainName]]
      ResourceRecords: 
