  CarinaRDSPH:
    DeletionPolicy: Delete
    Type: AWS::RDS::DBInstance
    Properties:
      DeletionProtection: !Ref DeletionProtection
      DBInstanceClass: db.r5.8xlarge
      DBInstanceIdentifier: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], carina-script-PH]]
      # DBSnapshotIdentifier: !Ref DBSnapshotIdentifier
      DBSnapshotIdentifier: arn:aws:rds:ap-southeast-1:337564481418:snapshot:rds:dbss-uat-zone-02-2020-12-11-16-42
      # DBParameterGroupName: !Ref DBParameterGroupName
      DBParameterGroupName: !Ref CarinaTestMySQL8ParameterGroup
      # DBSubnetGroupName: !If [IsStaging, !Ref StagingDBSubnetGroup, !Ref DBSubnetGroup]
      DBSubnetGroupName: !Ref DBSubnetGroup
      Engine: mysql
      EngineVersion: 8.0.21
      MultiAZ: false
      PubliclyAccessible: false
      StorageEncrypted: true
      StorageType: gp2
      VPCSecurityGroups: 
        - !Ref CarinaRDSSecurityGroup


  DMSTargetPH:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/db-shard.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        AllocatedStorage: 500
        Iops: 25000
        DBSchemaName: dbpSEAOMSPH01
        DBParameterGroupName: !Ref CarinaTestMySQL8ParameterGroup
        # BackupRetentionPeriod: !Ref BackupRetentionPeriod
        DBSubnetGroup: !Ref DBSubnetGroup
        # DeletionProtection: true
        # EnableReadReplica: !If [IsProd, true, false]
        # EnablePerformanceInsights: !Ref EnablePerformanceInsights
        # InstanceClass: !If [IsProd, db.r5.xlarge, db.r5.large]
        InstanceClass: db.r5.xlarge
        MasterUser: ssdba
        MasterUserPassword: password
        MaxAllocatedStorage: 1000
        MultiAz: false
        SecurityGroup: !Ref CarinaRDSSecurityGroup
        ShardName: phdms
        VPC: !Ref VPC
        VPCDNSStackName: !Ref VPCDNSStackName
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName

  PHDMS:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/dms.yaml
      Parameters:
        Name: !Join ['-', [!Ref Name, 'phdms']]
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        # DMSReplicationSubnetGroup: !Ref DMSReplicationSubnetGroup
        DMSReplicationSubnetGroup: anchanto-sus-stg
        SourceEndpoint: anchanto-sus-stg-ph.cbudzbiqnbgm.ap-southeast-1.rds.amazonaws.com
        SourceSchemaName: dbSSOMS
        SourceSecurityGroup: !Ref CarinaRDSSecurityGroup
        SourceUser: root
        SourceUserPassword: '@litubARK$oNID2020geNP'
        TargetEndpoint: 
          Fn::GetAtt:
            - DMSTargetPH
            - Outputs.ShardRDSInstanceEndpoint
        TargetSchemaName: dbpSEAOMSPH01
        TargetSecurityGroup: !Ref CarinaRDSSecurityGroup
        TargetUser: ssdba
        TargetUserPassword: password
        TableMappings: "{ \"rules\": [  { \"rule-type\": \"selection\", \"rule-id\": \"1\", \"rule-name\": \"1\", \"object-locator\": { \"schema-name\": \"dbSSOMS\", \"table-name\": \"mpc_addresses\" }, \"rule-action\": \"exclude\" },
                                        { \"rule-type\": \"selection\", \"rule-id\": \"2\", \"rule-name\": \"2\", \"object-locator\": { \"schema-name\": \"dbSSOMS\", \"table-name\": \"mpc_customer_addresses\" }, \"rule-action\": \"exclude\" },
                                        { \"rule-type\": \"selection\", \"rule-id\": \"3\", \"rule-name\": \"3\", \"object-locator\": { \"schema-name\": \"dbSSOMS\", \"table-name\": \"mpc_state_changes\" }, \"rule-action\": \"exclude\" },
