AWSTemplateFormatVersion: 2010-09-09
Description: Provision a DB shard

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Database Configuration
        Parameters:
          - InstanceClass
          - ParameterGroupName
          - DBSnapshotIdentifier
          - DBSubnetGroup
          - SecurityGroup
          - VPC
      - Label:
          default: Cloudformation Stack Configuration
        Parameters:
          - VPCDNSStackName
          - NetworkStackName
          - SNSStackName

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      # DBParameterGroupName:
      #   default: Parameter Group Name to use
      DBSnapshotIdentifier:
        default: DB Snapshot Identifier
      DBSubnetGroup:
        default: DB Subnet Group
      DeletionProtection:
        default: Deletion Protection
      MultiAz:
        default: Multi AZ
      Port:
        default: Port
      InstanceClass:
        default: Instance Class
      SecurityGroup:
        default: Security Group
      NetworkStackName:
        default: Network Stack
      VPCDNSStackName:
        default: VPC DNS Stack
      SNSStackName:
        default: SNS Stack

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 8
    Default: sus
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: anchanto
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  # DBParameterGroupName:
  #   Description: DB Parameter Group Name
  #   Type: String
  #   MinLength: 1
  #   Default: anchanto-sus-prd-db-shards-mysql8parametergroup-1cr918izijrgk
  DBSnapshotIdentifier:
    Description: DB Snapshot Identifier
    Type: String
    Default: arn:aws:rds:ap-southeast-1:337564481418:snapshot:dbselluseller-carina-prod-2tb-dec-6-2020-before-shards-v2
  DBSubnetGroup:
    Description: DB Subnet Group
    Default: mpc production db subnet group
    Type: String
  DeletionProtection:
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  VPC:
    Description: VPC to use for shards
    Type: AWS::EC2::VPC::Id
    Default: vpc-32f32f56
  SecurityGroup:
    Description: Security Group for shard instances
    Type: AWS::EC2::SecurityGroup::Id
    Default: sg-ae866dc9
  NetworkStackName:
    Description: The name of the cloudformation Network stack
    Type: String
    Default: anchanto-prd-network
  SNSStackName:
    Description: The name of the cloudformation SNS stack
    Type: String
    Default: anchanto-prd-sns
  VPCDNSStackName:
    Description: VPC DNS Stack Name
    Type: String
    Default: anchanto-prd-vpc-dns

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml

Resources:

  CarinaTestMySQL8ParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, params]]
      Family: mysql8.0
      Parameters:
        general_log: 0
        log_output: FILE
        long_query_time: 5
        slow_query_log: 1
        innodb_flush_log_at_trx_commit: 2
      Tags:
        - Key: Name
          Value: MySQL 8 Parameter Group

  # StagingDBSubnetGroup:
  #   Condition: IsStaging
  #   Type: AWS::RDS::DBSubnetGroup
  #   Properties: 
  #     DBSubnetGroupDescription: !Join [' ', [!Ref 'AWS::StackName', 'DB Subnet Group']]
  #     SubnetIds: 
  #       - Fn::ImportValue:
  #             Fn::Sub: "${NetworkStackName}-PrivateSubnetId1"
  #       - Fn::ImportValue:
