                                        { \"rule-type\": \"selection\", \"rule-id\": \"6\", \"rule-name\": \"6\", \"object-locator\": { \"schema-name\": \"dbSSOMS\", \"table-name\": \"versions\" }, \"rule-action\": \"exclude\" },
                                        { \"rule-type\": \"selection\", \"rule-id\": \"7\", \"rule-name\": \"7\", \"object-locator\": { \"schema-name\": \"dbSSOMS\", \"table-name\": \"%\" }, \"rule-action\": \"include\" }
        ] }"
        VPC: !Ref VPC
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName

