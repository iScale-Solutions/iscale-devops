####
# Special roles and artifacts for Johann to use Glue
####

  JohannGlueS3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: johann-glue
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  JohannCustomAccessGroup:
    Type: AWS::IAM::Group
    Properties: 
      ManagedPolicyArns: 
        - arn:aws:iam::aws:policy/ReadOnlyAccess
        - arn:aws:iam::aws:policy/AWSGlueConsoleFullAccess
        - arn:aws:iam::aws:policy/AwsGlueDataBrewFullAccessPolicy
      Policies:
        - PolicyName: S3AccessGlueBucket
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: 's3:*'
                Resource: 
                  - !Join [ '', ['arn:aws:s3:::', !Ref JohannGlueS3Bucket, '/*']]
                  - !Join [ '', ['arn:aws:s3:::', !Ref JohannGlueS3Bucket, '']]

  JohannIAMUser:
    Type: AWS::IAM::User
    Properties: 
      UserName: johann@iscale-solutions.com
      Groups: 
        - !Ref JohannCustomAccessGroup

  GlueIamRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: glue.amazonaws.com
      # ManagedPolicyArns:
      #   - arn:aws:iam::aws:policy/AdministratorAccess
      Path: /
      Policies:
        - PolicyName: S3AccessGlueBucket
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: 's3:*'
                Resource: 
                  - !Join [ '', ['arn:aws:s3:::', !Ref JohannGlueS3Bucket, '/*']]
                  - !Join [ '', ['arn:aws:s3:::', !Ref JohannGlueS3Bucket, '']]
Outputs:

  CarinaRDSSecurityGroup:
    Value: !Ref CarinaRDSSecurityGroup