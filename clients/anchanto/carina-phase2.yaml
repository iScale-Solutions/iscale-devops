  CarinaRDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Carina Phase 2 RDS Security Group
      VpcId: !Ref VPC

  CarinaEC2ScriptSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Carina Phase 2 EC2 Security Group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 0
          ToPort: 65535
          CidrIp: 0.0.0.0/0

  CarinaRDSSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      Description: Allow Carina EC2 script into the DB instance
      IpProtocol: TCP
      GroupId: !Ref CarinaRDSSecurityGroup
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref CarinaEC2ScriptSecurityGroup
  
  CarinaRDSSecurityGroupIngressFromShafique:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      Description: Allow Carina EC2 script into the DB instance
      IpProtocol: TCP
      GroupId: !Ref CarinaRDSSecurityGroup
      FromPort: 3306
      ToPort: 3306
      CidrIp: 10.2.192.153/32

  CarinaRDSSecurityGroupIngressFromGlue:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      Description: Allow Glue Into the DB instance
      IpProtocol: TCP
      FromPort: 0
      ToPort: 65535
      GroupId: !Ref CarinaRDSSecurityGroup
      SourceSecurityGroupId: !Ref CarinaRDSSecurityGroup
 
  CarinaScriptEC2PH:
    Type: AWS::EC2::Instance
    Properties: 
      DisableApiTermination: !Ref DeletionProtection
      ImageId: ami-03b4aa7b203f9d1f9
      # KeyName: AnalyticsServers
      KeyName: Johann
      InstanceType: t3.micro
      NetworkInterfaces: 
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          GroupSet: 
            - !Ref CarinaEC2ScriptSecurityGroup
          SubnetId: 
            Fn::ImportValue:
              Fn::Sub: "${NetworkStackName}-PublicSubnetId1"
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], 'carina-script-PH']]
  
  CarinaScriptEC2MY:
    Type: AWS::EC2::Instance
    Properties: 
      DisableApiTermination: !Ref DeletionProtection
      ImageId: ami-03b4aa7b203f9d1f9
      KeyName: AnalyticsServers
      InstanceType: t3.micro
      NetworkInterfaces: 
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          GroupSet: 
            - !Ref CarinaEC2ScriptSecurityGroup
          SubnetId: 
            Fn::ImportValue:
              Fn::Sub: "${NetworkStackName}-PublicSubnetId1"
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], 'carina-script-MY']]

