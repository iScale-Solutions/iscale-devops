  ThinkBitGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], ThinkBit, group]]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      Policies:
        - PolicyName: ThinkBitAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: Beanstalk
                Effect: Allow
                Action:
                  - elasticbeanstalk:*
                Resource:
                  - 'arn:aws:elasticbeanstalk:ap-southeast-1:${AWS::AccountId}:environment/alpha-canonph-app*'
              - Sid: RDS
                Effect: Allow
                Action:
                  - rds:*
                Resource:
                  - 'arn:aws:rds:ap-southeast-1:${AWS::AccountId}:db:alpha-canonph-app'
              - Sid: S3
                Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - 'arn:aws:s3:::alpha-canonph-app'
                  - 'arn:aws:s3:::alpha-canonph-app/*'
              - Sid: EC2
                Effect: Allow
                Action:
                  - ec2:*
                Resource:
                  - 'arn:aws:ec2:ap-southeast-1:${AWS::AccountId}:instance/i-0a4958342501e28d0'
              - Sid: ALB
                Effect: Allow
                Action:
                  - elasticloadbalancing:*
                Resource:
                  - 'arn:aws:elasticloadbalancing:ap-southeast-1:${AWS::AccountId}:loadbalancer/app/awseb-AWSEB-716ADBQZA616/*'
              - Sid: ASG
                Effect: Allow
                Action:
                  - autoscaling:*
                Resource:
                  - 'arn:aws:autoscaling:ap-southeast-1:${AWS::AccountId}:autoScalingGroup:25f60029-13e2-46ee-be4e-9b7f5816ff45:autoScalingGroupName/awseb-e-*'

###
# Terraform access
###

  TerraformGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], terraform, group]]
      Policies:
        - PolicyName: TerraformAlphaAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: RDSAlphaTagsAccess
                Effect: Allow
                Action:
                  - rds:*
                  - ec2:*
                  - iam:*
                  - vpc:*
                  - s3:*
                  - autoscaling:*
                  - cloudwatch:*
                  - elasticbeanstalk:*
                  - elasticloadbalancing:*
                Resource:
                  - '*'
              - Sid: AllowCloudformationOperationsOnElasticBeanstalkStacks
                Effect: Allow
                Action:
                  - cloudformation:*
                Resource:
                  - arn:aws:cloudformation:*:*:stack/awseb-*
                  - arn:aws:cloudformation:*:*:stack/eb-*

  TerraformUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], terraform, user]]
      Groups: 
        - !Ref TerraformGroup

  TerraformUserAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref TerraformUser  

