##
# ThinkBit Staff
##

  ThinkBitIAMUser:
    Type: AWS::IAM::User
    Properties:
      LoginProfile:
        Password: TempJKWEsaYw38!
        PasswordResetRequired: true
      UserName: developer@thinkbitsolutions.com
      Groups:
        - !Ref ThinkBitGroup
        - MFA
      ManagedPolicyArns:
        - !Sub arn:aws:iam::${AWS::AccountId}:policy/iam_app_beanstalk_policy
        - arn:aws:iam::aws:policy/AWSCertificateManagerFullAccess
        - arn:aws:iam::aws:policy/AmazonEventBridgeReadOnlyAccess
      Policies:
        - PolicyName: ImportCreateEC2KeyPair
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: VisualEditor0
                Effect: Allow
                Action:
                  - ec2:ImportKeyPair
                  - ec2:CreateKeyPair
                Resource: '*'
      Tags:
        - Key: Name
          Value: Jerameel Cruz
        - Key: Email
          Value: developer@thinkbitsolutions.com

  ThinkBitGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], ThinkBit, group]]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonRDSReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/AWSCertificateManagerReadOnly
        - arn:aws:iam::aws:policy/AWSCloudFormationReadOnlyAccess
        - arn:aws:iam::aws:policy/CloudWatchFullAccess
        - arn:aws:iam::aws:policy/ElasticLoadBalancingFullAccess
        - arn:aws:iam::aws:policy/AmazonEventBridgeReadOnlyAccess
        - arn:aws:iam::aws:policy/AWSSecretsManagerClientReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonSESFullAccess
      Policies:
        - PolicyName: CanonDevAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: RDS
                Effect: Allow
                Action:
                  - rds:*
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/project:
                      - canon-dev
              - Sid: EC2
                Effect: Allow
                Action:
                  - ec2:*
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/project:
                      - canon-dev
        - PolicyName: SSM
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: RDS
                Effect: Allow
                Action:
                  - rds:*
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/project:
                      - canon-dev
              - Sid: RDSCreateDBSnapshot
                Effect: Allow
                Action:
                  - rds:CreateDBSnapshot
                Resource: !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:*'
              - Sid: ElasticBeanstalk
                Effect: Allow
                Action:
                  - elasticbeanstalk:*
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/project:
                      - canon-dev
              - Sid: EC2
                Effect: Allow
                Action:
                  - ec2:*
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/project:
                      - canon-dev
              - Sid: CloudFormationIAM
                Effect: Allow
                Action:
                  - cloudformation:*
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/project:
                      - canon-dev
              - Sid: SSMReadOnly
                Effect: Allow
                Action:
                  - ssm:List*
                  - ssm:Describe*
                Resource:
                  - '*'
              - Sid: SSMModification
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:LabelParameterVersion
                  - ssm:DeleteParameter
                  - ssm:UnlabelParameterVersion
                  - ssm:GetParameterHistory
                  - ssm:GetParametersByPath
                  - ssm:GetParameters
                  - ssm:GetParameter
                  - ssm:DeleteParameters
                Resource:
                  - !Sub 'arn:aws:ssm:*:${AWS::AccountId}:parameter/*'
              - Sid: Events
                Effect: Allow
                Action:
                  - events:PutRule
                  - events:Put*
                  - events:Get*
                  - events:List
                Resource: '*'
        - PolicyName: AutoScalingAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: AllowASGManagementForCanonDevProject
                Effect: Allow
                Action:
                  - autoscaling:*
                Resource: '*'
                Condition:
                  StringEquals:
                    autoscaling:ResourceTag/Project: canon-dev
        - PolicyName: cmp-delightful-app-s3-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: arn:aws:s3:::cmp-delightful-app-staging-src
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: arn:aws:s3:::cmp-delightful-app-staging-src/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: arn:aws:s3:::staging-canonph-app/*
        - PolicyName: Lambda
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: LambdaListAndConsoleRead
                Effect: Allow
                Action:
                  - lambda:List*
                  - lambda:Get*
                Resource: '*'
              - Sid: ManageDelightfulLambdaFunctions
                Effect: Allow
                Action:
                  - lambda:Create*
                  - lambda:Update*
                  - lambda:UpdateFunctionCode
                  - lambda:Delete*
                  - lambda:Invoke*
                  - lambda:PublishVersion
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:SES_CloudWatchLogs_Lambda
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: SecretsManagerListSecret
                Effect: Allow
                Action:
                  - secretsmanager:ListSecrets
                Resource: '*'
              - Sid: SecretsManagerGetAndDescribeSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                  - secretsmanager:BatchGetSecretValue
                Resource: arn:aws:secretsmanager:*:*:secret:*
              - Sid: KMSDecryptKey
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: arn:aws:kms:*:*:key/*
                Condition:
                  StringLike:
                    kms:EncryptionContext:SecretARN: arn:aws:secretsmanager:*:*:secret:*
                    kms:ViaService: secretsmanager.*.amazonaws.com
        - PolicyName: SES
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: AllowSESSendEmail
                Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                  - ses:SendTemplatedEmail
                Resource: '*'
              - Sid: AllowViewSESIdentities
                Effect: Allow
                Action:
                  - ses:List*
                  - ses:GetIdentityVerificationAttributes
                  - ses:GetIdentityDkimAttributes
                  - ses:GetIdentityMailFromDomainAttributes
                  - ses:ListIdentities
                  - ses:ListVerifiedEmailAddresses
                  - ses:GetSendQuota
                  - ses:GetSendStatistics
                  - ses:VerifyEmailIdentity
                  - ses:VerifyDomainIdentity
                  - ses:VerifyDomainDkim
                  - ses:DeleteIdentity
                  - ses:SetIdentityMailFromDomain
                Resource: '*'
        - PolicyName: SSMAccessOnEC2
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: SSMReadForConsole
                Effect: Allow
                Action:
                  - ssm:Describe*
                  - ssm:Get*
                  - ssm:List*
                  - ec2:DescribeInstances
                  - ec2:DescribeTags
                Resource: '*'
              - Sid: AllowStartSessionUsingRunShellDocuments
                Effect: Allow
                Action:
                  - ssm:StartSession
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/SSM-SessionManagerRunShell
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/AWS-StartInteractiveCommand
              - Sid: AllowStartSessionOnlyToNamedInstance
                Effect: Allow
                Action:
                  - ssm:StartSession
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/Name: cmp-delightful-staging
              - Sid: AllowDefaultSessionDocument
                Effect: Allow
                Action:
                  - ssm:StartSession
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/SSM-SessionManagerRunShell
              - Sid: AllowOwnSessionLifecycle
                Effect: Allow
                Action:
                  - ssm:ResumeSession
                  - ssm:TerminateSession
                Resource: arn:aws:ssm:*:*:session/${aws:userid}-*
              - Sid: AllowOpenDataChannel
                Effect: Allow
                Action:
                  - ssmmessages:OpenDataChannel
                Resource: '*'

###
# Terraform access
###

  TerraformGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], terraform, group]]
      Policies:
        - PolicyName: TerraformBetaAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: Access
                Effect: Allow
                Action:
                  - rds:*
                  - ec2:*
                  - iam:*
                  - vpc:*
                  - s3:*
                  - autoscaling:*
                  - cloudwatch:*
                  - elasticbeanstalk:*
                  - elasticloadbalancing:*
                Resource:
                  - '*'
              - Sid: AllowCloudformationOperationsOnElasticBeanstalkStacks
                Effect: Allow
                Action:
                  - cloudformation:*
                Resource:
                  - arn:aws:cloudformation:*:*:stack/awseb-*
                  - arn:aws:cloudformation:*:*:stack/eb-*

  TerraformUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], terraform, user]]
      Groups:
        - !Ref TerraformGroup

  TerraformUserAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref TerraformUser
