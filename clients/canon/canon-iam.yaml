AWSTemplateFormatVersion: 2010-09-09
Description: This cloudformation template provisions IAM resources

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - OrgName
          - EnvName

    ParameterLabels:
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name

Parameters:
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: canon
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml

Resources:

####
# IAM
####

  CITechDeveloperGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: CITechDevelopers
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
        - arn:aws:iam::aws:policy/IAMUserChangePassword
      Policies:
        - PolicyName: SSMAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: TerminateSSM
                Effect: Allow
                Action:
                  - ssm:ResumeSession
                  - ssm:TerminateSession
                Resource:
                  - arn:aws:ssm:*:*:session/${aws:username}-*
              - Sid: AllowSSMinEC2
                Effect: Allow
                Action:
                  - ssm:StartSession
                Resource: 
                  - 'arn:aws:ec2:*:*:instance/i-0b8907cf5fecac213'
                  - 'arn:aws:ec2:*:*:instance/i-02f950d6ca9552970'
                  - 'arn:aws:ec2:*:*:instance/i-0af5fe896478311a7'
                  - 'arn:aws:ec2:*:*:instance/i-0e74a628db0824f9b'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/SSM-SessionManagerRunShell'
              - Sid: AccessPSSS3Bucket
                Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - arn:aws:s3:::canon-prd-ase1-pss
                  - arn:aws:s3:::canon-prd-ase1-pss/*

