AWSTemplateFormatVersion: 2010-09-09
Description: PSS Resources

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
      - Label:
          default: Load Balancer Configuration
        Parameters:
          - ClientDomainName
          - LoadBalancerCertificateArn
      - Label:
          default: Rest Instance Configuration
        Parameters:
          - RestServerAMI
          - RestServerPort
          - RestServerType
      - Label:
          default: Web Instance Configuration
        Parameters:
          - WebServerAMI
          - WebServerPort
          - WebServerType
      - Label:
          default: Scheduler Configuration
        Parameters:
          - StartScheduleExpression
          - StopScheduleExpression

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      InstanceAMI:
        default: Instance AMI ID
      LoadBalancerCertificateArn:
        default: Load Balancer SSL Certificate ARN
      NetworkStackName:
        default: Network Stack Name
      RestServerAMI:
        default: Rest Server AMI
      RestServerPort:
        default: Rest server port
      RestServerType:
        default: Rest Server machine type
      SNSStackName:
        default: SNS Topic Stack Name
      WebServerAMI:
        default: Web Server AMI
      WebServerPort:
        default: Web server port
      WebServerType:
        default: Web Server machine type
      StartScheduleExpression:
        default: Start Schedule CRON Expression
      StopScheduleExpression:
        default: Stop Schedule CRON Expression

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name)
    Type: String
    MinLength: 3
    MaxLength: 9
    Default: pss
  OrgName:
    Description: The name of the organization
    Type: String
    Default: canon
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  LoadBalancerCertificateArn:
    Description: SSL Certificate for the ELB
    Type: String
    Default: arn:aws:acm:ap-southeast-1:780347486043:certificate/3b81b0f7-2210-4d89-afcf-5e9a422a57b0
  NetworkStackName:
    Description: The name of the network stack
    Type: String
    Default: canon-prd-ase1-pss-network
    MinLength: 1
  RestServerAMI:
    Description: Web Server AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-0ff89c4ce7de192ea #Will change later
  RestServerPort:
    Description: The port number on which the rest server accepts connections.
    Type: Number
    Default: 8000
    MinValue: 1
    MaxValue: 65535
  RestServerType:
    Description: Type of instance for app server
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
  SNSStackName:
    Description: The name of the SNS stack
    Type: String
    Default: canon-prd-ase1-sns
    MinLength: 1
  StartScheduleExpression:
    Description: Schedule expression when to start the objects
    Type: String
    Default: cron(0 0 ? * MON-FRI *)
  StopScheduleExpression:
    Description: Schedule expression when to stop the objects
    Type: String
    Default: cron(0 10 ? * MON-FRI *)
  WebServerAMI:
    Description: Web Server AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-0ff89c4ce7de192ea #Will change later
  WebServerPort:
    Description: The port number on which the web server accepts connections.
    Type: Number
    Default: 8000
    MinValue: 1
    MaxValue: 65535
  WebServerType:
    Description: Type of instance for the rest server
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium 

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml

Resources:

  DBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/database.yaml
      Parameters:
        Name: !Ref Name
        DatabaseName: !Join ['',[!Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], db]]
        AllocatedStorage: 20
        BackupRetentionPeriod: !If [IsProd, 30, 7]
        DeletionProtection: !If [IsProd, true, false]
        EnableEnhancedMonitoring: !If [IsProd, true, false]
        EnablePerformanceInsights: false
        EnvName: !Ref EnvName
        Engine: mysql
        EngineVersion: 8.0.28
        Family: mysql8.0
        InstanceType: db.t3.medium
        MasterUser: root
        MultiAz: !If [IsProd, true, false]
        NetworkStackName: !Ref NetworkStackName
        OrgName: !Ref OrgName
        SNSStackName: !Ref SNSStackName
        StorageEncrypted: true

  DBSchedulerStack:
    DependsOn:
      - DBStack
    Condition: IsNotProd
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: FALSE
        DatabaseInstanceName:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBInstanceName

  ELBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/loadbalancer.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        CertificateArn: !Ref LoadBalancerCertificateArn
        DeletionProtection: !If [IsProd, true, false]
        IdleTimeout: 600
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName
  
  AllowCSPLPenTestIntoELBHTTPS:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow Pentest on HTTPS
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - ELBStack
          - Outputs.SecurityGroupId
      FromPort: 443
      ToPort: 443
      CidrIp: 64.39.96.0/20


  AllowCSPLPenTestIntoELBHTTP:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow Pentest on HTTP
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - ELBStack
          - Outputs.SecurityGroupId
      FromPort: 80
      ToPort: 80
      CidrIp: 64.39.96.0/20

  AllowCMPIntoELBHTTPS1:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow Canon 1 on HTTPS
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - ELBStack
          - Outputs.SecurityGroupId
      FromPort: 443
      ToPort: 443
      CidrIp: 112.199.118.200/29

  AllowCMPIntoELBHTTP1:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow Canon 1 on HTTP
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - ELBStack
          - Outputs.SecurityGroupId
      FromPort: 80
      ToPort: 80
      CidrIp: 112.199.118.200/29

  AllowCMPIntoELBHTTPS2:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow Canon 2 on HTTPS
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - ELBStack
          - Outputs.SecurityGroupId
      FromPort: 443
      ToPort: 443
      CidrIp: 161.49.89.208/28

  AllowCMPIntoELBHTTP2:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow Canon 2 on HTTP
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - ELBStack
          - Outputs.SecurityGroupId
      FromPort: 80
      ToPort: 80
      CidrIp: 161.49.89.208/28

  AllowCMPIntoELBHTTPS3:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow Canon 3 on HTTPS
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - ELBStack
          - Outputs.SecurityGroupId
      FromPort: 443
      ToPort: 443
      CidrIp: 202.136.165.130/32

  AllowCMPIntoELBHTTP3:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow Canon 3 on HTTP
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - ELBStack
          - Outputs.SecurityGroupId
      FromPort: 80
      ToPort: 80
      CidrIp: 202.136.165.130/32

  AllowCitechIntoELBHTTPS:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow Citech on HTTPS
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - ELBStack
          - Outputs.SecurityGroupId
      FromPort: 443
      ToPort: 443
      CidrIp: 111.125.113.106/32

  AllowCitechIntoELBHTTP:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow Citech on HTTP
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - ELBStack
          - Outputs.SecurityGroupId
      FromPort: 80
      ToPort: 80
      CidrIp: 111.125.113.106/32

  AllowVPCIntoELBHTTP:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow VPC Traffic on HTTP
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - ELBStack
          - Outputs.SecurityGroupId
      FromPort: 80
      ToPort: 80
      CidrIp:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcCidrBlock"

  AllowVPCIntoELBHTTPS:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow VPC Traffic on HTTPS
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - ELBStack
          - Outputs.SecurityGroupId
      FromPort: 443
      ToPort: 443
      CidrIp:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcCidrBlock"

##
# Web Server Tier
##

  WebServerEC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM
      Policies:
        - PolicyName: WriteCloudWatchLogs
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:CreateLogGroup
                  - logs:PutLogEvents
                Resource: 'arn:aws:logs:*:*:*'
        - PolicyName: AccessCloudWatchMetrics
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - ec2:DescribeTags
                  - autoscaling:DescribeTags
                  - rds:DescribeDBClusters
                  - rds:DescribeDBInstances
                Resource: '*'

  WebServerIamInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name,web,server]]
      Roles:
        - !Ref WebServerEC2Role

  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [' ', [!Ref Name, 'Web Server Security Group']]
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'

  AllowHTTPOnWebServerFromELB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      IpProtocol: TCP
      GroupId: !Ref WebServerSecurityGroup
      FromPort: !Ref WebServerPort
      ToPort: !Ref WebServerPort
      SourceSecurityGroupId: 
        Fn::GetAtt:
          - ELBStack
          - Outputs.SecurityGroupId

  AllowDBAccessFromWebServer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      IpProtocol: TCP
      GroupId: 
        Fn::GetAtt:
          - DBStack
          - Outputs.SecurityGroupId
      FromPort: 
        Fn::GetAtt:
          - DBStack
          - Outputs.DBInstancePort
      ToPort:     
        Fn::GetAtt:
          - DBStack
          - Outputs.DBInstancePort
      SourceSecurityGroupId: !Ref WebServerSecurityGroup
        
  WebServerInstance1:
    Type: AWS::EC2::Instance
    Properties:
      # DisableApiTermination: !If [IsProd, true, false]
      ImageId: !Ref WebServerAMI
      InstanceType: !Ref WebServerType
      IamInstanceProfile: !Ref WebServerIamInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true #make false later
          DeviceIndex: 0
          GroupSet:
            - !Ref WebServerSecurityGroup
          SubnetId:
            Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-PublicSubnetId1' #Later make private
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name,web,AZ1]]

  WebServerAZ1LowDiskSpaceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, web, AZ1, low, disk]]
      MetricName: disk_used_percent
      Namespace: CWAgent
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: ImageId
          Value: !Ref WebServerAMI
        - Name: InstanceId
          Value: !Ref WebServerInstance1
        - Name: path
          Value: /
        - Name: fstype
          Value: xfs
        - Name: InstanceType
          Value: !Ref WebServerType
        - Name: device
          Value: nvme0n1p1

  WebServerAZ1LowMemAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, web, AZ1, low, mem]]
      MetricName: mem_used_percent
      Namespace: CWAgent
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: ImageId
          Value: !Ref WebServerAMI
        - Name: InstanceId
          Value: !Ref WebServerInstance1
        - Name: InstanceType
          Value: !Ref WebServerType

  WebServerAZ1HighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, web, AZ1, high, cpu]]
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: InstanceId
          Value: !Ref WebServerInstance1

  WebServerInstance2:
    Type: AWS::EC2::Instance
    Properties:
      # DisableApiTermination: !If [IsProd, true, false]
      ImageId: !Ref WebServerAMI
      InstanceType: !Ref WebServerType
      IamInstanceProfile: !Ref WebServerIamInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true #make false later
          DeviceIndex: 0
          GroupSet:
            - !Ref WebServerSecurityGroup
          SubnetId:
            Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-PublicSubnetId2' #Later make private
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, web, AZ2]]

  WebServerAZ2LowDiskSpaceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, web, AZ2, low, disk]]
      MetricName: disk_used_percent
      Namespace: CWAgent
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: ImageId
          Value: !Ref WebServerAMI
        - Name: InstanceId
          Value: !Ref WebServerInstance2
        - Name: path
          Value: /
        - Name: fstype
          Value: xfs
        - Name: InstanceType
          Value: !Ref WebServerType
        - Name: device
          Value: nvme0n1p1

  WebServerAZ2LowMemAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, web, AZ2, low, mem]]
      MetricName: mem_used_percent
      Namespace: CWAgent
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: ImageId
          Value: !Ref WebServerAMI
        - Name: InstanceId
          Value: !Ref WebServerInstance2
        - Name: InstanceType
          Value: !Ref WebServerType

  WebServerAZ2HighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, web, AZ2, high, cpu]]
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: InstanceId
          Value: !Ref WebServerInstance2

  WebServerTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckIntervalSeconds: 10
      HealthCheckPath: /health-check
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 2
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200,301
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, web, server]]
      Port: !Ref WebServerPort
      Protocol: HTTP
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: 600 #hardcoded
      TargetType: instance
      Targets:
        - Id: !Ref WebServerInstance1
        - Id: !Ref WebServerInstance2
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, web, server]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

  UnhealthyWebServerHostCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, web, unhealthy, host, count]]
      MetricName: UnHealthyHostCount
      Namespace: AWS/ApplicationELB
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 1
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt [ELBStack, Outputs.LoadBalancerFullName]
        - Name: TargetGroup
          Value: !GetAtt [WebServerTargetGroup, TargetGroupFullName]

  WebServerListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref WebServerTargetGroup
      Conditions:
        - Field: host-header
          Values:
            - !Join ['.', [!Ref Name, 'iscale-solutions.com']] #Hardwired for now
      ListenerArn: 
        Fn::GetAtt:
          - ELBStack
          - Outputs.ApplicationListenerArn
      Priority: 100

##
# Rest Server Tier
##

  RestServerBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 3
          Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  RestServerEC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM
      Policies:
        - PolicyName: S3BucketAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject*
                  - s3:ListBucket
                  - s3:PutObject*
                  - s3:DeleteObject
                Resource: 
                  - !Join ['/', [!GetAtt RestServerBucket.Arn, '*']]
              - Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                Resource: 'arn:aws:s3:::*'
        - PolicyName: WriteCloudWatchLogs
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:CreateLogGroup
                  - logs:PutLogEvents
                Resource: 'arn:aws:logs:*:*:*'
        - PolicyName: AccessCloudWatchMetrics
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - ec2:DescribeTags
                  - autoscaling:DescribeTags
                  - rds:DescribeDBClusters
                  - rds:DescribeDBInstances
                Resource: '*'

  RestServerIamInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, rest, server]]
      Roles:
        - !Ref RestServerEC2Role

  RestServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [' ', [!Ref Name, 'Rest Server Security Group']]
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'


  AllowDBAccessFromRestServer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      IpProtocol: TCP
      GroupId: 
        Fn::GetAtt:
          - DBStack
          - Outputs.SecurityGroupId
      FromPort: 
        Fn::GetAtt:
          - DBStack
          - Outputs.DBInstancePort
      ToPort:     
        Fn::GetAtt:
          - DBStack
          - Outputs.DBInstancePort
      SourceSecurityGroupId: !Ref RestServerSecurityGroup
        
  AllowHTTPOnRestServerFromELB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      IpProtocol: TCP
      GroupId: !Ref RestServerSecurityGroup
      FromPort: !Ref RestServerPort
      ToPort: !Ref RestServerPort
      SourceSecurityGroupId: 
        Fn::GetAtt:
          - ELBStack
          - Outputs.SecurityGroupId

  RestServerInstance1:
    Type: AWS::EC2::Instance
    Properties:
      # DisableApiTermination: !If [IsProd, true, false]
      ImageId: !Ref WebServerAMI
      InstanceType: !Ref RestServerType
      IamInstanceProfile: !Ref RestServerIamInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true #make false later
          DeviceIndex: 0
          GroupSet:
            - !Ref RestServerSecurityGroup
          SubnetId:
            Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-PublicSubnetId1' #Later make private
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, rest, AZ1]]

  RestServerAZ1LowDiskSpaceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, rest, AZ1, low, disk]]
      MetricName: disk_used_percent
      Namespace: CWAgent
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: ImageId
          Value: !Ref RestServerAMI
        - Name: InstanceId
          Value: !Ref RestServerInstance1
        - Name: path
          Value: /
        - Name: fstype
          Value: xfs
        - Name: InstanceType
          Value: !Ref RestServerType
        - Name: device
          Value: nvme0n1p1

  RestServerAZ1LowMemAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, rest, AZ1, low, mem]]
      MetricName: mem_used_percent
      Namespace: CWAgent
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: ImageId
          Value: !Ref WebServerAMI
        - Name: InstanceId
          Value: !Ref RestServerInstance1
        - Name: InstanceType
          Value: !Ref RestServerType

  RestServerAZ1HighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, rest, AZ1, high, cpu]]
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: InstanceId
          Value: !Ref RestServerInstance1

  RestServerInstance2:
    Type: AWS::EC2::Instance
    Properties:
      # DisableApiTermination: !If [IsProd, true, false]
      ImageId: !Ref RestServerAMI
      InstanceType: !Ref RestServerType
      IamInstanceProfile: !Ref RestServerIamInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true #make false later
          DeviceIndex: 0
          GroupSet:
            - !Ref RestServerSecurityGroup
          SubnetId:
            Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-PublicSubnetId2' #Later make private
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, rest, AZ2]]

  RestServerAZ2LowDiskSpaceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, rest, AZ2, low, disk]]
      MetricName: disk_used_percent
      Namespace: CWAgent
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: ImageId
          Value: !Ref WebServerAMI
        - Name: InstanceId
          Value: !Ref RestServerInstance2
        - Name: path
          Value: /
        - Name: fstype
          Value: xfs
        - Name: InstanceType
          Value: !Ref RestServerType
        - Name: device
          Value: nvme0n1p1

  RestServerAZ2LowMemAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, rest, AZ2, low, mem]]
      MetricName: mem_used_percent
      Namespace: CWAgent
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: ImageId
          Value: !Ref WebServerAMI
        - Name: InstanceId
          Value: !Ref RestServerInstance2
        - Name: InstanceType
          Value: !Ref RestServerType

  RestServerAZ2HighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, rest, AZ2, high, cpu]]
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: InstanceId
          Value: !Ref RestServerInstance2

  RestServerTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckIntervalSeconds: 10
      HealthCheckPath: /health-check
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 2
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200,301
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, rest, server]]
      Port: !Ref RestServerPort
      Protocol: HTTP
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: 600 #hardcoded
      TargetType: instance
      Targets:
        - Id: !Ref RestServerInstance1
        - Id: !Ref RestServerInstance2
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, rest, server]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

  RestServerListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref RestServerTargetGroup
      Conditions:
        - Field: host-header
          Values:
            - !Join ['.', ['restpss', 'iscale-solutions.com']]
      ListenerArn:
        Fn::GetAtt:
          - ELBStack
          - Outputs.ApplicationListenerArn
      Priority: 101

  UnhealthyRestServerHostCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, rest, unhealthy, host, count]]
      MetricName: UnHealthyHostCount
      Namespace: AWS/ApplicationELB
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 1
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt [ELBStack, Outputs.LoadBalancerFullName]
        - Name: TargetGroup
          Value: !GetAtt [RestServerTargetGroup, TargetGroupFullName]

  BackupStack:
    Condition: IsProd
    DependsOn:
      - DBStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/backup.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        BackupARNList: !Join
          - ','
          - - Fn::GetAtt:
              - DBStack
              - Outputs.DBInstanceARN
            - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref WebServerInstance1]]]]  
            - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref WebServerInstance2]]]]  
            - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref RestServerInstance1]]]]  
            - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref RestServerInstance2]]]]  
        BackupTime: !If [IsProd, !Ref 'AWS::NoValue', 1] #Default backup time else 1AM UTC for dev
        DailyExpiration: 60 #60 days requirement
        WeeklyExpiration: 180 #6 months
        MonthlyExpiration: 1825 # 5 years

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
        DashboardName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        DashboardBody: !Sub
          - |
            {
              "widgets": [
                {
                  "height": 12,
                  "width": 6,
                  "y": 0,
                  "x": 0,
                  "type": "alarm",
                  "properties": {
                    "title": "Alarms",
                    "alarms": [
                      "${WebServerAZ1LowDiskSpaceAlarm}",
                      "${WebServerAZ2LowDiskSpaceAlarm}",
                      "${WebServerAZ1LowMemAlarm}",
                      "${WebServerAZ2LowMemAlarm}",
                      "${WebServerAZ1HighCPUAlarm}",
                      "${WebServerAZ2HighCPUAlarm}",
                      "${UnhealthyWebServerHostCountAlarm}",
                      "${RestServerAZ1LowDiskSpaceAlarm}",
                      "${RestServerAZ2LowDiskSpaceAlarm}",
                      "${RestServerAZ1LowMemAlarm}",
                      "${RestServerAZ2LowMemAlarm}",
                      "${RestServerAZ1HighCPUAlarm}",
                      "${RestServerAZ2HighCPUAlarm}",
                      "${UnhealthyRestServerHostCountAlarm}"
                    ]
                  }
                },
                {
                  "height": 6,
                  "width": 6,
                  "y": 0,
                  "x": 6,
                  "type": "metric",
                  "properties": {
                    "metrics": [
                      [ "AWS/EC2", "CPUUtilization", "InstanceId", "${REST_AZ1_INSTANCE_ID}", { "label": "Rest AZ1" } ],
                      [ "...", "${REST_AZ2_INSTANCE_ID}", { "label": "Rest AZ2" } ],
                      [ "...", "${WEB_AZ1_INSTANCE_ID}", { "label": "Web AZ1" } ],
                      [ "...", "${WEB_AZ2_INSTANCE_ID}", { "label": "Web AZ2" } ],
                      [ "AWS/RDS", ".", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "label": "Database" } ]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${REGION}",
                    "period": 300,
                    "title": "CPU",
                    "stat": "Average",
                    "yAxis": {
                      "left": {
                        "label": "Utilization"
                      },
                      "right": {
                        "label": "Time"
                      }
                    }
                  }
                },
                {
                  "height": 6,
                  "width": 6,
                  "y": 6,
                  "x": 6,
                  "type": "metric",
                  "properties": {
                    "metrics": [
                        [ { "expression": "(m4/(1024*1000000))*100", "label": "RDS", "id": "e1", "region": "${REGION}" } ],
                        [ "CWAgent", "mem_used_percent", "InstanceId", "${REST_AZ1_INSTANCE_ID}", "ImageId", "${REST_SERVER_AMI}", "InstanceType", "${REST_INSTANCE_TYPE}", { "label": "Rest AZ1", "id": "m1" } ],
                        [ "...", "${REST_AZ2_INSTANCE_ID}", ".", ".", ".", ".", { "label": "Rest AZ2", "id": "m2" } ],
                        [ "...", "${WEB_AZ1_INSTANCE_ID}", ".", "${WEB_SERVER_AMI}", ".", "${WEB_INSTANCE_TYPE}", { "label": "Web AZ1", "id": "m3" } ],
                        [ "...", "${WEB_AZ2_INSTANCE_ID}", ".", ".", ".", ".", { "label": "Web AZ2", "id": "m4" } ],
                        [ "AWS/RDS", "FreeableMemory", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "id": "m5", "visible": false } ]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${REGION}",
                    "period": 300,
                    "title": "Memory",
                    "stat": "Average",
                    "yAxis": {
                      "left": {
                          "label": "Utilization"
                      },
                      "right": {
                          "label": "Time"
                      }
                    }
                  }
                },
                {
                  "height": 6,
                  "width": 6,
                  "y": 0,
                  "x": 12,
                  "type": "metric",
                  "properties": {
                    "metrics": [
                      [ "AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${ELB_FULL_NAME}", { "label": "ELB" } ],
                      [ "AWS/RDS", "ReadLatency", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "label": "RDS Read" } ],
                      [ ".", "WriteLatency", ".", ".", { "label": "RDS Write" } ]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${REGION}",
                    "period": 300,
                    "title": "Performance",
                    "stat": "Average",
                    "yAxis": {
                      "left": {
                        "showUnits": true,
                        "label": "Time"
                      },
                      "right": {
                        "label": "Duration"
                      }
                    }
                  }
                },
                {
                  "height": 6,
                  "width": 6,
                  "y": 0,
                  "x": 18,
                  "type": "metric",
                  "properties": {
                    "metrics": [
                        [ "AWS/EC2", "NetworkIn", "InstanceId", "${REST_AZ1_INSTANCE_ID}", { "label": "Rest AZ1 (in)" } ],
                        [ "...", "${REST_AZ2_INSTANCE_ID}", { "label": "Rest AZ2 (in)" } ],
                        [ "...", "${WEB_AZ1_INSTANCE_ID}", { "label": "Web AZ1 (in)" } ],
                        [ "...", "${WEB_AZ2_INSTANCE_ID}", { "label": "Web AZ2 (in)" } ],
                        [ ".", "NetworkOut", "InstanceId", "${REST_AZ1_INSTANCE_ID}", { "label": "Rest AZ1 (out)" } ],
                        [ "...", "${REST_AZ2_INSTANCE_ID}", { "label": "Rest AZ2 (out)" } ],
                        [ "...", "${WEB_AZ1_INSTANCE_ID}", { "label": "Web AZ1 (out)" } ],
                        [ "...", "${WEB_AZ2_INSTANCE_ID}", { "label": "Web AZ2 (out)" } ]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "title": "Network",
                    "region": "${REGION}",
                    "period": 300,
                    "stat": "Average"
                  }
                },
                {
                  "height": 6,
                  "width": 6,
                  "y": 6,
                  "x": 12,
                  "type": "metric",
                  "properties": {
                    "metrics": [
                        [ "CWAgent", "disk_used_percent", "path", "/", "InstanceId", "${REST_AZ1_INSTANCE_ID}", "ImageId", "${REST_SERVER_AMI}", "InstanceType", "${RestServerType}", "device", "nvme0n1p1", "fstype", "xfs", { "label": "Rest AZ1" } ],
                        [ "...", "${REST_AZ2_INSTANCE_ID}", ".", ".", ".", ".", ".", ".", ".", ".", { "label": "Rest AZ2" } ],
                        [ "...", "${WEB_AZ1_INSTANCE_ID}", ".", "${WEB_SERVER_AMI}", ".", "${WebServerType}", ".", ".", ".", ".", { "label": "Web AZ1" } ],
                        [ "...", "${WEB_AZ2_INSTANCE_ID}", ".", ".", ".", ".", ".", ".", ".", ".", { "label": "Web AZ2" } ],
                        [ { "expression": "100*(m1/(20*1024*1000000))", "label": "RDS", "id": "e2", "region": "${REGION}" } ],
                        [ "AWS/RDS", "FreeStorageSpace", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "id": "m1", "visible": false } ]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${REGION}",
                    "period": 300,
                    "title": "Space",
                    "stat": "Average"
                  }
                },
                {
                  "height": 6,
                  "width": 6,
                  "y": 6,
                  "x": 18,
                  "type": "metric",
                  "properties": {
                    "metrics": [
                      [ "AWS/ApplicationELB", "HTTPCode_ELB_5XX_Count", "LoadBalancer", "${ELB_FULL_NAME}", { "label": "ELB HTTP 5XX_Count" } ],
                      [ ".", "HTTPCode_ELB_4XX_Count", ".", ".", { "label": "ELB HTTP 4XX_Count" } ]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${REGION}",
                    "title": "Error Count",
                    "period": 300,
                    "stat": "Average"
                  }
                }
              ]
            }
          - WebServerAZ1LowDiskSpaceAlarm: !GetAtt WebServerAZ1LowDiskSpaceAlarm.Arn
            WebServerAZ2LowDiskSpaceAlarm: !GetAtt WebServerAZ2LowDiskSpaceAlarm.Arn
            WebServerAZ1LowMemAlarm: !GetAtt WebServerAZ1LowMemAlarm.Arn 
            WebServerAZ2LowMemAlarm: !GetAtt WebServerAZ2LowMemAlarm.Arn
            WebServerAZ1HighCPUAlarm: !GetAtt WebServerAZ1HighCPUAlarm.Arn
            WebServerAZ2HighCPUAlarm: !GetAtt WebServerAZ2HighCPUAlarm.Arn
            UnhealthyWebServerHostCountAlarm: !GetAtt UnhealthyWebServerHostCountAlarm.Arn
            RestServerAZ1LowDiskSpaceAlarm: !GetAtt RestServerAZ1LowDiskSpaceAlarm.Arn
            RestServerAZ2LowDiskSpaceAlarm: !GetAtt RestServerAZ2LowDiskSpaceAlarm.Arn
            RestServerAZ1LowMemAlarm: !GetAtt RestServerAZ1LowMemAlarm.Arn
            RestServerAZ2LowMemAlarm: !GetAtt RestServerAZ2LowMemAlarm.Arn
            RestServerAZ1HighCPUAlarm: !GetAtt RestServerAZ1HighCPUAlarm.Arn
            RestServerAZ2HighCPUAlarm: !GetAtt RestServerAZ2HighCPUAlarm.Arn
            UnhealthyRestServerHostCountAlarm: !GetAtt UnhealthyRestServerHostCountAlarm.Arn
            REGION: !Ref 'AWS::Region'
            ELB_FULL_NAME: !GetAtt [ELBStack, Outputs.LoadBalancerFullName]
            DB_INSTANCE_ID: !GetAtt [DBStack, Outputs.DBInstanceName]
            REST_AZ1_INSTANCE_ID: !Ref RestServerInstance1
            REST_AZ2_INSTANCE_ID: !Ref RestServerInstance2
            REST_INSTANCE_TYPE: !Ref RestServerType
            REST_SERVER_AMI: !Ref RestServerAMI
            WEB_AZ1_INSTANCE_ID: !Ref WebServerInstance1
            WEB_AZ2_INSTANCE_ID: !Ref WebServerInstance2
            WEB_INSTANCE_TYPE: !Ref WebServerType
            WEB_SERVER_AMI: !Ref WebServerAMI