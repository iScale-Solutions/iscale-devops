AWSTemplateFormatVersion: 2010-09-09
Description: PSS Resources

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
      - Label:
          default: Load Balancer Configuration
        Parameters:
          - ClientDomainName
          - LoadBalancerCertificateArn
      - Label:
          default: Rest Instance Configuration
        Parameters:
          - RestServerAMI
          - RestServerPort
          - RestServerType
      - Label:
          default: Web Instance Configuration
        Parameters:
          - WebServerAMI
          - WebServerPort
          - WebServerType
      - Label:
          default: Scheduler Configuration
        Parameters:
          - StartScheduleExpression
          - StopScheduleExpression

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      InstanceAMI:
        default: Instance AMI ID
      LoadBalancerCertificateArn:
        default: Load Balancer SSL Certificate ARN
      NetworkStackName:
        default: Network Stack Name
      RestServerAMI:
        default: Rest Server AMI
      RestServerPort:
        default: Rest server port
      RestServerType:
        default: Rest Server machine type
      SNSStackName:
        default: SNS Topic Stack Name
      WebServerAMI:
        default: Web Server AMI
      WebServerPort:
        default: Web server port
      WebServerType:
        default: Web Server machine type
      StartScheduleExpression:
        default: Start Schedule CRON Expression
      StopScheduleExpression:
        default: Stop Schedule CRON Expression

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name)
    Type: String
    MinLength: 3
    MaxLength: 9
    Default: pss
  OrgName:
    Description: The name of the organization
    Type: String
    Default: canon
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  LoadBalancerCertificateArn:
    Description: SSL Certificate for the ELB
    Type: String
    Default: arn:aws:acm:ap-southeast-1:780347486043:certificate/3b81b0f7-2210-4d89-afcf-5e9a422a57b0
  NetworkStackName:
    Description: The name of the network stack
    Type: String
    Default: canon-prd-ase1-pss-network
    MinLength: 1
  RestServerAMI:
    Description: Web Server AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-0ff89c4ce7de192ea #Will change later
  RestServerPort:
    Description: The port number on which the rest server accepts connections.
    Type: Number
    Default: 8000
    MinValue: 1
    MaxValue: 65535
  RestServerType:
    Description: Type of instance for app server
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
  SNSStackName:
    Description: The name of the SNS stack
    Type: String
    Default: canon-prd-ase1-sns
    MinLength: 1
  StartScheduleExpression:
    Description: Schedule expression when to start the objects
    Type: String
    Default: cron(0 0 ? * MON-FRI *)
  StopScheduleExpression:
    Description: Schedule expression when to stop the objects
    Type: String
    Default: cron(0 10 ? * MON-FRI *)
  WebServerAMI:
    Description: Web Server AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-0ff89c4ce7de192ea #Will change later
  WebServerPort:
    Description: The port number on which the web server accepts connections.
    Type: Number
    Default: 8000
    MinValue: 1
    MaxValue: 65535
  WebServerType:
    Description: Type of instance for the rest server
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium 

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml

Resources:

  DBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/database.yaml
      Parameters:
        Name: !Ref Name
        DatabaseName: !Join ['',[!Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], db]]
        AllocatedStorage: 20
        BackupRetentionPeriod: !If [IsProd, 30, 7]
        DeletionProtection: !If [IsProd, true, false]
        EnableEnhancedMonitoring: !If [IsProd, true, false]
        EnablePerformanceInsights: false
        EnvName: !Ref EnvName
        Engine: mysql
        EngineVersion: 8.0.28
        Family: mysql8.0
        InstanceType: db.t3.micro
        MasterUser: root
        MultiAz: !If [IsProd, true, false]
        NetworkStackName: !Ref NetworkStackName
        OrgName: !Ref OrgName
        SNSStackName: !Ref SNSStackName
        StorageEncrypted: true

  DBSchedulerStack:
    DependsOn:
      - DBStack
    Condition: IsNotProd
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: FALSE
        DatabaseInstanceName:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBInstanceName

  ELBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/loadbalancer.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        CertificateArn: !Ref LoadBalancerCertificateArn
        DeletionProtection: !If [IsProd, true, false]
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName

##
# Web Server Tier
##

  WebServerEC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM

  WebServerIamInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name,web,server]]
      Roles:
        - !Ref WebServerEC2Role

  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [' ', [!Ref Name, 'Web Server Security Group']]
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'

  AllowHTTPOnWebServerFromELB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      IpProtocol: TCP
      GroupId: !Ref WebServerSecurityGroup
      FromPort: !Ref WebServerPort
      ToPort: !Ref WebServerPort
      SourceSecurityGroupId: 
        Fn::GetAtt:
          - ELBStack
          - Outputs.SecurityGroupId

  AllowDBAccessFromWebServer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      IpProtocol: TCP
      GroupId: 
        Fn::GetAtt:
          - DBStack
          - Outputs.SecurityGroupId
      FromPort: 
        Fn::GetAtt:
          - DBStack
          - Outputs.DBInstancePort
      ToPort:     
        Fn::GetAtt:
          - DBStack
          - Outputs.DBInstancePort
      SourceSecurityGroupId: !Ref WebServerSecurityGroup
        
  WebServerInstance1:
    Type: AWS::EC2::Instance
    Properties:
      # DisableApiTermination: !If [IsProd, true, false]
      ImageId: !Ref WebServerAMI
      InstanceType: !Ref WebServerType
      IamInstanceProfile: !Ref WebServerIamInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true #make false later
          DeviceIndex: 0
          GroupSet:
            - !Ref WebServerSecurityGroup
          SubnetId:
            Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-PublicSubnetId1' #Later make private
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name,web,AZ1]]

  WebServerAZ1LowDiskSpaceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, web, AZ1, low, disk]]
      MetricName: disk_used_percent
      Namespace: CWAgent
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: ImageId
          Value: !Ref WebServerAMI
        - Name: InstanceId
          Value: !Ref WebServerInstance1
        - Name: path
          Value: /
        - Name: fstype
          Value: xfs
        - Name: InstanceType
          Value: t3.nano
        - Name: device
          Value: nvme0n1p1
        - Name: fstype
          Value: xfs

  WebServerAZ1LowMemAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, web, AZ1, low, mem]]
      MetricName: mem_used_percent
      Namespace: CWAgent
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: ImageId
          Value: !Ref WebServerAMI
        - Name: InstanceId
          Value: !Ref WebServerInstance1
        - Name: InstanceType
          Value: t3.micro

  WebServerAZ1HighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, web, AZ1, high, cpu]]
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: InstanceId
          Value: !Ref WebServerInstance1

  WebServerInstance2:
    Type: AWS::EC2::Instance
    Properties:
      # DisableApiTermination: !If [IsProd, true, false]
      ImageId: !Ref WebServerAMI
      InstanceType: !Ref WebServerType
      IamInstanceProfile: !Ref WebServerIamInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true #make false later
          DeviceIndex: 0
          GroupSet:
            - !Ref WebServerSecurityGroup
          SubnetId:
            Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-PublicSubnetId2' #Later make private
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, web, AZ2]]

  WebServerAZ2LowDiskSpaceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, web, AZ2, low, disk]]
      MetricName: disk_used_percent
      Namespace: CWAgent
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: ImageId
          Value: !Ref WebServerAMI
        - Name: InstanceId
          Value: !Ref WebServerInstance2
        - Name: path
          Value: /
        - Name: fstype
          Value: xfs
        - Name: InstanceType
          Value: t3.nano
        - Name: device
          Value: nvme0n1p1
        - Name: fstype
          Value: xfs

  WebServerAZ2LowMemAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, web, AZ2, low, mem]]
      MetricName: mem_used_percent
      Namespace: CWAgent
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: ImageId
          Value: !Ref WebServerAMI
        - Name: InstanceId
          Value: !Ref WebServerInstance2
        - Name: InstanceType
          Value: t3.micro

  WebServerAZ2HighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, web, AZ2, high, cpu]]
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: InstanceId
          Value: !Ref WebServerInstance2

  WebServerTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckIntervalSeconds: 10
      HealthCheckPath: / #/health.php to be decided
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 2
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200,301
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, web, server]]
      Port: !Ref WebServerPort
      Protocol: HTTP
      TargetType: instance
      Targets:
        - Id: !Ref WebServerInstance1
        - Id: !Ref WebServerInstance2
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, web, server]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

  UnhealthyWebServerHostCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, web, unhealthy, host, count]]
      MetricName: UnHealthyHostCount
      Namespace: AWS/ApplicationELB
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Maximum
      Threshold: 1
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: LoadBalancer
          Value: 
            Fn::GetAtt:
              - ELBStack
              - Outputs.LoadBalancerFullName
        - Name: TargetGroup
          Value: !Ref WebServerTargetGroup

  WebServerListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref WebServerTargetGroup
      Conditions:
        - Field: host-header
          Values:
            - !Join ['.', ['web', 'test-domain.com']]
      ListenerArn: 
        Fn::GetAtt:
          - ELBStack
          - Outputs.ApplicationListenerArn
      Priority: 100

