AWSTemplateFormatVersion: 2010-09-09
Description: Attach CloudWatch Agent permissions to the Delightful staging Elastic Beanstalk instance role.

Parameters:
  TargetRoleName:
    Description: Existing EB instance role used by Delightful staging.
    Type: String
    Default: EBInstanceRole-CMP-Delightful-staging
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]+$"
    MaxLength: 64

Resources:
  DelightfulCloudWatchAgentPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: DelightfulCloudWatchAgent
      Roles:
        - !Ref TargetRoleName
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - cloudwatch:PutMetricData
              - ec2:DescribeVolumes
              - ec2:DescribeTags
              - logs:PutLogEvents
              - logs:PutRetentionPolicy
              - logs:DescribeLogStreams
              - logs:DescribeLogGroups
              - logs:CreateLogStream
              - logs:CreateLogGroup
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
              - xray:GetSamplingRules
              - xray:GetSamplingTargets
              - xray:GetSamplingStatisticSummaries
            Resource: "*"

Outputs:
  TargetRoleName:
    Description: Existing IAM role receiving the CloudWatch Agent permissions.
    Value: !Ref TargetRoleName
