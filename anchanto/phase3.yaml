AWSTemplateFormatVersion: 2010-09-09
Description: Provision SellUSeller DB Shards

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Shards Global Configuration
        Parameters:
          - CarinaPassword
          - BackupRetentionPeriod
          - DBSubnetGroup
          - EnableDumpAndLoad
          - EnablePerformanceInsights
          - MasterUserPassword
          - SecurityGroup
          - VPC
          - ProdSchemaSnapshotIdentifier
          - ProdSnapshotIdentifier
      - Label:
          default: Cloudformation Stack Configuration
        Parameters:
          - VPCDNSStackName
          - NetworkStackName
          - SNSStackName

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      CarinaPassword:
        default: Carina root password
      DBSubnetGroup:
        default: DB Subnet Group
      DBInstanceClass:
        default: Instance Class
      EnableDumpAndLoad:
        default: Enable Dump and Load for reducing storage
      EnablePerformanceInsights:
        default: Enable Performance Insights
      SecurityGroup:
        default: Security Group
      NetworkStackName:
        default: Network Stack
      VPCDNSStackName:
        default: VPC DNS Stack
      SNSStackName:
        default: SNS Stack

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 8
    Default: sus
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: anchanto
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  BackupRetentionPeriod:
    Description: Database Backup Retention Period
    Type: Number
    Default: 5
    MinValue: 5
    MaxValue: 35
  CarinaPassword:
    Description: Root Password for Carina
    Type: String
    NoEcho: true
  DBSubnetGroup:
    Description: DB Subnet Group
    Default: mpc production db subnet group
    Type: String
  MasterUserPassword:
    Description: DB root Password
    Type: String
    NoEcho: true
  VPC:
    Description: VPC to use for shards
    Type: AWS::EC2::VPC::Id
    Default: vpc-32f32f56
  EnableDumpAndLoad:
    Description: Set to true to enable Dump and Load assets
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  EnablePerformanceInsights:
    Description: Set to true to enable performance Insights
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  ProdSchemaSnapshotIdentifier:
    Description: Snapshot to use as a base for schemas of all production DB shards
    Type: String
    Default: ''
  ProdSnapshotIdentifier:
    Description: Name of the production copy to use in the source DBs
    Type: String
    Default: ''
  SecurityGroup:
    Description: Security Group for shard instances
    Type: AWS::EC2::SecurityGroup::Id
    Default: sg-ae866dc9
  NetworkStackName:
    Description: The name of the cloudformation Network stack
    Type: String
    Default: anchanto-prd-network
  SNSStackName:
    Description: The name of the cloudformation SNS stack
    Type: String
    Default: anchanto-prd-sns
  VPCDNSStackName:
    Description: VPC DNS Stack Name
    Type: String
    Default: anchanto-prd-vpc-dns

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasDumpAndLoad: !Equals [!Ref EnableDumpAndLoad, true]
  HasProdSnapshot: !Not [!Equals [!Ref ProdSnapshotIdentifier, '']]
  HasProdSchemaSnapshot: !Not [!Equals [!Ref ProdSchemaSnapshotIdentifier, '']]

Resources:

###
# Global DB Resources
###

  MySQL8CarinaScriptParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, carina, script, params]]
      Family: mysql8.0
      Parameters:
        general_log: 0
        log_output: FILE
        long_query_time: 5
        slow_query_log: 1
        innodb_buffer_pool_instances: 48
        general_log: 0
        innodb_flush_log_at_trx_commit: 2
        innodb_flush_neighbors: 0
        innodb_io_capacity: 4000
        innodb_purge_threads: 4
        innodb_read_io_threads: 16
        innodb_thread_concurrency: 24
        innodb_write_io_threads: 16
        log_output: FILE
      Tags:
        - Key: Name
          Value: MySQL 8 Parameter Group

  MySQL8ParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, params]]
      Family: mysql8.0
      Parameters:
        general_log: 0
        log_output: FILE
        long_query_time: 5
        slow_query_log: 1
        binlog_format: ROW
        binlog_checksum: NONE
        binlog_row_image: full
        innodb_write_io_threads: 16 #change it back to default
      Tags:
        - Key: Name
          Value: MySQL 8 Parameter Group

  MySQL8ProdParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, prod, params]]
      Family: mysql8.0
      Parameters:
        general_log: 0
        log_output: FILE
        long_query_time: 5
        slow_query_log: 1
        binlog_format: ROW
        binlog_checksum: NONE
        binlog_row_image: full
        # innodb_autoinc_lock_mode: 2 #To be enabled next downtime
      Tags:
        - Key: Name
          Value: MySQL 8 Parameter Group for Prod

  RDSIamRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: monitoring.rds.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole

###
# DMS Global settings
###

  DMSReplicationSubnetGroup: 
    Type: AWS::DMS::ReplicationSubnetGroup
    Properties: 
      ReplicationSubnetGroupDescription: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], 'dms']]
      ReplicationSubnetGroupIdentifier: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], 'dms']]
      SubnetIds: 
        - Fn::ImportValue:
            Fn::Sub: "${NetworkStackName}-PrivateSubnetId1"
        - Fn::ImportValue:
            Fn::Sub: "${NetworkStackName}-PrivateSubnetId2"
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name]]]

  DMSVPCRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: dms.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonDMSVPCManagementRole
      RoleName: dms-vpc-role

  # Enable for migration

  # ProdCloneForInterim:
  #   Condition: HasProdSnapshot
  #   DeletionPolicy: Delete
  #   Type: AWS::RDS::DBInstance
