  #     BackupRetentionPeriod: 0
  #     DBSubnetGroupName: !Ref DBSubnetGroup
  #     Engine: mysql
  #     EngineVersion: 8.0.21
  #     MultiAZ: false
  #     PubliclyAccessible: false
  #     StorageType: gp2
  #     VPCSecurityGroups: 
  #       - !Ref SecurityGroup

  DumpAndLoadInstanceIamRole:
    Condition: HasDumpAndLoad
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: ec2.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  DumpAndLoadInstanceProfile:
    Condition: HasDumpAndLoad
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: DumpAndLoadInstanceIamRole
  
  DumpAndLoadServerSecurityGroup:
    Condition: HasDumpAndLoad
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: DumpAndLoad Server Security Group
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: Dump and Load Server Security Group
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

  DumpAndLoadDBSecurityGroup:
    Condition: HasDumpAndLoad
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: DumpAndLoad DB Security Group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol : TCP
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref DumpAndLoadServerSecurityGroup
          Description: Allow MySQL connection from Dump and Load server
      Tags:
        - Key: Name
          Value: Dump and Load DB Security Group
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName
  
  DumpAndLoadInstance:
    Condition: HasDumpAndLoad
    Type: AWS::EC2::Instance
    Properties: 
      ImageId: ami-00b8d9cb8a7161e41 #Default amazon linux 2
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref DumpAndLoadInstanceProfile
      InstanceType: t3.medium
      BlockDeviceMappings: 
        - DeviceName: "/dev/sdm"
          Ebs: 
            VolumeType: io1
            Iops: 8000
            DeleteOnTermination: true
            VolumeSize: 2000
      NetworkInterfaces: 
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          GroupSet: 
            - Ref: DumpAndLoadServerSecurityGroup
          SubnetId:
            Fn::ImportValue:
              Fn::Sub: "${NetworkStackName}-PublicSubnetId1"
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], iannis]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

