  #Per Shafique - keep around for now (stopped)
  ProdCloneForPH:
    Condition: HasProdSnapshot
    DeletionPolicy: Delete
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceClass: db.r5.8xlarge
      DBInstanceIdentifier: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], carina-script-PH]]
      DBSnapshotIdentifier: !Ref ProdSnapshotIdentifier
      DBParameterGroupName: !Ref MySQL8CarinaScriptParameterGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      BackupRetentionPeriod: 0
      Engine: mysql
      EngineVersion: 8.0.21
      MultiAZ: false
      PubliclyAccessible: false
      StorageType: gp2
      VPCSecurityGroups: 
        - !Ref SecurityGroup
        
  #This is already in production, proceed with caution
  PHShard:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/db-shard.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        BackupRetentionPeriod: !Ref BackupRetentionPeriod
        DBParameterGroupName: !Ref MySQL8ProdParameterGroup
        DBSnapshotIdentifier: arn:aws:rds:ap-southeast-1:337564481418:snapshot:anchanto-sus-prd-interim-migration-jan-16-2021
        DBSubnetGroup: !Ref DBSubnetGroup
        DeletionProtection: true
        EnableReadReplica: true
        EnablePerformanceInsights: !Ref EnablePerformanceInsights
        MultiAZ: true
        SecurityGroup: !Ref SecurityGroup
        ShardName: ph
        VPC: !Ref VPC
        InstanceClass: db.r5.4xlarge
        VPCDNSStackName: !Ref VPCDNSStackName
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName

  PHShardClone:
    Condition: HasDumpAndLoad
    DeletionPolicy: Delete
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceClass: db.r5.4xlarge
      DBInstanceIdentifier: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], ph-clone]]
      DBSnapshotIdentifier: arn:aws:rds:ap-southeast-1:337564481418:snapshot:rds:anchanto-sus-prd-ph-2021-01-18-21-25
      DBParameterGroupName: !Ref MySQL8CarinaScriptParameterGroup
      BackupRetentionPeriod: 0 #Backup disabled
      DBSubnetGroupName: !Ref DBSubnetGroup
      Engine: mysql
      EngineVersion: 8.0.21
      MultiAZ: false
      PubliclyAccessible: false
      StorageType: gp2
      VPCSecurityGroups: 
        - !Ref DumpAndLoadDBSecurityGroup

  PHShardReduced:
    Condition: HasDumpAndLoad
    DeletionPolicy: Delete
    Type: AWS::RDS::DBInstance
    Properties:
      AllocatedStorage: 1000 #1000 Gb for PH
      DBInstanceClass: db.r5.4xlarge
      DBInstanceIdentifier: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], ph-reduced]]
      DBParameterGroupName: !Ref MySQL8CarinaScriptParameterGroup
      BackupRetentionPeriod: 0 #Backup disabled
      DBSubnetGroupName: !Ref DBSubnetGroup
      Engine: mysql
      EngineVersion: 8.0.21
      Iops: 8000 #For now
      MasterUsername: root
      MasterUserPassword: !Ref MasterUserPassword
      MultiAZ: false
      PubliclyAccessible: false
      StorageEncrypted: true
      VPCSecurityGroups: 
        - !Ref DumpAndLoadDBSecurityGroup

