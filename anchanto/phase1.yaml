AWSTemplateFormatVersion: 2010-09-09
Description: Provision shards from a master snapshot of the main database

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Database Configuration
        Parameters:
          - DBSubnetGroup
          - VPC
          - DeletionProtection
          - MultiAz
          - Port
          - InstanceType
          - EnablePerformanceInsights
          - SecurityGroups
          - SnapshotIdentifier
          - AutoMinorVersionUpgrade
      - Label:
          default: Cloudformation Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      DBSubnetGroup:
        default: DB Subnet Group
      DeletionProtection:
        default: Deletion Protection
      MultiAz:
        default: Multi AZ
      Port:
        default: Port
      InstanceType:
        default: QA Machine Instance Type
      EnablePerformanceInsights:
        default: Enable Performance Insights
      SecurityGroups:
        default: Security Groups
      SnapshotIdentifier:
        default: Snapshot Identifier (must be 8.0.21)
      AutoMinorVersionUpgrade:
        default: Auto-Minor Version Upgrade
      NetworkStackName:
        default: Network Stack
      SNSStackName:
        default: SNS Stack

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 8
    Default: sus
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: anchanto
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  DBSubnetGroup:
    Description: DB Subnet Group
    Default: mpc production db subnet group
    Type: String
  VPC:
    Description: VPC to use for instances
    Type: AWS::EC2::VPC::Id
    Default: vpc-32f32f56
  DeletionProtection:
    Description: Set to true to enabled deletion protection
    Type: String
    Default: true
    AllowedValues:
      - true
      - false
  EnablePerformanceInsights:
    Description: Set to true to enabled performance Insights
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  MultiAz:
    Description: Set to true if MultiAZ is enabled. Otherwise, disabled.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  Port:
    Description: The port number on which the database accepts connections.
    Type: Number
    Default: 3306
    MinValue: 1
    MaxValue: 65535
  InstanceType:
    Description: QA Machine Instance type
    Type: String
    Default: t3.micro
  SnapshotIdentifier:
    Description: DB snapshot (5.7.22) to seed the database
    Type: String
    Default: arn:aws:rds:ap-southeast-1:337564481418:snapshot:rds:dbselluseller-carina-prod-2tb-2020-11-29-21-27
  AutoMinorVersionUpgrade:
    Description: Set to true to automatically apply minor engine upgrades.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  DatabaseMode:
    Description: Database version
    Type: String
    Default: 5.7
    AllowedValues:
      - 5.7
      - 8.0
  SecurityGroups:
    Type: CommaDelimitedList
    Default: sg-eb25cd8c, sg-ae866dc9
  NetworkStackName:
    Description: The name of the cloudformation Network stack
    Type: String
    Default: anchanto-prd-network
  SNSStackName:
    Description: The name of the cloudformation SNS stack
    Type: String
    Default: anchanto-prd-sns

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasDeletionProtection: !Equals [!Ref DeletionProtection, true]
  HasPerformanceInsights: !Equals [!Ref EnablePerformanceInsights, true]
  Isv8Mode: !Equals [!Ref DatabaseMode, 8.0]

Resources:

####
# RDS Section
####

  OriginalDataSecurityGroup:
    Type: AWS::EC2::SecurityGroup 
    Properties:
      GroupDescription: Original Database Security Group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        # - IpProtocol : TCP
        #   FromPort: 3306
        #   ToPort: 3306
        #   SourceSecurityGroupId: !Ref PMMInstanceSecurityGroup
        # - IpProtocol : TCP
        #   FromPort: 3306
        #   ToPort: 3306
        #   SourceSecurityGroupId: !Ref DMSInstanceSecurityGroup
        - IpProtocol : TCP
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref Phase1QASecurityGroup

