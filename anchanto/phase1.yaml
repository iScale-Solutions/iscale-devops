###
# QA Section
###

  Phase1QASecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Sharding Phase 1 - QA Instance Security Group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol : TCP
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol : TCP
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol : TCP
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  Phase1QAIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: ec2.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  Phase1QAInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: Phase1QAIamRole

  Phase1QAInstance:
    Type: AWS::EC2::Instance
    Properties: 
      ImageId: ami-058486f5bbd43c49e #provided by Vishal
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref Phase1QAInstanceProfile
      KeyName: MPC-Production
      NetworkInterfaces: 
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          GroupSet: 
            - Ref: Phase1QASecurityGroup
          SubnetId:
            Fn::ImportValue:
              Fn::Sub: "${NetworkStackName}-PublicSubnetId1"
      Tags:
        - Key: Name
          Value: Shards MIgration - Phase 1 - QA Test for v8 Prod RDS
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName


