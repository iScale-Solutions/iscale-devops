          SourceSecurityGroupId: !Ref THVNShardDMSSecurityGroup
        - IpProtocol : TCP
          FromPort: !Ref Port
          ToPort: !Ref Port
          SourceSecurityGroupId: !Ref Phase2QASecurityGroup

  THVNShardDMSSourceEndPoint: 
    Type: AWS::DMS::Endpoint
    Properties: 
      DatabaseName: dbpSEAOMSTHVN01
      EndpointIdentifier: phase2-THVN-source
