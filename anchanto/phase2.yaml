            - THVNShardRDSInstance
            - Endpoint.Address
  
  THVNShardReplicaRDSInstance53Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !ImportValue 
        'Fn::Sub': '${VPCDNSStackName}-HostedZoneId'
      Comment: THVN DB Shard
      Name: !Join
        - ''
        - - db-thvn-replica.
          - !ImportValue 
            'Fn::Sub': '${VPCDNSStackName}-HostedZoneDomainName'
      Type: CNAME
      TTL: 3600
      ResourceRecords:
        - !GetAtt 
            - THVNShardReplicaRDSInstance
            - Endpoint.Address

  THVNShardRDSSecurityGroup:
