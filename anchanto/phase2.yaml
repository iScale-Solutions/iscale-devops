###
# QA Section
###

  Phase2QASecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Phase 2 - QA Security Group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol : TCP
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol : TCP
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol : TCP
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

Outputs:

  Phase2QASecurityGroup:
    Description: Security Group for QA
    Value: !Ref Phase2QASecurityGroup