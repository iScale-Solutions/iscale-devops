###
# Backup Section
###
    
  BackupStack:
    Type: AWS::CloudFormation::Stack
    Properties: 
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/backup.yaml
      Parameters: 
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        BackupARNList: !Join
          - ','
          - - Fn::GetAtt:
              - THVNShard
              - Outputs.ShardRDSInstanceARN
            - Fn::GetAtt:
              - SGIDShard
              - Outputs.ShardRDSInstanceARN
            - Fn::GetAtt:
              - MYShard
              - Outputs.ShardRDSInstanceARN
            - Fn::GetAtt:
              - PHShard
              - Outputs.ShardRDSInstanceARN
            - Fn::GetAtt:
              - GlobalShard
              - Outputs.ShardRDSInstanceARN

