            - Fn::GetAtt:
              - MYShard
              - Outputs.ShardRDSInstanceARN
            - Fn::GetAtt:
              - PHShard
              - Outputs.ShardRDSInstanceARN
            - Fn::GetAtt:
              - GlobalShard
              - Outputs.ShardRDSInstanceARN

