####
# TH VN Shard Section
####
    
  THVNShardRDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      AllocatedStorage: 300 #TOOD - Param
      AutoMinorVersionUpgrade: !Ref AutoMinorVersionUpgrade
      BackupRetentionPeriod: !Ref BackupRetentionPeriod
      DBInstanceClass: !Ref PHDBInstanceClass #TODO - Param
      DBInstanceIdentifier: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], 'thvn']]
      DBName: dtpSEAOMSTHVN01 #TODO - Prod / Staging
      DBParameterGroupName: !Ref MySQL8ParameterGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      DeleteAutomatedBackups: false
      DeletionProtection: !Ref DeletionProtection
      EnablePerformanceInsights: !Ref EnablePerformanceInsights
      PerformanceInsightsRetentionPeriod: !If [HasPerformanceInsights, 731, !Ref 'AWS::NoValue']
      Engine: mysql
      EngineVersion: 8.0.21
      MasterUsername: root #TODO - Param
      MasterUserPassword: !Ref MasterUserPassword
      MaxAllocatedStorage: 1000 #TODO - param
      MonitoringRoleArn: !GetAtt RDSIamRole.Arn
      MonitoringInterval: 30
      MultiAZ: false
      Port: !Ref Port
      PubliclyAccessible: false
      StorageEncrypted: true
      StorageType: gp2
      VPCSecurityGroups: 
        - !Ref SecurityGroup
        - !Ref AllowPHDMSSecurityGroup #TODO - Param
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], 'thvn']]
    
  THVNShardReplicaRDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceClass: !Ref PHDBInstanceClass
      DBInstanceIdentifier: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], 'thvn-replica']]
      DBParameterGroupName: !Ref MySQL8ParameterGroup
      EnablePerformanceInsights: !Ref EnablePerformanceInsights
      PerformanceInsightsRetentionPeriod: !If [HasPerformanceInsights, 731, !Ref 'AWS::NoValue']
      MonitoringRoleArn: !GetAtt RDSIamRole.Arn
      MonitoringInterval: 30
      Port: !Ref Port
      PubliclyAccessible: false
      SourceDBInstanceIdentifier: !Ref THVNShardRDSInstance
      StorageEncrypted: true
      StorageType: gp2
      VPCSecurityGroups: 
        - !Ref SecurityGroup
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], 'thvn-shard-replica']]

