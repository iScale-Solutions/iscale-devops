AWSTemplateFormatVersion: 2010-09-09
Description: Provision shards from a master source database

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Master Database Configuration
        Parameters:
          - MasterUserPassword
      - Label:
          default: Shards Global Configuration
        Parameters:
          - AutoMinorVersionUpgrade
          - BackupRetentionPeriod
          - DBSubnetGroup
          - DeletionProtection
          - EnablePerformanceInsights
          - MultiAz
          - Port
          - SecurityGroup
          - VPC
      - Label:
          default: PH Shard Configuration
        Parameters:
          - PHDBAllocatedStorage
          - PHMaxAllocatedStorage
          - PHDBInstanceClass
      - Label:
          default: Cloudformation Stack Configuration
        Parameters:
          - VPCDNSStackName
          - NetworkStackName
          - SNSStackName

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      DBSubnetGroup:
        default: DB Subnet Group
      DeletionProtection:
        default: Deletion Protection
      MultiAz:
        default: Multi AZ
      Port:
        default: Port
      PHDBAllocatedStorage:
        default: Allocated Storage
      PHMaxAllocatedStorage:
        default: Max Allocated Storage
      PHDBInstanceClass:
        default: Instance Class
      EnablePerformanceInsights:
        default: Enable Performance Insights
      SecurityGroup:
        default: Security Group
      AutoMinorVersionUpgrade:
        default: Auto-Minor Version Upgrade
      NetworkStackName:
        default: Network Stack
      VPCDNSStackName:
        default: VPC DNS Stack
      SNSStackName:
        default: SNS Stack

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 8
    Default: sus
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: anchanto
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  BackupRetentionPeriod:
    Description: Database Backup Retention Period
    Type: Number
    Default: 5
    MinValue: 5
    MaxValue: 35
  DBSubnetGroup:
    Description: DB Subnet Group
    Default: mpc production db subnet group
    Type: String
  MasterUserPassword:
    Description: DB root Password
    Type: String
    NoEcho: true
  VPC:
    Description: VPC to use for shards
    Type: AWS::EC2::VPC::Id
    Default: vpc-32f32f56
  PHDBAllocatedStorage:
    Description: Storage for PH DB Instance
    Type: Number
    Default: 300
    MinValue: 20
    MaxValue: 1000
  PHMaxAllocatedStorage:
    Description: Max Storage for PH DB Instance
    Type: Number
    Default: 1000
    MinValue: 20
    MaxValue: 2000
  PHDBInstanceClass:
    Description: PH Shared Instance Class
    Type: String
    Default: db.r5.large
  DeletionProtection:
    Description: Set to true to enabled deletion protection
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  EnablePerformanceInsights:
    Description: Set to true to enabled performance Insights
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  MultiAz:
    Description: Set to true if MultiAZ is enabled. Otherwise, disabled.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  Port:
    Description: The port number on which the database accepts connections.
    Type: Number
    Default: 3306
    MinValue: 1
    MaxValue: 65535
  AutoMinorVersionUpgrade:
    Description: Set to true to automatically apply minor engine upgrades.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  SecurityGroup:
    Description: Security Group for shard instances
    Type: String
    Default: sg-ae866dc9
  NetworkStackName:
    Description: The name of the cloudformation Network stack
    Type: String
    Default: anchanto-prd-network
  SNSStackName:
    Description: The name of the cloudformation SNS stack
    Type: String
    Default: anchanto-prd-sns
  VPCDNSStackName:
    Description: VPC DNS Stack Name
    Type: String
    Default: anchanto-prd-vpc-dns

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasDeletionProtection: !Equals [!Ref DeletionProtection, true]
  HasPerformanceInsights: !Equals [!Ref EnablePerformanceInsights, true]

Resources:

###
# Global DB Resources
###

  MySQL8ParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, params]]
      Family: mysql8.0
      Parameters:
        general_log: 0
        log_output: FILE
        long_query_time: 5
        slow_query_log: 1
      Tags:
        - Key: Name
          Value: MySQL 8 Parameter Group

  RDSIamRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: monitoring.rds.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole

###
# DMS Global settings
###

  DMSReplicationSubnetGroup: 
    DependsOn:
      - DMSVPCRole
    Type: AWS::DMS::ReplicationSubnetGroup
    Properties: 
      ReplicationSubnetGroupDescription: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], 'dms']]
      ReplicationSubnetGroupIdentifier: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], 'dms']]
      SubnetIds: 
        - Fn::ImportValue:
            Fn::Sub: "${NetworkStackName}-PrivateSubnetId1"
        - Fn::ImportValue:
            Fn::Sub: "${NetworkStackName}-PrivateSubnetId2"
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name]]]

  DMSVPCRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: dms.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonDMSVPCManagementRole
      RoleName: dms-shards-role
  
####
# PH Shard Section
####
    
  PHShardRDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      AllocatedStorage: !Ref PHDBAllocatedStorage
      AutoMinorVersionUpgrade: !Ref AutoMinorVersionUpgrade
      BackupRetentionPeriod: !Ref BackupRetentionPeriod
      DBInstanceClass: !Ref PHDBInstanceClass
      DBInstanceIdentifier: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], 'ph-shard']]
      DBName: dtpSEAOMSPH01 #TODO - Prod / Staging
      DBParameterGroupName: !Ref MySQL8ParameterGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      DeleteAutomatedBackups: false
      DeletionProtection: !Ref DeletionProtection
      EnablePerformanceInsights: !Ref EnablePerformanceInsights
      PerformanceInsightsRetentionPeriod: !If [HasPerformanceInsights, 731, !Ref 'AWS::NoValue']
      Engine: mysql
      EngineVersion: 8.0.21
      MasterUsername: ssdba
      MasterUserPassword: !Ref MasterUserPassword
      MaxAllocatedStorage: !Ref PHMaxAllocatedStorage
      MonitoringRoleArn: !GetAtt RDSIamRole.Arn
      MonitoringInterval: 30
      MultiAZ: false
      Port: !Ref Port
      PubliclyAccessible: false
      StorageEncrypted: true
      StorageType: gp2
      VPCSecurityGroups: 
        - !Ref SecurityGroup
        - !Ref PHShardRDSSecurityGroup
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], 'ph-shard']]
    
  PHShardReplicaRDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceClass: !Ref PHDBInstanceClass
      DBInstanceIdentifier: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], 'ph-shard-replica']]
      DBParameterGroupName: !Ref MySQL8ParameterGroup
      EnablePerformanceInsights: !Ref EnablePerformanceInsights
      PerformanceInsightsRetentionPeriod: !If [HasPerformanceInsights, 731, !Ref 'AWS::NoValue']
      MonitoringRoleArn: !GetAtt RDSIamRole.Arn
      MonitoringInterval: 30
      Port: !Ref Port
      PubliclyAccessible: false
      SourceDBInstanceIdentifier: !Ref PHShardRDSInstance
      StorageEncrypted: true
      StorageType: gp2
      VPCSecurityGroups: 
        - !Ref SecurityGroup
        - !Ref PHShardRDSSecurityGroup
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], 'ph-shard-replica']]

  PHShardRDSInstance53Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !ImportValue 
        'Fn::Sub': '${VPCDNSStackName}-HostedZoneId'
      Comment: PH DB Shard
      Name: !Join
        - ''
        - - db-ph.
          - !ImportValue 
            'Fn::Sub': '${VPCDNSStackName}-HostedZoneDomainName'
      Type: CNAME
      TTL: 3600
      ResourceRecords:
        - !GetAtt 
            - PHShardRDSInstance
            - Endpoint.Address
  
  PHShardReplicaRDSInstance53Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !ImportValue 
        'Fn::Sub': '${VPCDNSStackName}-HostedZoneId'
      Comment: PH DB Shard
      Name: !Join
        - ''
        - - db-ph-replica.
          - !ImportValue 
            'Fn::Sub': '${VPCDNSStackName}-HostedZoneDomainName'
      Type: CNAME
      TTL: 3600
      ResourceRecords:
        - !GetAtt 
            - PHShardReplicaRDSInstance
            - Endpoint.Address

  PHShardRDSCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-', [!Ref PHShardRDSInstance, 'high-cpu']]
      MetricName: CPUUtilization
      Namespace: AWS/RDS
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub "${SNSStackName}-TopicArn"
      OKActions:
        - Fn::ImportValue:
            !Sub "${SNSStackName}-TopicArn"
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref PHShardRDSInstance
  
  PHShardReplicaRDSCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-', [!Ref PHShardReplicaRDSInstance, 'high-cpu']]
      MetricName: CPUUtilization
      Namespace: AWS/RDS
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub "${SNSStackName}-TopicArn"
      OKActions:
        - Fn::ImportValue:
            !Sub "${SNSStackName}-TopicArn"
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref PHShardReplicaRDSInstance

  PHShardRDSFreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-', [!Ref PHShardRDSInstance, 'low-storage']]
      MetricName: FreeStorageSpace
      Namespace: AWS/RDS
      ComparisonOperator: LessThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Average
      Threshold: 5368709120 # 5GB
      AlarmActions:
        - Fn::ImportValue:
            !Sub "${SNSStackName}-TopicArn"
      OKActions:
        - Fn::ImportValue:
            !Sub "${SNSStackName}-TopicArn"
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref PHShardRDSInstance

  PHShardRDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup 
    Properties:
      GroupDescription: PH Shard RDS Security Group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol : TCP
          FromPort: !Ref Port
          ToPort: !Ref Port
          SourceSecurityGroupId: !Ref PHShardDMSSecurityGroup  
        - IpProtocol : TCP
          FromPort: !Ref Port
          ToPort: !Ref Port
          SourceSecurityGroupId: !Ref Phase2QASecurityGroup

  PHShardDMSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: DMS Replication (PH) Security Group
      VpcId: !Ref VPC

  PHShardDMSInstance: 
    Type: AWS::DMS::ReplicationInstance
    Properties: 
      MultiAZ: false
      PubliclyAccessible: false
      ReplicationInstanceClass: dms.t3.medium
      ReplicationInstanceIdentifier: PH-DMS-Replication
      ReplicationSubnetGroupIdentifier: !Ref DMSReplicationSubnetGroup
      VpcSecurityGroupIds:
        - !Ref PHShardDMSSecurityGroup
        - !Ref SecurityGroup #To connect to V8 instance

  PHShardDMSSourceEndPoint: 
    Type: AWS::DMS::Endpoint
    Properties: 
      # DatabaseName: dbpSEAOMSPH01
      DatabaseName: dbssPH01 #As test for now
      EndpointIdentifier: phase2-PH-source
      EndpointType: source
      EngineName: mysql
      Password: !Ref MasterUserPassword
      Port: !Ref Port
      Username: root
      ServerName: anchanto-sus-stg-v8.cbudzbiqnbgm.ap-southeast-1.rds.amazonaws.com

  PHShardDMSTargetEndPoint:
    Type: AWS::DMS::Endpoint
    Properties:
      DatabaseName: dtpSEAOMSPH01
      EndpointIdentifier: phase2-PH-target
      EndpointType: target
      EngineName: mysql
      Password: !Ref MasterUserPassword
      Port: !Ref Port
      Username: ssdba
      ServerName: !GetAtt PHShardRDSInstance.Endpoint.Address

  PHShardDMSReplicationTask:
    Type: AWS::DMS::ReplicationTask
    Properties: 
      MigrationType: full-load
      ReplicationInstanceArn: !Ref PHShardDMSInstance
      ReplicationTaskIdentifier: PH-Migration
      SourceEndpointArn: !Ref PHShardDMSSourceEndPoint
      TargetEndpointArn: !Ref PHShardDMSTargetEndPoint
      TableMappings: "{ \"rules\": [ { \"rule-type\": \"selection\", \"rule-id\": \"1\", \"rule-name\": \"1\", \"object-locator\": { \"schema-name\": \"mysql\", \"table-name\": \"%\" }, \"rule-action\": \"include\" }, { \"rule-type\": \"selection\", \"rule-id\": \"2\", \"rule-name\": \"2\", \"object-locator\": { \"schema-name\": \"dbssPH01\", \"table-name\": \"%\" }, \"rule-action\": \"include\" } ] }"









