AWSTemplateFormatVersion: 2010-09-09
Description: Provision SellUSeller DB Shards

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Shards Global Configuration
        Parameters:
          - BackupRetentionPeriod
          - DBSubnetGroup
          - DeletionProtection
          - EnablePerformanceInsights
          - MasterUserPassword
          - MultiAz
          - SecurityGroup
          - VPC
      - Label:
          default: Cloudformation Stack Configuration
        Parameters:
          - VPCDNSStackName
          - NetworkStackName
          - SNSStackName

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      DBSubnetGroup:
        default: DB Subnet Group
      DeletionProtection:
        default: Deletion Protection
      MultiAz:
        default: Multi AZ
      DBInstanceClass:
        default: Instance Class
      EnablePerformanceInsights:
        default: Enable Performance Insights
      SecurityGroup:
        default: Security Group
      NetworkStackName:
        default: Network Stack
      VPCDNSStackName:
        default: VPC DNS Stack
      SNSStackName:
        default: SNS Stack

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 8
    Default: sus
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: anchanto
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  BackupRetentionPeriod:
    Description: Database Backup Retention Period
    Type: Number
    Default: 5
    MinValue: 5
    MaxValue: 35
  DBSubnetGroup:
    Description: DB Subnet Group
    Default: mpc production db subnet group
    Type: String
  MasterUserPassword:
    Description: DB root Password
    Type: String
    NoEcho: true
  VPC:
    Description: VPC to use for shards
    Type: AWS::EC2::VPC::Id
    Default: vpc-32f32f56
  DeletionProtection:
    Description: Set to true to enabled deletion protection
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  EnablePerformanceInsights:
    Description: Set to true to enabled performance Insights
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  MultiAz:
    Description: Set to true if MultiAZ is enabled. Otherwise, disabled.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  SecurityGroup:
    Description: Security Group for shard instances
    Type: AWS::EC2::SecurityGroup::Id
    Default: sg-ae866dc9
  NetworkStackName:
    Description: The name of the cloudformation Network stack
    Type: String
    Default: anchanto-prd-network
  SNSStackName:
    Description: The name of the cloudformation SNS stack
    Type: String
    Default: anchanto-prd-sns
  VPCDNSStackName:
    Description: VPC DNS Stack Name
    Type: String
    Default: anchanto-prd-vpc-dns

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml

Resources:

###
# Global DB Resources
###

  MySQL8ParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, params]]
      Family: mysql8.0
      Parameters:
        general_log: 0
        log_output: FILE
        long_query_time: 5
        slow_query_log: 1
      Tags:
        - Key: Name
          Value: MySQL 8 Parameter Group

  RDSIamRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: monitoring.rds.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole

###
# DMS Global settings
###

  DMSReplicationSubnetGroup: 
    DependsOn:
      - DMSVPCRole
    Type: AWS::DMS::ReplicationSubnetGroup
    Properties: 
      ReplicationSubnetGroupDescription: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], 'dms']]
      ReplicationSubnetGroupIdentifier: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], 'dms']]
      SubnetIds: 
        - Fn::ImportValue:
            Fn::Sub: "${NetworkStackName}-PrivateSubnetId1"
        - Fn::ImportValue:
            Fn::Sub: "${NetworkStackName}-PrivateSubnetId2"
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name]]]

  DMSVPCRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: dms.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonDMSVPCManagementRole
      RoleName: dms-shards-role

####
# PH Shard Section
####
  
  PHShard:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/db-shard.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        AllocatedStorage: 500
        DBSchemaName: dbpSEAOMSPH01
        DBParameterGroupName: !Ref MySQL8ParameterGroup
        DBSubnetGroup: !Ref DBSubnetGroup
        DeletionProtection: false
        EnableReadReplica: true
        EnablePerformanceInsights: !Ref EnablePerformanceInsights
        MasterUser: ssdba
        MasterUserPassword: !Ref MasterUserPassword
        MaxAllocatedStorage: 1000
        BackupRetentionPeriod: !Ref BackupRetentionPeriod
        MultiAz: false
        SecurityGroup: !Ref SecurityGroup
        ShardName: ph
        VPC: !Ref VPC
        
        InstanceClass: db.r5.large
        VPCDNSStackName: !Ref VPCDNSStackName
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName

  PHDMS:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/dms.yaml
      Parameters:
        Name: !Join ['-', [!Ref Name, 'PH']]
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        DMSReplicationSubnetGroup: !Ref DMSReplicationSubnetGroup
        SourceEndpoint: anchanto-sus-stg-v8.cbudzbiqnbgm.ap-southeast-1.rds.amazonaws.com
        SourceSchemaName: dbpSEAOMSPH01
        SourceSecurityGroup: sg-05177fa0274e32351
        SourceUser: root
        SourceUserPassword: !Ref MasterUserPassword
        TargetEndpoint: 
          Fn::GetAtt:
            - PHShard
            - Outputs.ShardRDSInstanceEndpoint
        TargetSchemaName: dbpSEAOMSPH01
        TargetSecurityGroup: !Ref SecurityGroup
        TargetUser: ssdba
        TargetUserPassword: !Ref MasterUserPassword
        TableMappings: "{ \"rules\": [ { \"rule-type\": \"selection\", \"rule-id\": \"1\", \"rule-name\": \"1\", \"object-locator\": { \"schema-name\": \"mysql\", \"table-name\": \"%\" }, \"rule-action\": \"include\" }, { \"rule-type\": \"selection\", \"rule-id\": \"2\", \"rule-name\": \"2\", \"object-locator\": { \"schema-name\": \"dbpSEAOMSGLOBAL01\", \"table-name\": \"%\" }, \"rule-action\": \"include\" }, { \"rule-type\": \"selection\", \"rule-id\": \"3\", \"rule-name\": \"3\", \"object-locator\": { \"schema-name\": \"dbpSEAOMSPH01\", \"table-name\": \"%\" }, \"rule-action\": \"include\" } ] }"
        VPC: !Ref VPC
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName


