AWSTemplateFormatVersion: 2010-09-09
Description: Provision shards from a master snapshot of the main database

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      -
        Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      -
        Label:
          default: Database Configuration
        Parameters:
          - DBSubnetGroup
          - VPC
          - DeletionProtection
          - MultiAz
          - Port
          - InstanceType
          - EnablePerformanceInsights
          - BackupRetentionPeriod
          - SecurityGroups
          - SnapshotIdentifier
          - AutoMinorVersionUpgrade
          - MonitoringInterval
          - EnableEnhancedMonitoring
      -
        Label:
          default: CloudWatch Configuration
        Parameters:
          - LogRetentionPeriod
      -
        Label:
          default: Cloudformation Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      DBSubnegGroup:
        default: DB Subnet Group
      DeletionProtection:
        default: Deletion Protection
      MultiAz:
        default: Multi AZ
      Port:
        default: Port
      InstanceType:
        default: RDS Instance Type
      EnablePerformanceInsights:
        default: Enable Performance Insights
      BackupRetentionPeriod:
        default: Backup Retention Period
      SecurityGroups:
        default: Security Groups
      SnapshotIdentifier:
        default: Snapshot Identifier (must be 8.0.21)
      SourceDbInstanceIdentifier:
        default: Source Database Instance Identifier
      AutoMinorVersionUpgrade:
        default: Auto-Minor Version Upgrade
      MonitoringInterval:
        default: Monitoring Interval
      EnableEnhancedMonitoring:
        default: Enable Enhanced Monitoring
      LogRetentionPeriod:
        default: Log Retention Period
      NetworkStackName:
        default: Network Stack
      SNSStackName:
        default: SNS Stack

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 8
    Default: sus
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: anchanto
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  DBSubnetGroup:
    Description: DB Subnet Group
    Default: test-db-subnet-group
    Type: String
  VPC:
    Description: VPC to use for instances
    Type: AWS::EC2::VPC::Id
    Default: vpc-0c43465a6b510a4f7
  DeletionProtection:
    Description: Set to true to enabled deletion protection
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  EnablePerformanceInsights:
    Description: Set to true to enabled performance Insights
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  MultiAz:
    Description: Set to true if MultiAZ is enabled. Otherwise, disabled.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  Port:
    Description: The port number on which the database accepts connections.
    Type: Number
    Default: 3306
    MinValue: 1
    MaxValue: 65535
  InstanceType:
    Description: The compute and memory capacity of the DB instance, for example, db.m4.large.
    Type: String
    Default: db.t3.micro
  BackupRetentionPeriod:
    Description: The number of days for which automated backups are retained. Setting this parameter to a positive number enables backups. Setting this parameter to 0 disables automated backups.
    Default: 30
    Type: Number
    MinValue: 0
    MaxValue: 35
  SnapshotIdentifier:
    Description: DB snapshot (8.0.21) to seed the database
    Type: String
    Default: arn:aws:rds:ap-southeast-1:338284463834:snapshot:migrated-db-8-0-21
  AutoMinorVersionUpgrade:
    Description: Set to true to automatically apply minor engine upgrades.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  MonitoringInterval:
    Description: The interval, in seconds, between points when Enhanced Monitoring metrics are collected for the DB instance
    Type: Number
    Default: 30
  EnableEnhancedMonitoring:
    Description: Set to true if enahanced monitoring is enabled. Otherwise, disabled.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  LogRetentionPeriod:
    Description: The number of days to retain the log events in the specified log group
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]
  SecurityGroups:
    Type: CommaDelimitedList
    Default: sg-071f6e20e0d8d1041, sg-0c6b0dc571eb9248b
  NetworkStackName:
    Description: The name of the cloudformation Network stack
    Type: String
    Default: iscale-dev-dev-uw2-network
  SNSStackName:
    Description: The name of the cloudformation SNS stack
    Type: String
    Default: iscale-dev-dev-uw2-sns

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasDeletionProtection: !Equals [!Ref DeletionProtection, true]
  HasPerformanceInsights: !Equals [!Ref EnablePerformanceInsights, true]
  IsEnableEnhancedMonitoring: !Equals [!Ref EnableEnhancedMonitoring, true]

Resources:

####
# RDS Section
####

  # Already exists
  # DBSubnetGroup:

  MySQL8ParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Family: mysql8.0
      # Name: pg-rds-prod-mysql8
      Parameters:
        general_log: 0
        log_output: FILE
        long_query_time: 5
        slow_query_log: 1
      Tags:
        - Key: Name
          Value: MySQL 8 Parameter Group
    
  ShardZone01:
    Type: AWS::RDS::DBInstance
    DependsOn:
      - RDSIamRole
      - MySQL8ParameterGroup
    Properties:
      BackupRetentionPeriod: !Ref BackupRetentionPeriod
      DBInstanceClass: !Ref InstanceType
      AutoMinorVersionUpgrade: !Ref AutoMinorVersionUpgrade
      DBInstanceIdentifier: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], 'zone1']]
      DBParameterGroupName: !Ref MySQL8ParameterGroup
      DBSnapshotIdentifier: !Ref SnapshotIdentifier
      DBSubnetGroupName: !Ref DBSubnetGroup
      DeleteAutomatedBackups: false
      DeletionProtection: !If [HasDeletionProtection, true, false]
      EnablePerformanceInsights: !Ref EnablePerformanceInsights
      PerformanceInsightsRetentionPeriod: !If [HasPerformanceInsights, 731, !Ref 'AWS::NoValue']
      Engine: mysql
      EngineVersion: 8.0.21
      MonitoringRoleArn: !If [IsEnableEnhancedMonitoring, !GetAtt RDSIamRole.Arn, !Ref 'AWS::NoValue']
      MonitoringInterval: !If [IsEnableEnhancedMonitoring, !Ref MonitoringInterval, !Ref 'AWS::NoValue']
      MultiAZ: !Ref MultiAz
      Port: !Ref Port
      PubliclyAccessible: false
      StorageType: gp2
      VPCSecurityGroups: !Ref SecurityGroups
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name]]]

  ReadReplicaZone01:
    Type: AWS::RDS::DBInstance
    DependsOn: ShardZone01
    DeletionPolicy: Delete #For now
    Properties:
      DBInstanceClass: !Ref InstanceType #Need to have separate type for read replica vs source
      AutoMinorVersionUpgrade: !Ref AutoMinorVersionUpgrade
      DBInstanceIdentifier: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], 'zone1-replica']]
      DBParameterGroupName: !Ref MySQL8ParameterGroup
      EnablePerformanceInsights: !Ref EnablePerformanceInsights
      PerformanceInsightsRetentionPeriod: !If [HasPerformanceInsights, 731, !Ref 'AWS::NoValue']
      MonitoringRoleArn: !If [IsEnableEnhancedMonitoring, !GetAtt RDSIamRole.Arn, !Ref 'AWS::NoValue']
      MonitoringInterval: !If [IsEnableEnhancedMonitoring, !Ref MonitoringInterval, !Ref 'AWS::NoValue']
      Port: !Ref Port
      PubliclyAccessible: false
      StorageType: gp2
      SourceDBInstanceIdentifier: !Ref ShardZone01
      VPCSecurityGroups: !Ref SecurityGroups
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name]]]

####
# CloudWatch Section
####

  Zone01CPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-', [!Ref ShardZone01, 'high-cpu']]
      MetricName: CPUUtilization
      Namespace: AWS/RDS
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Average
      Threshold: 80
      # AlarmActions:
      #   - Fn::ImportValue:
      #       !Sub "${SNSStackName}-TopicArn"
      # OKActions:
      #   - Fn::ImportValue:
      #       !Sub "${SNSStackName}-TopicArn"
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref ShardZone01

  Zone01FreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-', [!Ref ShardZone01, 'low-storage']]
      MetricName: FreeStorageSpace
      Namespace: AWS/RDS
      ComparisonOperator: LessThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Average
      Threshold: 5368709120 # 5GB
      # AlarmActions:
      #   - Fn::ImportValue:
      #       !Sub "${SNSStackName}-TopicArn"
      # OKActions:
      #   - Fn::ImportValue:
      #       !Sub "${SNSStackName}-TopicArn"
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref ShardZone01

####
# Dashboard Section
####

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
        DashboardName: 'SellUSeller_DB_Shards'
        DashboardBody: !Sub
          - |
            {
              "widgets": [
              {
                "type": "metric",
                "x": 0,
                "y": 0,
                "width": 6,
                "height": 6,
                "properties": {
                  "view": "timeSeries",
                  "title": "Zone 01 - Connections",
                  "stacked": true,
                  "metrics": [
                      [ "AWS/RDS", "DatabaseConnections", "DBInstanceIdentifier", "${ZONE1_RDS}" ],
                      [ "...", "${ZONE1_RDS_REPLICA}" ]
                  ],
                  "region": "${AWS::Region}"
                }
              },
              {
                  "type": "metric",
                  "x": 6,
                  "y": 0,
                  "width": 6,
                  "height": 6,
                  "properties": {
                    "view": "timeSeries",
                    "stacked": false,
                    "title": "Zone 01 - CPU",
                    "metrics": [
                        [ "AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "${ZONE1_RDS}" ],
                        [ "AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "${ZONE1_RDS_REPLICA}" ]
                    ],
                    "region": "${AWS::Region}"
                  }
              },
              {
                  "type": "metric",
                  "x": 12,
                  "y": 0,
                  "width": 6,
                  "height": 6,
                  "properties": {
                    "view": "timeSeries",
                    "stacked": false,
                    "title": "Zone 01 - IOPS",
                    "metrics": [
                        [ "AWS/RDS", "ReadIOPS", "DBInstanceIdentifier", "${ZONE1_RDS}" ],
                        [ "AWS/RDS", "WriteIOPS", "DBInstanceIdentifier", "${ZONE1_RDS}" ],
                        [ "AWS/RDS", "ReadIOPS", "DBInstanceIdentifier", "${ZONE1_RDS_REPLICA}" ],
                        [ "AWS/RDS", "WriteIOPS", "DBInstanceIdentifier", "${ZONE1_RDS_REPLICA}" ]
                    ],
                    "region": "${AWS::Region}"
                  }
              },
              {
                "type": "metric",
                "x": 18,
                "y": 0,
                "width": 6,
                "height": 6,
                "properties": {
                    "view": "timeSeries",
                    "title": "Zone 01 - Free Storage",
                    "stacked": false,
                    "metrics": [
                        [ "AWS/RDS", "FreeStorageSpace", "DBInstanceIdentifier", "${ZONE1_RDS}" ],
                        [ "AWS/RDS", "FreeStorageSpace", "DBInstanceIdentifier", "${ZONE1_RDS_REPLICA}" ]
                    ],
                    "region": "${AWS::Region}"
                }
              }
              ]
            }
          - ZONE1_RDS: !Ref ShardZone01
            ZONE1_RDS_REPLICA: !Ref ReadReplicaZone01

