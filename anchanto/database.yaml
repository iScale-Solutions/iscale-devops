  #         Key: Environment
  #         Value: !Ref EnvName
  #       - 
  #         Key: Organization
  #         Value: !Ref OrgName

####
# IAM Section
####

  RDSIamRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: monitoring.rds.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole

##
# PMM Monitoring
##  

  PMMUser:
    Type: AWS::IAM::User
    Properties:
      UserName: PMMUser
  
  PMMUserKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref PMMUser

  RDSPMMAccessPolicy:
    Type: AWS::IAM::Policy
    Properties: 
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - rds:DescribeDBInstances
              - cloudwatch:GetMetricStatistics
              - cloudwatch:ListMetrics
            Resource: '*'
          - Effect: Allow
            Action:
              - logs:DescribeLogStreams
              - logs:GetLogEvents
              - logs:FilterLogEvents
            Resource: 'arn:aws:logs:*:*:log-group:RDSOSMetrics:*'
      PolicyName: RDSPMMAccessPolicy
      Users: 
        - !Ref PMMUser
      

Outputs:

  PMMUserAccesskey:
    Description: AccessKey for PMM User
    Value: !Ref PMMUserKey

  PMMUserSecretkey:
    Description: Secret Key for PMM User
    Value: !GetAtt PMMUserKey.SecretAccessKey

  ShardZone01ARN:
    Description: ARN of the created RDS instance
    Value: !Join [":", ["arn:aws:rds", !Ref 'AWS::Region', !Ref 'AWS::AccountId', "db", !Ref ShardZone01]]
  
  ShardZone01Name:
    Description: Name of the created RDS instance
    Value: !Ref ShardZone01

  ShardZone01Address:
    Description: The endpoint address of the RDS instance
    Value: !GetAtt ShardZone01.Endpoint.Address

  ShardZone01Port:
    Description: The port number of the RDS instance
    Value: !Ref Port