####
# Dashboard Section
####

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: 'SellUSeller_DB'
      DashboardBody: !Sub
        - |
          {
            "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 6,
              "height": 6,
              "properties": {
                "view": "timeSeries",
                "title": "Prod DB - Connections",
                "stacked": true,
                "metrics": [
                    [ "AWS/RDS", "DatabaseConnections", "DBInstanceIdentifier", "${PROD_RDS}" ]
                ],
                "region": "${AWS::Region}"
              }
            },
            {
                "type": "metric",
                "x": 6,
                "y": 0,
                "width": 6,
                "height": 6,
                "properties": {
                  "view": "timeSeries",
                  "stacked": false,
                  "title": "Prod DB - CPU",
                  "metrics": [
                      [ "AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "${PROD_RDS}" ]
                  ],
                  "region": "${AWS::Region}"
                }
            },
            {
                "type": "metric",
                "x": 12,
                "y": 0,
                "width": 6,
                "height": 6,
                "properties": {
                  "view": "timeSeries",
                  "stacked": false,
                  "title": "Prod DB - IOPS",
                  "metrics": [
                      [ "AWS/RDS", "ReadIOPS", "DBInstanceIdentifier", "${PROD_RDS}" ],
                      [ "AWS/RDS", "WriteIOPS", "DBInstanceIdentifier", "${PROD_RDS}" ]
                  ],
                  "region": "${AWS::Region}"
                }
            },
            {
              "type": "metric",
              "x": 18,
              "y": 0,
              "width": 6,
              "height": 6,
              "properties": {
                  "view": "timeSeries",
                  "title": "Prod DB - Free Storage",
                  "stacked": false,
                  "metrics": [
                      [ "AWS/RDS", "FreeStorageSpace", "DBInstanceIdentifier", "${PROD_RDS}" ]
                  ],
                  "region": "${AWS::Region}"
              }
            }
            ]
          }
        - PROD_RDS: !Ref Phase1ProdRDSInstance

