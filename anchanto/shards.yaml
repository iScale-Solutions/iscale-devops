####
# DMS Section
####

  DMSInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: DMS Replication Instance Security Group
      VpcId: !Ref VPC
  
  DMSVPCRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: dms.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonDMSVPCManagementRole
      RoleName: dms-vpc-role
  
  DMSReplicationSubnetGroup: 
    DependsOn:
      - DMSVPCRole
    Type: AWS::DMS::ReplicationSubnetGroup
    Properties: 
      ReplicationSubnetGroupDescription: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name]]]
      ReplicationSubnetGroupIdentifier: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name]]]
      SubnetIds: 
        - Fn::ImportValue:
            Fn::Sub: "${NetworkStackName}-PrivateSubnetId1"
        - Fn::ImportValue:
            Fn::Sub: "${NetworkStackName}-PrivateSubnetId2"
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name]]]
  
  Phase1DMSInstance: 
    Type: AWS::DMS::ReplicationInstance
    Properties: 
      MultiAZ: false
      PubliclyAccessible: false
      ReplicationInstanceClass: dms.t3.small
      ReplicationSubnetGroupIdentifier: !Ref DMSReplicationSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DMSInstanceSecurityGroup

  OriginalDataSourceEndPoint: 
    Type: AWS::DMS::Endpoint
    Properties: 
      DatabaseName: !Ref Original57Data
      EndpointType: source
      EngineName: mysql
      Password: password
      Port: 3306
      Username: root
      ServerName: !GetAtt Original57Data.Endpoint.Address
  
  Phase1TargetEndPoint: 
    Type: AWS::DMS::Endpoint
    Properties: 
      DatabaseName: !Ref Phase1ProdRDSInstance
      EndpointType: target
      EngineName: mysql
      Password: password
      Port: 3306
      ServerName: !GetAtt Phase1ProdRDSInstance.Endpoint.Address
      Username: root

