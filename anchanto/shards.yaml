####
# CloudWatch Section
####

  Phase01RDSCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-', [!Ref Phase1ProdRDSInstance, 'high-cpu']]
      MetricName: CPUUtilization
      Namespace: AWS/RDS
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub "${SNSStackName}-TopicArn"
      OKActions:
        - Fn::ImportValue:
            !Sub "${SNSStackName}-TopicArn"
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Phase1ProdRDSInstance

  Phase01RDSFreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-', [!Ref Phase1ProdRDSInstance, 'low-storage']]
      MetricName: FreeStorageSpace
      Namespace: AWS/RDS
      ComparisonOperator: LessThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Average
      Threshold: 5368709120 # 5GB
      AlarmActions:
        - Fn::ImportValue:
            !Sub "${SNSStackName}-TopicArn"
      OKActions:
        - Fn::ImportValue:
            !Sub "${SNSStackName}-TopicArn"
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Phase1ProdRDSInstance

