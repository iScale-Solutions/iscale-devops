AWSTemplateFormatVersion: 2010-09-09
Description: Provision shards from a master snapshot of the main database

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      -
        Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      -
        Label:
          default: Database Configuration
        Parameters:
          - DBSubnetGroup
          - VPC
          - DeletionProtection
          - MultiAz
          - Port
          - InstanceType
          - EnablePerformanceInsights
          - BackupRetentionPeriod
          - SecurityGroups
          - SnapshotIdentifier
          - AutoMinorVersionUpgrade
          - MonitoringInterval
          - EnableEnhancedMonitoring
      -
        Label:
          default: CloudWatch Configuration
        Parameters:
          - LogRetentionPeriod
      -
        Label:
          default: Cloudformation Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      DBSubnegGroup:
        default: DB Subnet Group
      DeletionProtection:
        default: Deletion Protection
      MultiAz:
        default: Multi AZ
      Port:
        default: Port
      InstanceType:
        default: RDS Instance Type
      EnablePerformanceInsights:
        default: Enable Performance Insights
      BackupRetentionPeriod:
        default: Backup Retention Period
      SecurityGroups:
        default: Security Groups
      SnapshotIdentifier:
        default: Snapshot Identifier (must be 8.0.21)
      SourceDbInstanceIdentifier:
        default: Source Database Instance Identifier
      AutoMinorVersionUpgrade:
        default: Auto-Minor Version Upgrade
      MonitoringInterval:
        default: Monitoring Interval
      EnableEnhancedMonitoring:
        default: Enable Enhanced Monitoring
      LogRetentionPeriod:
        default: Log Retention Period
      NetworkStackName:
        default: Network Stack
      SNSStackName:
        default: SNS Stack

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 8
    Default: sus
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: anchanto
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  DBSubnetGroup:
    Description: DB Subnet Group
    Default: mpc production db subnet group
    Type: String
  VPC:
    Description: VPC to use for instances
    Type: AWS::EC2::VPC::Id
    Default: vpc-32f32f56
  DeletionProtection:
    Description: Set to true to enabled deletion protection
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  EnablePerformanceInsights:
    Description: Set to true to enabled performance Insights
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  MultiAz:
    Description: Set to true if MultiAZ is enabled. Otherwise, disabled.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  Port:
    Description: The port number on which the database accepts connections.
    Type: Number
    Default: 3306
    MinValue: 1
    MaxValue: 65535
  InstanceType:
    Description: The compute and memory capacity of the DB instance, for example, db.m4.large.
    Type: String
    Default: db.t3.micro
  BackupRetentionPeriod:
    Description: The number of days for which automated backups are retained. Setting this parameter to a positive number enables backups. Setting this parameter to 0 disables automated backups.
    Default: 30
    Type: Number
    MinValue: 0
    MaxValue: 35
  SnapshotIdentifier:
    Description: DB snapshot (8.0.21) to seed the database
    Type: String
    Default: arn:aws:rds:ap-southeast-1:337564481418:snapshot:rds:dbselluseller-carina-prod-2tb-2020-11-29-21-27
  AutoMinorVersionUpgrade:
    Description: Set to true to automatically apply minor engine upgrades.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  DatabaseMode:
    Description: Set to true if enahanced monitoring is enabled. Otherwise, disabled.
    Type: String
    Default: 5.7
    AllowedValues:
      - 5.7
      - 8.0
  MonitoringInterval:
    Description: The interval, in seconds, between points when Enhanced Monitoring metrics are collected for the DB instance
    Type: Number
    Default: 30
  EnableEnhancedMonitoring:
    Description: Set to true if enahanced monitoring is enabled. Otherwise, disabled.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  LogRetentionPeriod:
    Description: The number of days to retain the log events in the specified log group
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]
  SecurityGroups:
    Type: CommaDelimitedList
    Default: sg-eb25cd8c, sg-ae866dc9
  NetworkStackName:
    Description: The name of the cloudformation Network stack
    Type: String
    Default: anchanto-prd-network
  SNSStackName:
    Description: The name of the cloudformation SNS stack
    Type: String
    Default: anchanto-prd-sns

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasDeletionProtection: !Equals [!Ref DeletionProtection, true]
  HasPerformanceInsights: !Equals [!Ref EnablePerformanceInsights, true]
  IsEnableEnhancedMonitoring: !Equals [!Ref EnableEnhancedMonitoring, true]
  Isv8Mode: !Equals [!Ref DatabaseMode, 8.0]

Resources:

####
# RDS Section
####

  Original57DataSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Full Original Data DB Security Group
      VpcId: !Ref VPC
  
  AllowDBAccessfromPMMServer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      IpProtocol: TCP
      GroupId: !Ref Original57DataSecurityGroup
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref PMMInstanceSecurityGroup

  AllowDBAccessfromDMSInstance:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      IpProtocol: TCP
      GroupId: !Ref Original57DataSecurityGroup
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref DMSInstanceSecurityGroup

  ##
  # This database is the 5.7.22 clone of prod based on the latest snapshot - Later, it gets upgraded to 8.0
  ##
  Original57Data:
    DeletionPolicy: Delete
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceClass: db.r3.2xlarge
      AutoMinorVersionUpgrade: !Ref AutoMinorVersionUpgrade
      DBInstanceIdentifier: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], 'percona']]
      DBParameterGroupName: !If [Isv8Mode, !Ref MySQL8ParameterGroup, dbselluseller-parameter-group-mysql57]
      DBSnapshotIdentifier: !If [Isv8Mode, !Ref 'AWS::NoValue', !Ref SnapshotIdentifier]
      DBSubnetGroupName: !Ref DBSubnetGroup
      Engine: mysql
      EngineVersion: !If [Isv8Mode, 8.0.21, 5.7.22]
      Port: !Ref Port
      PubliclyAccessible: false
      StorageType: gp2
      VPCSecurityGroups: !Ref SecurityGroups
      #VPCSecurityGroups: !Ref Original57DataSecurityGroup #Next round

  ##
  # This instance contains the final, shrunk version of the data for production
  ##
  Phase1ProdRDSInstance:
    DeletionPolicy: Delete #For now
    Type: AWS::RDS::DBInstance
    Properties:
      AllocatedStorage: 20 #will change this based on actual data needs
      AutoMinorVersionUpgrade: !Ref AutoMinorVersionUpgrade
      DBInstanceClass: db.r5.large
      DBInstanceIdentifier: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], 'db']]
      DBParameterGroupName: !Ref MySQL8ParameterGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      DeleteAutomatedBackups: false
      DeletionProtection: !If [HasDeletionProtection, true, false]
      EnablePerformanceInsights: !Ref EnablePerformanceInsights
      PerformanceInsightsRetentionPeriod: !If [HasPerformanceInsights, 731, !Ref 'AWS::NoValue']
      Engine: mysql
      EngineVersion: 8.0.21
      MasterUsername: root
      MasterUserPassword: password
      MonitoringRoleArn: !If [IsEnableEnhancedMonitoring, !GetAtt RDSIamRole.Arn, !Ref 'AWS::NoValue']
      MonitoringInterval: !If [IsEnableEnhancedMonitoring, !Ref MonitoringInterval, !Ref 'AWS::NoValue']
      MultiAZ: false
      Port: !Ref Port
      PubliclyAccessible: false
      StorageEncrypted: true
      StorageType: gp2
      VPCSecurityGroups: !Ref SecurityGroups
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], 'db']]

  # Already exists
  # DBSubnetGroup:

  MySQL8ParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Family: mysql8.0
      # Name: pg-rds-prod-mysql8
      Parameters:
        general_log: 0
        log_output: FILE
        long_query_time: 5
        slow_query_log: 1
      Tags:
        - Key: Name
          Value: MySQL 8 Parameter Group

