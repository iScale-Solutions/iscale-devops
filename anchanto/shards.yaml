####
# IAM Section
####

  RDSIamRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: monitoring.rds.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole

####
# PMM Monitoring
####

  PMMUser:
    Type: AWS::IAM::User
    Properties:
      UserName: PMMUser
  
  PMMUserKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref PMMUser

  RDSPMMAccessPolicy:
    Type: AWS::IAM::Policy
    Properties: 
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - rds:DescribeDBInstances
              - cloudwatch:GetMetricStatistics
              - cloudwatch:ListMetrics
            Resource: '*'
          - Effect: Allow
            Action:
              - logs:DescribeLogStreams
              - logs:GetLogEvents
              - logs:FilterLogEvents
            Resource: 'arn:aws:logs:*:*:log-group:RDSOSMetrics:*'
      PolicyName: RDSPMMAccessPolicy
      Users: 
        - !Ref PMMUser

  PMMInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PMM Server Security Group
      VpcId: !Ref VPC
      Tags:
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

  AllowHTTPOnPMMServer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      IpProtocol: TCP
      GroupId: !Ref PMMInstanceSecurityGroup
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0

  AllowSSHOnPMMServer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      IpProtocol: TCP
      GroupId: !Ref PMMInstanceSecurityGroup
      CidrIp: 0.0.0.0/0
      FromPort: 22
      ToPort: 22
  
  PMMInstanceIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: ec2.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  PMMInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: PMMInstanceIamRole

  PMMInstance:
    Type: AWS::EC2::Instance
    Properties: 
      ImageId: ami-09e516eb13973ed17 #From marketplace
      InstanceType: t3.micro
      SecurityGroupIds:
        - !Ref PMMInstanceSecurityGroup
      SubnetId:
        Fn::ImportValue:
          Fn::Sub: "${NetworkStackName}-PublicSubnetId1"
      IamInstanceProfile: !Ref PMMInstanceProfile
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, PMM]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

Outputs:

  PMMUserAccesskey:
    Description: AccessKey for PMM User
    Value: !Ref PMMUserKey

  PMMUserSecretkey:
    Description: Secret Key for PMM User
    Value: !GetAtt PMMUserKey.SecretAccessKey

