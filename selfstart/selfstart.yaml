AWSTemplateFormatVersion: '2010-09-09'

Description: SelfStart web application

Parameters:
  LambdaPrefixName:
    Description: "Lambda function prefix name (for allowed function). e.g. iscale-dev-stg"
    Type: "String"

Resources:
  WebsiteBucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketEncryption: 
        ServerSideEncryptionConfiguration: 
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      WebsiteConfiguration:
        IndexDocument: index.html
    
  WebsiteBucketPolicy:
    Type: "AWS::S3::BucketPolicy"
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${WebsiteBucket}/*"
  
  APIGatewayCloudWatchIAMRole:
    Type: AWS::IAM::Role
    Properties:
      Path: "/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Principal:
              Service:
                - "apigateway.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - >-
          arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  APIGatewayAccount:
    Type: 'AWS::ApiGateway::Account'
    Properties:
      CloudWatchRoleArn: !GetAtt APIGatewayCloudWatchIAMRole.Arn

  ApiGatewayRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name : !Join [ " " , [!Ref "AWS::StackName", "API"] ]
      ApiKeySourceType: HEADER
      Description : !Join [ " " , [!Ref "AWS::StackName", "API Gateway"] ]
      EndpointConfiguration:
        Types:
          - EDGE
  
  ApiGatewayModel:
    Type: AWS::ApiGateway::Model
    Properties:
      ContentType: 'application/json'
      RestApiId: !Ref ApiGatewayRestApi
      Schema: {}

  ApiGatewayScheduleResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: 'schedules'
      RestApiId: !Ref ApiGatewayRestApi
  
  ApiGatewayManageResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: 'manage'
      RestApiId: !Ref ApiGatewayRestApi

  ApiGatewayCognitoAuthorizer:
    Type: 'AWS::ApiGateway::Authorizer'
    Properties:
      Type: COGNITO_USER_POOLS
      Name: "Cognito-Authorizer"
      IdentitySource: 'method.request.header.Authorization'
      RestApiId: !Ref ApiGatewayRestApi
      ProviderARNs: [!GetAtt UserPool.Arn]
    
  ApiGatewayGetShedulesMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      ApiKeyRequired: false
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiGatewayCognitoAuthorizer
      HttpMethod: GET
      Integration:
        ConnectionType: INTERNET
        Credentials: !GetAtt ApiGatewayIamRole.Arn
        IntegrationHttpMethod: POST
        PassthroughBehavior: WHEN_NO_MATCH
        TimeoutInMillis: 29000
        Type: AWS_PROXY
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SchedulesLambdaFunction.Arn}/invocations'
      OperationName: 'schedules'
      ResourceId: !Ref ApiGatewayScheduleResource
      RestApiId: !Ref ApiGatewayRestApi

  ApiGatewayOptionsShedulesMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref ApiGatewayScheduleResource
      HttpMethod: OPTIONS
      OperationName: 'schedules'
      Integration:
        IntegrationResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
            method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
            method.response.header.Access-Control-Allow-Origin: "'*'"
          ResponseTemplates:
            application/json: ''
        PassthroughBehavior: WHEN_NO_MATCH
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        Type: MOCK
      MethodResponses:
      - StatusCode: 200
        ResponseModels:
          application/json: 'Empty'
        ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: false
            method.response.header.Access-Control-Allow-Methods: false
            method.response.header.Access-Control-Allow-Origin: false
      
  ApiGatewayPostManageMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      ApiKeyRequired: false
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiGatewayCognitoAuthorizer
      HttpMethod: POST
      Integration:
        ConnectionType: INTERNET
        Credentials: !GetAtt ApiGatewayIamRole.Arn
        IntegrationHttpMethod: POST
        PassthroughBehavior: WHEN_NO_MATCH
        TimeoutInMillis: 29000
        Type: AWS_PROXY
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ManageLambdaFunction.Arn}/invocations'
      OperationName: 'manage'
      RequestParameters: 
        method.request.header.command: true
      ResourceId: !Ref ApiGatewayManageResource
      RestApiId: !Ref ApiGatewayRestApi

  ApiGatewayOptionsManageMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref ApiGatewayManageResource
      HttpMethod: OPTIONS
      OperationName: 'manage'
      Integration:
        IntegrationResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
            method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
            method.response.header.Access-Control-Allow-Origin: "'*'"
          ResponseTemplates:
            application/json: ''
        PassthroughBehavior: WHEN_NO_MATCH
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        Type: MOCK
      MethodResponses:
      - StatusCode: 200
        ResponseModels:
          application/json: 'Empty'
        ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: false
            method.response.header.Access-Control-Allow-Methods: false
            method.response.header.Access-Control-Allow-Origin: false
  
  APIGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: 
      LogGroupName: !Join [ "-" , [!Ref "AWS::StackName", "Log-Group"] ]

  ApiGatewayStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      AccessLogSetting:
        DestinationArn: !GetAtt APIGatewayLogGroup.Arn
      DeploymentId: !Ref ApiGatewayDeployment
      Description: "v0 Stage"
      RestApiId: !Ref ApiGatewayRestApi
      TracingEnabled: true
      StageName: 'v0'

  ApiGatewayDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [ApiGatewayGetShedulesMethod, ApiGatewayOptionsShedulesMethod]
    Properties:
      Description: "Deployment v0"
      RestApiId: !Ref ApiGatewayRestApi

  ManageLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |
          def handler(event, context):
            import boto3
            import json

            lambda_client = boto3.client('lambda')
            # print("Event is: " + json.dumps(event))
            commandName=json.loads(event["body"])["command"]
            # print("Lambda to invoke is: " + commandName)
            invoke_response = lambda_client.invoke(
              FunctionName=commandName,
              InvocationType="RequestResponse"
            )

            response = {
              'isBase64Encoded': False,
              'statusCode': 200,
              'headers': {
                "Access-Control-Allow-Origin" : "*"
              },
              'multiValueHeaders': {},
              'body': '{"command":"' + commandName + '", "status": "OK"}'
            }
            return response
      Description: "Invokes an environment to start or stop"
      Handler: index.handler
      MemorySize: 256
      Role: !GetAtt LambdaExecutionIamRole.Arn
      Runtime: python3.7
      Timeout: 60

  SchedulesLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |
          def handler(event, context):
            response = {
              'isBase64Encoded': False,
              'statusCode': 200,
              'headers': {
                 "Access-Control-Allow-Origin" : "*"
              },
              'multiValueHeaders': {},
              'body': '{"id":1,"content":"This is a list of schedules"}'
            }
            return response
      Description: "Returns a list of schedules that can be started and stopped"
      Handler: index.handler
      MemorySize: 256
      Role: !GetAtt LambdaExecutionIamRole.Arn
      Runtime: python3.7
      Timeout: 60

  LambdaExecutionIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - 'lambda.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
      Path: '/'
      ManagedPolicyArns:
        - >-
          arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ListRulesDetails
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action: 'events:ListRules'
                Resource: !Join [ ":" , ["arn:aws:events", !Ref 'AWS::Region', !Ref 'AWS::AccountId', "rule/*"] ]
        - PolicyName: InvokeFunctions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action: 'lambda:InvokeFunction'
                Resource: [!Join [ ":" , ["arn:aws:lambda", !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ["", ["function:", !Ref LambdaPrefixName, "-*-start"]]]],
                          !Join [ ":" , ["arn:aws:lambda", !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ["", ["function:", !Ref LambdaPrefixName, "-*-stop"]]]]]

  ApiGatewayIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ''
            Effect: 'Allow'
            Principal:
              Service:
                - 'apigateway.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
      Path: '/'
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action: 'lambda:InvokeFunction'
                Resource: [!GetAtt SchedulesLambdaFunction.Arn, !GetAtt ManageLambdaFunction.Arn]

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AliasAttributes:
        - email
      AutoVerifiedAttributes:
        - email

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false

  CognitoConfigRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        -
          PolicyName: CognitoConfig
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              -
                Sid: Logging
                Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: "*"
              -
                Sid: Cognito
                Effect: Allow
                Action:
                  - "cognito-idp:CreateUserPool"
                  - "cognito-idp:DeleteUserPool"
                  - "cognito-idp:CreateUserPoolClient"
                  - "cognito-idp:DeleteUserPoolClient"
                Resource: "*"
              -
                Sid: ConfigBucketWriteAccess
                Effect: Allow
                Action:
                  - "s3:PutObject"
                  - "s3:PutObjectAcl"
                  - "s3:PutObjectVersionAcl"
                Resource:
                  - !Sub "arn:aws:s3:::${WebsiteBucket}/*"
Outputs:
  S3Bucket:
    Value: !Ref WebsiteBucket
  UserPool:
    Value: !Ref UserPool
  Client:
    Value: !Ref UserPoolClient
  Region:
    Value: !Ref AWS::Region
  API:
    Value: !Ref ApiGatewayRestApi
