AWSTemplateFormatVersion: 2010-09-09
Description: Regular Odoo setup

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
          - LoadBalancerStackName
          - UseOwnLoadBalancer
      - Label:
          default: Load Balancer Configuration
        Parameters:
          - ClientDomainName
          - LoadBalancerCertificateArn
          - LoadBalancerPriority
          - LoadBalancerHostName
      - Label:
          default: DB Instance Configuration
        Parameters:
          - DatabaseUser
          - DatabaseUserPassword
          - DBSnapshotIdentifier
          - MasterUser
          - MasterUserPassword
      - Label:
          default: EC2 Instance Configuration
        Parameters:
          - InstanceKeyName
          - InstanceAMI
      - Label:
          default: Scheduler Configuration
        Parameters:
          - StartScheduleExpression
          - StopScheduleExpression

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      LoadBalancerCertificateArn:
        default: Load Balancer Certificate ARN
      LoadBalancerPriority:
        default: Load Balancer Rule Priority
      LoadBalancerStackName:
        default: Load Balancer Stack Name
      NetworkStackName:
        default: Network Stack Name
      SNSStackName:
        default: SNS Topic Stack Name
      ClientDomainName:
        default: Domain Name
      InstanceKeyName:
        default: Instance Key Name
      InstanceAMI:
        default: Instance AMI
      StartScheduleExpression:
        default: Start Schedule CRON Expression
      StopScheduleExpression:
        default: Stop Schedule CRON Expression
      UseOwnLoadBalancer:
        default: Use own ELB for this setup?

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 9
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  ClientDomainName:
    Description: The client's domain name (e.g. example.com, iscale-software.com).
    Type: String
    AllowedPattern: ^[a-z0-9]+([\-\.]{1}[a-z0-9]+)*\.[a-z]{2,7}$
    Default: iscale-software.com
    MinLength: 1
  DatabaseUser:
    Description: The name of the database user
    Type: String
    Default: dbuser
  DatabaseUserPassword:
    Description: The password of the database user
    NoEcho: true
    Type: String
    Default: ''
  DBSnapshotIdentifier:
    Description: The name or Amazon Resource Name (ARN) of the DB snapshot to restore. If you specied root user, make sure it matches
    Type: String
    Default: ''
  InstanceAMI:
    Description: Instance AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-0bc06212a56393ee1
  InstanceKeyName:
    Description: Instance Key Name
    Type: String
    Default: ''
  LoadBalancerCertificateArn:
    Description: Load Balancer Certificate ARN (only needed when using own ELB)
    Type: String
    Default: ''
  LoadBalancerHostName:
    Description: (Optional) Custom Hostname for load balancer URL
    Type: String
    Default: ''
    MaxLength: 12
  LoadBalancerPriority:
    Description: The priority for ELB Listener. Not required if using own ELB
    Type: Number
    Default: 750
    MinValue: 1
    MaxValue: 50000
  LoadBalancerStackName:
    Description: The name of the load balancer stack (only when NOT using own ELB)
    Type: String
    Default: iscale-dev-stg-uw2-alb
  MasterUser:
    Description: The name of the master user for the database instance.
    Type: String
    Default: root
  MasterUserPassword:
    Description: Master User Password
    NoEcho: true
    Type: String
    Default: ''
  NetworkStackName:
    Description: The name of the network stack.
    Type: String
    Default: iscale-dev-dev-uw2-network
    MinLength: 1
  SNSStackName:
    Description: the name of the SNS stack.
    Type: String
    Default: iscale-dev-dev-uw2-sns
    MinLength: 1
  StartScheduleExpression:
    Description: Schedule expression when to start the objects
    Type: String
    Default: cron(0 0 ? * MON-FRI *)
  StopScheduleExpression:
    Description: Schedule expression when to stop the objects
    Type: String
    Default: cron(0 10 ? * MON-FRI *)
  UseOwnLoadBalancer:
    Description: Do you want to create a dedicated ELB for this Odoo Setup? If no, you will reuse an existing ELB stack
    Type: String
    Default: false
    AllowedValues:
      - true
      - false

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasMasterUserPassword: !Not [!Equals [!Ref MasterUserPassword, '']]
  HasDatabaseUserPassword: !Not [!Equals [!Ref DatabaseUserPassword, '']]
  HasDBSnapshotIdentifier: !Not [!Equals [!Ref DBSnapshotIdentifier, '']]
  HasLoadBalancerHostName: !Not [!Equals [!Ref LoadBalancerHostName, '']]
  HasOwnLoadBalancer: !Equals [!Ref UseOwnLoadBalancer, true]
  
Resources:

  ELBStack:
    Condition: HasOwnLoadBalancer
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/loadbalancer.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        CertificateArn: !Ref LoadBalancerCertificateArn
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName

  DBStack: 
    Type: AWS::CloudFormation::Stack
    Properties: 
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/database.yaml
      Parameters: 
        Name: !Ref Name
        DatabaseName: !Join ['',[!Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name]]]
        DatabaseUser: !Ref DatabaseUser
        DatabaseUserPassword: !If [HasDatabaseUserPassword, !Ref DatabaseUserPassword, !Ref 'AWS::NoValue']
        DeletionProtection: !If [IsProd, true, false]
        EnableCPUCreditAlarm: !If [IsProd, true, false]
        EnableEnhancedMonitoring: !If [IsProd, true, false]
        EnvName: !Ref EnvName
        Engine: aurora-postgresql
        EngineVersion: 12.4
        Family: aurora-postgresql12
        InstanceType: db.t3.medium #Can only be medium or large for t class
        MasterUser: !Ref MasterUser
        MasterUserPassword: !If [HasMasterUserPassword, !Ref MasterUserPassword, !Ref 'AWS::NoValue']
        Port: 5432
        NetworkStackName: !Ref NetworkStackName
        OrgName: !Ref OrgName
        SnapshotIdentifier: !If [HasDBSnapshotIdentifier, !Ref DBSnapshotIdentifier, !Ref 'AWS::NoValue']
        SNSStackName: !Ref SNSStackName
        StorageEncrypted: true

  DeployStack: 
    Type: AWS::CloudFormation::Stack
    Properties: 
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/deployment.yaml
      Parameters: 
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName
  
  AppServerStack: 
    DependsOn: 
      - DBStack
      - DeployStack
    Type: AWS::CloudFormation::Stack
    Properties: 
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/appserver-basic.yaml
      Parameters: 
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        ClientDomainName: !Ref ClientDomainName
        DatabaseEndpoint: 
          Fn::GetAtt:
            - DBStack
            - Outputs.ClusterEndpointAddress
        DatabasePort: 
          Fn::GetAtt:
            - DBStack
            - Outputs.ClusterPort
        DatabaseSecurityGroupId:
          Fn::GetAtt:
            - DBStack
            - Outputs.SecurityGroupId
        LoadBalancerPriority: !Ref LoadBalancerPriority
        LoadBalancerStackName: !If [HasOwnLoadBalancer, !Select [ 1, !Split [ '/', !Ref ELBStack]], !Ref LoadBalancerStackName]
        InstanceAMI: !Ref InstanceAMI
        InstanceKeyName: !Ref InstanceKeyName
        InstanceType: t3.medium
        LoadBalancerHostName: !If [HasLoadBalancerHostName, !Ref LoadBalancerHostName, !Ref 'AWS::NoValue']
        SNSStackName: !Ref SNSStackName
        NetworkStackName: !Ref NetworkStackName

  BackupStack:
    DependsOn: 
      - DBStack
      - AppServerStack
    Type: AWS::CloudFormation::Stack
    Properties: 
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/backup.yaml
      Parameters: 
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        BackupARNList: !Join
          - ','
          - - Fn::GetAtt:
              - DBStack
              - Outputs.DBClusterARN
            - Fn::GetAtt:
              - AppServerStack
              - Outputs.AppServerEFSArn

  SchedulerStack: 
    DependsOn: 
      - DBStack
      - AppServerStack
    Type: AWS::CloudFormation::Stack
    Properties: 
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters: 
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: TRUE
        DatabaseClusterArn:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBClusterARN
        CodeDeployApplicationName:
          Fn::GetAtt:
            - DeployStack
            - Outputs.CodeDeployApplicationName
        CodeDeployDeploymentGroupName:
          Fn::GetAtt:
            - DeployStack
            - Outputs.CodeDeployDeploymentGroupName

Outputs:
  DeploymentUserGroup:
    Description: Add your BitBucket user into this group
    Value: 
      Fn::GetAtt:
        - DeployStack
        - Outputs.DeploymentUserGroup
