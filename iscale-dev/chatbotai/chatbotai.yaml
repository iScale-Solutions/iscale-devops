AWSTemplateFormatVersion: 2010-09-09
Description: This CloudFormation stack will deploy the Chatbot AI Infrastructure

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
          - DeletionProtection
          - ClientDomainName
          - ELBStackName
          - LoadBalancerHostName
      - Label:
          default: Instance Configuration
        Parameters:
          - InstanceKeyName
          - InstanceAMI
          - InstanceType
      - Label:
          default: Scheduler Configuration
        Parameters:
          - StartScheduleExpression
          - StopScheduleExpression
          - EC2InstanceTag
          - UseFriendlyNames

    ParameterLabels:
      Name:
        default: Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      NetworkStackName:
        default: Network Stack Name
      SNSStackName:
        default: SNS Stack Name
      DeletionProtection:
        default: Enable Deletion Protection
      InstanceKeyName:
        default: Key Pair Name
      InstanceAMI:
        default: AMI ID
      InstanceType:
        default: Instance Type
      StartScheduleExpression:
        default: Start Schedule Expression
      StopScheduleExpression:
        default: Stop Schedule Expression

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name)
    Type: String
    MinLength: 3
    MaxLength: 12
    Default: chatbotai
  OrgName:
    Description: The name of the organization
    Type: String
    Default: iscale-dev
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen
    MaxLength: 20
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production # Test for uat
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  ClientDomainName:
    Description: The domain name for the client
    Type: String
    Default: iscale-software.com
    AllowedPattern: ^[a-z0-9]+([\-\.]{1}[a-z0-9]+)*\.[a-z]{2,7}$
    ConstraintDescription: Domain name must only contain lowercase letters, numbers and hyphen
    MaxLength: 30
  DeletionProtection:
    Description: Set to true to enable (valid only in Production mode)
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  InstanceAMI:
    Description: Instance AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-0883100926d78f546 # AL2
  InstanceAMIWorker:
    Description: Instance AMI ID for worker nodes
    Type: AWS::EC2::Image::Id
    Default: ami-070da720b8892bed8 # Ubuntu
  InstanceKeyName:
    Description: Instance Key Name
    Type: String
    Default: ''
  InstanceType:
    Description: Type of instance for app server
    Type: String
    Default: t3.medium
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge
  ELBStackName:
    Description: The name of the ELB stack
    Type: String
    Default: iscale-dev-stg-uw2-alb
    MinLength: 1
  LoadBalancerHostName:
    Description: The host name of the load balancer
    Type: String
    Default: ''
  NetworkStackName:
    Description: The name of the network stack
    Type: String
    Default: iscale-dev-dev-uw2-network
    MinLength: 1
  SNSStackName:
    Description: The name of the SNS stack
    Type: String
    Default: iscale-dev-dev-uw2-sns
    MinLength: 1
  StartScheduleExpression:
    Description: Schedule expression when to start the objects
    Type: String
    Default: cron(0 0 ? * MON-FRI *)
  StopScheduleExpression:
    Description: Schedule expression when to stop the objects
    Type: String
    Default: cron(0 10 ? * MON-FRI *)
  EC2InstanceTag:
    Description: The tag to identify the EC2 instance
    Type: String
    Default: CHATBOTAI
  UseFriendlyNames:
    Description: Set to TRUE to have nice formatted scheduler event names
    Type: String
    AllowedValues:
      - TRUE
      - FALSE
    Default: TRUE

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
       Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasKeyName: !Not [!Equals [!Ref InstanceKeyName, '']]
  HasLoadBalancerHostName: !Not [!Equals [!Ref LoadBalancerHostName, '']]
  UseFriendlyNames: !Equals [!Ref UseFriendlyNames, TRUE]

Resources:

##
# K3s Cluster
##
  K3sMasterServerStack:
    DependsOn:
      - DBStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/appserver-basic2.yaml
      Parameters:
        Name: !Join ['-', [!Ref Name, master]]
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        ASGHealthCheckType: EC2
        ASGMaxSize: 1
        ASGDesiredSize: 0
        ClientDomainName: !Ref ClientDomainName
        DatabaseEndpoint:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBInstanceAddress
        DatabasePort:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBInstancePort
        DatabaseSecurityGroupId:
          Fn::GetAtt:
            - DBStack
            - Outputs.SecurityGroupId
        InstanceAMI: !Ref InstanceAMI
        InstanceKeyName: !If [HasKeyName, !Ref InstanceKeyName, !Ref 'AWS::NoValue']
        InstancePort: 8051
        InstanceSubnet: Private
        InstanceType: !Ref InstanceType
        LoadBalancerHostName: !If 
        - HasLoadBalancerHostName
        - !If 
            - IsNotProd
            - !Join 
                - '-'
                - [!Ref LoadBalancerHostName, !FindInMap [EnvShort, !Ref EnvName, Name]]
            - !Ref LoadBalancerHostName
        - !Ref 'AWS::NoValue'
        LoadBalancerPriority: !If [IsNotProd, 11, 30]
        LoadBalancerStackName: !Ref ELBStackName
        NetworkStackName: !Ref NetworkStackName
        SharedSecretId:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBSecretManagerKeyId
        SNSStackName: !Ref SNSStackName
        UseFriendlyNames: FALSE
        VolumeName: /dev/sda1
        LaunchTemplate: True
        VolumeSize: !If [IsNotProd, 20, 50]
        VolumeType: gp3

##
# DNS, Target Groups, and HTTP Listener Rules
##
  WebappTgDnsConfigStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/tg-dns-config.yaml
      Parameters:
        Name: 'webapp'
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        AlbStackName: !Ref ELBStackName
        ListenerPriority: !If [IsNotProd, 21, 31]
        LoadBalancerHostName: !Ref LoadBalancerHostName
        NetworkStackName: !Ref NetworkStackName
        ClientDomainName: !Ref ClientDomainName
        TargetGroupPort: 30501
  
  BackendTgDnsConfigStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/tg-dns-config.yaml
      Parameters:
        Name: 'api'
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        AlbStackName: !Ref ELBStackName
        ListenerPriority: !If [IsNotProd, 22, 32]
        LoadBalancerHostName: !Ref LoadBalancerHostName
        NetworkStackName: !Ref NetworkStackName
        ClientDomainName: !Ref ClientDomainName
        TargetGroupPort: 30080
  
  WsgiTgDnsConfigStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/tg-dns-config.yaml
      Parameters:
        Name: 'wsgi'
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        AlbStackName: !Ref ELBStackName
        ListenerPriority: !If [IsNotProd, 23, 33]
        LoadBalancerHostName: !Ref LoadBalancerHostName
        NetworkStackName: !Ref NetworkStackName
        ClientDomainName: !Ref ClientDomainName
        TargetGroupPort: 30800

##
# Security Group Ingress - webapp and backend
##
  WebAppSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from Load Balancer
      GroupId: !If [IsNotProd, !GetAtt K3sMasterServerStack.Outputs.AppServerSecurityGroup, !GetAtt K3sWorkerServerStack.Outputs.AppServerSecurityGroup] 
      IpProtocol: tcp
      FromPort: 30501
      ToPort: 30501
      SourceSecurityGroupId: 
        Fn::ImportValue:
          !Sub "${ELBStackName}-SecurityGroupId"
  
  BackendSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from Load Balancer
      GroupId: !If [IsNotProd, !GetAtt K3sMasterServerStack.Outputs.AppServerSecurityGroup, !GetAtt K3sWorkerServerStack.Outputs.AppServerSecurityGroup] 
      IpProtocol: tcp
      FromPort: 30080
      ToPort: 30080
      SourceSecurityGroupId: 
        Fn::ImportValue:
          !Sub "${ELBStackName}-SecurityGroupId"

  WsgiSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from Load Balancer
      GroupId: !If [IsNotProd, !GetAtt K3sMasterServerStack.Outputs.AppServerSecurityGroup, !GetAtt K3sWorkerServerStack.Outputs.AppServerSecurityGroup] 
      IpProtocol: tcp
      FromPort: 30800
      ToPort: 30800
      SourceSecurityGroupId: 
        Fn::ImportValue:
          !Sub "${ELBStackName}-SecurityGroupId"

  K3sWorkerSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: IsProd
    Properties:
      Description: Allow connection from Worker Nodes
      GroupId: !GetAtt K3sMasterServerStack.Outputs.AppServerSecurityGroup
      IpProtocol: tcp
      FromPort: 6443
      ToPort: 6443
      SourceSecurityGroupId: !GetAtt K3sWorkerServerStack.Outputs.AppServerSecurityGroup

##
# API Gateway
##

  ApiGateway:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Join 
        - '-'
        - [!Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], apigateway]
      ProtocolType: HTTP
      Description: !Join 
        - ' '
        - ['API for the Chatbot AI application in the', !Ref EnvName, 'environment']
      Tags:
        OrgName: !Ref OrgName
        EnvName: !Ref EnvName

  ApiGatewayIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiGateway
      IntegrationType: HTTP_PROXY
      IntegrationUri: !Join ['', [ 'https://', !GetAtt WsgiTgDnsConfigStack.Outputs.Route53RecordSet]]
      IntegrationMethod: POST
      PayloadFormatVersion: '1.0'

  ApiGatewayRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: "POST /"
      Target: !Join 
        - '/'
        - ["integrations", !Ref ApiGatewayIntegration]

  ApiGatewayStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ApiGateway
      StageName: !FindInMap [EnvShort, !Ref EnvName, Name]
      AutoDeploy: true

##
# K3s Master Scheduler
##       
  LambdaScheduleEC2InstanceRole:
    # Condition: IsNotProd
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: ScheduleEC2InstancePolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeTags
                Resource: "*"
              - Effect: Allow
                Action:
                  - ec2:StartInstances
                  - ec2:StopInstances
                Resource: !Join [":", ["arn", "aws", "ec2", !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', '*' ]]]]
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"

  StopEC2InstanceByTagFunction:
    # Condition: IsNotProd
    Type: AWS::Lambda::Function
    Properties:
      Description: Lambda Function stopping an EC2 instance
      Handler: index.lambda_handler
      Role: !GetAtt LambdaScheduleEC2InstanceRole.Arn
      Runtime: python3.12
      Timeout: 60
      Environment:
        Variables:
          REGION: !Ref AWS::Region
          SYSTEM_TAG: !Ref EC2InstanceTag
          ENVIRONMENT_TAG: !Ref EnvName
      Code:
        ZipFile: |
          import boto3
          import os
          
          ec2 = boto3.resource('ec2')

          def lambda_handler(event, context):
            # Use the filter() method of the instances collection to retrieve
            # all running EC2 instances.
            system_tag_value = os.environ.get('SYSTEM_TAG', 'DefaultValue')
            environment_tag_value = os.environ.get('ENVIRONMENT_TAG', 'DefaultValue')
            filters = [
                {
                    'Name' : 'tag:System', 
                    'Values': [system_tag_value]
                },
                {
                    'Name': 'tag:Environment',
                    'Values': [environment_tag_value] 
                },
                {
                    'Name': 'instance-state-name', 
                    'Values': ['running']
                }]
            
            # Filter the and locate all running instances
            instances = ec2.instances.filter(Filters=filters)
            instance_ids_to_stop = [instance.id for instance in instances]
            
            # ensures instances are actually shutdown 
            if len(instance_ids_to_stop) > 0:
                try:    
                    # Perform the shutdown
                    shuttingDown = ec2.instances.filter(InstanceIds=instance_ids_to_stop).stop()
                    print(f"Stopped {len(instance_ids_to_stop)} instances")
                except Exception as e:
                    print(f"Error stopping instances: {e}")
            else:
                print ("Nothing to see here")

            return{
                'statusCode': 200,
                'statusMessage': 'OK'
            }
  StopEC2InstanceByTagFunctionPermission:
    # Condition: IsNotProd
    Type: AWS::IAM::Policy
    Properties:
      Groups:
        - !Ref UserPermissionsGroup
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource: !GetAtt StopEC2InstanceByTagFunction.Arn
      PolicyName: AllowStopEC2InstanceByTag

  StopScheduledEC2InstanceEventRule:
    Type: AWS::Events::Rule
    # Condition: IsNotProd
    Properties:
      Name: !If
        - UseFriendlyNames
        - !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, ec2, stop]]
        - !Ref 'AWS::NoValue'
      Description: !Join [' ',[ Stop, !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], at, !Ref StopScheduleExpression]]
      ScheduleExpression: !Ref StopScheduleExpression
      State: ENABLED
      Targets:
        - Arn: !GetAtt StopEC2InstanceByTagFunction.Arn
          Id: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, ec2, stop]]
  
  ScheduledEventPermissionToStopEC2Instance:
    # Condition: IsNotProd
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StopEC2InstanceByTagFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt StopScheduledEC2InstanceEventRule.Arn
  
  StartEC2InstanceByTagFunction:
    # Condition: IsNotProd
    Type: AWS::Lambda::Function
    Properties:
      Description: Lambda Function starting an EC2 instance
      Handler: index.lambda_handler
      Role: !GetAtt LambdaScheduleEC2InstanceRole.Arn
      Runtime: python3.12
      Timeout: 60
      Environment:
        Variables:
          REGION: !Ref AWS::Region
          SYSTEM_TAG: !Ref EC2InstanceTag
          ENVIRONMENT_TAG: !Ref EnvName
      Code:
        ZipFile: |
          import boto3
          import os

          ec2 = boto3.resource('ec2')

          def lambda_handler(event, context):
              # Retrieve the system tag value from environment variables
              system_tag_value = os.environ.get('SYSTEM_TAG', 'DefaultValue')
              environment_tag_value = os.environ.get('ENVIRONMENT_TAG', 'DefaultValue')
              
              # Define filters to find stopped instances with the specified system tag
              filters = [
                  {
                      'Name': 'tag:System',
                      'Values': [system_tag_value]
                  },
                  {
                      'Name': 'tag:Environment',
                      'Values': [environment_tag_value] 
                  },
                  {
                      'Name': 'instance-state-name',
                      'Values': ['stopped']
                  }
              ]
              
              # Filter and locate all stopped instances with the given system tag
              instances = ec2.instances.filter(Filters=filters)
              
              # Now filter out instances where the 'Name' tag contains 'manual'
              instance_ids_to_start = []
              for instance in instances:
                  name_tag = next((tag['Value'] for tag in instance.tags if tag['Key'] == 'Name'), '').lower()
                  if 'manual' not in name_tag:
                      instance_ids_to_start.append(instance.id)
              
              if instance_ids_to_start:
                  try:
                      # Start the filtered instances
                      starting_instances = ec2.instances.filter(InstanceIds=instance_ids_to_start).start()
                      print(f"Started {len(instance_ids_to_start)} instances: {instance_ids_to_start}")
                  except Exception as e:
                      print(f"Error starting instances: {e}")
              else:
                  print("No eligible stopped instances to start.")
              
              return {
                  'statusCode': 200,
                  'statusMessage': 'OK'
              }

  StartEC2InstanceByTagFunctionPermission:
    # Condition: IsNotProd
    Type: AWS::IAM::Policy
    Properties:
      Groups:
        - !Ref UserPermissionsGroup
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource: !GetAtt StartEC2InstanceByTagFunction.Arn
      PolicyName: AllowStartEC2InstanceByTag

  StartScheduledEC2InstanceEventRule:
    Type: AWS::Events::Rule
    # Condition: IsNotProd
    Properties:
      Name: !If
        - UseFriendlyNames
        - !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, ec2, start]]
        - !Ref 'AWS::NoValue'
      Description: !Join [' ',[ Start, !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], at, !Ref StartScheduleExpression]]
      ScheduleExpression: !Ref StartScheduleExpression
      State: ENABLED
      Targets:
        - Arn: !GetAtt StartEC2InstanceByTagFunction.Arn
          Id: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, ec2, start]]
  
  ScheduledEventPermissionToStartEC2Instance:
    # Condition: IsNotProd
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StartEC2InstanceByTagFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt StartScheduledEC2InstanceEventRule.Arn

  UserPermissionsGroup:
    Type: AWS::IAM::Group

##
# K3s Worker Section
##

  K3sWorkerServerStack:
    Condition: IsProd
    DependsOn:
      - DBStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/appserver-basic2.yaml
      Parameters:
        Name: !Join ['-', [!Ref Name, worker]]
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        ASGHealthCheckType: EC2
        ASGMinSize: 0
        ASGDesiredSize: 1
        ASGMaxSize: 2
        ClientDomainName: !Ref ClientDomainName
        DatabaseEndpoint:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBInstanceAddress
        DatabasePort:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBInstancePort
        DatabaseSecurityGroupId:
          Fn::GetAtt:
            - DBStack
            - Outputs.SecurityGroupId
        ExternalEFSID:
          Fn::GetAtt:
            - K3sMasterServerStack
            - Outputs.AppServerEFS
        ExternalEFSSecurityGroup:
          Fn::GetAtt:
            - K3sMasterServerStack
            - Outputs.AppServerEFSSecurityGroup
        InstanceAMI: !Ref InstanceAMIWorker
        InstanceKeyName: !If [HasKeyName, !Ref InstanceKeyName, !Ref 'AWS::NoValue']
        InstancePort: 30501
        InstanceSubnet: Private
        InstanceType: t3.large
        LoadBalancerHostName: !If 
        - HasLoadBalancerHostName
        - !Join ['-', [!Ref LoadBalancerHostName, !FindInMap [EnvShort, !Ref EnvName, Name], 'w']]
        - !Ref 'AWS::NoValue'
        LoadBalancerPriority: 29
        LoadBalancerStackName: !Ref ELBStackName
        NetworkStackName: !Ref NetworkStackName
        SharedSecretId:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBSecretManagerKeyId
        SNSStackName: !Ref SNSStackName
        UseFriendlyNames: FALSE
        LaunchTemplate: True
        VolumeName: /dev/sda1
        VolumeSize: 60
        VolumeType: gp3
  
