##
# PostgreSQL Database
##
  DBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/database.yaml
      Parameters:
        Name: !Ref Name
        DatabaseName: !Join ['',[!Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], db]]
        AllocatedStorage: !If [IsProd, 50, 20]
        BackupRetentionPeriod: !If [IsProd, 30, 7]
        DeletionProtection: !If [IsProd, !Ref DeletionProtection, false]
        EnableEnhancedMonitoring: !If [IsProd, true, false]
        EnablePerformanceInsights: !If [IsProd, true, false]
        EnvName: !Ref EnvName
        Engine: postgres
        EngineVersion: 17.4
        Family: postgres17
        InstanceType: !If [IsProd, db.t4g.large, db.t4g.micro]
        MasterUser: root
        MultiAz: !If [IsProd, true, false]
        NetworkStackName: !Ref NetworkStackName
        OrgName: !Ref OrgName
        Port: 5432
        SNSStackName: !Ref SNSStackName
        StorageEncrypted: true
        StorageType: gp3

  DBSchedulerStack:
    DependsOn:
      - DBStack
    Condition: IsNotProd
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: FALSE
        DatabaseInstanceName:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBInstanceName


###
# ECR - web-app
###

  ECRWebApp:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: false
      EncryptionConfiguration: 
        EncryptionType: AES256
      ImageScanningConfiguration: 
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      RepositoryName: chatbotai-webapp
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], webapp]]
        - Key: OrgName
          Value: !Ref OrgName

###
# ECR - backend
###

  ECRBackend:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: false
      EncryptionConfiguration: 
        EncryptionType: AES256
      ImageScanningConfiguration: 
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      RepositoryName: chatbotai-backend
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], ai-backend]]
        - Key: OrgName
          Value: !Ref OrgName

##
# IAM  Roles
##

  DeplomentUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !Ref Name, ecr-deploy]]
      Policies:
        - PolicyName: ecrWriteAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'     
              - Effect: Allow
                Action:
                  - ecr:CompleteLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:InitiateLayerUpload
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                Resource: 
                  - !GetAtt ECRWebApp.Arn
                  - !GetAtt ECRBackend.Arn

  ExternalSecretsUser:    # for External Secrets (will change to IAM role once integrated with ArgoCD)
    Type: AWS::IAM::User
    Properties:
      UserName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !Ref Name, external-secrets]]
      Policies:
        - PolicyName: ExternalSecretsPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:    
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: 
                  - !GetAtt DBStack.Outputs.DBSecretManager

Outputs:
  ECRWebApp:
    Description: ECR Web App Repository
    Value: !GetAtt ECRWebApp.RepositoryUri
  
  ECRBackend:
    Description: ECR Backend Repository
    Value: !GetAtt ECRBackend.RepositoryUri
                


  
  
  