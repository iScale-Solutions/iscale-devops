  ####
  # Environment Conditions
  ####
  
  IsDev:
    Fn::Equals:
      - Ref: EnvName
      - Development
  IsTest:
    Fn::Equals:
      - Ref: EnvName
      - Test
  IsStaging:
    Fn::Equals:
      - Ref: EnvName
      - Staging
  IsProd: 
    Fn::Equals:
      - Ref: EnvName
      - Production
  IsNotDev: 
    Fn::Not:
      - Condition: IsDev
  IsNotTest: 
    Fn::Not:
      - Condition: IsTest
  IsNotStaging: 
    Fn::Not:
      - Condition: IsStaging
  IsNotProd: 
    Fn::Not:
      - Condition: IsProd
  IsStagingOrProd: 
    Fn::Or:
      - Condition: IsStaging
      - Condition: IsProd