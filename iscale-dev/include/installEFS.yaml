  # AppServerLaunchConfig: 
  #   Type: AWS::AutoScaling::LaunchConfiguration
  #   Metadata: 
  #     AWS::CloudFormation::Init: 
  #       configSets: 
  #         MyConfigset: 
  #           - InstallEFS
        InstallEFS:
          packages:
            yum: 
              amazon-efs-utils: []
          commands:
            command01:
              command: mkdir -p /var/www/html/pub
            command02:
              command: mkdir -p /mnt/efs
            command06:
              command: mount -t efs -o tls,iam $EFS_ID /mnt/efs
              env:
                EFS_ID: 
                  Ref: AppServerFileSystem
            command07:
              command: echo '$EFS_ID:/ /mnt/efs efs _netdev,tls,iam 0 0' >> /etc/fstab
              env:
                EFS_ID:
                  Ref: AppServerFileSystem
            command08:
              command: mkdir -p /mnt/efs/pub/media
            command10:
              command: ln -s /mnt/efs/pub/media /var/www/html/pub