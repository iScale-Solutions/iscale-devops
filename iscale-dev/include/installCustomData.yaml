  # AppServerLaunchConfig: 
  #   Type: AWS::AutoScaling::LaunchConfiguration
  #   Metadata: 
  #     AWS::CloudFormation::Init: 
  #       configSets: 
  #         MyConfigset: 
  #           - InstallCustomData
        # InstallCustomData:
          packages:
            yum: 
              jq: []
          files:
            /var/lib/cloud/instance/custom-data.sh: 
              content:
                Fn::Sub:
                  - |
                    STACK_NAME=${AWS::StackName}
                    AWS_REGION=${AWS::Region}
                    DOMAIN=${DOMAIN}
                    ENVIRONMENT=${ENVIRONMENT}
                    CLIENT_NAME=${CLIENT_NAME}
                    APPLICATION_SITE=${APPLICATION_SITE}
                    INSTANCE_ROLE=${INSTANCE_ROLE}
                    SECRET_ID=${SECRET_ID}
                    BASE_URL=https://${DOMAIN}/
                    BUCKET_NAME=${BUCKET_NAME}
                    DB_HOST=${DB_HOST}
                    DB_PORT=${DB_PORT}
                  - DOMAIN: #!Join ['.', [!Join ['-',[!Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name]]], !Ref ClientDomainName]]
                      Fn::Join:
                        - '.'
                        - - Fn::Join:
                            - '-'
                            - - Ref: Name
                              - Fn::FindInMap:
                                - EnvShort
                                - Ref: EnvName
                                - Name
                              - Ref: ClientDomainName
                    ENVIRONMENT: 
                      Ref: EnvName
                    CLIENT_NAME: 
                      Ref: Name
                    APPLICATION_SITE: 
                      Ref: OrgName
                    INSTANCE_ROLE: 
                      Ref: AppServerIamRole
                    SECRET_ID: #!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
                      Fn::Join:
                        - '='
                        - - Ref: OrgName
                          - Fn::FindInMap:
                            - EnvShort
                            - Ref: EnvName
                            - Name
                          - Fn::FindInMap:
                            - RegionShort
                            - Ref: 'AWS::Region'
                            - Name
                          - Ref: Name
                    BUCKET_NAME: 
                      Ref: DataS3Bucket
                    DB_HOST: 
                      Ref: DatabaseEndpoint
                    DB_PORT: 
                      Ref: DatabasePort
              permissions: 0700
              owner: root
              group: root