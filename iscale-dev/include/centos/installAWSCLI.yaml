  # AppServerLaunchConfig: 
  #   Type: AWS::AutoScaling::LaunchConfiguration
  #   Metadata: 
  #     AWS::CloudFormation::Init: 
  #       configSets: 
  #         MyConfigset: 
  #           - InstallAWSCLI
        # InstallAWSCLI:
          commands:
            01_Curl_CLI_Bundle: 
              command: curl "https://s3.amazonaws.com/aws-cli/awscli-bundle.zip" -o "awscli-bundle.zip"
              cwd: /tmp
            02_Unzip_CLI_Bundle: 
              command: unzip awscli-bundle.zip
              cwd: /tmp
            03_Install_CLI_Bundle: 
              command: ./awscli-bundle/install -i /usr/local/aws -b /usr/local/bin/aws
              cwd: /tmp
            04_Symlink_CLI:
              command: ln -s /usr/local/bin/aws /usr/bin/
              cwd: /tmp
            05_Cleanup_CLI_Install:
              command: rm -fr /tmp/awscli-bundle
              cwd: /tmp
            06_Cleanup_CLI_Zip:
              command: rm -f /tmp/awscli-bundle.zip
              cwd: /tmp
