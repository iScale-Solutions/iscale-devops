  # AppServerLaunchConfig: 
  #   Type: AWS::AutoScaling::LaunchConfiguration
  #   Metadata: 
  #     AWS::CloudFormation::Init: 
  #       configSets: 
  #         MyConfigset: 
  #           - InstallEFS
        # InstallEFS:
          packages:
            yum: 
              git: []
              make: []
              rpm-build: []
          commands:
            01_GitClone_EFS:
              command: git clone https://github.com/aws/efs-utils
              cwd: /tmp
            02_Make_RPM:
              command: make rpm
              cwd: /tmp/efs-utils
            03_Install_EFS:
              command: yum -y install ./build/amazon-efs-utils*rpm
              cwd: /tmp/efs-utils
            04_Cleanup_Install:
              command: rm -fr /tmp/efs-utils
            05_Mkdir_Mnt_EFS:
              command: mkdir -p /mnt/efs
            06_Config_EFS:
              command: sed -i 's,^stunnel_check_cert_hostname = true,stunnel_check_cert_hostname = false,' /etc/amazon/efs/efs-utils.conf
            07_Mount_EFS:
              command: mount -t efs -o tls,iam $EFS_ID /mnt/efs
              env:
                EFS_ID: 
                  Ref: AppServerFileSystem
            08_CreateFSTab:
              command: echo '$EFS_ID:/ /mnt/efs efs _netdev,tls,iam 0 0' >> /etc/fstab
              env:
                EFS_ID:
                  Ref: AppServerFileSystem