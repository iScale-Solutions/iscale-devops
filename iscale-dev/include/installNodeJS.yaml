  # AppServerLaunchConfig: 
  #   Type: AWS::AutoScaling::LaunchConfiguration
  #   Metadata: 
  #     AWS::CloudFormation::Init: 
  #       configSets: 
  #         MyConfigset: 
  #           - InstallNodeJS
        # InstallNodeJS:
          commands:
            command01:
              command: wget https://raw.githubusercontent.com/creationix/nvm/v0.33.2/install.sh
              cwd: /root
              ignoreErrors: true
            command02:
              command: bash /root/install.sh
              env: 
                NVM_DIR: /root/.nvm
            command04:
              command: echo 'export NVM_DIR="/root/.nvm"' >> /root/.bashrc
            command05:
              command: echo '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"' >> /root/.bashrc
            command06:
              command: echo '[ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"' >> /root/.bashrc
            command07:
              cwd: /root
              command: 
                Fn::Sub:
                  | 
                  export NVM_DIR="/root/.nvm"
                  [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
                  [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
                  nvm install 4.3