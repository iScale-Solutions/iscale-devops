  AllowFutureSpiritDeployBucket:
    Type: AWS::S3::BucketPolicy
    Condition: IsStagingOrProd
    Properties:
      Bucket: !GetAtt [DeployStack, Outputs.DeploymentBucketName]
      PolicyDocument:
        Statement:
          -
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:ListBucket
            Effect: Allow
            Resource:
              - !GetAtt [DeployStack, Outputs.DeploymentBucketArn]
              - !Join ['', [!GetAtt [DeployStack, Outputs.DeploymentBucketArn], '/*']]
            Principal:
              AWS:
                - 181473428529 #Future Spirit

Outputs:
  DeploymentUserGroup:
    Description: Add your BitBucket user into this group
    Value: 
      Fn::GetAtt:
        - DeployStack
        - Outputs.DeploymentUserGroup
