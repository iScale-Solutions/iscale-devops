AWSTemplateFormatVersion: 2010-09-09
Description: Toki app Images Builder

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
      - Label:
          default: Sharing Configuration
        Parameters:
          - ShareImage

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      NetworkStackName:
        default: Network Stack Name
      ShareImage:
        default: Share image with other account? If sharing, encryption will be disabled.
      SNSStackName:
        default: SNS Topic Stack Name

Parameters:
  Name:
    Description: Unique name/identifier (e.g. wordpress).
    Type: String
    Default: toki
    AllowedPattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  NetworkStackName:
    Description: The name of the network stack.
    Type: String
    Default: iscale-dev-dev-uw2-network
    MinLength: 1
  ShareImage:
    Description: Select true to not encrypt the image and share it with other accounts
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  SNSStackName:
    Description: the name of the SNS stack.
    Type: String
    Default: iscale-dev-dev-uw2-sns
    MinLength: 1

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml      
  IsImageShared: !Equals [!Ref ShareImage, true]

Resources:

###
# NodeJS Image builder
###

  NodejsComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: Nodejs
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 1.0.0
      Description: Installs NodeJS 
      ChangeDescription: Initial version
      Data: |
        name: NodeJS v16.19.0 - InlineData
        description: Installation of NodeJS 16.19.0
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: DownloadRemoteFile
                action: WebDownload
                maxAttempts: 3
                inputs:
                  - source: https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.3/install.sh
                    destination: /home/ec2-user/install.sh
                    overwrite: true
              - name: CreateBashRC
                action: CreateFile
                inputs:
                  - path: /root/.bashrc
                    content: export NVM_DIR=/home/ec2-user/.nvm
                    overwrite: true
                    owner: root
                    group: root
                    permissions: 0755
                  - path: /home/ec2-user/.bashrc
                    content: export NVM_DIR=/home/ec2-user/.nvm
                    overwrite: true
                    owner: ec2-user
                    group: ec2-user
                    permissions: 0755
              - name: InstallNode
                action: ExecuteBash
                inputs:
                  commands:
                    - /bin/bash /home/ec2-user/install.sh
                    - |
                      . /home/ec2-user/.nvm/nvm.sh
                      nvm install 16.19.0
                    - chown -R ec2-user:ec2-user /home/ec2-user/.nvm/

  TokiImageRecipe:
    Type: AWS::ImageBuilder::ImageRecipe
    Properties:
      Name: !Join [' ', [!Ref OrgName, app]]
      Version: 1.0.7
      ParentImage: !Join ['', ['arn:aws:imagebuilder:', !Ref AWS::Region, ':', !Ref AWS::AccountId, ':image/', !Ref OrgName, '-amazon-linux2/1.0.0']]
      WorkingDirectory: /tmp
      Description: !Join [' ', [!Ref OrgName, app]]
      Components: #Max 20
        - ComponentArn: !Ref NodejsComponent
        - ComponentArn: !Join [':', ['arn:aws:imagebuilder', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'component/mysql-client/1.0.1/1']]
        - ComponentArn: !Join [':', ['arn:aws:imagebuilder', !Ref 'AWS::Region', 'aws:component/simple-boot-test-linux/1.0.0/1']]
        - ComponentArn: !Join [':', ['arn:aws:imagebuilder', !Ref 'AWS::Region', 'aws:component/amazon-cloudwatch-agent-linux/1.0.1/1']]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: !If [IsImageShared, false, true]
            KmsKeyId: !If [IsImageShared, !Ref 'AWS::NoValue', !Join [':', ['arn:aws:kms', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'alias/aws/ebs']]]
            VolumeType: gp2
            VolumeSize: 8

  TokiImageBuilder:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/ec2-image-builder.yaml
      Parameters:
        Name: app
        EnvName: !Ref EnvName
        NetworkStackName: !Ref NetworkStackName
        OrgName: !Ref OrgName
        ImageRecipeARN: !Ref AppImageRecipe
        ShareImage: !Ref ShareImage
        SNSStackName: !Ref SNSStackName
