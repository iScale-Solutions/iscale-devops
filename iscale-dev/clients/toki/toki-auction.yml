AWSTemplateFormatVersion: 2010-09-09
Description: Toki Auction Resources

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
          - LoadBalancerStackName
      - Label:
          default: Load Balancer Configuration
        Parameters:
          - ClientDomainName
          - LoadBalancerPriority
          - LoadBalancerHostName
      - Label:
          default: Instance Configuration
        Parameters:
          - InstanceKeyName
          - InstanceAMI
          - InstanceType
          - VolumeName
          - VolumeSize
          - VolumeType
      - Label:
          default: Scheduler Configuration
        Parameters:
          - StartScheduleExpression
          - StopScheduleExpression

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      InstanceAMI:
        default: Instance AMI ID
      InstanceKeyName:
        default: Instance Key Name
      InstanceType:
        default: Instance Type
      VolumeName:
        default: Volume Device Name
      VolumeSize:
        default: Volume Disk Size
      VolumeType:
        default: Volume Disk Type
      LoadBalancerHostName:
        default: Load Balancer Host Name
      LoadBalancerPriority:
        default: Load Balancer Rule Priority
      LoadBalancerStackName:
        default: Load Balancer Stack Name
      NetworkStackName:
        default: Network Stack Name
      SNSStackName:
        default: SNS Topic Stack Name
      ClientDomainName:
        default: Domain Name
      StartScheduleExpression:
        default: Start Schedule CRON Expression
      StopScheduleExpression:
        default: Stop Schedule CRON Expression

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 9
    Default: auction
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: tokiasia
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production #Prod
      - Staging #Pre-production
      - Development #Regular day to day commit / deplay
      - Test #WFH Setup with a simple S3 bucket and an access key for it
  ClientDomainName:
    Description: The client's domain name (e.g. example.com, iscale-software.com).
    Type: String
    AllowedPattern: ^[a-z0-9]+([\-\.]{1}[a-z0-9]+)*\.[a-z]{2,7}$
    Default: tokiasia.com
    MinLength: 1
  InstanceAMI:
    Description: Instance AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-00e3c5c75196de93f # Toki auction base - 20230919
  InstanceKeyName:
    Description: Instance Key Name
    Type: String
    Default: ''
  InstanceType:
    Description: Application Instance Type
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.small # staging
      - t3.medium # prod
      - t3.large
      - t3.xlarge
  VolumeName:
    Description: Amazon Linux 2 AMI uses /dev/xvda ; Ubuntu and Windows uses /dev/sda1
    Type: String
    Default: /dev/xvda
    AllowedValues:
      - /dev/xvda
      - /dev/sda1
  VolumeSize:
    Description: EBS Size in GB (minimum 8)
    Type: Number
    Default: 8
  VolumeType:
    Description: EBS Volume Type
    Type: String
    Default: gp2
  LoadBalancerHostName:
    Description: (Optional) Custom Hostname for load balancer URL
    Type: String
    Default: ''
    MaxLength: 12
  LoadBalancerPriority:
    Description: The priority for ELB Listener.
    Type: Number
    Default: 102
    MinValue: 1
    MaxValue: 50000
  LoadBalancerStackName:
    Description: The name of the load balancer stack.
    Type: String
    Default: tokiasia-stg-ase1-loadbalancer
    MinLength: 1
  NetworkStackName:
    Description: The name of the network stack.
    Type: String
    Default: tokiasia-stg-ase1-network
    MinLength: 1
  SNSStackName:
    Description: The name of the SNS stack.
    Type: String
    Default: tokiasia-stg-ase1-sns
    MinLength: 1
  StartScheduleExpression:
    Description: Schedule expression when to start the objects
    Type: String
    Default: cron(0 0 ? * MON-FRI *)
  StopScheduleExpression:
    Description: Schedule expression when to stop the objects
    Type: String
    Default: cron(0 10 ? * MON-FRI *)

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
      
Resources:

  DBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/database.yaml
      Parameters:
        Name: !Ref Name
        DatabaseName: !Join ['',[!Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], db]]
        AllocatedStorage: !If [IsDev, 20, 70] #Gb
        BackupRetentionPeriod: !If [IsProd, 30, 7]
        EnableEnhancedMonitoring: !If [IsProd, true, false]
        EnablePerformanceInsights: !If [IsProd, true, false]
        EnvName: !Ref EnvName
        Engine: mariadb
        EngineVersion: 10.6.10
        Family: mariadb10.6
        InstanceType: !If [IsStaging, db.t3.small, db.t3.medium]
        MasterUser: root
        MultiAz: !If [IsProd, true, false]
        NetworkStackName: !Ref NetworkStackName
        OrgName: !Ref OrgName
        SNSStackName: !Ref SNSStackName
        StorageEncrypted: true
        ExportStackValues: !If [IsProd, false, true]

  CacheStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/elasticache.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        NetworkStackName: !Ref NetworkStackName
        EncryptInTransit: TRUE
        EngineVersion: 6.0
        NodeType: !If [IsProd, cache.t3.small, cache.t3.micro]
        NumCacheClusters: 1
        OrgName: !Ref OrgName
        SnapshotRetentionLimit: !If [IsProd, 30, !Ref 'AWS::NoValue']
        SNSStackName: !Ref SNSStackName
        UseFriendlyNames: TRUE

  DeployStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/deployment.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName

  ServerStack:
    DependsOn:
      - DeployStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/appserver-basic2.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        ClientDomainName: !Ref ClientDomainName
        DatabaseEndpoint: !If
          - IsProd
          - Fn::GetAtt:
              - DBStack
              - Outputs.DBInstanceAddress
          - Fn::GetAtt:
              - DBStack
              - Outputs.DBInstanceAddressExport
        DatabasePort: !If
          - IsProd
          - Fn::GetAtt:
              - DBStack
              - Outputs.DBInstancePort
          - Fn::GetAtt:
              - DBStack
              - Outputs.DBInstancePortExport
        DatabaseSecurityGroupId: !If
          - IsProd
          - Fn::GetAtt:
              - DBStack
              - Outputs.SecurityGroupId
          - Fn::GetAtt:
              - DBStack
              - Outputs.SecurityGroupIdExport
        CacheEndpoint:
          Fn::GetAtt:
            - CacheStack
            - Outputs.CachePrimaryEndpoint
        CachePort:
          Fn::GetAtt:
            - CacheStack
            - Outputs.ClusterPort
        CacheSecurityGroupId:
          Fn::GetAtt:
            - CacheStack
            - Outputs.SecurityGroupId
        InstanceAMI: !Ref InstanceAMI
        InstanceKeyName: !Ref InstanceKeyName
        InstancePort: 80
        InstanceSubnet: Private
        InstanceType: !Ref InstanceType
        LoadBalancerHostName: !If [IsProd, !Ref LoadBalancerHostName, !Ref 'AWS::NoValue']
        LoadBalancerPriority: !Ref LoadBalancerPriority
        LoadBalancerStackName: !Ref LoadBalancerStackName
        NetworkStackName: !Ref NetworkStackName
        SharedSecretId: !If
          - IsProd
          - Fn::GetAtt:
              - DBStack
              - Outputs.DBSecretManagerKeyId
          - Fn::GetAtt:
              - DBStack
              - Outputs.DBSecretManagerKeyIdExport
        SNSStackName: !Ref SNSStackName
        UseFriendlyNames: FALSE
        VolumeName: !Ref VolumeName
        VolumeSize: !Ref VolumeSize
        VolumeType: !Ref VolumeType
        LaunchTemplate: True
        AutoRotate: True
        ASGDesiredSize: 1
        RotateAdd: 2

  SchedulerStack:
    DependsOn:
      - ServerStack
    Condition: IsDevOrStaging
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: FALSE
        CodeDeployApplicationName:
          Fn::GetAtt:
            - DeployStack
            - Outputs.CodeDeployApplicationName
        CodeDeployASGDesiredSize: 1
        CodeDeployDeploymentGroupName:
          Fn::GetAtt:
            - DeployStack
            - Outputs.CodeDeployDeploymentGroupName
        DatabaseInstanceName:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBInstanceNameExport

# Jumphost access

  AllowJumpHostIntoServer:
    Condition: IsNotProd
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from jump host
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
            - ServerStack
            - Outputs.AppServerSecurityGroup
      FromPort: 22
      ToPort: 22
      SourceSecurityGroupId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-JumpHostSecurityGroupId'

  AllowJumpHostIntoDB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from jump host
      IpProtocol: TCP
      GroupId: !If
        - IsProd
        - Fn::GetAtt:
            - DBStack
            - Outputs.SecurityGroupId
        - Fn::GetAtt:
            - DBStack
            - Outputs.SecurityGroupIdExport
      FromPort: !If
        - IsProd
        - Fn::GetAtt:
            - DBStack
            - Outputs.DBInstancePort
        - Fn::GetAtt:
            - DBStack
            - Outputs.DBInstancePortExport
      ToPort: !If
        - IsProd
        - Fn::GetAtt:
            - DBStack
            - Outputs.DBInstancePort
        - Fn::GetAtt:
            - DBStack
            - Outputs.DBInstancePortExport
      SourceSecurityGroupId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-JumpHostSecurityGroupId'

Outputs:

  DeploymentUserGroup:
     Description: Add the BitBucket user into this group
     Value: 
       Fn::GetAtt:
         - DeployStack
         - Outputs.DeploymentUserGroup

  AuctionDBInstanceAddress:
    Condition: IsNotProd
    Description: Auction DB endpoint address
    Value:
      Fn::GetAtt:
        - DBStack
        - Outputs.DBInstanceAddressExport
    Export: 
      Name: !Sub ${AWS::StackName}-AuctionDBInstanceAddress

  AuctionDBInstancePort:
    Condition: IsNotProd
    Description: Auction DB port number
    Value:
      Fn::GetAtt:
        - DBStack
        - Outputs.DBInstancePortExport
    Export: 
      Name: !Sub ${AWS::StackName}-AuctionDBInstancePort

  AuctionDBSecurityGroupId:
    Condition: IsNotProd
    Description: Auction DB Secgroup ID
    Value:
      Fn::GetAtt:
        - DBStack
        - Outputs.SecurityGroupIdExport
    Export: 
      Name: !Sub ${AWS::StackName}-AuctionDBSecurityGroupId