AWSTemplateFormatVersion: 2010-09-09
Description: Toki app Images Builder

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
      - Label:
          default: Sharing Configuration
        Parameters:
          - ShareImage

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      NetworkStackName:
        default: Network Stack Name
      ShareImage:
        default: Share image with other account? If sharing, encryption will be disabled.
      SNSStackName:
        default: SNS Topic Stack Name

Parameters:
  Name:
    Description: Unique name/identifier (e.g. wordpress).
    Type: String
    Default: toki
    AllowedPattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  NetworkStackName:
    Description: The name of the network stack.
    Type: String
    Default: iscale-dev-dev-uw2-network
    MinLength: 1
  ShareImage:
    Description: Select true to not encrypt the image and share it with other accounts
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  SNSStackName:
    Description: the name of the SNS stack.
    Type: String
    Default: iscale-dev-dev-uw2-sns
    MinLength: 1

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml      
  IsImageShared: !Equals [!Ref ShareImage, true]

Resources:

###
# Components
###

  NginxComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: Nginx-Component
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 1.0.0
      Description: Installing nginx 
      ChangeDescription: Initial version
      Data: |
        name: Nginx-Component - InlineData
        description: Installing nginx
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: InstallNginx
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      sudo yum -y install nginx
                      sudo mkdir /var/www
                      sudo systemctl start nginx
                      sudo systemctl enable nginx

  PHPComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: PHP-Component
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 1.0.0
      Description: Installing php using amazon-linux-extras (php 8.1)
      ChangeDescription: Initial version
      Data: |
        name: AmazonLinux2LEMPStackREMI - InlineData
        description: Installing php using amazon-linux-extras (php 8.1)
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: InstallPHP
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      sudo amazon-linux-extras enable php8.1
                      sudo yum clean metadata
                      sudo yum install php -y
                      sudo yum install php php-{common,cgi,cli,fpm,mysqlnd,devel,gd,mbstring,curl,xml,pear,bcmath,json,opcache,gettext,intl,zip} -y

  PHP82Component:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: PHP82-Component
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 1.0.0
      Description: Installing php using amazon-linux-extras (php 8.2)
      ChangeDescription: Initial version
      Data: |
        name: AmazonLinux2LEMPStackREMI - InlineData
        description: Installing php using amazon-linux-extras (php 8.2)
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: InstallPHP
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      sudo amazon-linux-extras enable php8.2
                      sudo yum clean metadata
                      sudo yum install php -y
                      sudo yum install php php-{common,cgi,cli,fpm,mysqlnd,devel,gd,mbstring,curl,xml,pear,bcmath,json,opcache,gettext,intl,zip} -y

  MysqlComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: Mysql-Component
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 1.0.0
      Description: Installing mysql
      ChangeDescription: Initial version
      Data: |
        name: Mysql-Component - InlineData
        description: Installing mysql
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: InstallMySQL
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum -y install mysql

  ComposerComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: Composer-Component
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 1.0.0
      Description: Installing composer
      ChangeDescription: Initial version
      Data: |
        name: Composer-Component - InlineData
        description: Installing composer
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: InstallComposer
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      sudo curl -sS https://getcomposer.org/installer | sudo php
                      sudo mv composer.phar /usr/local/bin/composer
                      sudo ln -s /usr/local/bin/composer /usr/bin/composer

  NodeJSComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: NodeJS-Component
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 2.0.0
      Description: Installs NodeJS v16
      ChangeDescription: Initial version
      Data: |
        name: NodeJS-Component - InlineData
        description: Installation of NodeJS v16
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: InstallNodeJS
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y gcc-c++ make
                    - rpm --import https://rpm.nodesource.com/gpgkey/nodesource.gpg.key
                    - sudo yum install https://rpm.nodesource.com/pub_16.x/nodistro/repo/nodesource-release-nodistro-1.noarch.rpm -y
                    - sudo yum install nodejs -y --setopt=nodesource-nodejs.module_hotfixes=1

  SupervisorComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: SupervisorD-Component
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 1.0.0
      Description: Installation of SupervisorD
      ChangeDescription: Initial version
      Data: |
        name:  SupervisorD-Component - InlineData
        description: Installation of SupervisorD
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: InstallSupervisord
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      sudo yum install supervisor -y

# Toki Auction Service - used by media, payments, and logistics
  TokiAuctionImageRecipe:
    Type: AWS::ImageBuilder::ImageRecipe
    Properties:
      Name: !Join [' ', [!Ref OrgName, toki-auction]]
      Version: 1.0.2
      ParentImage: !Join ['', ['arn:aws:imagebuilder:', !Ref AWS::Region, ':', !Ref AWS::AccountId, ':image/', !Ref OrgName, '-amazon-linux2/1.0.1']]
      WorkingDirectory: /tmp
      Description: !Join [' ', [!Ref OrgName, toki-auction]]
      Components: #Max 20
        - ComponentArn: !Ref NginxComponent
        - ComponentArn: !Ref PHP82Component
        - ComponentArn: !Ref MysqlComponent
        - ComponentArn: !Ref ComposerComponent
        - ComponentArn: !Ref SupervisorComponent
        - ComponentArn: !Join [':', ['arn:aws:imagebuilder', !Ref 'AWS::Region', 'aws:component/simple-boot-test-linux/1.0.0/1']]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: !If [IsImageShared, false, true]
            KmsKeyId: !If [IsImageShared, !Ref 'AWS::NoValue', !Join [':', ['arn:aws:kms', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'alias/aws/ebs']]]
            VolumeType: gp2
            VolumeSize: 8

  TokiAuctionBuilder:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/ec2-image-builder.yaml
      Parameters:
        Name: toki-auction
        EnvName: !Ref EnvName
        NetworkStackName: !Ref NetworkStackName
        OrgName: !Ref OrgName
        ImageRecipeARN: !Ref TokiAuctionImageRecipe
        ShareImage: !Ref ShareImage
        SNSStackName: !Ref SNSStackName

