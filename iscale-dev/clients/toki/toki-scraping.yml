AWSTemplateFormatVersion: 2010-09-09
Description: Toki Scraping Resources

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
          - LoadBalancerStackName
          - DatabaseStackName
          - MediaStackName
      - Label:
          default: Load Balancer Configuration
        Parameters:
          - ClientDomainName
          - LoadBalancerPriority
          - LoadBalancerHostName
      - Label:
          default: Instance Configuration
        Parameters:
          - InstanceKeyName
          - InstanceAMI
          - InstanceType
          - VolumeName
          - VolumeSize
          - VolumeType
      - Label:
          default: Scheduler Configuration
        Parameters:
          - StartScheduleExpression
          - StopScheduleExpression

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      InstanceAMI:
        default: Instance AMI ID
      InstanceKeyName:
        default: Instance Key Name
      InstanceType:
        default: Instance Type
      VolumeName:
        default: Volume Device Name
      VolumeSize:
        default: Volume Disk Size
      VolumeType:
        default: Volume Disk Type
      LoadBalancerHostName:
        default: Load Balancer Host Name
      LoadBalancerPriority:
        default: Load Balancer Rule Priority
      LoadBalancerStackName:
        default: Load Balancer Stack Name
      NetworkStackName:
        default: Network Stack Name
      SNSStackName:
        default: SNS Topic Stack Name
      DatabaseStackName:
        default: Database Stack Name (for non-prod only).
      MediaStackName:
        default: toki-media Stack Name.
      ClientDomainName:
        default: Domain Name
      StartScheduleExpression:
        default: Start Schedule CRON Expression
      StopScheduleExpression:
        default: Stop Schedule CRON Expression

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 9
    Default: scraping
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: tokiasia
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production #Prod
      - Staging #Pre-production
      - Development #Regular day to day commit / deplay
      - Test #WFH Setup with a simple S3 bucket and an access key for it
  ClientDomainName:
    Description: The client's domain name (e.g. example.com, iscale-software.com).
    Type: String
    AllowedPattern: ^[a-z0-9]+([\-\.]{1}[a-z0-9]+)*\.[a-z]{2,7}$
    Default: tokiasia.com
    MinLength: 1
  InstanceAMI:
    Description: Instance AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-0d8c48e98464b4840 # Toki scraping base - 20240105
  InstanceKeyName:
    Description: Instance Key Name
    Type: String
    Default: ''
  InstanceType:
    Description: Instance Type
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.small # staging
      - t3.medium # prod
  VolumeName:
    Description: Amazon Linux 2 AMI uses /dev/xvda ; Ubuntu and Windows uses /dev/sda1
    Type: String
    Default: /dev/xvda
    AllowedValues:
      - /dev/xvda
      - /dev/sda1
  VolumeSize:
    Description: EBS Size in GB (minimum 8)
    Type: Number
    Default: 8
  VolumeType:
    Description: EBS Volume Type
    Type: String
    Default: gp2
  LoadBalancerHostName:
    Description: (Optional) Custom Hostname for load balancer URL
    Type: String
    Default: ''
    MaxLength: 12
  LoadBalancerPriority:
    Description: The priority for ELB Listener.
    Type: Number
    Default: 106
    MinValue: 1
    MaxValue: 50000
  LoadBalancerStackName:
    Description: The name of the load balancer stack.
    Type: String
    Default: tokiasia-stg-ase1-loadbalancer
    MinLength: 1
  NetworkStackName:
    Description: The name of the network stack.
    Type: String
    Default: tokiasia-stg-ase1-network
    MinLength: 1
  SNSStackName:
    Description: The name of the SNS stack.
    Type: String
    Default: tokiasia-stg-ase1-sns
    MinLength: 1
  DatabaseStackName:
    Description: The name of the toki-auction Database stack (for non-prod only).
    Type: String
    Default: tokiasia-dev-ase1-toki-auction-DBStack-E90RQ99YZ3T4
    AllowedValues:
      - tokiasia-dev-ase1-toki-auction-DBStack-E90RQ99YZ3T4 # development
      - tokiasia-stg-ase1-toki-auction-DBStack-FD5XI4N68VZ1 # staging
  MediaStackName:
    Description: The name of the toki-media stack.
    Type: String
    Default: tokiasia-dev-ase1-toki-media
    AllowedValues:
      - tokiasia-dev-ase1-toki-media # development
      - tokiasia-stg-ase1-toki-media # staging
      - tokiasia-prd-ase1-toki-media # prod
  StartScheduleExpression:
    Description: Schedule expression when to start the objects
    Type: String
    Default: cron(0 0 ? * MON-FRI *)
  StopScheduleExpression:
    Description: Schedule expression when to stop the objects
    Type: String
    Default: cron(0 10 ? * MON-FRI *)

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
      
Resources:

  AppSecret:
    Condition: IsNotProd
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, secrets]]
      GenerateSecretString:
        SecretStringTemplate: !Sub
          - |
            {
              "Name": "${Name}"
            }
          - Name: !Ref Name
        GenerateStringKey: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        PasswordLength: 30
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  DBStack:
    Condition: IsProd
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/database.yaml
      Parameters:
        Name: !Ref Name
        DatabaseName: !Join ['',[!Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], db]]
        AllocatedStorage: !If [IsDev, 20, 35] #Gb
        BackupRetentionPeriod: !If [IsProd, 30, 7]
        EnableEnhancedMonitoring: !If [IsProd, true, false]
        EnablePerformanceInsights: !If [IsProd, true, false]
        EnvName: !Ref EnvName
        Engine: mariadb
        EngineVersion: 10.6.10
        Family: mariadb10.6
        InstanceType: !If [IsProd, db.t3.medium, db.t3.micro]
        MasterUser: root
        MultiAz: !If [IsProd, true, false]
        NetworkStackName: !Ref NetworkStackName
        OrgName: !Ref OrgName
        SNSStackName: !Ref SNSStackName
        StorageEncrypted: true

  DeployStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/deployment.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName

  ServerStack:
    DependsOn:
      - DeployStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/appserver-basic2.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        ClientDomainName: !Ref ClientDomainName
        DatabaseEndpoint: !If
          - IsProd
          - Fn::GetAtt:
              - DBStack
              - Outputs.DBInstanceAddress
          - Fn::ImportValue:
              !Sub "${DatabaseStackName}-DBInstanceAddress"
        DatabasePort: !If
          - IsProd
          - Fn::GetAtt:
              - DBStack
              - Outputs.DBInstancePort
          - Fn::ImportValue:
              !Sub "${DatabaseStackName}-DBInstancePort"
        DatabaseSecurityGroupId: !If
          - IsProd
          - Fn::GetAtt:
              - DBStack
              - Outputs.SecurityGroupId
          - Fn::ImportValue:
              !Sub "${DatabaseStackName}-SecurityGroupId"
        InstanceAMI: !Ref InstanceAMI
        InstanceKeyName: !Ref InstanceKeyName
        InstancePort: 80
        InstanceSubnet: !If [IsProd, Private, Public]
        InstanceType: !If [IsProd, t3.medium, t3.small]
        LoadBalancerHostName: !If [IsProd, !Ref LoadBalancerHostName, !Ref 'AWS::NoValue']
        LoadBalancerPriority: !Ref LoadBalancerPriority
        LoadBalancerStackName: !Ref LoadBalancerStackName
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName
        UseFriendlyNames: FALSE
        VolumeName: !Ref VolumeName
        VolumeSize: !Ref VolumeSize
        VolumeType: !Ref VolumeType
        LaunchTemplate: True

# Attach Policy to Appserver IAM Role (appserver stack)

  AllowScrapingAppServerToAccessMediaS3:
    DependsOn:
      - ServerStack
    Description: Allow Scraping app servers to access toki-media S3
    Type: AWS::IAM::Policy
    Properties:
      Roles:
        - Fn::GetAtt:
            - ServerStack
            - Outputs.AppServerIamRole
      PolicyName: AccessToMediaS3
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: "AccessS3Bucket"
            Effect: Allow
            Action:
              - s3:GetObject*
              - s3:ListBucket
              - s3:PutObject*
              - s3:DeleteObject
            Resource:
              - Fn::Join:
                  - ""
                  - - "arn:aws:s3:::"
                    - Fn::ImportValue:
                        !Sub "${MediaStackName}-AppServerS3BucketName"
                    - "/*"
              - Fn::Join:
                  - ""
                  - - "arn:aws:s3:::"
                    - Fn::ImportValue:
                        !Sub "${MediaStackName}-AppServerS3BucketName"
          - Sid: "AllowAccessS3"
            Effect: Allow
            Action:
              - s3:ListAllMyBuckets
              - s3:GetBucketLocation
            Resource: arn:aws:s3:::*

  SchedulerStack:
    DependsOn:
      - ServerStack
    Condition: IsDevOrStaging
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: FALSE
        CodeDeployApplicationName:
          Fn::GetAtt:
            - DeployStack
            - Outputs.CodeDeployApplicationName
        CodeDeployASGDesiredSize: 1
        CodeDeployDeploymentGroupName:
          Fn::GetAtt:
            - DeployStack
            - Outputs.CodeDeployDeploymentGroupName

Outputs:

  DeploymentUserGroup:
     Description: Add the BitBucket user into this group
     Value: 
       Fn::GetAtt:
         - DeployStack
         - Outputs.DeploymentUserGroup
  
  ScrapingDBSecurityGroupId:
    Condition: IsProd
    Description: Scraping DB Secgroup ID
    Value:
      Fn::GetAtt:
        - DBStack
        - Outputs.SecurityGroupId
    Export: 
      Name: !Sub ${AWS::StackName}-ScrapingDBSecurityGroupId