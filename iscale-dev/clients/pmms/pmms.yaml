## APP
  AppServerIamProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: AppServerIamRole

  AppServerIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: ec2.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: AccessSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Join [ ':', [ "arn:aws:secretsmanager", !Ref AWS::Region, !Ref AWS::AccountId, secret, !Ref SecretsManager ] ]
        - PolicyName: AccessCloudWatchMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - ec2:DescribeTags
                  - autoscaling:DescribeTags
                  - rds:DescribeDBClusters
                  - rds:DescribeDBInstances
                Resource: '*'
        - PolicyName: DeploymentResourcesAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObject*
                Resource: #Assume naming convention since deployment bucket follows this. Else we would have to read it from the deployment stack
                  Fn::Join:
                    - ''
                    - - 'arn:aws:s3:::'
                      - Ref: OrgName
                      - '-'
                      - Fn::FindInMap:
                        - EnvShort
                        - Ref: EnvName
                        - Name
                      - '-'
                      - Fn::FindInMap:
                        - RegionShort
                        - Ref: 'AWS::Region'
                        - Name
                      - '-'
                      - Ref: Name
                      - '-code-deploy/*'
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStackResource
                Resource: '*'
        - PolicyName: WriteCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:CreateLogGroup
                  - logs:PutLogEvents
                Resource: 'arn:aws:logs:*:*:*'

  AppServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, SecurityGroup]]
      VpcId:
        Fn::ImportValue:
          Fn::Sub: '${NetworkStackName}-VpcId'
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, appserver]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName
  
# RDP access
  DefaultSecurityGroupIngress1:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt AppServerSecurityGroup.GroupId
      IpProtocol: "tcp"
      FromPort: 3389
      ToPort: 3389
      CidrIp: "0.0.0.0/0"

# Allow traffic from VPC
  DefaultSecurityGroupIngress2:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt AppServerSecurityGroup.GroupId
      IpProtocol: -1
      FromPort: -1
      ToPort: -1
      CidrIp: "10.0.0.0/16"
  
  DefaultSecurityGroupEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt AppServerSecurityGroup.GroupId
      IpProtocol: -1
      FromPort: -1
      ToPort: -1
      CidrIp: "0.0.0.0/0"


  AppServerLaunchConfig: 
    Type: AWS::AutoScaling::LaunchConfiguration
    Properties:
      KeyName: !Ref InstanceKeyName
      #!If [HasInstanceKey, !Ref InstanceKeyName, !Ref 'AWS::NoValue']
      ImageId: !Ref InstanceAMI
      SecurityGroups: [!GetAtt AppServerSecurityGroup.GroupId]
      InstanceType: !Ref InstanceType
      #AssociatePublicIpAddress: !If [UsePrivateSubnet, false, true]
      IamInstanceProfile: !GetAtt AppServerIamProfile.Arn
      InstanceMonitoring: true

  AppServerAutoScalingGroup:
    # Iannis - make it conditional
    Type: AWS::AutoScaling::AutoScalingGroup
    UpdatePolicy:
      AutoScalingReplacingUpdate:
        WillReplace: true
    Properties:
      AutoScalingGroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        #- UseFriendlyNames
        #- !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        #- !Ref 'AWS::NoValue'
      Cooldown: 60
      MaxSize: 1
      MinSize: 1
      HealthCheckType: ELB
      HealthCheckGracePeriod: 120
      DesiredCapacity: 1
      VPCZoneIdentifier: #!If
        #- UsePrivateSubnet
        #- - Fn::ImportValue:
        #      !Sub "${NetworkStackName}-InternalSubnetId1"
        #  - Fn::ImportValue:
        #      !Sub "${NetworkStackName}-InternalSubnetId2"
        - Fn::ImportValue:
            Fn::Sub: "${NetworkStackName}-PublicSubnetId1"
        - Fn::ImportValue:
            Fn::Sub: "${NetworkStackName}-PublicSubnetId2"
      TargetGroupARNs:
        - !Ref AppServerTargetGroup
      LaunchConfigurationName: !Ref AppServerLaunchConfig
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
          PropagateAtLaunch: True
        - Key: Environment
          Value: !Ref EnvName
          PropagateAtLaunch: True
        - Key: Organization
          Value: !Ref OrgName
          PropagateAtLaunch: True

  SchedulerStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: FALSE
        CodeDeployApplicationName: !Ref CodeDeployApplication
        CodeDeployASGDesiredSize: 1
        CodeDeployDeploymentGroupName: !Ref CodeDeployDeploymentGroup

Outputs:

  DeploymentUserGroup:
    Description: Add the BitBucket user into this group
    Value: !Ref DeploymentUserGroup
    #  Fn::GetAtt:
    #    - DeployStack
    #    - Outputs.DeploymentUserGroup

  DeploymentBucketArn:
    Description: The Arn of the Deployment Bucket
    Value: !GetAtt DeploymentBucket.Arn

  DeploymentBucketName:
    Description: The Name of the Deployment S3 Bucket
    Value: !Ref DeploymentBucket

  CodeDeployApplicationName:
    Description: The name of the CodeDeploy application
    Value: !Ref CodeDeployApplication

  CodeDeployDeploymentGroupName:
    Description: The Arn of the deployment group for the stack
    Value: !Ref CodeDeployDeploymentGroup
