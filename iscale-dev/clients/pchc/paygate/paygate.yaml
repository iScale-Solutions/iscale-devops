    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters:
        Name: pg-pchc
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: FALSE
        CodeDeployApplicationName:
          Fn::GetAtt:
            - PGPCHCDeployStack
            - Outputs.CodeDeployApplicationName
        CodeDeployDeploymentGroupName:
          Fn::GetAtt:
            - PGPCHCDeployStack
            - Outputs.CodeDeployDeploymentGroupName

####
# PG-Payment Application (pg-payment repo)
####

  PGPaymentDeployStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/deployment.yaml
      Parameters:
        Name: pg-pay
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName

  PGPaymentAppServerStack:
    DependsOn:
      - PGPaymentDeployStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/appserver-basic2.yaml
      Parameters:
        Name: pg-pay
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        ASGDesiredSize: !If [IsDR, 0, 1]
        ClientDomainName: !Ref ClientDomainName
        DatabaseEndpoint: !If
          - IsDeployPaidResources
          - !If [IsPITRMode, !Ref PITRDBEndpoint, Fn::GetAtt: [DBStack, Outputs.DBInstanceAddress]]
          - ''
        DatabasePort: !If
          - IsDeployPaidResources
          - !If [IsPITRMode, '3306', Fn::GetAtt: [DBStack, Outputs.DBInstancePort]]
          - 3306
        DatabaseSecurityGroupId: !If
          - IsDeployPaidResources
          - !If [IsPITRMode, !GetAtt DBStandbySecurityGroup.GroupId, Fn::GetAtt: [DBStack, Outputs.SecurityGroupId]]
          - ''
        InstanceAMI: !Ref InstanceAMI
        InstanceKeyName: !Ref InstanceKeyName
        InstancePort: 80
        InstanceSubnet: Private
        InstanceType: !If [IsProd, t3.medium, t3.small]
        LoadBalancerHostName: !If
          - IsDR
          - !Ref 'AWS::NoValue'
          - !If
            - IsProd
            - pg-pay
            - !Ref 'AWS::NoValue'
        LoadBalancerPriority: 102
        LoadBalancerStackName: !If
          - IsDeployPaidResources
          - !Select [ 1, !Split [ '/', !Ref ELBStack]]
          - ''
        NetworkStackName: !Ref NetworkStackName
        SharedSecretId: !If
          - IsDeployPaidResources
          - !If [IsPITRMode, !Ref DRDBSecret, Fn::GetAtt: [DBStack, Outputs.DBSecretManagerKeyId]]
          - ''
        SNSStackName: !Ref SNSStackName
        UseFriendlyNames: FALSE
        VolumeSize: 10
        VolumeType: gp3
        LaunchTemplate: True

  PGPaymentSchedulerStack:
    DependsOn:
      - PGPaymentAppServerStack
    Condition: IsNotProdAndDeployPaidResourcesAndNotDR
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters:
        Name: pg-pay
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: FALSE
        CodeDeployApplicationName:
          Fn::GetAtt:
            - PGPaymentDeployStack
            - Outputs.CodeDeployApplicationName
        CodeDeployDeploymentGroupName:
          Fn::GetAtt:
            - PGPaymentDeployStack
            - Outputs.CodeDeployDeploymentGroupName

###
# Backup Section
###

  # Always-on vault in the DR region — exists independently of DeployPaidResources so the live region's
  # CopyActions have a destination even during cold standby. Excluded from BackupStack to avoid naming conflicts at failover.
  # EncryptionKeyArn must be the REPLICA of the multi-region CMK in this region (us-west-2) so that
  # cross-region EFS backup copies (daily baseline + hourly incrementals) are encrypted with a key that
  # is immediately available for decryption at DR restore time.
  DRBackupVault:
    Condition: IsDR
    Type: AWS::Backup::BackupVault
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BackupVaultName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, vault]]
      EncryptionKeyArn: !If [IsBackupEncryptionKeyProvided, !Ref BackupVaultEncryptionKeyArn, !Ref 'AWS::NoValue']
      BackupVaultTags:
        Name: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, vault]]
        Environment: !Ref EnvName
        Organization: !Ref OrgName

  BackupStack:
    DependsOn: 
      - DBStack
      - PGPCHCAppServerStack
      - PayGateAppServerStack
      - PGPaymentAppServerStack
    Condition: IsProdOrProductionDRAndDeployPaidResourcesAndNotPITR
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/backup.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        BackupARNList: !Join
          - ','
          - - Fn::GetAtt:
              - DBStack
              - Outputs.DBInstanceARN
            - Fn::GetAtt:
              - PGPCHCAppServerStack
              - Outputs.AppServerEFSArn
            - Fn::GetAtt:
              - PayGateAppServerStack
              - Outputs.AppServerEFSArn
            - Fn::GetAtt:
              - PGPaymentAppServerStack
              - Outputs.AppServerEFSArn
        DailyExpiration: 60 #60 days requirement
        WeeklyExpiration: 180 #6 months but requirement is 4 weeks
        MonthlyExpiration: 3650 # 10 years

Outputs:

  PaygateDeploymentUserGroup:
    Description: Add the BitBucket user into this group
    Value:
      Fn::GetAtt:
        - PayGateDeployStack
        - Outputs.DeploymentUserGroup

  PGPCHCDeploymentUserGroup:
    Description: Add the BitBucket user into this group
    Value:
      Fn::GetAtt:
        - PGPCHCDeployStack
        - Outputs.DeploymentUserGroup

  PGPaymentDeploymentUserGroup:
    Description: Add the BitBucket user into this group
    Value:
      Fn::GetAtt:
        - PGPaymentDeployStack
        - Outputs.DeploymentUserGroup