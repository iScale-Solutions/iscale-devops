AWSTemplateFormatVersion: 2010-09-09
Description: PayGate Resources

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
          - DeletionProtection
      - Label:
          default: Load Balancer Configuration
        Parameters:
          - ClientDomainName
          - LoadBalancerCertificateArn
          - LoadBalancerHostName
      - Label:
          default: Instance Configuration
        Parameters:
          - InstanceKeyName
          - InstanceAMI
      - Label:
          default: Scheduler Configuration
        Parameters:
          - StartScheduleExpression
          - StopScheduleExpression
      - Label:
          default: Disaster Recovery
        Parameters:
          - DeployPaidResources
          - SnapshotIdentifier
          - DBMasterUserPassword
          - EnableCrossRegionBackupReplication
          - SourceDbInstanceArn
          - BackupReplicationRetentionPeriod
          - LiveSecretArn
          - IsPITRMode
          - PITRDBEndpoint

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      InstanceAMI:
        default: Instance AMI ID
      InstanceKeyName:
        default: Instance Key Name
      LoadBalancerCertificateArn:
        default: Load Balancer SSL Certificate ARN
      LoadBalancerHostName:
        default: Load Balancer Host Name
      DeletionProtection:
        default: Protect core items against deletion
      NetworkStackName:
        default: Network Stack Name
      SNSStackName:
        default: SNS Topic Stack Name
      ClientDomainName:
        default: Domain Name
      StartScheduleExpression:
        default: Start Schedule CRON Expression
      StopScheduleExpression:
        default: Stop Schedule CRON Expression
      DeployPaidResources:
        default: Deploy Paid Resources (false = DR standby, true = active/failover)
      SnapshotIdentifier:
        default: DB Snapshot Identifier (DR failover restore — leave blank for normal)
      DBMasterUserPassword:
        default: DB Master Password (DR failover only — leave blank for normal)
      EnableCrossRegionBackupReplication:
        default: Enable Cross-Region Backup Replication (deploy in DR region to activate)
      SourceDbInstanceArn:
        default: Source DB Instance ARN (live region — required when replication is enabled)
      BackupReplicationRetentionPeriod:
        default: Backup Retention Period in DR region (days)
      LiveSecretArn:
        default: Live Region Secret ARN (DR standby only — required for secrets sync)
      IsPITRMode:
        default: PITR Mode (set by dr-failover-v2 only — do not change manually)
      PITRDBEndpoint:
        default: PITR DB Endpoint (set by dr-failover-v2 only — do not change manually)

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name)
    Type: String
    MinLength: 3
    MaxLength: 9
    Default: paygate
  OrgName:
    Description: The name of the organization
    Type: String
    Default: pchc
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
      - ProductionDR
      - StagingDR
      - DevelopmentDR
      - TestDR
  ClientDomainName:
    Description: The client's domain name (e.g. example.com, iscale-software.com)
    Type: String
    AllowedPattern: ^[a-z0-9]+([\-\.]{1}[a-z0-9]+)*\.[a-z]{2,7}$
    Default: pchc.com.ph
    MinLength: 1
  InstanceAMI:
    Description: Instance AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-00b8d9cb8a7161e41 #Default Amazon Linux 2 for Singapore
  InstanceKeyName:
    Description: Instance Key Name
    Type: String
    Default: ''
  LoadBalancerHostName:
    Description: (Optional) Custom Hostname for load balancer URL
    Type: String
    Default: paygate
    MaxLength: 12
  DeletionProtection:
    Description: Set to true to enable deletion protection (for production only)
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  LoadBalancerCertificateArn:
    Description: SSL Certificate for the ELB
    Type: String
    Default: arn:aws:acm:ap-southeast-1:050821737631:certificate/00ed4a3d-8f7d-45d5-a09f-354cd485c251
  NetworkStackName:
    Description: The name of the network stack
    Type: String
    Default: pchc-dev-ase1-network
    MinLength: 1
  SNSStackName:
    Description: The name of the SNS stack
    Type: String
    Default: pchc-dev-ase1-sns
    MinLength: 1
  StartScheduleExpression:
    Description: Schedule expression when to start the objects
    Type: String
    Default: cron(0 0 ? * MON-FRI *)
  StopScheduleExpression:
    Description: Schedule expression when to stop the objects
    Type: String
    Default: cron(0 10 ? * MON-FRI *)
  DeployPaidResources:
    Description: |
      true (default): Deploy all paid resources — DB, Cache, LBs, and App Servers. Normal operation for all environments.
      false: DR standby mode — suppress all paid resources to minimize idle cost. Only CodeDeploy infra stays alive.
      DR failover: set back to true and provide SnapshotIdentifier to restore DB from the cross-region backup.
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  SnapshotIdentifier:
    Description: |
      (DR Failover only) ARN of the RDS snapshot to restore the database from.
      Obtain by copying the latest automated backup from the live region into the DR region before failover.
      Leave blank for normal fresh DB creation — existing deployments are unaffected.
    Type: String
    Default: ''
  DBMasterUserPassword:
    Description: |
      (DR Failover only) Master user password of the source database.
      Provide this during snapshot restore so the Secrets Manager secret stays in sync with the restored DB credentials.
      Leave blank for auto-generated password — existing deployments are unaffected.
    Type: String
    Default: ''
    NoEcho: true
  EnableCrossRegionBackupReplication:
    Description: |
      Set to true to enable cross-region automated backup replication for the DB.
      Deploy with this enabled in the DR region stack, pointing SourceDbInstanceArn to the live DB.
      Replicates daily snapshots + transaction logs — enables PITR with ~5 minute RPO in the DR region.
      Default false — existing deployments are completely unaffected.
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  SourceDbInstanceArn:
    Description: |
      ARN of the live region RDS DB instance to replicate from.
      Required when EnableCrossRegionBackupReplication=true.
      Format: arn:aws:rds:<live-region>:<account-id>:db:<db-identifier>
      Obtain from the live stack DBStack output: DBInstanceARN.
    Type: String
    Default: ''
  BackupReplicationRetentionPeriod:
    Description: Number of days to retain replicated backups in the DR region (1-35)
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
  LiveSecretArn:
    Description: |
      ARN of the live region Secrets Manager secret to replicate from.
      Obtain from the live stack Secrets Manager console.
      Only required when deploying in DR (ProductionDR) — leave blank for normal deployments.
    Type: String
    Default: ''
  IsPITRMode:
    Description: |
      Set to true ONLY by the dr-failover Step Functions state machine when performing a PITR restore.
      When true, DBStack is suppressed (DB was restored externally via PITR) and all DB references
      resolve from PITRDBEndpoint and the pre-deployed DBStandbySecurityGroup instead of DBStack outputs.
      Default false — live stacks and snapshot-based failover are completely unaffected.
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  PITRDBEndpoint:
    Description: |
      Endpoint of the PITR-restored RDS instance. Written to SSM and Secrets Manager by the
      dr-failover Step Functions machine before the app stack update. Only used when IsPITRMode=true.
      Leave blank for all other deployments — existing stacks are unaffected.
    Type: String
    Default: ''

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  IsDR: !Or
    - !Equals [!Ref EnvName, ProductionDR]
    - !Equals [!Ref EnvName, StagingDR]
    - !Equals [!Ref EnvName, DevelopmentDR]
    - !Equals [!Ref EnvName, TestDR]
  IsProdOrProductionDR: !Or
    - Condition: IsProd
    - !Equals [!Ref EnvName, ProductionDR]
  # IsDeployPaidResources is driven by the explicit DeployPaidResources parameter (default true).
  # DR standby: set DeployPaidResources=false to suppress DB, Cache, LBs, and App Servers.
  # TO ACTIVATE FAILOVER: update the stack with DeployPaidResources=true and provide
  # SnapshotIdentifier (cross-region snapshot ARN) and DBMasterUserPassword to restore the DB.
  IsDeployPaidResources: !Equals [!Ref DeployPaidResources, 'true']
  IsEnableCrossRegionBackupReplication: !Equals [!Ref EnableCrossRegionBackupReplication, 'true']
  IsDRAndEnableCrossRegionBackupReplication: !And
    - Condition: IsDR
    - Condition: IsEnableCrossRegionBackupReplication
  IsNotProdAndDeployPaidResources: !And
    - Condition: IsNotProd
    - Condition: IsDeployPaidResources
  IsNotProdAndDeployPaidResourcesAndNotDR: !And
    - Condition: IsNotProd
    - Condition: IsDeployPaidResources
    - !Not [Condition: IsDR]
  IsProdOrProductionDRAndDeployPaidResources: !And
    - Condition: IsProdOrProductionDR
    - Condition: IsDeployPaidResources
  IsDashboardDeployed: !And
    - Condition: IsProdOrProductionDR
    - Condition: IsDeployPaidResources
  IsPITRMode: !Equals [!Ref IsPITRMode, 'true']
  # DBStack and its dependents are suppressed when PITR mode is active — DB was restored externally.
  IsDeployPaidResourcesAndNotPITR: !And
    - Condition: IsDeployPaidResources
    - !Not [{Condition: IsPITRMode}]
  IsProdOrProductionDRAndDeployPaidResourcesAndNotPITR: !And
    - Condition: IsProdOrProductionDR
    - Condition: IsDeployPaidResourcesAndNotPITR
  IsDashboardDeployedAndNotPITR: !And
    - Condition: IsProdOrProductionDR
    - Condition: IsDeployPaidResourcesAndNotPITR
  IsSFTPDeployed: !Or
    - Condition: IsProd
    - !Equals [!Ref EnvName, ProductionDR]
    - !Equals [!Ref EnvName, TestDR]

Resources:

  ELBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/loadbalancer.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        CertificateArn: !Ref LoadBalancerCertificateArn
        SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName
        DeletionProtection: !Ref DeletionProtection
        DeployPaidResources: !Ref DeployPaidResources

  DBStack:
    # Suppressed when IsPITRMode=true — DB was restored externally via PITR by dr-failover Step Functions.
    Condition: IsDeployPaidResourcesAndNotPITR
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/database.yaml
      Parameters:
        Name: !Ref Name
        DatabaseName: !Join ['',[!Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], db]]
        AllocatedStorage: 20
        BackupRetentionPeriod: !If [IsProd, 30, 7]
        DeletionProtection: !If [IsProd, !Ref DeletionProtection, false]
        EnableEnhancedMonitoring: !If [IsProd, true, false]
        EnablePerformanceInsights: !If [IsProd, true, false]
        EnvName: !Ref EnvName
        Engine: mysql
        EngineVersion: 8.4.7
        Family: mysql8.4
        InstanceType: !If [IsProd, db.t4g.medium, db.t4g.micro]
        MasterUser: root
        MultiAz: !If [IsProd, true, false]
        NetworkStackName: !Ref NetworkStackName
        OrgName: !Ref OrgName
        SNSStackName: !Ref SNSStackName
        StorageEncrypted: true
        StorageType: gp3 # more IOPS
        # for DR failover, restore from the provided snapshot and use the provided
        # master password to keep Secrets Manager secret in sync with the restored credentials
        SnapshotIdentifier: !Ref SnapshotIdentifier
        MasterUserPassword: !Ref DBMasterUserPassword
        ExistingSecretArn: !If [IsDR, !Ref DRDBSecret, '']

  DBSchedulerStack:
    DependsOn:
      - DBStack
    Condition: IsNotProdAndDeployPaidResourcesAndNotDR
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: FALSE
        DatabaseInstanceName:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBInstanceName

  AllowJumpServerIntoDB:
    Condition: IsNotProdAndDeployPaidResourcesAndNotDR
    DependsOn:
      - DBStack
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from Jumpserver
      IpProtocol: TCP
      GroupId: !GetAtt [DBStack, Outputs.SecurityGroupId]
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-JumpHostSecurityGroupId'


####
# Disaster Recovery
# All resources below are deployed ONLY when EnvName is a DR variant (ProductionDR, StagingDR, etc.).
# These resources are always-on in the DR region at zero/minimal cost.
# They pre-provision the infrastructure needed to activate the environment at failover time.
####

  # Placeholder Secrets Manager secret for DB credentials in the DR region.
  # Created at DR stack deploy time with placeholder values.
  # The secrets-sync Lambda overwrites the values whenever the live region secret rotates,
  # ensuring correct credentials are available before failover is triggered.
  # At failover, database.yaml receives this ARN as ExistingSecretArn and skips creating a
  # new secret — preventing a name conflict and ensuring the app servers get the correct credentials.
  DRDBSecret:
    Condition: IsDR
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Description: !Sub 'DR placeholder secret for ${OrgName} ${Name} — values synced from the live region secret by the secrets-sync Lambda before failover.'
      SecretString: !Sub |
        {
          "DB_ROOT_USER": "root",
          "DB_ROOT_PASSWORD": "PLACEHOLDER_SYNC_FROM_LIVE",
          "DB_NAME": "${Name}db",
          "DB_USER": "${Name}",
          "DB_PASSWORD": "PLACEHOLDER_SYNC_FROM_LIVE",
          "MAGENTO_ADMIN_PASSWORD": "PLACEHOLDER_SYNC_FROM_LIVE"
        }
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName
        - Key: DRSync
          Value: 'true'
        - Key: SourceSecretArn
          Value: !Ref LiveSecretArn

  # Pre-deployed DB subnet group for PITR restore in DR standby.
  # Uses -dr suffix to avoid naming conflict with DBStack's own subnet group at failover.
  DBStandbySubnetGroup:
    Condition: IsDR
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db, standby]]
      DBSubnetGroupName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db, standby]]
      SubnetIds:
        - Fn::ImportValue: !Sub '${NetworkStackName}-InternalSubnetId1'
        - Fn::ImportValue: !Sub '${NetworkStackName}-InternalSubnetId2'
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db, standby]]

  # Pre-deployed DB security group for PITR restore in DR standby.
  # App server stacks can add ingress rules to this SG at restore time.
  DBStandbySecurityGroup:
    Condition: IsDR
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db, standby]]
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db, standby]]

  # Cross-region automated backup replication — provides ~5 min RPO via PITR without a running replica.
  # Enable by setting EnableCrossRegionBackupReplication=true and providing SourceDbInstanceArn.
  # Only deployed in DR environments (IsDR condition) with replication explicitly enabled.
  DBReplicationStack:
    Condition: IsDRAndEnableCrossRegionBackupReplication
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/db-replication.yaml
      Parameters:
        Name: !Ref Name
        OrgName: !Ref OrgName
        EnvName: !Ref EnvName
        SourceDbInstanceArn: !Ref SourceDbInstanceArn
        BackupRetentionPeriod: !Ref BackupReplicationRetentionPeriod

####
# PayGate Application (paygate-ui repo)
####

  PayGateDeployStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/deployment.yaml
      Parameters:
        Name: pg-ui
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName

  PayGateAppServerStack:
    DependsOn:
      - PayGateDeployStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/appserver-basic2.yaml
      Parameters:
        Name: pg-ui
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        ASGDesiredSize: !If [IsDR, 0, 1]
        ClientDomainName: !Ref ClientDomainName
        DatabaseEndpoint: !If
          - IsDeployPaidResources
          - !If [IsPITRMode, !Ref PITRDBEndpoint, Fn::GetAtt: [DBStack, Outputs.DBInstanceAddress]]
          - ''
        DatabasePort: !If
          - IsDeployPaidResources
          - !If [IsPITRMode, '3306', Fn::GetAtt: [DBStack, Outputs.DBInstancePort]]
          - 3306
        DatabaseSecurityGroupId: !If
          - IsDeployPaidResources
          - !If [IsPITRMode, !GetAtt DBStandbySecurityGroup.GroupId, Fn::GetAtt: [DBStack, Outputs.SecurityGroupId]]
          - ''
        InstanceAMI: !Ref InstanceAMI
        InstanceKeyName: !Ref InstanceKeyName
        InstancePort: 80
        InstanceSubnet: Private
        InstanceType: !If [IsProd, t3.medium, t3.small]
        LoadBalancerHostName: !If
          - IsDR
          - !Ref 'AWS::NoValue'
          - !If
            - IsProd
            - pg-ui
            - !Ref 'AWS::NoValue'
        LoadBalancerPriority: 100
        LoadBalancerStackName: !If
          - IsDeployPaidResources
          - !Select [ 1, !Split [ '/', !Ref ELBStack]]
          - ''
        NetworkStackName: !Ref NetworkStackName
        SharedSecretId: !If
          - IsDeployPaidResources
          - !If [IsPITRMode, !Ref DRDBSecret, Fn::GetAtt: [DBStack, Outputs.DBSecretManagerKeyId]]
          - ''
        SNSStackName: !Ref SNSStackName
        UseFriendlyNames: FALSE
        VolumeSize: 10
        VolumeType: gp3
        LaunchTemplate: True
  
  PaygateSchedulerStack:
    DependsOn:
      - PayGateAppServerStack
    Condition: IsNotProdAndDeployPaidResourcesAndNotDR
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters:
        Name: pg-ui
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: FALSE
        CodeDeployApplicationName:
          Fn::GetAtt:
            - PayGateDeployStack
            - Outputs.CodeDeployApplicationName
        CodeDeployDeploymentGroupName:
          Fn::GetAtt:
            - PayGateDeployStack
            - Outputs.CodeDeployDeploymentGroupName

