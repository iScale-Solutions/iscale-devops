        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 30
            VolumeType: gp3
      SecurityGroupIds: 
        - !Ref PCHCADSVRSecurityGroup
      SubnetId:        
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PrivateSubnetId1'
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, PCHCADSVR]]

  HighCPUADSVRAlarm:
    Condition: IsProd
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, ADSVR, high, cpu]]
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: InstanceId
          Value: !Ref PCHCADSVRInstance

###
# PCHJUMPSVR
###

  PCHJUMPSVREC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM

  PCHJUMPSVRInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref PCHJUMPSVREC2Role

  PCHJUMPSVRSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'
      GroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, PCHJUMPSVR, Security, Group]]
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, PCHJUMPSVR, Security, Group]]

  AllowJumpHostIntoPCHJUMPSVR:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from jump host
      IpProtocol: TCP
      GroupId: !Ref PCHJUMPSVRSecurityGroup
      FromPort: !Ref RDPPort
      ToPort: !Ref RDPPort
      SourceSecurityGroupId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-JumpHostSecurityGroupId'

  PCHJUMPSVRInstance: 
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref InstanceAMI
      InstanceType: t3.large
      DisableApiTermination: !Ref DeletionProtection
      IamInstanceProfile: !Ref PCHJUMPSVRInstanceProfile
      BlockDeviceMappings: 
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 30
            VolumeType: gp3
      SecurityGroupIds: 
        - !Ref PCHJUMPSVRSecurityGroup
      SubnetId:        
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PublicSubnetId1'
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, PCHJUMPSVR]]

  HighCPUJUMPSVRAlarm:
    Condition: IsProd
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, JUMPSVR, high, cpu]]
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: InstanceId
          Value: !Ref PCHJUMPSVRInstance

###
# Database
###

  DBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/database.yaml
      Parameters:
        Name: !Ref Name
        DatabaseName: !Join ['',[!Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], db]]
        AllocatedStorage: 1000
        BackupRetentionPeriod: !If [IsProd, 30, 7]
        DeletionProtection: !If [IsProd, !Ref DeletionProtection, false]
        EnableCPUCreditAlarm: !If [IsProd, true, false]
        EnableEnhancedMonitoring: !If [IsProd, true, false]
        EnablePerformanceInsights: !If [IsProd, true, false]
        EnvName: !Ref EnvName
        Engine: sqlserver-se
        EngineVersion: 15.00.4073.23.v1
        Family: sqlserver-se-15.0
        InstanceType: db.m5.xlarge
        MasterUser: root
        NetworkStackName: !Ref NetworkStackName
        NetworkType: Private
        OrgName: !Ref OrgName
        SNSStackName: !Ref SNSStackName
        StorageEncrypted: true

  AllowCICSAPPSVRIntoDB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from CICSAPPSVR
      IpProtocol: TCP
      GroupId: !GetAtt [DBStack, Outputs.SecurityGroupId]
      FromPort: 1433
      ToPort: 1433
      SourceSecurityGroupId: !Ref CICSAPPSVRSecurityGroup

  AllowIWEBAPPSVRIntoDB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from IWEBAPPSVR
      IpProtocol: TCP
      GroupId: !GetAtt [DBStack, Outputs.SecurityGroupId]
      FromPort: 1433
      ToPort: 1433
      SourceSecurityGroupId: !Ref IWEBAPPSVRSecurityGroup

  CICSListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref CICSTargetGroup
      Conditions:
        - Field: host-header
          Values:
            - !Join ['.', [!Ref Name, !Ref ClientDomainName]]
      ListenerArn: !GetAtt [ELBStack, Outputs.ApplicationListenerArn]
      Priority: 100

  CICSTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: 301,302,400
      Port: 80
      Protocol: HTTP
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'
      Targets:
        - Id: !Ref IWEBAPPSVR1Instance
          Port: 80
        - Id: !Ref IWEBAPPSVR2Instance
          Port: 80
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  SlowTargetResponseTimeCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      MetricName: TargetResponseTime
      Namespace: AWS/ApplicationELB
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Average
      Threshold: 5 #if greater than 5 seconds
      AlarmActions:
        - Fn::ImportValue:
            Fn::Sub: '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            Fn::Sub: '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt [ELBStack, Outputs.LoadBalancerFullName]
        - Name: TargetGroup
          Value: !Ref CICSTargetGroup
      TreatMissingData: notBreaching

  TargetGroupHealthyHostCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      MetricName: HealthyHostCount
      Namespace: AWS/ApplicationELB
      ComparisonOperator: LessThanThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 1
      AlarmActions:
        - Fn::ImportValue:
            Fn::Sub: '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            Fn::Sub: '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt [ELBStack, Outputs.LoadBalancerFullName]
        - Name: TargetGroup
          Value: !Ref CICSTargetGroup
      TreatMissingData: notBreaching
###
# S3 Buckets
###

  TransferS3Bucket:
    # DeletionPolicy: Retain
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, xfer]]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3
            Status: Enabled
          - Transition:
              StorageClass: GLACIER
              TransitionInDays: 365
            Status: Enabled
      NotificationConfiguration:
        QueueConfigurations:
#XXX_NOTIFICATION_CONFIG
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, xfer]]

  ArchiveS3Bucket:
    # DeletionPolicy: Retain
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, archive]]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3
            Status: Enabled
          - Transition:
              StorageClass: GLACIER
              TransitionInDays: 365
            Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, archive]]


  BankGroup:
    Type: AWS::IAM::Group
    Properties:
      Policies:
        - PolicyName: BankUsersPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: QueueAccess
                Effect: Allow
                Action: 
                  - sqs:DeleteMessage
                  - sqs:ReceiveMessage
                Resource:
                  - !Join [':', ['arn:aws:sqs:*', !Ref 'AWS::AccountId', !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, '${aws:username}', queue]]]]
              - Sid: TransferBucketAccess
                Effect: Allow
                Action: 
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !Join ['', [!GetAtt [TransferS3Bucket, Arn], '/ToServer/${aws:username}/*']]
                  - !Join ['', [!GetAtt [TransferS3Bucket, Arn], '/FromServer/${aws:username}/*']]
                  - !GetAtt [TransferS3Bucket, Arn]
              - Sid: IAMKeyAccess
                Effect: Allow
                Action: 
                  - iam:*AccessKey*
                  - iam:*SigningCertificate*
                Resource:
                  - !Join [':', ['arn:aws:iam:', !Ref 'AWS::AccountId','user/${aws:username}']]

