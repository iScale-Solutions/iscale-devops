AWSTemplateFormatVersion: 2010-09-09
Description: CICS Resources

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
          - DeletionProtection
      - Label:
          default: Load Balancer Configuration
        Parameters:
          - ClientDomainName
          - LoadBalancerCertificateArn
          - LoadBalancerHostName
      - Label:
          default: Instance Configuration
        Parameters:
          - InstanceKeyName
          - InstanceAMI
          - FEInstanceAMI
          - SIOSInstanceAMI
          - InstanceType
          - RDPPort
      - Label:
          default: Scheduler Configuration
        Parameters:
          - StartScheduleExpression
          - StopScheduleExpression
      - Label:
          default: Active Directory Configuration
        Parameters:
          - ADPassword

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      ADPassword:
        default: Active Directory Password
      DeletionProtection:
        default: Protect core items against deletion
      FEInstanceAMI:
        default: FE Instance AMI ID
      InstanceAMI:
        default: Instance AMI ID
      SIOSInstanceAMI:
        default: SIOS Instance AMI ID
      InstanceKeyName:
        default: Instance Key Name
      InstanceType:
        default: Instance Type
      LoadBalancerCertificateArn:
        default: Load Balancer SSL Certificate ARN
      LoadBalancerHostName:
        default: Load Balancer Host Name
      NetworkStackName:
        default: Network Stack Name
      RDPPort:
        default: RDP Port Number
      SIOSInstanceAMI:
        default: SIOS Instance AMI
      SNSStackName:
        default: SNS Topic Stack Name
      ClientDomainName:
        default: Domain Name
      StartScheduleExpression:
        default: Start Schedule CRON Expression
      StopScheduleExpression:
        default: Stop Schedule CRON Expression

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name)
    Type: String
    MinLength: 3
    MaxLength: 9
    Default: cics
  OrgName:
    Description: The name of the organization
    Type: String
    Default: pchc
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  ADPassword:
    Description: Active Directory admin password
    Type: String
    MinLength: 8
    NoEcho: true
  ClientDomainName:
    Description: The client's domain name (e.g. example.com, iscale-software.com)
    Type: String
    AllowedPattern: ^[a-z0-9]+([\-\.]{1}[a-z0-9]+)*\.[a-z]{2,7}$
    Default: pchcdev.com
    MinLength: 1
  DeletionProtection:
    Description: Set to true to enable (valid only in Production mode)
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  FEInstanceAMI:
    Description: Instance AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-0526b9747c2c87a0b #Default Windows 2019 base server
  InstanceAMI:
    Description: Instance AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-0d694fc7ea154072a #Default Windows 2019 base server
  InstanceKeyName:
    Description: Instance Key Name
    Type: String
    Default: ''
  InstanceType:
    Description: Type of instance for app server
    Type: String
    Default: t3.medium
    AllowedValues:
      - t3.medium
      - t3.large
      - t3.xlarge
  LoadBalancerHostName:
    Description: (Optional) Custom Hostname for load balancer URL
    Type: String
    Default: ''
    MaxLength: 12
  LoadBalancerCertificateArn:
    Description: SSL Certificate for the ELB
    Type: String
    Default: arn:aws:acm:ap-southeast-1:470455329885:certificate/9f713d5d-cb7c-4e8e-acc2-46862d610ec8
  NetworkStackName:
    Description: The name of the network stack
    Type: String
    Default: pchc-dev-ase1-network
    MinLength: 1
  RDPPort:
    Description: RDP port number
    Type: Number
    Default: 3389
    MinValue: 1
    MaxValue: 65535
  SIOSInstanceAMI:
    Description: Instance AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-06b2f14c1d8417d36 #Default SIOS Windows 2019 Marketplace Image
  SNSStackName:
    Description: The name of the SNS stack
    Type: String
    Default: pchc-dev-ase1-sns
    MinLength: 1
  StartScheduleExpression:
    Description: Schedule expression when to start the objects
    Type: String
    Default: cron(0 0 ? * MON-FRI *)
  StopScheduleExpression:
    Description: Schedule expression when to stop the objects
    Type: String
    Default: cron(0 10 ? * MON-FRI *)

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasKeyName: !Not [!Equals [!Ref InstanceKeyName, '']]

Resources:

  ##
  # CICS Application Resources
  ##

  ELBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/loadbalancer.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        CertificateArn: !Ref LoadBalancerCertificateArn
        ElbHTTPPort: 0
        InstancePort: 443
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName
        UseCustomSubnets: true
        CustomSubnet1: 
          Fn::ImportValue:
            !Sub '${NetworkStackName}-PublicSubnetId1'
        CustomSubnet2: 
          Fn::ImportValue:
            !Sub '${NetworkStackName}-PublicSubnetId3'

####
# SFTP Section
####

  FTPStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/sftp.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        NetworkStackName: !Ref NetworkStackName
        HostedZoneName: !Ref ClientDomainName
        Hostname: sftp-cics
        UseDefaultSecGroup: FALSE
  
  AllowSFTP1:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from PCHC ZSCALER SG
      IpProtocol: TCP
      GroupId: !GetAtt [FTPStack, Outputs.SecurityGroup]
      FromPort: 22
      ToPort: 22
      CidrIp: 165.225.112.0/23
  
  AllowSFTP2:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from PCHC ZSCALER HK
      IpProtocol: TCP
      GroupId: !GetAtt [FTPStack, Outputs.SecurityGroup]
      FromPort: 22
      ToPort: 22
      CidrIp: 165.225.116.0/23
  
  AllowSFTP3:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from PCHC MNL PLDT
      IpProtocol: TCP
      GroupId: !GetAtt [FTPStack, Outputs.SecurityGroup]
      FromPort: 22
      ToPort: 22
      CidrIp: 119.92.188.2/32

  AllowSFTP4:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from PCHC MNL ETPI
      IpProtocol: TCP
      GroupId: !GetAtt [FTPStack, Outputs.SecurityGroup]
      FromPort: 22
      ToPort: 22
      CidrIp: 120.89.33.200/32

  AllowSFTP5:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from PCHC MLAVPN1 ETPI
      IpProtocol: TCP
      GroupId: !GetAtt [FTPStack, Outputs.SecurityGroup]
      FromPort: 22
      ToPort: 22
      CidrIp: 120.89.33.198/32

  AllowSFTP6:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from PCHC MLAVPN2 PLDT
      IpProtocol: TCP
      GroupId: !GetAtt [FTPStack, Outputs.SecurityGroup]
      FromPort: 22
      ToPort: 22
      CidrIp: 119.92.188.14/32

  AllowSFTP7:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from PCHC MKT LAN
      IpProtocol: TCP
      GroupId: !GetAtt [FTPStack, Outputs.SecurityGroup]
      FromPort: 22
      ToPort: 22
      CidrIp: 120.89.49.14/32

  AllowSFTP8:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from PCHC MKT LINK
      IpProtocol: TCP
      GroupId: !GetAtt [FTPStack, Outputs.SecurityGroup]
      FromPort: 22
      ToPort: 22
      CidrIp: 112.119.115.5/32

###
# Transfer S3 buckets
###

  Xfer1S3Bucket:
    Type: AWS::S3::Bucket
    Condition: IsTest
    DeletionPolicy: Delete
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, xfer1]]
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, xfer1]]
        - Key: Organization
          Value: !Ref OrgName

  Xfer2S3Bucket:
    Type: AWS::S3::Bucket
    Condition: IsTest
    DeletionPolicy: Delete
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, xfer2]]
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, xfer2]]
        - Key: Organization
          Value: !Ref OrgName

  Xfer3S3Bucket:
    Type: AWS::S3::Bucket
    Condition: IsTest
    DeletionPolicy: Delete
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, xfer3]]
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, xfer3]]
        - Key: Organization
          Value: !Ref OrgName

  Xfer4S3Bucket:
    Type: AWS::S3::Bucket
    Condition: IsTest
    DeletionPolicy: Delete
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, xfer4]]
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, xfer4]]
        - Key: Organization
          Value: !Ref OrgName

###
# CICSAPPSVR1
###

  CICSAPPSVREC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ClearingHousePolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: 
                  - s3:GetBucketLocation
                  - s3:ListAllMyBuckets
                Resource: arn:aws:s3:::*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Join [':', [arn, !Ref 'AWS::Partition', 's3::', !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'xfer1/ToServer/*']]]]
                  - !Join [':', [arn, !Ref 'AWS::Partition', 's3::', !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'xfer1/FromServer/*']]]]
                  - !Join [':', [arn, !Ref 'AWS::Partition', 's3::', !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'xfer2/ToServer/*']]]]
                  - !Join [':', [arn, !Ref 'AWS::Partition', 's3::', !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'xfer2/FromServer/*']]]]
                  - !Join [':', [arn, !Ref 'AWS::Partition', 's3::', !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'xfer3/ToServer/*']]]]
                  - !Join [':', [arn, !Ref 'AWS::Partition', 's3::', !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'xfer3/FromServer/*']]]]
                  - !Join [':', [arn, !Ref 'AWS::Partition', 's3::', !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'xfer4/ToServer/*']]]]
                  - !Join [':', [arn, !Ref 'AWS::Partition', 's3::', !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'xfer4/FromServer/*']]]]
                  - !Join [':', [arn, !Ref 'AWS::Partition', 's3::', !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'archive/archive/*']]]]
                  - !Join [':', [arn, !Ref 'AWS::Partition', 's3::', !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'xfer1']]]]
                  - !Join [':', [arn, !Ref 'AWS::Partition', 's3::', !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'xfer2']]]]
                  - !Join [':', [arn, !Ref 'AWS::Partition', 's3::', !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'xfer3']]]]
                  - !Join [':', [arn, !Ref 'AWS::Partition', 's3::', !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'xfer4']]]]
                  - !Join [':', [arn, !Ref 'AWS::Partition', 's3::', !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'archive']]]]
              - Effect: Allow
                Action:
                  - sqs:DeleteMessage
                  - sqs:ReceiveMessage
                Resource:
                  -  !Join [':', [arn, !Ref 'AWS::Partition', sqs, '*', !Ref 'AWS::AccountId', CICSQUEUE]]
        - PolicyName: SyncToCICSFTPSite
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:PutObject
                Resource:
                  - !Join ['/', [!GetAtt [FTPStack, Outputs.S3BucketARN], home, xxx, '*']]
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !GetAtt [FTPStack, Outputs.S3BucketARN]

  CICSAPPSVRInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref CICSAPPSVREC2Role

  CICSAPPSVRSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'
      GroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, CICSAPPSVR, Security, Group]]
      SecurityGroupIngress:
        - IpProtocol: -1
          CidrIp: 
            Fn::ImportValue:
              !Sub '${NetworkStackName}-VpcCidrBlock'
          Description: Allow all traffic on on all ports from inside VPC
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, CICSAPPSVR, Security, Group]]

  AllowJumpHostIntoCICSAPPSVR:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from jump host
      IpProtocol: TCP
      GroupId: !Ref CICSAPPSVRSecurityGroup
      FromPort: 3389
      ToPort: 3389
      SourceSecurityGroupId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-JumpHostSecurityGroupId'

  CICSAPPSVR1Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref SIOSInstanceAMI
      InstanceType: c5d.9xlarge
      DisableApiTermination: !Ref DeletionProtection
      IamInstanceProfile: !Ref CICSAPPSVRInstanceProfile
      KeyName: !If [HasKeyName, !Ref InstanceKeyName, !Ref 'AWS::NoValue']
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 100
            VolumeType: gp3
        - DeviceName: xvdf
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            Iops: 16000
            VolumeSize: 1000
            VolumeType: gp3
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeviceIndex: 0
          GroupSet:
            - !Ref CICSAPPSVRSecurityGroup
          SecondaryPrivateIpAddressCount: 2
          SubnetId:
            Fn::ImportValue:
              !Sub '${NetworkStackName}-PrivateSubnetId1'
      SsmAssociations:
        - DocumentName: !Ref EC2JoinADSSMDocument
          AssociationParameters:
            - Key: directoryId
              Value:
                - !Ref ActiveDirectory
            - Key: directoryName
              Value:
                - !Join ['.', [!Join ['-', [!Ref OrgName, !Ref Name]], !FindInMap [EnvShort, !Ref EnvName, Name]]]
            - Key: dnsIpAddresses
              Value: !GetAtt [ActiveDirectory, DnsIpAddresses]
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, CICSAPPSVR1]]

  HighCPUCICSAPPSVR1Alarm:
    Condition: IsProd
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, CICSAPPSVR1, high, cpu]]
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: InstanceId
          Value: !Ref CICSAPPSVR1Instance

