  AllUserKeysAndSecrets:
    Description: Combined
    Value: !Join
      - ''
      - - !Join ['', ['||', Username, ',']]
        - !Join ['', ['AccessKey', ',']]
        - SecretKey
#XXX_INSERT_OUTPUT
        - !Join ['', ['||', !Ref 115001User, ',']]
        - !Join ['', [!Ref 115001UserKey, ',']]
        - !GetAtt 115001UserKey.SecretAccessKey
