        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  BKUPSVRInstanceProfile:
    Condition: IsProd
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BKUPSVREC2Role

  BKUPSVRInstance:
    Condition: IsProd
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0526b9747c2c87a0b
      InstanceType: t3.xlarge
      DisableApiTermination: !Ref DeletionProtection
      IamInstanceProfile: !Ref BKUPSVRInstanceProfile
