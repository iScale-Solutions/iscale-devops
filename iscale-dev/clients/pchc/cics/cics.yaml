        ExistingSecretArn: !If [IsDR, !Ref DRDBFESecret, '']

####
# Disaster Recovery
# All resources below are deployed ONLY when EnvName is a DR variant (ProductionDR, StagingDR, etc.).
# These resources are always-on in the DR region at zero/minimal cost.
# They pre-provision the infrastructure needed to activate the environment at failover time.
####

  # Placeholder Secrets Manager secret for DB credentials in the DR region.
  # Created at DR stack deploy time with placeholder values.
  # The secrets-sync Lambda overwrites the values whenever the live region secret rotates,
  # ensuring correct credentials are available before failover is triggered.
  # At failover, database.yaml receives this ARN as ExistingSecretArn and skips creating a
  # new secret — preventing a name conflict and ensuring the app servers get the correct credentials.
  DRDBFESecret:
    Condition: IsDR
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], cicsfe]]
      Description: !Sub 'DR placeholder secret for ${OrgName} ${Name} — values synced from the live region secret by the secrets-sync Lambda before failover.'
      SecretString: !Sub |
        {
          "DB_ROOT_USER": "root",
          "DB_ROOT_PASSWORD": "PLACEHOLDER_SYNC_FROM_LIVE",
          "DB_NAME": "${Name}db",
          "DB_USER": "${Name}",
          "DB_PASSWORD": "PLACEHOLDER_SYNC_FROM_LIVE",
          "MAGENTO_ADMIN_PASSWORD": "PLACEHOLDER_SYNC_FROM_LIVE"
        }
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], cicsfe]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName
        - Key: DRSync
          Value: 'true'
        - Key: SourceSecretArn
          Value: !Ref LiveSecretArn2

  # Pre-deployed DB subnet group for PITR restore in DR standby.
  # Uses -dr suffix to avoid naming conflict with DBStack's own subnet group at failover.
  DBFEStandbySubnetGroup:
    Condition: IsDR
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], cicsfe, db, standby]]
      DBSubnetGroupName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], cicsfe, db, standby]]
      SubnetIds:
        - Fn::ImportValue: !Sub '${NetworkStackName}-InternalSubnetId1'
        - Fn::ImportValue: !Sub '${NetworkStackName}-InternalSubnetId2'
        - Fn::ImportValue: !Sub '${NetworkStackName}-InternalSubnetId3'
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], cicsfe, db, standby]]

  # Pre-deployed DB security group for PITR restore in DR standby (cicsfe).
  # Attached to the restored cicsfe instance at failover; app server stacks add
  # ingress rules to this SG at restore time.
  DBFEStandbySecurityGroup:
    Condition: IsDR
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], cicsfe, db, standby]]
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], cicsfe, db, standby]]

  # Cross-region automated backup replication — provides ~5 min RPO via PITR without a running replica.
  # Enable by setting EnableCrossRegionBackupReplication=true and providing SourceDbInstanceArn.
  # Only deployed in DR environments (IsDR condition) with replication explicitly enabled.
  DBFEReplicationStack:
    Condition: IsDRAndEnableCrossRegionBackupReplication
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/db-replication.yaml
      Parameters:
        Name: cicsfe
        OrgName: !Ref OrgName
        EnvName: !Ref EnvName
        SourceDbInstanceArn: !Ref SourceDbFeInstanceArn
        BackupRetentionPeriod: !Ref BackupReplicationRetentionPeriod
  
  AllowCICSFEAPPSVRIntoDBFE:
    Condition: IsDeployPaidResourcesAndNotPITR
    DependsOn:
      - DBFEStack
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from CICSFEAPPSVR
      IpProtocol: TCP
      GroupId: !GetAtt [DBFEStack, Outputs.SecurityGroupId]
      FromPort: 1433
      ToPort: 1433
      SourceSecurityGroupId: !Ref CICSFEAPPSVRSecurityGroup

  # PITR-mode equivalent, targeting the standby SG the restored cicsfe instance uses
  # (DBFEStack is suppressed in PITR mode).
  AllowCICSFEAPPSVRIntoStandbyDBFE:
    Condition: IsDRAndPITR
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from CICSFEAPPSVR (PITR standby)
      IpProtocol: TCP
      GroupId: !GetAtt DBFEStandbySecurityGroup.GroupId
      FromPort: 1433
      ToPort: 1433
      SourceSecurityGroupId: !Ref CICSFEAPPSVRSecurityGroup

###
# S3 Buckets
###

  ArchiveS3Bucket:
    # DeletionPolicy: Retain
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, archive]]
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3
            Status: Enabled
          - Transition:
              StorageClass: GLACIER
              TransitionInDays: 365
            Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, archive]]

  BankGroup:
    Type: AWS::IAM::Group

  BankPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Join ['-', [!FindInMap [EnvShort, !Ref EnvName, Name], !Ref Name, bank, policy]]
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: QueueAccess
            Effect: Allow
            Action: 
              - sqs:DeleteMessage
              - s3:PutObject
              - s3:GetObject
              - iam:*AccessKey*
              - sqs:ReceiveMessage
              - iam:*SigningCertificate*
              - s3:ListBucket
              - s3:DeleteObject
            Resource:
              - !Join [':', ['arn:aws:sqs:*', !Ref 'AWS::AccountId', '${aws:username}QUEUE']]
              - !Join [':', ['arn:aws:iam:', !Ref 'AWS::AccountId', 'user/${aws:username}']]
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer1/ToServer/${aws:username}/*'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer1/FromServer/${aws:username}/*'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer1'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer2/ToServer/${aws:username}/*'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer2/FromServer/${aws:username}/*'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer2'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer3/ToServer/${aws:username}/*'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer3/FromServer/${aws:username}/*'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer3'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer4/ToServer/${aws:username}/*'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer4/FromServer/${aws:username}/*'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer4'
      Groups:
        - !Ref BankGroup

###
# Route53
###

  ALBDNSRecord:
    Condition: IsDeployPaidResourcesAndNotPITR
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneName: !Join ['', [!Ref ClientDomainName, '.']] 
      Comment: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, dns, record]]
      RecordSets:
        - Name: !If
            - HasLoadBalancerHostName
            - !Join ['.', [!Ref LoadBalancerHostName, !Ref ClientDomainName]]
            - !If
              - IsMainRegion
              - !Join ['.', ['cpacsweb', !Ref ClientDomainName]]
              - !Join ['.', ['cics-uat', !Ref ClientDomainName]]
          Type: A
          AliasTarget:
            HostedZoneId:
              Fn::GetAtt:
                - ELBStack
                - Outputs.CanonicalHostedZoneID
            DNSName:
              Fn::GetAtt:
                - ELBStack
                - Outputs.DNSName

  BackupStack:
    Condition: IsProdOrProductionDRAndDeployPaidResourcesAndNotPITR
    DependsOn:
      - DBStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/backup.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        BackupARNList: !Join
          - ','
          - - Fn::GetAtt:
              - DBStack
              - Outputs.DBInstanceARN
            - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref CICSAPPSVR1Instance]]]]
            - !If [IsMainRegion, !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref CICSAPPSVR2Instance]]]], !Ref 'AWS::NoValue']
            - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref GLBLSCPSVR1Instance]]]]
            - !If [IsMainRegion, !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref GLBLSCPSVR2Instance]]]], !Ref 'AWS::NoValue']
            - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref IWEBAPPSVR1Instance]]]]
            - !If [IsMainRegion, !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref IWEBAPPSVR2Instance]]]], !Ref 'AWS::NoValue']
            - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref CICSWITSVRInstance]]]]
            - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref PCHJUMPSVRInstance]]]]
            - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref CICSFEAPPSVRInstance1]]]]
            - !If [IsMainRegion, !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref CICSFEAPPSVRInstance2]]]], !Ref 'AWS::NoValue']
        BackupTime: !If [IsProd, !Ref 'AWS::NoValue', 1] #Default backup time else 1AM UTC for dev
        DailyExpiration: 60 #60 days requirement
        WeeklyExpiration: 180 #6 months but requirement is 4 weeks
        MonthlyExpiration: 3650 # 10 years

###
# File Server for Windows
###

# dedicated fileserver for windows only. find solution for dr

  FileServerStack:
    Condition: IsMainRegion
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/nfs-windows-fsx.yaml
