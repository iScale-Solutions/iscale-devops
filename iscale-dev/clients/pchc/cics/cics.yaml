  002001User:
    Type: AWS::IAM::User
    Properties:
      Groups:
        - !Ref BankGroup
      UserName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, BANK002PBM001]]

  002001UserKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref 002001User

  002001Queue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 002PBM001, queue]]
      MessageRetentionPeriod: 1209600 #14 days

  002001QueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref 002001Queue
      PolicyDocument:
        Statement:
          - Action:
              - SQS:SendMessage
            Effect: Allow
            Resource:
              - !GetAtt 002001Queue.Arn
            Principal:
              AWS: '*'

  002001QueueDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Alarm if queue depth increases to more than 10 messages
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt [002001Queue, QueueName]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      InsufficientDataActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'

