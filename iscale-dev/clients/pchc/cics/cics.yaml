AWSTemplateFormatVersion: 2010-09-09
Description: CICS Resources

# Info
# /dev/sda1 is the root volume of Windows AMIs
# need to use existing AMI to retain consistency (for baked windows ami).
# ami need to copy to other regions for base ami
# ami-03edf490ad235d721 for FEInstanceAMI and InstanceAMI in UAT oregon
# ami-01eb060a977d0ea0c for FEInstanceAMI and InstanceAMI in UAT Ohio
# ami-031ec57adc6a10b99 for SIOSInstanceAMI in UAT oregon
# ami-031c5a65556c46148 for SIOSInstanceAMI in UAT Ohio

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
          - DeletionProtection
      - Label:
          default: Load Balancer Configuration
        Parameters:
          - ClientDomainName
          - LoadBalancerCertificateArn
          - LoadBalancerHostName
      - Label:
          default: Instance Configuration
        Parameters:
          - InstanceKeyName
          - InstanceAMI
          - FEInstanceAMI
          - SIOSInstanceAMI
          - InstanceType
          - RDPPort
      - Label:
          default: Scheduler Configuration
        Parameters:
          - StartScheduleExpression
          - StopScheduleExpression
      - Label:
          default: Active Directory Configuration
        Parameters:
          - ADPassword
      - Label:
          default: Disaster Recovery
        Parameters:
          - DeployPaidResources
          - SnapshotIdentifier
          - DBMasterUserPassword
          - EnableCrossRegionBackupReplication
          - SourceDbInstanceArn
          - BackupReplicationRetentionPeriod
          - LiveSecretArn
          - IsPITRMode
          # for second DB cicsfe
          - SnapshotIdentifierFe
          - DBFEMasterUserPassword
          - SourceDbFeInstanceArn
          - LiveSecretArn2

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      ADPassword:
        default: Active Directory Password
      DeletionProtection:
        default: Protect core items against deletion
      FEInstanceAMI:
        default: FE Instance AMI ID
      InstanceAMI:
        default: Instance AMI ID
      SIOSInstanceAMI:
        default: SIOS Instance AMI ID
      InstanceKeyName:
        default: Instance Key Name
      InstanceType:
        default: Instance Type
      LoadBalancerCertificateArn:
        default: Load Balancer SSL Certificate ARN
      LoadBalancerHostName:
        default: Load Balancer Host Name (overrides region default)
      NetworkStackName:
        default: Network Stack Name
      RDPPort:
        default: RDP Port Number
      SNSStackName:
        default: SNS Topic Stack Name
      ClientDomainName:
        default: Domain Name
      StartScheduleExpression:
        default: Start Schedule CRON Expression
      StopScheduleExpression:
        default: Stop Schedule CRON Expression
      DeployPaidResources:
        default: Deploy Paid Resources (false = DR standby, true = active/failover)
      SnapshotIdentifier:
        default: DB Snapshot Identifier (DR failover restore — leave blank for normal)
      DBMasterUserPassword:
        default: DB Master Password (DR failover only — leave blank for normal)
      EnableCrossRegionBackupReplication:
        default: Enable Cross-Region Backup Replication (deploy in DR region to activate)
      SourceDbInstanceArn:
        default: Source DB Instance ARN (live region — required when replication is enabled)
      BackupReplicationRetentionPeriod:
        default: Backup Retention Period in DR region (days)
      LiveSecretArn:
        default: Live Region Secret ARN (DR standby only — required for secrets sync)
      IsPITRMode:
        default: PITR Mode (set by dr-failover-v2 only — do not change manually)
      SnapshotIdentifierFe:
        default: FE DB Snapshot Identifier (DR failover restore — leave blank for normal)
      DBFEMasterUserPassword:
        default: FE DB Master Password (DR failover only — leave blank for normal)
      SourceDbFeInstanceArn:
        default: Source FE DB Instance ARN (live region — required when replication is enabled)
      LiveSecretArn2:
        default: Live Region FE Secret ARN (DR standby only — required for secrets sync)

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name)
    Type: String
    MinLength: 3
    MaxLength: 9
    Default: cics
  OrgName:
    Description: The name of the organization
    Type: String
    Default: pchc
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
      - ProductionDR
      - StagingDR
      - DevelopmentDR
      - TestDR
  ADPassword:
    Description: Active Directory admin password
    Type: String
    MinLength: 8
    NoEcho: true
  ClientDomainName:
    Description: The client's domain name (e.g. example.com, iscale-software.com)
    Type: String
    AllowedPattern: ^[a-z0-9]+([\-\.]{1}[a-z0-9]+)*\.[a-z]{2,7}$
    Default: pchcdev.com
    MinLength: 1
  DeletionProtection:
    Description: Set to true to enable (valid only in Production mode)
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  FEInstanceAMI:
    Description: Instance AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-0526b9747c2c87a0b #Default Windows 2019 base server
    # ami-03edf490ad235d721 for UAT oregon
  InstanceAMI:
    Description: Instance AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-0d694fc7ea154072a #Default Windows 2019 base 
    # ami-03edf490ad235d721 for UAT oregon, baked base windows
  InstanceKeyName:
    Description: Instance Key Name
    Type: String
    Default: ''
  InstanceType:
    Description: Type of instance for app server
    Type: String
    Default: t3.medium
    AllowedValues:
      - t3.medium
      - t3.large
      - t3.xlarge
  LoadBalancerHostName:
    Description: >-
      (Optional) Custom hostname prefix for the ALB listener rule and Route53 record
      (e.g. "cics" → cics.pchcdev.com). When blank, defaults to "cpacsweb" in the
      main region and "cics-uat" in the DR region.
    Type: String
    Default: ''
    MaxLength: 12
  LoadBalancerCertificateArn:
    Description: SSL Certificate for the ELB
    Type: String
    Default: arn:aws:acm:ap-southeast-1:470455329885:certificate/9f713d5d-cb7c-4e8e-acc2-46862d610ec8
  NetworkStackName:
    Description: The name of the network stack
    Type: String
    Default: pchc-dev-ase1-network
    MinLength: 1
  RDPPort:
    Description: RDP port number
    Type: Number
    Default: 3389
    MinValue: 1
    MaxValue: 65535
  SIOSInstanceAMI:
    Description: Instance AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-06b2f14c1d8417d36 #Default SIOS Windows 2019 Marketplace Image
  SNSStackName:
    Description: The name of the SNS stack
    Type: String
    Default: pchc-dev-ase1-sns
    MinLength: 1
  StartScheduleExpression:
    Description: Schedule expression when to start the objects
    Type: String
    Default: cron(0 0 ? * MON-FRI *)
  StopScheduleExpression:
    Description: Schedule expression when to stop the objects
    Type: String
    Default: cron(0 10 ? * MON-FRI *)
  DeployPaidResources:
    Description: |
      true (default): Deploy all paid resources — DB, Cache, LBs, and App Servers. Normal operation for all environments.
      false: DR standby mode — suppress all paid resources to minimize idle cost. Only CodeDeploy infra stays alive.
      DR failover: set back to true and provide SnapshotIdentifier to restore DB from the cross-region backup.
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  SnapshotIdentifier:
    Description: |
      (DR Failover only) ARN of the RDS snapshot to restore the database from.
      Obtain by copying the latest automated backup from the live region into the DR region before failover.
      Leave blank for normal fresh DB creation — existing deployments are unaffected.
    Type: String
    Default: ''
  DBMasterUserPassword:
    Description: |
      (DR Failover only) Master user password of the source database.
      Provide this during snapshot restore so the Secrets Manager secret stays in sync with the restored DB credentials.
      Leave blank for auto-generated password — existing deployments are unaffected.
    Type: String
    Default: ''
    NoEcho: true
  EnableCrossRegionBackupReplication:
    Description: |
      Set to true to enable cross-region automated backup replication for the DB.
      Deploy with this enabled in the DR region stack, pointing SourceDbInstanceArn to the live DB.
      Replicates daily snapshots + transaction logs — enables PITR with ~5 minute RPO in the DR region.
      Default false — existing deployments are completely unaffected.
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  SourceDbInstanceArn:
    Description: |
      ARN of the live region RDS DB instance to replicate from.
      Required when EnableCrossRegionBackupReplication=true.
      Format: arn:aws:rds:<live-region>:<account-id>:db:<db-identifier>
      Obtain from the live stack DBStack output: DBInstanceARN.
    Type: String
    Default: ''
  BackupReplicationRetentionPeriod:
    Description: Number of days to retain replicated backups in the DR region (1-35)
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
  LiveSecretArn:
    Description: |
      ARN of the live region Secrets Manager secret to replicate from.
      Obtain from the live stack Secrets Manager console.
      Only required when deploying in DR (ProductionDR) — leave blank for normal deployments.
    Type: String
    Default: ''
  IsPITRMode:
    Description: |
      Set to true ONLY by the dr-failover Step Functions state machine when performing a PITR restore.
      When true, DBStack is suppressed (DB was restored externally via PITR) and all DB references
      resolve from PITRDBEndpoint and the pre-deployed DBStandbySecurityGroup instead of DBStack outputs.
      Default false — live stacks and snapshot-based failover are completely unaffected.
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  # for second DB cicsfe
  SnapshotIdentifierFe:
    Description: |
      (DR Failover only) ARN of the RDS snapshot to restore the FE database (cicsfe) from.
      Obtain by copying the latest automated backup from the live region into the DR region before failover.
      Leave blank for normal fresh DB creation — existing deployments are unaffected.
    Type: String
    Default: ''
  DBFEMasterUserPassword:
    Description: |
      (DR Failover only) Master user password of the source FE database (cicsfe).
      Provide this during snapshot restore so the Secrets Manager secret stays in sync with the restored DB credentials.
      Leave blank for auto-generated password — existing deployments are unaffected.
    Type: String
    Default: ''
    NoEcho: true
  SourceDbFeInstanceArn:
    Description: |
      ARN of the live region FE RDS DB instance (cicsfe) to replicate from.
      Required when EnableCrossRegionBackupReplication=true.
      Format: arn:aws:rds:<live-region>:<account-id>:db:<db-identifier>
      Obtain from the live stack DBFEStack output: DBInstanceARN.
    Type: String
    Default: ''
  LiveSecretArn2:
    Description: |
      ARN of the live region FE Secrets Manager secret (cicsfe) to replicate from.
      Obtain from the live stack Secrets Manager console.
      Only required when deploying in DR (ProductionDR) — leave blank for normal deployments.
    Type: String
    Default: ''

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasKeyName: !Not [!Equals [!Ref InstanceKeyName, '']]
  IsDR: !Or
    - !Equals [!Ref EnvName, ProductionDR]
    - !Equals [!Ref EnvName, StagingDR]
    - !Equals [!Ref EnvName, DevelopmentDR]
    - !Equals [!Ref EnvName, TestDR]
  IsProdOrProductionDR: !Or
    - Condition: IsProd
    - !Equals [!Ref EnvName, ProductionDR]
  # IsDeployPaidResources is driven by the explicit DeployPaidResources parameter (default true).
  # DR standby: set DeployPaidResources=false to suppress DB, Cache, LBs, and App Servers.
  # TO ACTIVATE FAILOVER: update the stack with DeployPaidResources=true and provide
  # SnapshotIdentifier (cross-region snapshot ARN) and DBMasterUserPassword to restore the DB.
  IsDeployPaidResources: !Equals [!Ref DeployPaidResources, 'true']
  IsMainRegion: !Not [Condition: IsDR]
  IsProdAndMainRegion: !And
    - Condition: IsProd
    - Condition: IsMainRegion
  IsEnableCrossRegionBackupReplication: !Equals [!Ref EnableCrossRegionBackupReplication, 'true']
  IsDRAndEnableCrossRegionBackupReplication: !And
    - Condition: IsDR
    - Condition: IsEnableCrossRegionBackupReplication
  IsNotProdAndDeployPaidResources: !And
    - Condition: IsNotProd
    - Condition: IsDeployPaidResources
  IsNotProdAndDeployPaidResourcesAndNotDR: !And
    - Condition: IsNotProd
    - Condition: IsDeployPaidResources
    - !Not [Condition: IsDR]
  IsProdOrProductionDRAndDeployPaidResources: !And
    - Condition: IsProdOrProductionDR
    - Condition: IsDeployPaidResources
  IsDashboardDeployed: !And
    - Condition: IsProdOrProductionDR
    - Condition: IsDeployPaidResources
  IsPITRMode: !Equals [!Ref IsPITRMode, 'true']
  # DBStack and its dependents are suppressed when PITR mode is active — DB was restored externally.
  IsDeployPaidResourcesAndNotPITR: !And
    - Condition: IsDeployPaidResources
    - !Not [{Condition: IsPITRMode}]
  # PITR failover in the DR region: the standby SGs exist (IsDR) and the restored
  # instances are attached to them, so app-server ingress must target the standby SGs.
  IsDRAndPITR: !And
    - Condition: IsDR
    - Condition: IsPITRMode
  IsProdOrProductionDRAndDeployPaidResourcesAndNotPITR: !And
    - Condition: IsProdOrProductionDR
    - Condition: IsDeployPaidResourcesAndNotPITR
  IsDashboardDeployedAndNotPITR: !And
    - Condition: IsProdOrProductionDR
    - Condition: IsDeployPaidResourcesAndNotPITR
  IsSFTPDeployed: !Or
    - Condition: IsProd
    - !Equals [!Ref EnvName, ProductionDR]
    - !Equals [!Ref EnvName, TestDR]
  HasLoadBalancerHostName: !Not [!Equals [!Ref LoadBalancerHostName, '']]

Resources:

  ##
  # CICS Application Resources
  ##

  ELBStack:
    Condition: IsDeployPaidResources
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/loadbalancer.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        CertificateArn: !Ref LoadBalancerCertificateArn
        ElbHTTPPort: 0
        InstancePort: 443
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName

####
# SFTP Section
####

  FTPStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/transfer-family.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        NetworkStackName: !Ref NetworkStackName
        HostedZoneName: !Ref ClientDomainName
        Hostname: sftp-cics
        UseDefaultSecGroup: FALSE
        EndpointType: VPC_INTERNET
        DeployPaidResources: !Ref DeployPaidResources

  AllowSFTP1:
    Condition: IsDeployPaidResources
    DependsOn:
      - FTPStack
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from PCHC ZSCALER SG
      IpProtocol: TCP
      GroupId: !GetAtt [FTPStack, Outputs.SecurityGroup]
      FromPort: 22
      ToPort: 22
      CidrIp: 165.225.112.0/23
  
  AllowSFTP2:
    Condition: IsDeployPaidResources
    DependsOn:
      - FTPStack
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from PCHC ZSCALER HK
      IpProtocol: TCP
      GroupId: !GetAtt [FTPStack, Outputs.SecurityGroup]
      FromPort: 22
      ToPort: 22
      CidrIp: 165.225.116.0/23
  
  AllowSFTP3:
    Condition: IsDeployPaidResources
    DependsOn:
      - FTPStack
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from PCHC MNL PLDT
      IpProtocol: TCP
      GroupId: !GetAtt [FTPStack, Outputs.SecurityGroup]
      FromPort: 22
      ToPort: 22
      CidrIp: 119.92.188.2/32

  AllowSFTP4:
    Condition: IsDeployPaidResources
    DependsOn:
      - FTPStack
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from PCHC MNL ETPI
      IpProtocol: TCP
      GroupId: !GetAtt [FTPStack, Outputs.SecurityGroup]
      FromPort: 22
      ToPort: 22
      CidrIp: 120.89.33.200/32

  AllowSFTP5:
    Condition: IsDeployPaidResources
    DependsOn:
      - FTPStack
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from PCHC MLAVPN1 ETPI
      IpProtocol: TCP
      GroupId: !GetAtt [FTPStack, Outputs.SecurityGroup]
      FromPort: 22
      ToPort: 22
      CidrIp: 120.89.33.198/32

  AllowSFTP6:
    Condition: IsDeployPaidResources
    DependsOn:
      - FTPStack
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from PCHC MLAVPN2 PLDT
      IpProtocol: TCP
      GroupId: !GetAtt [FTPStack, Outputs.SecurityGroup]
      FromPort: 22
      ToPort: 22
      CidrIp: 119.92.188.14/32

  AllowSFTP7:
    Condition: IsDeployPaidResources
    DependsOn:
      - FTPStack
