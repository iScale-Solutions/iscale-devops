      Policies:
        - PolicyName: ClearingHousePolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - sqs:DeleteMessage
                  - sqs:ReceiveMessage
                Resource:
                  -  !Join [':', [arn, !Ref 'AWS::Partition', sqs, '*', !Ref 'AWS::AccountId', CICSQUEUE]]

  CICSFEAPPSVRInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref CICSFEAPPSVREC2Role

