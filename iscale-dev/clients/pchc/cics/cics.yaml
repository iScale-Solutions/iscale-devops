      SecurityGroupIngress:
        - IpProtocol: -1
          CidrIp: 
            Fn::ImportValue:
              !Sub '${NetworkStackName}-VpcCidrBlock'
          Description: Allow all traffic on on all ports from inside VPC

  HighCPUJUMPSVRAlarm:
    Condition: IsProd
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, BKUPSVR, high, cpu]]
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: InstanceId
          Value: !Ref BKUPSVRInstance

##
# Active Directory
##

  ActiveDirectory:
    Type: AWS::DirectoryService::MicrosoftAD
    Properties:
      Name: !Join ['.', [!Join ['-', [!Ref OrgName, !Ref Name]], !FindInMap [EnvShort, !Ref EnvName, Name]]]
      Password: !Ref ADPassword
      ShortName: !Join ['-', [!Ref OrgName, !Ref Name]]
      Edition: Standard
      VpcSettings:
        SubnetIds:
          - Fn::ImportValue:
              !Sub '${NetworkStackName}-PrivateSubnetId1'
          - Fn::ImportValue:
              !Sub '${NetworkStackName}-PrivateSubnetId3'
        VpcId:
          Fn::ImportValue:
            !Sub '${NetworkStackName}-VpcId'

  EC2JoinADSSMDocument:
    Type: AWS::SSM::Document
    Properties:
      Content: 
        |
        {
          "schemaVersion":"1.2",
          "description":"Join instances to an AWS Directory Service domain.",
          "parameters":{
            "directoryId":{
              "type":"String",
              "description":"(Required) The ID of the AWS Directory Service directory."
            },
            "directoryName":{
              "type":"String",
              "description":"(Required) The name of the directory; for example, test.example.com"
            },
            "dnsIpAddresses":{
              "type":"StringList",
              "default":[
              ],
              "description":"(Optional) The IP addresses of the DNS servers in the directory. Required when DHCP is not configured. Learn more at http://docs.aws.amazon.com/directoryservice/latest/simple-ad/join_get_dns_addresses.html",
              "allowedPattern":"((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)"
            }
          },
          "runtimeConfig":{
          "aws:domainJoin":{
            "properties":{
              "directoryId":"{{ directoryId }}",
              "directoryName":"{{ directoryName }}",
              "dnsIpAddresses":"{{ dnsIpAddresses }}"
              }
            }
          }
        }

###
# Database
###

  SQLServerBackupRestoreIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - rds.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: S3BucketAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt ArchiveS3Bucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObjectMetaData
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListMultipartUploadParts
                  - s3:AbortMultipartUpload
                Resource:
                  - !Join ['', [!GetAtt ArchiveS3Bucket.Arn, '/*']]

  SQLServerOptionGroup:
    Type: AWS::RDS::OptionGroup
    Properties:
      EngineName: sqlserver-se
      MajorEngineVersion: '15.00'
      OptionGroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      OptionConfigurations:
        - OptionName: SQLSERVER_BACKUP_RESTORE
          OptionSettings:
            - Name: IAM_ROLE_ARN
              Value: !GetAtt SQLServerBackupRestoreIAMRole.Arn
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  DBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/database.yaml
      Parameters:
        Name: !Ref Name
        DatabaseName: !Join ['',[!Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], db]]
        AllocatedStorage: 2000
        BackupRetentionPeriod: !If [IsProd, 30, 7]
        DeletionProtection: !If [IsProd, !Ref DeletionProtection, false]
        Domain: !Ref ActiveDirectory
        EnableEnhancedMonitoring: !If [IsProd, true, false]
        EnablePerformanceInsights: !If [IsProd, true, false]
        EnvName: !Ref EnvName
        Engine: sqlserver-se
        EngineVersion: 15.00.4236.7.v1
        Family: sqlserver-se-15.0
        InstanceType: db.m5.2xlarge
        MasterUser: admin
        MultiAz: true
        NetworkStackName: !Ref NetworkStackName
        NetworkType: Private
        OptionGroupName: !Ref SQLServerOptionGroup
        Port: 1433
        OrgName: !Ref OrgName
        SNSStackName: !Ref SNSStackName
        StorageEncrypted: true

  AllowCICSAPPSVRIntoDB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from CICSAPPSVR
      IpProtocol: TCP
      GroupId: !GetAtt [DBStack, Outputs.SecurityGroupId]
      FromPort: 1433
      ToPort: 1433
      SourceSecurityGroupId: !Ref CICSAPPSVRSecurityGroup

  AllowGLBLSCPSVRIntoDB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from GLBLSCPSVR
      IpProtocol: TCP
      GroupId: !GetAtt [DBStack, Outputs.SecurityGroupId]
      FromPort: 1433
      ToPort: 1433
      SourceSecurityGroupId: !Ref GLBLSCPSVRSecurityGroup
  
  AllowBKUPSVRIntoDB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from BKUPSVR
      IpProtocol: TCP
      GroupId: !GetAtt [DBStack, Outputs.SecurityGroupId]
      FromPort: 1433
      ToPort: 1433
      SourceSecurityGroupId: !Ref BKUPSVRSecurityGroup

  CICSListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref CICSTargetGroup
      Conditions:
        - Field: host-header
          Values:
            - !Join ['.', [!Ref LoadBalancerHostName, !Ref ClientDomainName]]
      ListenerArn: !GetAtt [ELBStack, Outputs.ApplicationListenerArn]
      Priority: 100

  CICSTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: 301,302,400
      Port: 443
      Protocol: HTTPS
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'
      Targets:
        - Id: !Ref IWEBAPPSVR1Instance
          Port: 443
        - Id: !Ref IWEBAPPSVR2Instance
          Port: 443
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  SlowTargetResponseTimeCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      MetricName: TargetResponseTime
      Namespace: AWS/ApplicationELB
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Average
      Threshold: 5 #if greater than 5 seconds
      AlarmActions:
        - Fn::ImportValue:
            Fn::Sub: '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            Fn::Sub: '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt [ELBStack, Outputs.LoadBalancerFullName]
        - Name: TargetGroup
          Value: !Ref CICSTargetGroup
      TreatMissingData: notBreaching

  TargetGroupHealthyHostCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      MetricName: HealthyHostCount
      Namespace: AWS/ApplicationELB
      ComparisonOperator: LessThanThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 1
      AlarmActions:
        - Fn::ImportValue:
            Fn::Sub: '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            Fn::Sub: '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt [ELBStack, Outputs.LoadBalancerFullName]
        - Name: TargetGroup
          Value: !Ref CICSTargetGroup
      TreatMissingData: notBreaching

