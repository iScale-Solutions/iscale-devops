        MasterUser: admin
        MultiAz: true
        NetworkStackName: !Ref NetworkStackName
        NetworkType: Private
        OptionGroupName: !Ref SQLServerOptionGroup
        Port: 1433
        OrgName: !Ref OrgName
        SNSStackName: !Ref SNSStackName
        StorageEncrypted: true

###
# S3 Buckets
###

  ArchiveS3Bucket:
    # DeletionPolicy: Retain
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, archive]]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3
            Status: Enabled
          - Transition:
              StorageClass: GLACIER
              TransitionInDays: 365
            Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, archive]]

  BankGroup:
    Type: AWS::IAM::Group

  BankPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Join ['-', [!FindInMap [EnvShort, !Ref EnvName, Name], !Ref Name, bank, policy]]
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: QueueAccess
            Effect: Allow
            Action: 
              - sqs:DeleteMessage
              - s3:PutObject
              - s3:GetObject
              - iam:*AccessKey*
              - sqs:ReceiveMessage
              - iam:*SigningCertificate*
              - s3:ListBucket
              - s3:DeleteObject
            Resource:
              - !Join [':', ['arn:aws:sqs:*', !Ref 'AWS::AccountId', '${aws:username}QUEUE']]
              - !Join [':', ['arn:aws:iam:', !Ref 'AWS::AccountId', 'user/${aws:username}']]
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer1/ToServer/${aws:username}/*'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer1/FromServer/${aws:username}/*'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer1'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer2/ToServer/${aws:username}/*'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer2/FromServer/${aws:username}/*'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer2'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer3/ToServer/${aws:username}/*'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer3/FromServer/${aws:username}/*'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer3'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer4/ToServer/${aws:username}/*'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer4/FromServer/${aws:username}/*'
              - 'arn:aws:s3:::pchc-prd-ase1-cics-xfer4'
      Groups:
        - !Ref BankGroup

###
# Route53
###

  ALBDNSRecord:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneName: !Join ['', [!Ref ClientDomainName, '.']] 
      Comment: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, dns, record]]
      RecordSets:
        - Name: !Join ['.', [!Ref LoadBalancerHostName, !Ref ClientDomainName]]
          Type: A
          AliasTarget:
            HostedZoneId:
              Fn::GetAtt:
                - ELBStack
                - Outputs.CanonicalHostedZoneID
            DNSName:
              Fn::GetAtt:
                - ELBStack
                - Outputs.DNSName

  BackupStack:
    Condition: IsProd
    DependsOn:
      - DBStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/backup.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        BackupARNList: !Join
          - ','
          - - Fn::GetAtt:
              - DBStack
              - Outputs.DBInstanceARN
            - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref CICSAPPSVR1Instance]]]]  
            - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref CICSAPPSVR2Instance]]]]  
            - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref GLBLSCPSVR1Instance]]]]  
            - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref GLBLSCPSVR2Instance]]]]  
            - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref IWEBAPPSVR1Instance]]]]  
            - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref IWEBAPPSVR2Instance]]]]
            - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref CICSWITSVRInstance]]]]  
            - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref PCHJUMPSVRInstance]]]]  
            - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref CICSFEAPPSVRInstance1]]]]  
            - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref CICSFEAPPSVRInstance2]]]]
        BackupTime: !If [IsProd, !Ref 'AWS::NoValue', 1] #Default backup time else 1AM UTC for dev
        DailyExpiration: 60 #60 days requirement
        WeeklyExpiration: 180 #6 months but requirement is 4 weeks
        MonthlyExpiration: 3650 # 10 years

###
# File Server for Windows
###

  FileServerStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/nfs-windows-fsx.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        NetworkStackName: !Ref NetworkStackName
        IWEBAPPSVRSecurityGroup: !GetAtt CICSFEAPPSVRSecurityGroup.GroupId

###
# Dashboard
###

  Dashboard:
    Condition: IsProd
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {
                "height": 12,
                "width": 6,
                "y": 0,
                "x": 0,
                "type": "alarm",
                "properties": {
                  "title": "Alarms",
                  "alarms": [
                    "${DB_HIGH_CPU}",
                    "${DB_LOW_STORAGE}",
                    "${DB_ERRORS}",
                    "${DB_ERROR_DENIED}",
                    "${TG_UNHEALTHY}",
                    "${TG_SLOW}",
                    "${HIGH_CPU_APPSVR1}",
                    "${HIGH_CPU_APPSVR2}",
                    "${HIGH_CPU_GLBL_SCPSVR1}",
                    "${HIGH_CPU_GLBL_SCPSVR2}",
                    "${HIGH_CPU_IWEB_SVR1}",
                    "${HIGH_CPU_IWEB_SVR2}",
                    "${HIGH_CPU_IWEBFE_SVR1}",
                    "${HIGH_CPU_IWEBFE_SVR2}",
                    "${HIGH_CPU_WIT_SVR}",
                    "${HIGH_CPU_JUMP_SVR}"
                  ]
                }
              },
              {
                "height": 6,
                "width": 6,
                "y": 0,
                "x": 6,
                "type": "metric",
                "properties": {
                  "metrics": [
                    [ "AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "label": "RDS" } ],
                    [ "AWS/EC2", "CPUUtilization", "InstanceId", "${APP_SVR1_ID}", { "label": "App Server 1" } ],
                    [ "...", "${APP_SVR2_ID}", { "label": "App Server 2" }  ],
                    [ "...", "${APPFE_SVR1_ID}", { "label": "FE App Server 1" }  ],
                    [ "...", "${APPFE_SVR2_ID}", { "label": "FE App Server 2" }  ],
                    [ "...", "${GLB_LSCP_SVR1_ID}", { "label": "Backend 1" } ],
                    [ "...", "${GLB_LSCP_SVR2_ID}", { "label": "Backend 2" } ],
                    [ "...", "${IWEB_APP_SVR1_ID}", { "label": "Web Server 1" } ],
                    [ "...", "${IWEB_APP_SVR2_ID}", { "label": "Web Server 2" } ],
                    [ "...", "${IWEBFE_APP_SVR1_ID}", { "label": "FE Web Server 1" } ],
                    [ "...", "${IWEBFE_APP_SVR2_ID}", { "label": "FE Web Server 2" } ],
                    [ "...", "${WIT_SVR_ID}", { "label": "Witness Server" } ],
                    [ "...", "${JUMP_SVR_ID}", { "label": "Jump Server" } ]
                  ],
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${REGION}",
                  "period": 300,
                  "title": "CPU",
                  "stat": "Average",
                  "yAxis": {
                    "left": {
                      "label": "Utilization"
                    }
                  }
                }
              },
              {
                "height": 6,
                "width": 6,
                "y": 6,
                "x": 6,
                "type": "metric",
                "properties": {
                  "metrics": [
                    [ { "expression": "100-((m4/(16*1024*1000000))*100)", "label": "RDS (memory)", "id": "e1", "region": "${REGION}" } ],
                    [ "AWS/RDS", "FreeableMemory", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "id": "m4", "visible": false } ],
                    [ { "expression": "100-(m1/(20*1024*1000000)*100)", "label": "RDS (disk)", "id": "e2", "region": "${REGION}" } ],
                    [ "AWS/RDS", "FreeStorageSpace", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "id": "m1", "visible": false } ]
                  ],
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${REGION}",
                  "period": 300,
                  "title": "Memory / Storage",
                  "stat": "Average",
                  "yAxis": {
                    "left": {
                      "label": "Utilization"
                    }
                  }
                }
              },
              {
                "height": 6,
                "width": 6,
                "y": 0,
                "x": 12,
                "type": "metric",
                "properties": {
                  "metrics": [
                    [ "AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${ELB_FULL_NAME}", { "label": "ELB" } ],
                    [ "AWS/RDS", "ReadLatency", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "label": "RDS Read" } ],
                    [ ".", "WriteLatency", ".", ".", { "label": "RDS Write" } ]
                  ],
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${REGION}",
                  "period": 300,
                  "title": "Performance",
                  "stat": "Average",
                  "yAxis": {
                    "left": {
                      "showUnits": true,
                      "label": "Time"
                    }
                  }
                }
              },
              {
                "height": 6,
                "width": 6,
                "y": 0,
                "x": 18,
                "type": "metric",
                "properties": {
                  "metrics": [
                    [ "AWS/ApplicationELB", "ProcessedBytes", "LoadBalancer", "${ELB_FULL_NAME}", { "label": "ELB" } ],
                    [ "AWS/RDS", "NetworkReceiveThroughput", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "label": "RDS (In)" }],
                    [ ".", "NetworkTransmitThroughput", ".", ".", { "label": "RDS (Out)" }],
                    [ "AWS/EC2", "NetworkIn", "InstanceId", "${APP_SVR1_ID}", { "label": "App Server 1 (In)" } ],
                    [ "...", "${APP_SVR2_ID}", { "label": "App Server 2 (In)" }  ],
                    [ "...", "${APPFE_SVR1_ID}", { "label": "FE App Server 1 (In)" }  ],
                    [ "...", "${APPFE_SVR2_ID}", { "label": "FE App Server 2 (In)" }  ],
                    [ "...", "${GLB_LSCP_SVR1_ID}", { "label": "Backend 1 (In)" } ],
                    [ "...", "${GLB_LSCP_SVR2_ID}", { "label": "Backend 2 (In)" } ],
                    [ "...", "${IWEB_APP_SVR1_ID}", { "label": "Web Server 1 (In)" } ],
                    [ "...", "${IWEB_APP_SVR2_ID}", { "label": "Web Server 2 (In)" } ],
                    [ "...", "${IWEBFE_APP_SVR1_ID}", { "label": "FE Web Server 1 (In)" } ],
                    [ "...", "${IWEBFE_APP_SVR2_ID}", { "label": "FE Web Server 2 (In)" } ],
                    [ "...", "${WIT_SVR_ID}", { "label": "Witness Server (In)" } ],
                    [ "...", "${JUMP_SVR_ID}", { "label": "Jump Server (In)" } ],
                    [ "AWS/EC2", "NetworkOut", "InstanceId", "${APP_SVR1_ID}", { "label": "App Server 1 (Out)" } ],
                    [ "...", "${APP_SVR2_ID}", { "label": "App Server 2 (Out)" }  ],
                    [ "...", "${GLB_LSCP_SVR1_ID}", { "label": "Backend 1 (Out)" } ],
                    [ "...", "${GLB_LSCP_SVR2_ID}", { "label": "Backend 2 (Out)" } ],
                    [ "...", "${IWEB_APP_SVR1_ID}", { "label": "Web Server 1 (Out)" } ],
                    [ "...", "${IWEB_APP_SVR2_ID}", { "label": "Web Server 2 (Out)" } ],
                    [ "...", "${IWEBFE_APP_SVR1_ID}", { "label": "FE Web Server 1 (Out)" } ],
                    [ "...", "${IWEBFE_APP_SVR2_ID}", { "label": "FE Web Server 2 (Out)" } ],
                    [ "...", "${WIT_SVR_ID}", { "label": "Witness Server (Out)" } ],
                    [ "...", "${JUMP_SVR_ID}", { "label": "Jump Server (Out)" } ]
                  ],
                  "view": "timeSeries",
                  "stacked": false,
                  "title": "Network",
                  "region": "${REGION}",
                  "period": 300,
                  "stat": "Average",
                  "legend": {
                    "position": "bottom"
                  },
                  "yAxis": {
                    "left": {
                      "label": "Volume"
                    }
                  }
                }
              },
              {
                "height": 6,
                "width": 6,
                "y": 6,
                "x": 12,
                "type": "metric",
                "properties": {
                  "metrics": [
                    [ "AWS/RDS", "ReadThroughput", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "label": "RDS Read" }],
                    [ ".", "WriteThroughput", ".", ".", { "label": "RDS Write" }],
                    [ "AWS/EC2", "EBSReadOps", "InstanceId", "${APP_SVR1_ID}", { "label": "App Server 1 (In)" } ],
                    [ "...", "${APP_SVR2_ID}", { "label": "App Server 2 (In)" }  ],
                    [ "...", "${APPFE_SVR1_ID}", { "label": "FE App Server 1 (In)" }  ],
                    [ "...", "${APPFE_SVR2_ID}", { "label": "FE App Server 2 (In)" }  ],
                    [ "...", "${GLB_LSCP_SVR1_ID}", { "label": "Backend 1 (In)" } ],
                    [ "...", "${GLB_LSCP_SVR2_ID}", { "label": "Backend 2 (In)" } ],
                    [ "...", "${IWEB_APP_SVR1_ID}", { "label": "Web Server 1 (In)" } ],
                    [ "...", "${IWEB_APP_SVR2_ID}", { "label": "Web Server 2 (In)" } ],
                    [ "...", "${IWEBFE_APP_SVR1_ID}", { "label": "FE Web Server 1 (In)" } ],
                    [ "...", "${IWEBFE_APP_SVR2_ID}", { "label": "FE Web Server 2 (In)" } ],
                    [ "...", "${WIT_SVR_ID}", { "label": "Witness Server (In)" } ],
                    [ "...", "${JUMP_SVR_ID}", { "label": "Jump Server (In)" } ],
                    [ "AWS/EC2", "EBSWriteOps", "InstanceId", "${APP_SVR1_ID}", { "label": "App Server 1 (Out)" } ],
                    [ "...", "${APP_SVR2_ID}", { "label": "App Server 2 (Out)" }  ],
                    [ "...", "${GLB_LSCP_SVR1_ID}", { "label": "Backend 1 (Out)" } ],
                    [ "...", "${GLB_LSCP_SVR2_ID}", { "label": "Backend 2 (Out)" } ],
                    [ "...", "${IWEB_APP_SVR1_ID}", { "label": "Web Server 1 (Out)" } ],
                    [ "...", "${IWEB_APP_SVR2_ID}", { "label": "Web Server 2 (Out)" } ],
                    [ "...", "${IWEBFE_APP_SVR1_ID}", { "label": "FE Web Server 1 (Out)" } ],
                    [ "...", "${IWEBFE_APP_SVR2_ID}", { "label": "FE Web Server 2 (Out)" } ],
                    [ "...", "${WIT_SVR_ID}", { "label": "Witness Server (Out)" } ],
                    [ "...", "${JUMP_SVR_ID}", { "label": "Jump Server (Out)" } ]
                  ],
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${REGION}",
                  "period": 300,
                  "title": "I/O",
                  "stat": "Average",
                  "yAxis": {
                    "left": {
                      "label": "Count",
                      "showUnits": false
                    }
                  }
                }
              },
              {
                "height": 6,
                "width": 6,
                "y": 6,
                "x": 18,
                "type": "metric",
                "properties": {
                  "metrics": [
                    [ "AWS/ApplicationELB", "HTTPCode_ELB_5XX_Count", "LoadBalancer", "${ELB_FULL_NAME}", { "label": "ELB HTTP 5XX_Count" } ],
                    [ ".", "HTTPCode_ELB_4XX_Count", ".", ".", { "label": "ELB HTTP 4XX_Count" } ]
                  ],
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${REGION}",
                  "title": "Error Count",
                  "period": 300,
                  "stat": "Average"
                }
              }
            ]
          }
        - HIGH_CPU_APPSVR1: !GetAtt [HighCPUCICSAPPSVR1Alarm, Arn]
          HIGH_CPU_APPSVR2: !GetAtt [HighCPUCICSAPPSVR2Alarm, Arn]
          HIGH_CPU_GLBL_SCPSVR1: !GetAtt [HighCPUGLBLSCPSVR1Alarm, Arn]
          HIGH_CPU_GLBL_SCPSVR2: !GetAtt [HighCPUGLBLSCPSVR2Alarm, Arn]
          HIGH_CPU_IWEB_SVR1: !GetAtt [HighCPUIWEBAPPSVR1Alarm, Arn]
          HIGH_CPU_IWEB_SVR2: !GetAtt [HighCPUIWEBAPPSVR2Alarm, Arn]
          HIGH_CPU_IWEBFE_SVR1: !GetAtt [HighCPUIWEBFEAPPSVR1Alarm, Arn]
          HIGH_CPU_IWEBFE_SVR2: !GetAtt [HighCPUIWEBFEAPPSVR2Alarm, Arn]
          HIGH_CPU_WIT_SVR: !GetAtt [HighCPUCICSWITSVRAlarm, Arn]
          HIGH_CPU_JUMP_SVR: !GetAtt [HighCPUJUMPSVRAlarm, Arn]
          DB_HIGH_CPU: !GetAtt [DBStack, Outputs.DBHighCPUAlarm]
          DB_LOW_STORAGE: !GetAtt [DBStack, Outputs.DBLowStorageAlarm]
          DB_ERRORS: !GetAtt [DBStack, Outputs.DBErrorsAlarm]
          DB_ERROR_DENIED: !GetAtt [DBStack, Outputs.DBErrorDeniedAlarm]
          TG_SLOW: !GetAtt [SlowTargetResponseTimeCloudWatchAlarm, Arn]
          TG_UNHEALTHY: !GetAtt [TargetGroupHealthyHostCountAlarm, Arn]
          DB_INSTANCE_ID: !GetAtt [DBStack, Outputs.DBInstanceName]
          REGION: !Ref 'AWS::Region'
          ELB_FULL_NAME: !GetAtt [ELBStack, Outputs.LoadBalancerFullName]
          APP_SVR1_ID: !Ref CICSAPPSVR1Instance
          APP_SVR2_ID: !Ref CICSAPPSVR2Instance
          APPFE_SVR1_ID: !Ref CICSFEAPPSVRInstance1
          APPFE_SVR2_ID: !Ref CICSFEAPPSVRInstance2
          GLB_LSCP_SVR1_ID: !Ref GLBLSCPSVR1Instance
          GLB_LSCP_SVR2_ID: !Ref GLBLSCPSVR2Instance
          IWEB_APP_SVR1_ID: !Ref IWEBAPPSVR1Instance
          IWEB_APP_SVR2_ID: !Ref IWEBAPPSVR2Instance
          IWEBFE_APP_SVR1_ID: !Ref IWEBFEAPPSVRInstance1
          IWEBFE_APP_SVR2_ID: !Ref IWEBFEAPPSVRInstance2
          WIT_SVR_ID: !Ref CICSWITSVRInstance
          JUMP_SVR_ID: !Ref PCHJUMPSVRInstance

Outputs:

#Required for VPC Peering connections

  DBPort:
    Description: DB Server Security Group
    Value: !GetAtt [DBStack, Outputs.DBInstancePort]
    Export:
      Name: !Sub '${AWS::StackName}-DBPort'

  DBSecurityGroup:
    Description: DB Server Security Group
    Value: !GetAtt [DBStack, Outputs.SecurityGroupId]
    Export:
      Name: !Sub '${AWS::StackName}-DBSecurityGroup'
  
  CICSAPPSVRSecurityGroup:
    Description: App Servers Security Group
    Value: !GetAtt CICSAPPSVRSecurityGroup.GroupId
    Export:
      Name: !Sub '${AWS::StackName}-CICSAPPSVRSecurityGroup'