        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, xfer]]

  ArchiveS3Bucket:
    # DeletionPolicy: Retain
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, archive]]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3
            Status: Enabled
          - Transition:
              StorageClass: GLACIER
              TransitionInDays: 365
            Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, archive]]


  BankGroup:
    Type: AWS::IAM::Group
    Properties:
      Policies:
        - PolicyName: BankUsersPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: QueueAccess
                Effect: Allow
                Action: 
                  - sqs:DeleteMessage
                  - sqs:ReceiveMessage
                Resource:
                  - !Join [':', ['arn:aws:sqs:*', !Ref 'AWS::AccountId', !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, '${aws:username}', queue]]]]
              - Sid: TransferBucketAccess
                Effect: Allow
                Action: 
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !Join ['', [!GetAtt [TransferS3Bucket, Arn], '/ToServer/${aws:username}/*']]
                  - !Join ['', [!GetAtt [TransferS3Bucket, Arn], '/FromServer/${aws:username}/*']]
                  - !GetAtt [TransferS3Bucket, Arn]
              - Sid: IAMKeyAccess
                Effect: Allow
                Action: 
                  - iam:*AccessKey*
                  - iam:*SigningCertificate*
                Resource:
                  - !Join [':', ['arn:aws:iam:', !Ref 'AWS::AccountId','user/${aws:username}']]

