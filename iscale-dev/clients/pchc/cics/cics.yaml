# Database
###

  SQLServerBackupRestoreIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - rds.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: S3BucketAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt ArchiveS3Bucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObjectMetaData
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListMultipartUploadParts
                  - s3:AbortMultipartUpload
                Resource:
                  - !Join ['', [!GetAtt ArchiveS3Bucket.Arn, '/*']]

  SQLServerOptionGroup:
    Type: AWS::RDS::OptionGroup
    Properties:
      EngineName: sqlserver-se
      MajorEngineVersion: '15.00'
      OptionGroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      OptionConfigurations:
        - OptionName: SQLSERVER_BACKUP_RESTORE
          OptionSettings:
            - Name: IAM_ROLE_ARN
              Value: !GetAtt SQLServerBackupRestoreIAMRole.Arn
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
  
  DBStack: # some settings were manually updated in Console since we cannot update the whole template yet (outdated AMIs of windows EC2, need to be replaced for this stack to update)
    Condition: IsDeployPaidResourcesAndNotPITR
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/database.yaml
      Parameters:
        Name: !Ref Name
        DatabaseName: !Join ['',[!Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], db]]
        AllocatedStorage: 3000 # manually updated in console, delete this comment synced already
        BackupRetentionPeriod: !If [IsProd, 30, 7]
        DeletionProtection: !If [IsProd, !Ref DeletionProtection, false]
        Domain: !Ref ActiveDirectory
        EnableEnhancedMonitoring: !If [IsProd, true, false]
        EnablePerformanceInsights: !If [IsProd, true, false]
        EnvName: !Ref EnvName
        Engine: sqlserver-se
        EngineVersion: 15.00.4236.7.v1
        Family: sqlserver-se-15.0
        InstanceType: !If [IsProd, db.r5.4xlarge, db.m5.2xlarge] # manually updated in console, delete this comment synced already
        MasterUser: admin
        MultiAz: true
        NetworkStackName: !Ref NetworkStackName
        NetworkType: Private
        OptionGroupName: !Ref SQLServerOptionGroup
        Port: 1433
        OrgName: !Ref OrgName
        SNSStackName: !Ref SNSStackName
        StorageEncrypted: true
        SnapshotIdentifier: !Ref SnapshotIdentifier
        MasterUserPassword: !Ref DBMasterUserPassword
        ExistingSecretArn: !If [IsDR, !Ref DRDBSecret, '']

####
# Disaster Recovery
# All resources below are deployed ONLY when EnvName is a DR variant (ProductionDR, StagingDR, etc.).
# These resources are always-on in the DR region at zero/minimal cost.
# They pre-provision the infrastructure needed to activate the environment at failover time.
####

  # Placeholder Secrets Manager secret for DB credentials in the DR region.
  # Created at DR stack deploy time with placeholder values.
  # The secrets-sync Lambda overwrites the values whenever the live region secret rotates,
  # ensuring correct credentials are available before failover is triggered.
  # At failover, database.yaml receives this ARN as ExistingSecretArn and skips creating a
  # new secret — preventing a name conflict and ensuring the app servers get the correct credentials.
  DRDBSecret:
    Condition: IsDR
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Description: !Sub 'DR placeholder secret for ${OrgName} ${Name} — values synced from the live region secret by the secrets-sync Lambda before failover.'
      SecretString: !Sub |
        {
          "DB_ROOT_USER": "root",
          "DB_ROOT_PASSWORD": "PLACEHOLDER_SYNC_FROM_LIVE",
          "DB_NAME": "${Name}db",
          "DB_USER": "${Name}",
          "DB_PASSWORD": "PLACEHOLDER_SYNC_FROM_LIVE",
          "MAGENTO_ADMIN_PASSWORD": "PLACEHOLDER_SYNC_FROM_LIVE"
        }
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName
        - Key: DRSync
          Value: 'true'
        - Key: SourceSecretArn
          Value: !Ref LiveSecretArn

  # Pre-deployed DB subnet group for PITR restore in DR standby.
  # Uses -dr suffix to avoid naming conflict with DBStack's own subnet group at failover.
  DBStandbySubnetGroup:
    Condition: IsDR
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db, standby]]
      DBSubnetGroupName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db, standby]]
      SubnetIds:
        - Fn::ImportValue: !Sub '${NetworkStackName}-InternalSubnetId1'
        - Fn::ImportValue: !Sub '${NetworkStackName}-InternalSubnetId2'
        - Fn::ImportValue: !Sub '${NetworkStackName}-InternalSubnetId3'
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db, standby]]

  # Pre-deployed DB security group for PITR restore in DR standby (cics).
  # Attached to the restored cics instance at failover; app server stacks add
  # ingress rules to this SG at restore time.
  DBStandbySecurityGroup:
    Condition: IsDR
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db, standby]]
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db, standby]]

  # Cross-region automated backup replication — provides ~5 min RPO via PITR without a running replica.
  # Enable by setting EnableCrossRegionBackupReplication=true and providing SourceDbInstanceArn.
  # Only deployed in DR environments (IsDR condition) with replication explicitly enabled.
  DBReplicationStack:
    Condition: IsDRAndEnableCrossRegionBackupReplication
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/db-replication.yaml
      Parameters:
        Name: !Ref Name
        OrgName: !Ref OrgName
        EnvName: !Ref EnvName
        SourceDbInstanceArn: !Ref SourceDbInstanceArn
        BackupRetentionPeriod: !Ref BackupReplicationRetentionPeriod

  AllowCICSAPPSVRIntoDB:
    Condition: IsDeployPaidResourcesAndNotPITR
    DependsOn:
      - DBStack
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from CICSAPPSVR
      IpProtocol: TCP
      GroupId: !GetAtt [DBStack, Outputs.SecurityGroupId]
      FromPort: 1433
      ToPort: 1433
      SourceSecurityGroupId: !Ref CICSAPPSVRSecurityGroup

  AllowGLBLSCPSVRIntoDB:
    Condition: IsDeployPaidResourcesAndNotPITR
    DependsOn:
      - DBStack
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from GLBLSCPSVR
      IpProtocol: TCP
      GroupId: !GetAtt [DBStack, Outputs.SecurityGroupId]
      FromPort: 1433
      ToPort: 1433
      SourceSecurityGroupId: !Ref GLBLSCPSVRSecurityGroup
  
  AllowBKUPSVRIntoDB:
    Condition: IsDeployPaidResourcesAndNotPITR
    DependsOn:
      - DBStack
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from BKUPSVR
      IpProtocol: TCP
      GroupId: !GetAtt [DBStack, Outputs.SecurityGroupId]
      FromPort: 1433
      ToPort: 1433
      SourceSecurityGroupId: !Ref BKUPSVRSecurityGroup

  # PITR-mode equivalents of the three rules above, targeting the standby SG that the
  # restored cics instance is attached to (DBStack is suppressed in PITR mode).
  AllowCICSAPPSVRIntoStandbyDB:
    Condition: IsDRAndPITR
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from CICSAPPSVR (PITR standby)
      IpProtocol: TCP
      GroupId: !GetAtt DBStandbySecurityGroup.GroupId
      FromPort: 1433
      ToPort: 1433
      SourceSecurityGroupId: !Ref CICSAPPSVRSecurityGroup

  AllowGLBLSCPSVRIntoStandbyDB:
    Condition: IsDRAndPITR
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from GLBLSCPSVR (PITR standby)
      IpProtocol: TCP
      GroupId: !GetAtt DBStandbySecurityGroup.GroupId
      FromPort: 1433
      ToPort: 1433
      SourceSecurityGroupId: !Ref GLBLSCPSVRSecurityGroup

  AllowBKUPSVRIntoStandbyDB:
    Condition: IsDRAndPITR
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from BKUPSVR (PITR standby)
      IpProtocol: TCP
      GroupId: !GetAtt DBStandbySecurityGroup.GroupId
      FromPort: 1433
      ToPort: 1433
      SourceSecurityGroupId: !Ref BKUPSVRSecurityGroup

# Target group
  CICSListenerRule:
    Condition: IsDeployPaidResources
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref CICSTargetGroup
      Conditions:
        - Field: host-header
          Values:
            - !If
              - HasLoadBalancerHostName
              - !Join ['.', [!Ref LoadBalancerHostName, !Ref ClientDomainName]]
              - !If
                - IsMainRegion
                - !Join ['.', ['cpacsweb', !Ref ClientDomainName]]
                - !Join ['.', ['cics-uat', !Ref ClientDomainName]]
      ListenerArn: !GetAtt [ELBStack, Outputs.ApplicationListenerArn]
      Priority: 100

  CICSTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: 301,302,400
      Port: 443
      Protocol: HTTPS
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'
      Targets:
        - Id: !Ref IWEBAPPSVR1Instance
          Port: 443
        - !If
          - IsMainRegion
          - Id: !Ref IWEBAPPSVR2Instance
            Port: 443
          - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  SlowTargetResponseTimeCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProdOrProductionDRAndDeployPaidResources
    Properties:
      MetricName: TargetResponseTime
      Namespace: AWS/ApplicationELB
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Average
      Threshold: 5 #if greater than 5 seconds
      AlarmActions:
        - Fn::ImportValue:
            Fn::Sub: '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            Fn::Sub: '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt [ELBStack, Outputs.LoadBalancerFullName]
        - Name: TargetGroup
          Value: !Ref CICSTargetGroup
      TreatMissingData: notBreaching

  TargetGroupHealthyHostCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProdOrProductionDRAndDeployPaidResources
    Properties:
      MetricName: HealthyHostCount
      Namespace: AWS/ApplicationELB
      ComparisonOperator: LessThanThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 1
      AlarmActions:
        - Fn::ImportValue:
            Fn::Sub: '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            Fn::Sub: '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt [ELBStack, Outputs.LoadBalancerFullName]
        - Name: TargetGroup
          Value: !Ref CICSTargetGroup
      TreatMissingData: notBreaching

