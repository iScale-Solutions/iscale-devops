      SecurityGroupIngress:
        - IpProtocol: -1
          CidrIp: 
            Fn::ImportValue:
              !Sub '${NetworkStackName}-VpcCidrBlock'
          Description: Allow all traffic on on all ports from inside VPC
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, CICSFEAPPSVR, Security, Group]]

