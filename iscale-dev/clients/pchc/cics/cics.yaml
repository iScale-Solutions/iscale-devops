# PCHCADSVR
###

  PCHCADSVREC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  PCHCADSVRInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref PCHCADSVREC2Role

  PCHCADSVRSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'
      GroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, PCHCADSVR, Security, Group]]
      SecurityGroupIngress:
        - IpProtocol: -1
          CidrIp: 
            Fn::ImportValue:
              !Sub '${NetworkStackName}-VpcCidrBlock'
          Description: Allow all connections on all ports from inside VPC
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, PCHCADSVR, Security, Group]]

  AllowJumpHostIntoPCHCADSVR:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from jump host
      IpProtocol: TCP
      GroupId: !Ref PCHCADSVRSecurityGroup
      FromPort: 3389
      ToPort: 3389
      SourceSecurityGroupId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-JumpHostSecurityGroupId'

  PCHCADSVRENI1: #disabled
    Type: AWS::EC2::NetworkInterface
    Properties:
      Description: PCHCADSVR First Interface
      GroupSet:
        - !Ref PCHCADSVRSecurityGroup
      PrivateIpAddress: 10.0.2.26 #TODO - Need to fix this based on CIDR (e.g. for UAT)
      SourceDestCheck: true
      SubnetId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PrivateSubnetId1'

  PCHCADSVRENI2:
    Type: AWS::EC2::NetworkInterface
    Properties:
      Description: PCHCADSVR Second Interface
      GroupSet:
        - !Ref PCHCADSVRSecurityGroup
      PrivateIpAddress: 10.0.2.29 #TODO - Need to fix this based on CIDR (e.g. for UAT)
      SourceDestCheck: true
      SubnetId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PrivateSubnetId1'

  PCHCADSVRInstance:
    Type: AWS::EC2::Instance
    Properties:
      # ImageId: !Ref InstanceAMI
      # ImageId: ami-035d490a9d10b7a52 #Hardcoded since changes were made
      ImageId: ami-0a7006c3750c33741 #Hardcoded since changes were made
      InstanceType: t3.micro
      DisableApiTermination: !Ref DeletionProtection
      IamInstanceProfile: !Ref PCHCADSVRInstanceProfile
      KeyName: !If [HasKeyName, !Ref InstanceKeyName, !Ref 'AWS::NoValue']
      NetworkInterfaces:
        - DeviceIndex: 0
          NetworkInterfaceId: !Ref PCHCADSVRENI1
        - DeviceIndex: 1
          NetworkInterfaceId: !Ref PCHCADSVRENI2
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 30
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, PCHCADSVR]]

  PCHCADSVRDefaultDNSRecord: #domain name
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-LocalHostedZoneId'
      Name: 
        Fn::ImportValue:
          !Sub '${NetworkStackName}-LocalHostedZoneDomainName'
      ResourceRecords:
        - !GetAtt [PCHCADSVRENI2, PrimaryPrivateIpAddress]
      TTL: 14400
      Type: A

  PCHCADSVRDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-LocalHostedZoneId'
      Name: !Join
        - '.'
        - - !Join ['',[!FindInMap [EnvShort, !Ref EnvName, Name], !Ref OrgName, adsvr1]]
          - Fn::ImportValue:
              !Sub '${NetworkStackName}-LocalHostedZoneDomainName'
      ResourceRecords:
        - !GetAtt [PCHCADSVRENI2, PrimaryPrivateIpAddress]
      TTL: 14400
      Type: A

