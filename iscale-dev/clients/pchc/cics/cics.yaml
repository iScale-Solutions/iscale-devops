            Encrypted: true
            VolumeSize: 30
            VolumeType: gp3
      SecurityGroupIds: 
        - !Ref PCHCADSVRSecurityGroup
      SubnetId:        
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PrivateSubnetId1'
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, PCHCADSVR]]

  HighCPUADSVRAlarm:
    Condition: IsProd
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, ADSVR, high, cpu]]
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: InstanceId
          Value: !Ref PCHCADSVRInstance

