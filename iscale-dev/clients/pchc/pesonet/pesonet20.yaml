  BackupStack:
    DependsOn:
      - DBStack
      - TreasuryServerStack
    Condition: IsProdOrTestOrDRAndDeployPaidResourcesAndNotPITR
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/backup.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        BackupARNList: !Join
          - ','
          - - Fn::GetAtt:
              - DBStack
              - Outputs.DBInstanceARN
            - Fn::GetAtt:
              - TreasuryServerStack
              - Outputs.AppServerEFSArn
        BackupTime: !If [IsProd, !Ref 'AWS::NoValue', 1] #Default backup time else 1AM UTC for dev
        EnableHourlyBackup: !If [IsProductionDR, 'true', 'false']

  Dashboard:
    Condition: IsDashboardDeployedAndNotPITR
    Type: AWS::CloudWatch::Dashboard
    Properties:
        DashboardName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        DashboardBody: !Sub
          - |
            {
              "widgets": [
                {
                  "height": 12,
                  "width": 6,
                  "y": 0,
                  "x": 0,
                  "type": "alarm",
                  "properties": {
                    "title": "Alarms",
                    "alarms": [
                      "${CACHE_HIGH_CPU}",
                      "${CACHE_LOW_MEM}",
                      "${DB_HIGH_CPU}",
                      "${DB_LOW_STORAGE}",
                      "${DB_LOW_CPU_CREDIT}",
                      "${DB_ERRORS}",
                      "${DB_ERROR_DENIED}",
                      "${TG_UNHEALTHY}",
                      "${TG_SLOW}"
                    ]
                  }
                },
                {
                  "height": 6,
                  "width": 6,
                  "y": 0,
                  "x": 6,
                  "type": "metric",
                  "properties": {
                    "metrics": [
                      [ "AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "label": "RDS" } ],
                      [ "AWS/ElastiCache", "CPUUtilization", "CacheClusterId", "${CACHE_INSTANCE_ID}", { "label": "Redis" } ],
                      [ "AWS/EC2", "CPUUtilization", "ImageId", "${APP_SERVER_AMI}" , { "label": "App Servers" }]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${REGION}",
                    "period": 300,
                    "title": "CPU",
                    "stat": "Average",
                    "yAxis": {
                      "left": {
                        "label": "Utilization"
                      }
                    }
                  }
                },
                {
                  "height": 6,
                  "width": 6,
                  "y": 6,
                  "x": 6,
                  "type": "metric",
                  "properties": {
                    "metrics": [
                      [ { "expression": "100-((m4/(16*1024*1000000))*100)", "label": "RDS (memory)", "id": "e1", "region": "${REGION}" } ],
                      [ "AWS/RDS", "FreeableMemory", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "id": "m4", "visible": false } ],
                      [ "AWS/ElastiCache", "DatabaseMemoryUsagePercentage", "CacheClusterId", "${CACHE_INSTANCE_ID}", { "label": "Redis (memory)" } ],
                      [ "CWAgent", "mem_used_percent", "InstanceId", "${APP_SERVER_ID}", "AutoScalingGroupName", "${ASG_GROUP_NAME}", "ImageId", "${APP_SERVER_AMI}", "InstanceType", "${APP_SERVER_TYPE}" , { "label": "App Servers (memory)" }],
                      [ { "expression": "100-(m1/(20*1024*1000000)*100)", "label": "RDS (disk)", "id": "e2", "region": "${REGION}" } ],
                      [ "AWS/RDS", "FreeStorageSpace", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "id": "m1", "visible": false } ],
                      [ "CWAgent", "disk_used_percent", "path", "/", "InstanceId", "${APP_SERVER_ID}", "AutoScalingGroupName", "${ASG_GROUP_NAME}", "ImageId", "${APP_SERVER_AMI}", "InstanceType", "${APP_SERVER_TYPE}", "device", "nvme0n1p1", "fstype", "xfs" , { "label": "App Servers (disk)" } ]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${REGION}",
                    "period": 300,
                    "title": "Memory / Storage",
                    "stat": "Average",
                    "yAxis": {
                      "left": {
                        "label": "Utilization"
                      }
                    }
                  }
                },
                {
                  "height": 6,
                  "width": 6,
                  "y": 0,
                  "x": 12,
                  "type": "metric",
                  "properties": {
                    "metrics": [
                      [ "AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${ELB_FULL_NAME}", { "label": "ELB" } ],
                      [ "AWS/RDS", "ReadLatency", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "label": "RDS Read" } ],
                      [ ".", "WriteLatency", ".", ".", { "label": "RDS Write" } ]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${REGION}",
                    "period": 300,
                    "title": "Performance",
                    "stat": "Average",
                    "yAxis": {
                      "left": {
                        "showUnits": true,
                        "label": "Time"
                      }
                    }
                  }
                },
                {
                  "height": 6,
                  "width": 6,
                  "y": 0,
                  "x": 18,
                  "type": "metric",
                  "properties": {
                    "metrics": [
                      [ "AWS/EC2", "NetworkIn", "ImageId", "${APP_SERVER_AMI}", { "label": "App Servers (In)" }],
                      [ ".", "NetworkOut", ".", ".", { "label": "App Servers (out)" }],
                      [ "AWS/ApplicationELB", "ProcessedBytes", "LoadBalancer", "${ELB_FULL_NAME}", { "label": "ELB" } ],
                      [ "AWS/RDS", "NetworkReceiveThroughput", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "label": "RDS (In)" }],
                      [ ".", "NetworkTransmitThroughput", ".", ".", { "label": "RDS (Out)" }],
                      [ "AWS/ElastiCache", "NetworkBytesIn", "CacheClusterId", "${CACHE_INSTANCE_ID}", { "label": "Redis (In)" }],
                      [ ".", "NetworkBytesOut", ".", ".", { "label": "Redis (Out)" }]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "title": "Network",
                    "region": "${REGION}",
                    "period": 300,
                    "stat": "Average",
                    "legend": {
                      "position": "bottom"
                    },
                    "yAxis": {
                      "left": {
                        "label": "Volume"
                      }
                    }
                  }
                },
                {
                  "height": 6,
                  "width": 6,
                  "y": 6,
                  "x": 12,
                  "type": "metric",
                  "properties": {
                    "metrics": [
                      [ "AWS/RDS", "ReadThroughput", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "label": "RDS Read" }],
                      [ ".", "WriteThroughput", ".", ".", { "label": "RDS Write" }],
                      [ "AWS/EFS", "DataReadIOBytes", "FileSystemId", "${EFS_ID}", { "label": "EFS Read" }],
                      [ ".", "DataWriteIOBytes", ".", ".", { "label": "EFS Write" }]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${REGION}",
                    "period": 300,
                    "title": "I/O",
                    "stat": "Average",
                    "yAxis": {
                      "left": {
                        "label": "Count",
                        "showUnits": false
                      }
                    }
                  }
                },
                {
                  "height": 6,
                  "width": 6,
                  "y": 6,
                  "x": 18,
                  "type": "metric",
                  "properties": {
                    "metrics": [
                      [ "AWS/ApplicationELB", "HTTPCode_ELB_5XX_Count", "LoadBalancer", "${ELB_FULL_NAME}", { "label": "ELB HTTP 5XX_Count" } ],
                      [ ".", "HTTPCode_ELB_4XX_Count", ".", ".", { "label": "ELB HTTP 4XX_Count" } ]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${REGION}",
                    "title": "Error Count",
                    "period": 300,
                    "stat": "Average"
                  }
                }
              ]
            }
          - CACHE_HIGH_CPU: !GetAtt [CacheStack, Outputs.HighCPUAlarm]
            CACHE_LOW_MEM: !GetAtt [CacheStack, Outputs.LowMemoryAlarm]
            DB_HIGH_CPU: !GetAtt [DBStack, Outputs.DBHighCPUAlarm]
            DB_LOW_STORAGE: !GetAtt [DBStack, Outputs.DBLowStorageAlarm]
            DB_LOW_CPU_CREDIT: !GetAtt [DBStack, Outputs.CPUCreditBalanceAlarm]
            DB_ERRORS: !GetAtt [DBStack, Outputs.DBErrorsAlarm]
            DB_ERROR_DENIED: !GetAtt [DBStack, Outputs.DBErrorDeniedAlarm]
            TG_SLOW: !GetAtt [APIServerStack, Outputs.AppServerSlowTargetGroupAlarm]
            TG_UNHEALTHY: !GetAtt [APIServerStack, Outputs.UnhealthyTargetGroupAlarm]
            DB_INSTANCE_ID: !GetAtt [DBStack, Outputs.DBInstanceName]
            CACHE_INSTANCE_ID: !Join ['-', [!GetAtt [CacheStack, Outputs.ElasticacheReplicationGroup], '001']]
            REGION: !Ref 'AWS::Region'
            ELB_FULL_NAME: !GetAtt [TreasuryELBStack, Outputs.LoadBalancerFullName]
            ASG_GROUP_NAME: "CodeDeploy_pchc-prd-ase1-pesonet-APIServerDeployStack-1QYHN20GUEB0A-CodeDeployDeploymentGroup-1VK61UCQ8GMCY_d-KRKVJ95SJ" #First time, it will be empty, that's OK
            APP_SERVER_AMI: !Ref InstanceAMI
            APP_SERVER_ID: i-0d6e53ff58d0902e6 #Hardcoded for now
            APP_SERVER_TYPE: t3.medium
            EFS_ID: !GetAtt [APIServerStack, Outputs.AppServerEFS]

Outputs:

  DRDBSecretArn:
    Condition: IsDR
    Description: ARN of the DR Secrets Manager secret — set this in the secrets-sync Lambda so it keeps values current from the live region
    Value: !Ref DRDBSecret
    Export:
      Name: !Sub '${AWS::StackName}-DRDBSecretArn'

  DBStandbySubnetGroup:
    Condition: IsDR
    Description: Pre-deployed DB subnet group for PITR restore — use in restore-db-instance-from-db-snapshot command
    Value: !Ref DBStandbySubnetGroup
    Export:
      Name: !Sub '${AWS::StackName}-DBStandbySubnetGroup'

  DBStandbySecurityGroup:
    Condition: IsDR
    Description: Pre-deployed DB security group for PITR restore — use in restore-db-instance-from-db-snapshot command
    Value: !GetAtt DBStandbySecurityGroup.GroupId
    Export:
      Name: !Sub '${AWS::StackName}-DBStandbySecurityGroupId'

