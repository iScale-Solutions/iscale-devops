###
# App Server Treasury
###

  TreasuryELBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/loadbalancer.yaml
      Parameters:
        Name: !Join ['-', [!Ref Name, tre]]
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        CertificateArn: !Ref LoadBalancerCertificateArn
        DeletionProtection: !Ref DeletionProtection
        SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
        InstancePort: 80
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName
        DeployPaidResources: !If [IsDR, 'false', 'true']

  TreasuryDeployStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/deployment.yaml
      Parameters:
        Name: !Join ['-', [!Ref Name, tre]]
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName

  TreasuryServerStack:
    DependsOn:
      - DBStack
      - TreasuryDeployStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/appserver-basic2.yaml
      Parameters:
        Name: !Join ['-', [!Ref Name, tre]]
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        ASGMaxSize: 3
        ASGDesiredSize: 3
        CacheEndpoint:
          Fn::GetAtt:
            - CacheStack
            - Outputs.CachePrimaryEndpoint
        CachePort:
          Fn::GetAtt:
            - CacheStack
            - Outputs.ClusterPort
        CacheSecurityGroupId:
          Fn::GetAtt:
            - CacheStack
            - Outputs.SecurityGroupId
        ClientDomainName: !Ref ClientDomainName
        DatabaseEndpoint:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBInstanceAddress
        DatabasePort:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBInstancePort
        DatabaseSecurityGroupId:
          Fn::GetAtt:
            - DBStack
            - Outputs.SecurityGroupId
        InstanceAMI: !Ref InstanceAMI
        InstanceKeyName: !Ref InstanceKeyName
        InstancePort: 80
        #InstanceSpotPrice: !If [IsProd, !Ref 'AWS::NoValue', 1]
        InstanceSubnet: Private
        InstanceType: t3.large
        LoadBalancerHostName: pesonet20 #!If [IsTest, pesonet20-test, pesonet20]
        LoadBalancerStackName: !Select [ 1, !Split [ '/', !Ref TreasuryELBStack]]
        NetworkStackName: !Ref NetworkStackName
        SharedSecretId:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBSecretManagerKeyId
        SNSStackName: !Ref SNSStackName
        UseFriendlyNames: FALSE
        VolumeName: /dev/xvda # Amazon Linux 2 AMI uses /dev/xvda
        VolumeSize: 10 #GB 
        VolumeType: gp2
        LaunchTemplate: True

  TreasurySchedulerStack:
    DependsOn:
      - DBStack
      - TreasuryServerStack
    Condition: IsNotProd
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: FALSE
        CodeDeployApplicationName:
          Fn::GetAtt:
            - TreasuryDeployStack
            - Outputs.CodeDeployApplicationName
        CodeDeployDeploymentGroupName:
          Fn::GetAtt:
            - TreasuryDeployStack
            - Outputs.CodeDeployDeploymentGroupName

###
# API
###

  NetworkAPIELBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/loadbalancer.yaml
      Parameters:
        Name: !Join ['-', [!Ref Name, api]]
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        CertificateArn: !Ref LoadBalancerCertificateArn
        DeletionProtection: !Ref DeletionProtection
        ElbProtocol: TCP
        ElbType: network
        InstancePort: 443
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName
        DeployPaidResources: !If [IsDR, 'false', 'true']

  APIServerDeployStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/deployment.yaml
      Parameters:
        Name: !Join ['-', [!Ref Name,api]]
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName

  APIServerStack:
    DependsOn:
      - DBStack
      - APIServerDeployStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/appserver-basic2.yaml
      Parameters:
        Name: !Join ['-', [!Ref Name,api]]
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        ASGMaxSize: 3
        ASGDesiredSize: 3
        CacheEndpoint:
          Fn::GetAtt:
            - CacheStack
            - Outputs.CachePrimaryEndpoint
        CachePort:
          Fn::GetAtt:
            - CacheStack
            - Outputs.ClusterPort
        CacheSecurityGroupId:
          Fn::GetAtt:
            - CacheStack
            - Outputs.SecurityGroupId
        ClientDomainName: !Ref ClientDomainName
        DatabaseEndpoint:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBInstanceAddress
        DatabasePort:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBInstancePort
        DatabaseSecurityGroupId:
          Fn::GetAtt:
            - DBStack
            - Outputs.SecurityGroupId
        ExternalEFSID:
          Fn::GetAtt:
            - TreasuryServerStack
            - Outputs.AppServerEFS
        ExternalEFSSecurityGroup:
          Fn::GetAtt:
            - TreasuryServerStack
            - Outputs.AppServerEFSSecurityGroup
        InstanceAMI: !Ref InstanceAMI
        InstanceKeyName: !Ref InstanceKeyName
        InstancePort: 443
        #InstanceSpotPrice: !If [IsProd, !Ref 'AWS::NoValue', 1]
        InstanceSubnet: Private
        InstanceType: t3.large
        LoadBalancerHostName: api-pesonet20 #!If [IsTest, 'api-pesonet20-test', api-pesonet20]
        LoadBalancerStackName: !Select [ 1, !Split [ '/', !Ref NetworkAPIELBStack]]
        LoadBalancerStackType: Network
        NetworkStackName: !Ref NetworkStackName
        SharedSecretId:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBSecretManagerKeyId
        SNSStackName: !Ref SNSStackName
        UseFriendlyNames: FALSE
        VolumeName: /dev/xvda # Amazon Linux 2 AMI uses /dev/xvda
        VolumeSize: 10 #GB 
        VolumeType: gp2
        LaunchTemplate: True

  AllowHTTPtoPesonetAPIAppServer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow HTTP
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - APIServerStack
          - Outputs.AppServerSecurityGroup
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0

  APIServerSchedulerStack:
    DependsOn:
      - DBStack
      - APIServerStack
    Condition: IsNotProd
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: FALSE
        CodeDeployApplicationName:
          Fn::GetAtt:
            - APIServerDeployStack
            - Outputs.CodeDeployApplicationName
        CodeDeployDeploymentGroupName:
          Fn::GetAtt:
            - APIServerDeployStack
            - Outputs.CodeDeployDeploymentGroupName

