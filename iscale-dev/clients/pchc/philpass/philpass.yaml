                  PPP_DR_SUBNET: !FindInMap [BSPConfig, Production, PPPDRSubnetCIDR]
                  LEFT_IP: !FindInMap [BSPConfig, Production, StrongSwanENIPrivIPAZ1]
                  LEFT_SUBNET: !FindInMap [BSPConfig, Production, StrongSwanPublicSubnetAZ1]
                  PPP_GATEWAY: !FindInMap [BSPConfig, Production, PPPGateway]
                  PPP_DR_GATEWAY: !FindInMap [BSPConfig, Production, PPPDRGateway]
                  3RD_GATEWAY: !FindInMap [BSPConfig, Production, PP3rdPartyGateway]
