      DestinationCidrBlock: !Join ['', [!FindInMap [BSPConfig, !Ref BSPMode, PPPDNSServer1], '/32']]
      NetworkInterfaceId: !Ref StrongSwanAZ2ENI

  BSPPhilPassPlusRouteDNS2AZ1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PrivateRouteTable1'
      DestinationCidrBlock: !Join ['', [!FindInMap [BSPConfig, !Ref BSPMode, PPPDNSServer2], '/32']]
