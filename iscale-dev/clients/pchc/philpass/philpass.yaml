AWSTemplateFormatVersion: 2010-09-09
Description: PhilPass BSP Gateway Resources

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
          - DeletionProtection
      - Label:
          default: Load Balancer Configuration
        Parameters:
          - ClientDomainName
          - LoadBalancerCertificateArn
      - Label:
          default: Instance Configuration
        Parameters:
          - InstanceKeyName
          - BSPInterfaceAMI
          - InstanceType
      - Label:
          default: Scheduler Configuration
        Parameters:
          - StartScheduleExpression
          - StopScheduleExpression
      - Label:
          default: BSP Interface Configuration
        Parameters:
          - StrongswanActive
          - BSPMode
          - StrongswanPPPPSK
          - Strongswan3RDPSK
          - StrongswanAMI
          - BSPInterfaceHostname

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      BSPInterfaceHostname:
        default: BSP interface hostname
      DeletionProtection:
        default: Protect core items against deletion
      BSPInterfaceAMI:
        default: Philpass Instance AMI ID
      InstanceKeyName:
        default: Instance Key Name
      InstanceType:
        default: Instance Type
      LoadBalancerCertificateArn:
        default: Load Balancer SSL Certificate ARN
      NetworkStackName:
        default: Network Stack Name
      SNSStackName:
        default: SNS Topic Stack Name
      ClientDomainName:
        default: Domain Name
      StartScheduleExpression:
        default: Start Schedule CRON Expression
      StopScheduleExpression:
        default: Stop Schedule CRON Expression
      StrongswanActive:
        default: Active StrongSwan Instance (default is true)
      StrongswanAMI:
        default: Strongswan AMI ID
      StrongswanPPPPSK:
        default: StrongSwan PhilPassPlus Shared Key
      Strongswan3RDPSK:
        default: StrongSwan 3rd Party Shared Key

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name)
    Type: String
    MinLength: 3
    MaxLength: 9
    Default: philpass
  OrgName:
    Description: The name of the organization
    Type: String
    Default: pchc
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  BSPMode:
    Description: BSP Resources to connect to
    Type: String
    Default: UAT
    AllowedValues:
      - Production
      - UAT
  BSPInterfaceHostname:
    Description: Hostname for the BSP interface instance
    Type: String
    Default: philpassv2
    MinLength: 1
  ClientDomainName:
    Description: The client's domain name (e.g. example.com, iscale-software.com)
    Type: String
    AllowedPattern: ^[a-z0-9]+([\-\.]{1}[a-z0-9]+)*\.[a-z]{2,7}$
    Default: pchc.com.ph
    MinLength: 1
  DeletionProtection:
    Description: Set to true to enable (valid only in Production mode)
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  BSPInterfaceAMI:
    Description: Instance AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-00b8d9cb8a7161e41 #Default Amazon Linux 2 for Singapore
  InstanceKeyName:
    Description: Instance Key Name
    Type: String
    Default: ''
  InstanceType:
    Description: Type of instance for app server
    Type: String
    Default: t3.medium
    AllowedValues:
      - t3.medium
      - t3.large
      - t3.xlarge
  LoadBalancerCertificateArn:
    Description: SSL Certificate for the ELB
    Type: String
    Default: arn:aws:acm:ap-southeast-1:470455329885:certificate/9f713d5d-cb7c-4e8e-acc2-46862d610ec8
  NetworkStackName:
    Description: The name of the network stack
    Type: String
    Default: pchc-dev-ase1-network
    MinLength: 1
  SNSStackName:
    Description: The name of the SNS stack
    Type: String
    Default: pchc-dev-ase1-sns
    MinLength: 1
  StartScheduleExpression:
    Description: Schedule expression when to start the objects
    Type: String
    Default: cron(0 0 ? * MON-FRI *)
  StopScheduleExpression:
    Description: Schedule expression when to stop the objects
    Type: String
    Default: cron(0 10 ? * MON-FRI *)
  StrongswanActive:
    Description: Set to false only to turn off Strongswan
    Type: String
    Default: true
    AllowedValues:
      - true
      - false
  StrongswanAMI:
    Description: Strongswan Instance AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-0499b5b9a26be1426
  StrongswanPPPPSK:
    Description: Password for PhilPassPlus PSK
    Type: String
    NoEcho: true
  Strongswan3RDPSK:
    Description: Password for 3rd Party PSK
    Type: String
    NoEcho: true

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml
  BSPConfig:
    Production:
      PPPGateway: 121.127.5.157
      PPPSubnetCIDR: 192.168.80.0/24
      PPPResource1: 192.168.80.131
      PPPResource2: 192.168.80.132
      PPPResource3: 192.168.80.141
      PPPResource4: 192.168.80.152
      PPPResource5: 192.168.80.153
      PPPResource6: 192.168.80.154
      PPPDNSServer1: 192.168.80.241
      PPPDNSServer2: 192.168.80.242
      PP3rdPartyGateway: 121.127.5.50
      PP3rdPartySubnetCIDR: 192.168.4.0/24
      PP3rdPartyResource: 192.168.4.125/32
      StrongSwanENIPrivIPAZ1: 10.0.0.53 #registered with BSP
      StrongSwanPublicSubnetAZ1: 10.0.0.32/27
      StrongSwanPrivateSubnetAZ1: 10.0.0.0/27
      StrongSwanENIPrivIPAZ2: 10.0.0.176 #registered with BSP
      StrongSwanPublicSubnetAZ2: 10.0.0.160/27
      StrongSwanPrivateSubnetAZ2: 10.0.0.128/27
      PPPDRGateway: 121.127.17.175 #DR Gateway
      PPPDRSubnetCIDR: 192.168.90.0/24
      PPPDRResource1: 192.168.90.131
      PPPDRResource2: 192.168.90.141
      PPPDRResource3: 192.168.90.142
      PPPDRResource4: 192.168.90.152
      PPPDRResource5: 192.168.90.153
      PPPDRResource6: 192.168.90.154
    UAT:
      PPPGateway: 121.127.5.157 #Same as Prod
      PPPSubnetCIDR: 192.168.222.0/24
      PPPResource1: 192.168.222.100
      PPPDNSServer1: 192.168.222.241 #Check on this
      PPPDNSServer2: 192.168.222.242 #Check on this
      PP3rdPartyGateway: 121.127.5.50 #Same as Prod
      PP3rdPartySubnetCIDR: 192.168.222.0/24
      PP3rdPartyResource: 192.168.222.101/32
      StrongSwanENIPrivIPAZ1: 10.2.0.53 #registered with BSP
      StrongSwanPublicSubnetAZ1: 10.2.0.32/27
      StrongSwanPrivateSubnetAZ1: 10.2.0.0/27
      StrongSwanENIPrivIPAZ2: 10.2.0.176 #registered with BSP
      StrongSwanPublicSubnetAZ2: 10.2.0.160/27
      StrongSwanPrivateSubnetAZ2: 10.2.0.128/27

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasKeyName: !Not [!Equals [!Ref InstanceKeyName, '']]
  HasLoadBalancerHostName: !Not [!Equals [!Ref BSPInterfaceHostname, '']]
  IsStrongswanActive: !Equals [!Ref StrongswanActive, true]
  IsStrongswanAlarmActive: !And [Condition: IsStrongswanActive, Condition: IsProd]
  IsBSPProd: !And [Condition: IsStrongswanActive, !Equals [!Ref BSPMode, Production]]
  IsBSPUAT: !And [Condition: IsStrongswanActive, !Equals [!Ref BSPMode, UAT]]

Resources:

###
# BSP DNS Resolver
###

  BSPDNSResolverSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsProd
    Properties:
      GroupDescription: BSP DNS Resolver Security Group
      VpcId: 
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'
      SecurityGroupEgress:
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0 #Need to clamp down on this
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0 #Need to clamp down on this

  BSPDNSResolver:
    Type: AWS::Route53Resolver::ResolverEndpoint
    Condition: IsProd
    Properties:
      Direction: Outbound
      IpAddresses:
        - SubnetId:
            Fn::ImportValue:
              !Sub '${NetworkStackName}-PrivateSubnetId1'
        - SubnetId:
            Fn::ImportValue:
              !Sub '${NetworkStackName}-PrivateSubnetId2'
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], BSP, DNS, Resolver]]
      SecurityGroupIds:
        - !Ref BSPDNSResolverSecurityGroup

  BSPDomainResolverRule:
    Type: AWS::Route53Resolver::ResolverRule
    Condition: IsProd
    Properties: 
      DomainName: bsp.gov.ph
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], BSP, Domain, Rule]]
      ResolverEndpointId: !Ref BSPDNSResolver
      RuleType: FORWARD 
      TargetIps:
        - Ip: !FindInMap [BSPConfig, !Ref BSPMode, PPPDNSServer1]
          Port: 53
        - Ip: !FindInMap [BSPConfig, !Ref BSPMode, PPPDNSServer2]
          Port: 53

  BSPDomainVPCAssociation:
    Type: AWS::Route53Resolver::ResolverRuleAssociation
    Condition: IsProd
    Properties: 
      ResolverRuleId: !Ref BSPDomainResolverRule
      VPCId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'

  BSPDNSResolverLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsProd
    Properties:
      LogGroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], BSP, Resolver]]

  BSPDNSResolverLog:
    Type: AWS::Route53Resolver::ResolverQueryLoggingConfig
    Condition: IsProd
    Properties:
      DestinationArn: !GetAtt BSPDNSResolverLogGroup.Arn
  
  BSPDNSResolverLogAssociation:
    Type: AWS::Route53Resolver::ResolverQueryLoggingConfigAssociation
    Condition: IsProd
    Properties: 
      ResolverQueryLogConfigId: !Ref BSPDNSResolverLog
      ResourceId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'
  
  ###
  # Custom Network resources for BSP
  ###
  
  StrongSwanSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: StrongSwan Public Security Group
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'

  AllowICMPIntoStrongSwan:
    Condition: IsStrongswanActive
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      IpProtocol: icmp
      GroupId: !Ref StrongSwanSecurityGroup
      FromPort: -1
      ToPort: -1
      CidrIp:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcCidrBlock'

  AllowHTTPSIntoStrongSwan:
    Condition: IsStrongswanActive
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      IpProtocol: tcp
      GroupId: !Ref StrongSwanSecurityGroup
      FromPort: 443
      ToPort: 443
      CidrIp:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcCidrBlock'

  AllowDNSIntoStrongSwan:
    Condition: IsStrongswanActive
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      IpProtocol: udp
      GroupId: !Ref StrongSwanSecurityGroup
      FromPort: 53
      ToPort: 53
      CidrIp:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcCidrBlock'

  StrongSwanAZ1ENI:
    Type: AWS::EC2::NetworkInterface
    Properties:
      Description: !Join
        - ' '
        - - Gateway Main ENI
          - !Select
            - 0
            - Fn::GetAZs: !Ref 'AWS::Region'
      GroupSet:
        - !Ref StrongSwanSecurityGroup
      PrivateIpAddress: !FindInMap [BSPConfig, !Ref BSPMode, StrongSwanENIPrivIPAZ1] #Registered with BSP
      SourceDestCheck: false
      SubnetId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PublicSubnetId1'
      Tags:
        - Key: Name
          Value: StrongSwan public ENI

  StrongSwanAZ2ENI:
    Type: AWS::EC2::NetworkInterface
    Properties:
      Description: !Join
        - ' '
        - - BSP Access ENI
          - !Select
            - 1
            - Fn::GetAZs: !Ref 'AWS::Region'
      GroupSet:
        - !Ref StrongSwanSecurityGroup
      PrivateIpAddress: !FindInMap [BSPConfig, !Ref BSPMode, StrongSwanENIPrivIPAZ2] #Registered with BSP
      SourceDestCheck: false
      SubnetId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PublicSubnetId2'
      Tags:
        - Key: Name
          Value: StrongSwan public ENI

  BSPVPNGatewayEIP1: # - Hardcoded for BSP
    DeletionPolicy: Retain #Make sure to retain always
    Type: AWS::EC2::EIP
    Properties:
      Tags:
        - Key: Name
          Value: !Join [' ', [!Ref Name, !Ref EnvName, BSP registered IP - AZ1]]

  BSPVPNGatewayEIP2: # - Hardcoded for BSP
    DeletionPolicy: Retain #Make sure to retain always
    Type: AWS::EC2::EIP
    Properties:
      Tags:
        - Key: Name
          Value: !Join [' ', [!Ref Name, !Ref EnvName, BSP registered IP - AZ2]]

  ##
  # BSP target resources
  ##

  BSP3rdPartyRouteAZ1:
    Type: AWS::EC2::Route
    Condition: IsStrongswanActive
    Properties:
      RouteTableId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PrivateRouteTable1'
      DestinationCidrBlock: !FindInMap [BSPConfig, !Ref BSPMode, PP3rdPartyResource]
      NetworkInterfaceId: !Ref StrongSwanAZ1ENI

  BSP3rdPartyRouteAZ2:
    Type: AWS::EC2::Route
    Condition: IsStrongswanActive
    Properties:
      RouteTableId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PrivateRouteTable2'
      DestinationCidrBlock: !FindInMap [BSPConfig, !Ref BSPMode, PP3rdPartyResource]
      NetworkInterfaceId: !Ref StrongSwanAZ2ENI

  PPPResource1AZ1Route:
    Type: AWS::EC2::Route
    Condition: IsStrongswanActive
    Properties:
      RouteTableId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PrivateRouteTable1'
      DestinationCidrBlock: !Join ['', [!FindInMap [BSPConfig, !Ref BSPMode, PPPResource1], '/32']]
      NetworkInterfaceId: !Ref StrongSwanAZ1ENI

  PPPResource1AZ2Route:
    Type: AWS::EC2::Route
    Condition: IsStrongswanActive
    Properties:
      RouteTableId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PrivateRouteTable2'
      DestinationCidrBlock: !Join ['', [!FindInMap [BSPConfig, !Ref BSPMode, PPPResource1], '/32']]
      NetworkInterfaceId: !Ref StrongSwanAZ2ENI

  PPPResource2AZ1Route:
    Type: AWS::EC2::Route
    Condition: IsBSPProd #No IP2 except in prod
    Properties:
      RouteTableId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PrivateRouteTable1'
      DestinationCidrBlock: !Join ['', [!FindInMap [BSPConfig, !Ref BSPMode, PPPResource2], '/32']]
      NetworkInterfaceId: !Ref StrongSwanAZ1ENI

  PPPResource2AZ2Route:
    Type: AWS::EC2::Route
    Condition: IsBSPProd #No IP2 except in prod
    Properties:
      RouteTableId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PrivateRouteTable2'
      DestinationCidrBlock: !Join ['', [!FindInMap [BSPConfig, !Ref BSPMode, PPPResource2], '/32']]
      NetworkInterfaceId: !Ref StrongSwanAZ2ENI

  PPPResource3AZ1Route:
    Type: AWS::EC2::Route
    Condition: IsBSPProd #No IP3 except in prod
    Properties:
      RouteTableId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PrivateRouteTable1'
      DestinationCidrBlock: !Join ['', [!FindInMap [BSPConfig, !Ref BSPMode, PPPResource3], '/32']]
      NetworkInterfaceId: !Ref StrongSwanAZ1ENI

  PPPResource3AZ2Route:
    Type: AWS::EC2::Route
    Condition: IsBSPProd #No IP3 except in prod
    Properties:
      RouteTableId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PrivateRouteTable2'
      DestinationCidrBlock: !Join ['', [!FindInMap [BSPConfig, !Ref BSPMode, PPPResource3], '/32']]
      NetworkInterfaceId: !Ref StrongSwanAZ2ENI

  PPPResource4AZ1Route:
    Type: AWS::EC2::Route
    Condition: IsBSPProd #No IP4 except in prod
    Properties:
      RouteTableId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PrivateRouteTable1'
      DestinationCidrBlock: !Join ['', [!FindInMap [BSPConfig, !Ref BSPMode, PPPResource4], '/32']]
      NetworkInterfaceId: !Ref StrongSwanAZ1ENI

  PPPResource4AZ2Route:
    Type: AWS::EC2::Route
    Condition: IsBSPProd #No IP4 except in prod
    Properties:
      RouteTableId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PrivateRouteTable2'
      DestinationCidrBlock: !Join ['', [!FindInMap [BSPConfig, !Ref BSPMode, PPPResource4], '/32']]
      NetworkInterfaceId: !Ref StrongSwanAZ2ENI

  PPPResource5AZ1Route:
