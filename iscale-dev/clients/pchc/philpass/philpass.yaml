Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  # IsDR is provided by the conditions.yaml include above — do not redefine it here.
  IsProdOrProductionDR: !Or
    - Condition: IsProd
    - !Equals [!Ref EnvName, ProductionDR]
  IsDeployPaidResources: !Equals [!Ref DeployPaidResources, 'true']
  IsEnableCrossRegionBackupReplication: !Equals [!Ref EnableCrossRegionBackupReplication, 'true']
  IsDRAndEnableCrossRegionBackupReplication: !And
    - Condition: IsDR
    - Condition: IsEnableCrossRegionBackupReplication
  # DR environments evaluate as non-prod, so the scheduler must also be gated on NotDR —
  # otherwise it would stop resources during a failover.
  IsNotProdAndDeployPaidResourcesAndNotDR: !And
    - Condition: IsNotProd
    - Condition: IsDeployPaidResources
    - !Not [Condition: IsDR]
  IsPITRMode: !Equals [!Ref IsPITRMode, 'true']
  # DBStack and its dependents are suppressed when PITR mode is active — DB was restored externally.
  IsDeployPaidResourcesAndNotPITR: !And
    - Condition: IsDeployPaidResources
    - !Not [Condition: IsPITRMode]
  IsBackupEncryptionKeyProvided: !Not [!Equals [!Ref BackupVaultEncryptionKeyArn, '']]
  IsProdOrTest: !Or
    - Condition: IsProd
    - Condition: IsTest
  # BackupStack is deliberately NOT deployed in DR: backup.yaml would create a vault with the
  # same name as DRBackupVault, failing the stack update at failover. Consequence: the DR
  # environment runs without a backup plan until failback.
  IsProdOrTestAndDeployPaidResourcesAndNotPITR: !And
    - Condition: IsProdOrTest
    - Condition: IsDeployPaidResourcesAndNotPITR

Resources:

###
# BSP DNS Resolver
###

  BSPDNSResolverSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsProdOrProductionDR
    Properties:
      GroupDescription: BSP DNS Resolver Security Group
      VpcId: 
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'
      SecurityGroupEgress:
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0 #Need to clamp down on this
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0 #Need to clamp down on this

  BSPDNSResolver:
    Type: AWS::Route53Resolver::ResolverEndpoint
    Condition: IsProdOrProductionDR
    Properties:
      Direction: OUTBOUND
      IpAddresses:
        - SubnetId:
            Fn::ImportValue:
              !Sub '${NetworkStackName}-PrivateSubnetId1'
        - SubnetId:
            Fn::ImportValue:
              !Sub '${NetworkStackName}-PrivateSubnetId2'
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], BSP, DNS, Resolver]]
      SecurityGroupIds:
        - !Ref BSPDNSResolverSecurityGroup

  BSPDomainResolverRule:
    Type: AWS::Route53Resolver::ResolverRule
    Condition: IsProdOrProductionDR
    Properties: 
      DomainName: bsp.gov.ph
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], BSP, Domain, Rule]]
      ResolverEndpointId: !Ref BSPDNSResolver
      RuleType: FORWARD 
      TargetIps:
        - Ip: !FindInMap [BSPConfig, !Ref BSPMode, PPPDNSServer1]
          Port: 53
        - Ip: !FindInMap [BSPConfig, !Ref BSPMode, PPPDNSServer2]
          Port: 53

  BSPDomainVPCAssociation:
    Type: AWS::Route53Resolver::ResolverRuleAssociation
    Condition: IsProdOrProductionDR
    Properties: 
      ResolverRuleId: !Ref BSPDomainResolverRule
      VPCId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'

  BSPDNSResolverLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsProdOrProductionDR
    Properties:
      LogGroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], BSP, Resolver]]

  BSPDNSResolverLog:
    Type: AWS::Route53Resolver::ResolverQueryLoggingConfig
    Condition: IsProdOrProductionDR
    Properties:
      DestinationArn: !GetAtt BSPDNSResolverLogGroup.Arn
  
  BSPDNSResolverLogAssociation:
    Type: AWS::Route53Resolver::ResolverQueryLoggingConfigAssociation
    Condition: IsProdOrProductionDR
    Properties: 
      ResolverQueryLogConfigId: !Ref BSPDNSResolverLog
      ResourceId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'
  
  ###
  # PhilPass Application Resources
  ###

  ELBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/loadbalancer.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        CertificateArn: !Ref LoadBalancerCertificateArn
        DeletionProtection: !If [IsProd, !Ref DeletionProtection, false]
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName
        SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
        DeployPaidResources: !Ref DeployPaidResources

  DeployStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/deployment.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName
        # Live region replicates CodeDeploy artifacts into the DR bucket so the DR app servers
        # have code to deploy at failover. Suppressed on the DR stack itself (it is the destination).
        ReplicationDestinationBucketArn: !If [IsDR, '', !Ref AppCRRBucketArn]

  DBStack:
    # Set DeployPaidResources=false (DR standby) to suppress. At failover, set back to true and
    # provide SnapshotIdentifier to restore the DB from the cross-region backup.
    # Also suppressed when IsPITRMode=true — the DB was restored externally by dr-failover-v2.
    Condition: IsDeployPaidResourcesAndNotPITR
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/database.yaml
      Parameters:
        Name: !Ref Name
        DatabaseName: !Join ['',[!Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], db]]
        AllocatedStorage: 100
        BackupRetentionPeriod: !If [IsProd, 30, 7]
        DeletionProtection: !If [IsProd, !Ref DeletionProtection, false]
        EnableEnhancedMonitoring: !If [IsProd, true, false]
        EnablePerformanceInsights: false
        EnvName: !Ref EnvName
        Engine: mysql
        EngineVersion: 8.4.7
        Family: mysql8.4
        InstanceType: db.t4g.micro
        MasterUser: root
        MultiAz: !If [IsProd, true, false]
        NetworkStackName: !Ref NetworkStackName
        OrgName: !Ref OrgName
        SNSStackName: !Ref SNSStackName
        StorageEncrypted: true
        SnapshotIdentifier: !Ref SnapshotIdentifier
        MasterUserPassword: !Ref DBMasterUserPassword
        ExistingSecretArn: !If [IsDR, !Ref DRDBSecret, '']

  DBSchedulerStack:
    DependsOn:
      - DBStack
    Condition: IsNotProdAndDeployPaidResourcesAndNotDR
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: FALSE
        DatabaseInstanceName:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBInstanceName

####
# Disaster Recovery
# All resources below are deployed ONLY when EnvName is a DR variant (ProductionDR, StagingDR, etc.).
# These resources are always-on in the DR region at zero/minimal cost.
# They pre-provision the infrastructure needed to activate the environment at failover time.
####

  # Placeholder Secrets Manager secret for DB credentials in the DR region.
  # Created at DR stack deploy time with placeholder values.
  # The secrets-sync Lambda overwrites the values whenever the live region secret rotates,
  # ensuring correct credentials are available before failover is triggered.
  # At failover, database.yaml receives this ARN as ExistingSecretArn and skips creating a
  # new secret — preventing a name conflict and ensuring the app servers get the correct credentials.
  DRDBSecret:
    Condition: IsDR
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Description: !Sub 'DR placeholder secret for ${OrgName} ${Name} — values synced from the live region secret by the secrets-sync Lambda before failover.'
      SecretString: !Sub |
        {
          "DB_ROOT_USER": "root",
          "DB_ROOT_PASSWORD": "PLACEHOLDER_SYNC_FROM_LIVE",
          "DB_NAME": "${Name}db",
          "DB_USER": "${Name}",
          "DB_PASSWORD": "PLACEHOLDER_SYNC_FROM_LIVE",
          "MAGENTO_ADMIN_PASSWORD": "PLACEHOLDER_SYNC_FROM_LIVE"
        }
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName
        - Key: DRSync
          Value: 'true'
        - Key: SourceSecretArn
          Value: !Ref LiveSecretArn

  # Pre-deployed DB subnet group for PITR restore in DR standby.
  # Uses -standby suffix to avoid naming conflict with DBStack's own subnet group at failover.
  DBStandbySubnetGroup:
    Condition: IsDR
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db, standby]]
      DBSubnetGroupName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db, standby]]
      SubnetIds:
        - Fn::ImportValue: !Sub '${NetworkStackName}-InternalSubnetId1'
        - Fn::ImportValue: !Sub '${NetworkStackName}-InternalSubnetId2'
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db, standby]]

  # Pre-deployed DB security group for PITR restore in DR standby.
  # App server stacks can add ingress rules to this SG at restore time.
  DBStandbySecurityGroup:
    Condition: IsDR
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db, standby]]
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db, standby]]

  # Always-on vault in the DR region — exists independently of DeployPaidResources so the live region's
  # CopyActions have a destination even during cold standby. Excluded from BackupStack to avoid naming
  # conflicts at failover. EncryptionKeyArn must be the REPLICA of the multi-region CMK in this region
  # so cross-region copies are immediately decryptable at DR restore time.
  DRBackupVault:
    Condition: IsDR
    Type: AWS::Backup::BackupVault
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BackupVaultName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, vault]]
      EncryptionKeyArn: !If [IsBackupEncryptionKeyProvided, !Ref BackupVaultEncryptionKeyArn, !Ref 'AWS::NoValue']
      BackupVaultTags:
        Name: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, vault]]
        Environment: !Ref EnvName
        Organization: !Ref OrgName

  # Pre-deployed EFS security group for the DR region.
  # Allows NFS (2049) inbound from app server SGs — appserver-basic2.yaml adds the ingress rules
  # automatically when UseExternalEFS=true (ExternalEFSId is non-empty).
  # Also used as the mount target SG when dr-failover creates mount targets for the restored EFS.
  EFSStandbySecurityGroup:
    Condition: IsDR
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, efs, standby]]
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, efs, standby]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

  # Cross-region automated backup replication — provides ~5 min RPO via PITR without a running replica.
  # Enable by setting EnableCrossRegionBackupReplication=true and providing SourceDbInstanceArn.
  # Only deployed in DR environments (IsDR condition) with replication explicitly enabled.
  DBReplicationStack:
    Condition: IsDRAndEnableCrossRegionBackupReplication
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/db-replication.yaml
      Parameters:
        Name: !Ref Name
        OrgName: !Ref OrgName
        EnvName: !Ref EnvName
        SourceDbInstanceArn: !Ref SourceDbInstanceArn
        BackupRetentionPeriod: !Ref BackupReplicationRetentionPeriod

  AllowDBConnectionFromJumpHost:
    Condition: IsDeployPaidResources
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      IpProtocol: TCP
      GroupId: !If
        - IsPITRMode
        - !GetAtt DBStandbySecurityGroup.GroupId
        - Fn::GetAtt: [DBStack, Outputs.SecurityGroupId]
      FromPort: !If
        - IsPITRMode
        - 3306
        - Fn::GetAtt: [DBStack, Outputs.DBInstancePort]
      ToPort: !If
        - IsPITRMode
        - 3306
        - Fn::GetAtt: [DBStack, Outputs.DBInstancePort]
      SourceSecurityGroupId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-JumpHostSecurityGroupId'

  # CacheStack:
  #   Type: AWS::CloudFormation::Stack
  #   Properties:
  #     TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/elasticache.yaml
  #     Parameters:
  #       Name: !Ref Name
  #       EnvName: !Ref EnvName
  #       NetworkStackName: !Ref NetworkStackName
  #       EncryptInTransit: TRUE
  #       NodeType: cache.t3.micro
  #       NumCacheClusters: 1
  #       OrgName: !Ref OrgName
  #       SnapshotRetentionLimit: !If [IsProd, 30, !Ref 'AWS::NoValue']
  #       SNSStackName: !Ref SNSStackName
  #       UseFriendlyNames: TRUE

  ServerStack:
    # DBStack removed from DependsOn — it is conditional now, and DependsOn on a
    # suppressed resource fails the stack in DR standby.
    DependsOn:
      - DeployStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/appserver-basic2.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        # CacheEndpoint:
        #   Fn::GetAtt:
        #     - CacheStack
        #     - Outputs.CachePrimaryEndpoint
        # CachePort:
        #   Fn::GetAtt:
        #     - CacheStack
        #     - Outputs.ClusterPort
        # CacheSecurityGroupId:
        #   Fn::GetAtt:
        #     - CacheStack
        #     - Outputs.SecurityGroupId
        ASGDesiredSize: !If [IsDR, 0, 1]
        ClientDomainName: !Ref ClientDomainName
        DatabaseEndpoint: !If
          - IsDeployPaidResources
          - !If [IsPITRMode, !Ref PITRDBEndpoint, Fn::GetAtt: [DBStack, Outputs.DBInstanceAddress]]
          - ''
        DatabasePort: !If
          - IsDeployPaidResources
          - !If [IsPITRMode, '3306', Fn::GetAtt: [DBStack, Outputs.DBInstancePort]]
          - 3306
        DatabaseSecurityGroupId: !If
          - IsDeployPaidResources
          - !If [IsPITRMode, !GetAtt DBStandbySecurityGroup.GroupId, Fn::GetAtt: [DBStack, Outputs.SecurityGroupId]]
          - ''
        ExternalEFSID: !If [IsDR, !Ref ExternalEFSId, '']
        ExternalEFSSecurityGroup: !If [IsDR, !GetAtt EFSStandbySecurityGroup.GroupId, '']
        InstanceAMI: !Ref InstanceAmi
        # InstanceAMI: ami-01e07f712a046fa8a 
        #InstanceKeyName: !If [HasKeyName, !Ref InstanceKeyName, !Ref 'AWS::NoValue']
        InstancePort: 80
        InstanceSubnet: Private
        InstanceType: !Ref InstanceType
        # LoadBalancerHostName: !If [HasLoadBalancerHostName, !Ref BSPInterfaceHostname, !Ref 'AWS::NoValue']
        # LoadBalancerHostName: !If [HasLoadBalancerHostName, !Ref LoadBalancerHostName, !Ref 'AWS::NoValue']
        LoadBalancerHostName: !If [IsDR, !Ref 'AWS::NoValue', philpass2] # uat for the mean time
        LoadBalancerPriority: 50
        LoadBalancerStackName: !If
          - IsDeployPaidResources
          - !Select [ 1, !Split [ '/', !Ref ELBStack]]
          - ''
        NetworkStackName: !Ref NetworkStackName
        SharedSecretId: !If
          - IsDeployPaidResources
          - !If [IsPITRMode, !Ref DRDBSecret, Fn::GetAtt: [DBStack, Outputs.DBSecretManagerKeyId]]
          - ''
        SNSStackName: !Ref SNSStackName
        UseFriendlyNames: FALSE
        LaunchTemplate: True
        VolumeType: gp3
        VolumeSize: 16 # GB, size must be equal or greater than the size of the AMI root volume, which is 16GB

  BackupStack:
    Condition: IsProdOrTestAndDeployPaidResourcesAndNotPITR
    DependsOn:
      - DBStack
      - ServerStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/backup.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        BackupARNList: !Join
          - ','
          - - Fn::GetAtt:
              - DBStack
              - Outputs.DBInstanceARN
            - Fn::GetAtt:
              - ServerStack
              - Outputs.AppServerEFSArn
            # - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref StrongSwanInstanceAZ1]]]]  
            # - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref StrongSwanInstanceAZ2]]]]  
            # - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref BSPInterfaceInstance]]]]  
        BackupTime: !If [IsProd, !Ref 'AWS::NoValue', 1] #Default backup time else 1AM UTC for dev
        DailyExpiration: 60 #60 days requirement
        WeeklyExpiration: 180 #6 months but requirement is 4 weeks
        MonthlyExpiration: 3650 # 10 years
        # Hourly incremental plan targets EFS only — RDS does not support AWS Backup incremental.
        # Each hourly recovery point contains the complete EFS state (AWS Backup resolves the
        # incremental chain internally); restoring from the latest hourly always gives full data.
        EnableHourlyBackup: !If [IsProdOrTest, 'true', 'false']
        HourlyBackupARNList:
          Fn::GetAtt: [ServerStack, Outputs.AppServerEFSArn]
        # Copy recovery points into the DR region vault so they are restorable at failover.
        # The destination vault is DRBackupVault, created by the DR stack in DRRegion.
        EnableCrossRegionBackup: 'true'
        CrossRegionBackupVaultArn: !Sub
          - 'arn:aws:backup:${DRRegion}:${AWS::AccountId}:backup-vault:${OrgName}-${DREnvShort}-${DRRegionShort}-${Name}-vault'
          - DREnvShort: !FindInMap [EnvDRShort, !Ref EnvName, Name]
            DRRegionShort: !FindInMap [RegionShort, !Ref DRRegion, Name]
        # KMS CMK for the source vault — must match the key used for DRBackupVault so cross-region
        # copies are immediately decryptable in the DR region without key re-import.
        EncryptionKeyArn: !Ref BackupVaultEncryptionKeyArn
        # Retain hourly EFS copies in DR — within this window restore to any hour (Option B).
        # Beyond it, fall back to the daily baseline copies.
        HourlyDRRetentionDays: !Ref HourlyEFSDRRetentionDays

Outputs:

  DRDBSecretArn:
    Condition: IsDR
    Description: ARN of the DR Secrets Manager secret — set this in the secrets-sync Lambda so it keeps values current from the live region
    Value: !Ref DRDBSecret
    Export:
      Name: !Sub '${AWS::StackName}-DRDBSecretArn'

  DBStandbySubnetGroup:
    Condition: IsDR
    Description: Pre-deployed DB subnet group for PITR restore — use in restore-db-instance-from-db-snapshot command
    Value: !Ref DBStandbySubnetGroup
    Export:
      Name: !Sub '${AWS::StackName}-DBStandbySubnetGroup'

  DBStandbySecurityGroupId:
    Condition: IsDR
    Description: Pre-deployed DB security group for PITR restore — use in restore-db-instance-from-db-snapshot command
    Value: !GetAtt DBStandbySecurityGroup.GroupId
    Export:
      Name: !Sub '${AWS::StackName}-DBStandbySecurityGroupId'

  EFSStandbySecurityGroupId:
    Condition: IsDR
    Description: Pre-deployed EFS security group — pass as efs_security_group_id in the dr-failover state machine input
    Value: !GetAtt EFSStandbySecurityGroup.GroupId
    Export:
      Name: !Sub '${AWS::StackName}-EFSStandbySecurityGroupId'

  CodeDeployBucketArn:
    Condition: IsDR
    Description: ARN of the CodeDeploy artifacts bucket — use as AppCRRBucketArn in the live stack when setting up CRR
    Value: !GetAtt DeployStack.Outputs.DeploymentBucketArn
