###
# BSP Interface
###

  BSPInterfaceEC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM
      Policies:
        - PolicyName: EC2ReadTagPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeTags
                  - ec2:DescribeInstances
                Resource: '*'

  BSPInterfaceIamInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      #InstanceProfileName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name,BSP,Interface]]
      Roles:
        - !Ref BSPInterfaceEC2Role

  BSPInterfaceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: BSP Interface Security Group
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'

  AllowHTTPOnBSPInterfaceFromELB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      IpProtocol: TCP
      GroupId: !Ref BSPInterfaceSecurityGroup
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: 
        Fn::GetAtt:
          - ELBStack
          - Outputs.SecurityGroupId

  # AllowSSHOnBSPInterfaceFromJumpHost:
  #   Type: AWS::EC2::SecurityGroupIngress
  #   Properties: 
  #     IpProtocol: TCP
  #     GroupId: !Ref BSPInterfaceSecurityGroup
  #     FromPort: 22
  #     ToPort: 22
  #     SourceSecurityGroupId: 
  #       Fn::ImportValue:
  #         !Sub '${NetworkStackName}-JumpHostSecurityGroupId'
  
  BSPInterfaceInstance:
    Type: AWS::EC2::Instance
    Properties:
      DisableApiTermination: !If [IsProd, !Ref DeletionProtection, false]
      ImageId: !Ref BSPInterfaceAMI
      InstanceType: t3.medium
      IamInstanceProfile: !Ref BSPInterfaceIamInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeviceIndex: 0
          GroupSet:
            - !Ref BSPInterfaceSecurityGroup
          SubnetId:
            Fn::ImportValue:
              Fn::Sub: '${NetworkStackName}-PrivateSubnetId1'
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name,BSP,Interface]]

  AllowBSPinterfaceIntoDB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from BSP Interface
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - DBStack
          - Outputs.SecurityGroupId
      FromPort:
        Fn::GetAtt:
          - DBStack
          - Outputs.DBInstancePort
      ToPort:
        Fn::GetAtt:
          - DBStack
          - Outputs.DBInstancePort
      SourceSecurityGroupId: !Ref BSPInterfaceSecurityGroup

  # AllowBSPinterfaceIntoCache:
  #   Type: AWS::EC2::SecurityGroupIngress
  #   Properties:
  #     Description: Allow connection from BSP Interface
  #     IpProtocol: TCP
  #     GroupId:
  #       Fn::GetAtt:
  #         - CacheStack
  #         - Outputs.SecurityGroupId
  #     FromPort:
  #       Fn::GetAtt:
  #         - CacheStack
  #         - Outputs.ClusterPort
  #     ToPort:
  #       Fn::GetAtt:
  #         - CacheStack
  #         - Outputs.ClusterPort
  #     SourceSecurityGroupId: !Ref BSPInterfaceSecurityGroup

  BSPInterfaceTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Matcher: 
        HttpCode: 200,301,302
      Port: 80
      Protocol: HTTP
      TargetType: instance
      Targets:
        - Id: !Ref BSPInterfaceInstance
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, BSP,interface,target,group]]

  BSPInterfaceListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties: 
      Actions: 
        - Type: forward
          TargetGroupArn: !Ref BSPInterfaceTargetGroup
      Conditions: 
        - Field: host-header
          Values: 
            - !Join ['.', [!Ref BSPInterfaceHostname, !Ref ClientDomainName]]
      ListenerArn:
        Fn::GetAtt:
          - ELBStack
          - Outputs.ApplicationListenerArn
      Priority: 105

  BSPInterfaceInstancePublicDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: !Join ['.', [!Ref ClientDomainName, '']]
      Name: !Join ['.', [!Ref BSPInterfaceHostname, !Ref ClientDomainName]]
      Type: A
      AliasTarget:
        DNSName:
          Fn::GetAtt:
            - ELBStack
            - Outputs.DNSName
        EvaluateTargetHealth: true
        HostedZoneId:
          Fn::GetAtt:
            - ELBStack
            - Outputs.CanonicalHostedZoneID

  HighCPUBSPInterfaceAlarm:
    Condition: IsProd
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, BSP, interface, high, cpu]]
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: InstanceId
          Value: !Ref BSPInterfaceInstance

  BackupStack:
    Condition: IsProd
    DependsOn:
      - DBStack
      # - ServerStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/backup.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        BackupARNList: !Join
          - ','
          - - Fn::GetAtt:
              - DBStack
              - Outputs.DBInstanceARN
            # - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref StrongSwanInstanceAZ1]]]]  
            # - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref StrongSwanInstanceAZ2]]]]  
            - !Join [':', ['arn', !Ref 'AWS::Partition', 'ec2', !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', ['instance', !Ref BSPInterfaceInstance]]]]  
        BackupTime: !If [IsProd, !Ref 'AWS::NoValue', 1] #Default backup time else 1AM UTC for dev
        DailyExpiration: 60 #60 days requirement
        WeeklyExpiration: 180 #6 months but requirement is 4 weeks
        MonthlyExpiration: 3650 # 10 years

###
# Connectivity Analyser
###

  StrongSwanAZ1CanReachInternet:
    Type: AWS::EC2::NetworkInsightsPath
    Condition: IsStrongswanActive
    Properties:
      Source: !Ref StrongSwanInstanceAZ1
      Destination:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-InternetGateway'
      Protocol: tcp
      Tags:
        - Key: Name
          Value: StrongSwan AZ1 to Internet

  StrongSwanAZ2CanReachInternet:
    Type: AWS::EC2::NetworkInsightsPath
    Condition: IsStrongswanActive
    Properties:
      Source: !Ref StrongSwanInstanceAZ2
      Destination:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-InternetGateway'
      Protocol: tcp
      Tags:
        - Key: Name
          Value: StrongSwan AZ2 to Internet

  BSPInterfaceCanReachInternet:
    Type: AWS::EC2::NetworkInsightsPath
    Condition: IsStrongswanActive
    Properties:
      Source: !Ref BSPInterfaceInstance
      Destination:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-InternetGateway'
      Protocol: tcp
      Tags:
        - Key: Name
          Value: BSP Interface to Internet

  BSPInterfaceCanReachStrongSwanAZ1:
    Type: AWS::EC2::NetworkInsightsPath
    Condition: IsStrongswanActive
    Properties:
      Source: !Ref BSPInterfaceInstance
      Destination: !Ref StrongSwanAZ1ENI
      DestinationPort: 443
      Protocol: tcp
      Tags:
        - Key: Name
          Value: BSP Interface to StrongSwan AZ1

  BSPInterfaceCanReachStrongSwanAZ2:
    Type: AWS::EC2::NetworkInsightsPath
    Condition: IsStrongswanActive
    Properties:
      Source: !Ref BSPInterfaceInstance
      Destination: !Ref StrongSwanAZ1ENI
      DestinationPort: 443
      Protocol: tcp
      Tags:
        - Key: Name
          Value: BSP Interface to StrongSwan AZ2


