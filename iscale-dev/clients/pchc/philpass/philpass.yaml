  BSPPhilPassPlusRouteDNS2AZ2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PrivateRouteTable2'
      DestinationCidrBlock: !Join ['', [!FindInMap [BSPConfig, !Ref BSPMode, PPPDNSServer2], '/32']]
      NetworkInterfaceId: !Ref StrongSwanAZ2ENI

  ##
  # StrongSwan EC2 instances
  ##
  StrongSwanLaunchConfig:
    Type: AWS::AutoScaling::LaunchConfiguration
    Metadata:
      AWS::CloudFormation::Init:
        configSets:
          AZ1ConfigProd:
            - NetworkFiles
            - PSK
            - AZ1ConfigProd
            - StartStrongSwan
          AZ2ConfigProd:
            - NetworkFiles
            - PSK
            - AZ2ConfigProd
            - StartStrongSwan
          AZ1ConfigUAT:
            - NetworkFiles
            - PSK
            - AZ1ConfigUAT
            - StartStrongSwan
          AZ2ConfigUAT:
            - NetworkFiles
            - PSK
            - AZ2ConfigUAT
            - StartStrongSwan

        StartStrongSwan:
          commands:
            01_restart_strongswan:
              command: '/usr/sbin/strongswan restart'
              ignoreErrors: true
            02_create_nat_tables:
              command: '/sbin/iptables-restore < /etc/iptables.rules'

        NetworkFiles:
          commands:
            ip_forward:
              command: 'echo 1 > /proc/sys/net/ipv4/ip_forward'
            send_redirects:
              command: 'echo 0 > /proc/sys/net/ipv4/conf/eth0/send_redirects'
          files:
            /etc/sysctl.d/nat.conf:
              content: |
                net.ipv4.ip_forward = 1
                net.ipv4.conf.eth0.send_redirects = 0

        PSK:
          files:
            /etc/strongswan/ipsec.secrets:
              content: !Sub
                - |
                  @pchc ${PPP_GATEWAY} : PSK "${PSK_PPP}"
                  @pchc ${PPP_DR_GATEWAY} : PSK "${PSK_PPP}"
                  @pchc ${3RD_GATEWAY} : PSK "${PSK_3RD}"
                - PSK_PPP: !Ref StrongswanPPPPSK
                  PSK_3RD: !Ref Strongswan3RDPSK
                  PPP_GATEWAY: !FindInMap [BSPConfig, !Ref BSPMode, PPPGateway]
                  PPP_DR_GATEWAY: !If
                    - IsBSPUAT
                    - !FindInMap [BSPConfig, UAT, PPPGateway]
                    - !FindInMap [BSPConfig, Production, PPPDRGateway]
                  3RD_GATEWAY: !FindInMap [BSPConfig, !Ref BSPMode, PP3rdPartyGateway]

        AZ1ConfigProd:
          files:
            /etc/iptables.rules:
              content: !Sub
                - |
                  *nat
                  :PREROUTING ACCEPT [18:1376]
                  :INPUT ACCEPT [15:1148]
                  :OUTPUT ACCEPT [222:17540]
                  :POSTROUTING ACCEPT [222:17540]
                  -A POSTROUTING -s ${PRIVATE_SUBNET_AZ1} -d ${3RD_SUBNET} -o eth0 -j MASQUERADE
                  -A POSTROUTING -s ${PRIVATE_SUBNET_AZ1} -d ${PPP_SUBNET} -o eth0 -j MASQUERADE
                  -A POSTROUTING -s ${PRIVATE_SUBNET_AZ1} -d ${PPP_DR_SUBNET} -o eth0 -j MASQUERADE
                  COMMIT
                - 3RD_SUBNET: !FindInMap [BSPConfig, Production, PP3rdPartySubnetCIDR]
                  PPP_SUBNET: !FindInMap [BSPConfig, Production, PPPSubnetCIDR]
                  PPP_DR_SUBNET: !FindInMap [BSPConfig, Production, PPPDRSubnetCIDR]
                  PRIVATE_SUBNET_AZ1: !FindInMap [BSPConfig, Production, StrongSwanPrivateSubnetAZ1]
              permissions: 0700
              owner: root
              group: root
            /etc/strongswan/ipsec.conf:
              content: !Sub
                - |
                  config setup
                    charondebug="net 1, ike 1, cfg 1, enc 1, knl 1"

                  conn bspPPPlus
                      authby=secret
                      auto=start
                      keyexchange=ikev1
                      type=tunnel
                      leftfirewall=yes
                      forceencaps=yes
                      leftid=pchc
                      left=${LEFT_IP} #Registered with BSP
                      leftsubnet=${LEFT_SUBNET}
                      right=${PPP_GATEWAY}
                      rightsubnet=${PPP_SUBNET}
                      ike=aes256-sha256-modp2048
                      ikelifetime=43200s
                      esp=aes128-sha256-modp2048

                  conn bspPPPlusDR
                      authby=secret
                      auto=start
                      keyexchange=ikev1
                      type=tunnel
                      leftfirewall=yes
                      leftid=pchc
                      left=${LEFT_IP} #Registered with BSP
                      leftsubnet=${LEFT_SUBNET}
                      right=${PPP_DR_GATEWAY}
                      rightsubnet=${PPP_DR_SUBNET}
                      ike=aes256-sha256-modp2048 #Internet key exchange, type of encryption
                      ikelifetime=43200s #Time before re authentication of keys
                      esp=aes128-sha256-modp2048 #Encapsulation security suite of protocols

                  conn bspPP3rd
                      authby=secret
                      auto=start
                      keyexchange=ikev1
                      type=tunnel
                      leftfirewall=yes
                      forceencaps=yes
                      leftid=pchc
                      left=${LEFT_IP} #Registered with BSP
