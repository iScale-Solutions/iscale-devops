        Fn::ImportValue:
          !Sub '${NetworkStackName}-PrivateRouteTable2'
      DestinationCidrBlock: !Join ['', [!FindInMap [BSPConfig, !Ref BSPMode, PPPResource6], '/32']]
      NetworkInterfaceId: !Ref StrongSwanAZ2ENI

  PPPDRResource1AZ1Route:
    Type: AWS::EC2::Route
    Condition: IsBSPProd #No DR resource except in prod
    Properties:
      RouteTableId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PrivateRouteTable1'
