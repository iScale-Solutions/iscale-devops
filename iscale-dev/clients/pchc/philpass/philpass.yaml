AWSTemplateFormatVersion: 2010-09-09
Description: PhilPass BSP Gateway Resources

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
      - Label:
          default: Load Balancer Configuration
        Parameters:
          - ClientDomainName
          - DeletionProtection
          - LoadBalancerCertificateArn
          - LoadBalancerHostName
      - Label:
          default: Instance Configuration
        Parameters:
          - InstanceAmi
          - InstanceType
      - Label:
          default: BSP Interface Configuration
        Parameters:
          - InstanceKeyName
      - Label:
          default: Scheduler Configuration
        Parameters:
          - StartScheduleExpression
          - StopScheduleExpression
      - Label:
          default: BSP Configuration
        Parameters:
          - BSPMode
      - Label:
          default: Disaster Recovery
        Parameters:
          - DeployPaidResources
          - SnapshotIdentifier
          - DBMasterUserPassword
          - EnableCrossRegionBackupReplication
          - AppCRRBucketArn
          - SourceDbInstanceArn
          - BackupReplicationRetentionPeriod
          - LiveSecretArn
          - DRRegion
          - IsPITRMode
          - PITRDBEndpoint
          - ExternalEFSId
          - BackupVaultEncryptionKeyArn
          - HourlyEFSDRRetentionDays

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      DeletionProtection:
        default: Protect core items against deletion
      InstanceKeyName:
        default: Instance Key Name
      InstanceType:
        default: App Server Instance Type
      # InstanceAmi:
      #   default: LibreSwan Instance AMI ID
      LoadBalancerCertificateArn:
        default: Load Balancer SSL Certificate ARN
      LoadBalancerHostName:
        default: Load Balancer Host Name
      InstanceAmi:
        default: Instance AMI ID
      NetworkStackName:
        default: Network Stack Name
      SNSStackName:
        default: SNS Topic Stack Name
      ClientDomainName:
        default: Domain Name
      StartScheduleExpression:
        default: Start Schedule CRON Expression
      StopScheduleExpression:
        default: Stop Schedule CRON Expression
      DeployPaidResources:
        default: Deploy Paid Resources (false = DR standby, true = active/failover)
      SnapshotIdentifier:
        default: DB Snapshot Identifier (DR failover restore — leave blank for normal)
      DBMasterUserPassword:
        default: DB Master Password (DR failover only — leave blank for normal)
      EnableCrossRegionBackupReplication:
        default: Enable Cross-Region Backup Replication (deploy in DR region to activate)
      AppCRRBucketArn:
        default: App CodeDeploy CRR Destination Bucket ARN (leave blank for DR stack — set on the live stack)
      SourceDbInstanceArn:
        default: Source DB Instance ARN (live region — required when replication is enabled)
      BackupReplicationRetentionPeriod:
        default: Backup Retention Period in DR region (days)
      LiveSecretArn:
        default: Live Region Secret ARN (DR standby only — required for secrets sync)
      DRRegion:
        default: DR AWS Region (backup copy destination)
      IsPITRMode:
        default: PITR Mode (set by dr-failover-v2 only — do not change manually)
      PITRDBEndpoint:
        default: PITR DB Endpoint (set by dr-failover-v2 only — do not change manually)
      ExternalEFSId:
        default: Restored EFS ID (written by dr-failover before stack update — DR only)
      BackupVaultEncryptionKeyArn:
        default: KMS CMK ARN for EFS backup vault encryption (multi-region key replica required in DR region)
      HourlyEFSDRRetentionDays:
        default: Days to retain hourly EFS backup copies in DR vault (must span full incremental chain)

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name)
    Type: String
    MinLength: 3
    MaxLength: 9
    Default: philpass
  OrgName:
    Description: The name of the organization
    Type: String
    Default: pchc
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
      - ProductionDR
      - StagingDR
      - DevelopmentDR
      - TestDR
  BSPMode:
    Description: BSP Resources to connect to
    Type: String
    Default: UAT
    AllowedValues:
      - Production
      - UAT
  ClientDomainName:
    Description: The client's domain name (e.g. example.com, iscale-software.com)
    Type: String
    AllowedPattern: ^[a-z0-9]+([\-\.]{1}[a-z0-9]+)*\.[a-z]{2,7}$
    Default: pchc.com.ph
    MinLength: 1
  DeletionProtection:
    Description: Set to true to enable (valid only in Production mode)
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  InstanceKeyName:
    Description: Instance Key Name
    Type: String
    Default: ''
  InstanceType:
    Description: Type of instance for app server
    Type: String
    Default: t3.medium
    AllowedValues:
      - t3.medium
      - t3.large
      - t3.xlarge
  InstanceAmi:
    Description: AMI ID of Philpass App
    Type: AWS::EC2::Image::Id
    Default: ami-0499b5b9a26be1426 # philpass base ami
  # InstanceAmi:
  #   Description: AMI ID for the VPN Server
  #   Type: AWS::EC2::Image::Id
  #   Default: ami-0499b5b9a26be1426 # Base AL2023
  LoadBalancerCertificateArn:
    Description: SSL Certificate for the ELB
    Type: String
    Default: arn:aws:cm:ap-southeast-1:470455329885:certificate/9f713d5d-cb7c-4e8e-acc2-46862d610ec8
  LoadBalancerHostName:
    Description: (Optional) Custom Hostname for load balancer URL
    Type: String
    Default: ''
    MaxLength: 12
  NetworkStackName:
    Description: The name of the network stack
    Type: String
    Default: pchc-dev-ase1-network
    MinLength: 1
  SNSStackName:
    Description: The name of the SNS stack
    Type: String
    Default: pchc-dev-ase1-sns
    MinLength: 1
  StartScheduleExpression:
    Description: Schedule expression when to start the objects
    Type: String
    Default: cron(0 0 ? * MON-FRI *)
  StopScheduleExpression:
    Description: Schedule expression when to stop the objects
    Type: String
    Default: cron(0 10 ? * MON-FRI *)
  DeployPaidResources:
    Description: |
      true (default): Deploy all paid resources — DB, LBs, and App Servers. Normal operation for all environments.
      false: DR standby mode — suppress all paid resources to minimize idle cost. Only CodeDeploy infra stays alive.
      DR failover: set back to true and provide SnapshotIdentifier to restore DB from the cross-region backup.
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  SnapshotIdentifier:
    Description: |
      (DR Failover only) ARN of the RDS snapshot to restore the database from.
      Obtain by copying the latest automated backup from the live region into the DR region before failover.
      Leave blank for normal fresh DB creation — existing deployments are unaffected.
    Type: String
    Default: ''
  DBMasterUserPassword:
    Description: |
      (DR Failover only) Master user password of the source database.
      Provide this during snapshot restore so the Secrets Manager secret stays in sync with the restored DB credentials.
      Leave blank for auto-generated password — existing deployments are unaffected.
    Type: String
    Default: ''
    NoEcho: true
  EnableCrossRegionBackupReplication:
    Description: |
      Set to true to enable cross-region automated backup replication for the DB.
      Deploy with this enabled in the DR region stack, pointing SourceDbInstanceArn to the live DB.
      Replicates daily snapshots + transaction logs — enables PITR with ~5 minute RPO in the DR region.
      Default false — existing deployments are completely unaffected.
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  AppCRRBucketArn:
    Description: |
      (Live region only) ARN of the DR CodeDeploy artifacts bucket for the app server.
      Obtain from the DeployStack output in the DR region (CodeDeployBucketArn).
      Leave blank for DR stack deployments — the IsDR condition suppresses CRR automatically.
    Type: String
    Default: ''
  SourceDbInstanceArn:
    Description: |
      ARN of the live region RDS DB instance to replicate from.
      Required when EnableCrossRegionBackupReplication=true.
      Format: arn:aws:rds:<live-region>:<account-id>:db:<db-identifier>
      Obtain from the live stack DBStack output: DBInstanceARN.
    Type: String
    Default: ''
  BackupReplicationRetentionPeriod:
    Description: Number of days to retain replicated backups in the DR region (1-35)
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
  LiveSecretArn:
    Description: |
      ARN of the live region Secrets Manager secret to replicate from.
      Obtain from the live stack Secrets Manager console.
      Only required when deploying in DR (ProductionDR) — leave blank for normal deployments.
    Type: String
    Default: ''
  IsPITRMode:
    Description: |
      Set to true ONLY by the dr-failover Step Functions state machine when performing a PITR restore.
      When true, DBStack is suppressed (DB was restored externally via PITR) and all DB references
      resolve from PITRDBEndpoint and the pre-deployed DBStandbySecurityGroup instead of DBStack outputs.
      Default false — live stacks and snapshot-based failover are completely unaffected.
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  PITRDBEndpoint:
    Description: |
      Endpoint of the PITR-restored RDS instance. Written to SSM and Secrets Manager by the
      dr-failover Step Functions machine before the app stack update. Only used when IsPITRMode=true.
      Leave blank for all other deployments — existing stacks are unaffected.
    Type: String
    Default: ''
  DRRegion:
    Description: |
      AWS region of the DR stack — used to construct the DR backup vault ARN for cross-region copy.
      Production DR is Oregon (us-west-2); UAT DR testing is Ohio (us-east-2).
    Type: String
    Default: 'us-west-2'
    AllowedValues:
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
      - ap-southeast-1
      - ap-southeast-2
  ExternalEFSId:
    Description: |
      (DR Failover only) ID of the EFS file system restored from cross-region backup.
      Written by dr-failover before the stack update. When set, ServerStack skips EFS creation
      and mounts this file system instead. Leave blank for normal operation — live stacks always
      create their own EFS and are completely unaffected.
    Type: String
    Default: ''
  HourlyEFSDRRetentionDays:
    Description: |
      Number of days to retain hourly EFS backup copies in the DR vault.
      Hourly copies are the high-frequency incremental recovery points for Option B (< 1 hour RPO).
      Daily copies serve as the long-term baseline; hourly copies layer on top.
      Must be >= 2 (minimum for incremental chain integrity) and <= 35 (AWS Backup maximum).
    Type: Number
    Default: 14
    MinValue: 2
    MaxValue: 35
  BackupVaultEncryptionKeyArn:
    Description: |
      ARN of the KMS CMK used to encrypt the backup vault and every recovery point stored in it.
      Must be a multi-region key: the primary key in the live region encrypts the source vault, and
      the replica key in the DR region encrypts the DRBackupVault, so cross-region copies are
      immediately decryptable at DR restore time — no key import or manual re-encryption required.
      Leave blank to use the default AWS-managed aws/backup key (NOT decryptable cross-region).
    Type: String
    Default: ''

