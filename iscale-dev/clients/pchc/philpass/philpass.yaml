        Fn::ImportValue:
          !Sub '${NetworkStackName}-PrivateRouteTable1'
      DestinationCidrBlock: !Join ['', [!FindInMap [BSPConfig, !Ref BSPMode, PPPResource5], '/32']]
      NetworkInterfaceId: !Ref StrongSwanAZ1ENI

  PPPResource5AZ2Route:
    Type: AWS::EC2::Route
    Condition: IsBSPProd #No IP5 except in prod
    Properties:
      RouteTableId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PrivateRouteTable2'
      DestinationCidrBlock: !Join ['', [!FindInMap [BSPConfig, !Ref BSPMode, PPPResource5], '/32']]
