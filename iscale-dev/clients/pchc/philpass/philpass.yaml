      NetworkInterfaceId: !Ref StrongSwanAZ1ENI

  PPPDRResource2AZ2Route:
    Type: AWS::EC2::Route
    Condition: IsBSPProd #No DR resource except in prod
    Properties:
      RouteTableId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PrivateRouteTable2'
      DestinationCidrBlock: !Join ['', [!FindInMap [BSPConfig, Production, PPPDRResource2], '/32']]
