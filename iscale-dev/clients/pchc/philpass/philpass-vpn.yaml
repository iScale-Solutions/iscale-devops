##
# LibreSwan EC2 instances
##

# LibreSwanLaunchTemplate is used only as a cfn-init metadata carrier for launching EC2

  LibreSwanLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Metadata:
      AWS::CloudFormation::Init:
        configSets:
          AZ1ConfigProd:
            - InstallPackages
            - NetworkFiles
            - PSK
            - AZ1ConfigProd
            - StartLibreSwan
          AZ2ConfigProd:
            - InstallPackages
            - NetworkFiles
            - PSK
            - AZ2ConfigProd
            - StartLibreSwan
          AZ1ConfigUAT:
            - InstallPackages
            - NetworkFiles
            - PSK
            - AZ1ConfigUAT
            - StartLibreSwan
          AZ2ConfigUAT:
            - InstallPackages
            - NetworkFiles
            - PSK
            - AZ2ConfigUAT
            - StartLibreSwan

        InstallPackages:
           packages:
             yum:
               libreswan: []
               nftables: []

        StartLibreSwan:
          commands:
            01_load_nftables:
              command: 'nft -f /etc/nftables.conf && systemctl enable --now nftables'
            02_start_ipsec:
              command: 'systemctl enable --now ipsec'
              ignoreErrors: true
            # [ADDED] Disable rp_filter on VTI interfaces after tunnel comes up.
            # VTI interfaces are created by Libreswan on start, so sysctl for them
            # must run after ipsec starts. Without this, return traffic gets dropped.
            03_disable_rp_filter_vti:
              command: |
                sleep 5
                for vti in vti0 vti1; do
                  if [ -d /proc/sys/net/ipv4/conf/$vti ]; then
                    sysctl -w net.ipv4.conf.$vti.rp_filter=0
                    sysctl -w net.ipv4.conf.$vti.disable_policy=1
                  fi
                done

        NetworkFiles:
          commands:
            01_ip_forward:
              command: 'echo 1 > /proc/sys/net/ipv4/ip_forward'
            02_send_redirects:
              command: 'echo 0 > /proc/sys/net/ipv4/conf/ens5/send_redirects'
            03_apply_sysctl:
              command: 'sysctl --system'
          files:
            /etc/sysctl.d/99-ipsec-vpn.conf:
              content: |
                # Required for VPN gateway forwarding
                net.ipv4.ip_forward = 1

                # Redirect protection (breaks IPsec if enabled)
                net.ipv4.conf.all.accept_redirects = 0
                net.ipv4.conf.default.accept_redirects = 0
                net.ipv4.conf.all.send_redirects = 0
                net.ipv4.conf.default.send_redirects = 0

                # Source routing disabled
                net.ipv4.conf.all.accept_source_route = 0
                net.ipv4.conf.default.accept_source_route = 0

                # [CHANGED] rp_filter set to 0 globally.
                # With VTI, strict rp_filter drops return traffic because the
                # source (remote subnet) isn't routable via the interface the
                # decrypted packet appears on. VTI interfaces get rp_filter=0
                # explicitly after ipsec starts (see 03_disable_rp_filter_vti).
                net.ipv4.conf.all.rp_filter = 0
                net.ipv4.conf.default.rp_filter = 0

                # ICMP hardening
                net.ipv4.icmp_echo_ignore_broadcasts = 1

                # ASLR
                kernel.randomize_va_space = 2

        PSK:
          files:
            /etc/ipsec.secrets:
              content: !Sub
                - |
                  @pchc ${PPP_GATEWAY} : PSK "${PSK_PPP}"
                  @pchc ${PPP_DR_GATEWAY} : PSK "${PSK_PPP}"
                  @pchc ${3RD_GATEWAY} : PSK "${PSK_3RD}"
                - PSK_PPP: !Ref LibreSwanPPPPSK
                  PSK_3RD: !Ref LibreSwan3RDPSK
                  PPP_GATEWAY: !FindInMap [BSPConfig, !Ref BSPMode, PPPGateway]
                  PPP_DR_GATEWAY: !If
                    - IsBSPUAT
                    - !FindInMap [BSPConfig, UAT, PPPGateway]
                    - !FindInMap [BSPConfig, Production, PPPDRGateway]
                  3RD_GATEWAY: !FindInMap [BSPConfig, !Ref BSPMode, PP3rdPartyGateway]
              # [CHANGED] Secrets file should be 0600, not default
              permissions: '0600'
              owner: root
              group: root

# AZ 1 Prod
        AZ1ConfigProd:
          files:
            /etc/nftables.conf:
              content: !Sub
                - |
                  table ip nat {
                      set source_subnet {
                          type ipv4_addr;
                          flags interval;
                          elements = {
                              ${PRIVATE_SUBNET}
                          }
                      }

                      chain POSTROUTING {
                          type nat hook postrouting priority 100;

                          # [CHANGED] Masquerade on VTI interfaces instead of ens5.
                          # On kernel 6.1 (AL2023), XFRM policy check happens before
                          # POSTROUTING for forwarded traffic. Masquerading on ens5
                          # fires too late — traffic bypasses IPsec entirely.
                          # VTI interfaces receive routed traffic first, so NAT fires
                          # before XFRM encryption.
                          #
                          # [CHANGED] oifname "vti*" (runtime name match) instead of
                          # oif "vtiN" (load-time index): nftables loads before ipsec
                          # creates the vti devices, so oif fails with "Interface does
                          # not exist". The wildcard also collapses all tunnels into a
                          # single rule, so adding destinations adds no rules.
                          ip saddr @source_subnet oifname "vti*" masquerade
                      }
                  }
                - PRIVATE_SUBNET: !FindInMap [BSPConfig, Production, LibreSwanPrivateSubnetAZ1]
            /etc/ipsec.d/ipsec.conf:
              content: !Sub
                - |
                  conn bspPPPlus
                      authby=secret
                      auto=start
                      ikev2=no
                      type=tunnel
                      leftid=@pchc
                      left=%defaultroute
                      leftsubnet=${LEFT_SUBNET}
                      right=${PPP_GATEWAY}
                      rightsubnet=${PPP_SUBNET}
                      ike=aes256-sha256-modp2048
                      ikelifetime=43200s
                      esp=aes128-sha256-modp2048
                      salifetime=1h
                      encapsulation=yes
                      dpddelay=10
                      dpdtimeout=60
                      dpdaction=restart
                      # [ADDED] VTI interface for this conn.
                      # Unique mark per conn so kernel maps traffic to the right tunnel.
                      mark=42/0xffffffff
                      vti-interface=vti0
                      vti-routing=yes
                      vti-shared=no

                  conn bspPPPlusDR
                      authby=secret
                      auto=start
                      ikev2=no
                      type=tunnel
                      leftid=@pchc
                      left=%defaultroute
                      leftsubnet=${LEFT_SUBNET}
                      right=${PPP_DR_GATEWAY}
                      rightsubnet=${PPP_DR_SUBNET}
                      ike=aes256-sha256-modp2048
                      ikelifetime=43200s
                      esp=aes128-sha256-modp2048
                      salifetime=1h
                      dpddelay=10
                      dpdtimeout=60
                      dpdaction=restart
                      # [ADDED] VTI interface for this conn.
                      mark=43/0xffffffff
                      vti-interface=vti1
                      vti-routing=yes
                      vti-shared=no

                  conn bspPP3rd
                      authby=secret
                      auto=start
                      ikev2=no
                      type=tunnel
                      leftid=@pchc
                      left=%defaultroute
                      leftsubnet=${LEFT_SUBNET}
                      right=${3RD_GATEWAY}
                      rightsubnet=${3RD_SUBNET}
                      ike=aes256-sha256-modp2048
                      ikelifetime=43200s
                      esp=aes128-sha256-modp2048
                      salifetime=1h
                      encapsulation=yes
                      dpddelay=10
                      dpdtimeout=60
                      dpdaction=restart
                      # [ADDED] VTI interface for this conn.
                      mark=44/0xffffffff
                      vti-interface=vti2
                      vti-routing=yes
                      vti-shared=no
                - LEFT_SUBNET: !FindInMap [BSPConfig, Production, LibreSwanPublicSubnetAZ1]
                  PPP_GATEWAY: !FindInMap [BSPConfig, Production, PPPGateway]
                  PPP_SUBNET: !FindInMap [BSPConfig, Production, PPPSubnetCIDR]
                  PPP_DR_GATEWAY: !FindInMap [BSPConfig, Production, PPPDRGateway]
                  PPP_DR_SUBNET: !FindInMap [BSPConfig, Production, PPPDRSubnetCIDR]
                  3RD_GATEWAY: !FindInMap [BSPConfig, Production, PP3rdPartyGateway]
                  3RD_SUBNET: !FindInMap [BSPConfig, Production, PP3rdPartySubnetCIDR]
              # [CHANGED] Was 0700. Config files should be 0644 (not executable).
              # Only secrets files need restrictive permissions.
              permissions: '0644'
              owner: root
              group: root
