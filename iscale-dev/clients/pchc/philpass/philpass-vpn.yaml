# Second EC2

  LibreSwanInstanceAZ2:
    Type: AWS::EC2::Instance
    Properties:
      IamInstanceProfile: !Ref LibreSwanInstanceProfile
      DisableApiTermination: !If [IsProd, !Ref DeletionProtection, false]
      KeyName: !If [HasKeyName, !Ref InstanceKeyName, !Ref 'AWS::NoValue']
      ImageId: !Ref InstanceAmi
      InstanceType: t3.nano
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 10
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      NetworkInterfaces:
        - DeviceIndex: 0
          NetworkInterfaceId: !Ref LibreSwanAZ2ENI
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, BSP, vpn, b]]
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash -xe
             /usr/local/bin/cfn-init -v --stack ${AWS::StackName} --resource LibreSwanLaunchTemplate -c ${AZ2CONFIG} --region ${AWS::Region} --role ${ROLE}
            # Start up the cfn-hup daemon to listen for changes to the EC2 metadata
             /usr/local/bin/cfn-hup || error_exit 'Failed to start cfn-hup'
            # Signal the status from cfn-init
             /usr/local/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource LibreSwanLaunchTemplate  --region ${AWS::Region}
          - AZ2CONFIG: !If [IsBSPUAT, AZ2ConfigUAT, AZ2ConfigProd]
            ROLE: !Ref LibreSwanEC2Role

