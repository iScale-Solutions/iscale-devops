    Properties:
      LaunchTemplateName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, vpn]]
      LaunchTemplateData:
        ImageId: !Ref InstanceAmi
        InstanceType: t3.nano
        KeyName: !If [HasKeyName, !Ref InstanceKeyName, !Ref 'AWS::NoValue']
        DisableApiTermination: !If [IsProd, !Ref DeletionProtection, false]
        IamInstanceProfile:
          Name: !Ref LibreSwanInstanceProfile

  LibreSwanEC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: AccessStackDetails
          PolicyDocument:
            Version: 2012-10-17
            Statement:
            - Effect: Allow
              Action:
                - cloudformation:DescribeStackResource
              Resource: '*'
        - PolicyName: EC2ReadTagPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeTags
                  - ec2:DescribeInstances
                Resource: '*'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonEC2RoleforSSM'

  LibreSwanInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref LibreSwanEC2Role

# First EC2

  LibreSwanInstanceAZ1:
    Type: AWS::EC2::Instance
    Properties:
      IamInstanceProfile: !Ref LibreSwanInstanceProfile
      DisableApiTermination: !If [IsProd, !Ref DeletionProtection, false]
      KeyName: !If [HasKeyName, !Ref InstanceKeyName, !Ref 'AWS::NoValue']
      ImageId: !Ref InstanceAmi
      InstanceType: t3.nano
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 10
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      NetworkInterfaces:
        - DeviceIndex: 0
          NetworkInterfaceId: !Ref LibreSwanAZ1ENI
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, BSP, vpn, a]]
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash -xe
             /usr/local/bin/cfn-init -v --stack ${AWS::StackName} --resource LibreSwanLaunchTemplate -c ${AZ1CONFIG} --region ${AWS::Region} --role ${ROLE}
            # Start up the cfn-hup daemon to listen for changes to the EC2 metadata
             /usr/local/bin/cfn-hup || error_exit 'Failed to start cfn-hup'
            # Signal the status from cfn-init
             /usr/local/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource LibreSwanLaunchTemplate  --region ${AWS::Region}
          - AZ1CONFIG: !If [IsBSPUAT, AZ1ConfigUAT, AZ1ConfigProd]
            ROLE: !Ref LibreSwanEC2Role

