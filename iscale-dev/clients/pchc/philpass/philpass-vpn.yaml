Outputs:
  LibreSwanSecurityGroupId:
    Description: Security group ID of the LibreSwan VPN gateway instances
    Value: !Ref LibreSwanSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-LibreSwanSecurityGroupId'

  LibreSwanAZ1ENIId:
    Description: ENI ID of the AZ1 VPN gateway
    Value: !Ref LibreSwanAZ1ENI
    Export:
      Name: !Sub '${AWS::StackName}-LibreSwanAZ1ENIId'

  LibreSwanAZ2ENIId:
    Description: ENI ID of the AZ2 VPN gateway
    Value: !Ref LibreSwanAZ2ENI
    Export:
      Name: !Sub '${AWS::StackName}-LibreSwanAZ2ENIId'

  LibreSwanAZ1PrivateIp:
    Description: Auto-assigned private IP of the AZ1 VPN gateway ENI (send to BSP for registration)
    Value: !GetAtt LibreSwanAZ1ENI.PrimaryPrivateIpAddress
    Export:
      Name: !Sub '${AWS::StackName}-LibreSwanAZ1PrivateIp'

  LibreSwanAZ2PrivateIp:
    Description: Auto-assigned private IP of the AZ2 VPN gateway ENI (send to BSP for registration)
    Value: !GetAtt LibreSwanAZ2ENI.PrimaryPrivateIpAddress
    Export:
      Name: !Sub '${AWS::StackName}-LibreSwanAZ2PrivateIp'

  BSPVPNGatewayEIP1:
    Description: Public IP of the VPN gateway in AZ1 (send to BSP for registration)
    Value: !Ref BSPVPNGatewayEIP1
    Export:
      Name: !Sub '${AWS::StackName}-BSPVPNGatewayEIP1'

  BSPVPNGatewayEIP2:
    Description: Public IP of the VPN gateway in AZ2 (send to BSP for registration)
    Value: !Ref BSPVPNGatewayEIP2
    Export:
      Name: !Sub '${AWS::StackName}-BSPVPNGatewayEIP2'
