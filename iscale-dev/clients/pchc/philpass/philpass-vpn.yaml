###
# Custom Network resources for BSP
###

  LibreSwanSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: LibreSwan Public Security Group
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'

  AllowICMPIntoLibreSwan:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      IpProtocol: icmp
      GroupId: !Ref LibreSwanSecurityGroup
      FromPort: -1
      ToPort: -1
      CidrIp:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcCidrBlock'

  AllowHTTPSIntoLibreSwan:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      IpProtocol: tcp
      GroupId: !Ref LibreSwanSecurityGroup
      FromPort: 443
      ToPort: 443
      CidrIp:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcCidrBlock'

  AllowDNSIntoLibreSwan:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      IpProtocol: udp
      GroupId: !Ref LibreSwanSecurityGroup
      FromPort: 53
      ToPort: 53
      CidrIp:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcCidrBlock'

# EIPs for LibreSwan ENIs

  LibreSwanAZ1ENI:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::EC2::NetworkInterface
    Properties:
      Description: !Join
        - ' '
        - - Gateway Main ENI
          - !Select
            - 0
            - Fn::GetAZs: !Ref 'AWS::Region'
      GroupSet:
        - !Ref LibreSwanSecurityGroup
      SourceDestCheck: false # this enables the instance to forward traffic, which is required for a VPN gateway
      SubnetId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PublicSubnetId1'
      Tags:
        - Key: Name
          Value: LibreSwan public ENI

  LibreSwanAZ2ENI:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::EC2::NetworkInterface
    Properties:
      Description: !Join
        - ' '
        - - BSP Access ENI
          - !Select
            - 1
            - Fn::GetAZs: !Ref 'AWS::Region'
      GroupSet:
        - !Ref LibreSwanSecurityGroup
      SourceDestCheck: false # this enables the instance to forward traffic, which is required for a VPN gateway
      SubnetId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-PublicSubnetId2'
      Tags:
        - Key: Name
          Value: LibreSwan public ENI

  BSPVPNGatewayEIP1: # - Hardcoded for BSP
    DeletionPolicy: Retain #Make sure to retain always
    UpdateReplacePolicy: Retain
    Type: AWS::EC2::EIP
    Properties:
      Tags:
        - Key: Name
          Value: !Join [' ', [!Ref Name, !Ref EnvName, BSP registered IP - AZ1]]

  BSPVPNGatewayEIP2: # - Hardcoded for BSP
    DeletionPolicy: Retain #Make sure to retain always
    UpdateReplacePolicy: Retain
    Type: AWS::EC2::EIP
    Properties:
      Tags:
        - Key: Name
          Value: !Join [' ', [!Ref Name, !Ref EnvName, BSP registered IP - AZ2]]

  LibreSwanPublicEIPAttachAZ1:
    Type: AWS::EC2::EIPAssociation
    Properties:
      NetworkInterfaceId: !Ref LibreSwanAZ1ENI
      AllocationId: !GetAtt BSPVPNGatewayEIP1.AllocationId

  LibreSwanPublicEIPAttachAZ2:
    Type: AWS::EC2::EIPAssociation
    Properties:
      NetworkInterfaceId: !Ref LibreSwanAZ2ENI
      AllocationId: !GetAtt BSPVPNGatewayEIP2.AllocationId

