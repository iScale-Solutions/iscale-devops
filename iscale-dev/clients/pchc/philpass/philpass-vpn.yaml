AWSTemplateFormatVersion: 2010-09-09
Description: PhilPass BSP LibreSwan VPN Gateway (dedicated stack)

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
          - DeletionProtection
      - Label:
          default: VPN Configuration
        Parameters:
          - BSPMode
          - InstanceAmi
          - InstanceKeyName
          - LibreSwanPPPPSK
          - LibreSwan3RDPSK
    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      NetworkStackName:
        default: Network Stack Name
      SNSStackName:
        default: SNS Topic Stack Name
      DeletionProtection:
        default: Protect core items against deletion
      BSPMode:
        default: BSP Resources to connect to
      InstanceAmi:
        default: LibreSwan Instance AMI ID (Amazon Linux 2023)
      InstanceKeyName:
        default: Instance Key Name
      LibreSwanPPPPSK:
        default: LibreSwan PhilPassPlus Shared Key
      LibreSwan3RDPSK:
        default: LibreSwan 3rd Party Shared Key

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name)
    Type: String
    MinLength: 3
    MaxLength: 12
    Default: philpass
  OrgName:
    Description: The name of the organization
    Type: String
    Default: pchc
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
      - ProductionDR
      - StagingDR
      - DevelopmentDR
      - TestDR
  BSPMode:
    Description: BSP Resources to connect to
    Type: String
    Default: UAT
    AllowedValues:
      - Production
      - UAT
  NetworkStackName:
    Description: The name of the network stack
    Type: String
    Default: pchc-dev-ase1-network
    MinLength: 1
  SNSStackName:
    Description: The name of the SNS stack
    Type: String
    Default: pchc-dev-ase1-sns
    MinLength: 1
  DeletionProtection:
    Description: Set to true to enable (valid only in Production mode)
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  InstanceKeyName:
    Description: Instance Key Name (omit to use SSM Session Manager only)
    Type: String
    Default: ''
  InstanceAmi:
    Description: Base PCHC Amazon Linux 2023 AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-0499b5b9a26be1426
  LibreSwanPPPPSK:
    Description: Password for PhilPassPlus PSK
    Type: String
    NoEcho: true
  LibreSwan3RDPSK:
    Description: Password for 3rd Party PSK
    Type: String
    NoEcho: true

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml
  BSPConfig:
    Production:
      PPPGateway: 121.127.5.157
      PPPSubnetCIDR: 192.168.80.0/24
      PPPResource1: 192.168.80.131
      PPPResource2: 192.168.80.132
      PPPResource3: 192.168.80.141
      PPPResource4: 192.168.80.152
      PPPResource5: 192.168.80.153
      PPPResource6: 192.168.80.154
      PPPDNSServer1: 192.168.80.241
      PPPDNSServer2: 192.168.80.242
      PP3rdPartyGateway: 121.127.5.50
      PP3rdPartySubnetCIDR: 192.168.4.0/24
      PP3rdPartyResource: 192.168.4.125/32
      LibreSwanENIPrivIPAZ1: 10.0.0.53 #registered with BSP
      LibreSwanPublicSubnetAZ1: 10.0.0.32/27
      LibreSwanPrivateSubnetAZ1: 10.0.0.0/27
      LibreSwanENIPrivIPAZ2: 10.0.0.176 #registered with BSP
      LibreSwanPublicSubnetAZ2: 10.0.0.160/27
      LibreSwanPrivateSubnetAZ2: 10.0.0.128/27
      PPPDRGateway: 121.127.17.175 #DR Gateway
      PPPDRSubnetCIDR: 192.168.90.0/24
      PPPDRResource1: 192.168.90.131
      PPPDRResource2: 192.168.90.141
      PPPDRResource3: 192.168.90.142
      PPPDRResource4: 192.168.90.152
      PPPDRResource5: 192.168.90.153
      PPPDRResource6: 192.168.90.154
    UAT:
      PPPGateway: 121.127.5.157 #Same as Prod
      PPPSubnetCIDR: 192.168.222.0/24
      PPPResource1: 192.168.222.100
      PPPDNSServer1: 192.168.222.241 #Check on this
      PPPDNSServer2: 192.168.222.242 #Check on this
      PP3rdPartyGateway: 121.127.5.50 #Same as Prod
      PP3rdPartySubnetCIDR: 192.168.222.0/24
      PP3rdPartyResource: 192.168.222.101/32
      LibreSwanENIPrivIPAZ1: 10.2.0.53 #registered with BSP
      LibreSwanPublicSubnetAZ1: 10.2.0.32/27
      LibreSwanPrivateSubnetAZ1: 10.2.0.0/27
      LibreSwanENIPrivIPAZ2: 10.2.0.176 #registered with BSP
      LibreSwanPublicSubnetAZ2: 10.2.0.160/27
      LibreSwanPrivateSubnetAZ2: 10.2.0.128/27

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasKeyName: !Not [!Equals [!Ref InstanceKeyName, '']]
  IsBSPProd: !Equals [!Ref BSPMode, Production]
  IsBSPUAT: !Equals [!Ref BSPMode, UAT]

Resources:

# storage for LibreSwan PSKs
  LibreSwanSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, vpn, secrets]]
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, vpn, secrets]]
      SecretString: !Sub |
        {
          "LibreSwanPPPPSK": "${LibreSwanPPPPSK}",
          "LibreSwan3RDPSK": "${LibreSwan3RDPSK}"
        }
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, vpn, secrets]]

