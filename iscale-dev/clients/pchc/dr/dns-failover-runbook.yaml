AWSTemplateFormatVersion: 2010-09-09
Description: |
  PCHC DR DNS Cutover Runbook. Deploys:
  (1) Listener rule Lambda — adds each app's live hostname to the host-header condition of its ALB
      listener rule in the target region, so the ALB accepts the traffic DNS is about to send it.
  (2) Health check Lambda — verifies all PCHC apps are healthy on the target region's ALBs before cutover.
  (3) Route 53 cutover Lambda — updates Route 53 records to point at the target region's ALBs.
  (4) SSM Automation Document — 5-step runbook: listener rules → health check → DR Manager approval
      → DNS cutover → SNS all-clear.
  Started manually by the DR Manager from the AWS Console after the failover (or failback) workflow
  succeeds and validation is complete.

  DIRECTION-AWARE — deploy one stack per region, each promoting its own region:
    us-west-2      Direction=failover  TargetRegion=us-west-2       (promote Oregon)
    ap-southeast-1 Direction=failback  TargetRegion=ap-southeast-1  (return to Singapore)
  Direction is fixed at deploy time, never at execution time: the document an operator
  starts names what it does and cannot perform the opposite cutover.
  The two stacks MUST NOT share a stack name — see the note on IAM role names below.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - OrgName
          - EnvName
      - Label:
          default: Cutover Configuration
        Parameters:
          - Direction
          - TargetRegion
          - HealthCheckPath
          - HostedZoneMap
          - PropagationWaitSeconds
      - Label:
          default: Notifications & Approval
        Parameters:
          - SNSStackName
          - ApproverIamArns
          - ApprovalTimeoutSeconds
      - Label:
          default: Logging
        Parameters:
          - LogRetentionDays

    ParameterLabels:
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      Direction:
        default: Cutover Direction
      TargetRegion:
        default: Target Region (the region being promoted)
      HealthCheckPath:
        default: Health Check Path
      HostedZoneMap:
        default: Hosted Zone Map (JSON)
      PropagationWaitSeconds:
        default: DNS Propagation Wait (seconds)
      SNSStackName:
        default: SNS Topic Stack Name
      ApproverIamArns:
        default: Approver IAM ARNs (comma-separated, for reference)
      ApprovalTimeoutSeconds:
        default: Approval Timeout (seconds)
      LogRetentionDays:
        default: CloudWatch Log Retention (days)

Parameters:

  OrgName:
    Description: The name of the organization
    Type: String
    Default: pchc
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen
    MaxLength: 10

  EnvName:
    Description: The name of the environment.
    Type: String
    Default: ProductionDR
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
      - ProductionDR
      - StagingDR
      - DevelopmentDR
      - TestDR

  Direction:
    Description: >
      Which way this stack cuts DNS. Fixed at DEPLOY time, deliberately not at execution
      time — an operator choosing direction mid-incident can send production traffic to
      the wrong region, so the document they start must be incapable of the opposite cutover.
      Drives the SSM document name and the operator-facing messages ONLY. What this stack
      actually writes is decided by TargetRegion.
        failover — promote the DR region (deploy this stack in the DR region)
        failback — return to the live region (deploy this stack in the live region)
    Type: String
    Default: failover
    AllowedValues:
      - failover
      - failback

  TargetRegion:
    Description: >
      The region whose application stacks this runbook resolves ALBs from — the region
      being promoted. Deploy each stack IN the region it promotes: a dead region then
      cannot be promoted, because the runbook that would do it lives in it.
      Used for the CloudFormation lookup only. This stack's own configuration is read
      locally — see the ReadHostedZoneMap policy.
    Type: String
    Default: us-west-2
    AllowedValues:
      - ap-southeast-1
      - us-east-2
      - us-west-2

  HealthCheckPath:
    Description: HTTP path to call on each app ALB.
    Type: String
    Default: /health

  HostedZoneMap:
    Description: |
      JSON object mapping app names to their Route 53 target record and the
      CloudFormation stack that owns their DR load balancer. The Lambdas resolve
      the ALB DNS name and its canonical hosted zone ID from that stack's outputs
      at run time, so neither value is configured by hand.
      Two forms, depending on how the app declares its load balancer:
        External ELB stack (stable name, e.g. pesonet20) — give elbStackName:
        {"pesonet":{"hostedZoneId":"ZXXXX","recordName":"pesonet.pchc.com.ph",
                    "elbStackName":"pchc-pdr-uw2-pesonet20-elb"}}
        Nested ELBStack (generated name, e.g. pas6) — give the parent app stack
        and the logical id the ELB stack is declared under (default ELBStack):
        {"pas6":{"hostedZoneId":"ZXXXX","recordName":"pas6-app-tdr.pchcdev.com",
                 "appStackName":"pchc-tdr-ue2-pas6","elbLogicalId":"ELBStack"}}
      Optional listenerRulePriority selects WHICH rule on that listener gets the
      hostname. One app's server stacks share a listener at different priorities —
      for pddts the web app is 100 and sidekiq is 105 — so the wrong priority would
      teach a background worker to answer on the app's public hostname. Defaults to
      100, the web-facing rule for every PCHC app except philpass (50):
        {"philpass":{"hostedZoneId":"ZXXXX","recordName":"philpass.pchc.com.ph",
                     "elbStackName":"pchc-pdr-uw2-philpass-elb","listenerRulePriority":50}}
      Apps behind a NETWORK load balancer (pesonet20's API and sidekiq) are skipped by
      the listener step automatically — NLBs have no listener rules. Nothing to configure.
      Optional port (default 443) and verifyCertificate (default true) tune the health
      check probe. Leave verification on: it is what catches a DR certificate never
      issued for the live hostname. Turn it off only for a private CA:
        {"cics":{"hostedZoneId":"ZXXXX","recordName":"cics.pchc.com.ph",
                 "elbStackName":"pchc-pdr-uw2-cics-elb","port":8443}}
    Type: String
    Default: '{}'

  SNSStackName:
    Description: The name of the SNS stack
    Type: String
    Default: pchc-prddr-uw2-sns
    MinLength: 1

  ApproverIamArns:
    Description: >
      Comma-separated IAM user or role ARNs authorised to approve the DNS cutover.
      Used as the default Approvers list in the SSM runbook — pre-populates the
      approval step so the DR Manager does not need to type ARNs manually under pressure.
      Example: arn:aws:iam::123456789012:user/dr-manager
    Type: String

  ApprovalTimeoutSeconds:
    Description: >
      Seconds to wait for the DR Manager approval before the runbook aborts.
      Default is 14400 (4 hours). Baked into the SSM document at deploy time.
      Must be a String type so !Ref resolves correctly inside SSM Document Content.
    Type: String
    Default: '14400'

  PropagationWaitSeconds:
    Description: >
      Seconds to sleep after Route 53 changes reach INSYNC, allowing recursive
      resolver caches to expire before the all-clear fires. Set to the highest
      DNS TTL in use across PCHC app records (default 300 = 5 minutes).
      Must be a String: this is passed as a Lambda environment variable, and
      those are Map<String, String> — a Number fails property validation.
    Type: String
    Default: '300'
    AllowedPattern: '^[0-9]+$'
    ConstraintDescription: Propagation wait must be a whole number of seconds

  LogRetentionDays:
    Description: Number of days to retain Lambda CloudWatch logs.
    Type: Number
    Default: 30
    AllowedValues:
      - 7
      - 14
      - 30
      - 60
      - 90
      - 180
      - 365

Conditions:

  # Direction never selects a target — only the wording of the audit trail. Keeping the
  # two concerns apart is what stops an execution-time direction switch reappearing by
  # the back door.
  IsFailback: !Equals [!Ref Direction, failback]

Resources:

  ####
  # SSM Parameter — Hosted Zone Map
  ####

  # Lives in THIS stack's region — AWS::SSM::Parameter has no region property, and the
  # readers are scoped to AWS::Region to match. Each direction holds its own copy.
  HostedZoneMapParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${OrgName}/dr/${EnvName}/hosted-zone-map
      Type: String
      Value: !Ref HostedZoneMap
      Description: Route 53 hosted zone config per app — update before running the DNS cutover runbook

  ####
  # IAM — Listener Rule Lambda
  ####

  ListenerRuleLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-listener-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
        # Local — see the equivalent note on LambdaRole.
        - PolicyName: ReadHostedZoneMap
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${OrgName}/dr/${EnvName}/hosted-zone-map
        - PolicyName: DescribeELBStacks
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResource
                Resource: !Sub arn:aws:cloudformation:${TargetRegion}:${AWS::AccountId}:stack/*
        - PolicyName: ModifyListenerRules
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # DescribeRules takes no resource-level permissions, so it cannot be
              # narrowed below '*'. It is read-only.
              - Effect: Allow
                Action:
                  - elasticloadbalancing:DescribeRules
                Resource: '*'
              - Effect: Allow
                Action:
                  - elasticloadbalancing:ModifyRule
                Resource: !Sub arn:aws:elasticloadbalancing:${TargetRegion}:${AWS::AccountId}:listener-rule/app/*

  ####
  # CloudWatch Logs — Listener Rule Lambda
  ####

  ListenerRuleLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-listener
      RetentionInDays: !Ref LogRetentionDays

  ####
  # Lambda — Listener Rule Host Headers
  ####

  # DR listener rules match a DR-derived name (pddts-pdr.<domain>), never the live one.
  # nginx answers to both via ServerNameOverride; the ALB was never taught. Without this
  # the cutover matches no rule and returns 503 from the default action's empty TG.
  #
  # Writes outside CloudFormation, so an app stack update reverts it. Re-added every run.
  # Permanent fix is an AdditionalHostHeaders parameter on the app templates.
  ListenerRuleLambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn: ListenerRuleLambdaLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-listener
      # Lambda Description is capped at 256 characters.
      Description: >
        Pre-cutover listener prep — adds each app's live hostname to the host-header
        condition of its ALB listener rule in the target region, so the ALB routes the
        traffic the DNS cutover is about to send it. Idempotent.
      Handler: index.handler
      Role: !GetAtt ListenerRuleLambdaRole.Arn
      Runtime: python3.12
      # aws:invokeLambdaFunction gives up at 5 minutes regardless of this value.
      Timeout: 290
      Environment:
        Variables:
          HOSTED_ZONE_MAP_PARAMETER: !Sub /${OrgName}/dr/${EnvName}/hosted-zone-map
          TARGET_REGION: !Ref TargetRegion
      Code:
        ZipFile: |
          import json, os
          import boto3
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          # ALB quotas are scoped to the whole rule, not to one condition — a rule that
          # gained a path-pattern would spend part of the budget before the host values
          # are counted. Erring low costs a clean pre-flight abort; erring high costs a
          # rejection in the middle of the write loop.
          MAX_MATCH_EVALUATIONS = 5

          # describe_rules reports every condition twice: the legacy flat Values list and
          # the typed *Config block. modify_rule rejects a condition carrying both, so each
          # one is rebuilt in typed form before being written back.
          CONDITION_CONFIG_KEY = {
              'host-header': 'HostHeaderConfig',
              'path-pattern': 'PathPatternConfig',
              'http-header': 'HttpHeaderConfig',
              'query-string': 'QueryStringConfig',
              'http-request-method': 'HttpRequestMethodConfig',
              'source-ip': 'SourceIpConfig',
          }

          def condition_values(c):
              """Values on a condition, from the typed config or the legacy flat list."""
              key = CONDITION_CONFIG_KEY.get(c['Field'])
              return (c.get(key) or {}).get('Values') or c.get('Values', [])

          def resolve_listener(cfn, app_name, entry):
              """Return the HTTPS listener ARN, or None when the app has no listener rules.

              Same two config forms as the other Lambdas: an external ELB stack is named
              directly, a nested one is reached through its parent app stack.
              """
              stack = entry.get('elbStackName')
              if not stack:
                  app_stack = entry.get('appStackName')
                  if not app_stack:
                      raise Exception(f'{app_name}: no elbStackName or appStackName')
                  stack = cfn.describe_stack_resource(
                      StackName=app_stack,
                      LogicalResourceId=entry.get('elbLogicalId', 'ELBStack')
                  )['StackResourceDetail']['PhysicalResourceId']

              outputs = cfn.describe_stacks(StackName=stack)['Stacks'][0].get('Outputs', [])
              by_key = {o['OutputKey']: o['OutputValue'] for o in outputs}
              if 'ApplicationListenerArn' in by_key:
                  return by_key['ApplicationListenerArn']
              if 'NetworkListenerArn' in by_key:
                  # NLBs have no listener rules; nginx matches the host instead. Skip
                  # rather than fail — pesonet20's API and sidekiq are NLBs, and an
                  # error here would abort the cutover for every other app.
                  return None
              # Tested positively on both sides so a broken ALB stack still surfaces.
              raise Exception(f'{app_name}: ELB stack {stack} exports neither '
                              'ApplicationListenerArn nor NetworkListenerArn — not a load '
                              'balancer stack this runbook knows how to prepare')

          def find_rule(elbv2, app_name, listener_arn, priority):
              paginator = elbv2.get_paginator('describe_rules')
              for page in paginator.paginate(ListenerArn=listener_arn):
                  for rule in page['Rules']:
                      if rule['Priority'] == str(priority):
                          return rule
              raise Exception(f'{app_name}: no rule at priority {priority} on {listener_arn}')

          def plan_conditions(app_name, rule, hostname):
              """Rewritten condition list, or None if the hostname is already present."""
              conditions = rule['Conditions']
              host_conditions = [c for c in conditions if c['Field'] == 'host-header']

              if not host_conditions:
                  # A rule with no host condition matches EVERY hostname. Adding one would
                  # narrow it to this name alone and take the app's other names off the
                  # air — the exact opposite of the intent, so refuse instead.
                  raise Exception(f'{app_name}: rule at priority {rule["Priority"]} has no '
                                  'host-header condition; it matches all hosts today and '
                                  'adding one would narrow it')
              if len(host_conditions) > 1:
                  raise Exception(f'{app_name}: rule at priority {rule["Priority"]} has more '
                                  'than one host-header condition; refusing to guess')

              existing = condition_values(host_conditions[0])
              if hostname in existing:
                  return None

              values = list(existing) + [hostname]
              # +1 for the name being added; the no-op case returned above already.
              total = sum(len(condition_values(c)) for c in conditions) + 1
              if total > MAX_MATCH_EVALUATIONS:
                  raise Exception(f'{app_name}: adding {hostname} would put the rule at '
                                  f'{total} match evaluations across {len(conditions)} '
                                  f'condition(s), above the ALB limit of '
                                  f'{MAX_MATCH_EVALUATIONS}: {values}')

              rewritten = []
              for c in conditions:
                  field = c['Field']
                  key = CONDITION_CONFIG_KEY.get(field)
                  if not key:
                      raise Exception(f'{app_name}: unsupported condition field {field}')
                  if field == 'host-header':
                      rewritten.append({'Field': field, key: {'Values': values}})
                  else:
                      # Everything else rides through untouched — modify_rule replaces the
                      # whole condition list, so anything omitted here would be deleted.
                      rewritten.append({'Field': field,
                                        key: c.get(key) or {'Values': condition_values(c)}})
              return rewritten

          def handler(event, context):
              ssm = boto3.client('ssm')
              cfn = boto3.client('cloudformation', region_name=os.environ['TARGET_REGION'])
              elbv2 = boto3.client('elbv2', region_name=os.environ['TARGET_REGION'])

              resp = ssm.get_parameter(Name=os.environ['HOSTED_ZONE_MAP_PARAMETER'])
              hosted_zone_map = json.loads(resp['Parameter']['Value'])

              # Resolve and validate every app before writing anything. A half-applied pass
              # leaves some apps reachable on the live hostname and others not, which is
              # harder to diagnose mid-incident than a clean abort.
              planned, skipped, failures = {}, [], []
              for app_name, entry in hosted_zone_map.items():
                  try:
                      listener_arn = resolve_listener(cfn, app_name, entry)
                      if listener_arn is None:
                          skipped.append(app_name)
                          continue
                      rule = find_rule(elbv2, app_name, listener_arn,
                                       entry.get('listenerRulePriority', 100))
                      planned[app_name] = (rule, plan_conditions(app_name, rule, entry['recordName']))
                  except Exception as e:
                      failures.append(str(e))
              if failures:
                  raise Exception(f'Aborting: could not prepare listener rules for '
                                  f"{len(failures)} app(s): {'; '.join(failures)}. "
                                  'No listener rules were modified.')

              updated, unchanged, failed = [], [], []
              for app_name, (rule, conditions) in planned.items():
                  record_name = hosted_zone_map[app_name]['recordName']
                  if conditions is None:
                      # Already correct — the normal case for the failback direction, where
                      # the live ALB has always matched its own hostname.
                      logger.info(f'{app_name}: {record_name} already on the rule')
                      unchanged.append(app_name)
                      continue
                  try:
                      elbv2.modify_rule(RuleArn=rule['RuleArn'], Conditions=conditions)
                  except Exception as e:
                      # Planning cannot catch a rule deleted since, a throttle, or a policy
                      # gap on one balancer. Keep going so the report covers every app.
                      failed.append(f'{app_name}: {e}')
                      continue
                  logger.info(f'{app_name}: added {record_name} to rule {rule["RuleArn"]}')
                  updated.append(app_name)

              # Named individually — a silent skip reads like a successful insert.
              for app_name in skipped:
                  logger.info(f'{app_name}: behind a network load balancer, no listener '
                              'rules to prepare')

              logger.info(f'Listener rules: {len(updated)} updated, {len(unchanged)} already '
                          f'correct, {len(skipped)} skipped, {len(failed)} failed')

              # Raised after the summary so the log holds the full picture either way. The
              # step is idempotent, so re-running is the fix once the causes are cleared.
              if failed:
                  raise Exception('Listener rules PARTIALLY applied. Updated: '
                                  f"{updated or 'none'}. Failed: {'; '.join(failed)}. "
                                  'The updated apps now accept their live hostname and the '
                                  'failed ones do not. Re-run this step once the failures '
                                  'are resolved; do not approve the cutover before it passes.')

              return {'status': 'ok', 'updated': updated, 'unchanged': unchanged,
                      'skipped': skipped}

  ####
  # IAM — Health Check Lambda
  ####

  # NOTE: IAM role names are account-global, not regional. The failover and failback
  # stacks must not share a stack name, or the second one fails on a duplicate role.
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
        # AWS::Region, not TargetRegion: the parameter is created by this stack, so it
        # lives where this stack lives. Scoping it to the target region is what gave the
        # template its hidden deploy-region constraint and made it un-reversible.
        - PolicyName: ReadHostedZoneMap
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${OrgName}/dr/${EnvName}/hosted-zone-map
        # The ALB DNS name is read from the ELB stack's outputs rather than configured,
        # so both Lambdas describe stacks in the target region. This one is genuinely
        # remote — contrast the local scope above.
        - PolicyName: DescribeELBStacks
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResource
                Resource: !Sub arn:aws:cloudformation:${TargetRegion}:${AWS::AccountId}:stack/*

  ####
  # CloudWatch Logs — Health Check Lambda
  ####

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}
      RetentionInDays: !Ref LogRetentionDays

  ####
  # Lambda — Health Check
  ####

  LambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}
      # Lambda Description is capped at 256 characters.
      Description: >
        Cutover health check — GETs the health check path over HTTPS on each app's
        target-region load balancer, presenting the app's live hostname in SNI and Host
        so the real certificate and listener rule are exercised. Raises unless all pass.
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Runtime: python3.12
      # Sequential 10s probes, and TLS costs more round trips than plaintext — the full
      # map ran past the old 120s. aws:invokeLambdaFunction caps at 5 minutes anyway.
      Timeout: 290
      Environment:
        Variables:
          HOSTED_ZONE_MAP_PARAMETER: !Sub /${OrgName}/dr/${EnvName}/hosted-zone-map
          HEALTH_CHECK_PATH: !Ref HealthCheckPath
          TARGET_REGION: !Ref TargetRegion
      Code:
        ZipFile: |
          import http.client, json, os, socket, ssl
          import boto3
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def probe(alb_dns, server_name, path, port, verify):
              """GET path over HTTPS, presenting server_name in both SNI and Host.

              SNI picks the certificate, Host picks the listener rule. Setting only Host
              leaves SNI naming the balancer and tests neither.

              HTTPS, not HTTP: port 80 is a blanket 301 issued before rule evaluation and
              without touching a target, so an HTTP probe passes for a dead app.
              """
              ctx = ssl.create_default_context()
              if not verify:
                  ctx.check_hostname = False
                  ctx.verify_mode = ssl.CERT_NONE
              conn = http.client.HTTPSConnection(server_name, port, context=ctx, timeout=10)
              # connect() dials _create_connection((self.host, self.port)) and takes SNI
              # from self.host — replacing it splits the address from the name.
              conn._create_connection = lambda addr, t, sa: socket.create_connection(
                  (alb_dns, port), t, sa)
              try:
                  conn.request('GET', path, headers={'Host': server_name})
                  return conn.getresponse().status
              finally:
                  conn.close()

          def resolve_alb(cfn, app_name, entry):
              """Return (dns_name, canonical_hosted_zone_id) from the app's ELB stack.

              An external ELB stack has a stable name and is named directly. A nested
              ELBStack gets a generated name, so it is reached through its parent app
              stack and the logical id it is declared under.
              """
              stack = entry.get('elbStackName')
              if not stack:
                  app_stack = entry.get('appStackName')
                  if not app_stack:
                      raise Exception(f'{app_name}: config has neither elbStackName nor appStackName')
                  logical = entry.get('elbLogicalId', 'ELBStack')
                  stack = cfn.describe_stack_resource(
                      StackName=app_stack, LogicalResourceId=logical
                  )['StackResourceDetail']['PhysicalResourceId']

              outputs = cfn.describe_stacks(StackName=stack)['Stacks'][0].get('Outputs', [])
              by_key = {o['OutputKey']: o['OutputValue'] for o in outputs}
              missing = [k for k in ('DNSName', 'CanonicalHostedZoneID') if k not in by_key]
              if missing:
                  raise Exception(f'{app_name}: ELB stack {stack} is missing output(s) {", ".join(missing)}')
              return by_key['DNSName'], by_key['CanonicalHostedZoneID']

          def handler(event, context):
              # Config is local to this function; only the app stack lookup is remote.
              # No region_name on the SSM client: boto3 defaults to the function's own
              # region, which is where this stack created the parameter.
              ssm = boto3.client('ssm')
              cfn = boto3.client('cloudformation', region_name=os.environ['TARGET_REGION'])

              resp = ssm.get_parameter(Name=os.environ['HOSTED_ZONE_MAP_PARAMETER'])
              hosted_zone_map = json.loads(resp['Parameter']['Value'])

              health_path = os.environ['HEALTH_CHECK_PATH']
              failures = []

              for app_name, entry in hosted_zone_map.items():
                  try:
                      alb_dns, _ = resolve_alb(cfn, app_name, entry)
                  except Exception as e:
                      failures.append(f'{app_name}: could not resolve load balancer — {e}')
                      continue

                  record_name = entry['recordName']
                  try:
                      status = probe(alb_dns, record_name, health_path,
                                     int(entry.get('port', 443)),
                                     entry.get('verifyCertificate', True))
                  except ssl.SSLCertVerificationError as e:
                      # The ALB path: unmatched SNI falls back to the listener's default
                      # cert, which we reject by name. Likeliest failure on a first run.
                      failures.append(f'{app_name}: the certificate on {alb_dns} does not '
                                      f'cover {record_name} ({e.verify_message or e}) — the '
                                      'cutover would fail at TLS, before any rule is read')
                      continue
                  except ssl.SSLError as e:
                      # Same problem, other shape: some servers refuse unknown SNI
                      # outright instead of offering a default cert.
                      failures.append(f'{app_name}: TLS handshake with {alb_dns} failed for '
                                      f'{record_name} ({e}) — the listener may have no '
                                      'certificate configured for this name')
                      continue
                  except Exception as e:
                      failures.append(f'{app_name}: {e}')
                      continue

                  # A redirect means the rule matched and the app answered. On 443 that is
                  # the app's own redirect, not the port 80 listener's blanket 301.
                  if status == 200 or 300 <= status < 400:
                      logger.info(f'{app_name}: OK (HTTP {status} for {record_name} via {alb_dns})')
                  else:
                      failures.append(f'{app_name}: HTTP {status} for {record_name}')

              if failures:
                  raise Exception(f"Health check failed: {'; '.join(failures)}")

              logger.info(f'All {len(hosted_zone_map)} apps healthy')
              return {'status': 'ok', 'checked': len(hosted_zone_map)}

  ####
  # IAM — Route 53 Failover Lambda
  ####

  Route53LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-r53-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
        # Local — see the equivalent note on LambdaRole.
        - PolicyName: ReadSSMParameters
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${OrgName}/dr/${EnvName}/hosted-zone-map
        # The ALB DNS name and its canonical hosted zone ID are read from the ELB
        # stack's outputs rather than configured, so this Lambda describes stacks
        # in the target region.
        - PolicyName: DescribeELBStacks
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResource
                Resource: !Sub arn:aws:cloudformation:${TargetRegion}:${AWS::AccountId}:stack/*
        - PolicyName: Route53Cutover
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                Resource: arn:aws:route53:::hostedzone/*
              - Effect: Allow
                Action:
                  - route53:GetChange
                Resource: arn:aws:route53:::change/*

  ####
  # CloudWatch Logs — Route 53 Failover Lambda
  ####

  Route53LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-r53
      RetentionInDays: !Ref LogRetentionDays

  ####
  # Lambda — Route 53 Failover
  ####

  Route53LambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn: Route53LambdaLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-r53
      # Lambda Description is capped at 256 characters.
      Description: >
        DNS cutover — resolves each app's ALB in the target region from its ELB stack
        outputs and UPSERTs Route 53 alias A records to route traffic to it, one
        ChangeBatch per hosted zone.
      Handler: index.handler
      Role: !GetAtt Route53LambdaRole.Arn
      Runtime: python3.12
      # aws:invokeLambdaFunction gives up at 5 minutes, so a longer timeout here
      # would only mean the function runs on after SSM has failed the step.
      Timeout: 290
      Environment:
        Variables:
          HOSTED_ZONE_MAP_PARAMETER: !Sub /${OrgName}/dr/${EnvName}/hosted-zone-map
          TARGET_REGION: !Ref TargetRegion
          # Wording only — lands in the Route 53 change history, which is an audit surface.
          DIRECTION: !Ref Direction
      Code:
        ZipFile: |
          import json, os
          import boto3
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          # An external ELB stack is named directly; a nested one gets a generated
          # name, so it is reached through its parent app stack and logical id.
          def resolve_alb(cfn, app_name, entry):
              stack = entry.get('elbStackName')
              if not stack:
                  app_stack = entry.get('appStackName')
                  if not app_stack:
                      raise Exception(f'{app_name}: no elbStackName or appStackName')
                  stack = cfn.describe_stack_resource(
                      StackName=app_stack,
                      LogicalResourceId=entry.get('elbLogicalId', 'ELBStack')
                  )['StackResourceDetail']['PhysicalResourceId']

              outputs = cfn.describe_stacks(StackName=stack)['Stacks'][0].get('Outputs', [])
              by_key = {o['OutputKey']: o['OutputValue'] for o in outputs}
              missing = [k for k in ('DNSName', 'CanonicalHostedZoneID') if k not in by_key]
              if missing:
                  raise Exception(f'{app_name}: {stack} missing output(s) {", ".join(missing)}')
              return by_key['DNSName'], by_key['CanonicalHostedZoneID']

          def handler(event, context):
              # Three tiers of region here, and they are not the same thing:
              #   local  — the config this stack created, in this function's own region
              #   remote — the app stacks being promoted, in TargetRegion
              #   global — Route 53, which has no region at all
              ssm = boto3.client('ssm')
              cfn = boto3.client('cloudformation', region_name=os.environ['TARGET_REGION'])
              r53 = boto3.client('route53')
              direction = os.environ['DIRECTION']

              hz_resp = ssm.get_parameter(Name=os.environ['HOSTED_ZONE_MAP_PARAMETER'])
              hosted_zone_map = json.loads(hz_resp['Parameter']['Value'])

              # Resolve every app before submitting anything: a partial cutover would
              # leave DNS split across regions.
              resolved, failures = {}, []
              for app_name, entry in hosted_zone_map.items():
                  try:
                      resolved[app_name] = resolve_alb(cfn, app_name, entry)
                  except Exception as e:
                      failures.append(str(e))
              if failures:
                  raise Exception(f"Aborting: could not resolve target ALB for {len(failures)} app(s): "
                                  f"{'; '.join(failures)}. No Route 53 changes were submitted.")

              hz_changes = {}
              for app_name, zone_info in hosted_zone_map.items():
                  alb_dns, alb_hosted_zone_id = resolved[app_name]
                  hz_id = zone_info['hostedZoneId']
                  change = {
                      'Action': 'UPSERT',
                      'ResourceRecordSet': {
                          'Name': zone_info['recordName'],
                          'Type': 'A',
                          'AliasTarget': {
                              'HostedZoneId': alb_hosted_zone_id,
                              'DNSName': alb_dns,
                              'EvaluateTargetHealth': False
                          }
                      }
                  }
                  hz_changes.setdefault(hz_id, []).append(change)

              change_ids = []
              for hz_id, change_list in hz_changes.items():
                  resp = r53.change_resource_record_sets(
                      HostedZoneId=hz_id,
                      ChangeBatch={
                          'Comment': f'DR {direction} DNS cutover — {len(change_list)} records',
                          'Changes': change_list
                      }
                  )
                  change_ids.append(resp['ChangeInfo']['Id'])
                  logger.info(f'Updated {len(change_list)} records in hosted zone {hz_id} (change {resp["ChangeInfo"]["Id"]})')

              # aws:invokeLambdaFunction caps the invocation at 5 minutes regardless of
              # the function's own Timeout, so this must finish well inside that. The
              # propagation wait lives in the runbook's aws:sleep step, not here.
              waiter = r53.get_waiter('resource_record_sets_changed')
              for change_id in change_ids:
                  logger.info(f'Waiting for Route 53 change {change_id} to reach INSYNC...')
                  waiter.wait(Id=change_id, WaiterConfig={'Delay': 10, 'MaxAttempts': 24})
                  logger.info(f'Change {change_id} is INSYNC')

              total = sum(len(v) for v in hz_changes.values())
              logger.info(f'Route 53 cutover complete: {total} records across {len(hz_changes)} hosted zones — all INSYNC')
              return {'status': 'ok', 'updated': total, 'hostedZones': len(hz_changes)}

  ####
  # IAM — SSM Automation Role
  ####

  SSMAutomationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-ssm-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: InvokeLambdas
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt ListenerRuleLambdaFunction.Arn
                  - !GetAtt LambdaFunction.Arn
                  - !GetAtt Route53LambdaFunction.Arn
        - PolicyName: PublishSNS
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource:
                  Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'

  ####
  # SSM Automation Document
  ####

  DNSFailoverRunbook:
    Type: AWS::SSM::Document
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      DocumentType: Automation
      # Direction is in the name so the operator picks the runbook by what it does. The
      # failback stack therefore publishes a distinct document, not a variant of this one.
      Name: !Sub ${OrgName}-${EnvName}-dr-dns-${Direction}-runbook
      # Default is Replace, which deletes and recreates the document. The document is
      # explicitly named, so a replacement cannot happen without renaming it and the
      # update fails outright. NewVersion publishes a new default version in place.
      UpdateMethod: NewVersion
      Content:
        schemaVersion: '0.3'
        description: !Sub >-
          PCHC DR DNS ${Direction} runbook — cuts traffic over to ${TargetRegion}. Five steps:
          (1) Add each app's live hostname to its ${TargetRegion} ALB listener rule.
          (2) Health check all PCHC apps on the ${TargetRegion} ALBs.
          (3) DR Manager approval gate — identity and timestamp recorded for BSP audit.
          (4) Route 53 DNS cutover to the ${TargetRegion} ALBs.
          (5) SNS all-clear notification.
          Start manually from the AWS Console after the corresponding workflow succeeds
          and validation is complete.
        assumeRole: !GetAtt SSMAutomationRole.Arn
        parameters:
          ListenerRuleLambdaArn:
            type: String
            default: !GetAtt ListenerRuleLambdaFunction.Arn
            description: ARN of the listener rule Lambda.
          HealthCheckLambdaArn:
            type: String
            default: !GetAtt LambdaFunction.Arn
            description: ARN of the health check Lambda.
          Route53FailoverLambdaArn:
            type: String
            default: !GetAtt Route53LambdaFunction.Arn
            description: ARN of the Route 53 failover Lambda.
          SNSTopicArn:
            type: String
            default:
              Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
            description: SNS topic for approval notification and all-clear.
          Approvers:
            type: StringList
            default:
              Fn::Split:
                - ','
                - !Ref ApproverIamArns
            description: >-
              IAM user or role ARNs authorised to approve the DNS cutover.
              Defaults to ApproverIamArns supplied at deploy time.
              Example: ["arn:aws:iam::123456789012:user/dr-manager"]
        mainSteps:
          # Before the gate on purpose: nothing resolves here yet, so this moves no
          # traffic, and it lets the health check exercise the rule before approval.
          - name: AddListenerHostHeaders
            action: aws:invokeLambdaFunction
            description: !Sub >-
              Add each app's live hostname to the host-header condition of its ALB
              listener rule in ${TargetRegion}, so the ALB routes the traffic the
              cutover is about to send it. Idempotent — a no-op when already correct.
            inputs:
              FunctionName: '{{ ListenerRuleLambdaArn }}'
              Payload: '{}'
            nextStep: HealthCheck
            onFailure: Abort
          - name: HealthCheck
            action: aws:invokeLambdaFunction
            description: !Sub Verify all PCHC apps are healthy on the ${TargetRegion} ALBs.
            inputs:
              FunctionName: '{{ HealthCheckLambdaArn }}'
              Payload: '{}'
            nextStep: ApproveCutover
            onFailure: Abort
          - name: ApproveCutover
            action: aws:approve
            description: >-
              DR Manager approval gate. Approver identity and timestamp are recorded
              in the SSM execution log for BSP audit purposes.
            timeoutSeconds: !Ref ApprovalTimeoutSeconds
            inputs:
              NotificationArn: '{{ SNSTopicArn }}'
              # >- not >: SSM validates Message against .{1,4096} and `.` will not match
              # the trailing newline. Two literals, not one template: this is the last
              # human checkpoint and has to state the specific consequence.
              Message: !If
                - IsFailback
                - !Sub >-
                    PCHC health check passed for all applications on ${TargetRegion}. Approve to
                    proceed with Route 53 DNS cutover BACK to the live region. This action returns
                    all production traffic from the DR region to ${TargetRegion} — only approve
                    once the data resync cutover point has been agreed and confirmed.
                - !Sub >-
                    PCHC DR health check passed for all applications on ${TargetRegion}. Approve to
                    proceed with Route 53 DNS cutover to the DR region. This action routes all
                    production traffic to DR ALBs — only approve after completing UAT validation.
              MinRequiredApprovals: 1
              Approvers: '{{ Approvers }}'
            nextStep: Route53Cutover
            onFailure: Abort
          - name: Route53Cutover
            action: aws:invokeLambdaFunction
            description: !Sub Update Route 53 alias A records to point to the ${TargetRegion} ALBs.
            inputs:
              FunctionName: '{{ Route53FailoverLambdaArn }}'
              Payload: '{}'
            nextStep: AwaitPropagation
            onFailure: Abort
          - name: AwaitPropagation
            action: aws:sleep
            description: >-
              Wait for recursive resolver caches to expire before declaring the cutover
              complete. Lives here rather than inside the Lambda because
              aws:invokeLambdaFunction caps an invocation at 5 minutes, which a
              propagation wait of any useful length would exceed.
            inputs:
              Duration: !Sub PT${PropagationWaitSeconds}S
            nextStep: NotifyAllClear
            onFailure: Abort
          - name: NotifyAllClear
            action: aws:executeAwsApi
            description: Publish all-clear SNS notification.
            isEnd: true
            inputs:
              Service: sns
              Api: Publish
              TopicArn: '{{ SNSTopicArn }}'
              Subject: !If
                - IsFailback
                - PCHC DNS Failback Cutover Complete
                - PCHC DR DNS Cutover Complete
              Message: !If
                - IsFailback
                - !Sub >-
                    Route 53 DNS failback cutover to ${TargetRegion} completed successfully.
                    All PCHC application traffic has returned to the live region. Proceed with
                    post-cutover verification per the failback runbook checklist, then tear
                    down the DR region's paid resources.
                - !Sub >-
                    Route 53 DNS failover cutover to ${TargetRegion} completed successfully.
                    All PCHC application traffic is now routed to DR ALBs. Proceed with
                    post-cutover verification per the DR runbook checklist.

Outputs:

  ListenerRuleLambdaArn:
    Description: ARN of the listener rule Lambda — pass this to the SSM runbook.
    Value: !GetAtt ListenerRuleLambdaFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-ListenerRuleLambdaArn

  ListenerRuleLambdaName:
    Description: Name of the listener rule Lambda — use this to invoke manually for testing.
    Value: !Ref ListenerRuleLambdaFunction
    Export:
      Name: !Sub ${AWS::StackName}-ListenerRuleLambdaName

  LambdaFunctionArn:
    Description: ARN of the health check Lambda — pass this to the SSM runbook.
    Value: !GetAtt LambdaFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-LambdaArn

  LambdaFunctionName:
    Description: Name of the health check Lambda — use this to invoke manually for testing.
    Value: !Ref LambdaFunction
    Export:
      Name: !Sub ${AWS::StackName}-LambdaName

  Route53FailoverLambdaArn:
    Description: ARN of the Route 53 failover Lambda — pass this to the SSM runbook.
    Value: !GetAtt Route53LambdaFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-Route53LambdaArn

  Route53FailoverLambdaName:
    Description: Name of the Route 53 failover Lambda — use this to invoke manually for testing.
    Value: !Ref Route53LambdaFunction
    Export:
      Name: !Sub ${AWS::StackName}-Route53LambdaName

  SSMDocumentName:
    Description: >
      Name of the SSM Automation Document — start this manually from the AWS Console
      after the corresponding workflow succeeds and validation is complete.
    Value: !Ref DNSFailoverRunbook
    Export:
      Name: !Sub ${AWS::StackName}-SSMDocumentName
