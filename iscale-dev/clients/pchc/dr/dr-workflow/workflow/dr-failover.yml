name: DR Failover

on:
  workflow_dispatch:
    inputs:
      app:
        description: Application
        required: true
        type: choice
        options:
          - pas6
          - pddts
          - pddts-eod
          - mis
          - mis-etl
          - cics
          - smartapi
          - dsapp
          - paygate
          - pesonet
          - philpass
      target_env:
        description: Target DR environment
        required: true
        type: choice
        options:
          - uat-dr
          - prod-dr
        default: uat-dr

permissions:
  id-token: write
  contents: read

concurrency:
  group: dr-failover-${{ inputs.app }}-${{ inputs.target_env }}
  cancel-in-progress: false

jobs:
  pre-flight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    environment: dr-deploy
    outputs:
      region:                ${{ steps.cfg.outputs.region }}
      app_stack:             ${{ steps.cfg.outputs.app_stack }}
      sns_stack:             ${{ steps.cfg.outputs.sns_stack }}
      failover_engine_stack: ${{ steps.cfg.outputs.failover_engine_stack }}

  failover:
    name: DR Failover
    needs: pre-flight
    runs-on: ubuntu-latest
    timeout-minutes: 120