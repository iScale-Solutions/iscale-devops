name: DR Failover

on:
  workflow_dispatch:
    inputs:
      app:
        description: Application
        required: true
        type: choice
        options:
          - pas6
          - pddts
          - pddts-eod
          - mis
          - mis-etl
          - cics
          - smartapi
          - dsapp
          - paygate
          - pesonet
          - philpass
      target_env:
        description: Target DR environment
        required: true
        type: choice
        options:
          - uat-dr
          - prod-dr
        default: uat-dr

permissions:
  id-token: write
  contents: read

concurrency:
  group: dr-failover-${{ inputs.app }}-${{ inputs.target_env }}
  cancel-in-progress: false

jobs:
  pre-flight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    environment: dr-deploy
    outputs:
      region:                ${{ steps.cfg.outputs.region }}
      app_stack:             ${{ steps.cfg.outputs.app_stack }}
      sns_stack:             ${{ steps.cfg.outputs.sns_stack }}
      failover_engine_stack: ${{ steps.cfg.outputs.failover_engine_stack }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load app config
        id: cfg
        run: |
          APP="${{ inputs.app }}"
          ENV="${{ inputs.target_env }}"
          CFG=$(cat dr-config/${APP}.json)

          REGION=$(echo "$CFG"                  | jq -r ".${ENV}.region")
          APP_STACK=$(echo "$CFG"               | jq -r ".${ENV}.app_stack_name")
          SNS_STACK=$(echo "$CFG"               | jq -r ".${ENV}.sns_stack_name")
          NETWORK_STACK=$(echo "$CFG"           | jq -r ".${ENV}.network_stack_name")
          FAILOVER_ENGINE=$(echo "$CFG"         | jq -r ".failover_engine_stack")
          DB_INSTANCE_ID=$(echo "$CFG"          | jq -r ".${ENV}.db_instance_identifier // \"\"")
          USE_PITR=$(echo "$CFG"                | jq -r ".${ENV}.use_pitr")

          for VAR_NAME in REGION APP_STACK NETWORK_STACK FAILOVER_ENGINE USE_PITR; do
            VAL="${!VAR_NAME}"
            if [ -z "$VAL" ] || [ "$VAL" = "null" ]; then
              echo "ERROR: Required config field '$VAR_NAME' is missing or null in dr-config/${APP}.json for env '${ENV}'"
              exit 1
            fi
          done

          {
            echo "region=$REGION"
            echo "app_stack=$APP_STACK"
            echo "sns_stack=$SNS_STACK"
            echo "network_stack=$NETWORK_STACK"
            echo "failover_engine_stack=$FAILOVER_ENGINE"
            echo "db_instance_identifier=$DB_INSTANCE_ID"
            echo "use_pitr=$USE_PITR"
          } >> "$GITHUB_OUTPUT"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DR_DEPLOY_ROLE_ARN }}
          aws-region: ${{ steps.cfg.outputs.region }}
      
      - name: Verify network stack is healthy
        run: |
          STACK="${{ steps.cfg.outputs.network_stack }}"
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Network stack status: $STATUS"

          if [[ "$STATUS" != "CREATE_COMPLETE" && "$STATUS" != "UPDATE_COMPLETE" && "$STATUS" != "UPDATE_ROLLBACK_COMPLETE" ]]; then
            echo "ERROR: Network stack '$STACK' is not in a healthy state ($STATUS)."
            echo "Resolve the stack before attempting failover."
            exit 1
          fi
        
      - name: Verify app stack is healthy
        run: |
          STACK="${{ steps.cfg.outputs.app_stack }}"
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "App stack status: $STATUS"

          if [[ "$STATUS" != "CREATE_COMPLETE" && "$STATUS" != "UPDATE_COMPLETE" && "$STATUS" != "UPDATE_ROLLBACK_COMPLETE" ]]; then
            echo "ERROR: App stack '$STACK' is not in a healthy state ($STATUS)."
            echo "Resolve the stack before attempting failover."
            exit 1
          fi
      
      - name: Verify automated backups exist (PITR path)
        if: steps.cfg.outputs.use_pitr == 'true'
        run: |
          DB_ID="${{ steps.cfg.outputs.db_instance_identifier }}"

          if [ -z "$DB_ID" ]; then
            echo "SKIP: db_instance_identifier not set for this app — skipping backup check."
            exit 0
          fi

          BACKUP_STATUS=$(aws rds describe-db-instance-automated-backups \
            --db-instance-identifier "$DB_ID" \
            --query "DBInstanceAutomatedBackups[?Status=='replicating' || Status=='retained'].Status" \
            --output text)

          if [ -z "$BACKUP_STATUS" ]; then
            echo "ERROR: No replicating or retained automated backups found for '$DB_ID'."
            echo "Cross-region backup replication may not be active or may not have completed"
            echo "its first cycle. Check EnableCrossRegionBackupReplication on the live app stack."
            exit 1
          fi

          echo "Automated backups available for '$DB_ID': $BACKUP_STATUS"

  failover:
    name: DR Failover
    needs: pre-flight
    runs-on: ubuntu-latest
    environment: dr-deploy
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load app config
        id: cfg
        run: |
          APP="${{ inputs.app }}"
          ENV="${{ inputs.target_env }}"
          CFG=$(cat dr-config/${APP}.json)

          REGION=$(echo "$CFG"               | jq -r ".${ENV}.region")
          APP_STACK=$(echo "$CFG"            | jq -r ".${ENV}.app_stack_name")
          NETWORK_STACK=$(echo "$CFG"        | jq -r ".${ENV}.network_stack_name")
          NETWORK_TEMPLATE=$(echo "$CFG"     | jq -r ".${ENV}.network_template_url")
          FAILOVER_ENGINE=$(echo "$CFG"      | jq -r ".failover_engine_stack")
          ORG_NAME=$(echo "$CFG"             | jq -r ".org_name")
          APP_NAME="${{ inputs.app }}"
          USE_PITR=$(echo "$CFG"             | jq -r ".${ENV}.use_pitr")
          DB_INSTANCE_ID=$(echo "$CFG"       | jq -r ".${ENV}.db_instance_identifier // \"\"")
          PITR_TARGET=$(echo "$CFG"          | jq -r ".${ENV}.pitr_target_identifier // \"\"")
          PITR_SSM=$(echo "$CFG"             | jq -r ".${ENV}.pitr_endpoint_ssm_path // \"\"")
          EFS_VAULT=$(echo "$CFG"            | jq -r ".${ENV}.efs_backup_vault_name // \"\"")
          EFS_SSM=$(echo "$CFG"              | jq -r ".${ENV}.efs_id_ssm_path // \"\"")
          RS_CLUSTER=$(echo "$CFG"           | jq -r ".${ENV}.redshift_cluster_identifier // \"\"")

          for VAR_NAME in REGION APP_STACK NETWORK_STACK NETWORK_TEMPLATE FAILOVER_ENGINE ORG_NAME USE_PITR; do
            VAL="${!VAR_NAME}"
            if [ -z "$VAL" ] || [ "$VAL" = "null" ]; then
              echo "ERROR: Required config field '$VAR_NAME' is missing or null in dr-config/${APP}.json for env '${ENV}'"
              exit 1
            fi
          done

          {
            echo "region=$REGION"
            echo "app_stack=$APP_STACK"
            echo "network_stack=$NETWORK_STACK"
            echo "network_template=$NETWORK_TEMPLATE"
            echo "failover_engine_stack=$FAILOVER_ENGINE"
            echo "org_name=$ORG_NAME"
            echo "app_name=$APP_NAME"
            echo "use_pitr=$USE_PITR"
            echo "db_instance_identifier=$DB_INSTANCE_ID"
            echo "pitr_target_identifier=$PITR_TARGET"
            echo "pitr_endpoint_ssm_path=$PITR_SSM"
            echo "efs_backup_vault_name=$EFS_VAULT"
            echo "efs_id_ssm_path=$EFS_SSM"
            echo "redshift_cluster_identifier=$RS_CLUSTER"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DR_DEPLOY_ROLE_ARN }}
          aws-region: ${{ steps.cfg.outputs.region }}
      
      - name: Resolve PITR network outputs from app stack
        id: pitr
        if: steps.cfg.outputs.use_pitr == 'true'
        run: |
          APP_STACK="${{ steps.cfg.outputs.app_stack }}"

          PITR_SUBNET_GROUP=$(aws cloudformation describe-stacks \
            --stack-name "$APP_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DBStandbySubnetGroup'].OutputValue" \
            --output text)

          PITR_SG_ID=$(aws cloudformation describe-stacks \
            --stack-name "$APP_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DBStandbySecurityGroupId'].OutputValue" \
            --output text)

          [[ -n "$PITR_SUBNET_GROUP" && "$PITR_SUBNET_GROUP" != "None" ]] || {
            echo "ERROR: DBStandbySubnetGroup output missing from $APP_STACK"
            exit 1
          }
          [[ -n "$PITR_SG_ID" && "$PITR_SG_ID" != "None" ]] || {
            echo "ERROR: DBStandbySecurityGroupId output missing from $APP_STACK"
            exit 1
          }

          echo "pitr_subnet_group=$PITR_SUBNET_GROUP" >> "$GITHUB_OUTPUT"
          echo "pitr_security_group_id=$PITR_SG_ID"   >> "$GITHUB_OUTPUT"

          echo "PITR subnet group:    $PITR_SUBNET_GROUP"
          echo "PITR security group:  $PITR_SG_ID"

      
      - name: Resolve DR DB secret ARN
        id: secrets
        run: |
          APP_STACK="${{ steps.cfg.outputs.app_stack }}"

          DR_DB_SECRET_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$APP_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DRDBSecretArn'].OutputValue" \
            --output text 2>/dev/null || echo "")

          echo "dr_db_secret_arn=$DR_DB_SECRET_ARN" >> "$GITHUB_OUTPUT"
          echo "DR DB secret ARN: ${DR_DB_SECRET_ARN:-not set}"

      - name: Get state machine ARN
        id: sfn
        run: |
          FAILOVER_ENGINE="${{ steps.cfg.outputs.failover_engine_stack }}"

          STATE_MACHINE_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$FAILOVER_ENGINE" \
            --query "Stacks[0].Outputs[?OutputKey=='StateMachineArn'].OutputValue" \
            --output text)

          [[ "$STATE_MACHINE_ARN" =~ ^arn:aws:states: ]] || {
            echo "ERROR: StateMachineArn not resolved from $FAILOVER_ENGINE"
            exit 1
          }

          BACKUP_ROLE_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$FAILOVER_ENGINE" \
            --query "Stacks[0].Outputs[?OutputKey=='BackupRestoreRoleArn'].OutputValue" \
            --output text)

          echo "state_machine_arn=$STATE_MACHINE_ARN" >> "$GITHUB_OUTPUT"
          echo "backup_role_arn=$BACKUP_ROLE_ARN"     >> "$GITHUB_OUTPUT"
          echo "State machine ARN and backup role ARN resolved."

      - name: Start DR failover execution
        id: start
        run: |
          APP="${{ inputs.app }}"
          ENV="${{ inputs.target_env }}"

          INPUT=$(jq -n \
            --arg  app_name                     "${{ steps.cfg.outputs.app_name }}" \
            --arg  org_name                     "${{ steps.cfg.outputs.org_name }}" \
            --argjson use_pitr                  "${{ steps.cfg.outputs.use_pitr }}" \
            --arg  network_stack_name           "${{ steps.cfg.outputs.network_stack }}" \
            --arg  app_stack_name               "${{ steps.cfg.outputs.app_stack }}" \
            --arg  network_template_url         "${{ steps.cfg.outputs.network_template }}" \
            --arg  db_instance_identifier       "${{ steps.cfg.outputs.db_instance_identifier }}" \
            --arg  dr_db_secret_arn             "${{ steps.secrets.outputs.dr_db_secret_arn }}" \
            --arg  pitr_target_identifier       "${{ steps.cfg.outputs.pitr_target_identifier }}" \
            --arg  pitr_endpoint_ssm_path       "${{ steps.cfg.outputs.pitr_endpoint_ssm_path }}" \
            --arg  pitr_subnet_group            "${{ steps.pitr.outputs.pitr_subnet_group }}" \
            --arg  pitr_security_group_id       "${{ steps.pitr.outputs.pitr_security_group_id }}" \
            --arg  snapshot_identifier          "" \
            --arg  db_master_password           "" \
            --arg  redshift_cluster_identifier  "${{ steps.cfg.outputs.redshift_cluster_identifier }}" \
            --arg  redshift_snapshot_identifier "" \
            --arg  efs_backup_vault_name        "${{ steps.cfg.outputs.efs_backup_vault_name }}" \
            --arg  efs_id_ssm_path              "${{ steps.cfg.outputs.efs_id_ssm_path }}" \
            --arg  backup_role_arn   "${{ steps.sfn.outputs.backup_role_arn }}" \
            --arg  sns_topic_arn                "" \
            '{
              app_name:                    $app_name,
              org_name:                    $org_name,
              use_pitr:                    $use_pitr,
              network_stack_name:          $network_stack_name,
              app_stack_name:              $app_stack_name,
              network_template_url:        $network_template_url,
              db_instance_identifier:      $db_instance_identifier,
              dr_db_secret_arn:            $dr_db_secret_arn,
              pitr_target_identifier:      $pitr_target_identifier,
              pitr_endpoint_ssm_path:      $pitr_endpoint_ssm_path,
              pitr_subnet_group:           $pitr_subnet_group,
              pitr_security_group_id:      $pitr_security_group_id,
              snapshot_identifier:         $snapshot_identifier,
              db_master_password:          $db_master_password,
              redshift_cluster_identifier: $redshift_cluster_identifier,
              redshift_snapshot_identifier:$redshift_snapshot_identifier,
              efs_backup_vault_name:       $efs_backup_vault_name,
              efs_id_ssm_path:             $efs_id_ssm_path,
              backup_role_arn:             $backup_role_arn,
              sns_topic_arn:               $sns_topic_arn
            }')

          EXECUTION_ARN=$(aws stepfunctions start-execution \
            --state-machine-arn "${{ steps.sfn.outputs.state_machine_arn }}" \
            --input "$INPUT" \
            --query "executionArn" \
            --output text)

          echo "execution_arn=$EXECUTION_ARN" >> "$GITHUB_OUTPUT"
          echo "Failover execution started: $EXECUTION_ARN"
      
      - name: Monitor failover execution
        id: monitor
        run: |
          EXECUTION_ARN="${{ steps.start.outputs.execution_arn }}"
          CONSOLE_URL="https://${{ steps.cfg.outputs.region }}.console.aws.amazon.com/states/home?region=${{ steps.cfg.outputs.region }}#/executions/details/${EXECUTION_ARN}"

          echo "Monitoring: $EXECUTION_ARN"
          echo "Console: $CONSOLE_URL"

          while true; do
            STATUS=$(aws stepfunctions describe-execution \
              --execution-arn "$EXECUTION_ARN" \
              --query "status" \
              --output text)

            echo "Status: $STATUS"

            if [ "$STATUS" = "SUCCEEDED" ]; then
              echo "Failover execution SUCCEEDED."
              exit 0
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "TIMED_OUT" ] || [ "$STATUS" = "ABORTED" ]; then
              echo "ERROR: Failover execution $STATUS."
              echo "Check the Step Functions console for details: $CONSOLE_URL"
              exit 1
            fi

            sleep 60
          done
    
      - name: Notify success
        if: steps.monitor.outcome == 'success'
        run: |
          SNS_ARN=""  # TODO: source sns_topic_arn from GitHub Secrets or config

          if [ -z "$SNS_ARN" ]; then
            echo "No SNS topic ARN available — skipping notification."
            exit 0
          fi

          aws sns publish \
            --topic-arn "$SNS_ARN" \
            --subject "DR Failover Complete — ${{ inputs.app }} / ${{ inputs.target_env }}" \
            --message "DR failover completed for ${{ inputs.app }} (${{ inputs.target_env }}). Network stack and app stack are UPDATE_COMPLETE. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify failure
        if: steps.monitor.outcome == 'failure' || steps.monitor.outcome == 'cancelled'
        run: |
          SNS_ARN=""  # TODO: source sns_topic_arn from GitHub Secrets or config

          if [ -z "$SNS_ARN" ]; then
            echo "No SNS topic ARN available — skipping notification."
            exit 0
          fi

          MSG="DR failover FAILED for ${{ inputs.app }} (${{ inputs.target_env }}). Check the run and Step Functions console for details."
          if [ "${{ steps.monitor.outcome }}" = "cancelled" ]; then
            MSG="DR failover monitor was cancelled (job timeout). The Step Functions execution may still be running. Check: https://${{ steps.cfg.outputs.region }}.console.aws.amazon.com/states/home"
          fi

          aws sns publish \
            --topic-arn "$SNS_ARN" \
            --subject "DR Failover FAILED — ${{ inputs.app }} / ${{ inputs.target_env }}" \
            --message "$MSG Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
