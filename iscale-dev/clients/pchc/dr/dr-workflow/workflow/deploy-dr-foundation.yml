name: Deploy DR Foundation

on:
  workflow_dispatch:
    inputs:
      app:
        description: Application
        required: true
        type: choice
        options:
          - pas6
          - pddts
          - pddts-eod
          - mis
          - mis-etl
          - cics
          - smartapi
          - dsapp
          - paygate
          - pesonet
          - philpass
      target_env:
        description: Target DR environment
        required: true
        type: choice
        options:
          - uat-dr
          - prod-dr
        default: uat-dr