name: Deploy DR Foundation

on:
  workflow_dispatch:
    inputs:
      app:
        description: Application
        required: true
        type: choice
        options:
          - pas6
          - pddts
          - pddts-eod
          - mis
          - mis-etl
          - cics
          - smartapi
          - dsapp
          - paygate
          - pesonet
          - philpass
      target_env:
        description: Target DR environment
        required: true
        type: choice
        options:
          - uat-dr
          - prod-dr
        default: uat-dr

jobs:
  deploy-dr-foundation:
    name: Deploy DR Foundation
    runs-on: ubuntu-latest
    environment: dr-deploy
    outputs:
      region:         ${{ steps.cfg.outputs.region }}
      app_stack:      ${{ steps.cfg.outputs.app_stack }}
      sns_stack:      ${{ steps.cfg.outputs.sns_stack }}
      has_codedeploy: ${{ steps.cfg.outputs.has_codedeploy }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load app config
        id: cfg
        run: |
          APP="${{ inputs.app }}"
          ENV="${{ inputs.target_env }}"
          CFG=$(cat dr-config/${APP}.json)

          REGION=$(echo "$CFG"             | jq -r ".${ENV}.region")
          NETWORK_STACK=$(echo "$CFG"      | jq -r ".${ENV}.network_stack_name")
          APP_STACK=$(echo "$CFG"          | jq -r ".${ENV}.app_stack_name")
          SNS_STACK=$(echo "$CFG"          | jq -r ".${ENV}.sns_stack_name")
          SNS_TEMPLATE=$(echo "$CFG"       | jq -r ".${ENV}.sns_template_url")
          NETWORK_TEMPLATE=$(echo "$CFG"   | jq -r ".${ENV}.network_template_url")
          APP_TEMPLATE=$(echo "$CFG"       | jq -r ".${ENV}.app_template_url")
          HAS_CODEDEPLOY=$(echo "$CFG"     | jq -r ".has_codedeploy")

          {
            echo "region=$REGION"
            echo "network_stack=$NETWORK_STACK"
            echo "app_stack=$APP_STACK"
            echo "sns_stack=$SNS_STACK"
            echo "sns_template=$SNS_TEMPLATE"
            echo "network_template=$NETWORK_TEMPLATE"
            echo "app_template=$APP_TEMPLATE"
            echo "has_codedeploy=$HAS_CODEDEPLOY"
          } >> "$GITHUB_OUTPUT"
    
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DR_DEPLOY_ROLE_ARN }}
          aws-region: ${{ steps.cfg.outputs.region }}
      
      # ── SNS stack (shared per DR region) ─────────────────────

      - name: Deploy SNS stack
        run: |
          APP="${{ inputs.app }}"
          ENV="${{ inputs.target_env }}"
          CFG=$(cat dr-config/${APP}.json)

          PARAMS=$(echo "$CFG" | jq -r \
            ".${ENV}.sns_params | to_entries[] | \"\(.key)=\(.value)\"")

          aws cloudformation deploy \
            --stack-name "${{ steps.cfg.outputs.sns_stack }}" \
            --template-url "${{ steps.cfg.outputs.sns_template }}" \
            --parameter-overrides $PARAMS \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      # ── L1: Network stack ─────────────────────────────────────────────────

      - name: Deploy Network stack
        run: |
          APP="${{ inputs.app }}"
          ENV="${{ inputs.target_env }}"
          CFG=$(cat dr-config/${APP}.json)

          PARAMS=$(echo "$CFG" | jq -r \
            ".${ENV}.network_params | to_entries[] | \"\(.key)=\(.value)\"")

          aws cloudformation deploy \
            --stack-name "${{ steps.cfg.outputs.network_stack }}" \
            --template-url "${{ steps.cfg.outputs.network_template }}" \
            --parameter-overrides $PARAMS \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
      
    # ── L2: App stack (standby — DeployPaidResources=false) ──────────────

      - name: Deploy App stack (standby)
        run: |
          APP="${{ inputs.app }}"
          ENV="${{ inputs.target_env }}"
          CFG=$(cat dr-config/${APP}.json)

          PARAMS=$(echo "$CFG" | jq -r \
            ".${ENV}.app_params | to_entries[] | \"\(.key)=\(.value)\"")

          aws cloudformation deploy \
            --stack-name "${{ steps.cfg.outputs.app_stack }}" \
            --template-url "${{ steps.cfg.outputs.app_template }}" \
            --parameter-overrides $PARAMS DeployPaidResources=false \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
    
    # ── Enable CRR from live region ───────────────────────────────────────

      - name: Update Code Deploy Artifact CRR SSM parameter in live region
        if: steps.cfg.outputs.has_codedeploy == 'true'
        run: |
          APP="${{ inputs.app }}"
          ENV="${{ inputs.target_env }}"
          CFG=$(cat dr-config/${APP}.json)
          APP_STACK="${{ steps.cfg.outputs.app_stack }}"

          SSM_PARAM=$(echo "$CFG" | jq -r ".${ENV}.crr_ssm_param")

          # Get the DR artifacts bucket ARN from L2 stack outputs
          BUCKET_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$APP_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DeploymentBucketArn'].OutputValue" \
            --output text)

          # Write the ARN into the SSM parameter in the live (primary) region
          aws ssm put-parameter \
            --name "$SSM_PARAM" \
            --value "$BUCKET_ARN" \
            --type String \
            --overwrite \
            --region ap-southeast-1

          echo "CRR SSM parameter '$SSM_PARAM' updated → $BUCKET_ARN"
  
  replicate-artifacts:
    name: Replicate Code Deploy Artifacts
    needs: deploy-dr-foundation
    if: needs.deploy-dr-foundation.outputs.has_codedeploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (live region)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DR_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
      
      - name: Trigger and wait for S3 Batch Replication
        run: |
          APP="${{ inputs.app }}"
          ENV="${{ inputs.target_env }}"
          CFG=$(cat dr-config/${APP}.json)
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          STACKS=$(echo "$CFG" | jq -c ".${ENV}.codedeploy_stacks[]")

          while IFS= read -r STACK_CFG; do
            SOURCE_BUCKET=$(echo "$STACK_CFG" | jq -r ".source_bucket")
            DEST_BUCKET=$(echo "$STACK_CFG"   | jq -r ".artifacts_bucket")

            echo "Starting Batch Replication: $SOURCE_BUCKET → $DEST_BUCKET"

            JOB_ID=$(aws s3control create-job \
              --account-id "$ACCOUNT_ID" \
              --operation '{"S3ReplicateObject":{}}' \
              --manifest-generator "{
                \"S3JobManifestGenerator\": {
                  \"SourceBucket\": \"arn:aws:s3:::${SOURCE_BUCKET}\",
                  \"EnableManifestOutput\": false,
                  \"Filter\": { \"EligibleForReplication\": true },
                  \"GeneratedManifestEncryption\": { \"SSES3\": {} }
                }
              }" \
              --report '{"Enabled":false}' \
              --priority 10 \
              --role-arn "${{ secrets.S3_BATCH_ROLE_ARN }}" \
              --region ap-southeast-1 \
              --query "JobId" \
              --output text)

            echo "Job created: $JOB_ID — waiting for completion..."

            while true; do
              STATUS=$(aws s3control describe-job \
                --account-id "$ACCOUNT_ID" \
                --job-id "$JOB_ID" \
                --region ap-southeast-1 \
                --query "Job.Status" \
                --output text)

              echo "Status: $STATUS"

              if [ "$STATUS" = "Complete" ]; then
                echo "Batch Replication complete: $SOURCE_BUCKET → $DEST_BUCKET"
                break
              elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
                echo "ERROR: Batch Replication job $JOB_ID $STATUS"
                exit 1
              fi

              sleep 30
            done
          done <<< "$STACKS"
  
      - name: Verify DR artifacts buckets have content
        run: |
          APP="${{ inputs.app }}"
          ENV="${{ inputs.target_env }}"
          CFG=$(cat dr-config/${APP}.json)

          STACKS=$(echo "$CFG" | jq -c ".${ENV}.codedeploy_stacks[]")
          FAILED=0

          while IFS= read -r STACK; do
            BUCKET=$(echo "$STACK" | jq -r ".artifacts_bucket")
            COUNT=$(aws s3api list-objects-v2 \
              --bucket "$BUCKET" \
              --max-items 1 \
              --query "length(Contents)" \
              --output text 2>/dev/null || echo "0")

            if [ "$COUNT" = "None" ] || [ "$COUNT" = "0" ]; then
              echo "ERROR: DR artifacts bucket '$BUCKET' is empty — CRR may not be active yet."
              FAILED=1
            else
              echo "OK: '$BUCKET' has content."
            fi
          done <<< "$STACKS"

          [ "$FAILED" -eq 0 ] || exit 1
  
  configure-codedeploy:
    name: Configure Code Deploy
    needs: [deploy-dr-foundation, replicate-artifacts]
    if: needs.deploy-dr-foundation.outputs.has_codedeploy == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials (DR region)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DR_DEPLOY_ROLE_ARN }}
          aws-region: ${{ needs.deploy-dr-foundation.outputs.region }}

      - name: Register CodeDeploy revision
        if: needs.deploy-dr-foundation.outputs.has_codedeploy == 'true'
        run: |
          APP="${{ inputs.app }}"
          ENV="${{ inputs.target_env }}"
          APP_STACK="${{ needs.deploy-dr-foundation.outputs.app_stack }}"
          CFG=$(cat dr-config/${APP}.json)

          STACKS=$(echo "$CFG" | jq -c ".${ENV}.codedeploy_stacks[]")

          while IFS= read -r STACK_CFG; do
            NESTED=$(echo "$STACK_CFG"  | jq -r ".nested_resource")
            BUCKET=$(echo "$STACK_CFG"  | jq -r ".artifacts_bucket")
            KEY=$(echo "$STACK_CFG"     | jq -r ".artifact_key")

            # Resolve nested stack name from parent stack resources
            NESTED_STACK=$(aws cloudformation list-stack-resources \
              --stack-name "$APP_STACK" \
              --query "StackResourceSummaries[?LogicalResourceId=='${NESTED}'].PhysicalResourceId" \
              --output text)

            APP_NAME=$(aws cloudformation describe-stacks \
              --stack-name "$NESTED_STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='CodeDeployApplicationName'].OutputValue" \
              --output text)

            GROUP_NAME=$(aws cloudformation describe-stacks \
              --stack-name "$NESTED_STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='CodeDeployDeploymentGroupName'].OutputValue" \
              --output text)

            echo "Seeding: $APP_NAME / $GROUP_NAME from s3://$BUCKET/$KEY"

            DEPLOYMENT_ID=$(aws deploy create-deployment \
              --application-name "$APP_NAME" \
              --deployment-group-name "$GROUP_NAME" \
              --s3-location bucket="$BUCKET",key="$KEY",bundleType=zip \
              --description "DR foundation seed — ${{ github.run_id }}" \
              --query "deploymentId" \
              --output text)

            echo "Created deployment: $DEPLOYMENT_ID (0 instances in standby — expected)"
          done <<< "$STACKS"
    
      - name: Notify success
        if: success()
        run: |
          SNS_ARN=$(aws cloudformation describe-stacks \
            --stack-name "${{ needs.deploy-dr-foundation.outputs.sns_stack }}" \
            --query "Stacks[0].Outputs[?OutputKey=='TopicArn'].OutputValue" \
            --output text)

          aws sns publish \
            --topic-arn "$SNS_ARN" \
            --subject "DR Foundation Ready — ${{ inputs.app }} / ${{ inputs.target_env }}" \
            --message "deploy-dr-foundation completed for ${{ inputs.app }} (${{ inputs.target_env }}). L1 and L2 stacks are deployed and artifacts confirmed in DR region. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify failure
        if: failure()
        run: |
          SNS_ARN=$(aws cloudformation describe-stacks \
            --stack-name "${{ needs.deploy-dr-foundation.outputs.sns_stack }}" \
            --query "Stacks[0].Outputs[?OutputKey=='TopicArn'].OutputValue" \
            --output text)

          aws sns publish \
            --topic-arn "$SNS_ARN" \
            --subject "DR Foundation FAILED — ${{ inputs.app }} / ${{ inputs.target_env }}" \
            --message "deploy-dr-foundation FAILED for ${{ inputs.app }} (${{ inputs.target_env }}). Check the run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"