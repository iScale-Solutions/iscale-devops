name: Deploy DR Foundation

on:
  workflow_dispatch:
    inputs:
      app:
        description: Application
        required: true
        type: choice
        options:
          - pas6
          - pddts
          - pddts-eod
          - mis
          - mis-etl
          - cics
          - smartapi
          - dsapp
          - paygate
          - pesonet
          - philpass
      target_env:
        description: Target DR environment
        required: true
        type: choice
        options:
          - uat-dr
          - prod-dr
        default: uat-dr

jobs:
  deploy-dr-foundation:
    name: Deploy DR Foundation — ${{ inputs.app }} / ${{ inputs.target_env }}
    runs-on: ubuntu-latest
    environment: dr-deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load app config
        id: cfg
        run: |
          APP="${{ inputs.app }}"
          ENV="${{ inputs.target_env }}"
          CFG=$(cat dr-config/${APP}.json)

          REGION=$(echo "$CFG"             | jq -r ".${ENV}.region")
          NETWORK_STACK=$(echo "$CFG"      | jq -r ".${ENV}.network_stack_name")
          APP_STACK=$(echo "$CFG"          | jq -r ".${ENV}.app_stack_name")
          SNS_STACK=$(echo "$CFG"          | jq -r ".${ENV}.sns_stack_name")
          SNS_TEMPLATE=$(echo "$CFG"       | jq -r ".${ENV}.sns_template_url")
          NETWORK_TEMPLATE=$(echo "$CFG"   | jq -r ".${ENV}.network_template_url")
          APP_TEMPLATE=$(echo "$CFG"       | jq -r ".${ENV}.app_template_url")
          HAS_CODEDEPLOY=$(echo "$CFG"     | jq -r ".has_codedeploy")

          {
            echo "region=$REGION"
            echo "network_stack=$NETWORK_STACK"
            echo "app_stack=$APP_STACK"
            echo "sns_stack=$SNS_STACK"
            echo "sns_template=$SNS_TEMPLATE"
            echo "network_template=$NETWORK_TEMPLATE"
            echo "app_template=$APP_TEMPLATE"
            echo "has_codedeploy=$HAS_CODEDEPLOY"
          } >> "$GITHUB_OUTPUT"