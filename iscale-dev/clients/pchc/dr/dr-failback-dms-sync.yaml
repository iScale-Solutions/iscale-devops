AWSTemplateFormatVersion: 2010-09-09
Description: >-
  DMS failback resync (DR region -> live region). Deploys in the live region and streams the
  DR-window delta from the surviving DR-region RDS back into the live-region instance. DB
  credentials come from the live-region app secrets via dynamic references; endpoint hosts/ports
  are explicit params since the secrets carry no host/port. cdc resync only - full-load-and-cdc
  is disabled pending a rebuild-target schema bootstrap.
  PREREQUISITE (DR-side, not managed here): the DR-region source DB security group must allow 3306
  from this stack's DMS subnet CIDR over the L1 VPC peering - that SG is cross-region.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
      - Label:
          default: Source Configuration (DR region)
        Parameters:
          - SourceEndpoint
          - SourcePort
          - SourceSchemaName
          - SourceSecretArn
      - Label:
          default: Target Configuration (live region)
        Parameters:
          - TargetEndpoint
          - TargetPort
          - TargetSchemaName
          - TargetSecurityGroup
          - TargetSecretArn
      - Label:
          default: Replication Configuration
        Parameters:
          - ReplicationInstanceClass
          - AllocatedStorage
          - EngineVersion
          - MigrationType
          - CdcStartPosition
          - TableMappings
          - CDCLatencyThreshold
    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      NetworkStackName:
        default: Live Region Network Stack Name
      SNSStackName:
        default: SNS Stack Name
      CDCLatencyThreshold:
        default: CDC Latency Alarm Threshold (seconds)
      CdcStartPosition:
        default: CDC Start Position (cdc migration type only)
      SourceSecretArn:
        default: Source DB Secret ARN (Secrets Manager, live region)
      TargetSecretArn:
        default: Target DB Secret ARN (Secrets Manager, live region)

Parameters:
  Name:
    Description: Unique name/identifier matching the source app stack
    Type: String
    MinLength: 3
    MaxLength: 20
  OrgName:
    Description: Organization short name
    Type: String
    Default: pchc
  EnvName:
    Description: The name of the environment (target is the live/primary region)
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
      - ProductionDR
      - StagingDR
      - DevelopmentDR
      - TestDR
  NetworkStackName:
    Description: Live (primary) region network stack name, for VPC/subnet imports
    Type: String
  SNSStackName:
    Description: Live region SNS stack name, for the CDC-latency alarm
    Type: String

  SourceEndpoint:
    Description: DR-region source RDS endpoint address (hostname). Explicit value - cross-region
      imports cannot resolve, and the secrets carry no host/port, so this comes from the DR deployment record.
    Type: String
    MinLength: 1
  SourcePort:
    Description: Source DB port
    Type: Number
    Default: 3306
  SourceSchemaName:
    Description: Source database/schema name (sets endpoint DatabaseName)
    Type: String
    MinLength: 1
  SourceSecretArn:
    Description: >-
      ARN of the live-region Secrets Manager secret holding the DR-region source DB credentials.
      Username/password are pulled from it via CloudFormation dynamic references on the standard
      DB_ROOT_USER/DB_ROOT_PASSWORD keys. The DB user needs REPLICATION SLAVE, REPLICATION CLIENT,
      SELECT on the DR instance.
    Type: String
    MinLength: 1

  TargetEndpoint:
    Description: Surviving live-region target RDS endpoint address (hostname)
    Type: String
    MinLength: 1
  TargetPort:
    Description: Target DB port - used for the endpoint connection AND the DMS->target security-group ingress rule below
    Type: Number
    Default: 3306
  TargetSchemaName:
    Description: Target database/schema name (sets endpoint DatabaseName)
    Type: String
    MinLength: 1
  TargetSecurityGroup:
    Description: Security group ID of the live-region target RDS instance (this stack adds a DMS ingress rule to it)
    Type: AWS::EC2::SecurityGroup::Id
  TargetSecretArn:
    Description: >-
      ARN of the live-region Secrets Manager secret holding the surviving target DB credentials.
      Username/password are pulled from it via CloudFormation dynamic references. The DB user needs
      write privileges on the live instance.
    Type: String
    MinLength: 1

  ReplicationInstanceClass:
    Description: DMS replication instance class
    Type: String
    Default: dms.t3.medium
    AllowedValues:
      - dms.t3.medium
      - dms.t3.large
      - dms.c5.large
      - dms.c5.xlarge
      - dms.c5.2xlarge
  AllocatedStorage:
    Description: >-
      DMS replication instance storage (GB). Sized by the CDC backlog held on the instance when the
      target lags, NOT by DB or delta size - roughly source change rate x worst-case lag. Default is
      generous for CDC; watch the instance's FreeStorageSpace during the resync and raise if it
      trends down. (Separately, confirm source binlog retention exceeds the resync window.)
    Type: Number
    Default: 100
    MinValue: 50
  EngineVersion:
    Description: >-
      DMS replication instance engine version. Parameterized because this DR template can sit
      unused until an actual failover - AWS deprecates DMS engine versions over time, so a
      hardcoded value could block instance creation months/years later. Confirm the default is
      still creatable in-region at failover time and override if AWS has retired it. Must be 3.5.x
      or newer for MySQL 8.x source/target (3.4.3 in common/dms.yaml is too old).
    Type: String
    Default: 3.5.3
  MigrationType:
    Description: >-
      cdc = skip the load and stream changes only; REQUIRES CdcStartPosition set to the
      surviving instance's frozen binlog coordinate, or DMS silently starts from task-launch
      time and drops every change in between.
      full-load-and-cdc (truncate + reload the target, then stream the delta) is TEMPORARILY
      DISABLED: on a rebuilt/fresh target it needs a schema bootstrap that does not exist yet
      (DMS full-load cannot pre-create schema). Resync-only for the initial test window;
      re-enable once the rebuild-target bootstrap ships.
    Type: String
    Default: cdc
    AllowedValues:
      # full-load-and-cdc disabled until the rebuild-target schema bootstrap exists.
      # - full-load-and-cdc
      - cdc
  CdcStartPosition:
    Description: >-
      MySQL binlog coordinate to begin CDC from, e.g. 'mysql-bin-changelog.000024:373'.
      Used ONLY when MigrationType is cdc - leave blank for full-load-and-cdc. Must match the
      exact point the surviving target instance is frozen at: too early duplicates already-applied
      transactions, too late leaves a permanent data gap.
    Type: String
    Default: ''
  TableMappings:
    Description: DMS table-mapping selection rules. Default includes all schemas/tables in scope -
      a selection gap silently skips a table and leaves it stale, so keep coverage complete.
    Type: String
    Default: '{ "rules": [ { "rule-type": "selection", "rule-id": "1", "rule-name": "1", "object-locator": { "schema-name": "%", "table-name": "%" }, "rule-action": "include" } ] }'
  CDCLatencyThreshold:
    Description: CDCLatencyTarget (seconds, averaged over two 5-minute periods) that triggers the
      alarm. This is the end-to-end staleness of the surviving target instance and is the metric
      that gates cutover readiness. Cross-region CDC routinely spikes under write load, so the
      default fires only on sustained, genuinely unhealthy lag. Tighten per app if needed.
    Type: Number
    MinValue: 1
    Default: 300

# cdc is the only allowed MigrationType, and a blank CdcStartPosition silently starts from task-launch
# time - dropping the DR-window delta while the task stays green. Reject at deploy. Scoped to cdc so
# it auto-relaxes if full-load-and-cdc returns.
Rules:
  CdcRequiresStartPosition:
    RuleCondition: !Equals [!Ref MigrationType, cdc]
    Assertions:
      - Assert: !Not [!Equals [!Ref CdcStartPosition, '']]
        AssertDescription: CdcStartPosition is required when MigrationType is cdc.

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasCdcStartPosition: !Not [!Equals [!Ref CdcStartPosition, '']]

Resources:
  # Transient resources - torn down after cutover, so no Retain policies (unlike dr-failback-rds-sync.yaml).

  DMSReplicationSubnetGroup:
    Type: AWS::DMS::ReplicationSubnetGroup
    Properties:
      ReplicationSubnetGroupDescription: !Sub 'Failback DMS subnet group for ${Name}'
      SubnetIds:
        - Fn::ImportValue: !Sub '${NetworkStackName}-InternalSubnetId1'
        - Fn::ImportValue: !Sub '${NetworkStackName}-InternalSubnetId2'
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'failback-dms']]

  DMSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Failback DMS replication instance SG for ${Name}'
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0  # reaches DR source over L1 peering + live target locally
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'failback-dms-sg']]

  # Target ingress works SG-to-SG (same VPC). Source ingress is a DR-side prerequisite
  # (different region/VPC), not managed here - see Description.
  TargetSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow DMS failback replication instance to reach the target DB
      IpProtocol: tcp
      GroupId: !Ref TargetSecurityGroup
      FromPort: !Ref TargetPort
      ToPort: !Ref TargetPort
      SourceSecurityGroupId: !Ref DMSSecurityGroup

  DMSInstance:
    Type: AWS::DMS::ReplicationInstance
    Properties:
      AllocatedStorage: !Ref AllocatedStorage  # sized by CDC backlog, not DB size - see param
      EngineVersion: !Ref EngineVersion  # parameterized - see EngineVersion param; confirm still creatable in-region at failover time
      MultiAZ: false        # single-AZ for a transient failback task
      PubliclyAccessible: false
      ReplicationInstanceClass: !Ref ReplicationInstanceClass
      ReplicationInstanceIdentifier: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'failback-dms']]
      ReplicationSubnetGroupIdentifier: !Ref DMSReplicationSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DMSSecurityGroup

  # Credentials resolved from the app secret via dynamic references at deploy time (the secrets aren't
  # in DMS's native host/port/user/password format, so SecretsManagerSecretId can't read them; host/port
  # are explicit params). Root user because the source needs REPLICATION SLAVE/CLIENT, which the app
  # user lacks. CloudFormation never persists the resolved password.
  DMSSourceEndpoint:
    Type: AWS::DMS::Endpoint
    Properties:
      DatabaseName: !Ref SourceSchemaName
      EndpointIdentifier: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'failback-source']]
      EndpointType: source
      EngineName: mysql
      SslMode: require  # encrypt the cross-region binlog stream; RDS accepts TLS by default
      ServerName: !Ref SourceEndpoint
      Port: !Ref SourcePort
      Username: !Sub '{{resolve:secretsmanager:${SourceSecretArn}:SecretString:DB_ROOT_USER}}'
      Password: !Sub '{{resolve:secretsmanager:${SourceSecretArn}:SecretString:DB_ROOT_PASSWORD}}'

  DMSTargetEndpoint:
    Type: AWS::DMS::Endpoint
    Properties:
      DatabaseName: !Ref TargetSchemaName
      EndpointIdentifier: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'failback-target']]
      EndpointType: target
      EngineName: mysql
      SslMode: require  # encrypt the target session; RDS accepts TLS by default
      ExtraConnectionAttributes: 'initstmt=SET FOREIGN_KEY_CHECKS=0'  # avoid FK-order violations when applying changes
      ServerName: !Ref TargetEndpoint
      Port: !Ref TargetPort
      Username: !Sub '{{resolve:secretsmanager:${TargetSecretArn}:SecretString:DB_ROOT_USER}}'
      Password: !Sub '{{resolve:secretsmanager:${TargetSecretArn}:SecretString:DB_ROOT_PASSWORD}}'

  DMSReplicationTask:
    Type: AWS::DMS::ReplicationTask
    Properties:
      MigrationType: !Ref MigrationType
      # Emitted only when set; AWS::NoValue omits it so DMS pins the start itself (full-load-and-cdc path).
      CdcStartPosition: !If [HasCdcStartPosition, !Ref CdcStartPosition, !Ref 'AWS::NoValue']
      ReplicationInstanceArn: !Ref DMSInstance
      ReplicationTaskIdentifier: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'failback-task']]
      SourceEndpointArn: !Ref DMSSourceEndpoint
      TargetEndpointArn: !Ref DMSTargetEndpoint
      TableMappings: !Ref TableMappings
      # TargetTablePrepMode / FullLobMode / EnableValidation guard against schema loss, LOB truncation,
      # and undetected drift. Logging (group dms-tasks-<instance>) needs the account's
      # dms-cloudwatch-logs-role to exist first.
      # Validation re-reads source and target to prove parity - the cutover gate. Reads load the live
      # DR source, so lower ThreadCount if it strains. Catch-up mismatches are lag (auto-revalidated);
      # confirmed mismatches gate cutover and are NOT auto-repaired - reload the affected table.
      ReplicationTaskSettings: |
        {
          "TargetMetadata": {
            "SupportLobs": true,
            "FullLobMode": true,
            "LobChunkSize": 64,
            "LimitedSizeLobMode": false,
            "LobMaxSize": 0,
            "TargetTablePrepMode": "TRUNCATE_BEFORE_LOAD"
          },
          "ValidationSettings": {
            "EnableValidation": true,
            "ValidationMode": "ROW_LEVEL",
            "ThreadCount": 5
          },
          "Logging": {
            "EnableLogging": true
          }
        }

  # End-to-end target staleness - the metric that gates cutover readiness. Dimensions use the plain
  # identifiers, not !Ref (Ref returns the ARN; AWS/DMS metrics key on identifiers) - hence the repeated
  # !Join and explicit DependsOn.
  #
  # breaching because no CDCLatencyTarget means the task is not replicating, and this alarm is the
  # cutover gate: notBreaching would report that silence as OK and let cutover proceed on a target
  # receiving nothing. CloudFormation creates the task in 'ready' and never starts it, so expect ALARM
  # from create until it is started manually.
  # Revisit if full-load-and-cdc returns - its load phase emits no CDCLatencyTarget either.
  CDCLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: DMSReplicationTask
    Properties:
      AlarmName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'failback-cdc-latency']]
      AlarmDescription: !Sub 'CDCLatencyTarget exceeds ${CDCLatencyThreshold}s for ${Name} failback DMS resync'
      Namespace: AWS/DMS
      MetricName: CDCLatencyTarget
      Dimensions:
        - Name: ReplicationInstanceIdentifier
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'failback-dms']]
        - Name: ReplicationTaskIdentifier
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'failback-task']]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref CDCLatencyThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'

  # Dead-task detection: publishes task failure/state-change events to SNS, immediately and with a cause.
  # The alarm above also catches a dead task via breaching, but only after two 5-minute periods and
  # without saying why. Does NOT cover a never-started task - that emits no event, hence breaching above.
  # Topic policy must allow dms.amazonaws.com sns:Publish - not implicit (unlike CloudWatch->SNS); verify
  # against the SNS stack.
  DMSTaskEventSubscription:
    Type: AWS::DMS::EventSubscription
    DependsOn: DMSReplicationTask
    Properties:
      SubscriptionName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'failback-task-events']]
      SnsTopicArn:
        Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
      SourceType: replication-task
      # SourceIds takes the task IDENTIFIER, not the ARN (!Ref returns the ARN) - rebuild it with !Join.
      SourceIds:
        - !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'failback-task']]
      EventCategories:
        - failure
        - state change
      Enabled: true

Outputs:
  DMSInstanceArn:
    Description: ARN of the failback DMS replication instance
    Value: !Ref DMSInstance
  DMSReplicationTaskArn:
    Description: ARN of the failback DMS replication task
    Value: !Ref DMSReplicationTask
  DMSSecurityGroupId:
    Description: DMS replication instance security group ID
    Value: !Ref DMSSecurityGroup
  CDCLatencyAlarmArn:
    Description: ARN of the CDCLatencyTarget CloudWatch alarm
    Value: !GetAtt CDCLatencyAlarm.Arn
  DMSTaskEventSubscriptionArn:
    Description: ARN of the DMS task event subscription (dead-task notifications)
    Value: !Ref DMSTaskEventSubscription
