AWSTemplateFormatVersion: 2010-09-09
Description: |
  DR Failover Automation — one deployment per app.
  Orchestrates failover via Step Functions with two paths:
    PITR path  (UsePITR=true):  restore-db-instance-to-point-in-time using cross-region
                                automated backups, write endpoint to Secrets Manager + SSM,
                                then update app stack with IsPITRMode=true (DBStack suppressed).
    Snapshot path (UsePITR=false): auto-discover latest snapshot, update app stack with
                                   SnapshotIdentifier (existing behavior, kept as fallback).
  Both paths update the network stack first (NAT GW, Jump Host) then the app stack.
  EventBridge triggers the Step Functions state machine (not a Lambda directly).
  Failback is handled by dr-failback.yaml.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "1. App Identity"
        Parameters:
          - OrgName
          - AppName
          - SourceRegion
      - Label:
          default: "2. Stack References"
        Parameters:
          - NetworkStackName
          - AppStackName
          - SNSStackName
          - NetworkTemplateUrl
      - Label:
          default: "3. DR Database Configuration"
        Parameters:
          - DBInstanceIdentifier
          - DRDBSecretArn
          - PITRTargetIdentifier
          - RedshiftClusterIdentifier
      - Label:
          default: "4. SSM Configuration"
        Parameters:
          - PITREndpointSSMPath

    ParameterLabels:
      OrgName:
        default: Organization Name
      AppName:
        default: Application Name
      SourceRegion:
        default: Live / Source Region
      NetworkStackName:
        default: DR Network Stack Name
      AppStackName:
        default: DR Application Stack Name
      SNSStackName:
        default: SNS Stack Name
      NetworkTemplateUrl:
        default: Network Stack Template URL (S3)
      DBInstanceIdentifier:
        default: Source DB Instance Identifier (DR region — for snapshot auto-discovery)
      DRDBSecretArn:
        default: DR DB Secret ARN (Secrets Manager — for auto-fetching DB master password)
      PITRTargetIdentifier:
        default: PITR Target DB Instance Identifier (name for the PITR-restored instance)
      RedshiftClusterIdentifier:
        default: Redshift Cluster Identifier (DR region — for snapshot auto-discovery)
      PITREndpointSSMPath:
        default: SSM Parameter Path for PITR DB Endpoint

Parameters:

  OrgName:
    Description: |
      Organization name prefix used to build the DR AMI search pattern.
      Must match the OrgName used in the EC2 Image Builder stack.
    Type: String
    Default: pchc
    AllowedPattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    ConstraintDescription: Lowercase letters, numbers, and hyphens only.

  AppName:
    Description: |
      Short identifier for this application (e.g. pesonet20, mis, pddts).
      Scopes the EventBridge rule — only FailoverRequest events with detail.app_name
      matching this value trigger this stack's failover.
    Type: String
    MinLength: 2
    MaxLength: 20
    AllowedPattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    ConstraintDescription: Lowercase letters, numbers, and hyphens only.

  SourceRegion:
    Description: AWS region where the primary/live environment runs (e.g. us-west-2). Informational only.
    Type: String
    Default: us-west-2

  NetworkStackName:
    Description: |
      Name of the DR network CloudFormation stack to update.
      Failover sets DeployPaidResources=true — provisions NAT Gateways, Jump Host, VPC Endpoints.
    Type: String
    Default: pchc-productiondr-ue2-network
    MinLength: 1

  AppStackName:
    Description: |
      Name of the DR application CloudFormation stack to update.
      Must support DeployPaidResources, IsPITRMode, PITRDBEndpoint, and SnapshotIdentifier parameters.
    Type: String
    Default: pchc-productiondr-ue2-pesonet20
    MinLength: 1

  SNSStackName:
    Description: |
      Name of the SNS CloudFormation stack. Must export ${SNSStackName}-TopicArn.
    Type: String
    Default: pchc-productiondr-ue2-sns
    MinLength: 1

  DBInstanceIdentifier:
    Description: |
      RDS DB instance identifier in the DR region. Used to auto-discover the latest snapshot
      (snapshot path) and as the SourceDBInstanceIdentifier for PITR restore (PITR path).
      Cross-region automated backups appear as automated snapshots in the DR region.
    Type: String
    Default: ''

  DRDBSecretArn:
    Description: |
      ARN of the Secrets Manager secret in the DR region containing DB credentials.
      At failover, the Lambda reads DB_ROOT_PASSWORD from this secret automatically.
      In PITR mode, the Lambda also updates this secret with the new PITR DB endpoint.
    Type: String
    Default: ''

  PITRTargetIdentifier:
    Description: |
      Identifier for the PITR-restored RDS instance (e.g. pchc-prd-ue2-pesonet20-pitr).
      The Step Functions machine creates this instance via restore-db-instance-to-point-in-time.
      Must not already exist in the DR region. Used in PITR path only.
    Type: String
    Default: ''

  PITREndpointSSMPath:
    Description: |
      SSM Parameter Store path where the PITR DB endpoint is written before the app stack update.
      The app stack reads this path when IsPITRMode=true.
      Example: /pchc/productiondr/pesonet20/pitr-db-endpoint
    Type: String
    Default: ''

  RedshiftClusterIdentifier:
    Description: |
      Redshift cluster identifier in the DR region for snapshot auto-discovery.
      Leave blank if the app has no Redshift cluster.
    Type: String
    Default: ''

  NetworkTemplateUrl:
    Description: |
      S3 URL for the network stack template (common/network.yaml).
      Used to bypass the 51,200-byte TemplateBody API limit for network stack updates.
    Type: String
    Default: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/network.yaml

Resources:

####
# IAM
####

  FailoverLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-failover-lambda-role'
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DRFailoverPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: CloudFormation
                Effect: Allow
                Action:
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:GetTemplate
                  - cloudformation:*
                Resource: '*'
              - Sid: RDS
                Effect: Allow
                Action:
                  - rds:DescribeDBSnapshots
                  - rds:DescribeDBInstances
                  - rds:RestoreDBInstanceToPointInTime
                  - rds:AddTagsToResource
                  - rds:*
                Resource: '*'
              - Sid: EC2
                Effect: Allow
                Action: ec2:*
                Resource: '*'
              - Sid: Redshift
                Effect: Allow
                Action: redshift:*
                Resource: '*'
              - Sid: SecretsManager
                Effect: Allow
                Action: secretsmanager:*
                Resource: '*'
              - Sid: SSM
                Effect: Allow
                Action: ssm:*
                Resource: '*'
              - Sid: IAM
                Effect: Allow
                Action:
                  - iam:PassRole
                  - iam:*
                Resource: '*'
              - Sid: OtherProvisioning
                Effect: Allow
                Action:
                  - elasticloadbalancing:*
                  - autoscaling:*
                  - elasticfilesystem:*
                  - elasticache:*
                  - s3:*
                  - codedeploy:*
                  - cloudwatch:*
                  - logs:*
                  - backup:*
                  - kms:*
                  - lambda:*
                  - events:*
                  - route53:*
                Resource: '*'
              - Sid: SNSPublish
                Effect: Allow
                Action: sns:Publish
                Resource:
                  Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'

  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-sfn-role'
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambdaAndLogs
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt FailoverLambdaFunction.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'

  EventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-eventbridge-role'
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartStateMachine
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref FailoverStateMachine

####
# CloudWatch Logs
####

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}'
      RetentionInDays: 90

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/states/${AWS::StackName}'
      RetentionInDays: 90

####
# Lambda — worker, invoked by Step Functions for each action
####

  FailoverLambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-worker'
      Description: !Sub |
        DR failover worker for ${AppName}. Invoked by the Step Functions state machine.
        Actions: discover | update_network_stack | pitr_restore | check_db_status |
                 update_secrets | update_app_stack | check_stack_status | notify
      Handler: index.lambda_handler
      Role: !GetAtt FailoverLambdaRole.Arn
      Runtime: python3.12
      Timeout: 60
      Environment:
        Variables:
          ORG_NAME: !Ref OrgName
          APP_NAME: !Ref AppName
          NETWORK_STACK_NAME: !Ref NetworkStackName
          APP_STACK_NAME: !Ref AppStackName
          DB_INSTANCE_IDENTIFIER: !Ref DBInstanceIdentifier
          DR_DB_SECRET_ARN: !Ref DRDBSecretArn
          PITR_TARGET_IDENTIFIER: !Ref PITRTargetIdentifier
          PITR_ENDPOINT_SSM_PATH: !Ref PITREndpointSSMPath
          REDSHIFT_CLUSTER_IDENTIFIER: !Ref RedshiftClusterIdentifier
          SOURCE_REGION: !Ref SourceRegion
          NETWORK_TEMPLATE_URL: !Ref NetworkTemplateUrl
          SNS_TOPIC_ARN:
            Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
      Code:
        ZipFile: !Sub |
          import boto3
          import logging
          import os
          import json
          from botocore.exceptions import ClientError

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          TERMINAL_STATES = {
              'CREATE_COMPLETE', 'UPDATE_COMPLETE',
              'UPDATE_ROLLBACK_COMPLETE', 'UPDATE_ROLLBACK_FAILED',
              'ROLLBACK_COMPLETE', 'ROLLBACK_FAILED',
              'DELETE_COMPLETE', 'DELETE_FAILED', 'CREATE_FAILED',
          }
          ROLLBACK_STATES = {
              'UPDATE_ROLLBACK_COMPLETE', 'UPDATE_ROLLBACK_FAILED',
              'ROLLBACK_COMPLETE', 'ROLLBACK_FAILED',
              'DELETE_FAILED', 'CREATE_FAILED',
          }

          def lambda_handler(event, context):
            action = event.get('action', '')
            region = os.environ['AWS_REGION']
            if action == 'discover':
              return handle_discover(event, region)
            if action == 'update_network_stack':
              return handle_update_network_stack(event, region)
            if action == 'pitr_restore':
              return handle_pitr_restore(event, region)
            if action == 'check_db_status':
              return handle_check_db_status(event, region)
            if action == 'update_secrets':
              return handle_update_secrets(event, region)
            if action == 'update_app_stack':
              return handle_update_app_stack(event, region)
            if action == 'check_stack_status':
              return handle_check_stack_status(event, region)
            if action == 'notify':
              return handle_notify(event)
            raise ValueError(f'Unknown action: {action!r}')


          # ── discover ──────────────────────────────────────────────────────────

          def handle_discover(event, region):
            """
            Discovers AMI, snapshot (snapshot path), and DB master password.
            Returns all values needed for subsequent steps.
            """
            use_pitr          = event.get('use_pitr', False)
            db_instance_id    = event.get('db_instance_identifier', os.environ.get('DB_INSTANCE_IDENTIFIER', ''))
            snapshot_id       = event.get('snapshot_identifier', '')
            db_master_password = event.get('db_master_password', '')
            org_name          = os.environ.get('ORG_NAME', '')
            app_name          = os.environ.get('APP_NAME', '')
            dr_db_secret_arn  = os.environ.get('DR_DB_SECRET_ARN', '')
            redshift_cluster_id = event.get('redshift_cluster_identifier', os.environ.get('REDSHIFT_CLUSTER_IDENTIFIER', ''))
            redshift_snapshot  = event.get('redshift_snapshot_identifier', '')

            if not db_master_password and dr_db_secret_arn:
              logger.info(f'Auto-fetching DB master password from: {dr_db_secret_arn}')
              db_master_password = fetch_db_master_password(region, dr_db_secret_arn)

            instance_ami = ''
            if org_name:
              logger.info(f'Discovering DR AMI: {org_name}_{app_name}_dr-image_*')
              instance_ami = find_latest_ami(region, org_name, app_name)
              logger.info(f'AMI: {instance_ami}')

            if not use_pitr:
              if not snapshot_id and db_instance_id:
                logger.info(f'Discovering latest snapshot for: {db_instance_id}')
                snapshot_id = find_latest_snapshot(region, db_instance_id)
                logger.info(f'Snapshot: {snapshot_id}')
              if not redshift_snapshot and redshift_cluster_id:
                logger.info(f'Discovering latest Redshift snapshot for: {redshift_cluster_id}')
                redshift_snapshot = find_latest_redshift_snapshot(region, redshift_cluster_id)
                logger.info(f'Redshift snapshot: {redshift_snapshot}')

            return {
              'use_pitr':           use_pitr,
              'instance_ami':       instance_ami,
              'snapshot_identifier': snapshot_id,
              'db_master_password': db_master_password,
              'redshift_snapshot_identifier': redshift_snapshot,
              'db_instance_identifier': db_instance_id,
            }


          # ── update_network_stack ──────────────────────────────────────────────

          def handle_update_network_stack(event, region):
            cf = boto3.client('cloudformation', region_name=region)
            stack = os.environ['NETWORK_STACK_NAME']
            template_url = os.environ.get('NETWORK_TEMPLATE_URL', '')
            logger.info(f'Updating network stack: {stack}')
            update_stack(cf, stack, deploy_paid='true', template_url=template_url or None)
            return {'network_stack_name': stack, 'submitted': True}


          # ── pitr_restore ──────────────────────────────────────────────────────

          def handle_pitr_restore(event, region):
            """
            Calls restore-db-instance-to-point-in-time using the cross-region automated
            backup. UseLatestRestorableTime=True gives ~5 min RPO.
            Returns the target instance identifier immediately — the state machine polls
            check_db_status until the instance is available.
            """
            rds = boto3.client('rds', region_name=region)
            source_id  = os.environ.get('DB_INSTANCE_IDENTIFIER', '')
            target_id  = os.environ.get('PITR_TARGET_IDENTIFIER', '')
            if not source_id or not target_id:
              raise ValueError('DB_INSTANCE_IDENTIFIER and PITR_TARGET_IDENTIFIER must be set for PITR restore.')

            # Subnet group and SG are pre-deployed by the app stack (DBStandbySubnetGroup / DBStandbySecurityGroup).
            # Their names/IDs are passed in the event from the state machine input.
            subnet_group = event.get('pitr_subnet_group', '')
            sg_id        = event.get('pitr_security_group_id', '')

            kwargs = dict(
              SourceDBInstanceIdentifier=source_id,
              TargetDBInstanceIdentifier=target_id,
              UseLatestRestorableTime=True,
              MultiAZ=False,
              PubliclyAccessible=False,
              AutoMinorVersionUpgrade=True,
              Tags=[
                {'Key': 'Environment', 'Value': 'DR'},
                {'Key': 'ManagedBy',   'Value': 'dr-failover-sfn'},
              ],
            )
            if subnet_group:
              kwargs['DBSubnetGroupName'] = subnet_group
            if sg_id:
              kwargs['VpcSecurityGroupIds'] = [sg_id]

            logger.info(f'Initiating PITR restore: {source_id} → {target_id}')
            try:
              rds.restore_db_instance_to_point_in_time(**kwargs)
            except ClientError as e:
              if 'already exists' in str(e):
                logger.warning(f'Instance {target_id} already exists — assuming in-progress restore.')
              else:
                raise
            return {'pitr_target_identifier': target_id}


          # ── check_db_status ──────────────────────────────────────────────────

          def handle_check_db_status(event, region):
            rds = boto3.client('rds', region_name=region)
            target_id = event.get('pitr_target_identifier', os.environ.get('PITR_TARGET_IDENTIFIER', ''))
            resp = rds.describe_db_instances(DBInstanceIdentifier=target_id)
            instance = resp['DBInstances'][0]
            status   = instance['DBInstanceStatus']
            endpoint = instance.get('Endpoint', {}).get('Address', '')
            port     = instance.get('Endpoint', {}).get('Port', 3306)
            available = status == 'available'
            logger.info(f'DB {target_id} status={status} endpoint={endpoint}')
            return {
              'pitr_target_identifier': target_id,
              'db_status':   status,
              'db_available': available,
              'db_endpoint':  endpoint,
              'db_port':      port,
            }


          # ── update_secrets ───────────────────────────────────────────────────

          def handle_update_secrets(event, region):
            """
            Writes the PITR DB endpoint to:
              1. Secrets Manager (DRDBSecretArn) — DB_HOST field
              2. SSM Parameter Store (PITREndpointSSMPath) — read by app stack via {{resolve:ssm:...}}
            Must be called after check_db_status returns db_available=true.
            """
            db_endpoint = event.get('db_endpoint', '')
            if not db_endpoint:
              raise ValueError('db_endpoint missing — check_db_status must succeed before update_secrets.')

            dr_secret_arn = os.environ.get('DR_DB_SECRET_ARN', '')
            ssm_path      = os.environ.get('PITR_ENDPOINT_SSM_PATH', '')

            if dr_secret_arn:
              sm = boto3.client('secretsmanager', region_name=region)
              resp   = sm.get_secret_value(SecretId=dr_secret_arn)
              secret = json.loads(resp['SecretString'])
              secret['DB_HOST'] = db_endpoint
              sm.put_secret_value(SecretId=dr_secret_arn, SecretString=json.dumps(secret))
              logger.info(f'Updated Secrets Manager {dr_secret_arn} with endpoint {db_endpoint}')

            if ssm_path:
              ssm = boto3.client('ssm', region_name=region)
              ssm.put_parameter(Name=ssm_path, Value=db_endpoint, Type='String', Overwrite=True)
              logger.info(f'Updated SSM {ssm_path} with endpoint {db_endpoint}')

            return {'secrets_updated': True, 'db_endpoint': db_endpoint}


          # ── update_app_stack ─────────────────────────────────────────────────

          def handle_update_app_stack(event, region):
            cf = boto3.client('cloudformation', region_name=region)
            app_stack   = os.environ['APP_STACK_NAME']
            use_pitr    = event.get('use_pitr', False)
            instance_ami = event.get('instance_ami', '')
            db_endpoint  = event.get('db_endpoint', '')
            snapshot_id  = event.get('snapshot_identifier', '')
            db_password  = event.get('db_master_password', '')
            redshift_snap = event.get('redshift_snapshot_identifier', '')

            if use_pitr:
              extra = {
                'DeployPaidResources': 'true',
                'IsPITRMode': 'true',
                'PITRDBEndpoint': db_endpoint,
              }
              if instance_ami:
                extra['InstanceAMI'] = instance_ami
              logger.info(f'Updating app stack (PITR mode): {app_stack}')
            else:
              extra = {
                'DeployPaidResources': 'true',
                'IsPITRMode': 'false',
                'PITRDBEndpoint': '',
              }
              if snapshot_id:
                extra['SnapshotIdentifier'] = snapshot_id
              if db_password:
                extra['DBMasterUserPassword'] = db_password
              if instance_ami:
                extra['InstanceAMI'] = instance_ami
              if redshift_snap:
                extra['RedshiftSnapshotIdentifier'] = redshift_snap
              logger.info(f'Updating app stack (snapshot mode): {app_stack}')

            update_stack(cf, app_stack, deploy_paid='true', extra_params=extra, preserve_yaml=True)
            return {'app_stack_name': app_stack, 'submitted': True}


          # ── check_stack_status ───────────────────────────────────────────────

          def handle_check_stack_status(event, region):
            cf = boto3.client('cloudformation', region_name=region)
            stack_name = event.get('stack_name', '')
            resp   = cf.describe_stacks(StackName=stack_name)
            status = resp['Stacks'][0]['StackStatus']
            complete = status in TERMINAL_STATES
            rollback = status in ROLLBACK_STATES
            logger.info(f'Stack {stack_name} status={status}')
            return {
              'stack_name':       stack_name,
              'stack_status':     status,
              'stack_complete':   complete,
              'stack_rollback':   rollback,
            }


          # ── notify ───────────────────────────────────────────────────────────

          def handle_notify(event):
            topic = os.environ.get('SNS_TOPIC_ARN', '')
            app   = os.environ.get('APP_NAME', '')
            msg   = event.get('message', f'DR Failover complete for [{app}].')
            subject = event.get('subject', f'DR Failover Complete [{app}]')
            notify(topic, subject, msg)
            return {'notified': True}


          # ── helpers ──────────────────────────────────────────────────────────

          def find_latest_snapshot(region, db_instance_identifier):
            rds = boto3.client('rds', region_name=region)
            for snapshot_type in ['manual', 'automated']:
              response = rds.describe_db_snapshots(
                DBInstanceIdentifier=db_instance_identifier,
                SnapshotType=snapshot_type
              )
              snapshots = [s for s in response.get('DBSnapshots', []) if s.get('Status') == 'available']
              if snapshots:
                snapshots.sort(key=lambda x: x['SnapshotCreateTime'], reverse=True)
                return snapshots[0]['DBSnapshotArn']
            raise Exception(f'No available snapshots found for: {db_instance_identifier}')

          def find_latest_redshift_snapshot(region, cluster_identifier):
            redshift = boto3.client('redshift', region_name=region)
            for snapshot_type in ['manual', 'automated']:
              response = redshift.describe_cluster_snapshots(
                ClusterIdentifier=cluster_identifier,
                SnapshotType=snapshot_type
              )
              snapshots = [s for s in response.get('Snapshots', []) if s.get('Status') == 'available']
              if snapshots:
                snapshots.sort(key=lambda x: x['SnapshotCreateTime'], reverse=True)
                return snapshots[0]['SnapshotIdentifier']
            raise Exception(f'No available Redshift snapshots found for: {cluster_identifier}')

          def fetch_db_master_password(region, secret_arn):
            sm = boto3.client('secretsmanager', region_name=region)
            resp   = sm.get_secret_value(SecretId=secret_arn)
            secret = json.loads(resp['SecretString'])
            pw = secret.get('DB_ROOT_PASSWORD', '')
            if not pw:
              raise Exception(f'DB_ROOT_PASSWORD not found in secret: {secret_arn}')
            return pw

          def find_latest_ami(region, org_name, app_name):
            ec2 = boto3.client('ec2', region_name=region)
            response = ec2.describe_images(
              Owners=['self'],
              Filters=[
                {'Name': 'name',  'Values': [f'{org_name}_{app_name}_dr-image_*']},
                {'Name': 'state', 'Values': ['available']}
              ]
            )
            images = response.get('Images', [])
            if not images:
              raise Exception(f'No available DR AMIs found matching: {org_name}_{app_name}_dr-image_*')
            images.sort(key=lambda x: x['CreationDate'], reverse=True)
            return images[0]['ImageId']

          def get_current_parameters(cf, stack_name):
            response = cf.describe_stacks(StackName=stack_name)
            return {p['ParameterKey']: p['ParameterValue'] for p in response['Stacks'][0].get('Parameters', [])}

          def _cfn_to_yaml(obj, _depth=0):
            import json as _j
            if isinstance(obj, str):
              obj = _j.loads(obj)
            def _key(k):
              s = str(k)
              if not s or ': ' in s or s[0] in '!&*[{|>\'"':
                return _j.dumps(s)
              return s
            def _scalar(v):
              if v is None: return 'null'
              if isinstance(v, bool): return 'true' if v else 'false'
              if isinstance(v, (int, float)): return str(v)
              s = str(v)
              if not s: return '""'
              if (any(c in s for c in ':#{}[]!,&*|>\'"') or
                  s[0] in ' -?' or s[-1] == ' ' or '\n' in s or
                  s.lower() in ('true','false','null','yes','no','on','off')):
                return _j.dumps(s)
              try:
                float(s)
                return _j.dumps(s)
              except ValueError:
                pass
              return s
            def _node(o, d):
              p = '  ' * d
              if isinstance(o, dict):
                parts = []
                for k, v in o.items():
                  ks = _key(k)
                  if isinstance(v, (dict, list)):
                    if v:
                      parts.append(f'{p}{ks}:')
                      parts.append(_node(v, d+1))
                    else:
                      parts.append(f'{p}{ks}: {{}}' if isinstance(v, dict) else f'{p}{ks}: []')
                  elif isinstance(v, bool):
                    parts.append(f'{p}{ks}: {"true" if v else "false"}')
                  elif v is None:
                    parts.append(f'{p}{ks}: null')
                  elif isinstance(v, (int, float)):
                    parts.append(f'{p}{ks}: {v}')
                  else:
                    parts.append(f'{p}{ks}: {_scalar(str(v))}')
                return '\n'.join(parts)
              parts = []
              for item in o:
                if isinstance(item, dict) and item:
                  kvs = list(item.items())
                  fk, fv = _key(str(kvs[0][0])), kvs[0][1]
                  if isinstance(fv, (dict, list)) and fv:
                    parts.append(f'{p}- {fk}:')
                    parts.append(_node(fv, d+1))
                  elif isinstance(fv, bool):
                    parts.append(f'{p}- {fk}: {"true" if fv else "false"}')
                  elif fv is None:
                    parts.append(f'{p}- {fk}: null')
                  elif isinstance(fv, (int, float)):
                    parts.append(f'{p}- {fk}: {fv}')
                  else:
                    parts.append(f'{p}- {fk}: {_scalar(str(fv))}')
                  cp = p + '  '
                  for rk, rv in kvs[1:]:
                    rks = _key(str(rk))
                    if isinstance(rv, (dict, list)) and rv:
                      parts.append(f'{cp}{rks}:')
                      parts.append(_node(rv, d+1))
                    elif isinstance(rv, bool):
                      parts.append(f'{cp}{rks}: {"true" if rv else "false"}')
                    elif rv is None:
                      parts.append(f'{cp}{rks}: null')
                    elif isinstance(rv, (int, float)):
                      parts.append(f'{cp}{rks}: {rv}')
                    else:
                      parts.append(f'{cp}{rks}: {_scalar(str(rv))}')
                elif isinstance(item, list) and item:
                  parts.append(f'{p}-')
                  parts.append(_node(item, d+1))
                elif isinstance(item, bool):
                  parts.append(f'{p}- {"true" if item else "false"}')
                elif item is None:
                  parts.append(f'{p}- null')
                elif isinstance(item, (int, float)):
                  parts.append(f'{p}- {item}')
                else:
                  parts.append(f'{p}- {_scalar(str(item))}')
              return '\n'.join(parts)
            return _node(obj, _depth)

          def _fetch_as_yaml(cf, stack_name):
            resp = cf.get_template(StackName=stack_name, TemplateStage='Original')
            body = resp['TemplateBody']
            if isinstance(body, dict):
              return _cfn_to_yaml(body)
            if body.lstrip().startswith('{'):
              return _cfn_to_yaml(body)
            return body

          def update_stack(cf, stack_name, deploy_paid, extra_params=None, template_url=None, preserve_yaml=False):
            if extra_params is None:
              extra_params = {}
            current_params = get_current_parameters(cf, stack_name)
            parameters = []
            for key in current_params:
              if key in extra_params:
                parameters.append({'ParameterKey': key, 'ParameterValue': str(extra_params[key])})
              else:
                parameters.append({'ParameterKey': key, 'UsePreviousValue': True})
            # Add new parameters that don't exist yet in the current stack
            for key, val in extra_params.items():
              if key not in current_params:
                parameters.append({'ParameterKey': key, 'ParameterValue': str(val)})

            if template_url:
              kwargs = dict(StackName=stack_name, TemplateURL=template_url,
                            Parameters=parameters,
                            Capabilities=['CAPABILITY_IAM','CAPABILITY_NAMED_IAM','CAPABILITY_AUTO_EXPAND'])
            elif preserve_yaml:
              body = _fetch_as_yaml(cf, stack_name)
              kwargs = dict(StackName=stack_name, TemplateBody=body,
                            Parameters=parameters,
                            Capabilities=['CAPABILITY_IAM','CAPABILITY_NAMED_IAM','CAPABILITY_AUTO_EXPAND'])
            else:
              kwargs = dict(StackName=stack_name, UsePreviousTemplate=True,
                            Parameters=parameters,
                            Capabilities=['CAPABILITY_IAM','CAPABILITY_NAMED_IAM','CAPABILITY_AUTO_EXPAND'])
            try:
              cf.update_stack(**kwargs)
            except ClientError as e:
              code = e.response['Error']['Code']
              msg  = e.response['Error']['Message']
              if code == 'ValidationError' and 'No updates are to be performed' in msg:
                logger.info(f'No changes needed for stack: {stack_name}')
                return
              raise

          def notify(sns_topic_arn, subject, message):
            if not sns_topic_arn:
              return
            try:
              boto3.client('sns').publish(TopicArn=sns_topic_arn, Subject=subject, Message=message)
            except Exception:
              logger.warning('Failed to publish SNS notification', exc_info=True)

####
# Step Functions — STANDARD state machine (long-running, durable)
####

  FailoverStateMachine:
    Type: AWS::StepFunctions::StateMachine
    DependsOn: StateMachineLogGroup
    Properties:
      StateMachineName: !Sub '${AWS::StackName}'
      StateMachineType: STANDARD
      RoleArn: !GetAtt StepFunctionsRole.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
      DefinitionString: !Sub |
        {
          "Comment": "DR Failover — PITR path (use_pitr=true) or snapshot path (use_pitr=false).",
          "StartAt": "Discover",
          "States": {

            "Discover": {
              "Comment": "Resolve AMI, snapshot (snapshot path), and DB master password.",
              "Type": "Task",
              "Resource": "${FailoverLambdaFunction.Arn}",
              "Parameters": {
                "action": "discover",
                "use_pitr.$": "$.use_pitr",
                "snapshot_identifier.$": "$.snapshot_identifier",
                "db_master_password.$": "$.db_master_password",
                "db_instance_identifier.$": "$.db_instance_identifier",
                "redshift_cluster_identifier.$": "$.redshift_cluster_identifier",
                "redshift_snapshot_identifier.$": "$.redshift_snapshot_identifier"
              },
              "ResultPath": "$.discovered",
              "Next": "UpdateNetworkStack",
              "Retry": [{"ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 10, "MaxAttempts": 3, "BackoffRate": 2}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "FailoverFailed", "ResultPath": "$.error"}]
            },

            "UpdateNetworkStack": {
              "Comment": "Activate NAT GW, Jump Host, VPC Endpoints on the network stack.",
              "Type": "Task",
              "Resource": "${FailoverLambdaFunction.Arn}",
              "Parameters": {"action": "update_network_stack"},
              "ResultPath": "$.network_update",
              "Next": "WaitNetworkStack",
              "Retry": [{"ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 15, "MaxAttempts": 3, "BackoffRate": 2}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "FailoverFailed", "ResultPath": "$.error"}]
            },

            "WaitNetworkStack": {
              "Type": "Wait",
              "Seconds": 60,
              "Next": "CheckNetworkStack"
            },

            "CheckNetworkStack": {
              "Type": "Task",
              "Resource": "${FailoverLambdaFunction.Arn}",
              "Parameters": {
                "action": "check_stack_status",
                "stack_name": "${NetworkStackName}"
              },
              "ResultPath": "$.network_status",
              "Next": "NetworkStackDone",
              "Retry": [{"ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 10, "MaxAttempts": 3, "BackoffRate": 2}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "FailoverFailed", "ResultPath": "$.error"}]
            },

            "NetworkStackDone": {
              "Type": "Choice",
              "Choices": [
                {"Variable": "$.network_status.stack_rollback", "BooleanEquals": true, "Next": "FailoverFailed"},
                {"Variable": "$.network_status.stack_complete", "BooleanEquals": true, "Next": "RouteByMode"}
              ],
              "Default": "WaitNetworkStack"
            },

            "RouteByMode": {
              "Comment": "Branch to PITR path or snapshot path based on use_pitr flag.",
              "Type": "Choice",
              "Choices": [
                {"Variable": "$.use_pitr", "BooleanEquals": true, "Next": "PITRRestore"}
              ],
              "Default": "UpdateAppStackSnapshot"
            },

            "PITRRestore": {
              "Comment": "Call restore-db-instance-to-point-in-time (UseLatestRestorableTime=true).",
              "Type": "Task",
              "Resource": "${FailoverLambdaFunction.Arn}",
              "Parameters": {
                "action": "pitr_restore",
                "pitr_subnet_group.$": "$.pitr_subnet_group",
                "pitr_security_group_id.$": "$.pitr_security_group_id"
              },
              "ResultPath": "$.pitr_restore",
              "Next": "WaitPITR",
              "Retry": [{"ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 15, "MaxAttempts": 2, "BackoffRate": 2}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "FailoverFailed", "ResultPath": "$.error"}]
            },

            "WaitPITR": {
              "Comment": "Initial wait — RDS takes 1-2 min before the instance appears in describe.",
              "Type": "Wait",
              "Seconds": 90,
              "Next": "CheckPITRStatus"
            },

            "CheckPITRStatus": {
              "Type": "Task",
              "Resource": "${FailoverLambdaFunction.Arn}",
              "Parameters": {
                "action": "check_db_status",
                "pitr_target_identifier.$": "$.pitr_restore.pitr_target_identifier"
              },
              "ResultPath": "$.pitr_status",
              "Next": "PITRAvailable",
              "Retry": [{"ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 30, "MaxAttempts": 5, "BackoffRate": 1.5}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "FailoverFailed", "ResultPath": "$.error"}]
            },

            "PITRAvailable": {
              "Type": "Choice",
              "Choices": [
                {"Variable": "$.pitr_status.db_available", "BooleanEquals": true, "Next": "UpdateSecrets"}
              ],
              "Default": "WaitPITR"
            },

            "UpdateSecrets": {
              "Comment": "Write PITR endpoint to Secrets Manager and SSM before app stack update.",
              "Type": "Task",
              "Resource": "${FailoverLambdaFunction.Arn}",
              "Parameters": {
                "action": "update_secrets",
                "db_endpoint.$": "$.pitr_status.db_endpoint"
              },
              "ResultPath": "$.secrets_update",
              "Next": "UpdateAppStackPITR",
              "Retry": [{"ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 10, "MaxAttempts": 3, "BackoffRate": 2}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "FailoverFailed", "ResultPath": "$.error"}]
            },

            "UpdateAppStackPITR": {
              "Comment": "Update app stack with IsPITRMode=true. DBStack is suppressed — app uses PITR instance.",
              "Type": "Task",
              "Resource": "${FailoverLambdaFunction.Arn}",
              "Parameters": {
                "action": "update_app_stack",
                "use_pitr": true,
                "db_endpoint.$": "$.pitr_status.db_endpoint",
                "instance_ami.$": "$.discovered.instance_ami"
              },
              "ResultPath": "$.app_update",
              "Next": "WaitAppStack",
              "Retry": [{"ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 15, "MaxAttempts": 3, "BackoffRate": 2}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "FailoverFailed", "ResultPath": "$.error"}]
            },

            "UpdateAppStackSnapshot": {
              "Comment": "Snapshot path — update app stack with SnapshotIdentifier (existing behavior).",
              "Type": "Task",
              "Resource": "${FailoverLambdaFunction.Arn}",
              "Parameters": {
                "action": "update_app_stack",
                "use_pitr": false,
                "snapshot_identifier.$": "$.discovered.snapshot_identifier",
                "db_master_password.$": "$.discovered.db_master_password",
                "instance_ami.$": "$.discovered.instance_ami",
                "redshift_snapshot_identifier.$": "$.discovered.redshift_snapshot_identifier"
              },
              "ResultPath": "$.app_update",
              "Next": "WaitAppStack",
              "Retry": [{"ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 15, "MaxAttempts": 3, "BackoffRate": 2}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "FailoverFailed", "ResultPath": "$.error"}]
            },

            "WaitAppStack": {
              "Type": "Wait",
              "Seconds": 60,
              "Next": "CheckAppStack"
            },

            "CheckAppStack": {
              "Type": "Task",
              "Resource": "${FailoverLambdaFunction.Arn}",
              "Parameters": {
                "action": "check_stack_status",
                "stack_name": "${AppStackName}"
              },
              "ResultPath": "$.app_status",
              "Next": "AppStackDone",
              "Retry": [{"ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 10, "MaxAttempts": 3, "BackoffRate": 2}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "FailoverFailed", "ResultPath": "$.error"}]
            },

            "AppStackDone": {
              "Type": "Choice",
              "Choices": [
                {"Variable": "$.app_status.stack_rollback", "BooleanEquals": true, "Next": "FailoverFailed"},
                {"Variable": "$.app_status.stack_complete", "BooleanEquals": true, "Next": "NotifyComplete"}
              ],
              "Default": "WaitAppStack"
            },

            "NotifyComplete": {
              "Type": "Task",
              "Resource": "${FailoverLambdaFunction.Arn}",
              "Parameters": {
                "action": "notify",
                "subject": "DR Failover Complete [${AppName}]",
                "message": "DR failover completed successfully for ${AppName}. Network stack, PITR/snapshot restore, and app stack are all UPDATE_COMPLETE."
              },
              "ResultPath": "$.notify",
              "Next": "Complete",
              "Retry": [{"ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 5, "MaxAttempts": 2, "BackoffRate": 1}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "Complete", "ResultPath": "$.notify_error"}]
            },

            "Complete": {
              "Type": "Succeed"
            },

            "FailoverFailed": {
              "Type": "Fail",
              "Error": "FailoverFailed",
              "Cause": "DR failover aborted — a step failed after retries. Check CloudWatch Logs and the Step Functions execution history for details."
            }

          }
        }

####
# EventBridge — triggers the state machine (scoped to this app)
####

  FailoverTriggerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${AWS::StackName}-failover-trigger'
      Description: !Sub 'DR failover trigger for ${AppName}. Publish FailoverRequest with detail.app_name=${AppName}.'
      EventBusName: default
      EventPattern:
        source:
          - pchc.dr.failover
        detail-type:
          - FailoverRequest
        detail:
          app_name:
            - !Ref AppName
      State: ENABLED
      Targets:
        - Id: StartFailoverStateMachine
          Arn: !Ref FailoverStateMachine
          RoleArn: !GetAtt EventBridgeRole.Arn
          InputTransformer:
            InputPathsMap:
              use_pitr:                    '$.detail.use_pitr'
              snapshot_identifier:         '$.detail.snapshot_identifier'
              db_master_password:          '$.detail.db_master_password'
              db_instance_identifier:      '$.detail.db_instance_identifier'
              redshift_cluster_identifier: '$.detail.redshift_cluster_identifier'
              redshift_snapshot_identifier:'$.detail.redshift_snapshot_identifier'
              pitr_subnet_group:           '$.detail.pitr_subnet_group'
              pitr_security_group_id:      '$.detail.pitr_security_group_id'
            InputTemplate: !Sub |
              {
                "app_name": "${AppName}",
                "use_pitr": <use_pitr>,
                "snapshot_identifier": "<snapshot_identifier>",
                "db_master_password": "<db_master_password>",
                "db_instance_identifier": "<db_instance_identifier>",
                "redshift_cluster_identifier": "<redshift_cluster_identifier>",
                "redshift_snapshot_identifier": "<redshift_snapshot_identifier>",
                "pitr_subnet_group": "<pitr_subnet_group>",
                "pitr_security_group_id": "<pitr_security_group_id>"
              }

####
# EventBridge — stack completion notifications
####

  StackEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${AWS::StackName}-stack-completion'
      Description: !Sub 'Notifies when DR network or app stack update for ${AppName} completes or fails.'
      EventPattern:
        source:
          - aws.cloudformation
        detail-type:
          - CloudFormation Stack Status Change
        detail:
          stack-id:
            - prefix: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${NetworkStackName}/'
            - prefix: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/'
          status-details:
            status:
              - UPDATE_COMPLETE
              - UPDATE_ROLLBACK_COMPLETE
              - UPDATE_FAILED
              - UPDATE_ROLLBACK_FAILED
      State: ENABLED
      Targets:
        - Id: NotifyStackCompletion
          Arn:
            Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
          InputTransformer:
            InputPathsMap:
              stack:  '$.detail.stack-id'
              status: '$.detail.status-details.status'
              time:   '$.time'
            InputTemplate: !Sub |
              "DR Stack Update — ${AppName}"
              "Stack  : <stack>"
              "Status : <status>"
              "Time   : <time>"

  StackEventRuleSNSPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource:
              Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'

Outputs:

  StateMachineArn:
    Description: ARN of the DR Failover State Machine
    Value: !Ref FailoverStateMachine
    Export:
      Name: !Sub '${AWS::StackName}-StateMachineArn'

  StateMachineName:
    Description: Name of the DR Failover State Machine
    Value: !GetAtt FailoverStateMachine.Name
    Export:
      Name: !Sub '${AWS::StackName}-StateMachineName'

  WorkerLambdaArn:
    Description: ARN of the DR Failover worker Lambda
    Value: !GetAtt FailoverLambdaFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-WorkerLambdaArn'

  HowToFailoverPITR:
    Description: |
      Trigger DR failover via EventBridge using PITR (recommended — ~5 min RPO).
      pitr_subnet_group and pitr_security_group_id are the DBStandbySubnetGroup and
      DBStandbySecurityGroupId outputs from the app stack (pesonet20.yaml).
      The state machine handles all steps: network stack → PITR restore → secrets → app stack.
    Value: !Sub |
      aws events put-events \
        --region ${AWS::Region} \
        --entries '[{
          "Source": "pchc.dr.failover",
          "DetailType": "FailoverRequest",
          "EventBusName": "default",
          "Detail": "{\"app_name\":\"${AppName}\",\"use_pitr\":true,\"pitr_subnet_group\":\"<DBStandbySubnetGroup-output>\",\"pitr_security_group_id\":\"<DBStandbySecurityGroupId-output>\",\"db_instance_identifier\":\"\",\"snapshot_identifier\":\"\",\"db_master_password\":\"\",\"redshift_cluster_identifier\":\"\",\"redshift_snapshot_identifier\":\"\"}"
        }]'

  HowToFailoverSnapshot:
    Description: |
      Trigger DR failover via EventBridge using snapshot restore (fallback — ~24h RPO).
      Leave snapshot_identifier blank for auto-discovery from DBInstanceIdentifier.
    Value: !Sub |
      aws events put-events \
        --region ${AWS::Region} \
        --entries '[{
          "Source": "pchc.dr.failover",
          "DetailType": "FailoverRequest",
          "EventBusName": "default",
          "Detail": "{\"app_name\":\"${AppName}\",\"use_pitr\":false,\"snapshot_identifier\":\"\",\"db_master_password\":\"\",\"db_instance_identifier\":\"\",\"redshift_cluster_identifier\":\"\",\"redshift_snapshot_identifier\":\"\",\"pitr_subnet_group\":\"\",\"pitr_security_group_id\":\"\"}"
        }]'
