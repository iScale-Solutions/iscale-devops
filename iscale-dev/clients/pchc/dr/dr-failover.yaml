####
# Lambda
####

  FailoverLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-dr-failover'
      Description: !Sub |
        DR failover/failback for ${AppName}.
        FailoverRequest  ? DeployPaidResources=true  (activate DR).
        FailbackRequest  ? DeployPaidResources=false (shut down DR ? requires confirm_failback=true).
        Invoke via EventBridge or directly. Non-blocking.
      Handler: index.lambda_handler
      Role: !GetAtt FailoverLambdaRole.Arn
      Runtime: python3.12
      Timeout: 60
      Environment:
        Variables:
          ORG_NAME: !Ref OrgName
          APP_NAME: !Ref AppName
          NETWORK_STACK_NAME: !Ref NetworkStackName
          APP_STACK_NAME: !Ref AppStackName
          DB_INSTANCE_IDENTIFIER: !Ref DBInstanceIdentifier
          DR_DB_SECRET_ARN: !Ref DRDBSecretArn
          SOURCE_REGION: !Ref SourceRegion
          SNS_TOPIC_ARN:
            Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
      Code:
        ZipFile: !Sub |
          import boto3
          import logging
          import os
          from botocore.exceptions import ClientError

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
            """
            Handles both DR failover and failback by updating CloudFormation stacks.

            Invocation modes
            ----------------
            EventBridge (recommended) ? detail-type drives the operation:

              FailoverRequest:
              {
                "source": "pchc.dr.failover",
                "detail-type": "FailoverRequest",
                "detail": {
                  "app_name": "${AppName}",
                  "snapshot_identifier": "<arn>",     # optional ? auto-discovered if blank
                  "db_master_password": "<pw>",        # optional
                  "network_stack_name": "<name>",      # optional override
                  "app_stack_name": "<name>",          # optional override
                  "db_instance_identifier": "<id>"     # optional override
                }
              }

              FailbackRequest  (confirm_failback required ? safety pin):
              {
                "source": "pchc.dr.failover",
                "detail-type": "FailbackRequest",
                "detail": {
                  "app_name": "${AppName}",
                  "confirm_failback": true             # REQUIRED ? omitting rejects the request
                }
              }

            Direct Lambda invocation ? use "mode" field:
              Failover: {"mode": "failover", "snapshot_identifier": "...", "db_master_password": "..."}
              Failback: {"mode": "failback", "confirm_failback": true}
              Default mode (no field): failover

            Lambda is non-blocking. Returns as soon as all update_stack calls are accepted.
            CloudFormation provisions/deprovisions asynchronously. EventBridge notifies on completion.
            """

            # Support both EventBridge (detail wrapper) and direct invocation (flat payload)
            detail_type = event.get('detail-type', '')
            payload = event.get('detail', event)

            # Determine operation mode
            if detail_type == 'FailbackRequest' or payload.get('mode') == 'failback':
              mode = 'failback'
            else:
              mode = 'failover'

            region = os.environ['AWS_REGION']
            network_stack = payload.get('network_stack_name', os.environ['NETWORK_STACK_NAME'])
            app_stack = payload.get('app_stack_name', os.environ['APP_STACK_NAME'])
            sns_topic = os.environ.get('SNS_TOPIC_ARN', '')
            app_name = os.environ.get('APP_NAME', app_stack)

            cf = boto3.client('cloudformation', region_name=region)

            try:
              if mode == 'failback':
                handle_failback(cf, payload, app_name, network_stack, app_stack, sns_topic)
              else:
                handle_failover(cf, payload, app_name, network_stack, app_stack, sns_topic, region)
            except Exception as e:
              error_msg = f'DR {mode} FAILED [{app_name}]: {str(e)}'
              logger.exception(error_msg)
              notify(sns_topic, f'DR {mode.capitalize()} FAILED [{app_name}]', error_msg)
              raise


          def handle_failover(cf, payload, app_name, network_stack, app_stack, sns_topic, region):
            """
            Failover: sets DeployPaidResources=true on network stack then app stack.
            Order: network first (NAT GW up) ? app (DB, Cache, LBs, App Servers up).
            """
            db_instance_id = payload.get('db_instance_identifier', os.environ.get('DB_INSTANCE_IDENTIFIER', ''))
            snapshot_identifier = payload.get('snapshot_identifier', '')
            db_master_password = payload.get('db_master_password', '')
            org_name = os.environ.get('ORG_NAME', '')
            dr_db_secret_arn = os.environ.get('DR_DB_SECRET_ARN', '')

            # Auto-fetch DB master password from DR Secrets Manager secret if not provided
            if not db_master_password and dr_db_secret_arn:
              logger.info(f'Auto-fetching DB master password from secret: {dr_db_secret_arn}')
              db_master_password = fetch_db_master_password(region, dr_db_secret_arn)
              logger.info('DB master password fetched from Secrets Manager.')

            # Auto-discover latest snapshot if not provided
            if not snapshot_identifier and db_instance_id:
              logger.info(f'Auto-discovering latest snapshot for: {db_instance_id}')
              snapshot_identifier = find_latest_snapshot(region, db_instance_id)
              logger.info(f'Using snapshot: {snapshot_identifier}')

            # Auto-discover latest DR AMI replicated by EC2 Image Builder
            instance_ami = ''
            if org_name:
              logger.info(f'Auto-discovering latest DR AMI: {org_name}_{app_name}_dr-image_*')
              instance_ami = find_latest_ami(region, org_name, app_name)
              logger.info(f'Using AMI: {instance_ami}')

            # Step 1: Network stack ? activate NAT Gateways, Jump Host, VPC Endpoints
            logger.info(f'[FAILOVER 1/2] Updating network stack: {network_stack}')
            update_stack(cf, network_stack, deploy_paid='true')
            logger.info(f'[FAILOVER 1/2] Network stack update initiated.')

            # Step 2: App stack ? activate DB, Cache, LBs, App Servers
            logger.info(f'[FAILOVER 2/2] Updating app stack: {app_stack}')
            update_stack(cf, app_stack, deploy_paid='true', extra_params={
              'SnapshotIdentifier': snapshot_identifier,
              'DBMasterUserPassword': db_master_password,
              'InstanceAMI': instance_ami
            })
            logger.info(f'[FAILOVER 2/2] App stack update initiated.')

            summary = (
              f'DR failover initiated for [{app_name}].\n'
              f'Network stack : {network_stack}\n'
              f'App stack     : {app_stack}\n'
              f'Snapshot      : {snapshot_identifier or "(none ? fresh DB)"}\n'
              f'AMI           : {instance_ami or "(UsePreviousValue)"}\n\n'
              f'CloudFormation is now provisioning resources. '
              f'DB restore from snapshot takes 20-60 minutes. '
              f'You will receive a separate notification when stacks complete.'
            )
            logger.info(summary)
            notify(sns_topic, f'DR Failover Initiated [{app_name}]', summary)
            return {'statusCode': 200, 'body': summary}


          def handle_failback(cf, payload, app_name, network_stack, app_stack, sns_topic):
            """
            Failback: sets DeployPaidResources=false on app stack then network stack.
            Order: app first (DB, LBs, instances down) ? network (NAT GW down).
            Requires confirm_failback=true in the payload as an explicit safety pin.
            Run only AFTER DNS has been switched back to the primary region.
            """
            if not payload.get('confirm_failback'):
              raise ValueError(
                'Failback rejected: confirm_failback=true is required in the event detail. '
                'Ensure DNS has been switched back to the primary region before proceeding.'
              )

            # Step 1: App stack ? deactivate DB, Cache, LBs, App Servers
            logger.info(f'[FAILBACK 1/2] Updating app stack: {app_stack}')
            update_stack(cf, app_stack, deploy_paid='false')
            logger.info(f'[FAILBACK 1/2] App stack update initiated.')

            # Step 2: Network stack ? deactivate NAT Gateways, Jump Host, VPC Endpoints
            logger.info(f'[FAILBACK 2/2] Updating network stack: {network_stack}')
            update_stack(cf, network_stack, deploy_paid='false')
            logger.info(f'[FAILBACK 2/2] Network stack update initiated.')

            summary = (
              f'DR failback initiated for [{app_name}].\n'
              f'App stack     : {app_stack}\n'
              f'Network stack : {network_stack}\n\n'
              f'CloudFormation is now deprovisioning DR resources (DB, Cache, LBs, NAT GWs). '
              f'You will receive a separate notification when stacks complete. '
              f'S3 buckets, snapshots, and AMIs are retained.'
            )
            logger.info(summary)
            notify(sns_topic, f'DR Failback Initiated [{app_name}]', summary)
            return {'statusCode': 200, 'body': summary}


          def find_latest_snapshot(region, db_instance_identifier):
            """
            Auto-discovers the latest available RDS snapshot in the DR region.
            Cross-region snapshot copies appear as 'manual' type snapshots.
            Falls back to 'automated' snapshots if no manual ones found.
            """
            rds = boto3.client('rds', region_name=region)

            for snapshot_type in ['manual', 'automated']:
              response = rds.describe_db_snapshots(
                DBInstanceIdentifier=db_instance_identifier,
                SnapshotType=snapshot_type
              )
              snapshots = [s for s in response.get('DBSnapshots', []) if s.get('Status') == 'available']

              if snapshots:
                snapshots.sort(key=lambda x: x['SnapshotCreateTime'], reverse=True)
                latest = snapshots[0]
                logger.info(
                  f'Found {snapshot_type} snapshot: {latest["DBSnapshotArn"]} '
                  f'created at {latest["SnapshotCreateTime"]}'
                )
                return latest['DBSnapshotArn']

            raise Exception(
              f'No available snapshots found for DB instance: {db_instance_identifier}. '
              f'Ensure cross-region snapshot replication is enabled on the primary RDS instance, '
              f'or provide snapshot_identifier explicitly in the event payload.'
            )


          def fetch_db_master_password(region, secret_arn):
            """
            Reads DB_ROOT_PASSWORD from the DR Secrets Manager secret.
            The secret is synced from the live region by the secrets-sync Lambda,
            so the value reflects the current live DB master password.
            """
            import json
            sm = boto3.client('secretsmanager', region_name=region)
            response = sm.get_secret_value(SecretId=secret_arn)
            secret = json.loads(response['SecretString'])
            password = secret.get('DB_ROOT_PASSWORD', '')
            if not password:
              raise Exception(
                f'DB_ROOT_PASSWORD not found in secret: {secret_arn}. '
                f'Ensure the secrets-sync Lambda has populated this secret from the live region.'
              )
            return password


          def find_latest_ami(region, org_name, app_name):
            """
            Auto-discovers the latest available DR AMI in this region.
            AMIs are matched by the EC2 Image Builder DR naming pattern:
              {OrgName}_{AppName}_dr-image_{RecipeVersion}_{buildDate}
            The most recently created available AMI is returned.
            """
            ec2 = boto3.client('ec2', region_name=region)
            response = ec2.describe_images(
              Owners=['self'],
              Filters=[
                {'Name': 'name', 'Values': [f'{org_name}_{app_name}_dr-image_*']},
                {'Name': 'state', 'Values': ['available']}
              ]
            )
            images = response.get('Images', [])
            if not images:
              raise Exception(
                f'No available DR AMIs found matching: {org_name}_{app_name}_dr-image_*. '
                f'Ensure EC2 Image Builder has replicated at least one AMI to this region.'
              )
            images.sort(key=lambda x: x['CreationDate'], reverse=True)
            latest = images[0]
            logger.info(
              f'Found DR AMI: {latest["ImageId"]} ({latest["Name"]}) '
              f'created at {latest["CreationDate"]}'
            )
            return latest['ImageId']


          def _cfn_to_yaml(obj, _depth=0):
            import json as _j
            if isinstance(obj, str):
              obj = _j.loads(obj)
            def _key(k):
              s = str(k)
              if not s or ': ' in s or s[0] in '!&*[{|>\'"':
                return _j.dumps(s)
              return s
            def _scalar(v):
              if v is None:           return 'null'
              if isinstance(v, bool): return 'true' if v else 'false'
              if isinstance(v, (int, float)): return str(v)
              s = str(v)
              if not s: return '""'
              if (any(c in s for c in ':#{}[]!,&*|>\'"') or
                  s[0] in ' -?' or s[-1] == ' ' or '\n' in s or
                  s.lower() in ('true', 'false', 'null', 'yes', 'no', 'on', 'off')):
                return _j.dumps(s)
              try:
                float(s); return _j.dumps(s)
              except ValueError:
                pass
              return s
            def _node(o, d):
              p = '  ' * d
              if isinstance(o, dict):
                parts = []
                for k, v in o.items():
                  ks = _key(k)
                  if isinstance(v, (dict, list)):
                    if v:
                      parts.append(f'{p}{ks}:')
                      parts.append(_node(v, d + 1))
                    else:
                      parts.append(f'{p}{ks}: {{}}' if isinstance(v, dict) else f'{p}{ks}: []')
                  elif isinstance(v, bool):
                    parts.append(f'{p}{ks}: {"true" if v else "false"}')
                  elif v is None:
                    parts.append(f'{p}{ks}: null')
                  elif isinstance(v, (int, float)):
                    parts.append(f'{p}{ks}: {v}')
                  else:
                    parts.append(f'{p}{ks}: {_scalar(str(v))}')
                return '\n'.join(parts)
              parts = []
              for item in o:
                if isinstance(item, dict) and item:
                  kvs = list(item.items())
                  fk, fv = _key(str(kvs[0][0])), kvs[0][1]
                  if isinstance(fv, (dict, list)) and fv:
                    parts.append(f'{p}- {fk}:')
                    parts.append(_node(fv, d + 1))
                  elif isinstance(fv, bool):
                    parts.append(f'{p}- {fk}: {"true" if fv else "false"}')
                  elif fv is None:
                    parts.append(f'{p}- {fk}: null')
                  elif isinstance(fv, (int, float)):
                    parts.append(f'{p}- {fk}: {fv}')
                  else:
                    parts.append(f'{p}- {fk}: {_scalar(str(fv))}')
                  cp = p + '  '
                  for rk, rv in kvs[1:]:
                    rks = _key(str(rk))
                    if isinstance(rv, (dict, list)) and rv:
                      parts.append(f'{cp}{rks}:')
                      parts.append(_node(rv, d + 1))
                    elif isinstance(rv, bool):
                      parts.append(f'{cp}{rks}: {"true" if rv else "false"}')
                    elif rv is None:
                      parts.append(f'{cp}{rks}: null')
                    elif isinstance(rv, (int, float)):
                      parts.append(f'{cp}{rks}: {rv}')
                    else:
                      parts.append(f'{cp}{rks}: {_scalar(str(rv))}')
                elif isinstance(item, list) and item:
                  parts.append(f'{p}-')
                  parts.append(_node(item, d + 1))
                elif isinstance(item, bool):
                  parts.append(f'{p}- {"true" if item else "false"}')
                elif item is None:
                  parts.append(f'{p}- null')
                elif isinstance(item, (int, float)):
                  parts.append(f'{p}- {item}')
                else:
                  parts.append(f'{p}- {_scalar(str(item))}')
              return '\n'.join(parts)
            return _node(obj, _depth)

          def _fetch_as_yaml(cf, stack_name):
            resp = cf.get_template(StackName=stack_name, TemplateStage='Original')
            body = resp['TemplateBody']
            if isinstance(body, dict):
              logger.info("[FETCH_TEMPLATE] Returned as dict — converting to YAML | stack=%s", stack_name)
              return _cfn_to_yaml(body)
            if body.lstrip().startswith('{'):
              logger.info("[FETCH_TEMPLATE] Returned as JSON string — converting to YAML | stack=%s", stack_name)
              return _cfn_to_yaml(body)
            logger.info("[FETCH_TEMPLATE] Returned as YAML string | stack=%s", stack_name)
            return body

          def get_current_parameters(cf, stack_name):
            """Fetches current stack parameters as a dict."""
            response = cf.describe_stacks(StackName=stack_name)
            stack = response['Stacks'][0]
            return {p['ParameterKey']: p['ParameterValue'] for p in stack.get('Parameters', [])}


          def update_stack(cf, stack_name, deploy_paid, extra_params=None):
            """
            Updates a CloudFormation stack setting DeployPaidResources to the given value.
            All other parameters are preserved using UsePreviousValue=True.
            extra_params: optional dict of additional parameters to override.
            Non-blocking ? returns as soon as the update_stack API call succeeds.
            """
            if extra_params is None:
              extra_params = {}

            current_params = get_current_parameters(cf, stack_name)

            parameters = []
            for key in current_params:
              if key == 'DeployPaidResources':
                parameters.append({'ParameterKey': key, 'ParameterValue': deploy_paid})
              elif key in extra_params and extra_params[key]:
                parameters.append({'ParameterKey': key, 'ParameterValue': extra_params[key]})
              else:
                parameters.append({'ParameterKey': key, 'UsePreviousValue': True})

            template_body = _fetch_as_yaml(cf, stack_name)

            try:
              cf.update_stack(
                StackName=stack_name,
                TemplateBody=template_body,
                Parameters=parameters,
                Capabilities=[
                  'CAPABILITY_IAM',
                  'CAPABILITY_NAMED_IAM',
                  'CAPABILITY_AUTO_EXPAND'
                ]
              )
            except ClientError as e:
              code = e.response['Error']['Code']
              msg  = e.response['Error']['Message']
              if code == 'ValidationError' and 'No updates are to be performed' in msg:
                logger.info(f'[UPDATE_STACK] No changes needed — stack already in desired state | stack={stack_name}')
                return
              raise


          def notify(sns_topic_arn, subject, message):
            """Publishes a notification to SNS. Silently skips if no topic configured."""
            if not sns_topic_arn:
              return
            try:
              sns = boto3.client('sns')
              sns.publish(TopicArn=sns_topic_arn, Subject=subject, Message=message)
            except Exception:
              logger.warning('Failed to publish SNS notification', exc_info=True)

####
# EventBridge ? manual failover trigger scoped to this app
####

  # DR operator publishes a FailoverRequest event to activate the DR environment.
  # Rule is scoped to detail.app_name so each app deployment only responds to its own events.
  FailoverTriggerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${AWS::StackName}-failover-trigger'
      Description: !Sub 'Manual DR failover trigger for ${AppName}. Publish FailoverRequest with detail.app_name=${AppName}.'
      EventBusName: default
      EventPattern:
        source:
          - pchc.dr.failover
        detail-type:
          - FailoverRequest
        detail:
          app_name:
            - !Ref AppName
      State: ENABLED
      Targets:
        - Id: InvokeFailoverLambda
          Arn: !GetAtt FailoverLambdaFunction.Arn

  FailoverLambdaEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt FailoverLambdaFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt FailoverTriggerRule.Arn

####
# EventBridge ? manual failback trigger scoped to this app
####

  # DR operator publishes a FailbackRequest event to shut down DR and return to primary.
  # confirm_failback=true is enforced inside the Lambda as an additional safety pin.
  # Only trigger AFTER DNS has been switched back to the primary region.
  FailbackTriggerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${AWS::StackName}-failback-trigger'
      Description: !Sub 'Manual DR failback trigger for ${AppName}. Publish FailbackRequest with detail.app_name=${AppName} and confirm_failback=true.'
      EventBusName: default
      EventPattern:
        source:
          - pchc.dr.failover
        detail-type:
          - FailbackRequest
        detail:
          app_name:
            - !Ref AppName
      State: ENABLED
      Targets:
        - Id: InvokeFailbackLambda
          Arn: !GetAtt FailoverLambdaFunction.Arn

  FailbackLambdaEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt FailoverLambdaFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt FailbackTriggerRule.Arn

####
# EventBridge ? monitors CF stack events and notifies when failover/failback completes or fails
####

  StackEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${AWS::StackName}-stack-completion'
      Description: !Sub 'Notifies when DR network or app stack update for ${AppName} completes or fails.'
      EventPattern:
        source:
          - aws.cloudformation
        detail-type:
          - CloudFormation Stack Status Change
        detail:
          stack-id:
            - prefix: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${NetworkStackName}/'
            - prefix: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/'
          status-details:
            status:
              - UPDATE_COMPLETE
              - UPDATE_ROLLBACK_COMPLETE
              - UPDATE_FAILED
              - UPDATE_ROLLBACK_FAILED
      State: ENABLED
      Targets:
        - Id: NotifyStackCompletion
          Arn:
            Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
          InputTransformer:
            InputPathsMap:
              stack: '$.detail.stack-id'
              status: '$.detail.status-details.status'
              time: '$.time'
            InputTemplate: !Sub |
              "DR Stack Update ? ${AppName}"
              "Stack  : <stack>"
              "Status : <status>"
              "Time   : <time>"

  StackEventRuleSNSPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource:
              Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'

Outputs:

  FailoverLambdaArn:
    Description: ARN of the DR failover/failback Lambda function
    Value: !GetAtt FailoverLambdaFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FailoverLambdaArn'

  FailoverLambdaName:
    Description: Name of the DR failover/failback Lambda
    Value: !Ref FailoverLambdaFunction
    Export:
      Name: !Sub '${AWS::StackName}-FailoverLambdaName'

  HowToFailover:
    Description: |
      Trigger DR failover via EventBridge (recommended).
      Omit snapshot_identifier to use auto-discovery (requires DBInstanceIdentifier to be set).
      Run this when disaster is declared and DNS has been switched to the DR region.
    Value: !Sub |
      aws events put-events \
        --region ${AWS::Region} \
        --entries '[{
          "Source": "pchc.dr.failover",
          "DetailType": "FailoverRequest",
          "EventBusName": "default",
          "Detail": "{\"app_name\":\"${AppName}\",\"snapshot_identifier\":\"<arn-or-blank>\",\"db_master_password\":\"<password-or-blank>\"}"
        }]'

  HowToFailback:
    Description: |
      Trigger DR failback via EventBridge ? shuts down all DR paid resources.
      confirm_failback=true is mandatory. The Lambda rejects the request without it.
      Run this ONLY AFTER DNS has been switched back to the primary region and
      the primary environment is confirmed stable.
    Value: !Sub |
      aws events put-events \
        --region ${AWS::Region} \
        --entries '[{
          "Source": "pchc.dr.failover",
          "DetailType": "FailbackRequest",
          "EventBusName": "default",
          "Detail": "{\"app_name\":\"${AppName}\",\"confirm_failback\":true}"
        }]'

  HowToFailoverDirect:
    Description: Trigger DR failover by invoking Lambda directly (fallback).
    Value: !Sub |
      aws lambda invoke \
        --function-name ${FailoverLambdaFunction} \
        --region ${AWS::Region} \
        --payload '{"mode":"failover","snapshot_identifier":"<arn-or-blank>","db_master_password":"<password-or-blank>"}' \
        response.json

  HowToFailbackDirect:
    Description: Trigger DR failback by invoking Lambda directly (fallback). confirm_failback=true is mandatory.
    Value: !Sub |
      aws lambda invoke \
        --function-name ${FailoverLambdaFunction} \
        --region ${AWS::Region} \
        --payload '{"mode":"failback","confirm_failback":true}' \
        response.json
