AWSTemplateFormatVersion: 2010-09-09
Description: |
  DR Failover & Failback Automation ? universal, one deployment per app.
  Provisions a Lambda function and two EventBridge rules scoped to a specific app name:
    - FailoverRequest  ? sets DeployPaidResources=true  (network first, then app)
    - FailbackRequest  ? sets DeployPaidResources=false (app first, then network)
  Failback requires confirm_failback=true in the event detail as a safety pin.
  At failover, auto-discovers the latest DR AMI replicated by EC2 Image Builder
  (pattern: {OrgName}_{AppName}_dr-image_*) and the latest RDS snapshot.
  Lambda is non-blocking ? fires CloudFormation update_stack calls and returns immediately.
  CloudFormation handles the actual provisioning asynchronously (DB restore: 20-60 min).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "1. App Identity"
        Parameters:
          - OrgName
          - AppName
          - SourceRegion
      - Label:
          default: "2. Stack References"
        Parameters:
          - NetworkStackName
          - AppStackName
          - SNSStackName
      - Label:
          default: "3. DR Database Configuration"
        Parameters:
          - DBInstanceIdentifier
          - DRDBSecretArn

    ParameterLabels:
      OrgName:
        default: Organization Name
      AppName:
        default: Application Name
      SourceRegion:
        default: Live / Source Region
      NetworkStackName:
        default: DR Network Stack Name
      AppStackName:
        default: DR Application Stack Name
      SNSStackName:
        default: SNS Stack Name
      DBInstanceIdentifier:
        default: DB Instance Identifier (DR region ? for snapshot auto-discovery)
      DRDBSecretArn:
        default: DR DB Secret ARN (Secrets Manager ? for auto-fetching DB master password)

Parameters:

  OrgName:
    Description: |
      Organization name prefix used to build the DR AMI search pattern.
      Must match the OrgName used in the EC2 Image Builder stack.
      DR AMIs are discovered by the pattern: {OrgName}_{AppName}_dr-image_*
      Example: pchc_pesonet20_dr-image_2025.11.2414480_2026-05-02T16-52-46.639Z
    Type: String
    Default: pchc
    AllowedPattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    ConstraintDescription: Lowercase letters, numbers, and hyphens only.

  AppName:
    Description: |
      Short identifier for this application (e.g. pesonet20, mis, pddts).
      Used to scope both EventBridge trigger rules ? only events whose detail.app_name
      matches this value will activate this stack's failover or failback.
      Must be unique per deployment of this template. Use lowercase, hyphens allowed.
    Type: String
    MinLength: 2
    MaxLength: 20
    AllowedPattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    ConstraintDescription: Lowercase letters, numbers, and hyphens only.

  SourceRegion:
    Description: AWS region where the primary/live environment runs (e.g. ap-southeast-1). Informational only.
    Type: String
    Default: ap-southeast-1

  NetworkStackName:
    Description: |
      Name of the DR network CloudFormation stack to update.
      This stack must use common/network.yaml and have a DeployPaidResources parameter.
      Failover sets DeployPaidResources=true  ? provisions NAT Gateways, Jump Host, VPC Endpoints.
      Failback sets DeployPaidResources=false ? tears them down after the app stack is stopped.
    Type: String
    Default: pchc-productiondr-uw2-network
    MinLength: 1

  AppStackName:
    Description: |
      Name of the DR application CloudFormation stack to update.
      Must have DeployPaidResources, SnapshotIdentifier, and DBMasterUserPassword parameters.
      All other parameters are preserved with UsePreviousValue=true on every update.
    Type: String
    Default: pchc-productiondr-uw2-pesonet20
    MinLength: 1

  SNSStackName:
    Description: |
      Name of the SNS CloudFormation stack. Must export ${SNSStackName}-TopicArn.
      Notifications are sent on failover/failback initiation, completion, and failure.
    Type: String
    Default: pchc-productiondr-uw2-sns
    MinLength: 1

  DBInstanceIdentifier:
    Description: |
      RDS DB instance identifier in the DR region used to auto-discover the latest available snapshot.
      Cross-region snapshot copies appear as manual snapshots in the DR region.
      Leave blank to skip auto-discovery ? snapshot_identifier must then be provided explicitly
      in the EventBridge event detail or Lambda invocation payload.
      Only used during failover (ignored during failback).
    Type: String
    Default: ''

  DRDBSecretArn:
    Description: |
      ARN of the Secrets Manager secret in the DR region containing DB credentials.
      Use the DRDBSecretArn output of the app CloudFormation stack (e.g. pchc-productiondr-uw2-pesonet20).
      At failover, the Lambda reads DB_ROOT_PASSWORD from this secret automatically ?
      no need to provide db_master_password in the EventBridge event payload.
      Leave blank to require db_master_password explicitly in the event payload.
    Type: String
    Default: ''

Resources:

####
# IAM
####

  FailoverLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-failover-lambda-role'
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DRFailoverPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: CloudFormationUpdate
                Effect: Allow
                Action:
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:GetTemplate
                Resource:
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${NetworkStackName}/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*'
              - Sid: PassRoleForCloudFormation
                Effect: Allow
                Action: iam:PassRole
                Resource: '*'
              - Sid: CloudFormationFullAccess
                Effect: Allow
                Action:
                  - cloudformation:*
                Resource: '*'
              - Sid: EC2Provisioning
                Effect: Allow
                Action:
                  - ec2:*
                Resource: '*'
              - Sid: RDSProvisioning
                Effect: Allow
                Action:
                  - rds:*
                Resource: '*'
              - Sid: ELBProvisioning
                Effect: Allow
                Action:
                  - elasticloadbalancing:*
                Resource: '*'
              - Sid: AutoScalingProvisioning
                Effect: Allow
                Action:
                  - autoscaling:*
                Resource: '*'
              - Sid: EFSProvisioning
                Effect: Allow
                Action:
                  - elasticfilesystem:*
                Resource: '*'
              - Sid: ElastiCacheProvisioning
                Effect: Allow
                Action:
                  - elasticache:*
                Resource: '*'
              - Sid: IAMProvisioning
                Effect: Allow
                Action:
                  - iam:*
                Resource: '*'
              - Sid: S3Provisioning
                Effect: Allow
                Action:
                  - s3:*
                Resource: '*'
              - Sid: CodeDeployProvisioning
                Effect: Allow
                Action:
                  - codedeploy:*
                Resource: '*'
              - Sid: CloudWatchProvisioning
                Effect: Allow
                Action:
                  - cloudwatch:*
                  - logs:*
