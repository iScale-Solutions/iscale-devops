          Value: !GetAtt PhilpassHealthCheck.HealthCheckId
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: !Ref HealthCheckFailureThreshold
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'

  PhilpassCanaryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub ['/aws/synthetics/${Env}-drm-philpass', {Env: !FindInMap [EnvShort, !Ref EnvName, Name]}]
      RetentionInDays: !Ref LogRetentionDays

  PhilpassCanary:
    Type: AWS::Synthetics::Canary
    DependsOn: PhilpassCanaryLogGroup
    Properties:
      Name: !Join ['-', [!FindInMap [EnvShort, !Ref EnvName, Name], 'drm', 'philpass']]
      ArtifactS3Location: !Sub 's3://${CanaryArtifactBucket}/${OrgName}/philpass'
      ExecutionRoleArn: !GetAtt CanaryExecutionRole.Arn
      RuntimeVersion: !Ref CanaryRuntime
      Schedule:
        Expression: !Ref CanarySchedule
      RunConfig:
        TimeoutInSeconds: 60
        EnvironmentVariables:
          ENDPOINT: !Ref PhilpassEndpoint
          HEALTH_PATH: !Ref PhilpassHealthCheckPath
      StartCanaryAfterCreation: true
      DeleteLambdaResourcesOnCanaryDeletion: true
      Code:
        Handler: index.handler
        Script: |
          const synthetics = require('Synthetics');
          exports.handler = async () => {
              await synthetics.executeHttpStep(
                  'Heartbeat',
                  'https://' + process.env.ENDPOINT + process.env.HEALTH_PATH
              );
          };
      Tags:
        - Key: Name
          Value: !Sub ['${OrgName}-${Env}-${Name}-philpass', {Env: !FindInMap [EnvShort, !Ref EnvName, Name]}]
        - Key: Organization
          Value: !Ref OrgName
        - Key: Environment
          Value: !Ref EnvName

  PhilpassCanaryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !Ref Name, 'philpass-canary-alarm']]
      AlarmDescription: PhilPass Synthetics canary heartbeat failed
      Namespace: CloudWatchSynthetics
      MetricName: SuccessPercent
      Dimensions:
        - Name: CanaryName
          Value: !Ref PhilpassCanary
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'

  PhilpassCompositeAlarm:
    Type: AWS::CloudWatch::CompositeAlarm
    Properties:
      AlarmName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !Ref Name, 'philpass-external-composite-alarm']]
      AlarmDescription: PhilPass is unreachable — both Route 53 health check and Synthetics canary are failing
      AlarmRule: !Sub 'ALARM(${PhilpassHealthCheckAlarm}) AND ALARM(${PhilpassCanaryAlarm})'
      AlarmActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
