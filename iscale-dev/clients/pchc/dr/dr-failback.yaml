AWSTemplateFormatVersion: 2010-09-09
# Event payload (standard EC2/ASG apps — e.g. pesonet20):
#   { "app_name": "<stack>", "action": "failback", "network_stack_name": "<network-stack>" }
#   { "app_name": "<stack>", "action": "comment" }
#   { "app_name": "<stack>", "action": "uncomment" }
#   { "app_name": "<stack>", "action": "set_deploy_paid_false" }
# Stack pattern: pchc-<env>-<region>-<app>  e.g. pchc-tdr-ue2-pesonet20
#
# Event payload (ECS Fargate multi-stack apps — e.g. SmartAPI):
#   {
#     "action": "ecs_failback",
#     "network_stack_name": "<network-stack>",
#     "prereq_stack_name":  "<prereq-stack>",
#     "parallel_stacks": [{"stack_name": "<app-stack>"}, {"stack_name": "<portal-stack>"}]
#   }
# SmartAPI stacks (TestDR):       pchc-tdr-ue2-smartapi-network, -prereq, -smartapi, -smartportal
# SmartAPI stacks (ProductionDR): pchc-productiondr-uw2-smartapi-network, -prereq, -smartapi, -smartportal
Description: >-
  DR Failback — patches CFN templates and parameters to tear down paid DR resources.
  Supports standard EC2/ASG apps (comment/uncomment + DeployPaidResources=false) and
  ECS Fargate multi-stack apps (ecs_failback action). All config passed via payload.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - Name
          - OrgName
      - Label:
          default: Configuration
        Parameters:
          - LogRetentionDays

    ParameterLabels:
      Name:
        default: Stack / Function Name
      OrgName:
        default: Organization Name
      LogRetentionDays:
        default: CloudWatch Log Retention (days)

Parameters:

  Name:
    Description: Unique identifier used in the function name and all resource names.
    Type: String
    Default: dr-failback

  OrgName:
    Description: Organization name prefix (e.g. pchc).
    Type: String
    Default: pchc

  LogRetentionDays:
    Description: Number of days to retain Lambda CloudWatch logs.
    Type: Number
    Default: 90
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

  NetworkTemplateUrl:
    Description: S3 URL for the network stack template. Used in step 4 to bypass the 51,200-byte TemplateBody limit.
    Type: String
    Default: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/network.yaml

  TempTemplateBucket:
    Description: S3 bucket used to stage patched app templates during failback (steps 1 + 3). Must be in the same region as this stack. Used to bypass the 51,200-byte TemplateBody API limit.
    Type: String
    Default: cf-templates-190aa836foqbm-us-east-2

Resources:

####
# IAM
####

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

####
# CloudWatch Logs
####

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}'
      RetentionInDays: !Ref LogRetentionDays

####
# Lambda
####

  LambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}'
      Description: >-
        DR Failback Lambda. Actions: comment | uncomment | update_stack | set_deploy_paid_false |
        set_deploy_paid_false_both | check_stack_status | check_both_stacks_status.
        Payload: { "app_name": "pchc-tdr-ue2-pesonet", "action": "<action>" }
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.12
      Timeout: 30
      Environment:
        Variables:
          TEMP_TEMPLATE_BUCKET: !Ref TempTemplateBucket
      Code:
        ZipFile: |
          import logging
          import boto3
          from botocore.exceptions import ClientError

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          TERMINAL_STATES = {
              'CREATE_COMPLETE', 'UPDATE_COMPLETE',
              'UPDATE_ROLLBACK_COMPLETE', 'UPDATE_ROLLBACK_FAILED',
              'ROLLBACK_COMPLETE', 'ROLLBACK_FAILED',
              'DELETE_COMPLETE', 'DELETE_FAILED', 'CREATE_FAILED',
          }
          ROLLBACK_STATES = {
              'UPDATE_ROLLBACK_COMPLETE', 'UPDATE_ROLLBACK_FAILED',
              'ROLLBACK_COMPLETE', 'ROLLBACK_FAILED',
              'DELETE_FAILED', 'CREATE_FAILED',
          }

          def _comment_line(line):
              ending = ''
              content = line
              if content.endswith('\r\n'):
                  ending, content = '\r\n', content[:-2]
              elif content.endswith('\n'):
                  ending, content = '\n', content[:-1]
              elif content.endswith('\r'):
                  ending, content = '\r', content[:-1]
              stripped = content.lstrip(' ')
              indent = len(content) - len(stripped)
              return ' ' * indent + '# ' + stripped + ending

          def _uncomment_line(line):
              ending = ''
              content = line
              if content.endswith('\r\n'):
                  ending, content = '\r\n', content[:-2]
              elif content.endswith('\n'):
                  ending, content = '\n', content[:-1]
              elif content.endswith('\r'):
                  ending, content = '\r', content[:-1]
              stripped = content.lstrip(' ')
              indent = len(content) - len(stripped)
              if stripped.startswith('# '):
                  return ' ' * indent + stripped[2:] + ending
              return line

          def _patch_cfn_parameter(template_body, param_key, comment):
              SEARCHING, IN_RESOURCE, IN_PROPS, IN_PARAMS, PATCHING = range(5)
              target     = f'{param_key}:'  if comment else f'# {param_key}:'
              patch_line = _comment_line    if comment else _uncomment_line
              state = SEARCHING
              resource_indent = props_indent = params_indent = key_indent = 0
              result = []
              for line in template_body.splitlines(keepends=True):
                  raw      = line.rstrip('\r\n')
                  stripped = raw.lstrip()
                  indent   = len(raw) - len(stripped)
                  is_blank = not stripped
                  if state == SEARCHING:
                      if not is_blank and stripped.endswith('ServerStack:'):
                          state = IN_RESOURCE
                          resource_indent = indent
                      result.append(line)
                  elif state == IN_RESOURCE:
                      if not is_blank and indent <= resource_indent:
                          if stripped.endswith('ServerStack:'):
                              resource_indent = indent
                              props_indent = params_indent = key_indent = 0
                          else:
                              state = SEARCHING
                          result.append(line)
                          continue
                      if stripped == 'Properties:' and indent > resource_indent:
                          state = IN_PROPS
                          props_indent = indent
                      result.append(line)
                  elif state == IN_PROPS:
                      if not is_blank and indent <= resource_indent:
                          if stripped.endswith('ServerStack:'):
                              state = IN_RESOURCE
                              resource_indent = indent
                              props_indent = params_indent = key_indent = 0
                          else:
                              state = SEARCHING
                          result.append(line)
                          continue
                      if not is_blank and indent <= props_indent:
                          state = IN_RESOURCE
                          result.append(line)
                          continue
                      if stripped == 'Parameters:' and indent > props_indent:
                          state = IN_PARAMS
                          params_indent = indent
                      result.append(line)
                  elif state == IN_PARAMS:
                      if not is_blank and indent <= resource_indent:
                          if stripped.endswith('ServerStack:'):
                              state = IN_RESOURCE
                              resource_indent = indent
                              props_indent = params_indent = key_indent = 0
                          else:
                              state = SEARCHING
                          result.append(line)
                          continue
                      if not is_blank and indent <= props_indent:
                          state = IN_RESOURCE
                          result.append(line)
                          continue
                      if not is_blank and indent <= params_indent:
                          state = IN_PROPS
                          result.append(line)
                          continue
                      if stripped.startswith(target) and indent > params_indent:
                          state = PATCHING
                          key_indent = indent
                          result.append(patch_line(line))
                          continue
                      result.append(line)
                  elif state == PATCHING:
                      if is_blank or indent <= key_indent:
                          state = IN_PARAMS
                          result.append(line)
                      else:
                          result.append(patch_line(line))
              return ''.join(result)

          def _get_app_name(event):
              app_name = (event.get('app_name') or event.get('AppName')
                          or event.get('stack_name') or event.get('StackName'))
              if not app_name:
                  raise ValueError("Event must contain 'app_name'")
              return app_name

          def _get_current_parameters(cfn, stack_name):
              resp = cfn.describe_stacks(StackName=stack_name)
              return resp['Stacks'][0].get('Parameters', [])

          def _cfn_to_yaml(obj, _depth=0):
              import json as _j
              if isinstance(obj, str):
                  obj = _j.loads(obj)
              def _key(k):
                  s = str(k)
                  if not s or ': ' in s or s[0] in '!&*[{|>\'"':
                      return _j.dumps(s)
                  return s
              def _scalar(v):
                  if v is None:             return 'null'
                  if isinstance(v, bool):   return 'true' if v else 'false'
                  if isinstance(v, (int, float)): return str(v)
                  s = str(v)
                  if not s: return '""'
                  if (any(c in s for c in ':#{}[]!,&*|>\'"') or
                          s[0] in ' -?' or s[-1] == ' ' or '\n' in s or
                          s.lower() in ('true', 'false', 'null', 'yes', 'no', 'on', 'off')):
                      return _j.dumps(s)
                  try:
                      float(s); return _j.dumps(s)
                  except ValueError:
                      pass
                  return s
              def _node(o, d):
                  p = '  ' * d
                  if isinstance(o, dict):
                      parts = []
                      for k, v in o.items():
                          ks = _key(k)
                          if isinstance(v, (dict, list)):
                              if v:
                                  parts.append(f'{p}{ks}:')
                                  parts.append(_node(v, d + 1))
                              else:
                                  parts.append(f'{p}{ks}: {{}}' if isinstance(v, dict) else f'{p}{ks}: []')
                          elif isinstance(v, bool):
                              parts.append(f'{p}{ks}: {"true" if v else "false"}')
                          elif v is None:
                              parts.append(f'{p}{ks}: null')
                          elif isinstance(v, (int, float)):
                              parts.append(f'{p}{ks}: {v}')
                          else:
                              parts.append(f'{p}{ks}: {_scalar(str(v))}')
                      return '\n'.join(parts)
                  parts = []
                  for item in o:
                      if isinstance(item, dict) and item:
                          kvs = list(item.items())
                          fk, fv = _key(str(kvs[0][0])), kvs[0][1]
                          if isinstance(fv, (dict, list)) and fv:
                              parts.append(f'{p}- {fk}:')
                              parts.append(_node(fv, d + 2))
                          elif isinstance(fv, bool):
                              parts.append(f'{p}- {fk}: {"true" if fv else "false"}')
                          elif fv is None:
                              parts.append(f'{p}- {fk}: null')
                          elif isinstance(fv, (int, float)):
                              parts.append(f'{p}- {fk}: {fv}')
                          else:
                              parts.append(f'{p}- {fk}: {_scalar(str(fv))}')
                          cp = p + '  '
                          for rk, rv in kvs[1:]:
                              rks = _key(str(rk))
                              if isinstance(rv, (dict, list)) and rv:
                                  parts.append(f'{cp}{rks}:')
                                  parts.append(_node(rv, d + 2))
                              elif isinstance(rv, bool):
                                  parts.append(f'{cp}{rks}: {"true" if rv else "false"}')
                              elif rv is None:
                                  parts.append(f'{cp}{rks}: null')
                              elif isinstance(rv, (int, float)):
                                  parts.append(f'{cp}{rks}: {rv}')
                              else:
                                  parts.append(f'{cp}{rks}: {_scalar(str(rv))}')
                      elif isinstance(item, list) and item:
                          parts.append(f'{p}-')
                          parts.append(_node(item, d + 1))
                      elif isinstance(item, bool):
                          parts.append(f'{p}- {"true" if item else "false"}')
                      elif item is None:
                          parts.append(f'{p}- null')
                      elif isinstance(item, (int, float)):
                          parts.append(f'{p}- {item}')
                      else:
                          parts.append(f'{p}- {_scalar(str(item))}')
                  return '\n'.join(parts)
              return _node(obj, _depth)

          def _fetch_as_yaml(cfn, stack_name):
              resp = cfn.get_template(StackName=stack_name, TemplateStage='Original')
              body = resp['TemplateBody']
              if isinstance(body, dict):
                  logger.info("[FETCH_TEMPLATE] Returned as dict — converting to YAML | stack=%s", stack_name)
                  return _cfn_to_yaml(body)
              if body.lstrip().startswith('{'):
                  logger.info("[FETCH_TEMPLATE] Returned as JSON string — converting to YAML | stack=%s", stack_name)
                  return _cfn_to_yaml(body)
              logger.info("[FETCH_TEMPLATE] Returned as YAML string | stack=%s", stack_name)
              return body

          def _submit_deploy_paid_false(cfn, stack_name, preserve_format=True, template_url=None):
              params = []
              for p in _get_current_parameters(cfn, stack_name):
                  if p['ParameterKey'] == 'DeployPaidResources':
                      logger.info("[SET_DEPLOY_PAID_FALSE] Current value=%s | stack=%s", p['ParameterValue'], stack_name)
                      params.append({'ParameterKey': 'DeployPaidResources', 'ParameterValue': 'false'})
                  else:
                      params.append({'ParameterKey': p['ParameterKey'], 'UsePreviousValue': True})
              if template_url:
                  update_kwargs = dict(
                      StackName=stack_name,
                      TemplateURL=template_url,
                      Parameters=params,
                      Capabilities=['CAPABILITY_IAM', 'CAPABILITY_NAMED_IAM', 'CAPABILITY_AUTO_EXPAND'],
                  )
              elif preserve_format:
                  template_body = _fetch_as_yaml(cfn, stack_name)
                  update_kwargs = dict(
                      StackName=stack_name,
                      TemplateBody=template_body,
                      Parameters=params,
                      Capabilities=['CAPABILITY_IAM', 'CAPABILITY_NAMED_IAM', 'CAPABILITY_AUTO_EXPAND'],
                  )
              else:
                  update_kwargs = dict(
                      StackName=stack_name,
                      UsePreviousTemplate=True,
                      Parameters=params,
                      Capabilities=['CAPABILITY_IAM', 'CAPABILITY_NAMED_IAM', 'CAPABILITY_AUTO_EXPAND'],
                  )
              try:
                  cfn.update_stack(**update_kwargs)
                  logger.info("[SET_DEPLOY_PAID_FALSE] Update submitted | stack=%s", stack_name)
                  return {'submitted': True}
              except ClientError as e:
                  code = e.response['Error']['Code']
                  msg  = e.response['Error']['Message']
                  if code == 'ValidationError' and 'No updates are to be performed' in msg:
                      logger.info("[SET_DEPLOY_PAID_FALSE] Already false | stack=%s", stack_name)
                      return {'submitted': False, 'reason': 'already_false'}
                  raise

          def _get_stack_status(cfn, stack_name):
              try:
                  resp   = cfn.describe_stacks(StackName=stack_name)
                  status = resp['Stacks'][0]['StackStatus']
              except ClientError as e:
                  logger.warning("[GET_STATUS] Could not describe stack | stack=%s | error=%s", stack_name, e)
                  return {'status': 'UNKNOWN', 'complete': False, 'rollback': False}
              complete = status in TERMINAL_STATES
              rollback = status in ROLLBACK_STATES
              return {'status': status, 'complete': complete, 'rollback': rollback}

          def _upload_template_to_s3(template_body, stack_name, action):
              import os
              region = os.environ.get('AWS_REGION', 'us-east-2')
              bucket = os.environ.get('TEMP_TEMPLATE_BUCKET', '')
              if not bucket:
                  raise ValueError('TEMP_TEMPLATE_BUCKET environment variable not set')
              key = f'failback/{stack_name}/{action}.yaml'
              s3 = boto3.client('s3', region_name=region)
              s3.put_object(Bucket=bucket, Key=key, Body=template_body.encode('utf-8'), ContentType='text/plain')
              url = f'https://{bucket}.s3.{region}.amazonaws.com/{key}'
              logger.info("[S3_UPLOAD] Uploaded patched template | bucket=%s | key=%s", bucket, key)
              return url

          def _handle_patch(event, action):
              app_name = _get_app_name(event)
              logger.info("[PATCH] Start | stack=%s | action=%s", app_name, action)
              cfn = boto3.client('cloudformation')
              template_body = _fetch_as_yaml(cfn, app_name)
              logger.info("[PATCH] Template ready | size=%d chars | stack=%s", len(template_body), app_name)
              modified = _patch_cfn_parameter(template_body, param_key='LoadBalancerStackName', comment=(action == 'comment'))
              patched = modified != template_body
              logger.info("[PATCH] Result | patched=%s | stack=%s | action=%s", patched, app_name, action)
              if not patched:
                  logger.info("[PATCH] No changes — already in desired state | stack=%s | action=%s", app_name, action)
              template_s3_url = _upload_template_to_s3(modified, app_name, action)
              return {'stack_name': app_name, 'action': action, 'patched': patched, 'template_s3_url': template_s3_url}

          def _handle_update_stack(event):
              app_name = _get_app_name(event)
              template_s3_url = event.get('template_s3_url')
              if not template_s3_url:
                  raise ValueError("update_stack action requires 'template_s3_url' in the event")
              logger.info("[UPDATE_STACK] Submitting template update | stack=%s | url=%s", app_name, template_s3_url)
              cfn = boto3.client('cloudformation')
              parameters = [{'ParameterKey': p['ParameterKey'], 'UsePreviousValue': True}
                            for p in _get_current_parameters(cfn, app_name)]
              try:
                  cfn.update_stack(
                      StackName=app_name,
                      TemplateURL=template_s3_url,
                      Parameters=parameters,
                      Capabilities=['CAPABILITY_IAM', 'CAPABILITY_NAMED_IAM', 'CAPABILITY_AUTO_EXPAND'],
                  )
                  logger.info("[UPDATE_STACK] Submitted | stack=%s", app_name)
                  return {'submitted': True, 'stack_name': app_name}
              except ClientError as e:
                  code = e.response['Error']['Code']
                  msg  = e.response['Error']['Message']
                  if code == 'ValidationError' and 'No updates are to be performed' in msg:
                      logger.info("[UPDATE_STACK] No resource changes needed | stack=%s", app_name)
                      return {'submitted': False, 'reason': 'no_resource_changes_needed', 'stack_name': app_name}
                  raise

          def _handle_set_deploy_paid_false(event):
              app_name = _get_app_name(event)
              preserve_format = event.get('preserve_format', True)
              template_url = event.get('template_url')
              logger.info("[SET_DEPLOY_PAID_FALSE] Start | stack=%s | preserve_format=%s | template_url=%s",
                          app_name, preserve_format, bool(template_url))
              cfn = boto3.client('cloudformation')
              result = _submit_deploy_paid_false(cfn, app_name, preserve_format=preserve_format, template_url=template_url)
              if result['submitted']:
                  return {'submitted': True, 'stack_name': app_name}
              return {'submitted': False, 'reason': result.get('reason', 'already_false'), 'stack_name': app_name}

          def _handle_set_deploy_paid_false_both(event):
              app_name = _get_app_name(event)
              network_stack = event.get('network_stack_name') or f'{app_name}-network'
              logger.info("[SET_DEPLOY_PAID_FALSE_BOTH] Start | app=%s | network=%s", app_name, network_stack)
              cfn = boto3.client('cloudformation')
              app_result     = _submit_deploy_paid_false(cfn, app_name)
              network_result = _submit_deploy_paid_false(cfn, network_stack)
              logger.info(
                  "[SET_DEPLOY_PAID_FALSE_BOTH] Done | app_submitted=%s | network_submitted=%s",
                  app_result['submitted'], network_result['submitted'],
              )
              return {
                  'app_name':           app_name,
                  'network_stack_name': network_stack,
                  'app_submitted':      app_result['submitted'],
                  'network_submitted':  network_result['submitted'],
              }

          def _handle_check_stack_status(event):
              app_name = _get_app_name(event)
              cfn = boto3.client('cloudformation')
              s = _get_stack_status(cfn, app_name)
              if s['rollback']:
                  logger.error("[CHECK_STATUS] ROLLBACK/FAILURE | stack=%s | status=%s", app_name, s['status'])
              elif s['complete']:
                  logger.info("[CHECK_STATUS] COMPLETE | stack=%s | status=%s", app_name, s['status'])
              else:
                  logger.info("[CHECK_STATUS] IN PROGRESS | stack=%s | status=%s", app_name, s['status'])
              return {'update_complete': s['complete'], 'rollback_occurred': s['rollback'], 'status': s['status'], 'stack_name': app_name}

          def _handle_check_both_stacks_status(event):
              app_name = _get_app_name(event)
              network_stack = event.get('network_stack_name') or f'{app_name}-network'
              logger.info("[CHECK_BOTH_STATUS] Checking | app=%s | network=%s", app_name, network_stack)
              cfn = boto3.client('cloudformation')
              app_s     = _get_stack_status(cfn, app_name)
              network_s = _get_stack_status(cfn, network_stack)
              any_rollback  = app_s['rollback'] or network_s['rollback']
              both_complete = app_s['complete'] and network_s['complete']
              logger.info(
                  "[CHECK_BOTH_STATUS] app=%s(%s) network=%s(%s) | both_complete=%s | any_rollback=%s",
                  app_name, app_s['status'], network_stack, network_s['status'], both_complete, any_rollback,
              )
              return {
                  'app_name':           app_name,
                  'network_stack_name': network_stack,
                  'app_status':         app_s['status'],
                  'network_status':     network_s['status'],
                  'both_complete':      both_complete,
                  'any_rollback':       any_rollback,
              }

          def handler(event, context):
              action = event.get('action', 'comment').lower()
              if action in ('comment', 'uncomment'):
                  return _handle_patch(event, action)
              if action == 'update_stack':
                  return _handle_update_stack(event)
              if action == 'set_deploy_paid_false':
                  return _handle_set_deploy_paid_false(event)
              if action == 'set_deploy_paid_false_both':
                  return _handle_set_deploy_paid_false_both(event)
              if action == 'check_stack_status':
                  return _handle_check_stack_status(event)
              if action == 'check_both_stacks_status':
                  return _handle_check_both_stacks_status(event)
              raise ValueError(f"Unknown action: {action!r}")

####
# IAM — Step Functions
####

  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-sfn-role'
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt LambdaFunction.Arn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'

####
# CloudWatch Logs — Step Functions
####

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/states/${AWS::StackName}'
      RetentionInDays: !Ref LogRetentionDays

####
# Step Functions — Standard State Machine
####

  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    DependsOn: StateMachineLogGroup
    Properties:
      StateMachineName: !Sub '${AWS::StackName}'
      StateMachineType: STANDARD
      RoleArn: !GetAtt StepFunctionsRole.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
      DefinitionString: !Sub |
        {
          "Comment": "DR Failback — four workflows: (1) comment/uncomment + apply template update, (2) set DeployPaidResources=false + poll, (3) failback 4-step sequential orchestration. Routed by 'action' in the input payload.",
          "StartAt": "ValidateAction",
          "States": {

            "ValidateAction": {
              "Comment": "Route to the correct workflow based on action.",
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.action",
                  "StringEquals": "comment",
                  "Next": "PatchTemplate"
                },
                {
                  "Variable": "$.action",
                  "StringEquals": "uncomment",
                  "Next": "PatchTemplate"
                },
                {
                  "Variable": "$.action",
                  "StringEquals": "set_deploy_paid_false",
                  "Next": "SetDeployPaidFalse"
                },
                {
                  "Variable": "$.action",
                  "StringEquals": "failback",
                  "Next": "FailbackStep1Comment"
                },
                {
                  "Variable": "$.action",
                  "StringEquals": "ecs_failback",
                  "Next": "ECSFailbackParallelAppStacks"
                }
              ],
              "Default": "InvalidAction"
            },

            "InvalidAction": {
              "Type": "Fail",
              "Error": "InvalidAction",
              "Cause": "action must be 'comment', 'uncomment', 'set_deploy_paid_false', 'failback', or 'ecs_failback'."
            },

            "PatchTemplate": {
              "Comment": "PATCH STEP 1 — Fetch template, comment/uncomment LoadBalancerStackName in all *ServerStack resources. Returns patched flag + modified template body.",
              "Type": "Task",
              "Resource": "${LambdaFunction.Arn}",
              "Parameters": {
                "app_name.$": "$.app_name",
                "action.$": "$.action"
              },
              "ResultPath": "$.patch_result",
              "Next": "CheckIfPatched",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "PatchFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "CheckIfPatched": {
              "Comment": "If template was unchanged exit gracefully. Otherwise submit the stack update.",
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.patch_result.patched",
                  "BooleanEquals": true,
                  "Next": "ApplyStackUpdate"
                }
              ],
              "Default": "NoChanges"
            },

            "NoChanges": {
              "Comment": "Template already in desired state — stamp reason and exit cleanly.",
              "Type": "Pass",
              "Parameters": {
                "message": "No changes were made. Template already in desired state for the requested action.",
                "app_name.$": "$.app_name",
                "action.$": "$.action"
              },
              "ResultPath": "$.exit_reason",
              "Next": "GracefulExit"
            },

            "ApplyStackUpdate": {
              "Comment": "PATCH STEP 2 — Submit CloudFormation UpdateStack with the patched template via S3 URL. All parameters preserved via UsePreviousValue.",
              "Type": "Task",
              "Resource": "${LambdaFunction.Arn}",
              "Parameters": {
                "action": "update_stack",
                "app_name.$": "$.app_name",
                "template_s3_url.$": "$.patch_result.template_s3_url"
              },
              "ResultPath": "$.update_result",
              "Next": "Complete",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 15,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "UpdateFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "SetDeployPaidFalse": {
              "Comment": "DEPLOY_PAID STEP 1 — Set DeployPaidResources=false. Passes full input to Lambda (preserve_format forwarded).",
              "Type": "Task",
              "Resource": "${LambdaFunction.Arn}",
              "ResultPath": "$.deploy_result",
              "Next": "CheckIfSubmitted",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "DeployPaidFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "CheckIfSubmitted": {
              "Comment": "If DeployPaidResources was already false nothing was submitted — exit gracefully. Otherwise start polling.",
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.deploy_result.submitted",
                  "BooleanEquals": true,
                  "Next": "WaitForDeployPaidUpdate"
                }
              ],
              "Default": "AlreadyFalse"
            },

            "AlreadyFalse": {
              "Comment": "DeployPaidResources already false — stamp reason and exit cleanly.",
              "Type": "Pass",
              "Parameters": {
                "message": "No update submitted. DeployPaidResources is already false.",
                "app_name.$": "$.app_name",
                "action.$": "$.action"
              },
              "ResultPath": "$.exit_reason",
              "Next": "GracefulExit"
            },

            "WaitForDeployPaidUpdate": {
              "Comment": "DEPLOY_PAID STEP 2 — Initial wait before first poll. CloudFormation needs time to start the update.",
              "Type": "Wait",
              "Seconds": 30,
              "Next": "CheckDeployPaidStatus"
            },

            "CheckDeployPaidStatus": {
              "Comment": "DEPLOY_PAID STEP 3 — Poll CloudFormation for terminal state.",
              "Type": "Task",
              "Resource": "${LambdaFunction.Arn}",
              "Parameters": {
                "action": "check_stack_status",
                "app_name.$": "$.app_name"
              },
              "ResultPath": "$.status_result",
              "Next": "DeployPaidUpdateDone",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "DeployPaidFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "DeployPaidUpdateDone": {
              "Comment": "Rollback check first — fail fast. Complete → done. Still in progress → loop.",
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.status_result.rollback_occurred",
                  "BooleanEquals": true,
                  "Next": "DeployPaidRollback"
                },
                {
                  "Variable": "$.status_result.update_complete",
                  "BooleanEquals": true,
                  "Next": "Complete"
                }
              ],
              "Default": "WaitForDeployPaidUpdate"
            },

            "FailbackStep1Comment": {
              "Comment": "FAILOVER STEP 1a — Comment out LoadBalancerStackName in all *ServerStack resources.",
              "Type": "Task",
              "Resource": "${LambdaFunction.Arn}",
              "Parameters": {
                "action": "comment",
                "app_name.$": "$.app_name"
              },
              "ResultPath": "$.fo_s1_patch",
              "Next": "FailbackStep1ApplyUpdate",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "FailbackFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "FailbackStep1ApplyUpdate": {
              "Comment": "FAILOVER STEP 1b — Submit UpdateStack with the commented template via S3 URL (bypasses 51,200-byte TemplateBody limit).",
              "Type": "Task",
              "Resource": "${LambdaFunction.Arn}",
              "Parameters": {
                "action": "update_stack",
                "app_name.$": "$.app_name",
                "template_s3_url.$": "$.fo_s1_patch.template_s3_url"
              },
              "ResultPath": "$.fo_s1_update",
              "Next": "FailbackStep1Wait",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 15,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "FailbackFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "FailbackStep1Wait": {
              "Comment": "FAILOVER STEP 1c — Wait for CFN to begin processing the template update.",
              "Type": "Wait",
              "Seconds": 30,
              "Next": "FailbackStep1Poll"
            },

            "FailbackStep1Poll": {
              "Comment": "FAILOVER STEP 1d — Poll app stack for terminal state.",
              "Type": "Task",
              "Resource": "${LambdaFunction.Arn}",
              "Parameters": {
                "action": "check_stack_status",
                "app_name.$": "$.app_name"
              },
              "ResultPath": "$.fo_s1_status",
              "Next": "FailbackStep1Done",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "FailbackFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "FailbackStep1Done": {
              "Comment": "Fail fast on rollback. Advance to Step 2 when complete. Otherwise loop.",
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.fo_s1_status.rollback_occurred",
                  "BooleanEquals": true,
                  "Next": "FailbackFailed"
                },
                {
                  "Variable": "$.fo_s1_status.update_complete",
                  "BooleanEquals": true,
                  "Next": "FailbackStep2SetDeployPaid"
                }
              ],
              "Default": "FailbackStep1Wait"
            },

            "FailbackStep2SetDeployPaid": {
              "Comment": "FAILOVER STEP 2a — Set DeployPaidResources=false on app stack (paid resources down). preserve_format=false uses UsePreviousTemplate — safe here because Step 1 already wrote the commented YAML to CFN.",
              "Type": "Task",
              "Resource": "${LambdaFunction.Arn}",
              "Parameters": {
                "action": "set_deploy_paid_false",
                "app_name.$": "$.app_name",
                "preserve_format": false
              },
              "ResultPath": "$.fo_s2",
              "Next": "FailbackStep2Wait",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "FailbackFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "FailbackStep2Wait": {
              "Comment": "FAILOVER STEP 2b — Wait for CFN to begin tearing down paid resources.",
              "Type": "Wait",
              "Seconds": 60,
              "Next": "FailbackStep2Poll"
            },

            "FailbackStep2Poll": {
              "Comment": "FAILOVER STEP 2c — Poll app stack for terminal state.",
              "Type": "Task",
              "Resource": "${LambdaFunction.Arn}",
              "Parameters": {
                "action": "check_stack_status",
                "app_name.$": "$.app_name"
              },
              "ResultPath": "$.fo_s2_status",
              "Next": "FailbackStep2Done",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "FailbackFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "FailbackStep2Done": {
              "Comment": "Fail fast on rollback. Advance to Step 3 when complete. Otherwise loop.",
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.fo_s2_status.rollback_occurred",
                  "BooleanEquals": true,
                  "Next": "FailbackFailed"
                },
                {
                  "Variable": "$.fo_s2_status.update_complete",
                  "BooleanEquals": true,
                  "Next": "FailbackStep3Uncomment"
                }
              ],
              "Default": "FailbackStep2Wait"
            },

            "FailbackStep3Uncomment": {
              "Comment": "FAILOVER STEP 3a — Restore LoadBalancerStackName in all *ServerStack resources.",
              "Type": "Task",
              "Resource": "${LambdaFunction.Arn}",
              "Parameters": {
                "action": "uncomment",
                "app_name.$": "$.app_name"
              },
              "ResultPath": "$.fo_s3_patch",
              "Next": "FailbackStep3ApplyUpdate",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "FailbackFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "FailbackStep3ApplyUpdate": {
              "Comment": "FAILOVER STEP 3b — Submit UpdateStack with the uncommented template via S3 URL (bypasses 51,200-byte TemplateBody limit).",
              "Type": "Task",
              "Resource": "${LambdaFunction.Arn}",
              "Parameters": {
                "action": "update_stack",
                "app_name.$": "$.app_name",
                "template_s3_url.$": "$.fo_s3_patch.template_s3_url"
              },
              "ResultPath": "$.fo_s3_update",
              "Next": "FailbackStep3Wait",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 15,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "FailbackFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "FailbackStep3Wait": {
              "Comment": "FAILOVER STEP 3c — Wait for CFN to begin processing the template restore.",
              "Type": "Wait",
              "Seconds": 30,
              "Next": "FailbackStep3Poll"
            },

            "FailbackStep3Poll": {
              "Comment": "FAILOVER STEP 3d — Poll app stack for terminal state.",
              "Type": "Task",
              "Resource": "${LambdaFunction.Arn}",
              "Parameters": {
                "action": "check_stack_status",
                "app_name.$": "$.app_name"
              },
              "ResultPath": "$.fo_s3_status",
              "Next": "FailbackStep3Done",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "FailbackFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "FailbackStep3Done": {
              "Comment": "Fail fast on rollback. Advance to Step 4 when complete. Otherwise loop.",
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.fo_s3_status.rollback_occurred",
                  "BooleanEquals": true,
                  "Next": "FailbackFailed"
                },
                {
                  "Variable": "$.fo_s3_status.update_complete",
                  "BooleanEquals": true,
                  "Next": "FailbackStep4SetDeployPaidNetwork"
                }
              ],
              "Default": "FailbackStep3Wait"
            },

            "FailbackStep4SetDeployPaidNetwork": {
              "Comment": "FAILBACK STEP 4a — Set DeployPaidResources=false on the network stack (NAT GWs, Jump Host, VPC Endpoints down). Uses TemplateURL from S3 to bypass the 51,200-byte TemplateBody limit.",
              "Type": "Task",
              "Resource": "${LambdaFunction.Arn}",
              "Parameters": {
                "action": "set_deploy_paid_false",
                "app_name.$": "$.network_stack_name",
                "template_url": "${NetworkTemplateUrl}"
              },
              "ResultPath": "$.fo_s4",
              "Next": "FailbackStep4Wait",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "FailbackFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "FailbackStep4Wait": {
              "Comment": "FAILBACK STEP 4b — Wait for CFN to begin tearing down network paid resources.",
              "Type": "Wait",
              "Seconds": 60,
              "Next": "FailbackStep4Poll"
            },

            "FailbackStep4Poll": {
              "Comment": "FAILBACK STEP 4c — Poll network stack for terminal state.",
              "Type": "Task",
              "Resource": "${LambdaFunction.Arn}",
              "Parameters": {
                "action": "check_stack_status",
                "app_name.$": "$.network_stack_name"
              },
              "ResultPath": "$.fo_s4_status",
              "Next": "FailbackStep4Done",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "FailbackFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "FailbackStep4Done": {
              "Comment": "Fail fast on rollback. Network stack complete → success. Otherwise loop.",
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.fo_s4_status.rollback_occurred",
                  "BooleanEquals": true,
                  "Next": "FailbackFailed"
                },
                {
                  "Variable": "$.fo_s4_status.update_complete",
                  "BooleanEquals": true,
                  "Next": "Complete"
                }
              ],
              "Default": "FailbackStep4Wait"
            },

            "ECSFailbackParallelAppStacks": {
              "Comment": "ECS FAILBACK STEP 1 — Set DeployPaidResources=false on app stacks concurrently (ALB, DNS, ECS tasks down). Must complete before prereq to avoid dangling ImportValue consumers.",
              "Type": "Map",
              "ItemsPath": "$.parallel_stacks",
              "MaxConcurrency": 0,
              "Iterator": {
                "StartAt": "SetDeployPaidFalseOne",
                "States": {
                  "SetDeployPaidFalseOne": {
                    "Type": "Task",
                    "Resource": "${LambdaFunction.Arn}",
                    "Parameters": {
                      "action":       "set_deploy_paid_false",
                      "stack_name.$": "$.stack_name"
                    },
                    "ResultPath": "$.set_result",
                    "Next": "CheckIfOneSubmitted",
                    "Retry": [{"ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 10, "MaxAttempts": 3, "BackoffRate": 2}],
                    "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "OneFalseFailed", "ResultPath": "$.error"}]
                  },
                  "CheckIfOneSubmitted": {
                    "Type": "Choice",
                    "Choices": [
                      {"Variable": "$.set_result.submitted", "BooleanEquals": true, "Next": "WaitOneFalse"}
                    ],
                    "Default": "OneFalseComplete"
                  },
                  "WaitOneFalse": {
                    "Type": "Wait",
                    "Seconds": 30,
                    "Next": "PollOneFalse"
                  },
                  "PollOneFalse": {
                    "Type": "Task",
                    "Resource": "${LambdaFunction.Arn}",
                    "Parameters": {
                      "action":       "check_stack_status",
                      "stack_name.$": "$.stack_name"
                    },
                    "ResultPath": "$.poll_result",
                    "Next": "OneFalseDone",
                    "Retry": [{"ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 10, "MaxAttempts": 3, "BackoffRate": 2}],
                    "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "OneFalseFailed", "ResultPath": "$.error"}]
                  },
                  "OneFalseDone": {
                    "Type": "Choice",
                    "Choices": [
                      {"Variable": "$.poll_result.rollback_occurred", "BooleanEquals": true, "Next": "OneFalseFailed"},
                      {"Variable": "$.poll_result.update_complete",   "BooleanEquals": true, "Next": "OneFalseComplete"}
                    ],
                    "Default": "WaitOneFalse"
                  },
                  "OneFalseComplete": {
                    "Type": "Succeed"
                  },
                  "OneFalseFailed": {
                    "Type": "Fail",
                    "Error": "StackTeardownFailed",
                    "Cause": "App stack DeployPaidResources=false update failed — check CloudFormation events."
                  }
                }
              },
              "ResultPath": "$.ecs_parallel_result",
              "Next": "ECSFailbackPrereq",
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "FailbackFailed", "ResultPath": "$.error"}]
            },

            "ECSFailbackPrereq": {
              "Comment": "ECS FAILBACK STEP 2 — Set DeployPaidResources=false on prereq stack (DocumentDB torn down). Safe now that app stacks no longer import DocuDBElasticSecurityGroup.",
              "Type": "Task",
              "Resource": "${LambdaFunction.Arn}",
              "Parameters": {
                "action":       "set_deploy_paid_false",
                "stack_name.$": "$.prereq_stack_name"
              },
              "ResultPath": "$.ecs_prereq_result",
              "Next": "ECSFailbackPrereqWait",
              "Retry": [{"ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 10, "MaxAttempts": 3, "BackoffRate": 2}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "FailbackFailed", "ResultPath": "$.error"}]
            },

            "ECSFailbackPrereqWait": {
              "Type": "Wait",
              "Seconds": 60,
              "Next": "ECSFailbackPrereqPoll"
            },

            "ECSFailbackPrereqPoll": {
              "Type": "Task",
              "Resource": "${LambdaFunction.Arn}",
              "Parameters": {
                "action":       "check_stack_status",
                "stack_name.$": "$.prereq_stack_name"
              },
              "ResultPath": "$.ecs_prereq_status",
              "Next": "ECSFailbackPrereqDone",
              "Retry": [{"ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 10, "MaxAttempts": 3, "BackoffRate": 2}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "FailbackFailed", "ResultPath": "$.error"}]
            },

            "ECSFailbackPrereqDone": {
              "Type": "Choice",
              "Choices": [
                {"Variable": "$.ecs_prereq_status.rollback_occurred", "BooleanEquals": true, "Next": "FailbackFailed"},
                {"Variable": "$.ecs_prereq_status.update_complete",   "BooleanEquals": true, "Next": "ECSFailbackNetwork"}
              ],
              "Default": "ECSFailbackPrereqWait"
            },

            "ECSFailbackNetwork": {
              "Comment": "ECS FAILBACK STEP 3 — Set DeployPaidResources=false on network stack (NAT GW, Jump Host down).",
              "Type": "Task",
              "Resource": "${LambdaFunction.Arn}",
              "Parameters": {
                "action":       "set_deploy_paid_false",
                "stack_name.$": "$.network_stack_name",
                "template_url": "${NetworkTemplateUrl}"
              },
              "ResultPath": "$.ecs_network_result",
              "Next": "ECSFailbackNetworkWait",
              "Retry": [{"ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 10, "MaxAttempts": 3, "BackoffRate": 2}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "FailbackFailed", "ResultPath": "$.error"}]
            },

            "ECSFailbackNetworkWait": {
              "Type": "Wait",
              "Seconds": 60,
              "Next": "ECSFailbackNetworkPoll"
            },

            "ECSFailbackNetworkPoll": {
              "Type": "Task",
              "Resource": "${LambdaFunction.Arn}",
              "Parameters": {
                "action":       "check_stack_status",
                "stack_name.$": "$.network_stack_name"
              },
              "ResultPath": "$.ecs_network_status",
              "Next": "ECSFailbackNetworkDone",
              "Retry": [{"ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 10, "MaxAttempts": 3, "BackoffRate": 2}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "FailbackFailed", "ResultPath": "$.error"}]
            },

            "ECSFailbackNetworkDone": {
              "Type": "Choice",
              "Choices": [
                {"Variable": "$.ecs_network_status.rollback_occurred", "BooleanEquals": true, "Next": "FailbackFailed"},
                {"Variable": "$.ecs_network_status.update_complete",   "BooleanEquals": true, "Next": "Complete"}
              ],
              "Default": "ECSFailbackNetworkWait"
            },

            "FailbackFailed": {
              "Type": "Fail",
              "Error": "FailbackFailed",
              "Cause": "Failover workflow aborted — a CloudFormation stack entered a rollback or failure state. Check the CF console and CloudWatch Logs."
            },

            "GracefulExit": {
              "Type": "Succeed"
            },

            "Complete": {
              "Type": "Succeed"
            },

            "PatchFailed": {
              "Type": "Fail",
              "Error": "PatchFailed",
              "Cause": "Lambda failed to fetch or patch the CFN template. Check CloudWatch Logs."
            },

            "UpdateFailed": {
              "Type": "Fail",
              "Error": "UpdateFailed",
              "Cause": "CloudFormation UpdateStack submission failed. Check CloudWatch Logs and the CF console."
            },

            "DeployPaidFailed": {
              "Type": "Fail",
              "Error": "DeployPaidFailed",
              "Cause": "set_deploy_paid_false Lambda failed after retries. Check CloudWatch Logs."
            },

            "DeployPaidRollback": {
              "Type": "Fail",
              "Error": "DeployPaidRollback",
              "Cause": "CloudFormation entered a rollback or failure state during DeployPaidResources update. Check the CF console."
            }

          }
        }

####
# Outputs
####

Outputs:

  LambdaArn:
    Description: ARN of the DR Failback Lambda
    Value: !GetAtt LambdaFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaArn'

  LambdaName:
    Description: Name of the DR Failback Lambda
    Value: !Ref LambdaFunction
    Export:
      Name: !Sub '${AWS::StackName}-LambdaName'

  LambdaLogGroupName:
    Description: CloudWatch Log Group for the DR Failback Lambda
    Value: !Ref LambdaLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-LambdaLogGroup'

  StateMachineArn:
    Description: ARN of the DR Failback State Machine
    Value: !Ref StateMachine
    Export:
      Name: !Sub '${AWS::StackName}-StateMachineArn'

  StateMachineName:
    Description: Name of the DR Failback State Machine
    Value: !GetAtt StateMachine.Name
    Export:
      Name: !Sub '${AWS::StackName}-StateMachineName'

  StateMachineLogGroupName:
    Description: CloudWatch Log Group for DR Failback State Machine execution history
    Value: !Ref StateMachineLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-StateMachineLogGroup'
