AWSTemplateFormatVersion: 2010-09-09
Description: Monitoring stack — EC2, RDS, and ALB alarms with composite alarms for all 10 PCHC apps

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - SNSStackName
      - Label:
          default: PESONET Configuration
        Parameters:
          - PesonetAutoScalingGroupName
          - PesonetDBInstanceIdentifier
          - PesonetLoadBalancerFullName
          - PesonetRDSConnectionThreshold
      - Label:
          default: PDDTS Configuration
        Parameters:
          - PddtsAutoScalingGroupName
          - PddtsDBInstanceIdentifier
          - PddtsLoadBalancerFullName
          - PddtsRDSConnectionThreshold
      - Label:
          default: PDDTS-EOD Configuration
        Parameters:
          - PddtsEodAutoScalingGroupName
          - PddtsEodDBInstanceIdentifier
          - PddtsEodLoadBalancerFullName
          - PddtsEodRDSConnectionThreshold
      - Label:
          default: MIS Configuration
        Parameters:
          - MisAutoScalingGroupName
          - MisDBInstanceIdentifier
          - MisLoadBalancerFullName
          - MisRDSConnectionThreshold
      - Label:
          default: CICS Configuration
        Parameters:
          - CicsAutoScalingGroupName
          - CicsDBInstanceIdentifier
          - CicsLoadBalancerFullName
          - CicsRDSConnectionThreshold
      - Label:
          default: DirectDebit Configuration
        Parameters:
          - DirectDebitAutoScalingGroupName
          - DirectDebitDBInstanceIdentifier
          - DirectDebitLoadBalancerFullName
          - DirectDebitRDSConnectionThreshold
      - Label:
          default: PAS6 Configuration
        Parameters:
          - Pas6AutoScalingGroupName
          - Pas6DBInstanceIdentifier
          - Pas6LoadBalancerFullName
          - Pas6RDSConnectionThreshold
      - Label:
          default: DSAPP Configuration
        Parameters:
          - DsappAutoScalingGroupName
          - DsappDBInstanceIdentifier
          - DsappLoadBalancerFullName
          - DsappRDSConnectionThreshold
      - Label:
          default: PayGate Configuration
        Parameters:
          - PaygateAutoScalingGroupName
          - PaygateDBInstanceIdentifier
          - PaygateLoadBalancerFullName
          - PaygateRDSConnectionThreshold
      - Label:
          default: PhilPass Configuration
        Parameters:
          - PhilpassAutoScalingGroupName
          - PhilpassDBInstanceIdentifier
          - PhilpassLoadBalancerFullName
          - PhilpassRDSConnectionThreshold

    ParameterLabels:
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      SNSStackName:
        default: SNS Topic Stack Name
      PesonetAutoScalingGroupName:
        default: PESONET Auto Scaling Group Name
      PesonetDBInstanceIdentifier:
        default: PESONET RDS Instance Identifier
      PesonetLoadBalancerFullName:
        default: PESONET ALB Full Name
      PesonetRDSConnectionThreshold:
        default: PESONET RDS Connection Threshold
      PddtsAutoScalingGroupName:
        default: PDDTS Auto Scaling Group Name
      PddtsDBInstanceIdentifier:
        default: PDDTS RDS Instance Identifier
      PddtsLoadBalancerFullName:
        default: PDDTS ALB Full Name
      PddtsRDSConnectionThreshold:
        default: PDDTS RDS Connection Threshold
      PddtsEodAutoScalingGroupName:
        default: PDDTS-EOD Auto Scaling Group Name
      PddtsEodDBInstanceIdentifier:
        default: PDDTS-EOD RDS Instance Identifier
      PddtsEodLoadBalancerFullName:
        default: PDDTS-EOD ALB Full Name
      PddtsEodRDSConnectionThreshold:
        default: PDDTS-EOD RDS Connection Threshold
      MisAutoScalingGroupName:
        default: MIS Auto Scaling Group Name
      MisDBInstanceIdentifier:
        default: MIS RDS Instance Identifier
      MisLoadBalancerFullName:
        default: MIS ALB Full Name
      MisRDSConnectionThreshold:
        default: MIS RDS Connection Threshold
      CicsAutoScalingGroupName:
        default: CICS Auto Scaling Group Name
      CicsDBInstanceIdentifier:
        default: CICS RDS Instance Identifier
      CicsLoadBalancerFullName:
        default: CICS ALB Full Name
      CicsRDSConnectionThreshold:
        default: CICS RDS Connection Threshold
      DirectDebitAutoScalingGroupName:
        default: DirectDebit Auto Scaling Group Name
      DirectDebitDBInstanceIdentifier:
        default: DirectDebit RDS Instance Identifier
      DirectDebitLoadBalancerFullName:
        default: DirectDebit ALB Full Name
      DirectDebitRDSConnectionThreshold:
        default: DirectDebit RDS Connection Threshold
      Pas6AutoScalingGroupName:
        default: PAS6 Auto Scaling Group Name
      Pas6DBInstanceIdentifier:
        default: PAS6 RDS Instance Identifier
      Pas6LoadBalancerFullName:
        default: PAS6 ALB Full Name
      Pas6RDSConnectionThreshold:
        default: PAS6 RDS Connection Threshold
      DsappAutoScalingGroupName:
        default: DSAPP Auto Scaling Group Name
      DsappDBInstanceIdentifier:
        default: DSAPP RDS Instance Identifier
      DsappLoadBalancerFullName:
        default: DSAPP ALB Full Name
      DsappRDSConnectionThreshold:
        default: DSAPP RDS Connection Threshold
