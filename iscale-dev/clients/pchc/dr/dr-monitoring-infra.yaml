AWSTemplateFormatVersion: 2010-09-09
Description: Monitoring stack — EC2, RDS, and ALB alarms with composite alarms for all 10 PCHC apps

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - SNSStackName
      - Label:
          default: PESONET Configuration
        Parameters:
          - PesonetAutoScalingGroupName
          - PesonetDBInstanceIdentifier
          - PesonetLoadBalancerFullName
          - PesonetRDSCPUThreshold
      - Label:
          default: PDDTS Configuration
        Parameters:
          - PddtsAutoScalingGroupName
          - PddtsDBInstanceIdentifier
          - PddtsLoadBalancerFullName
          - PddtsRDSCPUThreshold
      - Label:
          default: PDDTS-EOD Configuration
        Parameters:
          - PddtsEodAutoScalingGroupName
          - PddtsEodDBInstanceIdentifier
          - PddtsEodLoadBalancerFullName
          - PddtsEodRDSCPUThreshold
      - Label:
          default: MIS Configuration
        Parameters:
          - MisAutoScalingGroupName
          - MisDBInstanceIdentifier
          - MisLoadBalancerFullName
          - MisRDSCPUThreshold
      - Label:
          default: CICS Configuration
        Parameters:
          - CicsTargetGroupFullName
          - CicsDBInstanceIdentifier
          - CicsLoadBalancerFullName
          - CicsRDSCPUThreshold
      - Label:
          default: DirectDebit Configuration
        Parameters:
          - DirectDebitAutoScalingGroupName
          - DirectDebitDBInstanceIdentifier
          - DirectDebitLoadBalancerFullName
          - DirectDebitRDSCPUThreshold
      - Label:
          default: PAS6 Configuration
        Parameters:
          - Pas6AutoScalingGroupName
          - Pas6DBInstanceIdentifier
          - Pas6LoadBalancerFullName
          - Pas6RDSCPUThreshold
      - Label:
          default: DSAPP Configuration
        Parameters:
          - DsappAutoScalingGroupName
          - DsappDBInstanceIdentifier
          - DsappLoadBalancerFullName
          - DsappRDSCPUThreshold
      - Label:
          default: PayGate Configuration
        Parameters:
          - PaygateAutoScalingGroupName
          - PaygateDBInstanceIdentifier
          - PaygateLoadBalancerFullName
          - PaygateRDSCPUThreshold
      - Label:
          default: PhilPass Configuration
        Parameters:
          - PhilpassAutoScalingGroupName
          - PhilpassDBInstanceIdentifier
          - PhilpassLoadBalancerFullName
          - PhilpassRDSCPUThreshold

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      SNSStackName:
        default: SNS Topic Stack Name
      PesonetAutoScalingGroupName:
        default: PESONET Auto Scaling Group Name (leave empty to skip — app not monitored or not in this region)
      PesonetDBInstanceIdentifier:
        default: PESONET RDS Instance Identifier
      PesonetLoadBalancerFullName:
        default: PESONET ALB Full Name
      PesonetRDSCPUThreshold:
        default: PESONET RDS CPU Threshold (%)
      PddtsAutoScalingGroupName:
        default: PDDTS Auto Scaling Group Name (leave empty to skip — app not monitored or not in this region)
      PddtsDBInstanceIdentifier:
        default: PDDTS RDS Instance Identifier
      PddtsLoadBalancerFullName:
        default: PDDTS ALB Full Name
      PddtsRDSCPUThreshold:
        default: PDDTS RDS CPU Threshold (%)
      PddtsEodAutoScalingGroupName:
        default: PDDTS-EOD Auto Scaling Group Name (leave empty to skip — app not monitored or not in this region)
      PddtsEodDBInstanceIdentifier:
        default: PDDTS-EOD RDS Instance Identifier
      PddtsEodLoadBalancerFullName:
        default: PDDTS-EOD ALB Full Name
      PddtsEodRDSCPUThreshold:
        default: PDDTS-EOD RDS CPU Threshold (%)
      MisAutoScalingGroupName:
        default: MIS Auto Scaling Group Name (leave empty to skip — app not monitored or not in this region)
      MisDBInstanceIdentifier:
        default: MIS RDS Instance Identifier
      MisLoadBalancerFullName:
        default: MIS ALB Full Name
      MisRDSCPUThreshold:
        default: MIS RDS CPU Threshold (%)
      CicsTargetGroupFullName:
        default: CICS ALB Target Group Full Name (leave empty to skip — app not monitored or not in this region)
      CicsDBInstanceIdentifier:
        default: CICS RDS Instance Identifier (primary DBStack — not the FE database)
      CicsLoadBalancerFullName:
        default: CICS ALB Full Name
      CicsRDSCPUThreshold:
        default: CICS RDS CPU Threshold (%)
      DirectDebitAutoScalingGroupName:
        default: DirectDebit Auto Scaling Group Name (leave empty to skip — app not monitored or not in this region)
      DirectDebitDBInstanceIdentifier:
        default: DirectDebit RDS Instance Identifier
      DirectDebitLoadBalancerFullName:
        default: DirectDebit ALB Full Name
      DirectDebitRDSCPUThreshold:
        default: DirectDebit RDS CPU Threshold (%)
      Pas6AutoScalingGroupName:
        default: PAS6 Auto Scaling Group Name (leave empty to skip — app not monitored or not in this region)
      Pas6DBInstanceIdentifier:
        default: PAS6 RDS Instance Identifier
      Pas6LoadBalancerFullName:
        default: PAS6 ALB Full Name
      Pas6RDSCPUThreshold:
        default: PAS6 RDS CPU Threshold (%)
      DsappAutoScalingGroupName:
        default: DSAPP Auto Scaling Group Name (leave empty to skip — app not monitored or not in this region)
      DsappDBInstanceIdentifier:
        default: DSAPP RDS Instance Identifier
      DsappLoadBalancerFullName:
        default: DSAPP ALB Full Name
      DsappRDSCPUThreshold:
        default: DSAPP RDS CPU Threshold (%)
      PaygateAutoScalingGroupName:
        default: PayGate Auto Scaling Group Name (leave empty to skip — app not monitored or not in this region)
      PaygateDBInstanceIdentifier:
        default: PayGate RDS Instance Identifier
      PaygateLoadBalancerFullName:
        default: PayGate ALB Full Name
      PaygateRDSCPUThreshold:
        default: PayGate RDS CPU Threshold (%)
      PhilpassAutoScalingGroupName:
        default: PhilPass Auto Scaling Group Name (leave empty to skip — app not monitored or not in this region)
      PhilpassDBInstanceIdentifier:
        default: PhilPass RDS Instance Identifier
      PhilpassLoadBalancerFullName:
        default: PhilPass ALB Full Name
      PhilpassRDSCPUThreshold:
        default: PhilPass RDS CPU Threshold (%)

Parameters:

  # Resource Configuration
  Name:
    Description: Unique name/identifier for this stack's resources
    Type: String
    Default: dr-monitoring
    MinLength: 3
    MaxLength: 20
  OrgName:
    Description: The name of the organization
    Type: String
    Default: pchc
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Must only contain lowercase letters and hyphens
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
      - ProductionDR
      - StagingDR
      - DevelopmentDR
      - TestDR

  # Stack Configuration
  SNSStackName:
    Description: The name of the SNS stack
    Type: String
    Default: pchc-prd-ase1-snstopic
    MinLength: 1

  # PESONET
  PesonetAutoScalingGroupName:
    Description: PESONET Auto Scaling Group name (used for EC2 StatusCheckFailed alarm)
    Type: String
    Default: ''
  PesonetDBInstanceIdentifier:
    Description: PESONET RDS instance identifier
    Type: String
    Default: ''
  PesonetLoadBalancerFullName:
    Description: PESONET ALB full name (e.g. app/pchc-prd-ase1-pesonet/abc123)
    Type: String
    Default: ''
  PesonetRDSCPUThreshold:
    Description: PESONET RDS CPUUtilization alarm threshold (%) — sustained high CPU may indicate infra degradation
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 100

  # PDDTS
  PddtsAutoScalingGroupName:
    Description: PDDTS Auto Scaling Group name (used for EC2 StatusCheckFailed alarm)
    Type: String
    Default: ''
  PddtsDBInstanceIdentifier:
    Description: PDDTS RDS instance identifier
    Type: String
    Default: ''
  PddtsLoadBalancerFullName:
    Description: PDDTS ALB full name (e.g. app/pchc-prd-ase1-pddts/abc123)
    Type: String
    Default: ''
  PddtsRDSCPUThreshold:
    Description: PDDTS RDS CPUUtilization alarm threshold (%) — sustained high CPU may indicate infra degradation
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 100

  # PDDTS-EOD
  PddtsEodAutoScalingGroupName:
    Description: PDDTS-EOD Auto Scaling Group name (used for EC2 StatusCheckFailed alarm)
    Type: String
    Default: ''
  PddtsEodDBInstanceIdentifier:
    Description: PDDTS-EOD RDS instance identifier
    Type: String
    Default: ''
  PddtsEodLoadBalancerFullName:
    Description: PDDTS-EOD ALB full name (e.g. app/pchc-prd-ase1-pddts-eod/abc123)
    Type: String
    Default: ''
  PddtsEodRDSCPUThreshold:
    Description: PDDTS-EOD RDS CPUUtilization alarm threshold (%) — sustained high CPU may indicate infra degradation
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 100

  # MIS
  MisAutoScalingGroupName:
    Description: MIS Auto Scaling Group name (used for EC2 StatusCheckFailed alarm)
    Type: String
    Default: ''
  MisDBInstanceIdentifier:
    Description: MIS RDS instance identifier
    Type: String
    Default: ''
  MisLoadBalancerFullName:
    Description: MIS ALB full name (e.g. app/pchc-prd-ase1-mis/abc123)
    Type: String
    Default: ''
  MisRDSCPUThreshold:
    Description: MIS RDS CPUUtilization alarm threshold (%) — sustained high CPU may indicate infra degradation
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 100

  # CICS (Windows EC2 — standalone instances, no ASG; monitored via ALB Target Group health)
  CicsTargetGroupFullName:
    Description: CICS ALB target group full name (e.g. targetgroup/pchc-prd-ase1-cics/abc123), used for HealthyHostCount alarm in place of an EC2 ASG status check
    Type: String
    Default: ''
  CicsDBInstanceIdentifier:
    Description: CICS RDS instance identifier (primary DBStack)
    Type: String
    Default: ''
  CicsLoadBalancerFullName:
    Description: CICS ALB full name (e.g. app/pchc-prd-ase1-cics/abc123)
    Type: String
    Default: ''
  CicsRDSCPUThreshold:
    Description: CICS RDS CPUUtilization alarm threshold (%) — sustained high CPU may indicate infra degradation
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 100

  # DirectDebit
  DirectDebitAutoScalingGroupName:
    Description: DirectDebit Auto Scaling Group name (used for EC2 StatusCheckFailed alarm)
    Type: String
    Default: ''
  DirectDebitDBInstanceIdentifier:
    Description: DirectDebit RDS instance identifier
    Type: String
    Default: ''
  DirectDebitLoadBalancerFullName:
    Description: DirectDebit ALB full name (e.g. app/pchc-prd-ase1-directdebit/abc123)
    Type: String
    Default: ''
  DirectDebitRDSCPUThreshold:
    Description: DirectDebit RDS CPUUtilization alarm threshold (%) — sustained high CPU may indicate infra degradation
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 100

  # PAS6
  Pas6AutoScalingGroupName:
    Description: PAS6 Auto Scaling Group name (used for EC2 StatusCheckFailed alarm)
    Type: String
    Default: ''
  Pas6DBInstanceIdentifier:
    Description: PAS6 RDS instance identifier
    Type: String
    Default: ''
  Pas6LoadBalancerFullName:
    Description: PAS6 ALB full name (e.g. app/pchc-prd-ase1-pas6/abc123)
    Type: String
    Default: ''
  Pas6RDSCPUThreshold:
    Description: PAS6 RDS CPUUtilization alarm threshold (%) — sustained high CPU may indicate infra degradation
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 100

  # DSAPP
  DsappAutoScalingGroupName:
    Description: DSAPP Auto Scaling Group name (used for EC2 StatusCheckFailed alarm)
    Type: String
    Default: ''
  DsappDBInstanceIdentifier:
    Description: DSAPP RDS instance identifier
    Type: String
    Default: ''
  DsappLoadBalancerFullName:
    Description: DSAPP ALB full name (e.g. app/pchc-prd-ase1-dsapp/abc123)
    Type: String
    Default: ''
  DsappRDSCPUThreshold:
    Description: DSAPP RDS CPUUtilization alarm threshold (%) — sustained high CPU may indicate infra degradation
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 100

  # PayGate
  PaygateAutoScalingGroupName:
    Description: PayGate Auto Scaling Group name (used for EC2 StatusCheckFailed alarm)
    Type: String
    Default: ''
  PaygateDBInstanceIdentifier:
    Description: PayGate RDS instance identifier
    Type: String
    Default: ''
  PaygateLoadBalancerFullName:
    Description: PayGate ALB full name (e.g. app/pchc-prd-ase1-paygate/abc123)
    Type: String
    Default: ''
  PaygateRDSCPUThreshold:
    Description: PayGate RDS CPUUtilization alarm threshold (%) — sustained high CPU may indicate infra degradation
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 100

  # PhilPass
  PhilpassAutoScalingGroupName:
    Description: PhilPass Auto Scaling Group name (used for EC2 StatusCheckFailed alarm)
    Type: String
    Default: ''
  PhilpassDBInstanceIdentifier:
    Description: PhilPass RDS instance identifier
    Type: String
    Default: ''
  PhilpassLoadBalancerFullName:
    Description: PhilPass ALB full name (e.g. app/pchc-prd-ase1-philpass/abc123)
    Type: String
    Default: ''
  PhilpassRDSCPUThreshold:
    Description: PhilPass RDS CPUUtilization alarm threshold (%) — sustained high CPU may indicate infra degradation
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 100

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:

  IsPesonetEnabled: !Not [!Equals [!Ref PesonetAutoScalingGroupName, '']]
  IsPddtsEnabled: !Not [!Equals [!Ref PddtsAutoScalingGroupName, '']]
  IsPddtsEodEnabled: !Not [!Equals [!Ref PddtsEodAutoScalingGroupName, '']]
  IsMisEnabled: !Not [!Equals [!Ref MisAutoScalingGroupName, '']]
  IsCicsEnabled: !Not [!Equals [!Ref CicsTargetGroupFullName, '']]
  IsDirectDebitEnabled: !Not [!Equals [!Ref DirectDebitAutoScalingGroupName, '']]
  IsPas6Enabled: !Not [!Equals [!Ref Pas6AutoScalingGroupName, '']]
  IsDsappEnabled: !Not [!Equals [!Ref DsappAutoScalingGroupName, '']]
  IsPaygateEnabled: !Not [!Equals [!Ref PaygateAutoScalingGroupName, '']]
  IsPhilpassEnabled: !Not [!Equals [!Ref PhilpassAutoScalingGroupName, '']]

Resources:

##
# PESONET
##

  PesonetEC2Alarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsPesonetEnabled
    Properties:
      AlarmName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !Ref Name, 'pesonet-ec2-alarm']]
      AlarmDescription: PESONET EC2 status check failed
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref PesonetAutoScalingGroupName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'

  PesonetRDSAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsPesonetEnabled
    Properties:
      AlarmName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !Ref Name, 'pesonet-rds-alarm']]
      AlarmDescription: PESONET RDS CPU utilization sustained high (possible infra degradation; missing data also treated as breaching since a live instance always reports this metric)
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref PesonetDBInstanceIdentifier
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: !Ref PesonetRDSCPUThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching

  PesonetALBAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsPesonetEnabled
    Properties:
      AlarmName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !Ref Name, 'pesonet-alb-alarm']]
      AlarmDescription: PESONET ALB 5xx error rate above 5%
      Metrics:
        - Id: m1
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_Target_5XX_Count
              Dimensions:
                - Name: LoadBalancer
                  Value: !Ref PesonetLoadBalancerFullName
            Period: 300
            Stat: Sum
        - Id: m2
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: RequestCount
              Dimensions:
                - Name: LoadBalancer
                  Value: !Ref PesonetLoadBalancerFullName
            Period: 300
            Stat: Sum
        - Id: e1
          Expression: 'IF(m2 > 0, m1/m2*100, 0)'
          Label: 5xx Rate (%)
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'

  PesonetCompositeAlarm:
    Type: AWS::CloudWatch::CompositeAlarm
    Condition: IsPesonetEnabled
    Properties:
      AlarmName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !Ref Name, 'pesonet-infra-composite-alarm']]
      AlarmDescription: PESONET infrastructure degraded — EC2, RDS, and ALB all alarming simultaneously
      AlarmRule: !Sub 'ALARM(${PesonetEC2Alarm}) AND ALARM(${PesonetRDSAlarm}) AND ALARM(${PesonetALBAlarm})'
      AlarmActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'

