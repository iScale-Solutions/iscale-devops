Parameters:

  # Resource Configuration
  OrgName:
    Description: The name of the organization
    Type: String
    Default: pchc
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Must only contain lowercase letters and hyphens
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test

  # Stack Configuration
  SNSStackName:
    Description: The name of the SNS stack
    Type: String
    Default: pchc-prd-ase1-snstopic
    MinLength: 1

  # PESONET
  PesonetAutoScalingGroupName:
    Description: PESONET Auto Scaling Group name (used for EC2 StatusCheckFailed alarm)
    Type: String
    Default: ''
  PesonetDBInstanceIdentifier:
    Description: PESONET RDS instance identifier
    Type: String
    Default: ''
  PesonetLoadBalancerFullName:
    Description: PESONET ALB full name (e.g. app/pchc-prd-ase1-pesonet/abc123)
    Type: String
    Default: ''
  PesonetRDSConnectionThreshold:
    Description: PESONET RDS DatabaseConnections alarm threshold
    Type: Number
    Default: 100
    MinValue: 1

  # PDDTS
  PddtsAutoScalingGroupName:
    Description: PDDTS Auto Scaling Group name (used for EC2 StatusCheckFailed alarm)
    Type: String
    Default: ''
  PddtsDBInstanceIdentifier:
    Description: PDDTS RDS instance identifier
    Type: String
    Default: ''
  PddtsLoadBalancerFullName:
    Description: PDDTS ALB full name (e.g. app/pchc-prd-ase1-pddts/abc123)
    Type: String
    Default: ''
  PddtsRDSConnectionThreshold:
    Description: PDDTS RDS DatabaseConnections alarm threshold
    Type: Number
    Default: 100
    MinValue: 1

  # PDDTS-EOD
  PddtsEodAutoScalingGroupName:
    Description: PDDTS-EOD Auto Scaling Group name (used for EC2 StatusCheckFailed alarm)
    Type: String
    Default: ''
  PddtsEodDBInstanceIdentifier:
    Description: PDDTS-EOD RDS instance identifier
    Type: String
    Default: ''
  PddtsEodLoadBalancerFullName:
    Description: PDDTS-EOD ALB full name (e.g. app/pchc-prd-ase1-pddts-eod/abc123)
    Type: String
    Default: ''
  PddtsEodRDSConnectionThreshold:
    Description: PDDTS-EOD RDS DatabaseConnections alarm threshold
    Type: Number
    Default: 100
    MinValue: 1

  # MIS
  MisAutoScalingGroupName:
    Description: MIS Auto Scaling Group name (used for EC2 StatusCheckFailed alarm)
    Type: String
    Default: ''
  MisDBInstanceIdentifier:
    Description: MIS RDS instance identifier
    Type: String
    Default: ''
  MisLoadBalancerFullName:
    Description: MIS ALB full name (e.g. app/pchc-prd-ase1-mis/abc123)
    Type: String
    Default: ''
  MisRDSConnectionThreshold:
    Description: MIS RDS DatabaseConnections alarm threshold
    Type: Number
    Default: 100
    MinValue: 1

  # CICS
  CicsAutoScalingGroupName:
    Description: CICS Auto Scaling Group name (used for EC2 StatusCheckFailed alarm)
    Type: String
    Default: ''
  CicsDBInstanceIdentifier:
    Description: CICS RDS instance identifier
    Type: String
    Default: ''
  CicsLoadBalancerFullName:
    Description: CICS ALB full name (e.g. app/pchc-prd-ase1-cics/abc123)
    Type: String
    Default: ''
  CicsRDSConnectionThreshold:
    Description: CICS RDS DatabaseConnections alarm threshold
    Type: Number
    Default: 100
    MinValue: 1

  # DirectDebit
  DirectDebitAutoScalingGroupName:
    Description: DirectDebit Auto Scaling Group name (used for EC2 StatusCheckFailed alarm)
    Type: String
    Default: ''
  DirectDebitDBInstanceIdentifier:
    Description: DirectDebit RDS instance identifier
    Type: String
    Default: ''
  DirectDebitLoadBalancerFullName:
    Description: DirectDebit ALB full name (e.g. app/pchc-prd-ase1-directdebit/abc123)
    Type: String
    Default: ''
  DirectDebitRDSConnectionThreshold:
    Description: DirectDebit RDS DatabaseConnections alarm threshold
    Type: Number
    Default: 100
    MinValue: 1

  # PAS6
  Pas6AutoScalingGroupName:
    Description: PAS6 Auto Scaling Group name (used for EC2 StatusCheckFailed alarm)
    Type: String
    Default: ''
  Pas6DBInstanceIdentifier:
    Description: PAS6 RDS instance identifier
    Type: String
    Default: ''
  Pas6LoadBalancerFullName:
    Description: PAS6 ALB full name (e.g. app/pchc-prd-ase1-pas6/abc123)
    Type: String
    Default: ''
  Pas6RDSConnectionThreshold:
    Description: PAS6 RDS DatabaseConnections alarm threshold
    Type: Number
    Default: 100
    MinValue: 1

  # DSAPP
  DsappAutoScalingGroupName:
    Description: DSAPP Auto Scaling Group name (used for EC2 StatusCheckFailed alarm)
    Type: String
    Default: ''
  DsappDBInstanceIdentifier:
    Description: DSAPP RDS instance identifier
    Type: String
    Default: ''
  DsappLoadBalancerFullName:
    Description: DSAPP ALB full name (e.g. app/pchc-prd-ase1-dsapp/abc123)
    Type: String
    Default: ''
  DsappRDSConnectionThreshold:
    Description: DSAPP RDS DatabaseConnections alarm threshold
    Type: Number
    Default: 100
    MinValue: 1

  # PayGate
  PaygateAutoScalingGroupName:
    Description: PayGate Auto Scaling Group name (used for EC2 StatusCheckFailed alarm)
    Type: String
    Default: ''
  PaygateDBInstanceIdentifier:
    Description: PayGate RDS instance identifier
    Type: String
    Default: ''
  PaygateLoadBalancerFullName:
    Description: PayGate ALB full name (e.g. app/pchc-prd-ase1-paygate/abc123)
    Type: String
    Default: ''
  PaygateRDSConnectionThreshold:
    Description: PayGate RDS DatabaseConnections alarm threshold
    Type: Number
    Default: 100
    MinValue: 1

  # PhilPass
  PhilpassAutoScalingGroupName:
    Description: PhilPass Auto Scaling Group name (used for EC2 StatusCheckFailed alarm)
    Type: String
    Default: ''
  PhilpassDBInstanceIdentifier:
    Description: PhilPass RDS instance identifier
    Type: String
    Default: ''
  PhilpassLoadBalancerFullName:
    Description: PhilPass ALB full name (e.g. app/pchc-prd-ase1-philpass/abc123)
    Type: String
    Default: ''
  PhilpassRDSConnectionThreshold:
    Description: PhilPass RDS DatabaseConnections alarm threshold
    Type: Number
    Default: 100
    MinValue: 1

Resources:

##
# PESONET
##

  PesonetEC2Alarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${OrgName}-pesonet-ec2-alarm'
      AlarmDescription: PESONET EC2 status check failed
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref PesonetAutoScalingGroupName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'

  PesonetRDSAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${OrgName}-pesonet-rds-alarm'
      AlarmDescription: PESONET RDS connection count above threshold
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref PesonetDBInstanceIdentifier
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref PesonetRDSConnectionThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'

  PesonetALBAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${OrgName}-pesonet-alb-alarm'
      AlarmDescription: PESONET ALB 5xx error rate above 5%
      Metrics:
        - Id: m1
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_Target_5XX_Count
              Dimensions:
                - Name: LoadBalancer
                  Value: !Ref PesonetLoadBalancerFullName
            Period: 300
            Stat: Sum
        - Id: m2
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: RequestCount
              Dimensions:
                - Name: LoadBalancer
                  Value: !Ref PesonetLoadBalancerFullName
            Period: 300
            Stat: Sum
        - Id: e1
          Expression: 'IF(m2 > 0, m1/m2*100, 0)'
          Label: 5xx Rate (%)
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'

  PesonetCompositeAlarm:
    Type: AWS::CloudWatch::CompositeAlarm
    Properties:
      AlarmName: !Sub '${OrgName}-pesonet-infra-composite-alarm'
      AlarmDescription: PESONET infrastructure degraded — EC2, RDS, and ALB all alarming simultaneously
      AlarmRule: !Sub 'ALARM(${PesonetEC2Alarm}) AND ALARM(${PesonetRDSAlarm}) AND ALARM(${PesonetALBAlarm})'
      AlarmActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'

