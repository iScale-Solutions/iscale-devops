AWSTemplateFormatVersion: 2010-09-09
Description: |
  Secrets Manager DR Sync — deploy ONCE in the DR region.
  Hourly Lambda replicates live secret values to DR placeholder secrets in
  this DR region. The live region is derived from each secret's SourceSecretArn
  tag, so secrets sourced from multiple live regions are handled automatically.

  Discovery is tag-based — the Lambda lists all secrets in DR region tagged
  DRSync=true and reads the SourceSecretArn tag on each to find the
  corresponding live secret. No config changes needed here when new apps
  or live regions are added; just tag the app's DRDBSecret in its DR stack.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
      - Label:
          default: Stack Configuration
        Parameters:
          - SNSStackName
      - Label:
          default: DR Configuration
        Parameters:
          - SyncSchedule
          - LogRetentionDays

    ParameterLabels:
      Name:
        default: Stack / Function Name
      OrgName:
        default: Organization Name
      SNSStackName:
        default: SNS Topic Stack Name
      SyncSchedule:
        default: Sync Schedule Expression
      LogRetentionDays:
        default: CloudWatch Log Retention (days)

Parameters:

  Name:
    Description: Unique identifier used in resource names.
    Type: String
    Default: dr-secrets-sync

  OrgName:
    Description: Organization name prefix (e.g. pchc).
    Type: String
    Default: pchc

  SNSStackName:
    Description: Name of the SNS stack to import the topic ARN from. Leave blank to
      disable alarm notifications.
    Type: String
    Default: ''

  SyncSchedule:
    Description: How often the sync Lambda runs.
    Type: String
    Default: rate(1 hour)
    AllowedValues:
      - rate(30 minutes)
      - rate(1 hour)
      - rate(6 hours)
      - rate(1 day)

  LogRetentionDays:
    Description: Number of days to retain Lambda CloudWatch logs.
    Type: Number
    Default: 30
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365

Conditions:

  HasSNS: !Not
    - !Equals
      - !Ref SNSStackName
      - ''

Resources:

  ####
  # IAM
  ####

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-lambda-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
        - PolicyName: ReadLiveSecrets
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Sub arn:aws:secretsmanager:*:${AWS::AccountId}:secret:${OrgName}-*
        - PolicyName: WriteDRSecrets
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:ListSecrets
                Resource: '*'
              - Effect: Allow
                Action:
                  - secretsmanager:PutSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${OrgName}-*

  ####
  # CloudWatch Logs
  ####

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}
      RetentionInDays: !Ref LogRetentionDays

  ####
  # Lambda
  ####

  LambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}
      Description: Syncs live Secrets Manager secret values to DR placeholder secrets.
        Discovers targets by listing DR secrets tagged DRSync=true and reading
        the SourceSecretArn tag on each to find the corresponding live secret.
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.12
      Timeout: 300
      Code:
        ZipFile: |
          import boto3
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          dr_sm = boto3.client('secretsmanager')
          live_clients = {}

          def get_live_client(region):
              if region not in live_clients:
                  live_clients[region] = boto3.client('secretsmanager', region_name=region)
              return live_clients[region]

          def handler(event, context):
              paginator = dr_sm.get_paginator('list_secrets')
              pages = paginator.paginate(
                  Filters=[{'Key': 'tag-key', 'Values': ['DRSync']}]
              )

              synced, errors = 0, 0

              for page in pages:
                  for secret in page['SecretList']:
                      tags       = {t['Key']: t['Value'] for t in secret.get('Tags', [])}
                      source_arn = tags.get('SourceSecretArn')

                      if not source_arn:
                          logger.warning(f"Secret {secret['Name']} tagged DRSync=true but missing SourceSecretArn — skipping")
                          continue

                      try:
                          live_region = source_arn.split(':')[3]
                          live_sm     = get_live_client(live_region)
                          response    = live_sm.get_secret_value(SecretId=source_arn)
                          secret_value = response.get('SecretString') or response.get('SecretBinary')

                          dr_sm.put_secret_value(
                              SecretId=secret['ARN'],
                              SecretString=secret_value
                          )
                          logger.info(f"Synced: {source_arn} -> {secret['Name']}")
                          synced += 1
                      except Exception as e:
                          logger.error(f"Failed to sync {source_arn}: {e}")
                          errors += 1

              logger.info(f"Done — synced: {synced}, errors: {errors}")
              return {'synced': synced, 'errors': errors}

  ####
  # EventBridge
  ####

  HourlySyncRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-cron
      Description: Triggers the secrets sync Lambda on a recurring schedule.
      ScheduleExpression: !Ref SyncSchedule
      State: ENABLED
      Targets:
        - Arn: !GetAtt LambdaFunction.Arn
          Id: !Sub ${AWS::StackName}-cron

  HourlySyncPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt HourlySyncRule.Arn

  ####
  # Alarm
  ####

  SyncErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-errors
      AlarmDescription: Secrets sync Lambda encountered errors — check CloudWatch Logs
        for details.
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref LambdaFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If
          - HasSNS
          - !ImportValue
            Fn::Sub: ${SNSStackName}-TopicArn
          - !Ref AWS::NoValue

Outputs:

  LambdaFunctionArn:
    Description: ARN of the secrets sync Lambda function.
    Value: !GetAtt LambdaFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-LambdaArn

  LambdaFunctionName:
    Description: Name of the secrets sync Lambda function — use this to invoke
      manually for testing.
    Value: !Ref LambdaFunction
    Export:
      Name: !Sub ${AWS::StackName}-LambdaName