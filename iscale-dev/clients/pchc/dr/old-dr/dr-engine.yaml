AWSTemplateFormatVersion: 2010-09-09
Description: |
  DR Engine — Centralized, app-agnostic failover and failback orchestration for all PCHC apps.
  Deployed once. Each app's dr-failover stack targets this engine's Lambda and State Machine.

  FailoverLambda  : Discovers latest snapshot + AMI, updates network + app stacks (non-blocking).
  FailbackLambda  : Handles comment/teardown/restore actions called by the Step Functions state machine.
  FailbackStateMachine (Standard): 4-step flow —
    1. Comment LB params in *ServerStack resources, update app stack (template-only).
    2. Set DeployPaidResources=false on app stack (tears down DB, Cache, LBs, Servers).
    3. Restore LB params (uncomment), update app stack (template cleanup).
    4. Set DeployPaidResources=false on *-network stack (tears down NAT GWs, Jump Host).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Notifications
        Parameters:
          - SNSStackName

Parameters:

  SNSStackName:
    Description: Name of the SNS CloudFormation stack. Must export ${SNSStackName}-TopicArn.
    Type: String
    Default: pchc-productiondr-uw2-sns
    MinLength: 1

  SNSTopicArn:
    Description: |
      ARN of the SNS topic for DR notifications. Overrides SNSStackName import if provided.
      If left blank, the topic ARN is resolved from ${SNSStackName}-TopicArn.
    Type: String
    Default: ''

Resources:

####
# IAM — Failover Lambda
####

  FailoverLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-failover-lambda-role'
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DRFailoverPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: CloudFormation
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:GetTemplate
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DeleteStack
                  - cloudformation:ContinueUpdateRollback
                Resource: '*'
              - Sid: Provisioning
                Effect: Allow
                Action:
                  - ec2:*
                  - rds:*
                  - elasticloadbalancing:*
                  - autoscaling:*
                  - elasticfilesystem:*
                  - elasticache:*
                  - iam:*
                  - s3:*
                  - codedeploy:*
                  - cloudwatch:*
                  - logs:*
                  - backup:*
                  - kms:*
                  - secretsmanager:*
                  - ssm:*
                  - lambda:*
                  - events:*
                  - route53:*
                Resource: '*'
              - Sid: SNSPublish
                Effect: Allow
                Action: sns:Publish
                Resource: '*'

####
# IAM — CloudFormation Execution Role (used by both Failover and Failback via RoleARN)
####

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-cfn-execution-role'
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DRCloudFormationExecutionPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: Provisioning
                Effect: Allow
                Action:
                  - ec2:*
                  - rds:*
                  - elasticloadbalancing:*
                  - autoscaling:*
                  - elasticfilesystem:*
                  - elasticache:*
                  - iam:*
                  - s3:*
                  - codedeploy:*
                  - cloudwatch:*
                  - logs:*
                  - backup:*
                  - kms:*
                  - secretsmanager:*
                  - ssm:*
                  - lambda:*
                  - events:*
                  - route53:*
                  - cloudformation:*
                Resource: '*'
              - Sid: SNSPublish
                Effect: Allow
                Action: sns:Publish
                Resource: '*'

####
# IAM — Failback Lambda
####

  FailbackLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-failback-lambda-role'
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DRFailbackPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: CloudFormation
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:UpdateStack
                  - cloudformation:GetTemplate
                Resource: '*'
              - Sid: PassCFNExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
              - Sid: SNSPublish
                Effect: Allow
                Action: sns:Publish
                Resource: '*'

####
# IAM — Step Functions
####

  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-stepfunctions-role'
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeFailbackLambda
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt FailbackLambdaFunction.Arn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'

####
# Lambda — Failover
####

  FailoverLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-failover'
      Description: |
        DR Failover — app-agnostic. All config comes from the event payload.
        Invoked by each app's dr-failover EventBridge FailoverTriggerRule.
        Discovers latest snapshot + AMI, updates network stack then app stack (non-blocking).
      Handler: index.lambda_handler
      Role: !GetAtt FailoverLambdaRole.Arn
      Runtime: python3.12
      Timeout: 60
      Environment:
        Variables:
          SNS_TOPIC_ARN:
            Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
      Code:
        ZipFile: |
          import boto3
          import json
          import logging
          import os

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
            """
            Event payload (injected by dr-failover InputTransformer):
            {
              "app_name": "<app_name>",
              "org_name": "pchc",
              "app_stack_name": "pchc-prddr-uw2-<app>",
              "network_stack_name": "pchc-prddr-uw2-network",
              "db_instance_identifier": "<id>",
              "dr_db_secret_arn": "<arn>",
              "source_region": "ap-southeast-1",
              "sns_topic_arn": "<arn>",
              "snapshot_identifier": "",   # optional — auto-discovered if blank
              "db_master_password": "",    # optional — auto-fetched from Secrets Manager if blank
              "instance_ami": ""           # optional — auto-discovered if blank
            }
            """
            region = os.environ['AWS_REGION']
            app_name        = event.get('app_name', '')
            org_name        = event.get('org_name', '')
            app_stack       = event.get('app_stack_name', '')
            network_stack   = event.get('network_stack_name', '')
            db_instance_id  = event.get('db_instance_identifier', '')
            dr_db_secret    = event.get('dr_db_secret_arn', '')
            sns_topic       = event.get('sns_topic_arn', '') or os.environ.get('SNS_TOPIC_ARN', '')
            snapshot_id     = event.get('snapshot_identifier', '')
            db_password     = event.get('db_master_password', '')
            instance_ami    = event.get('instance_ami', '')

            cf = boto3.client('cloudformation', region_name=region)

            try:
              # Auto-fetch DB master password from Secrets Manager
              if not db_password and dr_db_secret:
                logger.info(f'Auto-fetching DB master password from: {dr_db_secret}')
                db_password = fetch_db_master_password(region, dr_db_secret)

              # Auto-discover latest snapshot
              if not snapshot_id and db_instance_id:
                logger.info(f'Auto-discovering latest snapshot for: {db_instance_id}')
                snapshot_id = find_latest_snapshot(region, db_instance_id)
                logger.info(f'Using snapshot: {snapshot_id}')

              # Auto-discover latest DR AMI
              if org_name and app_name:
                logger.info(f'Auto-discovering latest DR AMI: {org_name}_{app_name}_dr-image_*')
                instance_ami = find_latest_ami(region, org_name, app_name)
                logger.info(f'Using AMI: {instance_ami}')

              # Step 1: Network stack — activate NAT Gateways, Jump Host, VPC Endpoints
              logger.info(f'[FAILOVER 1/2] Updating network stack: {network_stack}')
              update_stack(cf, network_stack, deploy_paid='true')

              # Step 2: App stack — activate DB, Cache, LBs, App Servers
              logger.info(f'[FAILOVER 2/2] Updating app stack: {app_stack}')
              update_stack(cf, app_stack, deploy_paid='true', extra_params={
                'SnapshotIdentifier': snapshot_id,
                'DBMasterUserPassword': db_password,
                'InstanceAMI': instance_ami
              })

              summary = (
                f'DR Failover initiated for [{app_name}].\n'
                f'Network stack : {network_stack}\n'
                f'App stack     : {app_stack}\n'
                f'Snapshot      : {snapshot_id or "(none)"}\n'
                f'AMI           : {instance_ami or "(UsePreviousValue)"}\n\n'
                f'CloudFormation is now provisioning resources asynchronously. '
                f'DB restore takes 20-60 min.'
              )
              logger.info(summary)
              notify(sns_topic, f'DR Failover Initiated [{app_name}]', summary)
              return {'statusCode': 200, 'body': summary}

            except Exception as e:
              msg = f'DR Failover FAILED [{app_name}]: {str(e)}'
              logger.exception(msg)
              notify(sns_topic, f'DR Failover FAILED [{app_name}]', msg)
              raise


          def find_latest_snapshot(region, db_instance_identifier):
            rds = boto3.client('rds', region_name=region)
            for snapshot_type in ['manual', 'automated']:
              resp = rds.describe_db_snapshots(
                DBInstanceIdentifier=db_instance_identifier,
                SnapshotType=snapshot_type
              )
              snapshots = [s for s in resp.get('DBSnapshots', []) if s.get('Status') == 'available']
              if snapshots:
                snapshots.sort(key=lambda x: x['SnapshotCreateTime'], reverse=True)
                return snapshots[0]['DBSnapshotArn']
            raise Exception(
              f'No available snapshots found for: {db_instance_identifier}. '
              f'Ensure cross-region snapshot replication is enabled or provide snapshot_identifier explicitly.'
            )


          def fetch_db_master_password(region, secret_arn):
            sm = boto3.client('secretsmanager', region_name=region)
            resp = sm.get_secret_value(SecretId=secret_arn)
            secret = json.loads(resp['SecretString'])
            password = secret.get('DB_ROOT_PASSWORD', '')
            if not password:
              raise Exception(f'DB_ROOT_PASSWORD not found in secret: {secret_arn}.')
            return password


          def find_latest_ami(region, org_name, app_name):
            ec2 = boto3.client('ec2', region_name=region)
            resp = ec2.describe_images(
              Owners=['self'],
              Filters=[
                {'Name': 'name', 'Values': [f'{org_name}_{app_name}_dr-image_*']},
                {'Name': 'state', 'Values': ['available']}
              ]
            )
            images = resp.get('Images', [])
            if not images:
              raise Exception(
                f'No available DR AMIs found matching: {org_name}_{app_name}_dr-image_*. '
                f'Ensure EC2 Image Builder has replicated at least one AMI to this region.'
              )
            images.sort(key=lambda x: x['CreationDate'], reverse=True)
            return images[0]['ImageId']


          def get_current_parameters(cf, stack_name):
            resp = cf.describe_stacks(StackName=stack_name)
            stack = resp['Stacks'][0]
            return {p['ParameterKey']: p['ParameterValue'] for p in stack.get('Parameters', [])}


          def update_stack(cf, stack_name, deploy_paid, extra_params=None):
            if extra_params is None:
              extra_params = {}
            current_params = get_current_parameters(cf, stack_name)
            parameters = []
            for key in current_params:
              if key == 'DeployPaidResources':
                parameters.append({'ParameterKey': key, 'ParameterValue': deploy_paid})
              elif key in extra_params and extra_params[key]:
                parameters.append({'ParameterKey': key, 'ParameterValue': extra_params[key]})
              else:
                parameters.append({'ParameterKey': key, 'UsePreviousValue': True})
            cf.update_stack(
              StackName=stack_name,
              UsePreviousTemplate=True,
              Parameters=parameters,
              Capabilities=['CAPABILITY_IAM', 'CAPABILITY_NAMED_IAM', 'CAPABILITY_AUTO_EXPAND']
            )


          def notify(sns_topic_arn, subject, message):
            if not sns_topic_arn:
              return
            try:
              boto3.client('sns').publish(TopicArn=sns_topic_arn, Subject=subject, Message=message)
            except Exception:
              logger.warning('Failed to publish SNS notification', exc_info=True)

####
# Lambda — Failback
####

  FailbackLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-failback'
      Description: >-
        DR Failback — app-agnostic. Called by FailbackStateMachine.
        Actions: comment_lb_params | check_stack_update_status | set_app_deploy_paid_false |
        uncomment_lb_params | set_network_deploy_paid_false | log_completion | notify_failure
      Handler: index.lambda_handler
      Role: !GetAtt FailbackLambdaRole.Arn
      Runtime: python3.12
      Timeout: 60
      Environment:
        Variables:
          SNS_TOPIC_ARN:
            Fn::ImportValue: !Sub '${SNSStackName}-TopicArn'
          CFN_EXECUTION_ROLE_ARN: !GetAtt CloudFormationExecutionRole.Arn
      Code:
        ZipFile: |
          import boto3
          import logging
          import os
          import re

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          # LB parameter keys to comment/uncomment in *ServerStack resources.
          # Longer names listed first so the regex alternation matches greedily.
          LB_PARAMS = [
            'LoadBalancerCanonicalHostedZoneID',
            'LoadBalancerHttpListenerArn',
            'LoadBalancerStackName',
            'LoadBalancerDNSName',
          ]

          def lambda_handler(event, context):
            """
            Actions dispatched by the FailbackStateMachine:

            comment_lb_params:
              { "action": "comment_lb_params", "app_stack_name": "...",
                "app_name": "...", "sns_topic_arn": "..." }
              Returns: { "patched": true/false }

            check_stack_update_status:
              { "action": "check_stack_update_status", "stack_name": "..." }
              Returns: { "update_complete": true/false, "status": "..." }

            set_app_deploy_paid_false:
              { "action": "set_app_deploy_paid_false", "app_stack_name": "...",
                "app_name": "...", "sns_topic_arn": "..." }
              Returns: { "submitted": true, "stack": "..." }

            uncomment_lb_params:
              { "action": "uncomment_lb_params", "app_stack_name": "...",
                "app_name": "...", "sns_topic_arn": "..." }
              Returns: { "restored": true/false }

            set_network_deploy_paid_false:
              { "action": "set_network_deploy_paid_false", "network_stack_name": "...",
                "app_name": "...", "sns_topic_arn": "..." }
              Returns: { "submitted": true, "stack": "..." }

            log_completion:
              { "action": "log_completion", "app_stack_name": "...",
                "network_stack_name": "...", "app_name": "...", "sns_topic_arn": "..." }
              Returns: { "statusCode": 200, "body": "..." }

            notify_failure:
              { "action": "notify_failure", "app_name": "...",
                "sns_topic_arn": "...", "error": {...} }
              Returns: { "logged": true }
            """
            action = event.get('action')
            region = os.environ['AWS_REGION']
            cf     = boto3.client('cloudformation', region_name=region)

            logger.info(f'[DR-ENGINE] Failback invoked | action={action} | stack={event.get("app_stack_name") or event.get("stack_name") or event.get("network_stack_name", "")}')

            if action == 'comment_lb_params':
              return comment_lb_params_action(cf, event)
            elif action == 'check_stack_update_status':
              return check_stack_update_status(cf, event)
            elif action == 'set_app_deploy_paid_false':
              return set_app_deploy_paid_false(cf, event)
            elif action == 'uncomment_lb_params':
              return uncomment_lb_params_action(cf, event)
            elif action == 'set_network_deploy_paid_false':
              return set_network_deploy_paid_false(cf, event)
            elif action == 'log_completion':
              return log_completion(event)
            elif action == 'notify_failure':
              return notify_failure(event)
            else:
              raise ValueError(f'Unknown action: {action}')


          # ──────────────────────────────────────────────────────────────────
          # STEP 1/4 — Comment LB params in *ServerStack resources
          # ──────────────────────────────────────────────────────────────────

          def comment_lb_params_action(cf, event):
            """
            Fetches the app stack YAML template, comments out the LB param blocks in
            every *ServerStack resource (e.g. TreasuryServerStack, APIServerStack,
            pas6ServerStack — any resource whose logical ID ends in 'ServerStack'),
            and submits a CF stack update with the patched template body.
            DeployPaidResources is unchanged at this point — this is a template-only change.
            """
            app_stack = event['app_stack_name']
            app_name  = event.get('app_name', app_stack)

            logger.info(f'[FAILBACK 1/4] Commenting LB params in *ServerStack resources | stack={app_stack}')
            modified = _fetch_and_patch(cf, app_stack, comment=True)
            if modified:
              update_stack(cf, app_stack, deploy_paid=None, template_body=modified)
              logger.info(f'[FAILBACK 1/4] CF update submitted — LB params commented out | stack={app_stack}')
              # notify(event.get('sns_topic_arn', '') or os.environ.get('SNS_TOPIC_ARN', ''),
              #        f'DR Failback — LB Params Commented [{app_name}]',
              #        f'CF update submitted: LB params commented out in *ServerStack resources of {app_stack}.')
            else:
              logger.info(f'[FAILBACK 1/4] No active LB params found — skipping CF update | stack={app_stack}')
            return {'patched': modified is not None}


          # ──────────────────────────────────────────────────────────────────
          # POLL — Check any CF stack for terminal status
          # ──────────────────────────────────────────────────────────────────

          def check_stack_update_status(cf, event):
            """
            Polls whether a CF stack has reached a terminal (non-updating) status.
            Accepts 'stack_name' (generic) and optional 'context' (log label).
            Returns:
              update_complete  — True when no longer in *_IN_PROGRESS
              rollback_occurred — True on any rollback/failure terminal state (fail-fast signal)
              status           — raw CF stack status string
            All rollback/failure terminals set rollback_occurred=True so the state machine
            can fail fast instead of continuing into subsequent steps.
            """
            stack_name = event.get('stack_name') or event.get('app_stack_name')
            ctx        = event.get('context', 'POLL')
            if not stack_name:
              logger.error(f'[{ctx}] No stack_name provided in event')
              return {'update_complete': False, 'rollback_occurred': False, 'status': 'UNKNOWN'}
            try:
              resp   = cf.describe_stacks(StackName=stack_name)
              status = resp['Stacks'][0]['StackStatus']
            except Exception as e:
              logger.warning(f'[{ctx}] Could not describe stack | stack={stack_name} | error={e}')
              return {'update_complete': False, 'rollback_occurred': False, 'status': 'UNKNOWN'}
            terminal = {
              'CREATE_COMPLETE', 'UPDATE_COMPLETE',
              'UPDATE_ROLLBACK_COMPLETE', 'UPDATE_ROLLBACK_FAILED',
              'ROLLBACK_COMPLETE', 'ROLLBACK_FAILED',
              'DELETE_COMPLETE', 'DELETE_FAILED',
              'CREATE_FAILED',
              'IMPORT_COMPLETE', 'IMPORT_ROLLBACK_COMPLETE',
            }
            rollback_states = {
              'UPDATE_ROLLBACK_COMPLETE', 'UPDATE_ROLLBACK_FAILED',
              'ROLLBACK_COMPLETE', 'ROLLBACK_FAILED',
              'DELETE_FAILED', 'CREATE_FAILED',
            }
            complete = status in terminal
            rollback = status in rollback_states
            if rollback:
              logger.error(f'[{ctx}] ROLLBACK/FAILURE DETECTED — fail fast | stack={stack_name} | status={status}')
            elif complete:
              logger.info(f'[{ctx}] Stack update COMPLETE | stack={stack_name} | status={status}')
            else:
              logger.info(f'[{ctx}] Stack update IN PROGRESS | stack={stack_name} | status={status}')
            return {'update_complete': complete, 'rollback_occurred': rollback, 'status': status}


          # ──────────────────────────────────────────────────────────────────
          # STEP 2/4 — Set DeployPaidResources=false on app stack
          # ──────────────────────────────────────────────────────────────────

          def set_app_deploy_paid_false(cf, event):
            """
            Sets DeployPaidResources=false on the app stack using UsePreviousTemplate
            (the template already has LB params commented out from Step 1).
            CF tears down DB, Cache, LBs, and App Servers via the IsDeployPaidResources condition.
            Non-blocking — state machine polls for completion via check_stack_update_status.
            """
            app_stack = event['app_stack_name']
            app_name  = event.get('app_name', app_stack)

            logger.info(f'[FAILBACK 2/4] Setting DeployPaidResources=false on app stack | stack={app_stack}')
            update_stack(cf, app_stack, deploy_paid='false')
            logger.info(f'[FAILBACK 2/4] CF update submitted — DeployPaidResources=false | stack={app_stack}')
            logger.info(f'[FAILBACK 2/4] CF is deprovisioning DB, Cache, LBs, App Servers (IsDeployPaidResources condition)')
            # notify(event.get('sns_topic_arn', '') or os.environ.get('SNS_TOPIC_ARN', ''),
            #        f'DR Failback — App Stack Teardown Initiated [{app_name}]',
            #        f'DeployPaidResources=false submitted for {app_stack}. CF is deprovisioning paid resources.')
            return {'submitted': True, 'stack': app_stack}


          # ──────────────────────────────────────────────────────────────────
          # STEP 3/4 — Restore LB params (uncomment) — template cleanup
          # ──────────────────────────────────────────────────────────────────

          def uncomment_lb_params_action(cf, event):
            """
            Restores the app stack template by uncommenting the LB param blocks in every
            *ServerStack resource. DeployPaidResources remains false — this is a template-only
            cleanup so the template is pristine for the next failover cycle.
            """
            app_stack = event['app_stack_name']
            app_name  = event.get('app_name', app_stack)

            logger.info(f'[FAILBACK 3/4] Restoring LB params (uncommenting) in *ServerStack resources | stack={app_stack}')
            modified = _fetch_and_patch(cf, app_stack, comment=False)
            if modified:
              update_stack(cf, app_stack, deploy_paid=None, template_body=modified)
              logger.info(f'[FAILBACK 3/4] CF update submitted — template restored | stack={app_stack}')
              # notify(event.get('sns_topic_arn', '') or os.environ.get('SNS_TOPIC_ARN', ''),
              #        f'DR Failback — LB Params Restored [{app_name}]',
              #        f'Template restored (LB params uncommented) in {app_stack}. DeployPaidResources stays false.')
            else:
              logger.info(f'[FAILBACK 3/4] No commented LB params found — skipping CF update | stack={app_stack}')
            return {'restored': modified is not None}


          # ──────────────────────────────────────────────────────────────────
          # STEP 4/4 — Set DeployPaidResources=false on *-network stack
          # ──────────────────────────────────────────────────────────────────

          def set_network_deploy_paid_false(cf, event):
            """
            Sets DeployPaidResources=false on the *-network stack (e.g. pchc-tdr-ue2-pesonet20-network,
            pchc-tdr-ue2-pas6-network). CF tears down NAT Gateways, Jump Host, VPC Endpoints.
            Non-blocking — state machine polls for completion via check_stack_update_status.
            """
            network_stack = event['network_stack_name']
            app_name      = event.get('app_name', network_stack)

            logger.info(f'[FAILBACK 4/4] Setting DeployPaidResources=false on network stack | stack={network_stack}')
            update_stack(cf, network_stack, deploy_paid='false')
            logger.info(f'[FAILBACK 4/4] CF update submitted — DeployPaidResources=false | stack={network_stack}')
            logger.info(f'[FAILBACK 4/4] CF is deprovisioning NAT Gateways, Jump Host, VPC Endpoints')
            # notify(event.get('sns_topic_arn', '') or os.environ.get('SNS_TOPIC_ARN', ''),
            #        f'DR Failback — Network Stack Teardown Initiated [{app_name}]',
            #        f'DeployPaidResources=false submitted for {network_stack}. CF is deprovisioning NAT GWs.')
            return {'submitted': True, 'stack': network_stack}


          # ──────────────────────────────────────────────────────────────────
          # COMPLETE — Log failback summary
          # ──────────────────────────────────────────────────────────────────

          def log_completion(event):
            """
            Logs failback completion summary to CloudWatch.
            SNS notify is commented out — future-proofing placeholder.
            """
            app_stack     = event.get('app_stack_name', '')
            network_stack = event.get('network_stack_name', '')
            app_name      = event.get('app_name', app_stack)

            summary = (
              f'DR Failback COMPLETE for [{app_name}].\n'
              f'App stack     : {app_stack} — DeployPaidResources=false, template restored\n'
              f'Network stack : {network_stack} — DeployPaidResources=false\n\n'
              f'Paid resources (DB, Cache, LBs, App Servers, NAT GWs) have been deprovisioned.\n'
              f'S3 buckets, snapshots, and AMIs are retained for the next failover cycle.'
            )
            logger.info(f'[FAILBACK COMPLETE] {summary}')
            # notify(event.get('sns_topic_arn', '') or os.environ.get('SNS_TOPIC_ARN', ''),
            #        f'DR Failback Complete [{app_name}]', summary)
            return {'statusCode': 200, 'body': summary}


          # ──────────────────────────────────────────────────────────────────
          # FAILURE — Log failback failure
          # ──────────────────────────────────────────────────────────────────

          def notify_failure(event):
            """
            Logs failback failure to CloudWatch.
            SNS notify is commented out — future-proofing placeholder.
            """
            app_name = event.get('app_name', '')
            error    = event.get('error', {})

            msg = (
              f'DR Failback FAILED for [{app_name}].\n'
              f'Error: {error}\n'
              f'Check CloudWatch Logs for {os.environ.get("AWS_LAMBDA_FUNCTION_NAME", "FailbackLambda")}.'
            )
            logger.error(f'[FAILBACK FAILED] {msg}')
            # notify(event.get('sns_topic_arn', '') or os.environ.get('SNS_TOPIC_ARN', ''),
            #        f'DR Failback FAILED [{app_name}]', msg)
            return {'logged': True}


          # ──────────────────────────────────────────────────────────────────
          # Template patching helpers
          # ──────────────────────────────────────────────────────────────────

          def _fetch_and_patch(cf, stack_name, comment):
            """
            Fetches the YAML template body via GetTemplate(TemplateStage='Original'),
            runs _comment_params or _uncomment_params, and returns the modified text.
            Returns None if no changes were made or if the template could not be patched.
            Targets LB param blocks inside any *ServerStack resource (app-agnostic).
            """
            try:
              resp = cf.get_template(StackName=stack_name, TemplateStage='Original')
              raw  = resp['TemplateBody']
            except Exception as e:
              logger.warning(f'[PATCH] Cannot fetch template | stack={stack_name} | error={e}')
              return None
            if isinstance(raw, dict):
              logger.warning('[PATCH] Template is JSON — text-based patching not applicable')
              return None
            fn       = _comment_params if comment else _uncomment_params
            modified = fn(raw)
            if modified == raw:
              logger.info(f'[PATCH] No changes made to template | stack={stack_name} | comment={comment}')
              return None
            logger.info(f'[PATCH] Template patched | stack={stack_name} | comment={comment}')
            return modified


          def _comment_params(text):
            """
            For each key in LB_PARAMS, locates the parameter entry inside any
            *ServerStack Parameters block and comments it out by inserting '# ' at
            the key's base-indent position for the key line and every continuation
            line (lines indented deeper than the key that immediately follow it).

            Works for any app's ServerStack resource (TreasuryServerStack, APIServerStack,
            SidekiqServerStack, CustomerServiceServerStack, pas6ServerStack, etc.)
            because it scans the full template text for the LB_PARAMS keys.

            Idempotent — skips keys whose line already starts with '#'.
            """
            pat   = r'^( +)(' + '|'.join(re.escape(k) for k in LB_PARAMS) + r')(\s*:)'
            lines = text.split('\n')
            out   = []
            i     = 0
            while i < len(lines):
              m = re.match(pat, lines[i])
              if m and not lines[i].lstrip().startswith('#'):
                base = len(m.group(1))
                pfx  = ' ' * base
                out.append(pfx + '# ' + lines[i][base:])
                i += 1
                while i < len(lines):
                  nxt = lines[i]
                  if not nxt.strip():
                    break
                  if (len(nxt) - len(nxt.lstrip())) <= base:
                    break
                  out.append(pfx + '# ' + nxt[base:])
                  i += 1
              else:
                out.append(lines[i])
                i += 1
            return '\n'.join(out)


          def _uncomment_params(text):
            """
            Reverses _comment_params: removes '# ' at the base-indent position from
            commented LB_PARAMS entries and their continuation lines.
            Idempotent — skips keys that are not commented.
            """
            pat   = r'^( +)# (' + '|'.join(re.escape(k) for k in LB_PARAMS) + r')(\s*:)'
            lines = text.split('\n')
            out   = []
            i     = 0
            while i < len(lines):
              m = re.match(pat, lines[i])
              if m:
                base = len(m.group(1))
                pfx  = ' ' * base
                out.append(pfx + lines[i][base + 2:])
                i += 1
                while i < len(lines):
                  nxt = lines[i]
                  if not nxt.startswith(pfx + '# '):
                    break
                  restored = pfx + nxt[base + 2:]
                  if not restored.strip():
                    break
                  out.append(restored)
                  i += 1
              else:
                out.append(lines[i])
                i += 1
            return '\n'.join(out)


          def get_current_parameters(cf, stack_name):
            resp  = cf.describe_stacks(StackName=stack_name)
            stack = resp['Stacks'][0]
            return {p['ParameterKey']: p['ParameterValue'] for p in stack.get('Parameters', [])}


          def update_stack(cf, stack_name, deploy_paid=None, template_body=None):
            """
            deploy_paid=None    → keep DeployPaidResources at its current value (UsePreviousValue).
            deploy_paid='false' → override DeployPaidResources to false.
            template_body=None  → UsePreviousTemplate=True.
            template_body=str   → submit new TemplateBody (YAML text, comments preserved).
            CloudFormation assumes CFN_EXECUTION_ROLE_ARN (env var) so it has the permissions
            needed to provision/deprovision EC2, RDS, ELB, EFS, IAM, etc. across both the
            app stack (nested child stacks) and the *-network stack.
            """
            current_params  = get_current_parameters(cf, stack_name)
            parameters      = []
            for key in current_params:
              if key == 'DeployPaidResources' and deploy_paid is not None:
                parameters.append({'ParameterKey': key, 'ParameterValue': deploy_paid})
              else:
                parameters.append({'ParameterKey': key, 'UsePreviousValue': True})
            kwargs = dict(
              StackName=stack_name,
              Parameters=parameters,
              Capabilities=['CAPABILITY_IAM', 'CAPABILITY_NAMED_IAM', 'CAPABILITY_AUTO_EXPAND']
            )
            if template_body:
              kwargs['TemplateBody'] = template_body
            else:
              kwargs['UsePreviousTemplate'] = True
            cfn_role = os.environ.get('CFN_EXECUTION_ROLE_ARN', '')
            if cfn_role:
              kwargs['RoleARN'] = cfn_role
              logger.info(f'[UPDATE_STACK] Using CFN execution role | stack={stack_name} | role={cfn_role}')
            cf.update_stack(**kwargs)


          def notify(sns_topic_arn, subject, message):
            if not sns_topic_arn:
              return
            try:
              boto3.client('sns').publish(TopicArn=sns_topic_arn, Subject=subject, Message=message)
            except Exception:
              logger.warning('Failed to publish SNS notification', exc_info=True)

####
# CloudWatch Logs — Failback State Machine execution log group
####

  FailbackStateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/states/${AWS::StackName}-failback'
      RetentionInDays: 90

####
# Step Functions — Failback State Machine (Standard)
####

  FailbackStateMachine:
    Type: AWS::StepFunctions::StateMachine
    DependsOn: FailbackStateMachineLogGroup
    Properties:
      StateMachineName: !Sub '${AWS::StackName}-failback'
      StateMachineType: STANDARD
      RoleArn: !GetAtt StepFunctionsRole.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt FailbackStateMachineLogGroup.Arn
      DefinitionString: !Sub |
        {
          "Comment": "DR Failback — pre-flight check, then 4 steps: (1) comment LB params, (2) set app DeployPaidResources=false, (3) restore LB params, (4) set network DeployPaidResources=false. Fails fast on any CF rollback.",
          "StartAt": "ValidateConfirmFailback",
          "States": {

            "ValidateConfirmFailback": {
              "Comment": "Gate: confirm_failback must be explicitly true before any stack is touched.",
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.confirm_failback",
                  "BooleanEquals": true,
                  "Next": "CheckPreFlightStack"
                }
              ],
              "Default": "FailbackRejected"
            },

            "FailbackRejected": {
              "Type": "Fail",
              "Error": "FailbackRejected",
              "Cause": "confirm_failback must be true. Ensure DNS has been switched back to primary before proceeding."
            },

            "CheckPreFlightStack": {
              "Comment": "PRE-FLIGHT: Verify app stack is in a stable terminal state before any update is submitted. If it is still IN_PROGRESS from a prior operation, loop here until it settles. Fail fast if already in rollback.",
              "Type": "Task",
              "Resource": "${FailbackLambdaFunction.Arn}",
              "Parameters": {
                "action": "check_stack_update_status",
                "stack_name.$": "$.app_stack_name",
                "context": "PRE-FLIGHT"
              },
              "ResultPath": "$.preflight_result",
              "Next": "PreFlightDone",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "FailbackFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "PreFlightDone": {
              "Comment": "Rollback check first — fail fast. Then: stable → begin failback. Still IN_PROGRESS → wait and re-check.",
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.preflight_result.rollback_occurred",
                  "BooleanEquals": true,
                  "Next": "RollbackDetected"
                },
                {
                  "Variable": "$.preflight_result.update_complete",
                  "BooleanEquals": true,
                  "Next": "CommentLBParams"
                }
              ],
              "Default": "WaitPreFlight"
            },

            "WaitPreFlight": {
              "Comment": "App stack is still updating from a prior operation — wait before re-checking.",
              "Type": "Wait",
              "Seconds": 30,
              "Next": "CheckPreFlightStack"
            },

            "CommentLBParams": {
              "Comment": "STEP 1/4 START — Comment out LB param blocks in every *ServerStack resource. Template-only CF update; DeployPaidResources unchanged.",
              "Type": "Task",
              "Resource": "${FailbackLambdaFunction.Arn}",
              "Parameters": {
                "action": "comment_lb_params",
                "app_stack_name.$": "$.app_stack_name",
                "app_name.$": "$.app_name",
                "sns_topic_arn.$": "$.sns_topic_arn"
              },
              "ResultPath": "$.comment_result",
              "Next": "CommentPatchDecision",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 15,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "FailbackFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "CommentPatchDecision": {
              "Comment": "If LB params were patched a CF update was submitted — poll for completion. If nothing was patched (already commented or not found) skip the wait entirely.",
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.comment_result.patched",
                  "BooleanEquals": true,
                  "Next": "WaitForCommentUpdate"
                }
              ],
              "Default": "SetAppDeployPaidFalse"
            },

            "WaitForCommentUpdate": {
              "Comment": "CF template-patch update is async — initial wait before polling.",
              "Type": "Wait",
              "Seconds": 30,
              "Next": "CheckCommentUpdateStatus"
            },

            "CheckCommentUpdateStatus": {
              "Comment": "STEP 1/4 POLL — waiting for template-patch CF update to reach terminal status.",
              "Type": "Task",
              "Resource": "${FailbackLambdaFunction.Arn}",
              "Parameters": {
                "action": "check_stack_update_status",
                "stack_name.$": "$.app_stack_name",
                "context": "STEP 1/4 POLL"
              },
              "ResultPath": "$.comment_update_result",
              "Next": "CommentUpdateDone",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "FailbackFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "CommentUpdateDone": {
              "Comment": "Rollback check first. Then: complete → step 2. Still in progress → loop.",
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.comment_update_result.rollback_occurred",
                  "BooleanEquals": true,
                  "Next": "RollbackDetected"
                },
                {
                  "Variable": "$.comment_update_result.update_complete",
                  "BooleanEquals": true,
                  "Next": "SetAppDeployPaidFalse"
                }
              ],
              "Default": "WaitForCommentUpdate"
            },

            "SetAppDeployPaidFalse": {
              "Comment": "STEP 2/4 START — Set DeployPaidResources=false on app stack. CF tears down DB, Cache, LBs, App Servers via IsDeployPaidResources condition. Non-blocking.",
              "Type": "Task",
              "Resource": "${FailbackLambdaFunction.Arn}",
              "Parameters": {
                "action": "set_app_deploy_paid_false",
                "app_stack_name.$": "$.app_stack_name",
                "app_name.$": "$.app_name",
                "sns_topic_arn.$": "$.sns_topic_arn"
              },
              "ResultPath": "$.app_teardown_result",
              "Next": "WaitForAppTeardown",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 15,
                  "MaxAttempts": 2,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "FailbackFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "WaitForAppTeardown": {
              "Comment": "STEP 2/4 WAIT — DB/Cache/ELB deletion takes several minutes; use a longer initial wait.",
              "Type": "Wait",
              "Seconds": 60,
              "Next": "CheckAppTeardownStatus"
            },

            "CheckAppTeardownStatus": {
              "Comment": "STEP 2/4 POLL — waiting for DeployPaidResources=false update to reach terminal status.",
              "Type": "Task",
              "Resource": "${FailbackLambdaFunction.Arn}",
              "Parameters": {
                "action": "check_stack_update_status",
                "stack_name.$": "$.app_stack_name",
                "context": "STEP 2/4 POLL"
              },
              "ResultPath": "$.app_teardown_update_result",
              "Next": "AppTeardownDone",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "FailbackFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "AppTeardownDone": {
              "Comment": "Rollback check first. Then: complete → step 3. Still in progress → loop.",
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.app_teardown_update_result.rollback_occurred",
                  "BooleanEquals": true,
                  "Next": "RollbackDetected"
                },
                {
                  "Variable": "$.app_teardown_update_result.update_complete",
                  "BooleanEquals": true,
                  "Next": "UncommentLBParams"
                }
              ],
              "Default": "WaitForAppTeardown"
            },

            "UncommentLBParams": {
              "Comment": "STEP 3/4 START — Restore template by uncommenting LB params in every *ServerStack resource. DeployPaidResources stays false. Template is now pristine for the next failover cycle.",
              "Type": "Task",
              "Resource": "${FailbackLambdaFunction.Arn}",
              "Parameters": {
                "action": "uncomment_lb_params",
                "app_stack_name.$": "$.app_stack_name",
                "app_name.$": "$.app_name",
                "sns_topic_arn.$": "$.sns_topic_arn"
              },
              "ResultPath": "$.uncomment_result",
              "Next": "UncommentPatchDecision",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 15,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "FailbackFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "UncommentPatchDecision": {
              "Comment": "If LB params were restored a CF update was submitted — poll for completion. If nothing was restored (already uncommented) skip the wait entirely.",
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.uncomment_result.restored",
                  "BooleanEquals": true,
                  "Next": "WaitForUncommentUpdate"
                }
              ],
              "Default": "SetNetworkDeployPaidFalse"
            },

            "WaitForUncommentUpdate": {
              "Comment": "CF template-restore update is async — initial wait before polling.",
              "Type": "Wait",
              "Seconds": 30,
              "Next": "CheckUncommentUpdateStatus"
            },

            "CheckUncommentUpdateStatus": {
              "Comment": "STEP 3/4 POLL — waiting for template-restore CF update to reach terminal status.",
              "Type": "Task",
              "Resource": "${FailbackLambdaFunction.Arn}",
              "Parameters": {
                "action": "check_stack_update_status",
                "stack_name.$": "$.app_stack_name",
                "context": "STEP 3/4 POLL"
              },
              "ResultPath": "$.uncomment_update_result",
              "Next": "UncommentUpdateDone",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "FailbackFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "UncommentUpdateDone": {
              "Comment": "Rollback check first. Then: complete → step 4. Still in progress → loop.",
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.uncomment_update_result.rollback_occurred",
                  "BooleanEquals": true,
                  "Next": "RollbackDetected"
                },
                {
                  "Variable": "$.uncomment_update_result.update_complete",
                  "BooleanEquals": true,
                  "Next": "SetNetworkDeployPaidFalse"
                }
              ],
              "Default": "WaitForUncommentUpdate"
            },

            "SetNetworkDeployPaidFalse": {
              "Comment": "STEP 4/4 START — Set DeployPaidResources=false on the *-network stack. CF tears down NAT Gateways, Jump Host, VPC Endpoints. Non-blocking.",
              "Type": "Task",
              "Resource": "${FailbackLambdaFunction.Arn}",
              "Parameters": {
                "action": "set_network_deploy_paid_false",
                "network_stack_name.$": "$.network_stack_name",
                "app_name.$": "$.app_name",
                "sns_topic_arn.$": "$.sns_topic_arn"
              },
              "ResultPath": "$.network_teardown_result",
              "Next": "WaitForNetworkTeardown",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 15,
                  "MaxAttempts": 2,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "FailbackFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "WaitForNetworkTeardown": {
              "Comment": "STEP 4/4 WAIT — NAT GW deletion takes 1-2 min; use a longer initial wait.",
              "Type": "Wait",
              "Seconds": 60,
              "Next": "CheckNetworkTeardownStatus"
            },

            "CheckNetworkTeardownStatus": {
              "Comment": "STEP 4/4 POLL — waiting for network stack DeployPaidResources=false update to reach terminal status.",
              "Type": "Task",
              "Resource": "${FailbackLambdaFunction.Arn}",
              "Parameters": {
                "action": "check_stack_update_status",
                "stack_name.$": "$.network_stack_name",
                "context": "STEP 4/4 POLL"
              },
              "ResultPath": "$.network_teardown_update_result",
              "Next": "NetworkTeardownDone",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "FailbackFailed",
                  "ResultPath": "$.error"
                }
              ]
            },

            "NetworkTeardownDone": {
              "Comment": "Rollback check first. Then: complete → done. Still in progress → loop.",
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.network_teardown_update_result.rollback_occurred",
                  "BooleanEquals": true,
                  "Next": "RollbackDetected"
                },
                {
                  "Variable": "$.network_teardown_update_result.update_complete",
                  "BooleanEquals": true,
                  "Next": "FailbackComplete"
                }
              ],
              "Default": "WaitForNetworkTeardown"
            },

            "RollbackDetected": {
              "Comment": "A CF stack entered a rollback or failure state — stamp $.error and route to FailbackFailed for logging before the execution is marked failed.",
              "Type": "Pass",
              "Parameters": {
                "Error": "RollbackOccurred",
                "Cause": "A CloudFormation stack entered a rollback or failure state during failback. Check the CF console and CloudWatch Logs to identify which stack and step failed."
              },
              "ResultPath": "$.error",
              "Next": "FailbackFailed"
            },

            "FailbackComplete": {
              "Comment": "ALL STEPS COMPLETE — log summary to CloudWatch. SNS notify is commented out in the Lambda (future-proofing).",
              "Type": "Task",
              "Resource": "${FailbackLambdaFunction.Arn}",
              "Parameters": {
                "action": "log_completion",
                "app_stack_name.$": "$.app_stack_name",
                "network_stack_name.$": "$.network_stack_name",
                "app_name.$": "$.app_name",
                "sns_topic_arn.$": "$.sns_topic_arn"
              },
              "ResultPath": "$.completion_result",
              "End": true,
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 2,
                  "BackoffRate": 2
                }
              ]
            },

            "FailbackFailed": {
              "Comment": "Log failure details to CloudWatch then transition to FailState.",
              "Type": "Task",
              "Resource": "${FailbackLambdaFunction.Arn}",
              "Parameters": {
                "action": "notify_failure",
                "app_name.$": "$.app_name",
                "sns_topic_arn.$": "$.sns_topic_arn",
                "error.$": "$.error"
              },
              "ResultPath": "$.failure_result",
              "Next": "FailState"
            },

            "FailState": {
              "Type": "Fail",
              "Error": "FailbackFailed",
              "Cause": "DR Failback failed. Check CloudWatch Logs for the FailbackLambda and the CF console for stack status."
            }

          }
        }

