# Outputs
####

Outputs:

  FailoverLambdaArn:
    Description: ARN of the centralized DR Failover Lambda
    Value: !GetAtt FailoverLambdaFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FailoverLambdaArn'

  FailoverLambdaName:
    Description: Name of the centralized DR Failover Lambda
    Value: !Ref FailoverLambdaFunction
    Export:
      Name: !Sub '${AWS::StackName}-FailoverLambdaName'

  FailbackStateMachineArn:
    Description: ARN of the centralized DR Failback State Machine
    Value: !Ref FailbackStateMachine
    Export:
      Name: !Sub '${AWS::StackName}-FailbackStateMachineArn'

  FailbackStateMachineName:
    Description: Name of the centralized DR Failback State Machine
    Value: !GetAtt FailbackStateMachine.Name
    Export:
      Name: !Sub '${AWS::StackName}-FailbackStateMachineName'

  CloudFormationExecutionRoleArn:
    Description: ARN of the CloudFormation execution role used by DR stack updates
    Value: !GetAtt CloudFormationExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-CFNExecutionRoleArn'

