AWSTemplateFormatVersion: 2010-09-09
Description: NAV Accounting Resources

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
      - Label:
          default: Instance Configuration
        Parameters:
          - InstanceKeyName
          - InstanceAMI
      - Label:
          default: Scheduler Configuration
        Parameters:
          - StartScheduleExpression
          - StopScheduleExpression


    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      InstanceAMI:
        default: Instance AMI ID
      InstanceKeyName:
        default: Instance Key Name
      NetworkStackName:
        default: Network Stack Name
      SNSStackName:
        default: SNS Topic Stack Name
      StartScheduleExpression:
        default: Start Schedule CRON Expression
      StopScheduleExpression:
        default: Stop Schedule CRON Expression


Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name)
    Type: String
    MinLength: 3
    MaxLength: 9
    Default: nav
  OrgName:
    Description: The name of the organization
    Type: String
    Default: pchc
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  DirectoryAdminPassword:
    Description: Directory Admin Password
    Type: String
    Default: ''
    NoEcho: true
  InstanceAMI:
    Description: Instance AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-004016e7fca2b2576 #Windows 2016 Base
  InstanceKeyName:
    Description: Instance Key Name
    Type: String
    Default: 'iannis-pchc'
  NetworkStackName:
    Description: The name of the network stack
    Type: String
    Default: pchc-prd-ase1-network
    MinLength: 1
  SNSStackName:
    Description: The name of the SNS stack
    Type: String
    Default: pchc-prd-ase1-sns
    MinLength: 1
  StartScheduleExpression:
    Description: Schedule expression when to start the objects
    Type: String
    Default: cron(0 1 ? * MON-FRI *)
  StopScheduleExpression:
    Description: Schedule expression when to stop the objects
    Type: String
    Default: cron(0 10 ? * MON-FRI *)

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml

Resources:

  ActiveDirectory:
    Type: AWS::DirectoryService::MicrosoftAD
    Properties: 
      CreateAlias: true
      Edition: Standard
      EnableSso: true
      Name: directory.pchc.prod
      Password: !Ref DirectoryAdminPassword
      ShortName: directory
      VpcSettings:
        SubnetIds:
          - Fn::ImportValue:
              !Sub "${NetworkStackName}-PublicSubnetId1"
          - Fn::ImportValue:
              !Sub "${NetworkStackName}-PublicSubnetId2"
        VpcId:
          Fn::ImportValue:
            !Sub "${NetworkStackName}-VpcId"

  DBStack: 
    Type: AWS::CloudFormation::Stack
    Properties: 
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/database.yaml
      Parameters: 
        Name: !Ref Name
        AllocatedStorage: 20 #Gb
        BackupRetentionPeriod: !If [IsProd, 30, 7]
        EnableCPUCreditAlarm: !If [IsProd, true, false]
        EnableEnhancedMonitoring: !If [IsProd, true, false]
        EnablePerformanceInsights: !If [IsProd, true, false]
        EnvName: !Ref EnvName
        Engine: sqlserver-web
        EngineVersion: 14.00.3356.20.v1
        Family: sqlserver-web-14.0
        InstanceType: db.t3.small
        MasterUser: admin
        NetworkStackName: !Ref NetworkStackName
        OrgName: !Ref OrgName
        SNSStackName: !Ref SNSStackName
        StorageEncrypted: true

  NAVInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow RDP from anywhere
      VpcId:
        Fn::ImportValue:
            !Sub "${NetworkStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: 0.0.0.0/0

  RDSSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow NAV Instance to connect to the DB
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - DBStack
          - Outputs.SecurityGroupId
      FromPort:
        Fn::GetAtt:
          - DBStack
          - Outputs.DBInstancePort
      ToPort:
        Fn::GetAtt:
          - DBStack
          - Outputs.DBInstancePort
      SourceSecurityGroupId: !Ref NAVInstanceSecurityGroup

  NAVSSMdocument:
    Type: AWS::SSM::Document
    Properties:
      Content:
        schemaVersion: '1.2'
        description: Join instances to an AWS Directory Service domain.
        parameters:
          directoryId:
            type: String
            description: (Required) The ID of the AWS Directory Service directory.
          directoryName:
            type: String
            description: >-
              (Required) The name of the directory; for example,
              test.example.com
          dnsIpAddresses:
            type: StringList
            default: []
            description: >-
              (Optional) The IP addresses of the DNS servers in the directory.
              Required when DHCP is not configured. Learn more at
              http://docs.aws.amazon.com/directoryservice/latest/simple-ad/join_get_dns_addresses.html
            allowedPattern: >-
              ((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)
        runtimeConfig:
          'aws:domainJoin':
            properties:
              directoryId: '{{ directoryId }}'
              directoryName: '{{ directoryName }}'
              dnsIpAddresses: '{{ dnsIpAddresses }}'

  NAVEC2SSMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM
      RoleName: NAVEC2SSMRole

  NAVInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref NAVEC2SSMRole
      InstanceProfileName: NAVInstanceProfile

  NAVInstance:
    Type: AWS::EC2::Instance
    Properties:
      IamInstanceProfile: !Ref NAVInstanceProfile
      SsmAssociations:
        - DocumentName: !Ref NAVSSMdocument
          AssociationParameters:
            - Key: directoryId
              Value:
                - !Ref ActiveDirectory
            - Key: directoryName
              Value:
                - !Ref ActiveDirectory
            - Key: dnsIpAddresses
              Value:
                - !Select 
                  - '0'
                  - !GetAtt
                    - ActiveDirectory
                    - DnsIpAddresses
                - !Select 
                  - '1'
                  - !GetAtt
                    - ActiveDirectory
                    - DnsIpAddresses
      KeyName: !Ref InstanceKeyName
      ImageId: !Ref InstanceAMI
      InstanceType: t3.xlarge #made Param
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 500
      DisableApiTermination: !If [IsProd, true, false]
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], NAV]]
      SubnetId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-PublicSubnetId1"
      SecurityGroupIds:
        - !GetAtt 
          - NAVInstanceSecurityGroup
          - GroupId

  BackupStack:
    DependsOn: 
      - DBStack
    Type: AWS::CloudFormation::Stack
    Properties: 
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/backup.yaml
      Parameters: 
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        BackupARNList: !Join
          - ','
          - - Fn::GetAtt:
              - DBStack
              - Outputs.DBInstanceARN

  SchedulerStack: 
    DependsOn: 
      - DBStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters: 
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: FALSE
        DatabaseInstanceName:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBInstanceName
        EC2InstanceId: !Ref NAVInstance

Outputs:

  DBInstanceAddress:
    Description: DB Instance Endpoint
    Value: 
      Fn::GetAtt:
        - DBStack
        - Outputs.DBInstanceAddress

  DBInstancePort:
    Description: DB Instance Port
    Value: 
      Fn::GetAtt:
        - DBStack
        - Outputs.DBInstancePort