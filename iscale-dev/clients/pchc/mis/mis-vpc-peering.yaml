AWSTemplateFormatVersion: 2010-09-09
Description: 'MIS VPC Peering for AWS Glue. Need to establish VPC peering from MIS for Glue to access RDS in different VPCs.
  Attach security group to source Databases for AWS Glue to access.'

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Requester VPC
        Parameters:
          - RequesterNetworkStackName
      - Label:
          default: Target Network Stack Name (VPC)
        Parameters:
          - TargetNetworkStackNameDsapp
          - TargetNetworkStackNamePas6
          - TargetNetworkStackNamePaygate
          - TargetNetworkStackNamePddtseod
          - TargetNetworkStackNamePddts
          - TargetNetworkStackNamePesonet
          - TargetNetworkStackNamePesonet20
          - TargetNetworkStackNamePhilpass
          - TargetNetworkStackNameCics
      - Label:
          default: Redshift Stack Names
        Parameters:
          - MisEtlStackName

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      RequesterNetworkStackName:
        default: Requester VPC network stack name
# Network Stack        
      TargetNetworkStackNameDsapp:
        default: DSAPP network stack name
      TargetNetworkStackNamePas6:
        default: PAS6 network stack name
      TargetNetworkStackNamePaygate:
        default: Paygate network stack name
      TargetNetworkStackNamePddtseod:
        default: PDDTS-EOD network stack name
      TargetNetworkStackNamePddts:
        default: PDDTS network stack name
      TargetNetworkStackNamePesonet:
        default: Pesonet network stack name
      TargetNetworkStackNamePesonet20:
        default: Pesonet20 network stack name
      TargetNetworkStackNamePhilpass:
        default: Philpass network stack name
      TargetNetworkStackNameCics:
        default: CICS network stack name
# Resource Stacks
      MisEtlStackName:
        default: MIS stack name

Parameters: 
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    Default: mis # mis-cics = uat
    MinLength: 3
    MaxLength: 20
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: pchc
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
    MaxLength: 12
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  RequesterNetworkStackName:
    Description: The name of the network stack for requester VPC (MIS)
    Type: String
    Default: pchc-prd-ase1-mis-network
    MinLength: 1
# target vpc 1 - DSAPP
  TargetNetworkStackNameDsapp:
    Description: The name of the network stack for target VPC
    Type: String
    Default: pchc-prd-ase1-dsapp-network
    MinLength: 1
# target vpc 2 - PAS6
  TargetNetworkStackNamePas6:
    Description: The name of the network stack for target VPC
    Type: String
    Default: pchc-prd-ase1-pas6-network
    MinLength: 1
# target vpc 3 - PAYGATE
  TargetNetworkStackNamePaygate:
    Description: The name of the network stack for target VPC
    Type: String
    Default: pchc-prd-ase1-paygate-network
    MinLength: 1
# target vpc 4 - PDDTSEOD
  TargetNetworkStackNamePddtseod:
    Description: The name of the network stack for target VPC
    Type: String
    Default: pchc-prd-ase1-pddts-eod-network
    MinLength: 1
# target vpc 5 - PDDTS
  TargetNetworkStackNamePddts:
    Description: The name of the network stack for target VPC
    Type: String
    Default: pchc-prd-ase1-pddts-network
    MinLength: 1
# target vpc 6a - PESONET
  TargetNetworkStackNamePesonet:
    Description: The name of the network stack for target VPC
    Type: String
    Default: pchc-prd-ase1-pesonet-network
    MinLength: 1
# target vpc 6b - PESONET20
  TargetNetworkStackNamePesonet20:
    Description: The name of the network stack for target VPC
    Type: String
    Default: pchc-prd-ase1-pesonet20-network
    MinLength: 1
# target vpc 7 - PHILPASS
  TargetNetworkStackNamePhilpass:
    Description: The name of the network stack for target VPC
    Type: String
    Default: pchc-prd-ase1-philpass-network
    MinLength: 1
# target vpc 8 - CICS
  TargetNetworkStackNameCics:
    Description: The name of the network stack for target VPC
    Type: String
    Default: pchc-prd-ase1-cics-network
    MinLength: 1

# Resource Stacks
  MisEtlStackName:
    Description: The name of the MIS stack name
    Type: String
    Default: pchc-prd-ase1-mis-etl
    MinLength: 1

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml

Resources:

####
# VPC Peering
####

# For CICS UAT Only

  VPCPeeringToCICSNetworkStack:
    Condition: IsTest # test = uat
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/vpc-peering.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName

        # Requester VPC MIS
        RequesterVpcId: !ImportValue
          'Fn::Sub': '${RequesterNetworkStackName}-VpcId'
        RequesterCidr: !ImportValue
          'Fn::Sub': '${RequesterNetworkStackName}-VpcCidrBlock'
        RequesterPublicRouteTable: !ImportValue
          'Fn::Sub': '${RequesterNetworkStackName}-PublicRouteTable'
        RequesterPrivateRouteTable1: !ImportValue
          'Fn::Sub': '${RequesterNetworkStackName}-PrivateRouteTable1'
        RequesterPrivateRouteTable2: !ImportValue
          'Fn::Sub': '${RequesterNetworkStackName}-PrivateRouteTable2'

        # Target VPC CICS
        TargetVpcId: !ImportValue
          'Fn::Sub': '${TargetNetworkStackNameCics}-VpcId'
        TargetCidr: !ImportValue
          'Fn::Sub': '${TargetNetworkStackNameCics}-VpcCidrBlock'
        # TargetPublicRouteTable: !ImportValue
        #   'Fn::Sub': '${TargetNetworkStackNameCics}-PublicRouteTable'
        TargetInternalRouteTable1: !ImportValue
          'Fn::Sub': '${TargetNetworkStackNameCics}-InternalRouteTable1'
        TargetPrivateRouteTable1: !ImportValue
          'Fn::Sub': '${TargetNetworkStackNameCics}-PrivateRouteTable1'
        TargetPrivateRouteTable2: !ImportValue
          'Fn::Sub': '${TargetNetworkStackNameCics}-PrivateRouteTable2'
        TargetPrivateRouteTable3: !ImportValue
          'Fn::Sub': '${TargetNetworkStackNameCics}-PrivateRouteTable3'

  AllowRedshifToCicsUAT:
    Condition: IsTest # test = uat
    Description: Allow MIS-Redshift secgroup
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      Description: Allow MIS-Redshift secgroup
      GroupId: sg-0b5c513e970445c58 # cics uat db secgroup
      IpProtocol: TCP
      FromPort: 1433
      ToPort: 1433
      SourceSecurityGroupId: !ImportValue
        'Fn::Sub': '${MisEtlStackName}-RedshiftSecurityGroupId'

##############################################
## PRODUCTION SECTION

###
# VPC Peering 1
# MIS - DSAPP
###

  VPCPeeringToDsapp:
    Condition: IsProd
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/vpc-peering.yaml
      Parameters:
        Name: mis-dsapp
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName

        # Requester VPC MIS
        RequesterVpcId: !ImportValue
          'Fn::Sub': '${RequesterNetworkStackName}-VpcId'
        RequesterCidr: !ImportValue
          'Fn::Sub': '${RequesterNetworkStackName}-VpcCidrBlock'
        RequesterPrivateRouteTable1: !ImportValue
          'Fn::Sub': '${RequesterNetworkStackName}-PrivateRouteTable1'
        RequesterPrivateRouteTable2: !ImportValue
          'Fn::Sub': '${RequesterNetworkStackName}-PrivateRouteTable2'

        # Target VPC DSAPP
        TargetVpcId: !ImportValue
          'Fn::Sub': '${TargetNetworkStackNameDsapp}-VpcId'
        TargetCidr: !ImportValue
          'Fn::Sub': '${TargetNetworkStackNameDsapp}-VpcCidrBlock'
        TargetPublicRouteTable: !ImportValue
          'Fn::Sub': '${TargetNetworkStackNameDsapp}-PublicRouteTable'
        TargetPrivateRouteTable1: !ImportValue
          'Fn::Sub': '${TargetNetworkStackNameDsapp}-PrivateRouteTable1'
        TargetPrivateRouteTable2: !ImportValue
          'Fn::Sub': '${TargetNetworkStackNameDsapp}-PrivateRouteTable2'
        TargetInternalRouteTable1: !ImportValue
          'Fn::Sub': '${TargetNetworkStackNameDsapp}-InternalRouteTable1'

  AllowRedshifToDsapp:
    Condition: IsProd
    Description: Allow MIS-Redshift secgroup
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      Description: Allow MIS-Redshift secgroup
      GroupId: sg-0e4d827d7e29b46d5 # dsapp db secgroup
      IpProtocol: TCP
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !ImportValue
        'Fn::Sub': '${MisEtlStackName}-RedshiftSecurityGroupId'

  AllowSelfReferenceDsapp:
    Condition: IsProd
    Description: Self referencing secgroup
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      Description: Self referencing secgroup
      GroupId: sg-0e4d827d7e29b46d5 # dsapp db secgroup
      IpProtocol: TCP
      FromPort: 0
      ToPort: 65535
      SourceSecurityGroupId: sg-0e4d827d7e29b46d5

