AWSTemplateFormatVersion: 2010-09-09
Description: MIS Resources and Lambda serverless permissions

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
          - DeletionProtection
      - Label:
          default: Load Balancer Configuration
        Parameters:
          - ClientDomainName
          - LoadBalancerCertificateArn
          - LoadBalancerHostName
      - Label:
          default: Instance Configuration
        Parameters:
          - InstanceKeyName
          - InstanceAMI
          - InstanceType
      - Label:
          default: Scheduler Configuration
        Parameters:
          - StartScheduleExpression
          - StopScheduleExpression

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      DeletionProtection:
        default: Protect core items against deletion
      InstanceAMI:
        default: Instance AMI ID
      InstanceKeyName:
        default: Instance Key Name
      InstanceType:
        default: Instance Type
      LoadBalancerCertificateArn:
        default: Load Balancer SSL Certificate ARN
      LoadBalancerHostName:
        default: Load Balancer Host Name
      NetworkStackName:
        default: Network Stack Name
      SNSStackName:
        default: SNS Topic Stack Name
      ClientDomainName:
        default: Domain Name
      StartScheduleExpression:
        default: Start Schedule CRON Expression
      StopScheduleExpression:
        default: Stop Schedule CRON Expression

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name)
    Type: String
    MinLength: 3
    MaxLength: 12
    Default: mis
  OrgName:
    Description: The name of the organization
    Type: String
    Default: pchc
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production # Test for uat
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  ClientDomainName:
    Description: The client's domain name (e.g. example.com, iscale-software.com)
    Type: String
    AllowedPattern: ^[a-z0-9]+([\-\.]{1}[a-z0-9]+)*\.[a-z]{2,7}$
    Default: pchc.com.ph # pchcdev.com for uat
    MinLength: 1
  DeletionProtection:
    Description: Set to true to enable (valid only in Production mode)
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  InstanceAMI:
    Description: Instance AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-01cb3912348e56e11 
  InstanceKeyName:
    Description: Instance Key Name
    Type: String
    Default: ''
  InstanceType:
    Description: Type of instance for app server
    Type: String
    Default: t3.medium
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge
  LoadBalancerHostName:
    Description: (Optional) Custom Hostname for load balancer URL
    Type: String
    Default: ''
    MaxLength: 12
  LoadBalancerCertificateArn:
    Description: SSL Certificate for the ELB
    Type: String
    Default: arn:aws:acm:ap-southeast-1:470455329885:certificate/9f713d5d-cb7c-4e8e-acc2-46862d610ec8
  NetworkStackName:
    Description: The name of the network stack
    Type: String
    Default: pchc-dev-uw2-mis-network
    MinLength: 1
  SNSStackName:
    Description: The name of the SNS stack
    Type: String
    Default: iscale-dev-dev-uw2-sns
    MinLength: 1
  StartScheduleExpression:
    Description: Schedule expression when to start the objects
    Type: String
    Default: cron(0 0 ? * MON-FRI *)
  StopScheduleExpression:
    Description: Schedule expression when to stop the objects
    Type: String
    Default: cron(0 10 ? * MON-FRI *)

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasKeyName: !Not [!Equals [!Ref InstanceKeyName, '']]

Resources:

##
# MIS Application Resources
##

  ELBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/loadbalancer.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        CertificateArn: !Ref LoadBalancerCertificateArn
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName

##
# Database
##

  DBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/database.yaml
      Parameters:
        Name: !Ref Name
        DatabaseName: !Join ['',[!Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], db]]
        AllocatedStorage: !If [IsProd, 50, 20]
        BackupRetentionPeriod: !If [IsProd, 30, 7]
        DeletionProtection: !If [IsProd, !Ref DeletionProtection, false]
        EnableEnhancedMonitoring: !If [IsProd, true, false]
        EnablePerformanceInsights: !If [IsProd, true, false]
        EnvName: !Ref EnvName
        Engine: mysql
        EngineVersion: 8.0.35
        Family: mysql8.0
        InstanceType: !If [IsProd, db.t4g.large, db.t4g.micro]
        MasterUser: root
        MultiAz: !If [IsProd, true, false]
        NetworkStackName: !Ref NetworkStackName
        OrgName: !Ref OrgName
        SNSStackName: !Ref SNSStackName
        StorageEncrypted: true
        StorageType: !If [IsProd, gp3, gp2] # more IOPS

  AllowJumpHostIntoDB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from jump host
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - DBStack
          - Outputs.SecurityGroupId
      FromPort:
        Fn::GetAtt:
          - DBStack
          - Outputs.DBInstancePort
      ToPort:
        Fn::GetAtt:
          - DBStack
          - Outputs.DBInstancePort
      SourceSecurityGroupId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-JumpHostSecurityGroupId'

##
# Codedeploy
##

  DeployStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/deployment.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName

##
# Server stack - portal
##

  ServerStack:
    DependsOn:
      - DBStack
      - DeployStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/appserver-basic2.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        ClientDomainName: !Ref ClientDomainName
        DatabaseEndpoint:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBInstanceAddress
        DatabasePort:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBInstancePort
        DatabaseSecurityGroupId:
          Fn::GetAtt:
            - DBStack
            - Outputs.SecurityGroupId
        InstanceAMI: !Ref InstanceAMI
        InstanceKeyName: !If [HasKeyName, !Ref InstanceKeyName, !Ref 'AWS::NoValue']
        InstancePort: 80
        InstanceSubnet: Private
        InstanceType: !Ref InstanceType
        LoadBalancerHostName: !Ref LoadBalancerHostName
        LoadBalancerPriority: 100
        LoadBalancerStackName: !Select [ 1, !Split [ '/', !Ref ELBStack]]
        NetworkStackName: !Ref NetworkStackName
        SharedSecretId:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBSecretManagerKeyId
        SNSStackName: !Ref SNSStackName
        UseFriendlyNames: FALSE
        LaunchTemplate: True

  # AllowAppServerToReportsDB:
  #   Condition: IsDev
  #   DependsOn:
  #     - ReportsDBStack
  #     - ServerStack
  #   Type: AWS::EC2::SecurityGroupIngress
  #   Properties:
  #     Description: Allow connection from jump host
  #     IpProtocol: TCP
  #     GroupId:
  #       Fn::GetAtt:
  #         - ReportsDBStack
  #         - Outputs.SecurityGroupId
  #     FromPort:
  #       Fn::GetAtt:
  #         - ReportsDBStack
  #         - Outputs.DBInstancePort
  #     ToPort:
  #       Fn::GetAtt:
  #         - ReportsDBStack
  #         - Outputs.DBInstancePort
  #     SourceSecurityGroupId:
  #       Fn::GetAtt:
  #         - ServerStack
  #         - Outputs.AppServerSecurityGroup

  AllowJumpHostIntoServer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from jump host
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
            - ServerStack
            - Outputs.AppServerSecurityGroup
      FromPort: 22
      ToPort: 22
      SourceSecurityGroupId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-JumpHostSecurityGroupId'

  SchedulerStack:
    DependsOn:
      - DBStack
      - ServerStack
    Condition: IsNotProd
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: FALSE
        CodeDeployApplicationName:
          Fn::GetAtt:
            - DeployStack
            - Outputs.CodeDeployApplicationName
        CodeDeployDeploymentGroupName:
          Fn::GetAtt:
            - DeployStack
            - Outputs.CodeDeployDeploymentGroupName
        DatabaseInstanceName:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBInstanceName

# Attach Policy to Appserver IAM Role (appserver stack)
# EC2 need permission to invoke lambdas created by serverless yaml
# EC2 need permission to create/delete scheduler that will trigger lambda/step functions

  SchedulerAndLambdaPolicy:
    DependsOn:
      - ServerStack
    Description: Allow MIS app servers to create/delete cloudwatch event schedule
    Type: AWS::IAM::Policy
    Properties:
      Roles:
        - Fn::GetAtt:
            - ServerStack
            - Outputs.AppServerIamRole
      PolicyName: SchedulerAndLambdaPolicy # policy to create scheduler and invoker lambda
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: "SchedulerPolicy"
            Effect: Allow
            Action:
              - scheduler:* # too permissive, adjust scheduler names
              - iam:PassRole
            Resource: "*"
          - Sid: "LambdaPolicy"
            Effect: Allow
            Action:
              - lambda:InvokeFunctionUrl
              - lambda:InvokeFunction
            Resource: !Join ['', ['arn:aws:lambda:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':function:', pchc-mis-lambda*]]
          - Effect: Allow
            Action:
              - states:StartExecution
            Resource: "*" # need to update naming of serverless step functions

# create new role for eventbridge scheduler, this role will be attached by EC2 to schedulers
# eventbridge scheduler needs role attached, permission to invoke lambda and step functions created by serverless.yml

  EventSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: scheduler.amazonaws.com
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref 'AWS::AccountId'
      Policies:
        - PolicyName: InvokeLambdaMIS
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Join ['', ['arn:aws:lambda:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':function:', pchc-mis-lambda*]]
        - PolicyName: InvokeStepFunctions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: "*" # need to update naming of serverless step functions

# MIS Lambda Section (for serverless)

  EnvBucket:
    Type: AWS::S3::Bucket
    Description: Bucket where env file is stored
    DeletionPolicy: Retain
    Properties:
      BucketName: !If
        - IsProd
        - !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, envbucket]]
        - Ref: 'AWS::NoValue' #let the system choose a bucket name
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 3
          Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

# MIS Lambda Bref Deployment User Group
# permissions to deploy lambda using serverless.yml

  LambdaDeploymentUserGroup:
    Type: AWS::IAM::Group
    Properties:
      Policies:
        - PolicyName: S3GetEnvAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Join ['',[!GetAtt EnvBucket.Arn, "/*"]]
        - PolicyName: GetSecrets
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  Fn::GetAtt:
                    - DBStack
                    - Outputs.DBSecretManager
        - PolicyName: BrefPolicy1
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CancelUpdateStack
                  - cloudformation:ContinueUpdateRollback
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:Describe*
                  - cloudformation:EstimateTemplateCost
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:Get*
                  - cloudformation:List*
                  - cloudformation:UpdateStack
                  - cloudformation:UpdateTerminationProtection
                Resource: !Join ['', ['arn:aws:cloudformation:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':stack/', pchc-mis-lambda*]]
              - Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - iam:CreateRole
                  - iam:PassRole
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:FilterLogEvents
                  - logs:GetLogEvents
                  - logs:PutSubscriptionFilter
                  - logs:TagResource
                  - logs:DeleteSubscriptionFilter
                  - s3:CreateBucket
                  - s3:ListAllMyBuckets
                  - iam:TagRole
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:DeleteBucket
                  - s3:DeleteBucketPolicy
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                  - s3:PutBucketNotification
                  - s3:PutBucketPolicy
                  - s3:PutBucketTagging
                  - s3:PutBucketWebsite
                  - s3:PutEncryptionConfiguration
                  - s3:PutObject
                Resource: !Join ['', ['arn:aws:s3:::', pchc-mis-lambda*]]
              - Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:UpdateAssumeRolePolicy
                Resource: !Join ['', ['arn:aws:iam::', !Ref 'AWS::AccountId', ':role/', pchc-mis-lambda*]]
              - Effect: Allow
                Action:
                  - scheduler:*
                Resource: !Join ['', ['arn:aws:scheduler:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':schedule/default/', pchc-mis-lambda*]]
              # - Effect: Allow
              #   Action:
              #     - events:* # ?????? 
              #   Resource: !Join ['', ['arn:aws:events:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':rule/', pchc-mis-lambda*]]
              - Effect: Allow
                Action:
                  - lambda:*
                Resource: !Join ['', ['arn:aws:lambda:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':function:', pchc-mis-lambda*]]
              - Effect: Allow
                Action:
                  - states:CreateStateMachine
                  - states:DeleteStateMachine
                  - states:TagResource
                  - states:DescribeStateMachine
                  - states:UpdateStateMachine
                Resource: "*" # need to update naming of serverless step functions

# secgroup for lambda
  MisLambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [ '-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], lambda] ]
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, lambda]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

  AllowMisLambdaIntoMisDB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from MIS Lambda
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - DBStack
          - Outputs.SecurityGroupId
      FromPort:
        Fn::GetAtt:
          - DBStack
          - Outputs.DBInstancePort
      ToPort:
        Fn::GetAtt:
          - DBStack
          - Outputs.DBInstancePort
      SourceSecurityGroupId: !GetAtt MisLambdaSecurityGroup.GroupId

# Backup Section

  BackupStack:
    Condition: IsProd
    DependsOn:
      - DBStack
      - ServerStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/backup.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        BackupARNList: !Join
          - ','
          - - Fn::GetAtt:
              - DBStack
              - Outputs.DBInstanceARN
            - Fn::GetAtt:
              - ServerStack
              - Outputs.AppServerEFSArn
        BackupTime: !If [IsProd, !Ref 'AWS::NoValue', 1] #Default backup time else 1AM UTC for dev
        DailyExpiration: 60 #60 days
        WeeklyExpiration: 180 #6 months but requirement is 4 weeks
        MonthlyExpiration: 3650 # 10 years

