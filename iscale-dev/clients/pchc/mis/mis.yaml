Outputs:

  DeploymentUserGroup:
    Description: Add the BitBucket user into this group
    Value:
      Fn::GetAtt:
        - DeployStack
        - Outputs.DeploymentUserGroup

  LambdaDeploymentUserGroup:
    Description: Add the BitBucket user into this group
    Value: !Ref LambdaDeploymentUserGroup

  MisLambdaSecurityGroupId:
    Description: MIS Lambda Secgroup ID
    Value: !GetAtt MisLambdaSecurityGroup.GroupId
    Export: 
      Name: !Sub ${AWS::StackName}-MisLambdaSecurityGroupId

  MisServerStackSecurityGroupId:
    Description: MIS Serverstack Secgroup ID
    Value: 
      Fn::GetAtt:
        - ServerStack
        - Outputs.AppServerSecurityGroup
    Export: 
      Name: !Sub ${AWS::StackName}-MisServerStackSecurityGroupId
