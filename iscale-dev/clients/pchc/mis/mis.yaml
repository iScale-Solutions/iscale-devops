Outputs:

  DeploymentUserGroup:
    Description: Add the BitBucket user into this group
    Value:
      Fn::GetAtt:
        - DeployStack
        - Outputs.DeploymentUserGroup

  LambdaDeploymentUserGroup:
    Condition: IsDeployPaidResources
    Description: Add the BitBucket user into this group
    Value: !Ref LambdaDeploymentUserGroup

  MisLambdaSecurityGroupId:
    Description: MIS Lambda Secgroup ID
    Value: !GetAtt MisLambdaSecurityGroup.GroupId
    Export: 
      Name: !Sub ${AWS::StackName}-MisLambdaSecurityGroupId

  MisServerStackSecurityGroupId:
    Description: MIS Serverstack Secgroup ID
    Value: 
      Fn::GetAtt:
        - ServerStack
        - Outputs.AppServerSecurityGroup
    Export: 
      Name: !Sub ${AWS::StackName}-MisServerStackSecurityGroupId
    
  MisServerStackS3BucketArn:
    Description: MIS Serverstack S3 Bucket ARN
    Value: 
      Fn::GetAtt:
        - ServerStack
        - Outputs.AppServerS3BucketArn
    Export: 
      Name: !Sub ${AWS::StackName}-MisServerStackS3BucketArn

  MisServerStackS3BucketName:
    Description: MIS Serverstack S3 Bucket Name
    Value: 
      Fn::GetAtt:
        - ServerStack
        - Outputs.AppServerS3BucketName
    Export: 
      Name: !Sub ${AWS::StackName}-MisServerStackS3BucketName

  DRDBSecretArn:
    Condition: IsDR
    Description: ARN of the DR Secrets Manager secret — wire into secrets-sync Lambda
    Value: !Ref DRDBSecret
    Export:
      Name: !Sub '${AWS::StackName}-DRDBSecretArn'

  DBStandbySubnetGroup:
    Condition: IsDR
    Description: Pre-deployed DB subnet group for PITR restore
    Value: !Ref DBStandbySubnetGroup
    Export:
      Name: !Sub '${AWS::StackName}-DBStandbySubnetGroup'

  DBStandbySecurityGroup:
    Condition: IsDR
    Description: Pre-deployed DB security group for PITR restore
    Value: !GetAtt DBStandbySecurityGroup.GroupId
    Export:
      Name: !Sub '${AWS::StackName}-DBStandbySecurityGroupId'