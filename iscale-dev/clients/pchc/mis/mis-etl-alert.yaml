AWSTemplateFormatVersion: 2010-09-09
Description: MIS AWS Glue ETL jobs email alert.

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - OrgName
          - EnvName
          - DomainName
          - PortalStackName
          - MisEtlStackName
          - MisStackName
      - Label:
          default: Email Configuration
        Parameters:
          - Email
          - SESRecipients
      - Label:
          default: Lambda Configuration
        Parameters:
          - PythonRuntimeVersion

    ParameterLabels:
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      DomainName:
        default: Source Email Domain Name
      Email:
        default: Recipient Email Address
      PortalStackName:
        default: MIS Portal Stack Name
      SESRecipients:
        default: SES Recipient Emails
      PythonRuntimeVersion: 
        default: Python Lambda Runtime Version
      MisEtlStackName:
        default: MIS ETL Stack Name
      MisStackName:
        default: MIS Portal Stack Name (for S3 bucket access)

Parameters:
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
    MaxLength: 11
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Development
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  Email:
    Description: The email address where to send the notifications.
    Type: String
  DomainName:
    Description: The domain name for the source email address.
    Type: String
    Default: pchcdev.com
  SESRecipients:
    Description: Comma-separated list of verified SES email addresses to receive notifications.
    Type: String
  PortalStackName:
    Description: The name of the MIS Portal CloudFormation stack.
    Type: String
    Default: pchc-test-uw2-mis
  MisEtlStackName:
    Description: The name of the MIS ETL CloudFormation stack.
    Type: String
    Default: pchc-test-uw2-mis-etl
  MisStackName:
    Description: The name of the MIS Portal CloudFormation stack (for S3 bucket access).
    Type: String
    Default: pchc-test-uw2-mis
  PythonRuntimeVersion:
    Description: The Python runtime version for Lambda functions.
    Type: String
    Default: python3.12
    AllowedValues:
      - python3.11
      - python3.12

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml

Resources:
  SnsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: !Join [' ',[!Ref OrgName, !Ref EnvName, !Ref 'AWS::Region', SNS Topic]]
      TopicName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], elt-job]]

  EmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !Ref Email
      Protocol: email
      TopicArn: !Ref SnsTopic

  EventBridgeSNSPermission:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref SnsTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: "events.amazonaws.com"
            Action: "sns:Publish"
            Resource: !Ref SnsTopic

  EtlJobEventRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern: >-
        {
          "$or": [{
            "source": ["aws.glue"],
            "detail-type": ["Glue Job State Change"],
            "detail": {
              "jobName": [{
                "wildcard": "*_to_redshift*"
              }]
            }
          }, {
            "source": ["aws.glue"],
            "detail-type": ["Glue Job Run Status"],
            "detail": {
              "jobName": [{
                "wildcard": "*_to_redshift*"
              }]
            }
          }]
        }
      State: ENABLED
      EventBusName: default
      Targets:
        # - Id: EtlJobStatusNotification #removed since we'll just use the SES + Lambda
        #   Arn: !GetAtt SnsTopic.TopicArn
        - Id: GlueJobLambdaTarget
          Arn: !GetAtt GlueJobEmailLambda.Arn
        - Id: GlueJobPortalLambdaTarget
          Arn: !GetAtt GlueJobPortalLambda.Arn
        - Id: Pesonet20PostGlueUpsertLambdaTarget
          Arn: 
            Fn::ImportValue:
              !Sub '${MisEtlStackName}-Pesonet20PostGlueUpsertLambdaArn'

  GlueLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: "GlueLambdaSESPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "ses:SendEmail"
                  - "ses:SendRawEmail"
                Resource: "*"
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: "arn:aws:logs:*:*:*"

  GlueJobEmailLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], 'etl-email-notification']]
      Handler: index.lambda_handler
      Runtime: !Ref PythonRuntimeVersion
      Role: !GetAtt GlueLambdaExecutionRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.mime.application import MIMEApplication

          ses_client = boto3.client('ses')

          def lambda_handler(event, context):
              detail = event.get('detail', {})
              job_name = detail.get('jobName', 'Unknown Job')
              state = detail.get('state', 'Unknown')
              job_run_id = detail.get('jobRunId', 'Unknown')
              message = detail.get('message', '')
              env_name = os.environ.get('ENV_NAME', 'UNKNOWN').upper()

              # Color coding for email content
              status_color = "#28a745" if state == "SUCCEEDED" else "#dc3545"
              status_label = "SUCCESS" if state == "SUCCEEDED" else "FAILED"

              html_body = f"""
              <html>
              <body style="font-family:Arial,sans-serif; line-height:1.5;">
                  <h2>Glue Job Notification</h2>
                  <table style="border-collapse: collapse; width: 100%;">
                      <tr>
                          <td style="padding: 8px; font-weight: bold;">Job Name:</td>
                          <td style="padding: 8px;">{job_name}</td>
                      </tr>
                      <tr>
                          <td style="padding: 8px; font-weight: bold;">Job Run ID:</td>
                          <td style="padding: 8px;">{job_run_id}</td>
                      </tr>
                      <tr>
                          <td style="padding: 8px; font-weight: bold;">State:</td>
                          <td style="padding: 8px; color:{status_color}; font-weight: bold;">{state}</td>
                      </tr>
                      <tr>
                          <td style="padding: 8px; font-weight: bold;">Message:</td>
                          <td style="padding: 8px;">{message}</td>
                      </tr>
                  </table>
                  <p style="margin-top:20px; color:#555;">This is an automated notification from AWS Glue.</p>
              </body>
              </html>
              """
              dest_emails = [email.strip() for email in os.environ['DEST_EMAIL'].split(',')]

              for recipient in dest_emails:
                # Create a fresh MIME message
                msg = MIMEMultipart('mixed')
                msg['Subject'] = f"[MIS][{env_name}][{status_label}] Glue Job {job_name} - RunID {job_run_id}"
                msg['From'] = os.environ['SOURCE_EMAIL']
                msg['To'] = recipient  # MUST be a string, not a list

                # Add priority headers if FAILED
                if state == "FAILED":
                    msg['X-Priority'] = '1'
                    msg['Importance'] = 'High'
                    msg['Priority'] = 'urgent'

                # Attach HTML body
                msg.attach(MIMEText(html_body, 'html'))

                # Attach EventBridge JSON
                json_attachment = MIMEApplication(json.dumps(event, indent=2).encode('utf-8'))
                json_attachment.add_header(
                    'Content-Disposition',
                    'attachment',
                    filename=f'GlueJobEvent_{job_run_id}.json'
                )
                msg.attach(json_attachment)

                # Send via SES
                ses_client.send_raw_email(
                    Source=os.environ['SOURCE_EMAIL'],
                    Destinations=[recipient],  # MUST be a list of one string
                    RawMessage={'Data': msg.as_string()}
                )
                print(f"Email sent to: {recipient} successfully")

              return {"status": "sent"}

      Environment:
        Variables:
          SOURCE_EMAIL: !Sub "no-reply@${DomainName}"
          DEST_EMAIL: !Ref SESRecipients
          ENV_NAME: !Ref EnvName

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GlueJobEmailLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EtlJobEventRule.Arn

# ===========
# Glue Job Portal section
# ===========
  GlueJobPortalLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: "GlueJobPortalPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Glue permissions
              - Effect: Allow
                Action:
                  - "glue:GetJobs"
                  - "glue:GetJobRuns"
                Resource: "*"
              
              # S3 permissions
              - Effect: Allow
                Action:
                  - "s3:PutObject"
                  - "s3:PutObjectAcl"
                Resource: 
                  # - "arn:aws:s3:::pchc-test-uw2-mis-serverstack-e74we2q-datas3bucket-r4ncgijsuzn8/glue_history/*"
                  - !Join ['', [Fn::ImportValue: 
                                  !Sub '${MisStackName}-MisServerStackS3BucketArn', '/glue_history/*']]
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: "arn:aws:logs:*:*:*"


  GlueJobPortalLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], 'etl-job-portal']]
      Handler: index.lambda_handler
      Runtime: !Ref PythonRuntimeVersion
      Role: !GetAtt GlueJobPortalLambdaExecutionRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime

          glue = boto3.client('glue')
          s3 = boto3.client('s3')
          REGION = os.environ['REGION']
          OUTPUT_BUCKET = os.environ['OUTPUT_BUCKET']

          def lambda_handler(event, context):
              try:
                  # Step 1: Get all jobs
                  jobs = glue.get_jobs()['Jobs']
                  target_jobs = [j for j in jobs if 'to_redshift' in j['Name']]

                  job_histories = []

                  # Step 2: Get runs per job
                  for job in target_jobs:
                      runs_response = glue.get_job_runs(JobName=job['Name'], MaxResults=100)
                      runs = runs_response.get('JobRuns', [])
                      runs.sort(key=lambda x: x['StartedOn'], reverse=True)
                      job_histories.append({
                          'jobName': job['Name'],
                          'runs': [
                              {
                                  'id': r['Id'],
                                  'status': r['JobRunState'],
                                  'startedOn': r['StartedOn'].isoformat(),
                                  'completedOn': r.get('CompletedOn').isoformat() if r.get('CompletedOn') else None,
                                  'attempt': r.get('Attempt'),
                                  'executionTime': r.get('ExecutionTime'),  # in seconds
                                  'errorMessage': r.get('ErrorMessage'),
                                  'triggerName': r.get('TriggerName'),
                                  'startedBy': r.get('StartedBy')
                              } for r in runs
                          ]
                      })
                  
                  # Step 3: Prepare S3 object key
                  s3_key = "glue_history/glue_job_history.json"

                  # Step 4: Save JSON to S3
                  s3.put_object(
                      Bucket=OUTPUT_BUCKET,
                      Key=s3_key,
                      Body=json.dumps(job_histories, indent=2)
                  )

                  print(f"Successfully uploaded job history to s3://{OUTPUT_BUCKET}/{s3_key}")
                  return {'status': 'success', 's3_key': s3_key}

              except Exception as e:
                  print('Error:', e)
                  return {'status': 'error', 'message': str(e)}

      Environment:
        Variables:
          REGION: !Ref 'AWS::Region'
          OUTPUT_BUCKET: 
            Fn::ImportValue:
              !Sub '${PortalStackName}-MisServerStackS3BucketName'
  
  GlueJobPortalLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt GlueJobPortalLambda.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EtlJobEventRule.Arn

  GlueJobStartPortalLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], 'etl-job-portal-start']]
      Handler: index.lambda_handler
      Runtime: !Ref PythonRuntimeVersion
      Role: !GetAtt GlueJobStartPortalLambdaExecutionRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import boto3
          import os

          glue = boto3.client('glue')

          def lambda_handler(event, context):
              # enables support for both direct invocation and API Gateway proxy integration
              body = event.get('body')
              if isinstance(body, str):
                  body = json.loads(body)
              elif body is None:
                  body = event

              job_name = body.get('jobName')
              arguments = body.get('arguments', {})

              if not job_name:
                  return {
                      "statusCode": 400,
                      "body": json.dumps({"message": "jobName is required"})
                  }

              try:
                  response = glue.start_job_run(
                      JobName=job_name,
                      Arguments=arguments
                  )

                  return {
                      "statusCode": 200,
                      "body": json.dumps({
                          "message": "Glue job started",
                          "jobName": job_name,
                          "jobRunId": response["JobRunId"]
                      })
                  }

              except glue.exceptions.EntityNotFoundException:
                  return {
                      "statusCode": 404,
                      "body": json.dumps({"message": f"Glue job '{job_name}' not found"})
                  }

              except Exception as e:
                  return {
                      "statusCode": 500,
                      "body": json.dumps({"message": str(e)})
                  }
  GlueJobStartPortalLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: "AllowStartGlueJobOnly"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Glue permissions
              - Effect: Allow
                Action:
                  - "glue:StartJobRun"
                Resource: 
                - !Join ['', ['arn:aws:glue:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':job/*to_redshift*']]
                - !Join ['', ['arn:aws:glue:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':job/Test Job']]           
              # CloudWatch logs
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: "arn:aws:logs:*:*:*"

  Pesonet20PostGlueUpsertLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::ImportValue:
          !Sub '${MisEtlStackName}-Pesonet20PostGlueUpsertLambdaArn'
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EtlJobEventRule.Arn

  PesonetSSMEventRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source:
          - aws.ssm
        detail-type:
          - EC2 Command Status-change Notification
        detail:
          status:
            - Success
            - Failed
          document-name:
            - Fn::ImportValue:
                !Sub '${MisEtlStackName}-Pesonet20PostGlueUpsertSsmDocumentName'
      State: ENABLED
      EventBusName: default
      Targets:
        - Id: SSMNotificationLambdaTarget
          Arn: !GetAtt PesonetRefreshMvseEmailLambda.Arn

  PesonetSSMEventRuleLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PesonetRefreshMvseEmailLambda.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PesonetSSMEventRule.Arn
  

  PesonetRefreshMvseEmailLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], 'etl-pesonet-refresh-mvs-notification']]
      Handler: index.lambda_handler
      Runtime: !Ref PythonRuntimeVersion
      Role: !GetAtt PesonetRefreshMvsLambdaExecutionRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.mime.application import MIMEApplication

          ses_client = boto3.client('ses')

          TARGET_DOCUMENT_NAME = os.environ.get("TARGET_DOCUMENT_NAME", "")
          TARGET_INSTANCE_ID = os.environ.get("INSTANCE_ID", "")

          def lambda_handler(event, context):
              detail = event.get('detail', {})

              document_name = detail.get('document-name', '')
              instance_id = detail.get('instance-id', '')
              command_id = detail.get('command-id', 'Unknown')
              status = detail.get('status', 'Unknown')
              env_name = os.environ.get('ENV_NAME', 'UNKNOWN').upper()

              # Only process events from the specific document and instance
              if document_name != TARGET_DOCUMENT_NAME:
                  print(f"Ignoring SSM event for document: {document_name}")
                  return {"status": "ignored"}

              if TARGET_INSTANCE_ID and instance_id != TARGET_INSTANCE_ID:
                  print(f"Ignoring SSM event for instance: {instance_id}")
                  return {"status": "ignored"}

              status_color = "#28a745" if status == "Success" else "#dc3545"
              status_label = "SUCCESS" if status == "Success" else "FAILED"

              html_body = f"""
              <html>
              <body style="font-family:Arial,sans-serif; line-height:1.5;">
                  <h2>SSM Run Command Notification</h2>
                  <table style="border-collapse: collapse; width: 100%;">
                      <tr>
                          <td style="padding: 8px; font-weight: bold;">Document Name:</td>
                          <td style="padding: 8px;">{document_name}</td>
                      </tr>
                      <tr>
                          <td style="padding: 8px; font-weight: bold;">Command ID:</td>
                          <td style="padding: 8px;">{command_id}</td>
                      </tr>
                      <tr>
                          <td style="padding: 8px; font-weight: bold;">Environment:</td>
                          <td style="padding: 8px;">{env_name}</td>
                      </tr>
                      <tr>
                          <td style="padding: 8px; font-weight: bold;">Status:</td>
                          <td style="padding: 8px; color:{status_color}; font-weight: bold;">{status}</td>
                      </tr>
                  </table>
                  <p style="margin-top:20px; color:#555;">This is an automated notification from AWS SSM Run Command.</p>
              </body>
              </html>
              """

              dest_emails = [email.strip() for email in os.environ['DEST_EMAIL'].split(',')]

              for recipient in dest_emails:
                  msg = MIMEMultipart('mixed')
                  msg['Subject'] = f"[MIS][{env_name}][{status_label}] SSM {document_name} - {command_id}"
                  msg['From'] = os.environ['SOURCE_EMAIL']
                  msg['To'] = recipient

                  if status != "Success":
                      msg['X-Priority'] = '1'
                      msg['Importance'] = 'High'
                      msg['Priority'] = 'urgent'

                  msg.attach(MIMEText(html_body, 'html'))

                  json_attachment = MIMEApplication(json.dumps(event, indent=2).encode('utf-8'))
                  json_attachment.add_header(
                      'Content-Disposition',
                      'attachment',
                      filename=f'SSMCommandEvent_{command_id}.json'
                  )
                  msg.attach(json_attachment)

                  ses_client.send_raw_email(
                      Source=os.environ['SOURCE_EMAIL'],
                      Destinations=[recipient],
                      RawMessage={'Data': msg.as_string()}
                  )
                  print(f"Email sent to: {recipient} successfully")

              return {"status": "sent"}

      Environment:
        Variables:
          TARGET_DOCUMENT_NAME: 
            Fn::ImportValue:
                !Sub '${MisEtlStackName}-Pesonet20PostGlueUpsertSsmDocumentName'
          TARGET_INSTANCE_ID:
            Fn::ImportValue:
                !Sub '${MisEtlStackName}-ReportsQueriesInstanceId'
          ENV_NAME: !Ref EnvName
          SOURCE_EMAIL: !Sub "no-reply@${DomainName}"
          DEST_EMAIL: !Ref SESRecipients

  PesonetRefreshMvsLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: "PesonetRefreshSESPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "ses:SendEmail"
                  - "ses:SendRawEmail"
                Resource: "*"
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: "arn:aws:logs:*:*:*"

