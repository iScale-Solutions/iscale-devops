AWSTemplateFormatVersion: 2010-09-09
Description: MIS ETL Resources (S3, Redshift, Glue IAM Role)

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
          - MisStackName
          - DeletionProtection
      - Label:
          default: Redshift Cluster Configuration
        Parameters:
          - NodeType
      - Label:
          default: Scheduler Configuration
        Parameters:
          - StartScheduleExpression
          - StopScheduleExpression
      - Label:
          default: Pesonet20 Post Glue Upsert Configuration
        Parameters:
          - RedshiftHost
          - RedshiftUser
          - RedshiftDatabaseName
          - GlueEmailLambdaName

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      DeletionProtection:
        default: Protect core items against deletion
      NodeType:
        default: Node Type/Size
      NetworkStackName:
        default: Network Stack Name
      MisStackName:
        default: MIS Stack Name
      GlueEmailLambdaName:
        default: Glue Email Lambda ARN
      RedshiftHost:
        default: Redshift Cluster Host
      RedshiftUser:
        default: Redshift Cluster User
      RedshiftPassword:
        default: Redshift Cluster Password
      RedshiftDatabaseName:
        default: Redshift Database Name
      SNSStackName:
        default: SNS Topic Stack Name
      StartScheduleExpression:
        default: Start Schedule CRON Expression
      StopScheduleExpression:
        default: Stop Schedule CRON Expression
      EC2Image:
        default: Reports Queries Instance AMI

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name)
    Type: String
    MinLength: 3
    MaxLength: 12
    Default: mis-etl
  OrgName:
    Description: The name of the organization
    Type: String
    Default: pchc
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production # Test for uat
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  DeletionProtection:
    Description: Set to true to enable (valid only in Production mode)
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  NodeType:
    Description: The node size to be provisioned (Only ra3 instances support multi-node cluter type.)
    Type: String
    Default: dc2.large
    AllowedValues:
      - dc2.large
      - dc2.8xlarge
      - ra3.large
      - ra3.xlplus
      - ra3.4xlarge
      - ra3.16xlarge
  NetworkStackName:
    Description: The name of the network stack
    Type: String
    Default: pchc-dev-uw2-mis-network
    MinLength: 1
  GlueEmailLambdaName:
    Description: Name of Glue Email Lambda
    Type: String
    Default: pchc-test-uw2-etl-email-notification
    MinLength: 1
  RedshiftHost:
    Description: Redshift Cluster Host
    Type: String
    Default: redshift-cluster-1.abcdefghijk.us-west-2.redshift.amazonaws.com
    MinLength: 1
  RedshiftUser:
    Description: Redshift Cluster User
    Type: String
    Default: redshiftuser
    MinLength: 1
  RedshiftDatabaseName:
    Description: Redshift Database Name
    Type: String
    Default: redshiftdbname
    MinLength: 1
  SNSStackName:
    Description: The name of the SNS stack
    Type: String
    Default: iscale-dev-dev-uw2-sns
    MinLength: 1
  MisStackName:
    Description: The name of the MIS stack
    Type: String
    Default: iscale-dev-dev-uw2-sns
    MinLength: 1
  StartScheduleExpression:
    Description: Schedule expression when to start the objects
    Type: String
    Default: cron(0 0 ? * MON-FRI *)
  StopScheduleExpression:
    Description: Schedule expression when to stop the objects
    Type: String
    Default: cron(0 10 ? * MON-FRI *)
  EC2Image:
    Description: Reports Queries Instance AMI
    Type: String
    Default: ami-079c0d2990b4033f4 # change depends on region, base AL2 image

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml

Resources:

##
# MIS Redshift Resources
##

  RedshiftStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/redshift.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        DatabaseName: !If
          - IsDev
          - !Join ['',[!FindInMap [EnvShort, !Ref EnvName, Name], misrsdb]] # need to recreate redshift dev
          - !Ref 'AWS::NoValue' # default name is redshiftdb, as glue scripts use this dbname for all env
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName
        ClusterType: single-node
        NodeType: !If [ IsProd, ra3.xlplus, dc2.large] # Only ra3 instances support multi-node cluter type (check ClusterType)
        NumberOfNodes: 1
        ClusterSubnet: !If [ IsProd, private, public]

##
# Security Group Section
##
  AllowLambdaToRedshift:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from lambda
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - RedshiftStack
          - Outputs.RedshiftSecurityGroupIdExport
      FromPort: 5439
      ToPort: 5439
      SourceSecurityGroupId:
        Fn::ImportValue:
          !Sub '${MisStackName}-MisLambdaSecurityGroupId'
  
  AllowJumphostToRedshift:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from jumphost
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - RedshiftStack
          - Outputs.RedshiftSecurityGroupIdExport
      FromPort: 5439
      ToPort: 5439
      SourceSecurityGroupId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-JumpHostSecurityGroupId'

  RedshiftSelfReferenceSecgroup:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: self-referencing inbound rule for Redshift
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - RedshiftStack
          - Outputs.RedshiftSecurityGroupIdExport
      FromPort: 0
      ToPort: 65535
      SourceSecurityGroupId:
        Fn::GetAtt:
          - RedshiftStack
          - Outputs.RedshiftSecurityGroupIdExport

  AllowMisAppServerToRedshift:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from MIS Appservers
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - RedshiftStack
          - Outputs.RedshiftSecurityGroupIdExport
      FromPort: 5439
      ToPort: 5439
      SourceSecurityGroupId:
        Fn::ImportValue:
          !Sub '${MisStackName}-MisServerStackSecurityGroupId'

###
# IAM section
###

  GlueServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: IAM Role for Glue
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
        - arn:aws:iam::aws:policy/AWSGlueConsoleFullAccess
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:*
                Resource: !Join ['', ['arn:aws:s3:::aws-glue-assets', '-', !Ref 'AWS::AccountId', '-', !Ref 'AWS::Region', '*']]
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Join ['', ['arn:aws:iam::', !Ref 'AWS::AccountId', ':role/', !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '-', !Ref Name, '-*']] #change this to !GetAtt RedshiftStack.Outputs.RedshiftRoleArnExport if you want to limit to only redshift role

# Role for Glue Query Scheduler. applicable only to uat and prod

  GlueQuerySchedulerRole:
    Condition: IsNotDev
    Type: AWS::IAM::Role
    Properties:
      Description: IAM Role for Glue Query Scheduler. This is also attached to Glue Cluster
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: 
                - events.amazonaws.com
                - redshift-serverless.amazonaws.com
                - redshift.amazonaws.com
            Action: 'sts:AssumeRole'
          - Effect: Allow
            Principal:
              AWS: 
                - !Join ['', ['arn:aws:iam::', !Ref 'AWS::AccountId', ':role/MasterAccountAccessRole']]
            Action: 'sts:AssumeRole'          
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEventBridgeFullAccess
        - arn:aws:iam::aws:policy/AmazonRedshiftDataFullAccess
      Policies:
        - PolicyName: UseTemporaryCredentialsForAllDbUsers
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - redshift:GetClusterCredentials
                Resource: !Join ['', ['arn:aws:redshift:', !Ref 'AWS::Region', ":", !Ref 'AWS::AccountId', ':dbuser:*/*']]

# add inline policy to IAM user and/or role. 
# IAM user and/or role need permission to view scheduled query history. Create multiple ManagedPolicy if needed.
  AllowViewQueryHistory:
    Condition: IsNotDev
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: add inline policy to MasterAccountAccessRole
      Roles: 
        - MasterAccountAccessRole # this is the role we use for PCHC uat and prod.
      PolicyDocument:
        Version: '2012-10-17'
        Statement: 
          - Sid: "AssumeIAMRole"
            Effect: Allow
            Action:
              - sts:AssumeRole
            Resource: !GetAtt GlueQuerySchedulerRole.Arn

# Create a Custom Lambda to add GlueQuerySchedulerRole to Glue Cluster.

  LambdaExecutionRole:
    Condition: IsNotDev
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RedshiftAttachRolePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - redshift:ModifyClusterIamRoles
                  - iam:PassRole
                Resource: '*'
              - Effect: Allow
                Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                Resource: "*"

  AttachRoleLambda:
    Condition: IsNotDev
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          def lambda_handler(event, context):
            redshift = boto3.client('redshift')
            try:
                cluster_identifier = event['ResourceProperties']['ClusterIdentifier']
                iam_role_arn = event['ResourceProperties']['IamRoleArn']
                
                if event['RequestType'] in ['Create', 'Update']:
                    # Attach the role
                    redshift.modify_cluster_iam_roles(
                        ClusterIdentifier=cluster_identifier,
                        AddIamRoles=[
                          iam_role_arn
                        ]
                    )
                elif event['RequestType'] == 'Delete':
                    # Remove the role
                    redshift.modify_cluster_iam_roles(
                        ClusterIdentifier=cluster_identifier,
                        RemoveIamRoles=[
                          iam_role_arn
                        ]
                    )
                cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
            except Exception as e:
                print(f"Error: {e}")
                cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  # Custom Resource
  AttachIamRoleCustomResource:
    Condition: IsNotDev
    Type: Custom::AttachIamRole
    Properties:
      ServiceTimeout: 300
      ServiceToken: !GetAtt AttachRoleLambda.Arn
      ClusterIdentifier: 
        Fn::GetAtt:
          - RedshiftStack
          - Outputs.RedshiftClusterName
      IamRoleArn: !GetAtt GlueQuerySchedulerRole.Arn

# Scheduler for Redshift

  SchedulerStack:
    DependsOn:
      - RedshiftStack
    Condition: IsNotProd
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: FALSE
        RedshiftClusterName:
          Fn::GetAtt:
            - RedshiftStack
            - Outputs.RedshiftClusterName

###
# Pesonet20 Post Glue upsert lambda
###
  Pesonet20PostGlueUpsertLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, pesonet20-post-glue-upsert]]
      Handler: index.lambda_handler
      Runtime: python3.12
      Role: !GetAtt Pesonet20PostGlueUpsertLambdaRole.Arn
      Timeout: 900
      MemorySize: 128
      VpcConfig:
        SubnetIds:
          - Fn::ImportValue:
              !Sub '${NetworkStackName}-PrivateSubnetId1'
        SecurityGroupIds:
          - !Ref Pesonet20PostGlueUpsertSecurityGroup
      Code:
        ZipFile: |
          import boto3
          import os
          import time
          import logging

          # -----------------------------
          # Logging setup
          # -----------------------------
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          # -----------------------------
          # AWS clients
          # -----------------------------
          ec2 = boto3.client("ec2")
          ssm = boto3.client("ssm")

          INSTANCE_ID = os.environ["INSTANCE_ID"]
          SSM_DOCUMENT_NAME = os.environ["SSM_DOCUMENT_NAME"]


          def ensure_instance_running():
              """Starts the EC2 instance if not already running and waits until it's ready."""
              resp = ec2.describe_instances(InstanceIds=[INSTANCE_ID])
              instance_state = resp["Reservations"][0]["Instances"][0]["State"]["Name"]
              logger.info("EC2 instance %s current state: %s", INSTANCE_ID, instance_state)

              if instance_state == "running":
                  return

              if instance_state in ("stopped", "stopping"):
                  logger.info("Starting EC2 instance %s...", INSTANCE_ID)
                  ec2.start_instances(InstanceIds=[INSTANCE_ID])
              else:
                  logger.warning("EC2 instance is in state '%s'. Waiting for it to reach running...", instance_state)

              waiter = ec2.get_waiter("instance_running")
              waiter.wait(InstanceIds=[INSTANCE_ID])
              logger.info("EC2 instance %s is now running. Waiting 30s for SSM agent to be ready...", INSTANCE_ID)

              # Buffer time for SSM agent to come online after instance starts
              time.sleep(30)


          def trigger_ssm_command():
              """Fires the SSM Run Command without waiting for it to complete."""
              response = ssm.send_command(
                  InstanceIds=[INSTANCE_ID],
                  DocumentName=SSM_DOCUMENT_NAME,
              )

              command_id = response["Command"]["CommandId"]
              logger.info("SSM Run Command triggered successfully. Command ID: %s", command_id)

              return command_id


          def lambda_handler(event, context):
              detail = event.get("detail", {})
              job_name = detail.get("jobName", "")
              state = detail.get("state", "")

              # Skip non-pesonet20 jobs
              if "pesonet20" not in job_name:
                  logger.info("Skipping: not a pesonet20 job. Glue Job: %s", job_name)
                  return {"status": "skipped", "reason": "not pesonet20 job"}

              # Only proceed on success
              if state != "SUCCEEDED":
                  logger.info("Skipping: Glue job %s is in state %s", job_name, state)
                  return {"status": "skipped", "reason": f"state={state}"}

              logger.info("Glue job %s succeeded. Triggering SSM Run Command...", job_name)

              ensure_instance_running()
              command_id = trigger_ssm_command()

              return {
                  "statusCode": 200,
                  "body": f"SSM Run Command triggered successfully. Command ID: {command_id}",
              }

      Environment:
        Variables:
          INSTANCE_ID: !GetAtt ReportQueriesInstance.InstanceId
          SSM_DOCUMENT_NAME: !Ref Pesonet20PostGlueUpsertSsmDocument

  Pesonet20PostGlueUpsertLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Pesonet20PostGlueUpsertLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
              - Sid: EmailLambdaInvoke
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Join ['', ['arn:aws:lambda:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':function:', !Ref GlueEmailLambdaName]]
              - Sid: CreateNetworkInterfaces
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                Resource: '*'
              - Sid: Ec2DescribeInstances
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                Resource: '*'
              - Sid: SsmPolicy
                Effect: Allow
                Action:
                  - ssm:SendCommand
                  - ec2:StartInstances
                Resource: 
                  - !Join ['', ['arn:aws:ec2:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':instance/', !GetAtt ReportQueriesInstance.InstanceId]]
                  - !Join ['', ['arn:aws:ssm:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':document/', !Ref Pesonet20PostGlueUpsertSsmDocument] ]
  
  Pesonet20PostGlueUpsertSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, pesonet20-post-glue-upsert-security-group]]
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
  
  Pesonet20PostGlueUpsertSsmDocument:
    Type: AWS::SSM::Document
    Properties:
      Content:
        schemaVersion: "2.2"
        description: "SSM Document to perform post-glue upsert from PESONet20 to PESONet tables and refresh materialized views"
        parameters:
          SecretID:
            type: "String"
            description: "secrets manager ID"
            default: !GetAtt ReportsQueriesSecret.Id
          Region:
            type: "String"
            description: "region"
            default: !Ref 'AWS::Region'
        mainSteps:
          - action: aws:runShellScript
            name: Pesonet20PostGlueUpsert
            inputs:
              runCommand:
                - |
                  export REDSHIFT_HOST=`aws secretsmanager get-secret-value --secret-id {{SecretID}} --region {{Region}} | jq -r .SecretString | jq -r .REDSHIFT_HOST`
                  export REDSHIFT_USER=`aws secretsmanager get-secret-value --secret-id {{SecretID}} --region {{Region}} | jq -r .SecretString | jq -r .REDSHIFT_USER`
                  export REDSHIFT_PASSWORD=`aws secretsmanager get-secret-value --secret-id {{SecretID}} --region {{Region}} | jq -r .SecretString | jq -r .REDSHIFT_PASSWORD`
                  export REDSHIFT_DATABASE=`aws secretsmanager get-secret-value --secret-id {{SecretID}} --region {{Region}} | jq -r .SecretString | jq -r .REDSHIFT_DATABASE`
                  export REDSHIFT_PORT=5439
                  export PGPASSWORD="$REDSHIFT_PASSWORD"

                  # check environment
                  if [[ "$REDSHIFT_HOST" == *test* ]]; then
                      export PESONET20_SCHEMA=pesonetf20
                      export STATUS_CODES=status_codes

                  elif [[ "$REDSHIFT_HOST" == *prd* ]]; then
                      export PESONET20_SCHEMA=pesonet20
                      export STATUS_CODES=status_code

                  else
                      echo "No valid environment detected"
                      exit 1
                  fi

                  export PESONET20_SCHEMA=$PESONET20_SCHEMA
                  export STATUS_CODES=$STATUS_CODES

                  # Execute PESONet20 post-glue upsert SQL script via psql CLI
                  psql -h $REDSHIFT_HOST -p $REDSHIFT_PORT -U $REDSHIFT_USER -d $REDSHIFT_DATABASE <<EOF
                  -- --- PESONET20 post glue job upsert to PESONET ---
                  BEGIN;

                  -- --- PART 1: Simple replace tables (truncate + insert) ---

                  TRUNCATE pesonet.banks;
                  INSERT INTO pesonet.banks
                  SELECT * FROM ${PESONET20_SCHEMA}.banks;

                  TRUNCATE pesonet.status_codes;
                  INSERT INTO pesonet.status_codes
                  SELECT * FROM ${PESONET20_SCHEMA}.${STATUS_CODES};

                  TRUNCATE pesonet.limit_requests;
                  INSERT INTO pesonet.limit_requests
                  SELECT * FROM ${PESONET20_SCHEMA}.limit_requests;

                  -- --- PART 2: Offset ID tables (delete previous + insert new with offset) ---

                  -- Ensure pesonet20_id tracking columns exist

                  -- Define offsets
                  -- These must remain consistent unless data is inserted from other sources
                  -- inward_batches: 111720624
                  -- outward_batches: 101593671
                  -- outward_transactions: 101593671

                  -- Step 1: Delete previously inserted pesonet20 entries
                  DELETE FROM pesonet.outward_transactions
                  WHERE pesonet20_id IS NOT NULL;

                  DELETE FROM pesonet.outward_batches
                  WHERE pesonet20_id IS NOT NULL;

                  DELETE FROM pesonet.inward_batches
                  WHERE pesonet20_id IS NOT NULL;

                  DELETE FROM pesonet.rates
                  WHERE pesonet20_id IS NOT NULL;

                  -- Step 2: Insert with ID offset and pesonet20_id tracking

                  -- Insert into inward_batches
                  INSERT INTO pesonet.inward_batches (
                      id,
                      settlement_failed,
                      posted_at,
                      settlement_date,
                      bank_id,
                      pesonet20_id,
                      cycle_seq
                  )
                  SELECT
                      id + 111720624,
                      settlement_failed,
                      posted_at,
                      settlement_date,
                      bank_id,
                      id,
                      cycle_seq
                  FROM ${PESONET20_SCHEMA}.inward_batches;

                  -- Insert into outward_batches
                  INSERT INTO pesonet.outward_batches (
                      id,
                      transferred_at,
                      transaction_count,
                      amount,
                      "amount_decimal(12,2)",
                      settlement_date,
                      settlement_failed,
                      bank_id,
                      pesonet20_id
                  )
                  SELECT
                      id + 101593671,
                      transferred_at,
                      transaction_count,
                      amount,
                      "amount_decimal(12,2)",
                      settlement_date,
                      settlement_failed,
                      bank_id,
                      id
                  FROM ${PESONET20_SCHEMA}.outward_batches;

                  -- Insert into outward_transactions
                  INSERT INTO pesonet.outward_transactions (
                      id,
                      creditor_bic,
                      settlement_amount,
                      inward_batch_id,
                      status_code,
                      transaction_code,
                      bank_id,
                      outward_batch_id,
                      import_file_id,
                      maker_id,
                      updated_at,
                      pesonet20_id,
                      debtor_name
                  )
                  SELECT
                      ot.id + 101593671,
                      ot.creditor_bic,
                      ot.settlement_amount,
                      ot.inward_batch_id + 111720624,
                      ot.status_code,
                      ot.transaction_code,
                      ot.bank_id,
                      ot.outward_batch_id + 101593671,
                      ot.import_file_id,
                      ot.maker_id,
                      ot.updated_at,
                      ot.id,
                      ot.debtor_name
                  FROM ${PESONET20_SCHEMA}.outward_transactions ot;

                  -- Insert from ${PESONET20_SCHEMA}.rates with ID offset of +9
                  INSERT INTO pesonet.rates (
                      id,
                      pesonet20_id,
                      item_rate,
                      updated_at,
                      effective_date,
                      minimum_rate,
                      created_at
                  )
                  SELECT
                      id + 9,           -- new id
                      id,               -- original id from ${PESONET20_SCHEMA}
                      item_rate,
                      updated_at,
                      effective_date,
                      minimum_rate,
                      created_at
                  FROM ${PESONET20_SCHEMA}.rates;

                  COMMIT;

                  REFRESH MATERIALIZED VIEW pesonet.mv_count_transaction_per_day;
                  REFRESH MATERIALIZED VIEW pesonet.mv_inward_transaction_rejected_top_reasons;
                  REFRESH MATERIALIZED VIEW pesonet.mv_inward_transaction_status_count;
                  REFRESH MATERIALIZED VIEW pesonet.mv_inward_transaction_status_per_bank;
                  REFRESH MATERIALIZED VIEW pesonet.mv_inward_transactions_per_bank_per_all_status_code;
                  REFRESH MATERIALIZED VIEW pesonet.mv_inward_transactions_per_bank_per_status_code;
                  REFRESH MATERIALIZED VIEW pesonet.mv_outward_transactions_per_bank;
                  REFRESH MATERIALIZED VIEW pesonet.mv_peak_transaction_time;

                  -- Turn off GCASH sponsor code
                  UPDATE pesonet.banks SET sponsor_bank_id = NULL WHERE bank_code = '804';
                  EOF

                  if [ $? -eq 0 ]; then
                    echo "All views refreshed successfully. Shutting down."
                  else
                    echo "psql failed. Shutting down anyway."
                  fi

                  sudo shutdown -h now +1 &
      DocumentFormat: YAML
      DocumentType: Command
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, pesonet20-post-glue-upsert-ssm-document]]
      UpdateMethod: NewVersion
      TargetType: /AWS::EC2::Instance
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, pesonet20-post-glue-upsert-ssm-document]]

# Reports Queries section
###

  ReportsQueriesSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, reports-queries]]
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, reports-queries secrets]]
      
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  ReportsQueriesUserGroup:
    Type: AWS::IAM::Group
    Properties:
      Policies:
        - PolicyName: ExecuteSSM
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ssm:SendCommand
                  - ssm:ListCommands
                Resource: !Join ['', ['arn:aws:ssm:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':document/', !Ref ReportsQueriesRunCommand]]
              - Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: !Join ['', ['arn:aws:ssm:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':*']]
        - PolicyName: InstanceAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:StartInstances
                  - ec2:StopInstances
                  - ssm:SendCommand
                Resource: !Join ['', ['arn:aws:ec2:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':instance/', !Ref ReportQueriesInstance]]
              - Effect: Allow
                Action:
                  - ec2:DescribeInstanceStatus
                Resource: "*"

  ReportsQueriesRunCommand: 
    Type: AWS::SSM::Document
    Properties:
      Content:
        schemaVersion: "2.2"
        description: "Command Document to run queries to Redshift"
        parameters:
          SecretID:
            type: "String"
            description: "secrets manager ID"
            default: !GetAtt ReportsQueriesSecret.Id
          Region:
            type: "String"
            description: "region"
            default: !Ref 'AWS::Region'
        mainSteps:
        - action: aws:runShellScript
          name: "update_deploy"
          inputs:
            runCommand:
            - |
              cd /home/ec2-user/pchc-mis-report-queries/
              git pull
              cd /home/ec2-user/queries-deploy/
              rsync -avz /home/ec2-user/pchc-mis-report-queries/ /home/ec2-user/queries-deploy/
              export REDSHIFT_HOST=`aws secretsmanager get-secret-value --secret-id {{SecretID}} --region {{Region}} | jq -r .SecretString | jq -r .REDSHIFT_HOST`
              export REDSHIFT_USER=`aws secretsmanager get-secret-value --secret-id {{SecretID}} --region {{Region}} | jq -r .SecretString | jq -r .REDSHIFT_USER`
              export REDSHIFT_PASSWORD=`aws secretsmanager get-secret-value --secret-id {{SecretID}} --region {{Region}} | jq -r .SecretString | jq -r .REDSHIFT_PASSWORD`
              export REDSHIFT_DATABASE=`aws secretsmanager get-secret-value --secret-id {{SecretID}} --region {{Region}} | jq -r .SecretString | jq -r .REDSHIFT_DATABASE`
              sed -i "s|XXREDSHIFT_HOSTXX|$REDSHIFT_HOST|g" update_deploy.sh
              sed -i "s|XXREDSHIFT_USERXX|$REDSHIFT_USER|g" update_deploy.sh
              sed -i "s|XXREDSHIFT_PASSWORDXX|$REDSHIFT_PASSWORD|g" update_deploy.sh
              sed -i "s|XXREDSHIFT_DATABASEXX|$REDSHIFT_DATABASE|g" update_deploy.sh
              /bin/bash update_deploy.sh
      DocumentFormat: YAML
      DocumentType: Command
      Name: run-reports-queries
      UpdateMethod: NewVersion
      TargetType: /AWS::EC2::Instance
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

###
# EC2 for running SSM commands
###

  ReportQueriesInstance:
    Type: AWS::EC2::Instance
    Properties: 
      ImageId: !Ref EC2Image
      InstanceType: t3a.micro
      IamInstanceProfile: !Ref ReportsQueriesIamProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeviceIndex: 0
          GroupSet: [!GetAtt ReportQueriesSecurityGroup.GroupId]
          SubnetId:
            Fn::ImportValue:
              !Sub '${NetworkStackName}-PrivateSubnetId1'
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 10
      UserData:
        Fn::Base64: !Sub |
            #!/bin/bash -xe
            sudo yum install git postgresql jq -y
            sudo mkdir /home/ec2-user/queries-deploy/
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, reports-queries]]

  ReportsQueriesIamProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: ReportsQueriesIamRole
        
  ReportsQueriesIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: ec2.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref ReportsQueriesSecret

  ReportQueriesSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, reports-queries]]
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"

  AllowReportsQueriesToRedshift:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from reports-queries-instance
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - RedshiftStack
          - Outputs.RedshiftSecurityGroupIdExport
      FromPort: 5439
      ToPort: 5439
      SourceSecurityGroupId: !GetAtt ReportQueriesSecurityGroup.GroupId

Outputs:

  RedshiftSecurityGroupIdExport:
    Description: The security group id of the Redshift
    Value:
      Fn::GetAtt:
        - RedshiftStack
        - Outputs.RedshiftSecurityGroupIdExport
    Export:
      Name: !Sub ${AWS::StackName}-RedshiftSecurityGroupId

  Pesonet20PostGlueUpsertLambdaArn:
    Description: ARN of Pesonet20 Post Glue Upsert Lambda
    Value: !GetAtt Pesonet20PostGlueUpsertLambda.Arn
    Export:
      Name: !Sub ${AWS::StackName}-Pesonet20PostGlueUpsertLambdaArn

  ReportsQueriesRunCommandDocumentName:
    Description: SSM Document name for running reports queries
    Value: !Ref ReportsQueriesRunCommand
    Export:
      Name: !Sub ${AWS::StackName}-ReportsQueriesRunCommandDocumentName
  
  ReportsQueriesInstanceId:
    Description: Instance ID of EC2 instance for running reports queries
    Value: !Ref ReportQueriesInstance
    Export:
      Name: !Sub ${AWS::StackName}-ReportsQueriesInstanceId

  Pesonet20PostGlueUpsertSsmDocumentName:
    Description: SSM Document name for refreshing materialized views after pesonet20 upsert
    Value: !Ref Pesonet20PostGlueUpsertSsmDocument
    Export:
      Name: !Sub ${AWS::StackName}-Pesonet20PostGlueUpsertSsmDocumentName
  