AWSTemplateFormatVersion: 2010-09-09
Description: MIS ETL Resources (S3, Redshift, Glue IAM Role)

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
          - MisStackName
          - DeletionProtection
      - Label:
          default: Redshift Cluster Configuration
        Parameters:
          - NodeType
      - Label:
          default: Scheduler Configuration
        Parameters:
          - StartScheduleExpression
          - StopScheduleExpression
      - Label:
          default: Pesonet20 Post Glue Upsert Configuration
        Parameters:
          - RedshiftHost
          - RedshiftUser
          - RedshiftPassword
          - RedshiftDatabaseName
          - GlueEmailLambdaName

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      DeletionProtection:
        default: Protect core items against deletion
      NodeType:
        default: Node Type/Size
      NetworkStackName:
        default: Network Stack Name
      MisStackName:
        default: MIS Stack Name
      GlueEmailLambdaName:
        default: Glue Email Lambda ARN
      RedshiftHost:
        default: Redshift Cluster Host
      RedshiftUser:
        default: Redshift Cluster User
      RedshiftPassword:
        default: Redshift Cluster Password
      RedshiftDatabaseName:
        default: Redshift Database Name
      SNSStackName:
        default: SNS Topic Stack Name
      StartScheduleExpression:
        default: Start Schedule CRON Expression
      StopScheduleExpression:
        default: Stop Schedule CRON Expression
      EC2Image:
        default: Reports Queries Instance AMI

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name)
    Type: String
    MinLength: 3
    MaxLength: 12
    Default: mis-etl
  OrgName:
    Description: The name of the organization
    Type: String
    Default: pchc
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production # Test for uat
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  DeletionProtection:
    Description: Set to true to enable (valid only in Production mode)
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  NodeType:
    Description: The node size to be provisioned (Only ra3 instances support multi-node cluter type.)
    Type: String
    Default: dc2.large
    AllowedValues:
      - dc2.large
      - dc2.8xlarge
      - ra3.large
      - ra3.xlplus
      - ra3.4xlarge
      - ra3.16xlarge
  NetworkStackName:
    Description: The name of the network stack
    Type: String
    Default: pchc-dev-uw2-mis-network
    MinLength: 1
  GlueEmailLambdaName:
    Description: Name of Glue Email Lambda
    Type: String
    Default: pchc-test-uw2-etl-email-notification
    MinLength: 1
  RedshiftHost:
    Description: Redshift Cluster Host
    Type: String
    Default: redshift-cluster-1.abcdefghijk.us-west-2.redshift.amazonaws.com
    MinLength: 1
  RedshiftUser:
    Description: Redshift Cluster User
    Type: String
    Default: redshiftuser
    MinLength: 1
  RedshiftPassword:
    Description: Redshift Cluster Password
    Type: String
    NoEcho: true
    MinLength: 1
    Default: 'password'
  RedshiftDatabaseName:
    Description: Redshift Database Name
    Type: String
    Default: redshiftdbname
    MinLength: 1
  SNSStackName:
    Description: The name of the SNS stack
    Type: String
    Default: iscale-dev-dev-uw2-sns
    MinLength: 1
  MisStackName:
    Description: The name of the MIS stack
    Type: String
    Default: iscale-dev-dev-uw2-sns
    MinLength: 1
  StartScheduleExpression:
    Description: Schedule expression when to start the objects
    Type: String
    Default: cron(0 0 ? * MON-FRI *)
  StopScheduleExpression:
    Description: Schedule expression when to stop the objects
    Type: String
    Default: cron(0 10 ? * MON-FRI *)
  EC2Image:
    Description: Reports Queries Instance AMI
    Type: String
    Default: ami-079c0d2990b4033f4 # change depends on region, base AL2 image

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml

Resources:

##
# MIS Redshift Resources
##

  RedshiftStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/redshift.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        DatabaseName: !If
          - IsDev
          - !Join ['',[!FindInMap [EnvShort, !Ref EnvName, Name], misrsdb]] # need to recreate redshift dev
          - !Ref 'AWS::NoValue' # default name is redshiftdb, as glue scripts use this dbname for all env
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName
        ClusterType: single-node
        NodeType: !If [ IsProd, ra3.xlplus, dc2.large] # Only ra3 instances support multi-node cluter type (check ClusterType)
        NumberOfNodes: 1
        ClusterSubnet: !If [ IsProd, private, public]

##
# Security Group Section
##
  AllowLambdaToRedshift:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from lambda
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - RedshiftStack
          - Outputs.RedshiftSecurityGroupIdExport
      FromPort: 5439
      ToPort: 5439
      SourceSecurityGroupId:
        Fn::ImportValue:
          !Sub '${MisStackName}-MisLambdaSecurityGroupId'
  
  AllowJumphostToRedshift:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from jumphost
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - RedshiftStack
          - Outputs.RedshiftSecurityGroupIdExport
      FromPort: 5439
      ToPort: 5439
      SourceSecurityGroupId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-JumpHostSecurityGroupId'

  RedshiftSelfReferenceSecgroup:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: self-referencing inbound rule for Redshift
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - RedshiftStack
          - Outputs.RedshiftSecurityGroupIdExport
      FromPort: 0
      ToPort: 65535
      SourceSecurityGroupId:
        Fn::GetAtt:
          - RedshiftStack
          - Outputs.RedshiftSecurityGroupIdExport

  AllowMisAppServerToRedshift:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from MIS Appservers
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - RedshiftStack
          - Outputs.RedshiftSecurityGroupIdExport
      FromPort: 5439
      ToPort: 5439
      SourceSecurityGroupId:
        Fn::ImportValue:
          !Sub '${MisStackName}-MisServerStackSecurityGroupId'

###
# IAM section
###

  GlueServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: IAM Role for Glue
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
        - arn:aws:iam::aws:policy/AWSGlueConsoleFullAccess
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:*
                Resource: !Join ['', ['arn:aws:s3:::aws-glue-assets', '-', !Ref 'AWS::AccountId', '-', !Ref 'AWS::Region', '*']]
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Join ['', ['arn:aws:iam::', !Ref 'AWS::AccountId', ':role/', !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '-', !Ref Name, '-*']] #change this to !GetAtt RedshiftStack.Outputs.RedshiftRoleArnExport if you want to limit to only redshift role

# Role for Glue Query Scheduler. applicable only to uat and prod

  GlueQuerySchedulerRole:
    Condition: IsNotDev
    Type: AWS::IAM::Role
    Properties:
      Description: IAM Role for Glue Query Scheduler. This is also attached to Glue Cluster
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: 
                - events.amazonaws.com
                - redshift-serverless.amazonaws.com
                - redshift.amazonaws.com
            Action: 'sts:AssumeRole'
          - Effect: Allow
            Principal:
              AWS: 
                - !Join ['', ['arn:aws:iam::', !Ref 'AWS::AccountId', ':role/MasterAccountAccessRole']]
            Action: 'sts:AssumeRole'          
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEventBridgeFullAccess
        - arn:aws:iam::aws:policy/AmazonRedshiftDataFullAccess
      Policies:
        - PolicyName: UseTemporaryCredentialsForAllDbUsers
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - redshift:GetClusterCredentials
                Resource: !Join ['', ['arn:aws:redshift:', !Ref 'AWS::Region', ":", !Ref 'AWS::AccountId', ':dbuser:*/*']]

# add inline policy to IAM user and/or role. 
# IAM user and/or role need permission to view scheduled query history. Create multiple ManagedPolicy if needed.
  AllowViewQueryHistory:
    Condition: IsNotDev
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: add inline policy to MasterAccountAccessRole
      Roles: 
        - MasterAccountAccessRole # this is the role we use for PCHC uat and prod.
      PolicyDocument:
        Version: '2012-10-17'
        Statement: 
          - Sid: "AssumeIAMRole"
            Effect: Allow
            Action:
              - sts:AssumeRole
            Resource: !GetAtt GlueQuerySchedulerRole.Arn

# Create a Custom Lambda to add GlueQuerySchedulerRole to Glue Cluster.

  LambdaExecutionRole:
    Condition: IsNotDev
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RedshiftAttachRolePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - redshift:ModifyClusterIamRoles
                  - iam:PassRole
                Resource: '*'
              - Effect: Allow
                Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                Resource: "*"

  AttachRoleLambda:
    Condition: IsNotDev
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          def lambda_handler(event, context):
            redshift = boto3.client('redshift')
            try:
                cluster_identifier = event['ResourceProperties']['ClusterIdentifier']
                iam_role_arn = event['ResourceProperties']['IamRoleArn']
                
                if event['RequestType'] in ['Create', 'Update']:
                    # Attach the role
                    redshift.modify_cluster_iam_roles(
                        ClusterIdentifier=cluster_identifier,
                        AddIamRoles=[
                          iam_role_arn
                        ]
                    )
                elif event['RequestType'] == 'Delete':
                    # Remove the role
                    redshift.modify_cluster_iam_roles(
                        ClusterIdentifier=cluster_identifier,
                        RemoveIamRoles=[
                          iam_role_arn
                        ]
                    )
                cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
            except Exception as e:
                print(f"Error: {e}")
                cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  # Custom Resource
  AttachIamRoleCustomResource:
    Condition: IsNotDev
    Type: Custom::AttachIamRole
    Properties:
      ServiceTimeout: 300
      ServiceToken: !GetAtt AttachRoleLambda.Arn
      ClusterIdentifier: 
        Fn::GetAtt:
          - RedshiftStack
          - Outputs.RedshiftClusterName
      IamRoleArn: !GetAtt GlueQuerySchedulerRole.Arn

# Scheduler for Redshift

  SchedulerStack:
    DependsOn:
      - RedshiftStack
    Condition: IsNotProd
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: FALSE
        RedshiftClusterName:
          Fn::GetAtt:
            - RedshiftStack
            - Outputs.RedshiftClusterName

###
# Pesonet20 Post Glue upsert lambda
###
  Pesonet20PostGlueUpsertLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, pesonet20-post-glue-upsert]]
      Handler: index.lambda_handler
      Runtime: python3.12
      Role: !GetAtt Pesonet20PostGlueUpsertLambdaRole.Arn
      Timeout: 900
      MemorySize: 128
      Code:
        ZipFile: |
          import boto3
          import os
          import time
          import logging
          import json
          import traceback

          # -----------------------------
          # Logging setup
          # -----------------------------
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          # -----------------------------
          # Redshift client
          # -----------------------------
          client = boto3.client("redshift-data")

          CLUSTER_ID = os.environ["REDSHIFT_CLUSTER"]
          DATABASE = os.environ["REDSHIFT_DATABASE"]
          USER = os.environ["REDSHIFT_USER"]
          PESONET20_SCHEMA = os.environ["PESONET20_SCHEMA_PREFIX"]
          ALLOWED_SCHEMAS = {"pesonetf20", "pesonet20"}
          if PESONET20_SCHEMA not in ALLOWED_SCHEMAS:
            raise ValueError(f"Invalid PESONET20_SCHEMA: {PESONET20_SCHEMA}")
          POLL_INTERVAL = 5  # seconds
          
          def execute_sql(sql: str, label: str):
              """
              Execute a SQL statement via Redshift Data API
              and wait for completion with full status handling.
              """
              logger.info("Executing SQL [%s]", label)

              response = client.execute_statement(
                  ClusterIdentifier=CLUSTER_ID,
                  Database=DATABASE,
                  DbUser=USER,
                  Sql=sql,
              )

              statement_id = response["Id"]
              logger.info("Statement ID [%s]: %s", label, statement_id)

              while True:
                  desc = client.describe_statement(Id=statement_id)
                  status = desc["Status"]

                  if status in ["FINISHED", "FAILED", "ABORTED"]:
                      break

                  time.sleep(POLL_INTERVAL)

              # -----------------------------
              # Status handling
              # -----------------------------
              if status == "FINISHED":
                  logger.info("SQL SUCCEEDED [%s]", label)
                  return desc

              if status == "FAILED":
                  error_msg = desc.get("Error", "Unknown error")
                  logger.error(
                      "SQL FAILED [%s] | StatementId=%s | Error=%s",
                      label,
                      statement_id,
                      error_msg,
                  )
                  raise Exception(f"SQL FAILED [{label}]: {error_msg}")

              if status == "ABORTED":
                  logger.error(
                      "SQL CANCELLED [%s] | StatementId=%s",
                      label,
                      statement_id,
                  )
                  raise Exception(f"SQL CANCELLED [{label}]")

              # Safety net (should never hit)
              raise Exception(f"Unexpected status [{status}] for [{label}]")


          def lambda_handler(event, context):
              logger.info("Starting Pesonet20 post-glue upsert job")

              try:
                  # -----------------------------
                  # PART 1
                  # -----------------------------
                  execute_sql(
                      f"""
                      BEGIN;

                      TRUNCATE pesonet.banks;
                      INSERT INTO pesonet.banks SELECT * FROM {PESONET20_SCHEMA}.banks;

                      TRUNCATE pesonet.status_codes;
                      INSERT INTO pesonet.status_codes SELECT * FROM {PESONET20_SCHEMA}.status_codes;

                      TRUNCATE pesonet.limit_requests;
                      INSERT INTO pesonet.limit_requests SELECT * FROM {PESONET20_SCHEMA}.limit_requests;

                      COMMIT;
                      """,
                      label="PART_1_TRUNCATE_INSERT",
                  )

                  # -----------------------------
                  # PART 2
                  # -----------------------------
                  execute_sql(
                      f"""
                      BEGIN;

                      DELETE FROM pesonet.outward_transactions WHERE pesonet20_id IS NOT NULL;
                      DELETE FROM pesonet.outward_batches WHERE pesonet20_id IS NOT NULL;
                      DELETE FROM pesonet.inward_batches WHERE pesonet20_id IS NOT NULL;
                      DELETE FROM pesonet.rates WHERE pesonet20_id IS NOT NULL;

                      INSERT INTO pesonet.inward_batches (
                          id, settlement_failed, posted_at, settlement_date, bank_id, pesonet20_id, cycle_seq
                      )
                      SELECT
                          id + 111720624,
                          settlement_failed,
                          posted_at,
                          settlement_date,
                          bank_id,
                          id,
                          cycle_seq
                      FROM {PESONET20_SCHEMA}.inward_batches;

                      INSERT INTO pesonet.outward_batches (
                          id, transferred_at, transaction_count, amount,
                          "amount_decimal(12,2)", settlement_date,
                          settlement_failed, bank_id, pesonet20_id
                      )
                      SELECT
                          id + 101593671,
                          transferred_at,
                          transaction_count,
                          amount,
                          "amount_decimal(12,2)",
                          settlement_date,
                          settlement_failed,
                          bank_id,
                          id
                      FROM {PESONET20_SCHEMA}.outward_batches;

                      INSERT INTO pesonet.outward_transactions (
                          id, creditor_bic, settlement_amount, inward_batch_id,
                          status_code, transaction_code, bank_id, outward_batch_id,
                          import_file_id, maker_id, updated_at, pesonet20_id, debtor_name
                      )
                      SELECT
                          ot.id + 101593671,
                          ot.creditor_bic,
                          ot.settlement_amount,
                          ot.inward_batch_id + 111720624,
                          ot.status_code,
                          ot.transaction_code,
                          ot.bank_id,
                          ot.outward_batch_id + 101593671,
                          ot.import_file_id,
                          ot.maker_id,
                          ot.updated_at,
                          ot.id,
                          ot.debtor_name
                      FROM {PESONET20_SCHEMA}.outward_transactions ot;

                      INSERT INTO pesonet.rates (
                          id, pesonet20_id, item_rate,
                          updated_at, effective_date, minimum_rate, created_at
                      )
                      SELECT
                          id + 9,
                          id,
                          item_rate,
                          updated_at,
                          effective_date,
                          minimum_rate,
                          created_at
                      FROM {PESONET20_SCHEMA}.rates;

                      COMMIT;
                      """,
                      label="PART_2_OFFSET_INSERT",
                  )

                  # -----------------------------
                  # MATERIALIZED VIEWS
                  # -----------------------------
                  mviews = [
                      "mv_count_transaction_per_day",
                      "mv_inward_transaction_rejected_top_reasons",
                      "mv_inward_transaction_status_count",
                      "mv_inward_transaction_status_per_bank",
                      "mv_inward_transactions_per_bank_per_all_status_code",
                      "mv_inward_transactions_per_bank_per_status_code",
                      "mv_outward_transactions_per_bank",
                      "mv_peak_transaction_time",
                  ]

                  for view in mviews:
                      execute_sql(
                          f"REFRESH MATERIALIZED VIEW pesonet.{view};",
                          label=f"REFRESH_{view}",
                      )

                  logger.info("Pesonet20 post-glue upsert job completed successfully")

                  send_email_notification("SUCCEEDED", "Redshift upsert and materialized views completed successfully!")

                  return {
                      "statusCode": 200,
                      "body": "Redshift post-upsert operations completed successfully!",
                  }

              except Exception as e:
                  logger.exception("Pesonet20 post-glue upsert job FAILED")
                  send_email_notification(
                      "FAILED",
                      f"Redshift upsert failed: {str(e)}"
                  )
                  raise
                  
          # -----------------------------
          # Lambda client
          # -----------------------------
          lambda_client = boto3.client('lambda')
          EMAIL_LAMBDA = os.environ['GLUE_EMAIL_LAMBDA']  # ARN or name of GlueJobEmailLambda
          
          # Trigger send email notif from etl-alerts       
          def send_email_notification(status, message=""):
            """
            Sends a simulated Glue Job event to GlueJobEmailLambda.
            Status should be "SUCCEEDED" or "FAILED".
            """
            payload = {
                "version": "0",
                "id": f"{PESONET20_SCHEMA}-post-script-" + os.urandom(4).hex(),
                "detail-type": "Glue Job State Change",
                "source": f"custom.{PESONET20_SCHEMA}.upsert",
                "account": os.environ.get('AWS_ACCOUNT_ID', 'unknown'),
                "time": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                "region": os.environ.get('AWS_REGION', 'unknown'),
                "resources": [],
                "detail": {
                    "jobName": f"{PESONET20_SCHEMA}_post-upsert-script",
                    "severity": "INFO",
                    "state": status,
                    "jobRunId": f"{PESONET20_SCHEMA}-post-upsert-script-lambda-" + os.urandom(4).hex(),
                    "message": message
                }
            }

            try:
                lambda_client.invoke(
                    FunctionName=EMAIL_LAMBDA,
                    InvocationType='Event',  # async
                    Payload=json.dumps(payload).encode('utf-8')
                )
                print(f"Email Lambda invoked successfully with status {status}")
            except Exception as e:
                print(f"Failed to invoke Email Lambda: {e}")
                traceback.print_exc()

      
      Environment:
        Variables:
          REDSHIFT_CLUSTER: !GetAtt RedshiftStack.Outputs.RedshiftClusterName
          REDSHIFT_USER: !Ref RedshiftUser
          REDSHIFT_DATABASE: !Ref RedshiftDatabaseName
          PESONET20_SCHEMA_PREFIX: !If [ IsNotProd, pesonetf20, pesonet20 ]
          GLUE_EMAIL_LAMBDA: !Join ['', ['arn:aws:lambda:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':function:', !Ref GlueEmailLambdaName]]
          AWS_ACCOUNT_ID: !Ref 'AWS::AccountId'

  Pesonet20PostGlueUpsertLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RedshiftAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RedshiftListAndGetClusterCredentials
                Effect: Allow
                Action:
                  - redshift:List*
                  - redshift:GetClusterCredentials
                Resource: 
                  - !Join ['', ['arn:', !Ref 'AWS::Partition', ':redshift:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':cluster:', !GetAtt RedshiftStack.Outputs.RedshiftClusterName]]
                  - !Join ['', ['arn:', !Ref 'AWS::Partition', ':redshift:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':cluster:', !GetAtt RedshiftStack.Outputs.RedshiftClusterName, '/*']]
                  - !Join ['', ['arn:', !Ref 'AWS::Partition', ':redshift:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':dbname:', !GetAtt RedshiftStack.Outputs.RedshiftClusterName, '/', !Ref RedshiftDatabaseName]]
                  - !Join ['', ['arn:', !Ref 'AWS::Partition', ':redshift:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':dbuser:', !GetAtt RedshiftStack.Outputs.RedshiftClusterName, '/', !Ref RedshiftUser]]
              - Sid: RedshiftDataAPIAccess
                Effect: Allow
                Action:
                  - redshift-data:ExecuteStatement
                  - redshift-data:DescribeStatement
                  - redshift-data:ListStatements
                Resource: '*'
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
              - Sid: EmailLambdaInvoke
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Join ['', ['arn:aws:lambda:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':function:', !Ref GlueEmailLambdaName]]

                
# Reports Queries section
###

  ReportsQueriesSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, reports-queries]]
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, reports-queries secrets]]
      
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  ReportsQueriesUserGroup:
    Type: AWS::IAM::Group
    Properties:
      Policies:
        - PolicyName: ExecuteSSM
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ssm:SendCommand
                  - ssm:ListCommands
                Resource: !Join ['', ['arn:aws:ssm:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':document/', !Ref ReportsQueriesRunCommand]]
              - Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: !Join ['', ['arn:aws:ssm:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':*']]
        - PolicyName: InstanceAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:StartInstances
                  - ec2:StopInstances
                  - ssm:SendCommand
                Resource: !Join ['', ['arn:aws:ec2:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':instance/', !Ref ReportQueriesInstance]]
              - Effect: Allow
                Action:
                  - ec2:DescribeInstanceStatus
                Resource: "*"

  ReportsQueriesRunCommand: 
    Type: AWS::SSM::Document
    Properties:
      Content:
        schemaVersion: "2.2"
        description: "Command Document to run queries to Redshift"
        parameters:
          SecretID:
            type: "String"
            description: "secrets manager ID"
            default: !GetAtt ReportsQueriesSecret.Id
          Region:
            type: "String"
            description: "region"
            default: !Ref 'AWS::Region'
        mainSteps:
        - action: aws:runShellScript
          name: "update_deploy"
          inputs:
            runCommand:
            - |
              cd /home/ec2-user/pchc-mis-report-queries/
              git pull
              cd /home/ec2-user/queries-deploy/
              rsync -avz /home/ec2-user/pchc-mis-report-queries/ /home/ec2-user/queries-deploy/
              export REDSHIFT_HOST=`aws secretsmanager get-secret-value --secret-id {{SecretID}} --region {{Region}} | jq -r .SecretString | jq -r .REDSHIFT_HOST`
              export REDSHIFT_USER=`aws secretsmanager get-secret-value --secret-id {{SecretID}} --region {{Region}} | jq -r .SecretString | jq -r .REDSHIFT_USER`
              export REDSHIFT_PASSWORD=`aws secretsmanager get-secret-value --secret-id {{SecretID}} --region {{Region}} | jq -r .SecretString | jq -r .REDSHIFT_PASSWORD`
              export REDSHIFT_DATABASE=`aws secretsmanager get-secret-value --secret-id {{SecretID}} --region {{Region}} | jq -r .SecretString | jq -r .REDSHIFT_DATABASE`
              sed -i "s|XXREDSHIFT_HOSTXX|$REDSHIFT_HOST|g" update_deploy.sh
              sed -i "s|XXREDSHIFT_USERXX|$REDSHIFT_USER|g" update_deploy.sh
              sed -i "s|XXREDSHIFT_PASSWORDXX|$REDSHIFT_PASSWORD|g" update_deploy.sh
              sed -i "s|XXREDSHIFT_DATABASEXX|$REDSHIFT_DATABASE|g" update_deploy.sh
              /bin/bash update_deploy.sh
      DocumentFormat: YAML
      DocumentType: Command
      Name: run-reports-queries
      UpdateMethod: NewVersion
      TargetType: /AWS::EC2::Instance
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

###
# EC2 for running SSM commands
###

  ReportQueriesInstance:
    Type: AWS::EC2::Instance
    Properties: 
      ImageId: !Ref EC2Image
      InstanceType: t3.nano
      IamInstanceProfile: !Ref ReportsQueriesIamProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeviceIndex: 0
          GroupSet: [!GetAtt ReportQueriesSecurityGroup.GroupId]
          SubnetId:
            Fn::ImportValue:
              !Sub '${NetworkStackName}-PrivateSubnetId1'
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 10
      UserData:
        Fn::Base64: !Sub |
            #!/bin/bash -xe
            sudo yum install git postgresql jq -y
            sudo mkdir /home/ec2-user/queries-deploy/
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, reports-queries]]

  ReportsQueriesIamProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: ReportsQueriesIamRole
        
  ReportsQueriesIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: ec2.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref ReportsQueriesSecret

  ReportQueriesSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, reports-queries]]
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"

  AllowReportsQueriesToRedshift:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from reports-queries-instance
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - RedshiftStack
          - Outputs.RedshiftSecurityGroupIdExport
      FromPort: 5439
      ToPort: 5439
      SourceSecurityGroupId: !GetAtt ReportQueriesSecurityGroup.GroupId

Outputs:

  RedshiftSecurityGroupIdExport:
    Description: The security group id of the Redshift
    Value:
      Fn::GetAtt:
        - RedshiftStack
        - Outputs.RedshiftSecurityGroupIdExport
    Export:
      Name: !Sub ${AWS::StackName}-RedshiftSecurityGroupId

  Pesonet20PostGlueUpsertLambdaArn:
    Description: ARN of Pesonet20 Post Glue Upsert Lambda
    Value: !GetAtt Pesonet20PostGlueUpsertLambda.Arn
    Export:
      Name: !Sub ${AWS::StackName}-Pesonet20PostGlueUpsertLambdaArn
