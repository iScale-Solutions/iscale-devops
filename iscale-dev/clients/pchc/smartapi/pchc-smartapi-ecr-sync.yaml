AWSTemplateFormatVersion: 2010-09-09
Description: >-
  PCHC SmartAPI/SmartPortal ECR cross-region image sync.
  Thin wrapper around common/ecr-sync.yaml with SmartAPI-specific defaults.
  Deploy in the live (source) region only.

Parameters:
  OrgName:
    Type: String
    Default: pchc
  SourceSmartAPIRepo:
    Type: String
    Default: pchc-prd-ase1-smartapi-prereq-ecr
  SourceSmartPortalRepo:
    Type: String
    Default: pchc-prd-ase1-smartportal-prereq-ecr
  DRRegion:
    Type: String
    Default: us-east-2
  DRAccountId:
    Type: String
    Default: ''
  DRSmartAPIRepo:
    Type: String
    Default: pchc-tdr-ue2-smartapi-prereq-ecr
  DRSmartPortalRepo:
    Type: String
    Default: pchc-tdr-ue2-smartportal-prereq-ecr
  LogRetentionDays:
    Type: Number
    Default: 90

Resources:

  ECRSync:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/ecr-sync.yaml
      Parameters:
        Name: smartapi
        OrgName: !Ref OrgName
        SourceRepos: !Sub '${SourceSmartAPIRepo},${SourceSmartPortalRepo}'
        SourceRepoPrefix: !Sub '${OrgName}-prd-ase1-smartapi'
        DRRegion: !Ref DRRegion
        DRAccountId: !Ref DRAccountId
        DRRepos: !Sub '${DRSmartAPIRepo},${DRSmartPortalRepo}'
        LogRetentionDays: !Ref LogRetentionDays

Outputs:
  ECRSyncProjectName:
    Value: !GetAtt ECRSync.Outputs.ECRSyncProjectName
  ECRSyncProjectArn:
    Value: !GetAtt ECRSync.Outputs.ECRSyncProjectArn
  ECRPushEventRuleArn:
    Value: !GetAtt ECRSync.Outputs.ECRPushEventRuleArn
