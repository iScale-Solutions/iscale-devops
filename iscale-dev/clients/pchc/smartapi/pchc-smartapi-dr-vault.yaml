AWSTemplateFormatVersion: 2010-09-09
Description: >-
  PCHC SmartAPI DocDB Elastic DR backup vault.
  Thin wrapper around common/dr-backup-vault.yaml with SmartAPI-specific defaults.
  Deploy ONCE in us-west-2 BEFORE the live-region prereq stack — the prereq
  backup plan's CopyAction writes recovery points to the vault created here.

Parameters:

  OrgName:
    Type: String
    Default: pchc

  EnvName:
    Type: String
    Default: ProductionDR
    AllowedValues:
      - ProductionDR
      - StagingDR
      - DevelopmentDR
      - TestDR

  EncryptionKeyArn:
    Description: Optional KMS CMK ARN (multi-region key replica in us-west-2).
    Type: String
    Default: ''

Resources:

  DRVault:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/dr-backup-vault.yaml
      Parameters:
        Name: smartapi-docdb
        OrgName: !Ref OrgName
        EnvName: !Ref EnvName
        EncryptionKeyArn: !Ref EncryptionKeyArn

Outputs:

  DRVaultName:
    Description: Vault name — pass as DRVaultName to the live-region prereq stack.
    Value: !GetAtt DRVault.Outputs.DRVaultName

  DRVaultArn:
    Description: Full ARN of the DR backup vault.
    Value: !GetAtt DRVault.Outputs.DRVaultArn
