AWSTemplateFormatVersion: 2010-09-09
Description: ECS Fargate for PCHC SmartPortal (FRONTEND)

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
          - SmartApiStackName
          - EcrArnName
      - Label:
          default: Load Balancer Configuration
        Parameters:
          - ClientDomainName
          - LoadBalancerHostName
          - LoadBalancerCertificateArn
      - Label:
          default: Containers Configuration
        Parameters:
          - MinContainers
          - MaxContainers
          - AutoScalingTargetValue
          - ContainerImageUri
          # - EnvBucket
          - ContainerPort
      - Label:
          default: Disaster Recovery
        Parameters:
          - DeployPaidResources

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      NetworkStackName:
        default: Network Stack Name
      SNSStackName:
        default: SNS Topic Stack Name
      SmartApiStackName:
        default: Smartapi Stack Name
      EcrArnName:
        default: ARN of the ECR
      ClientDomainName:
        default: Domain Name
      LoadBalancerHostName:
        default: Load Balancer Host Name
      LoadBalancerCertificateArn:
        default: Load Balancer SSL Certificate ARN
      MinContainers:
        default: Minimum Running Containers
      MaxContainers:
        default: Maximum Running Containers
      AutoScalingTargetValue:
        default: Target Scaling Value
      ContainerImageUri:
        default: Container Image URI
      # EnvBucket:
      #   default: Env Bucket Name
      ContainerPort:
        default: Container Port
      DeployPaidResources:
        default: Deploy Paid Resources (false = DR standby, true = active/failover)

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 15
    Default: 'smartportal'
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: pchc
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
      - ProductionDR
      - StagingDR
      - DevelopmentDR
      - TestDR
  NetworkStackName:
    Description: The name of the network stack.
    Type: String
    Default: 'pchc-test-ase1-smartapi-network'
    MinLength: 1
  SNSStackName:
    Description: The name of the SNS stack.
    Type: String
    Default: 'pchc-dev-ase1-sns'
    MinLength: 1
  SmartApiStackName:
    Description: The name of the Smartapi stack.
    Type: String
    Default: 'pchc-test-ase1-smartapi'
    MinLength: 1
  EcrArnName:
    Description: The ARN of the ECR.
    Type: String
    Default: 'arn:aws:ecr:ap-southeast-1:050821737631:repository/pchc-test-ase1-smartportal-prereq-ecr'
    MinLength: 1
  ClientDomainName:
    Description: The client's domain name (e.g. example.com, iscale-software.com).
    Type: String
    AllowedPattern: ^[a-z0-9]+([\-\.]{1}[a-z0-9]+)*\.[a-z]{2,7}$
    Default: pchcdev.com
    MinLength: 1
  LoadBalancerHostName:
    Description: (Optional) Custom Hostname for load balancer URL
    Type: String
    Default: ''
    MaxLength: 18
  LoadBalancerCertificateArn:
    Description: SSL Certificate ARN for the ELB
    Type: String
    Default: arn:aws:acm:us-west-2:050821737631:certificate/715bd527-40f0-4b1c-9da6-5880131ac2a9
  MinContainers:
    Description: Minimum running containers.
    Type: Number
    Default: 0
  MaxContainers:
    Description: Maximum running containers. 
    Type: Number
    Default: 40
  AutoScalingTargetValue:
    Description: Target percentage value for scaling. 
    Type: Number
    Default: 60
  ContainerImageUri:
    Type: String
    Description: URI of image of the api pushed to ECR
    Default: '050821737631.dkr.ecr.ap-southeast-1.amazonaws.com/pchc-test-ase1-smartportal-prereq-ecr:latest'
  # EnvBucket:
  #   Type: String
  #   Description: Bucket name where env file is stored
  #   Default: 'pchc-test-ase1-smartportal-prereq-env-bucket'
  ContainerPort:
    Type: Number
    Default: 80
  DeployPaidResources:
    Description: |
      true (default): Deploy all paid resources — ALB and DNS. Normal operation.
      false: DR standby mode — suppress ALB and DNS. ECS service stays deployed with 0 containers.
      DR failover: set back to true to activate ALB, DNS, and full ECS service.
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasSubDomainName: !Not [!Equals [!Ref LoadBalancerHostName, '']]
  IsDeployPaidResources: !Equals [!Ref DeployPaidResources, 'true']
  IsDR: !Or
    - !Equals [!Ref EnvName, ProductionDR]
    - !Equals [!Ref EnvName, StagingDR]
    - !Equals [!Ref EnvName, DevelopmentDR]
    - !Equals [!Ref EnvName, TestDR]

Resources:

###
# Load Balancer Stack
###

  ELBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/loadbalancer.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        CertificateArn: !Ref LoadBalancerCertificateArn
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName
        SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
        HealthCheckTimeoutSeconds: 3
        HealthyThresholdCount: 2
        UnhealthyThresholdCount: 2
        HealthCheckIntervalSeconds: 5
        TargetType: ip
        HealthCheckPath: /
        IdleTimeout: 60
        XForwardedForHeader: preserve
        PreserveHostHeader: true
        TgStickinessEnable: true
        TgStickinessType: app_cookie
        TgStickinessAppCookieName: pchc
        TgStickinessAppCookieDuration: 86400
        TgDeregistrationDelay: 5
        DeployPaidResources: !Ref DeployPaidResources

###
# FRONTEND SECTION (SMART PORTAL)
###

# Role needed by ECS
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      # RoleName: !Join ["", [!Ref Name, ExecutionRole]] # change name or make it not friendly
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: EnvBucketAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # - Effect: Allow
              #   Action: 
              #     - s3:*
              #     - s3-object-lambda:*
              #   Resource:
              #     - !Join ['', ['arn:aws:s3:::', !Ref EnvBucket]]
              #     - !Join ['', ["arn:aws:s3:::", !Ref EnvBucket, '/*']]
              - Effect: Allow
                Action: 
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
        - "arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceRole"

# ECS Task Role for containers
# attach permissions if containers/tasks need to access to some AWS services like s3, sqs, etc.
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com

# ECS Task Definition
  ECSTaskDefinition:
    DependsOn:
      - ELBStack
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, taskdef]]
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Memory: 2048
      Cpu: 1024
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, container]]
          PortMappings:
            - ContainerPort: !Ref ContainerPort
          Essential: true
          # EnvironmentFiles:
          #   - Value: !Join ['', ['arn:aws:s3:::', !Ref EnvBucket, /uat.env]]
          #     Type: "s3"
          Image: !Ref ContainerImageUri
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: ecs

  # ECS Fargate Service
  ECSService:
    DependsOn:
      - ELBStack
    Type: AWS::ECS::Service
    Properties: 
      ServiceName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, service]]
      Cluster:
       Fn::ImportValue:
        !Sub '${SmartApiStackName}-EcsClusterName'
      TaskDefinition: !GetAtt ECSTaskDefinition.TaskDefinitionArn
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      DesiredCount: !If [IsDR, 0, 1]
      # This may need to be adjusted if the container takes a while to start up
      HealthCheckGracePeriodSeconds: 10
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - Fn::ImportValue:
                !Sub "${NetworkStackName}-PrivateSubnetId1"
            - Fn::ImportValue:
                !Sub "${NetworkStackName}-PrivateSubnetId2"
          SecurityGroups:
            - !Ref ContainerSecurityGroup0
      LoadBalancers: !If
        - IsDeployPaidResources
        - - ContainerName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, container]]
            ContainerPort: !Ref ContainerPort
            TargetGroupArn:
              Fn::GetAtt:
                - ELBStack
                - Outputs.ApplicationTargetGroup
        - !Ref 'AWS::NoValue'

  # Container security group
  ContainerSecurityGroup0:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SecurityGroup for ECS Frontend
      GroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, container-sg]]
      VpcId: 
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      SecurityGroupIngress:
        - FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          IpProtocol: tcp
          # CidrIp: 0.0.0.0/0
          SourceSecurityGroupId:
            Fn::GetAtt:
              - ELBStack
              - Outputs.SecurityGroupId

###
# Auto scaling Section
###

  # Auto scaling role
  ECSAutoScalingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: [application-autoscaling.amazonaws.com]
            Action: ["sts:AssumeRole"]
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceAutoscaleRole"

  # Auto scaling targets
  ECSAutoScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MinCapacity: !Ref MinContainers
      MaxCapacity: !Ref MaxContainers
      ResourceId:
        Fn::Join:
          - '/'
          - - service
            - Fn::ImportValue:
                !Sub '${SmartApiStackName}-EcsClusterName'
            - !GetAtt ECSService.Name
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      RoleARN: !GetAtt ECSAutoScalingRole.Arn

  # Auto scaling policy
  ECSAutoScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Join ['', [!Ref Name, AutoScalingPolicy]]
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ECSAutoScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleInCooldown: 10
        ScaleOutCooldown: 10
        TargetValue: !Ref AutoScalingTargetValue

###
# CloudWatch Section
###

  # ECS Log group
  ECSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['', [/ecs/, !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '-', !Ref Name, '-taskdef']]

###
# Route53 Section
###

  # Add DNS record for the frontend portal
  DNSRecord:
    Condition: IsDeployPaidResources
    DependsOn:
      - ELBStack
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneName: !Join ['', [!Ref ClientDomainName, '.']]
      Comment: !Join ['', [Domain Name Record for, !Ref Name]]
      RecordSets:
        - Name: !If
            - HasSubDomainName
            - !Join ['.', [!Ref LoadBalancerHostName, !Ref ClientDomainName]]
            - !Join ['', [!Ref Name, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '.', !Ref ClientDomainName]]
          Type: A
          AliasTarget:
            HostedZoneId:
              Fn::GetAtt:
                - ELBStack
                - Outputs.CanonicalHostedZoneID
            DNSName:
              Fn::GetAtt:
                - ELBStack
                - Outputs.DNSName

# Attach Policy to an existing ECS Deployment user group

  AttachPolicyToDeploymentUserGroup:
    Description: Attach additional policies to a deployment user group
    Type: AWS::IAM::Policy
    Properties:
      Groups:
        - Fn::ImportValue:
            !Sub "${SmartApiStackName}-EcsDeploymentUserGroup"
      PolicyName: EcsDeploySmartPortal
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: RunTask
            Effect: Allow
            Action: ecs:RunTask
            Resource:
              - !Join ['', ['arn:aws:ecs:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':task-definition/', !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, taskdef*]]]]
          - Sid: PassRolesInTaskDefinition
            Effect: Allow
            Action:
              - iam:PassRole
            Resource:
              - !GetAtt ECSTaskRole.Arn
              - !GetAtt ExecutionRole.Arn
          - Sid: DeployService
            Effect: Allow
            Action:
              - ecs:UpdateService
              - ecs:DescribeServices
            Resource:
              - !Ref ECSService
          
Outputs:
  ApplicationLoadBalancerDNSName:
    Condition: IsDeployPaidResources
    Description: DNS name of the Application Load Balancer
    Value:
      Fn::GetAtt:
        - ELBStack
        - Outputs.DNSName

  Endpoint:
    Condition: IsDeployPaidResources
    Description: Endpoint URL
    Value: !Join ['', ['https://', !Ref DNSRecord]]

  Region:
    Description: The region where this stack is deployed.
    Value: !Ref 'AWS::Region'

  EcsServiceName:
    Description: ECS Service name
    Value: !GetAtt ECSService.Name
  
  EcsTaskDefinition:
    Description: ECS Task Definition Family
    Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, taskdef]]
  
  EcsContainerName:
    Description: ECS Container name
    Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, container]]

  ECSClusterName:
    Description: ECS Cluster name (re-exported from SmartAPI stack for DR engine lookup)
    Value:
      Fn::ImportValue: !Sub '${SmartApiStackName}-EcsClusterName'
    Export:
      Name: !Sub ${AWS::StackName}-EcsClusterName
