AWSTemplateFormatVersion: 2010-09-09
Description: PCHC SmartAPI/SmartPortal ECR repository and env bucket

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - SmartPortalName
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
      - Label:
          default: DocumentDB Configuration
        Parameters:
          - ClusterType
          - ShardCapacity
          - ShardCount
          - ShardInstanceCount
      - Label:
          default: Disaster Recovery
        Parameters:
          - DeployPaidResources
          - EnableBackup
      - Label:
          default: Backup Configuration
        Parameters:
          - DRRegion
          - SourceSnapshotRetentionDays
          - DRSnapshotRetentionDays

    ParameterLabels:
      Name:
        default: Resource Name
      SmartPortalName:
        default: Smart Portal Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      DeployPaidResources:
        default: Deploy Paid Resources (false = DR standby, true = active/failover)
      EnableBackup:
        default: Enable DocDB Elastic snapshot Lambda (true = live region only, false = DR region)
      DRRegion:
        default: DR Region
      SourceSnapshotRetentionDays:
        default: Snapshot Retention in source region (days)
      DRSnapshotRetentionDays:
        default: Snapshot Retention in DR region (days)

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 20
    Default: 'smartapi-prereq'
  SmartPortalName:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 20
    Default: 'smartportal-prereq'
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: pchc
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
      - ProductionDR
      - StagingDR
      - DevelopmentDR
      - TestDR
  NetworkStackName:
    Description: The name of the network stack.
    Type: String
    Default: 'pchc-test-ase1-smartapi-network'
    MinLength: 1
  SNSStackName:
    Description: The name of the SNS stack.
    Type: String
    Default: 'pchc-dev-ase1-sns'
    MinLength: 1
  ClusterType:
    Description: DocumentDB cluster type.
    Type: String
    Default: elastic
    AllowedValues:
      - instance
      - elastic
  ShardCapacity:
    Description: The number of vCPUs assigned to each elastic cluster shard. 
    Type: Number
    Default: 2
    AllowedValues: [2, 4, 8, 16, 32, 64]
  ShardCount:
    Description: The number of shards assigned to the elastic cluster.
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 32
    ConstraintDescription: Maximum is 32.
  ShardInstanceCount:
    Description: 'The number of replica instances applying to all shards in the cluster. A shardInstanceCount value of 1 means there is one writer instance, and any additional instances are replicas that can be used for reads and to improve availability.'
    Type: Number
    Default: 1
  DeployPaidResources:
    Description: |
      true (default): Deploy all paid resources — DocumentDB and S3 buckets. Normal operation for all environments.
      false: DR standby mode — suppress paid resources to minimize idle cost. Only ECR repositories stay deployed.
      DR failover: set back to true to restore DocumentDB from a cross-region snapshot.
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  EnableBackup:
    Description: |
      true (default): Deploy the hourly DocDB Elastic snapshot Lambda. Set to true only in the LIVE region.
      false: Skip all backup resources. Always set this to false when deploying in the DR region.
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  DRRegion:
    Description: AWS region to copy DocDB Elastic snapshots to (DR region).
    Type: String
    Default: us-west-2

  SourceSnapshotRetentionDays:
    Description: Days to retain hourly snapshots in the source region (2 days = 48 recovery points).
    Type: Number
    Default: 2

  DRSnapshotRetentionDays:
    Description: Days to retain copied snapshots in the DR region.
    Type: Number
    Default: 30

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  IsDeployPaidResources: !Equals [!Ref DeployPaidResources, 'true']
  IsEnableBackup: !And
    - Condition: IsDeployPaidResources
    - !Equals [!Ref EnableBackup, 'true']
  IsNotProdAndDeployPaidResources: !And
    - Condition: IsNotProd
    - Condition: IsDeployPaidResources

Resources:

###
# ECR smartapi
###

  ECR:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: false
      EncryptionConfiguration: 
        EncryptionType: AES256
      ImageScanningConfiguration: 
        ScanOnPush: true
      ImageTagMutability: MUTABLE # MUTABLE=overwritten, IMMUTABLE=not
      # LifecyclePolicy: 
      #   LifecyclePolicy
      RepositoryName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, ecr]]
      # RepositoryPolicyText: Json
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, ecr]]

###
# ECR smartportal
###

  ECRSmartPortal:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: false
      EncryptionConfiguration: 
        EncryptionType: AES256
      ImageScanningConfiguration: 
        ScanOnPush: true
      ImageTagMutability: MUTABLE # MUTABLE=overwritten, IMMUTABLE=not
      # LifecyclePolicy: 
      #   LifecyclePolicy
      RepositoryName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref SmartPortalName, ecr]]
      # RepositoryPolicyText: Json
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref SmartPortalName, ecr]]

###
# S3 smartapi
###

  DataS3Bucket:
    Type: AWS::S3::Bucket
    # This will become an issue if the stack is removed, then recreated. If retained, the bucket name will collide with the next instance of the stack
    # Recommend not specifying bucket name here for non-prod setups
    DeletionPolicy: Retain
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, env-bucket]]
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 3
          Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, env-bucket]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

###
# S3 smartportal
###

  DataS3BucketSmartPortal:
    Type: AWS::S3::Bucket
    # This will become an issue if the stack is removed, then recreated. If retained, the bucket name will collide with the next instance of the stack
    # Recommend not specifying bucket name here for non-prod setups
    DeletionPolicy: Retain
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref SmartPortalName, env-bucket]]
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 3
          Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref SmartPortalName, env-bucket]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName
###
# Document DB Section
###

  DocumentDBStack:
    Condition: IsDeployPaidResources
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/docdb-database.yaml
      Parameters:
        Name: !Select [0, !Split ["-", !Ref Name]] # smartapi-prereq = [smartapi, prereq]
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        ClusterType: !Ref ClusterType #instance | elastic
        BackupRetentionPeriod: !If [IsProd, 30, 7]
        ShardCapacity: !Ref ShardCapacity
        ShardCount: !Ref ShardCount
        ShardInstanceCount: !Ref ShardInstanceCount
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName

# allow jumpserver to docuDB

  AllowJumphostToDocumentDB:
    Condition: IsNotProdAndDeployPaidResources
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from Jumphost to Document DB
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - DocumentDBStack
          - Outputs.DocuDBElasticSecurityGroup
      FromPort: 27017
      ToPort: 27017
      SourceSecurityGroupId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-JumpHostSecurityGroupId'

###
# DocDB Elastic Snapshot Lambda Section
# AWS Backup does not support docdb-elastic resources — native API snapshots via Lambda instead.
###

  SnapshotLambdaRole:
    Condition: IsEnableBackup
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DocDBElasticSnapshotPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - docdb-elastic:CreateClusterSnapshot
                  - docdb-elastic:CopyClusterSnapshot
                  - docdb-elastic:DeleteClusterSnapshot
                  - docdb-elastic:GetClusterSnapshot
                  - docdb-elastic:ListClusterSnapshots
                Resource: !Sub arn:aws:docdb-elastic:*:${AWS::AccountId}:*

  SnapshotLambdaLogGroup:
    Condition: IsEnableBackup
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-docdb-snapshot
      RetentionInDays: 30

  SnapshotLambda:
    Condition: IsEnableBackup
    Type: AWS::Lambda::Function
    DependsOn: SnapshotLambdaLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-docdb-snapshot
      Handler: index.handler
      Runtime: python3.12
      Timeout: 300
      Role: !GetAtt SnapshotLambdaRole.Arn
      Environment:
        Variables:
          CLUSTER_ARN: !GetAtt DocumentDBStack.Outputs.DocuDBElasticClusterARN
          DR_REGION: !Ref DRRegion
          SOURCE_RETENTION_DAYS: !Ref SourceSnapshotRetentionDays
          DR_RETENTION_DAYS: !Ref DRSnapshotRetentionDays
          SNAPSHOT_PREFIX: !Sub ${AWS::StackName}-hourly
      Code:
        ZipFile: |
          import boto3, os, re
          from datetime import datetime, timezone, timedelta
          from botocore.exceptions import ClientError

          def handler(event, context):
              cluster_arn = os.environ['CLUSTER_ARN']
              dr_region = os.environ['DR_REGION']
              src_days = int(os.environ['SOURCE_RETENTION_DAYS'])
              dr_days = int(os.environ['DR_RETENTION_DAYS'])
              prefix = os.environ['SNAPSHOT_PREFIX']
              src = boto3.client('docdb-elastic')
              dr = boto3.client('docdb-elastic', region_name=dr_region)
              now = datetime.now(timezone.utc)

              name = '{}-{}'.format(prefix, now.strftime('%Y%m%d-%H00'))
              try:
                  src.create_cluster_snapshot(clusterArn=cluster_arn, snapshotName=name)
                  print('Created snapshot: {}'.format(name))
              except ClientError as e:
                  if e.response['Error']['Code'] != 'ConflictException':
                      raise

              for snap in _list_snapshots(src, cluster_arn):
                  if snap['status'] == 'AVAILABLE' and snap['snapshotName'].startswith(prefix):
                      try:
                          dr.copy_cluster_snapshot(
                              snapshotArn=snap['snapshotArn'],
                              snapshotName=snap['snapshotName'],
                              copyTags=True
                          )
                          print('Copied to DR: {}'.format(snap['snapshotName']))
                      except ClientError as e:
                          if e.response['Error']['Code'] != 'ConflictException':
                              print('Copy failed for {}: {}'.format(snap['snapshotName'], e))

              cutoff = now - timedelta(days=src_days)
              for snap in _list_snapshots(src, cluster_arn):
                  dt = _parse_date(snap['snapshotName'], prefix)
                  if dt and dt < cutoff:
                      try:
                          src.delete_cluster_snapshot(snapshotArn=snap['snapshotArn'])
                          print('Deleted source: {}'.format(snap['snapshotName']))
                      except ClientError:
                          pass

              cutoff_dr = now - timedelta(days=dr_days)
              for snap in _list_snapshots(dr):
                  if snap['snapshotName'].startswith(prefix):
                      dt = _parse_date(snap['snapshotName'], prefix)
                      if dt and dt < cutoff_dr:
                          try:
                              dr.delete_cluster_snapshot(snapshotArn=snap['snapshotArn'])
                              print('Deleted DR: {}'.format(snap['snapshotName']))
                          except ClientError:
                              pass

          def _list_snapshots(client, cluster_arn=None):
              kwargs = {}
              if cluster_arn:
                  kwargs['clusterArn'] = cluster_arn
              result = []
              while True:
                  resp = client.list_cluster_snapshots(**kwargs)
                  result.extend(resp.get('snapshots', []))
                  token = resp.get('nextToken')
                  if not token:
                      break
                  kwargs['nextToken'] = token
              return result

          def _parse_date(name, prefix):
              m = re.search(r'(\d{8}-\d{4})', name)
              if m:
                  try:
                      return datetime.strptime(m.group(1), '%Y%m%d-%H%M').replace(tzinfo=timezone.utc)
                  except ValueError:
                      pass
              return None

  SnapshotScheduleRule:
    Condition: IsEnableBackup
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-docdb-snapshot-hourly
      ScheduleExpression: cron(0 * * * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt SnapshotLambda.Arn
          Id: DocDBSnapshotTarget

  SnapshotSchedulePermission:
    Condition: IsEnableBackup
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SnapshotLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SnapshotScheduleRule.Arn

  SnapshotFailureAlarm:
    Condition: IsEnableBackup
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-docdb-snapshot-errors
      AlarmDescription: >-
        DocDB Elastic snapshot Lambda reported errors. Each missed hourly run
        increases effective RPO by 1 hour. Check CloudWatch Logs for details.
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref SnapshotLambda
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub ${SNSStackName}-TopicArn

Outputs:
  EcrName:
    Description: DNS name of the Application Load Balancer
    Value: !Ref ECR
    Export:
      Name: !Sub ${AWS::StackName}-EcrName

  EcrArnName:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt ECR.Arn
    Export:
      Name: !Sub ${AWS::StackName}-EcrArnName
  
  EcrSmartPortalArnName:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt ECRSmartPortal.Arn
    Export:
      Name: !Sub ${AWS::StackName}-EcrSmartPortalArnName

  S3Name:
    Description: Endpoint URL
    Value: !Ref DataS3Bucket
    Export:
      Name: !Sub ${AWS::StackName}-S3Name

  S3SmartPortalName:
    Description: Endpoint URL
    Value: !Ref DataS3BucketSmartPortal
    Export:
      Name: !Sub ${AWS::StackName}-S3SmartPortalName

  DocumentDBStackName:
    Condition: IsDeployPaidResources
    Description: DocumentDB stack name
    Value: !Ref DocumentDBStack
    Export:
      Name: !Sub ${AWS::StackName}-DocumentDBStackName

  DocuDBElasticSecurityGroup:
    Condition: IsDeployPaidResources
    Description: DocumentDB elastic security group
    Value: !GetAtt DocumentDBStack.Outputs.DocuDBElasticSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-DocuDBElasticSecurityGroup

  SnapshotLambdaArn:
    Condition: IsEnableBackup
    Description: ARN of the Lambda that creates and copies hourly DocDB Elastic snapshots.
    Value: !GetAtt SnapshotLambda.Arn
    Export:
      Name: !Sub ${AWS::StackName}-SnapshotLambdaArn

