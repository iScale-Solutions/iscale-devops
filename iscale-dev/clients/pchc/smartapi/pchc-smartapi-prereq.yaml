AWSTemplateFormatVersion: 2010-09-09
Description: PCHC SmartAPI/SmartPortal ECR repository and env bucket

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - SmartPortalName
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
      - Label:
          default: DocumentDB Configuration
        Parameters:
          - ClusterType
          - ShardCapacity
          - ShardCount
          - ShardInstanceCount
      - Label:
          default: Disaster Recovery
        Parameters:
          - DeployPaidResources
          - EnableBackup
      - Label:
          default: Backup Configuration
        Parameters:
          - DRRegion
          - DRVaultName
          - ThirtyMinScheduleExpression
          - DailyScheduleExpression
          - ThirtyMinRetentionDays
          - DailyRetentionDays
          - DRThirtyMinRetentionDays
          - DRDailyRetentionDays

    ParameterLabels:
      Name:
        default: Resource Name
      SmartPortalName:
        default: Smart Portal Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      DeployPaidResources:
        default: Deploy Paid Resources (false = DR standby, true = active/failover)
      EnableBackup:
        default: Enable AWS Backup (true = live region only, false = DR region)
      DRRegion:
        default: DR Region
      DRVaultName:
        default: DR Backup Vault Name (must pre-exist in DR region)
      ThirtyMinScheduleExpression:
        default: 30-Minute Backup Schedule (cron)
      DailyScheduleExpression:
        default: Daily Backup Schedule (cron)
      ThirtyMinRetentionDays:
        default: 30-Min Backup Retention in source region (days)
      DailyRetentionDays:
        default: Daily Backup Retention in source region (days)
      DRThirtyMinRetentionDays:
        default: 30-Min Backup Retention in DR region (days)
      DRDailyRetentionDays:
        default: Daily Backup Retention in DR region (days)

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 20
    Default: 'smartapi-prereq'
  SmartPortalName:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 20
    Default: 'smartportal-prereq'
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: pchc
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
      - ProductionDR
      - StagingDR
      - DevelopmentDR
      - TestDR
  NetworkStackName:
    Description: The name of the network stack.
    Type: String
    Default: 'pchc-test-ase1-smartapi-network'
    MinLength: 1
  SNSStackName:
    Description: The name of the SNS stack.
    Type: String
    Default: 'pchc-dev-ase1-sns'
    MinLength: 1
  ClusterType:
    Description: DocumentDB cluster type.
    Type: String
    Default: elastic
    AllowedValues:
      - instance
      - elastic
  ShardCapacity:
    Description: The number of vCPUs assigned to each elastic cluster shard. 
    Type: Number
    Default: 2
    AllowedValues: [2, 4, 8, 16, 32, 64]
  ShardCount:
    Description: The number of shards assigned to the elastic cluster.
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 32
    ConstraintDescription: Maximum is 32.
  ShardInstanceCount:
    Description: 'The number of replica instances applying to all shards in the cluster. A shardInstanceCount value of 1 means there is one writer instance, and any additional instances are replicas that can be used for reads and to improve availability.'
    Type: Number
    Default: 1
  DeployPaidResources:
    Description: |
      true (default): Deploy all paid resources — DocumentDB and S3 buckets. Normal operation for all environments.
      false: DR standby mode — suppress paid resources to minimize idle cost. Only ECR repositories stay deployed.
      DR failover: set back to true to restore DocumentDB from a cross-region snapshot.
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  EnableBackup:
    Description: |
      true (default): Create AWS Backup vault, plan, and selection for DocDB Elastic. Set to true only in the LIVE region.
      false: Skip all backup resources. Always set this to false when deploying in the DR region — the CopyAction
             destination is a different region, so running backup from DR would copy within the same region and fail.
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  DRRegion:
    Description: AWS region to replicate DocDB Elastic backups to (DR region).
    Type: String
    Default: us-west-2

  DRVaultName:
    Description: >-
      Name of the backup vault in the DR region that receives copied recovery points.
      Must pre-exist before this stack is deployed. The Default vault is available
      in every region automatically.
    Type: String
    Default: Default

  ThirtyMinScheduleExpression:
    Description: Cron expression for the 30-minute incremental backup rule.
    Type: String
    Default: cron(0,30 * * * ? *)

  DailyScheduleExpression:
    Description: Cron expression for the daily backup rule (long-retention anchor).
    Type: String
    Default: cron(0 2 ? * * *)

  ThirtyMinRetentionDays:
    Description: Days to retain 30-minute recovery points in the source region. 2 days = 96 recovery points.
    Type: Number
    Default: 2

  DailyRetentionDays:
    Description: Days to retain daily recovery points in the source region.
    Type: Number
    Default: 30

  DRThirtyMinRetentionDays:
    Description: Days to retain 30-minute recovery points in the DR region.
    Type: Number
    Default: 3

  DRDailyRetentionDays:
    Description: Days to retain daily recovery points in the DR region.
    Type: Number
    Default: 30

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  IsDeployPaidResources: !Equals [!Ref DeployPaidResources, 'true']
  IsEnableBackup: !And
    - Condition: IsDeployPaidResources
    - !Equals [!Ref EnableBackup, 'true']
  IsNotProdAndDeployPaidResources: !And
    - Condition: IsNotProd
    - Condition: IsDeployPaidResources

Resources:

###
# ECR smartapi
###

  ECR:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: false
      EncryptionConfiguration: 
        EncryptionType: AES256
      ImageScanningConfiguration: 
        ScanOnPush: true
      ImageTagMutability: MUTABLE # MUTABLE=overwritten, IMMUTABLE=not
      # LifecyclePolicy: 
      #   LifecyclePolicy
      RepositoryName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, ecr]]
      # RepositoryPolicyText: Json
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, ecr]]

###
# ECR smartportal
###

  ECRSmartPortal:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: false
      EncryptionConfiguration: 
        EncryptionType: AES256
      ImageScanningConfiguration: 
        ScanOnPush: true
      ImageTagMutability: MUTABLE # MUTABLE=overwritten, IMMUTABLE=not
      # LifecyclePolicy: 
      #   LifecyclePolicy
      RepositoryName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref SmartPortalName, ecr]]
      # RepositoryPolicyText: Json
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref SmartPortalName, ecr]]

###
# S3 smartapi
###

  DataS3Bucket:
    Type: AWS::S3::Bucket
    # This will become an issue if the stack is removed, then recreated. If retained, the bucket name will collide with the next instance of the stack
    # Recommend not specifying bucket name here for non-prod setups
    DeletionPolicy: Retain
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, env-bucket]]
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 3
          Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, env-bucket]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

###
# S3 smartportal
###

  DataS3BucketSmartPortal:
    Type: AWS::S3::Bucket
    # This will become an issue if the stack is removed, then recreated. If retained, the bucket name will collide with the next instance of the stack
    # Recommend not specifying bucket name here for non-prod setups
    DeletionPolicy: Retain
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref SmartPortalName, env-bucket]]
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 3
          Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref SmartPortalName, env-bucket]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName
###
# Document DB Section
###

  DocumentDBStack:
    Condition: IsDeployPaidResources
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/docdb-database.yaml
      Parameters:
        Name: !Select [0, !Split ["-", !Ref Name]] # smartapi-prereq = [smartapi, prereq]
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        ClusterType: !Ref ClusterType #instance | elastic
        BackupRetentionPeriod: !If [IsProd, 30, 7]
        ShardCapacity: !Ref ShardCapacity
        ShardCount: !Ref ShardCount
        ShardInstanceCount: !Ref ShardInstanceCount
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName

# allow jumpserver to docuDB

  AllowJumphostToDocumentDB:
    Condition: IsNotProdAndDeployPaidResources
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from Jumphost to Document DB
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - DocumentDBStack
          - Outputs.DocuDBElasticSecurityGroup
      FromPort: 27017
      ToPort: 27017
      SourceSecurityGroupId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-JumpHostSecurityGroupId'

###
# AWS Backup Section
###

  BackupVault:
    Condition: IsEnableBackup
    Type: AWS::Backup::BackupVault
    DeletionPolicy: Retain
    Properties:
      BackupVaultName: !Sub ${AWS::StackName}-docdb-vault
      BackupVaultTags:
        Name: !Sub ${AWS::StackName}-docdb-vault
        Environment: !Ref EnvName
        Organization: !Ref OrgName

  BackupPlan:
    Condition: IsEnableBackup
    Type: AWS::Backup::BackupPlan
    DependsOn: BackupVault
    Properties:
      BackupPlan:
        BackupPlanName: !Sub ${AWS::StackName}-docdb-plan
        BackupPlanRule:
          - RuleName: ThirtyMinBackup
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: !Ref ThirtyMinScheduleExpression
            StartWindowMinutes: 30
            CompletionWindowMinutes: 60
            Lifecycle:
              DeleteAfterDays: !Ref ThirtyMinRetentionDays
            CopyActions:
              - DestinationBackupVaultArn: !Sub arn:aws:backup:${DRRegion}:${AWS::AccountId}:backup-vault:${DRVaultName}
                Lifecycle:
                  DeleteAfterDays: !Ref DRThirtyMinRetentionDays
          - RuleName: DailyBackup
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: !Ref DailyScheduleExpression
            StartWindowMinutes: 120
            CompletionWindowMinutes: 300
            Lifecycle:
              DeleteAfterDays: !Ref DailyRetentionDays
            CopyActions:
              - DestinationBackupVaultArn: !Sub arn:aws:backup:${DRRegion}:${AWS::AccountId}:backup-vault:${DRVaultName}
                Lifecycle:
                  DeleteAfterDays: !Ref DRDailyRetentionDays
      BackupPlanTags:
        Name: !Sub ${AWS::StackName}-docdb-plan
        Environment: !Ref EnvName
        Organization: !Ref OrgName

  BackupRole:
    Condition: IsEnableBackup
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: backup.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores
      Policies:
        - PolicyName: DocDBElasticBackupPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: DocDBElasticOperations
                Effect: Allow
                Action:
                  - docdb-elastic:CreateClusterSnapshot
                  - docdb-elastic:CopyClusterSnapshot
                  - docdb-elastic:DeleteClusterSnapshot
                  - docdb-elastic:GetClusterSnapshot
                  - docdb-elastic:ListClusterSnapshots
                  - docdb-elastic:RestoreClusterFromSnapshot
                  - docdb-elastic:GetCluster
                  - docdb-elastic:ListClusters
                  - docdb-elastic:TagResource
                  - docdb-elastic:UntagResource
                  - docdb-elastic:ListTagsForResource
                Resource: !Sub arn:aws:docdb-elastic:*:${AWS::AccountId}:*

  BackupSelection:
    Condition: IsEnableBackup
    DependsOn: BackupRole
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref BackupPlan
      BackupSelection:
        SelectionName: !Sub ${AWS::StackName}-docdb-selection
        IamRoleArn: !GetAtt BackupRole.Arn
        Resources:
          - !GetAtt DocumentDBStack.Outputs.DocuDBElasticClusterARN

  BackupFailureAlarm:
    Condition: IsEnableBackup
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-docdb-backup-failures
      AlarmDescription: >-
        One or more DocDB Elastic backup jobs failed. Each missed 30-min job
        increases effective RPO by 30 minutes. Check AWS Backup console → Jobs.
      MetricName: NumberOfBackupJobsFailed
      Namespace: AWS/Backup
      Dimensions:
        - Name: BackupVaultName
          Value: !Ref BackupVault
      Statistic: Sum
      Period: 1800
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub ${SNSStackName}-TopicArn

  CopyFailureAlarm:
    Condition: IsEnableBackup
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-docdb-copy-failures
      AlarmDescription: >-
        One or more DocDB Elastic cross-region copy jobs to DR region failed.
        DR recovery points may be stale — verify the DR vault has recent snapshots.
      MetricName: NumberOfCopyJobsFailed
      Namespace: AWS/Backup
      Dimensions:
        - Name: BackupVaultName
          Value: !Ref BackupVault
      Statistic: Sum
      Period: 1800
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub ${SNSStackName}-TopicArn

Outputs:
  EcrName:
    Description: DNS name of the Application Load Balancer
    Value: !Ref ECR
    Export:
      Name: !Sub ${AWS::StackName}-EcrName

  EcrArnName:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt ECR.Arn
    Export:
      Name: !Sub ${AWS::StackName}-EcrArnName
  
  EcrSmartPortalArnName:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt ECRSmartPortal.Arn
    Export:
      Name: !Sub ${AWS::StackName}-EcrSmartPortalArnName

  S3Name:
    Description: Endpoint URL
    Value: !Ref DataS3Bucket
    Export:
      Name: !Sub ${AWS::StackName}-S3Name

  S3SmartPortalName:
    Description: Endpoint URL
    Value: !Ref DataS3BucketSmartPortal
    Export:
      Name: !Sub ${AWS::StackName}-S3SmartPortalName

  DocumentDBStackName:
    Condition: IsDeployPaidResources
    Description: DocumentDB stack name
    Value: !Ref DocumentDBStack
    Export:
      Name: !Sub ${AWS::StackName}-DocumentDBStackName

  DocuDBElasticSecurityGroup:
    Condition: IsDeployPaidResources
    Description: DocumentDB elastic security group
    Value: !GetAtt DocumentDBStack.Outputs.DocuDBElasticSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-DocuDBElasticSecurityGroup

  BackupVaultName:
    Condition: IsEnableBackup
    Description: DocDB Elastic backup vault name in source region.
    Value: !Ref BackupVault
    Export:
      Name: !Sub ${AWS::StackName}-BackupVaultName

  BackupVaultArn:
    Condition: IsEnableBackup
    Description: DocDB Elastic backup vault ARN — use as docdb_backup_vault_name in dr-failover-v2 input.
    Value: !GetAtt BackupVault.BackupVaultArn
    Export:
      Name: !Sub ${AWS::StackName}-BackupVaultArn

  BackupRoleArn:
    Condition: IsEnableBackup
    Description: IAM role ARN for DocDB Elastic backup and restore operations.
    Value: !GetAtt BackupRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-BackupRoleArn

