Resources:

####
# EC2 Section
####

  AkamaiConnectorEC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM
      Policies:
        - PolicyName: WriteCloudWatchLogs
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:CreateLogGroup
                  - logs:PutLogEvents
                Resource: 'arn:aws:logs:*:*:*'
        - PolicyName: AccessCloudWatchMetrics
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - ec2:DescribeTags
                  - autoscaling:DescribeTags
                  - rds:DescribeDBClusters
                  - rds:DescribeDBInstances
                Resource: '*'

  AkamaiConnectorIamInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Roles:
        - !Ref AkamaiConnectorEC2Role

  AkamaiConnectorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Opening everything outbound
      VpcId:
        Fn::ImportValue:
          Fn::Sub: '${PDDTSStackName}-VpcId'
      SecurityGroupEgress:
      - IpProtocol: -1
        FromPort: -1
        ToPort: -1
        CidrIp: 0.0.0.0/0

  AllowConnectorIntoPDDTS:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue:
          !Sub '${PDDTSStackName}-ELBSecurityGroup'
      IpProtocol: TCP
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId:
        !GetAtt AkamaiConnectorSecurityGroup.GroupId
      Description:
        Fn::Sub: 'Allow from ${Name}'

  Ec2Instance:
    Type: AWS::EC2::Instance
    Properties:
      DisableApiTermination: true
      IamInstanceProfile: !Ref AkamaiConnectorIamInstanceProfile
      SecurityGroupIds:
        - Ref: AkamaiConnectorSecurityGroup
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName
      ImageId:
        Fn::FindInMap:
        - RegionMap
        - Ref: AWS::Region
        - AMI
      SubnetId:
        Fn::ImportValue:
          Fn::Sub: '${PDDTSStackName}-PublicSubnetId1'
      InstanceType:
        Ref: InstanceType
      UserData: # unique value in downloaded CF template from Akamai 
        Fn::Base64: 

  AkamaiConnectorHighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, high, cpu]]
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: InstanceId
          Value: !Ref Ec2Instance

###
# Route53
###

  AkamaiDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName:
        Fn::Join:
          - ''
          - - Fn::ImportValue:
                !Sub '${PDDTSStackName}-ClientDomainName'
            - '.'
      Name: !Join
        - '.'
        - - akamai-pddts
          - Fn::ImportValue:
              !Sub '${PDDTSStackName}-ClientDomainName'
      ResourceRecords: 
        - akamai-pddts-pchc-com-ph.go.akamai-access.com
      TTL: 14400
      Type: CNAME
      Comment: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], akamai, pddts]]

  PDDTSDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName:
        Fn::Join:
          - ''
          - - Fn::ImportValue:
                !Sub '${PDDTSStackName}-ClientDomainName'
            - '.'
      Name: !Join
        - '.'
        - - pddts
          - Fn::ImportValue:
              !Sub '${PDDTSStackName}-ClientDomainName'
      ResourceRecords:
        - pddts-pchc-com-ph.go.akamai-access.com
      TTL: 14400
      Type: CNAME
      Comment: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], pddts]]

  PortalDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName:
        Fn::Join:
          - ''
          - - Fn::ImportValue:
                !Sub '${PDDTSStackName}-ClientDomainName'
            - '.'
      Name: !Join
        - '.'
        - - portal
          - Fn::ImportValue:
              !Sub '${PDDTSStackName}-ClientDomainName'
      ResourceRecords: 
        - portal-pchc-com-ph.login.go.akamai-access.com
      TTL: 14400
      Type: CNAME
      Comment: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], portal]]

Outputs:

  InstanceId:
    Description: InstanceId of the newly created EC2 instance
    Value:
      Ref: Ec2Instance

  AZ:
    Description: Availability Zone of the newly created EC2 instance
    Value:
      Fn::GetAtt:
      - Ec2Instance
      - AvailabilityZone