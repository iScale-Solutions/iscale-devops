AWSTemplateFormatVersion: 2010-09-09
Description: PDDTS Resources pchc-prd-ase1-pddts

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
          - DeletionProtection
      - Label:
          default: Load Balancer Configuration
        Parameters:
          - ClientDomainName
          - LoadBalancerCertificateArn
          - LoadBalancerHostName
      - Label:
          default: Instance Configuration
        Parameters:
          - InstanceKeyName
          - InstanceAMI
          - InstanceType
      - Label:
          default: Scheduler Configuration
        Parameters:
          - StartScheduleExpression
          - StopScheduleExpression
      - Label:
          default: Disaster Recovery
        Parameters:
          - DeployPaidResources
          - SnapshotIdentifier
          - DBMasterUserPassword
          - EnableCrossRegionBackupReplication
          - DRRegion
          - EnableCodeDeployReplication
          - SourceDbInstanceArn
          - BackupReplicationRetentionPeriod
          - LiveSecretArn
          - IsPITRMode
          - PITRDBEndpoint
          - ExternalEFSId
          - BackupVaultEncryptionKeyArn
          - HourlyEFSDRRetentionDays

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      DeletionProtection:
        default: Protect core items against deletion
      InstanceAMI:
        default: Instance AMI ID
      InstanceKeyName:
        default: Instance Key Name
      InstanceType:
        default: Instance Type
      LoadBalancerCertificateArn:
        default: Load Balancer SSL Certificate ARN
      LoadBalancerHostName:
        default: Load Balancer Host Name
      NetworkStackName:
        default: Network Stack Name
      SNSStackName:
        default: SNS Topic Stack Name
      ClientDomainName:
        default: Domain Name
      StartScheduleExpression:
        default: Start Schedule CRON Expression
      StopScheduleExpression:
        default: Stop Schedule CRON Expression
      DeployPaidResources:
        default: Deploy Paid Resources (false = DR standby, true = active/failover)
      SnapshotIdentifier:
        default: DB Snapshot Identifier (DR failover restore — leave blank for normal)
      DBMasterUserPassword:
        default: DB Master Password (DR failover only — leave blank for normal)
      EnableCrossRegionBackupReplication:
        default: Enable Cross-Region Backup Replication (deploy in DR region to activate)
      DRRegion:
        default: DR Region (AWS region name — required when EnableCodeDeployReplication is true)
      EnableCodeDeployReplication:
        default: Enable CodeDeploy Artifact Replication to DR region (live stack only — leave false for DR stacks)
      SourceDbInstanceArn:
        default: Source DB Instance ARN (live region — required when replication is enabled)
      BackupReplicationRetentionPeriod:
        default: Backup Retention Period in DR region (days)
      LiveSecretArn:
        default: Live Region Secret ARN (DR standby only — required for secrets sync)
      IsPITRMode:
        default: PITR Mode (set by dr-failover-v2 only — do not change manually)
      PITRDBEndpoint:
        default: PITR DB Endpoint (set by dr-failover-v2 only — do not change manually)
      ExternalEFSId:
        default: External EFS ID (DR failover only — set by dr-failover before stack update)
      BackupVaultEncryptionKeyArn:
        default: Backup Vault KMS Key ARN (DR region CMK replica — leave blank for default key)
      HourlyEFSDRRetentionDays:
        default: Hourly EFS DR Retention (days to retain hourly EFS copies in DR vault)

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name)
    Type: String
    MinLength: 3
    MaxLength: 9
    Default: pddts
  OrgName:
    Description: The name of the organization
    Type: String
    Default: pchc
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
      - ProductionDR
      - StagingDR
      - DevelopmentDR
      - TestDR
  ClientDomainName:
    Description: The client's domain name (e.g. example.com, iscale-software.com)
    Type: String
    AllowedPattern: ^[a-z0-9]+([\-\.]{1}[a-z0-9]+)*\.[a-z]{2,7}$
    Default: pchcdev.com
    MinLength: 1
  DeletionProtection:
    Description: Set to true to enable (valid only in Production mode)
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  InstanceAMI:
    Description: Instance AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-00b8d9cb8a7161e41 #Default Amazon Linux 2 for Singapore
  InstanceKeyName:
    Description: Instance Key Name
    Type: String
    Default: ''
  InstanceType:
    Description: Type of instance for app server
    Type: String
    Default: t3.medium
    AllowedValues:
      - t3.medium
      - t3.large
      - t3.xlarge
  LoadBalancerHostName:
    Description: (Optional) Custom Hostname for load balancer URL
    Type: String
    Default: ''
    MaxLength: 12
  LoadBalancerCertificateArn:
    Description: SSL Certificate for the ELB
    Type: String
    Default: arn:aws:acm:ap-southeast-1:470455329885:certificate/9f713d5d-cb7c-4e8e-acc2-46862d610ec8
  NetworkStackName:
    Description: The name of the network stack
    Type: String
    Default: pchc-dev-ase1-network
    MinLength: 1
  SNSStackName:
    Description: The name of the SNS stack
    Type: String
    Default: pchc-dev-ase1-sns
    MinLength: 1
  StartScheduleExpression:
    Description: Schedule expression when to start the objects
    Type: String
    Default: cron(0 0 ? * MON-FRI *)
  StopScheduleExpression:
    Description: Schedule expression when to stop the objects
    Type: String
    Default: cron(0 10 ? * MON-FRI *)
  DeployPaidResources:
    Description: |
      true (default): Deploy all paid resources — DB, Cache, LBs, and App Servers. Normal operation for all environments.
      false: DR standby mode — suppress all paid resources to minimize idle cost. Only CodeDeploy infra stays alive.
      DR failover: set back to true and provide SnapshotIdentifier to restore DB from the cross-region backup.
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  SnapshotIdentifier:
    Description: |
      (DR Failover only) ARN of the RDS snapshot to restore the database from.
      Obtain by copying the latest automated backup from the live region into the DR region before failover.
      Leave blank for normal fresh DB creation — existing deployments are unaffected.
    Type: String
    Default: ''
  DBMasterUserPassword:
    Description: |
      (DR Failover only) Master user password of the source database.
      Provide this during snapshot restore so the Secrets Manager secret stays in sync with the restored DB credentials.
      Leave blank for auto-generated password — existing deployments are unaffected.
    Type: String
    Default: ''
    NoEcho: true
  EnableCrossRegionBackupReplication:
    Description: |
      Set to true to enable cross-region automated backup replication for the DB.
      Deploy with this enabled in the DR region stack, pointing SourceDbInstanceArn to the live DB.
      Replicates daily snapshots + transaction logs — enables PITR with ~5 minute RPO in the DR region.
      Default false — existing deployments are completely unaffected.
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  DRRegion:
    Description: AWS region name of the DR destination (e.g. us-east-2). Required when EnableCodeDeployReplication is true.
    Type: String
    Default: ''
  EnableCodeDeployReplication:
    Description: Set to true on the live stack to enable CRR of CodeDeploy artifacts to the DR region bucket. Must be false on DR stacks.
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  SourceDbInstanceArn:
    Description: |
      ARN of the live region RDS DB instance to replicate from.
      Required when EnableCrossRegionBackupReplication=true.
      Format: arn:aws:rds:<live-region>:<account-id>:db:<db-identifier>
      Obtain from the live stack DBStack output: DBInstanceARN.
    Type: String
    Default: ''
  BackupReplicationRetentionPeriod:
    Description: Number of days to retain replicated backups in the DR region (1-35)
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
  LiveSecretArn:
    Description: |
      ARN of the live region Secrets Manager secret to replicate from.
      Obtain from the live stack Secrets Manager console.
      Only required when deploying in any DR variant (ProductionDR, TestDR, etc.) — leave blank for normal deployments.
    Type: String
    Default: ''
  IsPITRMode:
    Description: |
      Set to true ONLY by the dr-failover Step Functions state machine when performing a PITR restore.
      When true, DBStack is suppressed (DB was restored externally via PITR) and all DB references
      resolve from PITRDBEndpoint and the pre-deployed DBStandbySecurityGroup instead of DBStack outputs.
      Default false — live stacks and snapshot-based failover are completely unaffected.
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  PITRDBEndpoint:
    Description: |
      Endpoint of the PITR-restored RDS instance. Written to SSM and Secrets Manager by the
      dr-failover Step Functions machine before the app stack update. Only used when IsPITRMode=true.
      Leave blank for all other deployments — existing stacks are unaffected.
    Type: String
    Default: ''
  ExternalEFSId:
    Description: |
      (DR Failover only) ID of the EFS file system restored from cross-region backup.
      Written by dr-failover before the stack update. Leave blank for normal operation.
    Type: String
    Default: ''
  BackupVaultEncryptionKeyArn:
    Description: |
      ARN of the KMS CMK replica in this region used to encrypt the DRBackupVault.
      Required for cross-region EFS backup copies to be immediately decryptable at restore.
      Leave blank to use the default AWS Backup managed key.
    Type: String
    Default: ''
  HourlyEFSDRRetentionDays:
    Description: Number of days to retain hourly EFS backup copies in the DR vault (1-35)
    Type: Number
    Default: 14
    MinValue: 1
    MaxValue: 35

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasKeyName: !Not [!Equals [!Ref InstanceKeyName, '']]
  IsDR: !Or
    - !Equals [!Ref EnvName, ProductionDR]
    - !Equals [!Ref EnvName, StagingDR]
    - !Equals [!Ref EnvName, DevelopmentDR]
    - !Equals [!Ref EnvName, TestDR]
  IsProdOrProductionDR: !Or
    - Condition: IsProd
    - !Equals [!Ref EnvName, ProductionDR]
  IsDeployPaidResources: !Equals [!Ref DeployPaidResources, 'true']
  IsEnableCrossRegionBackupReplication: !Equals [!Ref EnableCrossRegionBackupReplication, 'true']
  IsEnableCodeDeployReplication: !Equals [!Ref EnableCodeDeployReplication, 'true']
  IsDRAndEnableCrossRegionBackupReplication: !And
    - Condition: IsDR
    - Condition: IsEnableCrossRegionBackupReplication
  IsNotProdAndDeployPaidResources: !And
    - Condition: IsNotProd
    - Condition: IsDeployPaidResources
  IsProdOrProductionDRAndDeployPaidResources: !And
    - Condition: IsProdOrProductionDR
    - Condition: IsDeployPaidResources
  IsDashboardDeployed: !And
    - Condition: IsProdOrProductionDR
    - Condition: IsDeployPaidResources
  IsDeployPaidResourcesAndNotDR: !And        # NEW — for Manila AZ read replica
    - Condition: IsDeployPaidResources
    - !Not [Condition: IsDR]
  IsProdAndDeployPaidResources: !And         # NEW — for DBResizer
    - Condition: IsProd
    - Condition: IsDeployPaidResources
  IsNotProdAndDeployPaidResourcesAndNotDR: !And   # NEW — for schedulers; prevents scheduler from running during DR failover
    - Condition: IsNotProd
    - Condition: IsDeployPaidResourcesAndNotDR
  IsPITRMode: !Equals [!Ref IsPITRMode, 'true']
  IsDeployPaidResourcesAndNotPITR: !And
    - Condition: IsDeployPaidResources
    - !Not [{Condition: IsPITRMode}]
  IsProdOrProductionDRAndDeployPaidResourcesAndNotPITR: !And
    - Condition: IsProdOrProductionDR
    - Condition: IsDeployPaidResourcesAndNotPITR
  IsDashboardDeployedAndNotPITR: !And
    - Condition: IsProdOrProductionDR
    - Condition: IsDeployPaidResourcesAndNotPITR
  IsNotTestOrDevelopmentDR: !Not # NEW — for VPN to deploy only in PROD and PROD DR envoironment
    - !Or
      - !Equals [!Ref EnvName, TestDR]
      - !Equals [!Ref EnvName, DevelopmentDR]
  IsSFTPDeployed: !Or
  - Condition: IsProd
  - !Equals [!Ref EnvName, ProductionDR]
  - !Equals [!Ref EnvName, TestDR]        # enables UAT DR testing before touching ProductionDR

Resources:

  BSPVPNGatewayEIP1: # - Hardcoded for BSP
    Condition: IsNotTestOrDevelopmentDR
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::EC2::EIP

  BSPVPNGatewayEIP2: # - Hardcoded for BSP
    Condition: IsNotTestOrDevelopmentDR
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::EC2::EIP

  ##
  # PDDTS Application Resources
  ##

  ELBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/loadbalancer.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        CertificateArn: !Ref LoadBalancerCertificateArn
        SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName
        DeployPaidResources: !Ref DeployPaidResources

  DBStack:
    Condition: IsDeployPaidResourcesAndNotPITR
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/database.yaml
      Parameters:
        Name: !Ref Name
        DatabaseName: !Join ['',[!Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name], db]]
        AllocatedStorage: 20
        BackupRetentionPeriod: !If [IsProd, 30, 7]
        DeletionProtection: !If [IsProd, !Ref DeletionProtection, false]
        EnableEnhancedMonitoring: !If [IsProd, true, false]
        EnablePerformanceInsights: !If [IsProd, true, false]
        EnvName: !Ref EnvName
        Engine: mysql
        EngineVersion: 8.4.7
        Family: mysql8.4
        InstanceType: !If [IsProd, db.t4g.xlarge, db.t4g.micro]
        MasterUser: root
        MultiAz: !If [IsProd, true, false]
        NetworkStackName: !Ref NetworkStackName
        OrgName: !Ref OrgName
        SNSStackName: !Ref SNSStackName
        StorageEncrypted: true
        SnapshotIdentifier: !Ref SnapshotIdentifier
        MasterUserPassword: !Ref DBMasterUserPassword
        ExistingSecretArn: !If [IsDR, !Ref DRDBSecret, '']

  DBResizer:
    Condition: IsProdAndDeployPaidResources
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/db-resizer.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        DatabaseInstanceName: 
          Fn::GetAtt:
            - DBStack
            - Outputs.DBInstanceName
        PeakSize: db.t4g.xlarge
        RegularSize: db.t4g.micro

###
# PDDTS RDS Read replica instance in Manila AZ (local zone)
###

  PDDTSReadReplicaInstance:
    Condition: IsDeployPaidResourcesAndNotDR
    Type: AWS::EC2::Instance
    Metadata: 
      AWS::CloudFormation::Init: 
        configSets:
          Basic: 
            - "MySqlServerSetup"
        MySqlServerSetup:
          files:
            /var/lib/cloud/instance/mysqlserver-setup.sh: 
              content: !Sub
                - |
                  #!/bin/bash -xe
                  sudo amazon-linux-extras install epel -y
                  sudo rpm --import https://repo.mysql.com/RPM-GPG-KEY-mysql-2023
                  sudo yum install https://dev.mysql.com/get/mysql80-community-release-el7-5.noarch.rpm -y
                  sudo yum install mysql-community-server -y
                  sudo systemctl start mysqld
                  sudo systemctl enable mysqld
                  echo "Done for ${ENVIRONMENT}"
                - ENVIRONMENT: !Ref EnvName
              permissions: 0700
              owner: root
              group: root
    Properties: 
      ImageId: !If [IsProd, ami-0e73d1144a39f9b41, ami-0dad7d174ea1f07e5] # base linux AMI generated from linux builder
      InstanceType: !If [IsProd, t3.xlarge, t3.medium]
      IamInstanceProfile: !Ref PDDTSReadReplicaInstanceIamProfile
      Monitoring: true
      SecurityGroupIds:
        - Fn::GetAtt:
          - DBStack
          - Outputs.SecurityGroupId
        - !GetAtt PDDTSReadReplicaInstanceSecGroup.GroupId
      SubnetId: !If
        - IsProd
        - subnet-0ca234a066df0f780 # Manila AZ local zone prod
        - subnet-0720e821f506fc693 # Manila AZ local zone uat
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20 #GB - updating this will cause instance replacement.
            VolumeType: gp2
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash -xe
            # Install the files and packages from the metadata
            /usr/local/bin/cfn-init -v --stack ${AWS::StackName} --resource PDDTSReadReplicaInstance -c Basic --region ${AWS::Region} --role ${ROLE}
            /bin/bash /var/lib/cloud/instance/mysqlserver-setup.sh
            # Start up the cfn-hup daemon to listen for changes to the EC2 metadata
            #/usr/local/bin/cfn-hup || error_exit 'Failed to start cfn-hup'
            # Signal the status from cfn-init
            /usr/local/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource PDDTSReadReplicaInstance --region ${AWS::Region}
          - ROLE: !Ref PDDTSReadReplicaInstanceIamRole
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, rds-read-replica]]
        - 
          Key: Environment
          Value: !Ref EnvName
        - 
          Key: Organization
          Value: !Ref OrgName

# pddts rds read replica secgroup section

  PDDTSReadReplicaInstanceSecGroup:
    Condition: IsDeployPaidResourcesAndNotDR
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], rds-read-replica-secgroup]]
      GroupDescription: security group for rds-read-replica instance
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], rds-read-replica-secgroup]]

  # Security group rules
  AllowReadReplicaEC2IntoDB:
    Condition: IsDeployPaidResourcesAndNotDR
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from rds-read-replica instance
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - DBStack
          - Outputs.SecurityGroupId
      FromPort:
        Fn::GetAtt:
          - DBStack
          - Outputs.DBInstancePort
      ToPort:
        Fn::GetAtt:
          - DBStack
          - Outputs.DBInstancePort
      SourceSecurityGroupId: !GetAtt PDDTSReadReplicaInstanceSecGroup.GroupId

  AllowDBIntoReadReplicaEC2:
    Condition: IsDeployPaidResourcesAndNotDR
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from rds to instance
      IpProtocol: TCP
      GroupId: !GetAtt PDDTSReadReplicaInstanceSecGroup.GroupId
      FromPort:
        Fn::GetAtt:
          - DBStack
          - Outputs.DBInstancePort
      ToPort:
        Fn::GetAtt:
          - DBStack
          - Outputs.DBInstancePort
      SourceSecurityGroupId:
        Fn::GetAtt:
          - DBStack
          - Outputs.SecurityGroupId

# pddts rds read replica iam section

  PDDTSReadReplicaInstanceIamProfile:
    Condition: IsDeployPaidResourcesAndNotDR
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: PDDTSReadReplicaInstanceIamRole

  PDDTSReadReplicaInstanceIamRole:
    Condition: IsDeployPaidResourcesAndNotDR
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: ec2.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: AccessCloudWatchMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - ec2:DescribeTags
                Resource: '*'
        - PolicyName: WriteCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:CreateLogGroup
                  - logs:PutLogEvents
                Resource: 'arn:aws:logs:*:*:*'

  DBSchedulerStack:
    DependsOn:
      - DBStack
    Condition: IsNotProdAndDeployPaidResourcesAndNotDR
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: FALSE
        DatabaseInstanceName:
          Fn::GetAtt:
            - DBStack
            - Outputs.DBInstanceName

  DRDBSecret:
    Condition: IsDR
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Description: !Sub 'DR placeholder secret for ${OrgName} ${Name} — values synced from the live region secret by the secrets-sync Lambda before failover.'
      SecretString: !Sub |
        {
          "DB_ROOT_USER": "root",
          "DB_ROOT_PASSWORD": "PLACEHOLDER_SYNC_FROM_LIVE",
          "DB_NAME": "pddtsprddb",
          "DB_USER": "${Name}",
          "DB_PASSWORD": "PLACEHOLDER_SYNC_FROM_LIVE"
        }
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName
        - Key: DRSync
          Value: 'true'
        - Key: SourceSecretArn
          Value: !Ref LiveSecretArn

  DBStandbySubnetGroup:
    Condition: IsDR
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db, standby]]
      DBSubnetGroupName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db, standby]]
      SubnetIds:
        - Fn::ImportValue: !Sub '${NetworkStackName}-InternalSubnetId1'
        - Fn::ImportValue: !Sub '${NetworkStackName}-InternalSubnetId2'
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db, standby]]
          
  DBStandbySecurityGroup:
    Condition: IsDR
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db, standby]]
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db, standby]]

  DBReplicationStack:
    Condition: IsDRAndEnableCrossRegionBackupReplication
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/db-replication.yaml
      Parameters:
        Name: !Ref Name
        OrgName: !Ref OrgName
        EnvName: !Ref EnvName
        SourceDbInstanceArn: !Ref SourceDbInstanceArn
        BackupRetentionPeriod: !Ref BackupReplicationRetentionPeriod

  DeployStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/deployment.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName
        ReplicationDestinationBucketArn: !If
          - IsEnableCodeDeployReplication
          - !Sub
            - 'arn:aws:s3:::${OrgName}-${DREnvShort}-${DRRegionShort}-${Name}-code-deploy'
            - DREnvShort: !FindInMap [EnvDRShort, !Ref EnvName, Name]
              DRRegionShort: !FindInMap [RegionShort, !Ref DRRegion, Name]
          - ''

  CacheStack:
    Condition: IsDeployPaidResources
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/elasticache.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        NetworkStackName: !Ref NetworkStackName
        EncryptInTransit: TRUE
        EngineVersion: 6.0
        NodeType: cache.t3.micro
        NumCacheClusters: 1
        OrgName: !Ref OrgName
        SnapshotRetentionLimit: !If [IsProd, 30, !Ref 'AWS::NoValue']
        SNSStackName: !Ref SNSStackName
        UseFriendlyNames: TRUE

  ServerStack:
    DependsOn:
      - DeployStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/appserver-basic2.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        ASGDesiredSize: !If [IsDR, 0, 1]
        CacheEndpoint: !If
          - IsDeployPaidResources
          - Fn::GetAtt: [CacheStack, Outputs.CachePrimaryEndpoint]
          - ''
        CachePort: !If
          - IsDeployPaidResources
          - Fn::GetAtt: [CacheStack, Outputs.ClusterPort]
          - 6379
        CacheSecurityGroupId: !If
          - IsDeployPaidResources
          - Fn::GetAtt: [CacheStack, Outputs.SecurityGroupId]
          - ''
        ClientDomainName: !Ref ClientDomainName
        DatabaseEndpoint: !If
          - IsDeployPaidResources
          - !If [IsPITRMode, !Ref PITRDBEndpoint, Fn::GetAtt: [DBStack, Outputs.DBInstanceAddress]]
          - ''
        DatabasePort: !If
          - IsDeployPaidResources
          - !If [IsPITRMode, '3306', Fn::GetAtt: [DBStack, Outputs.DBInstancePort]]
          - 3306
        DatabaseSecurityGroupId: !If
          - IsDeployPaidResources
          - !If [IsPITRMode, !GetAtt DBStandbySecurityGroup.GroupId, Fn::GetAtt: [DBStack, Outputs.SecurityGroupId]]
          - ''
        InstanceAMI: !Ref InstanceAMI
        InstanceKeyName: !If [HasKeyName, !Ref InstanceKeyName, !Ref 'AWS::NoValue']
        InstancePort: 80
        InstanceSubnet: Private
        InstanceType: !Ref InstanceType
        # LoadBalancerHostName: !If [IsProd, !Ref LoadBalancerHostName, !Ref 'AWS::NoValue']
        LoadBalancerHostName: !If [IsDR, !Ref 'AWS::NoValue', !Ref LoadBalancerHostName]
        LoadBalancerPriority: 100
        LoadBalancerStackName: !If
          - IsDeployPaidResources
          - !Select [ 1, !Split [ '/', !Ref ELBStack]]
          - ''
        NetworkStackName: !Ref NetworkStackName
        SharedSecretId: !If
          - IsDeployPaidResources
          - !If [IsPITRMode, !Ref DRDBSecret, Fn::GetAtt: [DBStack, Outputs.DBSecretManagerKeyId]]
          - ''
        SNSStackName: !Ref SNSStackName
        UseFriendlyNames: FALSE
        LaunchTemplate: True

  SchedulerStack:
    DependsOn:
      - DBStack
      - ServerStack
    Condition: IsNotProdAndDeployPaidResourcesAndNotDR
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: FALSE
        CodeDeployApplicationName:
          Fn::GetAtt:
            - DeployStack
            - Outputs.CodeDeployApplicationName
        CodeDeployDeploymentGroupName:
          Fn::GetAtt:
            - DeployStack
            - Outputs.CodeDeployDeploymentGroupName

# SFTP Server using Transfer Family

  SFTPServer:
    Condition: IsSFTPDeployed
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/transfer-family.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        NetworkStackName: !Ref NetworkStackName
        HostedZoneName: !Ref ClientDomainName
        UseDefaultSecGroup: FALSE
        DeployPaidResources: !Ref DeployPaidResources

  AllowJumpHostIntoServer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from jump host
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
            - ServerStack
            - Outputs.AppServerSecurityGroup
      FromPort: 22
      ToPort: 22
      SourceSecurityGroupId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-JumpHostSecurityGroupId'

  AllowJumpHostIntoDB:
    Condition: IsDeployPaidResourcesAndNotPITR
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from jump host
      IpProtocol: TCP
      GroupId:
        Fn::GetAtt:
          - DBStack
          - Outputs.SecurityGroupId
      FromPort:
        Fn::GetAtt:
          - DBStack
          - Outputs.DBInstancePort
      ToPort:
        Fn::GetAtt:
          - DBStack
          - Outputs.DBInstancePort
      SourceSecurityGroupId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-JumpHostSecurityGroupId'

###
# Sidekiq Stacks
###

  SidekiqDeployStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/deployment.yaml
      Parameters:
        Name: !Join ['-', [!Ref Name, sidek]]
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName
        ReplicationDestinationBucketArn: !If
          - IsEnableCodeDeployReplication
          - !Sub
            - 'arn:aws:s3:::${OrgName}-${DREnvShort}-${DRRegionShort}-${Name}-sidek-code-deploy'
            - DREnvShort: !FindInMap [EnvDRShort, !Ref EnvName, Name]
              DRRegionShort: !FindInMap [RegionShort, !Ref DRRegion, Name]
          - ''

  SidekiqServerStack:
    DependsOn:
      - SidekiqDeployStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/appserver-basic2.yaml
      Parameters:
        Name: !Join ['-', [!Ref Name, sidek]]
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        ASGDesiredSize: !If [IsDR, 0, 1]
        CacheEndpoint: !If
          - IsDeployPaidResources
          - Fn::GetAtt: [CacheStack, Outputs.CachePrimaryEndpoint]
          - ''
        CachePort: !If
          - IsDeployPaidResources
          - Fn::GetAtt: [CacheStack, Outputs.ClusterPort]
          - 6379
        CacheSecurityGroupId: !If
          - IsDeployPaidResources
          - Fn::GetAtt: [CacheStack, Outputs.SecurityGroupId]
          - ''
        ClientDomainName: !Ref ClientDomainName
        DatabaseEndpoint: !If
          - IsDeployPaidResources
          - !If [IsPITRMode, !Ref PITRDBEndpoint, Fn::GetAtt: [DBStack, Outputs.DBInstanceAddress]]
          - ''
        DatabasePort: !If
          - IsDeployPaidResources
          - !If [IsPITRMode, '3306', Fn::GetAtt: [DBStack, Outputs.DBInstancePort]]
          - 3306
        DatabaseSecurityGroupId: !If
          - IsDeployPaidResources
          - !If [IsPITRMode, !GetAtt DBStandbySecurityGroup.GroupId, Fn::GetAtt: [DBStack, Outputs.SecurityGroupId]]
          - ''
        InstanceAMI: !Ref InstanceAMI
        InstanceKeyName: !If [HasKeyName, !Ref InstanceKeyName, !Ref 'AWS::NoValue']
        InstancePort: 80
        InstanceSubnet: Private
        InstanceType: !Ref InstanceType
        # LoadBalancerHostName: No need of URL for sidekiq
        LoadBalancerPriority: 105
        LoadBalancerStackName: !If
          - IsDeployPaidResources
          - !Select [ 1, !Split [ '/', !Ref ELBStack]]
          - ''
        NetworkStackName: !Ref NetworkStackName
        ExternalEFSID:
          Fn::GetAtt:
            - ServerStack
            - Outputs.AppServerEFS
        ExternalEFSSecurityGroup:
          Fn::GetAtt:
            - ServerStack
            - Outputs.AppServerEFSSecurityGroup
        SharedSecretId: !If
          - IsDeployPaidResources
          - !If [IsPITRMode, !Ref DRDBSecret, Fn::GetAtt: [DBStack, Outputs.DBSecretManagerKeyId]]
          - ''
        SNSStackName: !Ref SNSStackName
        UseFriendlyNames: FALSE
        LaunchTemplate: True

  SidekiqSchedulerStack:
    DependsOn:
      - DBStack
      - SidekiqServerStack
    Condition: IsNotProdAndDeployPaidResourcesAndNotDR
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters:
        Name: !Join ['-', [!Ref Name, sidek]]
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: FALSE
        CodeDeployApplicationName:
          Fn::GetAtt:
            - SidekiqDeployStack
            - Outputs.CodeDeployApplicationName
        CodeDeployDeploymentGroupName:
          Fn::GetAtt:
            - SidekiqDeployStack
            - Outputs.CodeDeployDeploymentGroupName

  BackupStack:
    Condition: IsProdOrProductionDRAndDeployPaidResourcesAndNotPITR
    DependsOn:
      - DBStack
      - ServerStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/backup.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        BackupARNList: !Join
          - ','
          - - Fn::GetAtt:
              - DBStack
              - Outputs.DBInstanceARN
            - Fn::GetAtt:
              - ServerStack
              - Outputs.AppServerEFSArn
        BackupTime: !If [IsProd, !Ref 'AWS::NoValue', 1] #Default backup time else 1AM UTC for dev
        DailyExpiration: 60 #60 days requirement
        WeeklyExpiration: 180 #6 months but requirement is 4 weeks
        MonthlyExpiration: 3650 # 10 years

  Dashboard:
    Condition: IsDashboardDeployedAndNotPITR
    Type: AWS::CloudWatch::Dashboard
    Properties:
        DashboardName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        DashboardBody: !Sub
          - |
            {
              "widgets": [
                {
                  "height": 12,
                  "width": 6,
                  "y": 0,
                  "x": 0,
                  "type": "alarm",
                  "properties": {
                    "title": "Alarms",
                    "alarms": [
                      "${CACHE_HIGH_CPU}",
                      "${CACHE_LOW_MEM}",
                      "${DB_HIGH_CPU}",
                      "${DB_LOW_STORAGE}",
                      "${DB_LOW_CPU_CREDIT}",
                      "${DB_ERRORS}",
                      "${DB_ERROR_DENIED}",
                      "${TG_UNHEALTHY}",
                      "${TG_SLOW}"
                    ]
                  }
                },
                {
                  "height": 6,
                  "width": 6,
                  "y": 0,
                  "x": 6,
                  "type": "metric",
                  "properties": {
                    "metrics": [
                      [ "AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "label": "RDS" } ],
                      [ "AWS/ElastiCache", "CPUUtilization", "CacheClusterId", "${CACHE_INSTANCE_ID}", { "label": "Redis" } ],
                      [ "AWS/EC2", "CPUUtilization", "AutoScalingGroupName", "${ASG_GROUP_NAME}" , { "label": "App Servers" }]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${REGION}",
                    "period": 300,
                    "title": "CPU",
                    "stat": "Average",
                    "yAxis": {
                      "left": {
                        "label": "Utilization"
                      }
                    }
                  }
                },
                {
                  "height": 6,
                  "width": 6,
                  "y": 6,
                  "x": 6,
                  "type": "metric",
                  "properties": {
                    "metrics": [
                      [ { "expression": "100-((m4/(16*1024*1000000))*100)", "label": "RDS (memory)", "id": "e1", "region": "${REGION}" } ],
                      [ "AWS/RDS", "FreeableMemory", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "id": "m4", "visible": false } ],
                      [ "AWS/ElastiCache", "DatabaseMemoryUsagePercentage", "CacheClusterId", "${CACHE_INSTANCE_ID}", { "label": "Redis (memory)" } ],
                      [ "CWAgent", "mem_used_percent", "InstanceId", "${APP_SERVER_ID}", "AutoScalingGroupName", "${ASG_GROUP_NAME}", "ImageId", "${APP_SERVER_AMI}", "InstanceType", "${APP_SERVER_TYPE}" , { "label": "App Servers (memory)" }],
                      [ { "expression": "100-(m1/(20*1024*1000000)*100)", "label": "RDS (disk)", "id": "e2", "region": "${REGION}" } ],
                      [ "AWS/RDS", "FreeStorageSpace", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "id": "m1", "visible": false } ],
                      [ "CWAgent", "disk_used_percent", "path", "/", "InstanceId", "${APP_SERVER_ID}", "AutoScalingGroupName", "${ASG_GROUP_NAME}", "ImageId", "${APP_SERVER_AMI}", "InstanceType", "${APP_SERVER_TYPE}", "device", "nvme0n1p1", "fstype", "xfs" , { "label": "App Servers (disk)" } ]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${REGION}",
                    "period": 300,
                    "title": "Memory / Storage",
                    "stat": "Average",
                    "yAxis": {
                      "left": {
                        "label": "Utilization"
                      }
                    }
                  }
                },
                {
                  "height": 6,
                  "width": 6,
                  "y": 0,
                  "x": 12,
                  "type": "metric",
                  "properties": {
                    "metrics": [
                      [ "AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${ELB_FULL_NAME}", { "label": "ELB" } ],
                      [ "AWS/RDS", "ReadLatency", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "label": "RDS Read" } ],
                      [ ".", "WriteLatency", ".", ".", { "label": "RDS Write" } ]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${REGION}",
                    "period": 300,
                    "title": "Performance",
                    "stat": "Average",
                    "yAxis": {
                      "left": {
                        "showUnits": true,
                        "label": "Time"
                      }
                    }
                  }
                },
                {
                  "height": 6,
                  "width": 6,
                  "y": 0,
                  "x": 18,
                  "type": "metric",
                  "properties": {
                    "metrics": [
                      [ "AWS/EC2", "NetworkIn", "AutoScalingGroupName", "${ASG_GROUP_NAME}", { "label": "App Servers (In)" }],
                      [ ".", "NetworkOut", ".", ".", { "label": "App Servers (out)" }],
                      [ "AWS/ApplicationELB", "ProcessedBytes", "LoadBalancer", "${ELB_FULL_NAME}", { "label": "ELB" } ],
                      [ "AWS/RDS", "NetworkReceiveThroughput", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "label": "RDS (In)" }],
                      [ ".", "NetworkTransmitThroughput", ".", ".", { "label": "RDS (Out)" }],
                      [ "AWS/ElastiCache", "NetworkBytesIn", "CacheClusterId", "${CACHE_INSTANCE_ID}", { "label": "Redis (In)" }],
                      [ ".", "NetworkBytesOut", ".", ".", { "label": "Redis (Out)" }]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "title": "Network",
                    "region": "${REGION}",
                    "period": 300,
                    "stat": "Average",
                    "legend": {
                      "position": "bottom"
                    },
                    "yAxis": {
                      "left": {
                        "label": "Volume"
                      }
                    }
                  }
                },
                {
                  "height": 6,
                  "width": 6,
                  "y": 6,
                  "x": 12,
                  "type": "metric",
                  "properties": {
                    "metrics": [
                      [ "AWS/RDS", "ReadThroughput", "DBInstanceIdentifier", "${DB_INSTANCE_ID}", { "label": "RDS Read" }],
                      [ ".", "WriteThroughput", ".", ".", { "label": "RDS Write" }],
                      [ "AWS/EFS", "DataReadIOBytes", "FileSystemId", "${EFS_ID}", { "label": "EFS Read" }],
                      [ ".", "DataWriteIOBytes", ".", ".", { "label": "EFS Write" }]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${REGION}",
                    "period": 300,
                    "title": "I/O",
                    "stat": "Average",
                    "yAxis": {
                      "left": {
                        "label": "Count",
                        "showUnits": false
                      }
                    }
                  }
                },
                {
                  "height": 6,
                  "width": 6,
                  "y": 6,
                  "x": 18,
                  "type": "metric",
                  "properties": {
                    "metrics": [
                      [ "AWS/ApplicationELB", "HTTPCode_ELB_5XX_Count", "LoadBalancer", "${ELB_FULL_NAME}", { "label": "ELB HTTP 5XX_Count" } ],
                      [ ".", "HTTPCode_ELB_4XX_Count", ".", ".", { "label": "ELB HTTP 4XX_Count" } ]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${REGION}",
                    "title": "Error Count",
                    "period": 300,
                    "stat": "Average"
                  }
                }
              ]
            }
          - CACHE_HIGH_CPU: !GetAtt [CacheStack, Outputs.HighCPUAlarm]
            CACHE_LOW_MEM: !GetAtt [CacheStack, Outputs.LowMemoryAlarm]
            DB_HIGH_CPU: !GetAtt [DBStack, Outputs.DBHighCPUAlarm]
            DB_LOW_STORAGE: !GetAtt [DBStack, Outputs.DBLowStorageAlarm]
            DB_LOW_CPU_CREDIT: !GetAtt [DBStack, Outputs.CPUCreditBalanceAlarm]
            DB_ERRORS: !GetAtt [DBStack, Outputs.DBErrorsAlarm]
            DB_ERROR_DENIED: !GetAtt [DBStack, Outputs.DBErrorDeniedAlarm]
            TG_SLOW: !GetAtt [ServerStack, Outputs.AppServerSlowTargetGroupAlarm]
            TG_UNHEALTHY: !GetAtt [ServerStack, Outputs.UnhealthyTargetGroupAlarm]
            DB_INSTANCE_ID: !GetAtt [DBStack, Outputs.DBInstanceName]
            CACHE_INSTANCE_ID: !Join ['-', [!GetAtt [CacheStack, Outputs.ElasticacheReplicationGroup], '001']]
            REGION: !Ref 'AWS::Region'
            ELB_FULL_NAME: !GetAtt [ELBStack, Outputs.LoadBalancerFullName]
            ASG_GROUP_NAME: "CodeDeploy_pchc-prd-ase1-pddts-DeployStack-12Y1HBDTTP3XN-CodeDeployDeploymentGroup-1UYDF589716KF_d-TDI9R511K" #First time, it will be emptu, that's OK
            APP_SERVER_AMI: !Ref InstanceAMI
            APP_SERVER_ID: i-0d6e53ff58d0902e6 #Hardcoded for now
            APP_SERVER_TYPE: !Ref InstanceType
            EFS_ID: !GetAtt [ServerStack, Outputs.AppServerEFS]

Outputs:

  DeploymentUserGroup:
    Description: Add the BitBucket user into this group
    Value:
      Fn::GetAtt:
        - DeployStack
        - Outputs.DeploymentUserGroup

  ClientDomainName:
    Description: Client Domain Name
    Value: !Ref ClientDomainName
    Export:
      Name: !Sub '${AWS::StackName}-ClientDomainName'

  ELBSecurityGroup:
    Description: Name of the ELB Security Group
    Value: !GetAtt [ELBStack, Outputs.SecurityGroupId]
    Export:
      Name: !Sub '${AWS::StackName}-ELBSecurityGroup'

  PublicSubnetId1:
    Description: Name of the PublicSubnetId1 subnet
    Value: !ImportValue
       Fn::Sub: '${NetworkStackName}-PublicSubnetId1'
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnetId1'

  VpcId:
    Description: Name of the VPC
    Value: !ImportValue
      Fn::Sub: '${NetworkStackName}-VpcId'
    Export:
      Name: !Sub '${AWS::StackName}-VpcId'
  
  # DR outputs

  DRDBSecretArn:
    Condition: IsDR
    Description: ARN of the DR Secrets Manager secret — wire into secrets-sync Lambda
    Value: !Ref DRDBSecret
    Export:
      Name: !Sub '${AWS::StackName}-DRDBSecretArn'

  DBStandbySubnetGroup:
    Condition: IsDR
    Description: Pre-deployed DB subnet group for PITR restore
    Value: !Ref DBStandbySubnetGroup
    Export:
      Name: !Sub '${AWS::StackName}-DBStandbySubnetGroup'

  DBStandbySecurityGroup:
    Condition: IsDR
    Description: Pre-deployed DB security group for PITR restore
    Value: !GetAtt DBStandbySecurityGroup.GroupId
    Export:
      Name: !Sub '${AWS::StackName}-DBStandbySecurityGroupId'