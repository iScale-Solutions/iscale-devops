          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref CodeBuildPaygatePaymentImageBuilder
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1
    DependsOn: CodeBuildPaygatePaymentImageBuilder
  PaygateCoreDeploymentPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref CodePipelineArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: NewDockerImage
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: ECR
              Configuration:
                RepositoryName: !Ref PaygateCoreDockerImage
                ImageTag: latest
              OutputArtifacts:
                - Name: NewDockerImageArtifact
              RunOrder: 1
            - Name: IacCodeChange
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: CodeCommit
              Configuration:
                RepositoryName: !Ref IacSourceRepo
                BranchName: !Ref IacSourceBranch
              OutputArtifacts:
                - Name: IacCodeChangeArtifact
              RunOrder: 1
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref CodeBuildPaygateCoreDeployer
                PrimarySource: IacCodeChangeArtifact
              InputArtifacts:
                - Name: NewDockerImageArtifact
                - Name: IacCodeChangeArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              RunOrder: 2
    DependsOn: CodeBuildPaygateCoreDeployer
  PaygateBackofficeDeploymentPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref CodePipelineArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: NewDockerImage
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: ECR
              Configuration:
                RepositoryName: !Ref PaygateBackofficeDockerImage
                ImageTag: latest
              OutputArtifacts:
                - Name: NewDockerImageArtifact
              RunOrder: 1
            - Name: IacCodeChange
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: CodeCommit
              Configuration:
                RepositoryName: !Ref IacSourceRepo
                BranchName: !Ref IacSourceBranch
              OutputArtifacts:
                - Name: IacCodeChangeArtifact
              RunOrder: 1  
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref CodeBuildPaygateBackofficeDeployer
                PrimarySource: IacCodeChangeArtifact
              InputArtifacts:
                - Name: NewDockerImageArtifact
                - Name: IacCodeChangeArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1
    DependsOn: CodeBuildPaygateBackofficeDeployer
  PaygatePaymentDeploymentPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref CodePipelineArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: NewDockerImage
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: ECR
              Configuration:
                RepositoryName: !Ref PaygatePaymentDockerImage
                ImageTag: latest
              OutputArtifacts:
                - Name: NewDockerImageArtifact
              RunOrder: 1
            - Name: IacCodeChange
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: CodeCommit
              Configuration:
                RepositoryName: !Ref IacSourceRepo
                BranchName: !Ref IacSourceBranch
              OutputArtifacts:
                - Name: IacCodeChangeArtifact
              RunOrder: 1  
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref CodeBuildPaygatePaymentDeployer
                PrimarySource: IacCodeChangeArtifact
              InputArtifacts:
                - Name: NewDockerImageArtifact
                - Name: IacCodeChangeArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1
    DependsOn: CodeBuildPaygatePaymentDeployer