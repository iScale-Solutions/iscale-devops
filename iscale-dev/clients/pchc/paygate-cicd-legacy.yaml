Parameters:

  EksClusterName:
    Type: String
    Description: The name of the EKS cluster created
    Default: test-eks-cluster-paygate
    MinLength: 1
    MaxLength: 100
    ConstraintDescription: You must enter the EKS cluster name

  # TODO: Update this to final repo name
  PaygateCoreSourceRepo:
    Type: String
    Description: Paygate Core source repository - must contain a Dockerfile and buildspec.yml in the base
    Default: paygate-core
    MinLength: 1
    MaxLength: 100
    ConstraintDescription: You must enter a repository name

  PaygateCoreSourceBranch:
    Type: String
    Default: master
    Description: Paygate Core repository branch - change triggers a new build
    MinLength: 1
    MaxLength: 100
    ConstraintDescription: You must enter a repository branch name

  PaygateBackofficeSourceRepo:
    Type: String
    Description: Paygate Backoffice source repository - must contain a Dockerfile and buildspec.yml in the base
    Default: paygate-backoffice
    MinLength: 1
    MaxLength: 100
    ConstraintDescription: You must enter a repository name

  PaygateBackofficeSourceBranch:
    Type: String
    Default: master
    Description: Paygate Backoffice repository branch - change triggers a new build
    MinLength: 1
    MaxLength: 100
    ConstraintDescription: You must enter a repository branch name

  PaygatePaymentSourceRepo:
    Type: String
    Description: Paygate Payment source repository - must contain a Dockerfile and buildspec.yml in the base
    Default: paygate-payment
    MinLength: 1
    MaxLength: 100
    ConstraintDescription: You must enter a repository name

  PaygatePaymentSourceBranch:
    Type: String
    Default: master
    Description: Paygate Payment repository branch - change triggers a new build
    MinLength: 1
    MaxLength: 100
    ConstraintDescription: You must enter a repository branch name    

  IacSourceRepo:
    Type: String
    Description: IAC source repository - must contain a Dockerfile and buildspec.yml in the base
    Default: paygate-k8s
    MinLength: 1
    MaxLength: 100
    ConstraintDescription: You must enter a repository name

  IacSourceBranch:
    Type: String
    Default: master
    Description: IAC source repository branch - change triggers a new build
    MinLength: 1
    MaxLength: 100
    ConstraintDescription: You must enter a repository branch name

  # GitHubToken:
  #   Type: String
  #   NoEcho: true
  #   Description: GitHub API token - see https://github.com/blog/1509-personal-api-tokens
  #   MinLength: 3
  #   MaxLength: 100
  #   ConstraintDescription: You must enter a GitHub personal access token

  # GitHubUser:
  #   Type: String
  #   Description: GitHub username or organization
  #   MinLength: 3
  #   MaxLength: 100
  #   ConstraintDescription: You must enter a GitHub username or organization

  PaygateCoreDockerImage:
    Type: String
    Default: paygate-core
    Description: PayGate Core image in ECR to deploy
    MinLength: 3
    MaxLength: 100
    ConstraintDescription: You must enter a Docker image

  PaygateBackofficeDockerImage:
    Type: String
    Default: paygate-backoffice
    Description: PayGate Backoffice image in ECR to deploy
    MinLength: 3
    MaxLength: 100
    ConstraintDescription: You must enter a Docker image

  PaygatePaymentDockerImage:
    Type: String
    Default: paygate-payment
    Description: PayGate Payment image in ECR to deploy
    MinLength: 3
    MaxLength: 100
    ConstraintDescription: You must enter a Docker image

  PaygateCoreBuildSpec:
    Type: String
    Default: buildspec_core.yml
    Description: PayGate Core buildspec filename
    MinLength: 3
    MaxLength: 100
    ConstraintDescription: You must enter a string

  PaygateBackofficeBuildSpec:
    Type: String
    Default: buildspec_backoffice.yml
    Description: PayGate Backoffice buildspec filename
    MinLength: 3
    MaxLength: 100
    ConstraintDescription: You must enter a string

  PaygatePaymentBuildSpec:
    Type: String
    Default: buildspec_payment.yml
    Description: PayGate Payment buildspec filename
    MinLength: 3
    MaxLength: 100
    ConstraintDescription: You must enter a string

  KubectlRoleName:
    Type: String
    Default: EksWorkshopCodeBuildKubectlRole
    Description: IAM role used by kubectl to interact with EKS cluster
    MinLength: 3
    MaxLength: 100
    ConstraintDescription: You must enter a kubectl IAM role


Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: PayGate Core Code Repository
        Parameters:
          - PaygateCoreSourceRepo
          - PaygateCoreSourceBranch
      - Label:
          default: PayGate Backoffice Code Repository
        Parameters:
          - PaygateBackofficeSourceRepo
          - PaygateBackofficeSourceBranch
      - Label:
          default: PayGate Payment Code Repository
        Parameters:
          - PaygatePaymentSourceRepo
          - PaygatePaymentSourceBranch    
      - Label:
          default: IAC (Infra-As-Code) Code Repository
        Parameters:
          - IacSourceRepo
          - IacSourceBranch     
      - Label:
          default: CodeBuild
        Parameters:
          - PaygateCoreDockerImage
          - PaygateBackofficeDockerImage
          - PaygatePaymentDockerImage
          - PaygateCoreBuildSpec
          - PaygateBackofficeBuildSpec
          - PaygatePaymentBuildSpec
      - Label:
          default: IAM
        Parameters:
          - KubectlRoleName
      - Label:
          default: EKS
        Parameters:
          - EksClusterName
    ParameterLabels:
      SourceRepo:
        default: Repository
      Branch:
        default: Branch
      PaygateCoreDockerImage:
        default: PayGate Core docker image
      PaygateBackofficeDockerImage:
        default: PayGate Backoffice docker image
      PaygatePaymentDockerImage:
        default: PayGate Payment docker image    
      PaygateCoreBuildSpec:
        default: PayGate Core build spec
      PaygateBackofficeBuildSpec:
        default: PayGate Backoffice build spec
      PaygatePaymentBuildSpec:
        default: PayGate Payment build spec
      KubectlRoleName:
        default: kubectl IAM role
      EksClusterName:
        default: EKS cluster name


Resources:
  AmazonCloudWatchEventRolePaygateCore:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        -
          PolicyName: cwe-pipeline-execution
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              -
                Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Join [ '', [ 'arn:aws:codepipeline:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':', !Ref PaygateCoreDeploymentPipeline ] ] 
  AmazonCloudWatchEventRulePaygateCore:
    Type: 'AWS::Events::Rule'
    Properties:
      EventPattern:
        detail:
          action-type: [PUSH]
          image-tag: [latest]
          repository-name: [!Ref PaygateCoreDockerImage]
          result: [SUCCESS]
        detail-type: [ECR Image Action]
        source: [aws.ecr]
      Targets:
        - Arn: !Join 
            - ''
            - - 'arn:aws:codepipeline:'
              - !Ref 'AWS::Region'
              - ':'
              - !Ref 'AWS::AccountId'
              - ':'
              - !Ref PaygateCoreDeploymentPipeline
          RoleArn: !GetAtt 
            - AmazonCloudWatchEventRolePaygateCore
            - Arn
          Id: codepipeline-PaygateCoreDeploymentPipeline  
  AmazonCloudWatchEventRolePaygateBackoffice:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        -
          PolicyName: cwe-pipeline-execution
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              -
                Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Join [ '', [ 'arn:aws:codepipeline:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':', !Ref PaygateBackofficeDeploymentPipeline ] ] 
  AmazonCloudWatchEventRulePaygateBackoffice:
    Type: 'AWS::Events::Rule'
    Properties:
      EventPattern:
        detail:
          action-type: [PUSH]
          image-tag: [latest]
          repository-name: [!Ref PaygateBackofficeDockerImage]
          result: [SUCCESS]
        detail-type: [ECR Image Action]
        source: [aws.ecr]
      Targets:
        - Arn: !Join 
            - ''
            - - 'arn:aws:codepipeline:'
              - !Ref 'AWS::Region'
              - ':'
              - !Ref 'AWS::AccountId'
              - ':'
              - !Ref PaygateBackofficeDeploymentPipeline
          RoleArn: !GetAtt 
            - AmazonCloudWatchEventRolePaygateBackoffice
            - Arn
          Id: codepipeline-PaygateBackofficeDeploymentPipeline  
  AmazonCloudWatchEventRolePaygatePayment:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        -
          PolicyName: cwe-pipeline-execution
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              -
                Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Join [ '', [ 'arn:aws:codepipeline:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':', !Ref PaygatePaymentDeploymentPipeline ] ] 
  AmazonCloudWatchEventRulePaygatePayment:
    Type: 'AWS::Events::Rule'
    Properties:
      EventPattern:
        detail:
          action-type: [PUSH]
          image-tag: [latest]
          repository-name: [!Ref PaygatePaymentDockerImage]
          result: [SUCCESS]
        detail-type: [ECR Image Action]
        source: [aws.ecr]
      Targets:
        - Arn: !Join 
            - ''
            - - 'arn:aws:codepipeline:'
              - !Ref 'AWS::Region'
              - ':'
              - !Ref 'AWS::AccountId'
              - ':'
              - !Ref PaygatePaymentDeploymentPipeline
          RoleArn: !GetAtt 
            - AmazonCloudWatchEventRolePaygatePayment
            - Arn
          Id: codepipeline-PaygatePaymentDeploymentPipeline                  
  CodePipelineArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: codepipeline-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Resource: "*"
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                  - codecommit:GetBranch
                  - codecommit:GetCommit
                  - codecommit:UploadArchive
                  - codecommit:GetUploadArchiveStatus
                  - codecommit:CancelUploadArchive
                  - iam:PassRole
                  - ecr:DescribeImages
              - Resource: !Sub arn:aws:s3:::${CodePipelineArtifactBucket}/*
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketVersioning
    DependsOn: CodePipelineArtifactBucket
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${KubectlRoleName}
                Effect: Allow
                Action:
                  - sts:AssumeRole
              - Resource: '*'
                Effect: Allow
                Action:
                  - eks:Describe*
              - Resource: '*'
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
              - Resource: '*'
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
              - Resource: '*'
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeDhcpOptions
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                  - ec2:CreateNetworkInterfacePermission
              - Resource: !Sub arn:aws:s3:::${CodePipelineArtifactBucket}/*
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetObjectVersion
              - Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${PaygateCoreDockerImage}
                Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
              - Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${PaygateBackofficeDockerImage}
                Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
              - Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${PaygatePaymentDockerImage}
                Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload        
  CodeBuildPaygateCoreImageBuilder:
    Type: AWS::CodeBuild::Project
    Properties:
      Description: Creates a PayGate Core image from source code
      Source:
        Type: CODEPIPELINE
      Environment:
        Image: aws/codebuild/amazonlinux2-x86_64-standard:2.0
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_ACCOUNT_ID
            Value: !Ref "AWS::AccountId"
          - Name: AWS_DEFAULT_REGION
            Value: !Ref "AWS::Region"
          - Name: IMAGE_REPO_NAME
            Value: !Ref PaygateCoreDockerImage
          - Name: IMAGE_TAG
            Value: latest    
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
  CodeBuildPaygateBackofficeImageBuilder:
    Type: AWS::CodeBuild::Project
    Properties:
      Description: Creates a PayGate Backoffice image from source code
      Source:
        Type: CODEPIPELINE
      Environment:
        Image: aws/codebuild/amazonlinux2-x86_64-standard:2.0
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_ACCOUNT_ID
            Value: !Ref "AWS::AccountId"
          - Name: AWS_DEFAULT_REGION
            Value: !Ref "AWS::Region"
          - Name: IMAGE_REPO_NAME
            Value: !Ref PaygateBackofficeDockerImage
          - Name: IMAGE_TAG
            Value: latest    
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
  CodeBuildPaygatePaymentImageBuilder:
    Type: AWS::CodeBuild::Project
    Properties:
      Description: Creates a PayGate Payment image from source code
      Source:
        Type: CODEPIPELINE
      Environment:
        Image: aws/codebuild/amazonlinux2-x86_64-standard:2.0
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_ACCOUNT_ID
            Value: !Ref "AWS::AccountId"
          - Name: AWS_DEFAULT_REGION
            Value: !Ref "AWS::Region"
          - Name: IMAGE_REPO_NAME
            Value: !Ref PaygatePaymentDockerImage
          - Name: IMAGE_TAG
            Value: latest    
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE            
  CodeBuildPaygateCoreDeployer:
    Type: AWS::CodeBuild::Project
    Properties:
      Description: Updates deployments
      Environment:
        Image: aws/codebuild/amazonlinux2-x86_64-standard:2.0
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_CLUSTER_NAME
            Value: !Ref EksClusterName
          - Name: AWS_DEFAULT_REGION
            Value: !Ref "AWS::Region"
          - Name: IMAGE_REPO_NAME
            Value: !Ref PaygateCoreDockerImage
          - Name: IMAGE_TAG
            Value: latest    
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Source:
        BuildSpec: !Ref PaygateCoreBuildSpec
        Type: CODEPIPELINE
  CodeBuildPaygateBackofficeDeployer:
    Type: AWS::CodeBuild::Project
    Properties:
      Description: Updates deployments
      Environment:
        Image: aws/codebuild/amazonlinux2-x86_64-standard:2.0
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_CLUSTER_NAME
            Value: !Ref EksClusterName
          - Name: AWS_DEFAULT_REGION
            Value: !Ref "AWS::Region"
          - Name: IMAGE_REPO_NAME
            Value: !Ref PaygateBackofficeDockerImage
          - Name: IMAGE_TAG
            Value: latest    
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Ref PaygateBackofficeBuildSpec
  CodeBuildPaygatePaymentDeployer:
    Type: AWS::CodeBuild::Project
    Properties:
      Description: Updates deployments
      Environment:
        Image: aws/codebuild/amazonlinux2-x86_64-standard:2.0
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_CLUSTER_NAME
            Value: !Ref EksClusterName
          - Name: AWS_DEFAULT_REGION
            Value: !Ref "AWS::Region"
          - Name: IMAGE_REPO_NAME
            Value: !Ref PaygatePaymentDockerImage
          - Name: IMAGE_TAG
            Value: latest    
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE      
        BuildSpec: !Ref PaygatePaymentBuildSpec      
  PaygateCoreBuildImagePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref CodePipelineArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: ApplicationCodeChange
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: CodeCommit
              Configuration:
                RepositoryName: !Ref PaygateCoreSourceRepo
                BranchName: !Ref PaygateCoreSourceBranch
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref CodeBuildPaygateCoreImageBuilder
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1
    DependsOn: CodeBuildPaygateCoreImageBuilder
  PaygateBackofficeBuildImagePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref CodePipelineArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: ApplicationCodeChange
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: CodeCommit
              Configuration:
                RepositoryName: !Ref PaygateBackofficeSourceRepo
                BranchName: !Ref PaygateBackofficeSourceBranch
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref CodeBuildPaygateBackofficeImageBuilder
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1
    DependsOn: CodeBuildPaygateBackofficeImageBuilder  
  PaygatePaymentBuildImagePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref CodePipelineArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: ApplicationCodeChange
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: CodeCommit
              Configuration:
                RepositoryName: !Ref PaygatePaymentSourceRepo
                BranchName: !Ref PaygatePaymentSourceBranch
              OutputArtifacts:
