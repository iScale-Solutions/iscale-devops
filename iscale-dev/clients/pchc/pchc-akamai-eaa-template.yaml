AWSTemplateFormatVersion: 2010-09-09
Description: 'This is a modified Akamai Enterprise Application Access (EAA) cloudformation template.
  AWS CloudFormation Template Akamai Connector:  This template installs
  Akamai Connector **WARNING** This template creates an Amazon EC2 instance and an
  EBS volume. You will be billed for the AWS resources used if you create a stack
  from this template.'

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      -
        Label:
          default: "Resource Configuration"
        Parameters:
          - Name
          - OrgName
          - EnvName
      -
        Label:
          default: "EC2 Configuration"
        Parameters:
          - InstanceType
          - VpcId
          - VpcSubnet

    ParameterLabels:
      Name:
        default: "Resource Name"
      OrgName:
        default: "Organization Name"
      EnvName:
        default: "Environment Name"
      InstanceType:
        default: "Instance Type"
      VpcId:
        default: "VPC ID"
      VpcSubnet:
        default: "Subnet ID"

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    Default: dsapp-akamai-eaa #change if needed
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: pchc
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  InstanceType:
    Description: Soha Connector instance type
    Type: String
    Default: c5.large
    AllowedValues:
    - c5.large
    - c5.xlarge
    - c5.2xlarge
    - c5.4xlarge
    - c5d.large
    - c5d.xlarge
    - c5d.2xlarge
    - c5d.4xlarge
    - m5.large
    - m5.xlarge
    - m5.2xlarge
    - m5.4xlarge
    - m5d.large
    - m5d.2xlarge
    - m5d.4xlarge
    - r5.large
    - r5.xlarge
    - r5.2xlarge
    - r5.4xlarge
    - r5.8xlarge
    - r5d.large
    - r5d.xlarge
    - r5d.2xlarge
    - r5d.4xlarge
    - r5d.8xlarge
    - i3.large
    - i3.2xlarge
    - i3.4xlarge
    - i3.8xlarge
    - t3.xlarge
    - t3.2xlarge
    ConstraintDescription: must be a valid EC2 instance type.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VpcId of your existing Virtual Private Cloud (VPC).
    Default: 'vpc-0fed281d3b7026344' #change if needed
  VpcSubnet:
    Description: Enter the VPC subnet of you existing Virtual Private Cloud (VPC)
    Type: AWS::EC2::Subnet::Id
    Default: 'subnet-0a48f81980ff1167a' #change if needed, need public subnet

