AWSTemplateFormatVersion: 2010-09-09
Description: Base Image Builder for Amazon Linux 2023

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
          - ImageRecipeVersion
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
      - Label:
          default: Parent Image Configuration
        Parameters:
          - AmazonLinux2023SsmParameter
      - Label:
          default: Sharing Configuration
        Parameters:
          - ShareImage
          - ShareAccountList
          - SecondRegion
          - ThirdRegion

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      ImageRecipeVersion:
        default: Image Recipe Version Number
      NetworkStackName:
        default: Network Stack Name
      SNSStackName:
        default: SNS Topic Stack Name
      AmazonLinux2023SsmParameter:
        default: Amazon Linux 2023 SSM Parameter
      ShareImage:
        default: Share image with other account? If sharing, encryption will be disabled.
      ShareAccountList:
        default: List of AWS Account IDs to share the image with, separated by comma. (Required if ShareImage is true)
      SecondRegion:
        default: Secondary region to copy the image to (Optional)
      ThirdRegion:
        default: Tertiary region to copy the image to (Optional)
      
Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    Default: image-builder
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  ImageRecipeVersion:
    Description: The version of the image recipe. (use format xx.xx.xx)
    Type: String
    Default: 1.0.0 # use date formatting for versioning (yyyy.mm.dd)
    AllowedPattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  NetworkStackName:
    Description: The name of the network stack.
    Type: String
    Default: iscale-dev-dev-uw2-network # change this if needed
    MinLength: 1
  SNSStackName:
    Description: the name of the SNS stack.
    Type: String
    Default: iscale-dev-dev-uw2-sns # change this if needed
    MinLength: 1
  AmazonLinux2023SsmParameter:
    Description: The SSM Parameter for the Amazon Linux 2023 base image.
    Type: AWS::SSM::Parameter::Value<String>
    Default: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"
  ShareImage:
    Description: Select true to not encrypt the image and share it with other accounts
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  ShareAccountList:
    Description: List of AWS Account IDs to share the image with, separated by comma. (Required if ShareImage is true)
    Type: CommaDelimitedList
    Default: 470455329885,050821737631
  SecondRegion:
    Description: Secondary region to copy the image to (Optional)
    Type: String
    Default: "us-east-1"
  ThirdRegion:
    Description: Tertiary region to copy the image to (Optional)
    Type: String
    Default: "us-east-2"


Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  IsImageShared: !Equals [!Ref ShareImage, true]

Resources:

###
# Common components
###

  CloudWatchAgentComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: CloudWatchAgent
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2023
      Version: 1.0.2
      Description: Installs CloudWatch Agent with log and metrics configuration
      ChangeDescription: Add mem/disk metrics collection with ASG aggregation dimensions
      Data: |
        name: CloudWatch - InlineData
        description: Installation of CloudWatch Log Agent
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: 01_InstallAgent
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y amazon-cloudwatch-agent
              - name: 02_ConfigureCWAgent
                action: CreateFile
                inputs:
                  - path: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.d/aws-logs.json
                    content: |
                      {
                        "agent": {
                          "metrics_collection_interval": 30
                        },
                        "logs": {
                          "logs_collected": {
                            "files": {
                              "collect_list": [
                                {
                                  "file_path": "/opt/aws/amazon-cloudwatch-agent/logs/amazon-cloudwatch-agent.log",
                                  "log_group_name": "/opt/aws/amazon-cloudwatch-agent/logs/amazon-cloudwatch-agent.log",
                                  "log_stream_name": "{hostname}_{instance_id}"
                                },
                                {
                                  "file_path": "/var/log/amazon/ssm/amazon-ssm-agent.log",
                                  "log_group_name": "/var/log/amazon/ssm/amazon-ssm-agent.log",
                                  "log_stream_name": "{hostname}_{instance_id}"
                                },
                                {
                                  "file_path": "/var/log/amazon/ssm/errors.log",
                                  "log_group_name": "/var/log/amazon/ssm/errors.log",
                                  "log_stream_name": "{hostname}_{instance_id}"
                                },
                                {
                                  "file_path": "/var/log/cloud-init.log",
                                  "log_group_name": "/var/log/cloud-init.log",
                                  "log_stream_name": "{hostname}_{instance_id}"
                                },
                                {
                                  "file_path": "/var/log/cloud-init-output.log",
                                  "log_group_name": "/var/log/cloud-init-output.log",
                                  "log_stream_name": "{hostname}_{instance_id}"
                                }
                              ]
                            }
                          }
                        }
                      }
                    overwrite: true
              - name: 03_ConfigureCWMetrics
                action: CreateFile
                inputs:
                  - path: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.d/aws-metrics.json
                    content: |
                      {
                        "metrics": {
                          "namespace": "CWAgent",
                          "append_dimensions": {
                            "AutoScalingGroupName": "${aws:AutoScalingGroupName}",
                            "InstanceId": "${aws:InstanceId}",
                            "InstanceType": "${aws:InstanceType}",
                            "ImageId": "${aws:ImageId}"
                          },
                          "aggregation_dimensions": [["AutoScalingGroupName"]],
                          "metrics_collected": {
                            "mem": {
                              "measurement": ["mem_used_percent"],
                              "metrics_collection_interval": 60
                            },
                            "disk": {
                              "measurement": ["disk_used_percent"],
                              "resources": ["/"],
                              "metrics_collection_interval": 60
                            }
                          }
                        }
                      }
                    overwrite: true
              - name: 06_SetAutoStart
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a append-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.d/aws-logs.json
                    - sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a append-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.d/aws-metrics.json
                    - sudo systemctl enable amazon-cloudwatch-agent.service

  CodeDeployComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: AmazonLinux2023CodeDeploy
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2023
      Version: 1.0.2
      Description: Installs the CodeDeploy Agent with additional log configuration
      ChangeDescription: Initial version
      Data: |
        name: CodeDeploy - InlineData
        description: Installs the CodeDeploy Agent with additional log configuration
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: 01_YumInstallWgetRuby
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y wget
                    - sudo yum install -y ruby
              - name: 02_CreateLogsConfig
                action: CreateFile
                inputs:
                  - path: /tmp/codedeploy-logs.json
                    content: |
                      {
                        "logs": {
                          "logs_collected": {
                            "files": {
                              "collect_list": [
                                {
                                  "file_path": "/var/log/aws/codedeploy-agent/codedeploy-agent.log",
                                  "log_group_name": "/var/log/aws/codedeploy-agent/codedeploy-agent.log",
                                  "log_stream_name": "{hostname}_{instance_id}"
                                },
                                {
                                  "file_path": "/opt/codedeploy-agent/deployment-root/deployment-logs/codedeploy-agent-deployments.log",
                                  "log_group_name": "/var/log/codedeploy-agent-deployments.log",
                                  "log_stream_name": "{hostname}_{instance_id}"
                                }
                              ]
                            }
                          }
                        }
                      }
                    overwrite: true
              - name: 03_WGetInstall
                action: ExecuteBash
                inputs:
                  commands:
                    - wget -P /tmp https://aws-codedeploy-us-west-2.s3.us-west-2.amazonaws.com/latest/install
              - name: 04_SetInstallPermissions
                action: SetFilePermissions
                inputs:
                  - path: /tmp/install
                    permissions: 700
              - name: 05_ExecuteInstall
                action: ExecuteBash
                inputs:
                  commands:
                    - /tmp/install auto
              - name: 06_CleanupInstall
                action: ExecuteBash
                inputs:
                  commands:
                    - rm -fr /tmp/install
              - name: 07_LinkCFNInit
                action: CreateSymlink
                inputs:
                  - path: /usr/local/bin/cfn-init
                    target: /opt/aws/bin/cfn-init
                    force: true
              - name: 08_LinkCFNHup
                action: CreateSymlink
                inputs:
                  - path: /usr/local/bin/cfn-hup
                    target: /opt/aws/bin/cfn-hup
                    force: true
              - name: 09_LinkCFNSignal
                action: CreateSymlink
                inputs:
                  - path: /usr/local/bin/cfn-signal
                    target: /opt/aws/bin/cfn-signal
                    force: true

  CloudFormationLogsComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: CloudFormationLogs
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2023
      Version: 1.0.4
      Description: Setup CloudFormation logs
      ChangeDescription: Initial version
      Data: |
        name: CloudFormationLogs - InlineData
        description: Setup CloudFormation logs
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: 01_CreateCFNLogsConfig
                action: CreateFile
                inputs:
                  - path: /tmp/cloudformation-logs.json
                    content: |
                      {
                        "logs": {
                          "logs_collected": {
                            "files": {
                              "collect_list": [
                                {
                                  "file_path": "/var/log/cfn-hup.log",
                                  "log_group_name": "/var/log/cfn-hup.log",
                                  "log_stream_name": "{hostname}_{instance_id}"
                                },
                                {
                                  "file_path": "/var/log/cfn-init-cmd.log",
                                  "log_group_name": "/var/log/cfn-init-cmd.log",
                                  "log_stream_name": "{hostname}_{instance_id}"
                                },
                                {
                                  "file_path": "/var/log/cfn-init.log",
                                  "log_group_name": "/var/log/cfn-init.log",
                                  "log_stream_name": "{hostname}_{instance_id}"
                                },
                                {
                                  "file_path": "/var/log/cfn-wire.log",
                                  "log_group_name": "/var/log/cfn-wire.log",
                                  "log_stream_name": "{hostname}_{instance_id}"
                                }
                              ]
                            }
                          }
                        }
                      }
                    overwrite: true

  AL2023CommonLinuxUtilitiesComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: AmazonLinux2023-CommonUtilities
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2023
      Version: 1.0.0
      Description: Installation of common Amazon Linux 2023 utilities
      ChangeDescription: Initial version
      Data: |
        name: AWWS Linux Utilities
        description: Installation of common Amazon Linux 2023 utilities
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: YumUpdate
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum -y update
              - name: InstallEFS
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y amazon-efs-utils
              - name: InstallTelnet
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y telnet

  RestartCloudWatchAgentComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: RestartCloudWatchAgent
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2023
      Version: 1.0.1
      Description: Append new CloudWatch config and restart the CloudWatch Agent
      ChangeDescription: Initial version
      Data: |
        name: RestartCloudWatchAgent
        description: Append new CloudWatch config and restart the CloudWatch Agent
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: 01_AppendAndRestartCloudWatchAgent
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a append-config -m ec2 -s -c file:/tmp/cloudformation-logs.json
                    - sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a append-config -m ec2 -s -c file:/tmp/codedeploy-logs.json

###
# Image Recipe
###

# Amazon Linux 2023 Base Image

  AmazonLinux2023ImageRecipe:
    Type: AWS::ImageBuilder::ImageRecipe
    Properties:
      Name: !Join ['-', [!Ref OrgName, 'base-amazon-linux2023']]
      Version: !Ref ImageRecipeVersion
      ParentImage: !Ref AmazonLinux2023SsmParameter # parent image, use the latest from parameter store
      WorkingDirectory: /tmp
      Description: !Join [' ', ['Base image for', !Ref OrgName, 'amazon-linux 2023']]
      Components: #Max 20
        - ComponentArn: !Ref CloudWatchAgentComponent
        - ComponentArn: !Ref CodeDeployComponent
        - ComponentArn: !Ref CloudFormationLogsComponent
        - ComponentArn: !Ref AL2023CommonLinuxUtilitiesComponent
        - ComponentArn: !Ref RestartCloudWatchAgentComponent
        - ComponentArn: !Join [':', ['arn:aws:imagebuilder', !Ref 'AWS::Region', 'aws:component/aws-cli-version-2-linux/1.0.4/1']]
        - ComponentArn: !Join [':', ['arn:aws:imagebuilder', !Ref 'AWS::Region', 'aws:component/update-linux/1.0.2/1']]
        # - ComponentArn: !Join [':', ['arn:aws:imagebuilder', !Ref 'AWS::Region', 'aws:component/stig-build-linux-high/2025.1.0/1']]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: !If [IsImageShared, false, true]
            VolumeType: gp3
            VolumeSize: 8

###
# Image Builder
###

  AmazonLinux2023Builder: 
    Type: AWS::CloudFormation::Stack
    Properties: 
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/ec2-image-builder.yaml
      Parameters: 
        Name: amazon-linux2023
        EnvName: !Ref EnvName
        NetworkStackName: !Ref NetworkStackName
        OrgName: !Ref OrgName
        ImageRecipeARN: !Ref AmazonLinux2023ImageRecipe
        ShareImage: !Ref ShareImage
        SNSStackName: !Ref SNSStackName
        ShareAccountList: !Join [',', !Ref ShareAccountList]
        SecondRegion: !Ref SecondRegion
        ThirdRegion: !Ref ThirdRegion
