                  commands:
                    - |
                      sudo yum install php8.2 -y
                      sudo yum install php php-{common,cgi,cli,fpm,mysqlnd,devel,gd,mbstring,curl,xml,pear,bcmath,json,opcache,gettext,intl,zip,pgsql,pdo_pgsql} -y

  ComposerComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: Composer-Component
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
        - Amazon Linux 2023
      Version: 2.0.1
      Description: Installing composer
      ChangeDescription: Initial version
      Data: |
        name: Composer-Component - InlineData
        description: Installing composer
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: InstallComposer
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      sudo curl -sS https://getcomposer.org/installer | sudo php
                      sudo mv composer.phar /usr/local/bin/composer
                      sudo ln -sf /usr/local/bin/composer /usr/bin/composer

  SupervisorComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: Supervisor-Component
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2023
      Version: 1.3.0
      Description: Installing supervisord and creating necessary directories
      ChangeDescription: Add supervisord service and directories
      Data: |
        name: Supervisor-Component - InlineData
        description: Installing supervisor
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: InstallSupervisor
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      sudo su ec2-user
                      sudo dnf install python3-pip -y
                      sudo pip3 install supervisor

                      echo_supervisord_conf | sudo tee /etc/supervisord.conf > /dev/null

                      sudo tee /etc/systemd/system/supervisord.service > /dev/null <<'EOF'
                      [Unit]
                      Description=Supervisor daemon
                      After=network.target

                      [Service]
                      ExecStart=/usr/local/bin/supervisord -n -c /etc/supervisord.conf
                      ExecStop=/usr/local/bin/supervisorctl shutdown
                      ExecReload=/usr/local/bin/supervisorctl reload
                      KillMode=process
                      Restart=on-failure

                      [Install]
                      WantedBy=multi-user.target
                      EOF

                      sudo mkdir -p /var/log/supervisor /var/run/supervisor
                      sudo touch /var/log/supervisord.log

                      sudo systemctl daemon-reload
                      sudo systemctl enable supervisord


