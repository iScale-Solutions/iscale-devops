  PHP82Component:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: PHP82-Component
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 1.0.0
      Description: Installing php using amazon-linux-extras (php 8.2)
      ChangeDescription: Initial version
      Data: |
        name: AmazonLinux2LEMPStackREMI - InlineData
        description: Installing php using amazon-linux-extras (php 8.2)
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: InstallPHP
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      sudo amazon-linux-extras enable php8.2
                      sudo yum clean metadata
                      sudo yum install php -y
                      sudo yum install php php-{common,cgi,cli,fpm,mysqlnd,devel,gd,mbstring,curl,xml,pear,bcmath,json,opcache,gettext,intl,zip} -y

