AWSTemplateFormatVersion: 2010-09-09
Description: PCHC Image builder

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
      - Label:
          default: EC2 Image Builder Configuration
        Parameters:
          - InstanceTypeName
          - AmazonLinux2023Version
      - Label:
          default: Sharing Configuration
        Parameters:
          - ShareImage
          - ShareAccountList
          - SecondRegion
          - ThirdRegion
          - RetainAmiCount

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      InstanceTypeName:
        default: EC2 Instance Type
      AmazonLinux2023Version:
        default: Amazon Linux 2023 Image Version
      NetworkStackName:
        default: Network Stack Name
      ShareImage:
        default: Share image with other account? If sharing, encryption will be disabled.
      ShareAccountList:
        default: List of AWS Account IDs to share the image with, separated by comma. (Required if ShareImage is true)
      SecondRegion:
        default: Secondary region to copy the image to (Optional)
      ThirdRegion:
        default: Tertiary region to copy the image to (Optional)
      SNSStackName:
        default: SNS Topic Stack Name
      RetainAmiCount:
        default: Number of AMI versions to retain (older versions are deleted)

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    Default: image-builder
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: pchc
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Development
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  InstanceTypeName:
    Description: EC2 Instance Type for Image Builder
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge
      - t3.2xlarge
  AmazonLinux2023Version:
    Description: The version of Amazon Linux 2023 to use as the base image.
    Type: String
    Default: 1.1.1
  NetworkStackName:
    Description: The name of the network stack.
    Type: String
    Default: pchc-dev-ase1-network
    MinLength: 1
  ShareImage:
    Description: Select true to not encrypt the image and share it with other accounts
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  ShareAccountList:
    Description: List of AWS Account IDs to share the image with, separated by comma. (Required if ShareImage is true)
    Type: CommaDelimitedList
    Default: 470455329885,050821737631
  SecondRegion:
    Description: Secondary region to copy the image to (Optional)
    Type: String
    Default: "us-west-2"
  ThirdRegion:
    Description: Tertiary region to copy the image to (Optional)
    Type: String
    Default: "us-east-2"
  SNSStackName:
    Description: the name of the SNS stack.
    Type: String
    Default: pchc-dev-ase1-sns
    MinLength: 1
  RetainAmiCount:
    Description: Number of most recent AMI versions to keep. Older versions are automatically deleted.
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 100

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml      
  IsImageShared: !Equals [!Ref ShareImage, true]

Resources:

  Java11Component:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: Java11
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 1.0.4
      Description: Installs Java11
      ChangeDescription: Initial version
      Data: |
        name: Java11 - InlineData
        description: Installation of Java11
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: InstallJava11
                action: ExecuteBash
                inputs:
                  commands:
                    - amazon-linux-extras install java-openjdk11

  MySQLClientComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: MySQL Client
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
        - Amazon Linux 2023
      Version: 1.1.0
      Description: Installs MySQL Client + dev libs
      ChangeDescription: Initial version
      Data: |
        name: MySQL Client - InlineData
        description: Installation of MySQL Client
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: YumInstallMySQLCLient
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y mysql
              - name: YumInstallMySQLDevel
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y mysql-devel

  MariaDBClientComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: MariaDB Client
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2023
      Version: 1.0.0
      Description: Installs MariaDB Client + dev libs
      ChangeDescription: Initial version
      Data: |
        name: MariaDB Client - InlineData
        description: Installation of MariaDB Client
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: YumInstallMariaDBCLient
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y mariadb105
              - name: YumInstallMariaDBDevel
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y mariadb105-devel

  NginxComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: NginX
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
        - Amazon Linux 2023
      Version: 1.0.9
      Description: Installs NginX
      ChangeDescription: Initial version
      Data: |
        name: NginX - InlineData
        description: Installation of NginX
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: InstallNginx
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y nginx
                    - sudo mkdir /var/www
                    - sudo systemctl start nginx
                    - sudo systemctl enable nginx
              - name: CreateNginxCloudWatchConfig
                action: CreateFile
                inputs:
                  - path: /tmp/nginx-log.json
                    content: |
                      {
                        "logs": {
                          "logs_collected": {
                            "files": {
                              "collect_list": [
                                {
                                  "file_path": "/var/log/nginx/access.log",
                                  "log_group_name": "/var/log/nginx/access.log"
                                },
                                {
                                  "file_path": "/var/log/nginx/error.log",
                                  "log_group_name": "/var/log/nginx/error.log"
                                }
                              ]
                            }
                          }
                        }
                      }
                    overwrite: true
              - name: RestartAgent
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a append-config -m ec2 -s -c file:/tmp/nginx-log.json

  NodeJSComponent:
