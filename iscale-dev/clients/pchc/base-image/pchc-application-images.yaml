  RoRComponent3:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: RubyOnRails3
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2023
      Version: 2.0.20
      Description: Installs RoR v2.4.1
      ChangeDescription: Fix nokogiri version, pre-compile mysql2 native ext, add ImageMagick for paperclip
      Data: |
        name: RoR2 - InlineData
        description: Installation of RoR v2.4.1
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: InstallAndUpdateDependencies
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo dnf update -y
                    - sudo dnf groupinstall "Development Tools" -y
                    - sudo dnf install -y gcc make bzip2 bzip2-devel libffi-devel zlib-devel gdbm-devel ncurses-devel openssl-devel readline-devel libxml2 libxml2-devel libxslt libxslt-devel git tar curl readline ImageMagick ImageMagick-devel
                    - mkdir -p /usr/local/src && cd /usr/local/src
                    - curl -L -O https://www.openssl.org/source/openssl-1.1.1w.tar.gz
                    - tar xzf openssl-1.1.1w.tar.gz
                    - cd openssl-1.1.1w
                    - ./config --prefix=/usr/local/openssl-1.1.1 --openssldir=/usr/local/openssl-1.1.1 shared zlib
                    - make -j$(nproc)
                    - make install
              - name: InstallRbenvRubyBuildRubyAndRoR
                action: ExecuteBash
                inputs:
                  commands:
                    - git clone https://github.com/rbenv/rbenv.git /usr/local/rbenv
                    - mkdir -p /usr/local/rbenv/plugins
                    - git clone https://github.com/rbenv/ruby-build.git /usr/local/rbenv/plugins/ruby-build
                    - echo 'export RBENV_ROOT="/usr/local/rbenv"' | sudo tee /etc/profile.d/rbenv.sh
                    - echo 'export PATH="$RBENV_ROOT/bin:$PATH"' | sudo tee -a /etc/profile.d/rbenv.sh
                    - echo 'eval "$(rbenv init - bash)"' | sudo tee -a /etc/profile.d/rbenv.sh
                    - chmod +x /etc/profile.d/rbenv.sh
                    - source /etc/profile.d/rbenv.sh
                    - rbenv -v
                    - sudo yum install -y readline-devel
                    - rpm -q readline-devel >/dev/null 2>&1 || exit 1
                    - set -x
                    - RUBY_CONFIGURE_OPTS="--with-openssl-dir=/usr/local/openssl-1.1.1 --with-readline-dir=/usr/include" rbenv install -v 2.4.1
                    - echo $(rbenv versions --bare | grep -Fx 2.4.1)
                    - echo "Done installing Ruby 2.4.1"
                    - ln -s /etc/pki/tls/certs/ca-bundle.crt /usr/local/openssl-1.1.1/cert.pem
                    - rbenv global 2.4.1
                    - ruby -v
                    - ruby -ropenssl -e 'puts OpenSSL::OPENSSL_LIBRARY_VERSION'
                    - gem update --system 3.0.8
                    - gem install bundler -v 1.17.3
                    - |
                      cat << EOF >> /tmp/Gemfile
                      source 'https://rubygems.org'
                      ruby '2.4.1'
                      gem 'rails', '4.2.8'
                      gem 'nokogiri', '1.10.2'
                      gem 'mysql2', '0.4.10'
                      gem 'sprockets', '3.7.2'
                      gem 'racc', '1.4.14'
                      EOF
                    - BUNDLE_GEMFILE=/tmp/Gemfile bundle _1.17.3_ install
                    - gem rdoc --all
              - name: InstallRbenvGemset
                action: ExecuteBash
                inputs:
                  commands:
                    - mkdir -p "$(rbenv root)"/plugins
                    - git clone https://github.com/jf/rbenv-gemset.git "$(rbenv root)"/plugins/rbenv-gemset
                    - exec $SHELL
  RoRComponent4:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: RubyOnRails3
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2023
      Version: 1.0.0
      Description: Installs RoR v2.4.1
      ChangeDescription: Initial version
      Data: |
        name: RoR2 - ec2-user-optimized
        description: Installation of RoR v2.4.1 for ec2-user
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: InstallAndUpdateDependencies
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo dnf update -y
                    - sudo dnf groupinstall "Development Tools" -y
                    - sudo dnf install -y gcc make bzip2 bzip2-devel libffi-devel zlib-devel gdbm-devel ncurses-devel openssl-devel readline-devel libxml2 libxml2-devel libxslt libxslt-devel git tar curl
                    # Install OpenSSL 1.1.1 (Required for Ruby 2.4.x)
                    - mkdir -p /usr/local/src && cd /usr/local/src
                    - curl -L -O https://www.openssl.org/source/openssl-1.1.1w.tar.gz
                    - tar xzf openssl-1.1.1w.tar.gz
                    - cd openssl-1.1.1w
                    - ./config --prefix=/usr/local/openssl-1.1.1 --openssldir=/usr/local/openssl-1.1.1 shared zlib
                    - make -j$(nproc)
                    - make install

              - name: SetupRbenvForEc2User
                action: ExecuteBash
                inputs:
                  commands:
                    # 1. Clone rbenv into ec2-user's home
                    - sudo -u ec2-user git clone https://github.com/rbenv/rbenv.git /home/ec2-user/.rbenv
                    - sudo -u ec2-user mkdir -p /home/ec2-user/.rbenv/plugins
                    - sudo -u ec2-user git clone https://github.com/rbenv/ruby-build.git /home/ec2-user/.rbenv/plugins/ruby-build
                    - sudo -u ec2-user git clone https://github.com/jf/rbenv-gemset.git /home/ec2-user/.rbenv/plugins/rbenv-gemset
                    
                    # 2. Add rbenv to ec2-user's bashrc
                    - |
                      sudo -u ec2-user tee -a /home/ec2-user/.bashrc <<EOF
                      export PATH="\$HOME/.rbenv/bin:\$PATH"
                      eval "\$(rbenv init - bash)"
                      EOF

              - name: InstallRubyAsEc2User
                action: ExecuteBash
                inputs:
                  commands:
                    # 3. Use a login shell (-i) to run the install. This ensures PATH is correct.
                    - |
                      sudo -u ec2-user -i bash -c '
                        export RUBY_CONFIGURE_OPTS="--with-openssl-dir=/usr/local/openssl-1.1.1 --with-readline-dir=/usr/include"
                        rbenv install -v 2.4.1
                        rbenv global 2.4.1
                        
                        # Install Bundler and update gems as ec2-user
                        gem update --system 3.0.8
                        gem install bundler -v 1.17.3
                        rbenv rehash
                        
                        # Verify
                        ruby -v
                        ruby -ropenssl -e "puts OpenSSL::OPENSSL_LIBRARY_VERSION"
                      '
                    # 4. Final Permission Fix (Just in case)
                    - sudo chown -R ec2-user:ec2-user /home/ec2-user/.rbenv

