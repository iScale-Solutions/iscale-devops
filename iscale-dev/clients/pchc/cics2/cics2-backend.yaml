AWSTemplateFormatVersion: 2010-09-09
Description: CICS2 Resources and Lambda serverless permissions

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
          - CicsPrereqStackName

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      NetworkStackName:
        default: Network Stack Name
      SNSStackName:
        default: SNS Topic Stack Name
      CicsPrereqStackName:
        default: CICS2 Prerequisite Stack Name

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name)
    Type: String
    MinLength: 3
    MaxLength: 15
    Default: cics2-backend
  OrgName:
    Description: The name of the organization
    Type: String
    Default: pchc
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production # Test for uat
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  NetworkStackName:
    Description: The name of the network stack
    Type: String
    Default: pchc-stg-uw2-cics2-network
    MinLength: 1
  SNSStackName:
    Description: The name of the SNS stack
    Type: String
    Default: pchc-test-uw2-sns
    MinLength: 1
  CicsPrereqStackName:
    Description: The name of the CICS2 prerequisite stack (this stack also contains the documentDB cluster)
    Type: String
    Default: 'pchc-stg-uw2-cics2-prereq'
    MinLength: 1

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml

Resources:

# CICS2 Lambda Bref Deployment User Group, the the github user to this group
# permissions to deploy lambda using serverless.yml

  LambdaDeploymentUserGroup:
    Type: AWS::IAM::Group
    Properties:
      Policies:
        - PolicyName: BrefPolicy1
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CancelUpdateStack
                  - cloudformation:ContinueUpdateRollback
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:Describe*
                  - cloudformation:EstimateTemplateCost
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:Get*
                  - cloudformation:List*
                  - cloudformation:UpdateStack
                  - cloudformation:UpdateTerminationProtection
                Resource: !Join ['', ['arn:aws:cloudformation:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':stack/', outward-icl-sfn*]] # update the name from the serverless.yml service name
              - Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - iam:CreateRole
                  - iam:PassRole
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:FilterLogEvents
                  - logs:GetLogEvents
                  - logs:PutSubscriptionFilter
                  - logs:TagResource
                  - logs:DeleteSubscriptionFilter
                  - s3:CreateBucket
                  - s3:ListAllMyBuckets
                  - iam:TagRole
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:UpdateAssumeRolePolicy
                Resource: !Join ['', ['arn:aws:iam::', !Ref 'AWS::AccountId', ':role/', outward-icl-sfn*]] # update the name from the serverless.yml service name
              - Effect: Allow
                Action:
                  - lambda:*
                Resource: !Join ['', ['arn:aws:lambda:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':function:', outward-icl-sfn*]] # update the name from the serverless.yml service name
              - Effect: Allow
                Action:
                  - states:CreateStateMachine
                  - states:DeleteStateMachine
                  - states:TagResource
                  - states:DescribeStateMachine
                  - states:UpdateStateMachine
                Resource: "*" # need to update naming of serverless step functions
        - PolicyName: EcrWriteAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ecr:CompleteLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:InitiateLayerUpload
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                Resource: 
                  Fn::ImportValue:
                    !Sub '${CicsPrereqStackName}-PortalEcrArnName'
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"

# secgroup for lambda, get the secgroup ID and add it to github cicd secrets. this will be attached to all deployed lambdas using serverless.yml

  Cics2LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [ '-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], lambda] ]
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, lambda]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

############## attach this secgroup to documentDB secgroup to allow lambda to connect to docDB
  AllowCics2LambdaIntoDocDB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from Cics2 Lambda
      IpProtocol: TCP
      GroupId: 
        Fn::ImportValue: !Sub '${CicsPrereqStackName}-DocuDBElasticSecurityGroup'
      FromPort: 27017
      ToPort: 27017
      SourceSecurityGroupId: !GetAtt Cics2LambdaSecurityGroup.GroupId

# Generate KMS key
  Cics2KmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Symmetric KMS key for encrypt decrypt Lambda environment variables
      EnableKeyRotation: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccount
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: AllowLambdaService
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey*
            Resource: "*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub lambda.${AWS::Region}.amazonaws.com
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, kms]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName
  
  Cics2KmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: 
        !Join
        - '-'
        - - !Join ['', ["alias/", !Ref OrgName]]
          - !FindInMap [EnvShort, !Ref EnvName, Name]
          - !FindInMap [RegionShort, !Ref 'AWS::Region', Name]
          - !Ref Name
          - key
      TargetKeyId: !Ref Cics2KmsKey

  Bank000S3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], bank000]]
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 3
          Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], bank000]]
        - Key: Organization
          Value: !Ref OrgName

  Bank001S3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], bank001]]
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 3
          Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], bank000]]
        - Key: Organization
          Value: !Ref OrgName
Outputs:

  LambdaDeploymentUserGroup:
    Description: Add the github user into this group
    Value: !Ref LambdaDeploymentUserGroup

  Cics2LambdaSecurityGroupId:
    Description: MIS Lambda Secgroup ID
    Value: !GetAtt Cics2LambdaSecurityGroup.GroupId
    Export: 
      Name: !Sub ${AWS::StackName}-Cics2LambdaSecurityGroupId

