AWSTemplateFormatVersion: 2010-09-09
Description: CICS2 Resources and Lambda serverless permissions

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
          - CicsPrereqStackName
          - ClientDomainName
      - Label:
          default: Queueing Service Host Configuration
        Parameters:
          - BatchAmiId
          - QueueingHostAmiId
          - S3TriggerLambdaArn

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      NetworkStackName:
        default: Network Stack Name
      SNSStackName:
        default: SNS Topic Stack Name
      CicsPrereqStackName:
        default: CICS2 Prerequisite Stack Name
      BatchAmiId:
        default: Batch Host AMI ID
      QueueingHostAmiId:
        default: Queueing Service Host AMI ID
      S3TriggerLambdaArn:
        default: S3 Trigger Lambda ARN
        
Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name)
    Type: String
    MinLength: 3
    MaxLength: 15
    Default: cics2-backend
  OrgName:
    Description: The name of the organization
    Type: String
    Default: pchc
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production # Test for uat
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  NetworkStackName:
    Description: The name of the network stack
    Type: String
    Default: pchc-stg-uw2-cics2-network
    MinLength: 1
  SNSStackName:
    Description: The name of the SNS stack
    Type: String
    Default: pchc-test-uw2-sns
    MinLength: 1
  CicsPrereqStackName:
    Description: The name of the CICS2 prerequisite stack (this stack also contains the documentDB cluster)
    Type: String
    Default: 'pchc-stg-uw2-cics2-prereq'
    MinLength: 1
  ClientDomainName:
    Description: The domain name for the client (used for load balancer hostnames)
    Type: String
    Default: pchcdev.com
  BatchAmiId:
    Description: The AMI ID for Amazon Linux 2023
    Type: AWS::EC2::Image::Id
    Default: ami-088d74defe9802f14 #ami-01102c5e8ab69fb75 # Update this to the latest AL2023 AMI ID for your region ##delete this once ASG is working
    ConstraintDescription: Must be a valid Amazon Linux 2023 AMI ID.
  QueueingHostAmiId:
    Description: The AMI ID for Amazon Linux 2023
    Type: AWS::EC2::Image::Id
    Default: ami-088d74defe9802f14 #Update this to the latest AL2023 AMI ID for your region
    ConstraintDescription: Must be a valid Amazon Linux 2023 AMI ID.
  InstanceKeyName:
    Description: Instance Key Name
    Type: String
    Default: ''
  S3TriggerLambdaArn:
    Description: The ARN of the S3 Trigger Lambda function
    Type: String
    Default: 'arn:aws:lambda:us-west-2:050821737631:function:pchc-stg-uw2-cics2-sls-stg-s3TriggerSQS'
  StartScheduleExpression:
    Description: The cron expression to start the Queueing Service Host instances
    Type: String
    Default: "cron(0 8 ? * MON-FRI *)" # Every weekday at 8 AM UTC
  StopScheduleExpression:
    Description: The cron expression to stop the Queueing Service Host instances
    Type: String
    Default: "cron(0 20 ? * MON-FRI *)" # Every weekday at 8 PM UTC

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml

Resources:

# CICS2 Lambda Bref Deployment User Group, the the github user to this group
# permissions to deploy lambda using serverless.yml

  LambdaDeploymentUserGroup:
    Type: AWS::IAM::Group
    Properties:
      Policies:
        - PolicyName: BrefPolicy1
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: CfnSlsPolicy
                Effect: Allow
                Action:
                  - cloudformation:CancelUpdateStack
                  - cloudformation:ContinueUpdateRollback
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:Describe*
                  - cloudformation:EstimateTemplateCost
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:Get*
                  - cloudformation:List*
                  - cloudformation:UpdateStack
                  - cloudformation:UpdateTerminationProtection
                Resource: !Join ['', ['arn:aws:cloudformation:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':stack/', !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '-', !Select [0, !Split ['-', !Ref Name] ], -sls*]] # update the name from the serverless.yml service name
              - Sid: IamSlsPolicy
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:UpdateAssumeRolePolicy
                Resource: !Join ['', ['arn:aws:iam::', !Ref 'AWS::AccountId', ':role/', !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '-', !Select [0, !Split ['-', !Ref Name] ], -sls*]] # update the name from the serverless.yml service name
              - Sid: LambdaPolicy
                Effect: Allow
                Action:
                  - lambda:*  #TODO
                  - lambda:ListVersionsByFunction
                  - lambda:ListAliases
                Resource: 
                  - !Join ['', ['arn:aws:lambda:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':function:', !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '-', !Select [0, !Split ['-', !Ref Name] ], '*']]
              - Sid: LambdaEventSourceMappingPolicy
                Effect: Allow
                Action:
                  - lambda:CreateEventSourceMapping
                  - lambda:TagResource
                  - lambda:UpdateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                Resource: 
                  - !Join ['', ['arn:aws:lambda:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':event-source-mapping:*']]
              - Sid: LambdaGetAndListEventSourceMappingPolicy
                Effect: Allow
                Action:
                  - lambda:ListEventSourceMappings
                  - lambda:GetEventSourceMapping
                Resource: "*"
              - Sid: LambdaAccessLogsPolicy
                Effect: Allow
                Action: 
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:TagResource
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DescribeLogStreams
                  - logs:FilterLogEvents
                  - logs:GetLogEvents
                  - logs:PutSubscriptionFilter
                  - logs:DeleteSubscriptionFilter
                Resource: 
                  - !Join ['', ['arn:aws:logs:', !Ref AWS::Region,':', !Ref AWS::AccountId, ':log-group:/aws/lambda/', !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref AWS::Region, Name], '-', !Select [0, !Split ['-', !Ref Name]], '-lambda*']]
              - Sid: AccessToSecrets
                Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:ListSecrets
                Resource: !Join ['', ['arn:aws:secretsmanager:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':secret:', !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '-', !Select [0, !Split ['-', !Ref Name] ], '*']]
              - Sid: CreateTagRolePolicy
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:TagRole
                Resource: !Join ['', ['arn:aws:iam::', !Ref 'AWS::AccountId', ':role/', !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '-', !Select [0, !Split ['-', !Ref Name] ], '-sls-*']]
              - Sid: PassRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Join ['', ['arn:aws:iam::', !Ref 'AWS::AccountId', ':role/', !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '-', !Select [0, !Split ['-', !Ref Name] ], '-QueueingServiceHostRole-*']]
                  - !Join ['', ['arn:aws:iam::', !Ref 'AWS::AccountId', ':role/', !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '-', !Select [0, !Split ['-', !Ref Name] ], '-sls-*']]
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - lambda.amazonaws.com
                      - !Join ['.', ['states', !Ref 'AWS::Region', 'amazonaws.com']]
                      - ec2.amazonaws.com
                      - states.amazonaws.com
              - Sid: UnrestrictedPermissions1
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - logs:DescribeLogGroups
                  - s3:ListAllMyBuckets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                Resource: "*"
              - Sid: S3Policy
                Effect: Allow
                Action:
                  - s3:PutBucketTagging
                  - s3:ListBucket
                  - s3:PutBucketTagging
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketPolicy
                Resource: 
                  - !Join ['', ['arn:aws:s3:::', !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '-', !Select [0, !Split ['-', !Ref Name]], '-*']]
                  # - !Join ['', ['arn:aws:s3:::', "*"]] #TODO
                  # - !Join ['', ['arn:aws:s3:::', "*/*"]] #TODO
              - Sid: S3CreatePolicy
                Effect: Allow
                Action:
                  - s3:CreateBucket
                Resource: "*"
                Condition: # only allow creating buckets with specific naming pattern
                  StringLike:
                    s3:BucketName: 
                      - !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '*']]
              - Sid: ApiGatewayPolicy
                Effect: Allow
                Action:
                  - apigateway:PUT
                  - apigateway:POST
                  - apigateway:PATCH
                  - apigateway:GET
                  - apigateway:DELETE
                Resource: # api gateways created by serverless are respawned on every deploy so need to allow *
                  - !Join ['', ['arn:aws:apigateway:', !Ref 'AWS::Region', '::*restapi*']] 
                  - !Join ['', ['arn:aws:apigateway:', !Ref 'AWS::Region', '::/tags/*']]
                  - !Join ['', ['arn:aws:apigateway:', !Ref 'AWS::Region', '::/apis/*/*']]
                  - !Join ['', ['arn:aws:apigateway:', !Ref 'AWS::Region', '::/apis']]
                  - !Join ['', ['arn:aws:apigateway:', !Ref 'AWS::Region', '::/apis/*']]
              - Sid: UnrestrictedPermissions3
                Effect: Allow
                Action: 
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:TagResource
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                Resource: !Join ['', ['arn:aws:logs:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':*cics2*']] #TODO
              - Sid: StepFunctionsPolicy
                Effect: Allow
                Action:
                  - states:CreateStateMachine
                  - states:DescribeStateMachine
                  - states:DeleteStateMachine
                  - states:UpdateStateMachine
                  - states:StartExecution
                  - states:DescribeExecution
                  - states:StopExecution
                  - states:TagResource
                Resource: !Join ['', ['arn:aws:states:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':stateMachine:', !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '-', !Select [0, !Split ['-', !Ref Name] ], '-stepf-OutwardICL-standard']]
              - Sid: CognitoPolicy
                Effect: Allow
                Action:
                  - cognito-idp:Create*
                  - cognito-idp:Get*
                  - cognito-idp:Delete*
                  - cognito-idp:Update*
                  - cognito-idp:Describe*
                  # - cognito-idp:* # TODO need to update specific permissions
                Resource: !Join ['', ['arn:aws:cognito-idp:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':userpool/',  !Ref 'AWS::Region', '_*' ]]
              - Sid: EventBridgePolicy
                Effect: Allow
                Action:
                  - events:DescribeRule
                  - events:PutRule
                  - events:DeleteRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:ListRules
                  - events:EnableRule
                  - events:DisableRule
                Resource: !Join ['', ['arn:aws:events:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':rule/',  !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '-', !Select [0, !Split ['-', !Ref Name]], '-sls-*']] #TODO
              - Sid: SqsPolicy
                Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:GetQueueAttributes
                  - sqs:SetQueueAttributes
                  - sqs:DeleteQueue
                  - sqs:ListQueues
                  - sqs:TagQueue
                Resource: 
                  - !Join ['', ['arn:aws:sqs:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':', !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '-', !Select [0, !Split ['-', !Ref Name]], '-sls-*']]

# secgroup for lambda, get the secgroup ID and add it to github cicd secrets. this will be attached to all deployed lambdas using serverless.yml

  Cics2LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [ '-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], lambda] ]
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, lambda]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

############## attach this secgroup to documentDB secgroup to allow lambda to connect to docDB
  AllowCics2LambdaIntoDocDB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from Cics2 Lambda
      IpProtocol: TCP
      GroupId: 
        Fn::ImportValue: !Sub '${CicsPrereqStackName}-DocuDBElasticSecurityGroup'
      FromPort: 27017
      ToPort: 27017
      SourceSecurityGroupId: !GetAtt Cics2LambdaSecurityGroup.GroupId

# Generate KMS key
  Cics2KmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Symmetric KMS key for encrypt decrypt Lambda environment variables
      EnableKeyRotation: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccount
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: AllowCics2KmsKey
            Effect: Allow
            Principal:
              AWS: !Join ['', ['arn:aws:iam::',!Ref AWS::AccountId, ':user/', !Ref OrgName, '-', !Select [0, !Split ['-', !Ref Name]]]]
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
          - Sid: AllowCics2KmsKeyGrant
            Effect: Allow
            Principal:
              AWS: !Join ['', ['arn:aws:iam::',!Ref AWS::AccountId, ':user/', !Ref OrgName, '-', !Select [0, !Split ['-', !Ref Name]]]]
            Action:
              - kms:CreateGrant
              - kms:ListGrants
              - kms:RevokeGrant
            Resource: "*"
            Condition:
              Bool:
                kms:GrantIsForAWSResource: true
          - Sid: AllowLambdaService
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey*
            Resource: "*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub lambda.${AWS::Region}.amazonaws.com
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, kms]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName
  
  Cics2KmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: 
        !Join
        - '-'
        - - !Join ['', ["alias/", !Ref OrgName]]
          - !FindInMap [EnvShort, !Ref EnvName, Name]
          - !FindInMap [RegionShort, !Ref 'AWS::Region', Name]
          - !Ref Name
          - key
      TargetKeyId: !Ref Cics2KmsKey

  Bank000S3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], bank000]]
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 3
          Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], bank000]]
        - Key: Organization
          Value: !Ref OrgName

  Bank001S3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], bank001]]
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 3
          Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], bank000]]
        - Key: Organization
          Value: !Ref OrgName
##
# Batch Host
##
  
  QueueingServiceHostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      # Policies:
      #   - PolicyName: QueueingServiceHostSSMPolicy
      #     PolicyDocument:
      #       Version: 2012-10-17
      #       Statement:
      #         - Sid: SSMGetParametersByPath
      #           Action:
      #             - ssm:GetParametersByPath
      #           Effect: Allow
      #           Resource: !Join ['', ['arn:aws:ssm:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':parameter/', !Ref OrgName, '/', !FindInMap [EnvShort, !Ref EnvName, Name], '/',  !Select [0, !Split ['-', !Ref Name]], '/*']]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM

  QueueingServiceHostInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: '/'
      Roles:
        - !Ref QueueingServiceHostRole

  QueueingServiceHostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: 
        Fn::ImportValue:
          !Join ['', [!Ref NetworkStackName, '-VpcId']] 
      GroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], queuing, service, security, group]]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId:
            Fn::ImportValue:
              !Join ['', [!Ref NetworkStackName, '-JumpHostSecurityGroupId']]
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], queuing, service, security, group]]


  QueueingServiceHost:
    Type: AWS::EC2::Instance
    Properties:
      # KeyName: iannis-pchc #!Ref KeyName
      InstanceType: t3.small
      ImageId: !Ref BatchAmiId
      IamInstanceProfile: !Ref QueueingServiceHostInstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda #AL
          Ebs:
            VolumeSize: 100
            VolumeType: gp3
            DeleteOnTermination: true
      DisableApiTermination: false
      NetworkInterfaces:
        - DeviceIndex: 0
          GroupSet: 
            - !Ref QueueingServiceHostSecurityGroup
          SubnetId: 
            Fn::ImportValue:
              !Join ['', [!Ref NetworkStackName, '-PrivateSubnetId1']] 
      UserData: 
        Fn::Base64: !Sub |
          #!/bin/bash
          sudo dnf update -y
          sudo dnf install -y aws-cli git
          sudo systemctl start git

          cd /home/ec2-user
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          source ~/.bashrc
          nvm install --lts
          node -e "console.log('Running Node.js ' + process.version)"
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], queuing, service]]
        - Key: Organization
          Value: !Ref OrgName


###
# Queueing Host Stack
###

  # QueueingHostELBStack:
  #   Type: AWS::CloudFormation::Stack
  #   Properties:
  #     TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/loadbalancer.yaml
  #     Parameters:
  #       Name: !Join ['-', [!Ref Name, tre]]
  #       EnvName: !Ref EnvName
  #       OrgName: !Ref OrgName
  #       CertificateArn: !Ref LoadBalancerCertificateArn
  #       DeletionProtection: !Ref DeletionProtection
  #       InstancePort: 80
  #       NetworkStackName: !Ref NetworkStackName
  #       SNSStackName: !Ref SNSStackName

  QueueingHostDeployStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/deployment.yaml
      Parameters:
        Name: !Join ['-', [!Select [0, !Split ['-', !Ref Name]], queue]]
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        NetworkStackName: !Ref NetworkStackName
        SNSStackName: !Ref SNSStackName

  QueueingHostServerStack:
    DependsOn:
      - QueueingHostDeployStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/appserver-basic2.yaml
      Parameters:
        Name: !Join ['-', [!Select [0, !Split ['-', !Ref Name]], queue]]
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        ASGMinSize: 0
        ASGMaxSize: 3
        ASGDesiredSize: 1
        ClientDomainName: !Ref ClientDomainName
        InstanceAMI: !Ref QueueingHostAmiId
        InstanceKeyName: !Ref InstanceKeyName
        # InstancePort: 
        #InstanceSpotPrice: !If [IsProd, !Ref 'AWS::NoValue', 1]
        InstanceSubnet: Private
        InstanceType: !If [IsProd, t3.medium, t3a.small]
        LoadBalancerHostName: !If [IsProd, cics2, !Join ['-', [cics2, !FindInMap [EnvShort, !Ref EnvName, Name]]]]
        # LoadBalancerStackName: !Select [ 1, !Split [ '/', !Ref QueueingHostELBStack]]
        NetworkStackName: !Ref NetworkStackName
        SharedSecretId:
          Fn::ImportValue: !Sub '${CicsPrereqStackName}-DBSecretManagerKeyId'
        SNSStackName: !Ref SNSStackName
        UseFriendlyNames: FALSE
        VolumeName: /dev/xvda # Amazon Linux AMI uses /dev/xvda
        VolumeSize: 20 #GB 
        VolumeType: gp3
        LaunchTemplate: True
  
  QueueingHostAttachExternalPolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      PolicyName: QueueingHostExternalSQSPolicy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - sqs:DeleteMessage
              - sqs:ReceiveMessage
              - sqs:SendMessage
              - sqs:GetQueueAttributes
              - sqs:SetQueueAttributes
            Resource: !Join ['', ['arn:aws:sqs:', !Ref AWS::Region,':', !Ref 'AWS::AccountId',':', !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '-', !Select [0, !Split ['-', !Ref Name] ], '-sqs']]
      RoleName: !GetAtt QueueingHostServerStack.Outputs.AppServerIamRole


