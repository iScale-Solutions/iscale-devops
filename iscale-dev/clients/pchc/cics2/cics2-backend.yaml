  SQSOldMessageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      # AlarmActions: 
      #   - arn::sns::here
      AlarmDescription: String
      AlarmName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], sqs, oldest-message-alarm]]
      ComparisonOperator: GreaterThanThreshold # Alarm when the oldest message is greater than or equal to threshold
      EvaluationPeriods: 1 # number of periods to evaluate
      MetricName: ApproximateAgeOfOldestMessage # SQS Metric
      Namespace: AWS/SQS
      Period: 10 # evaluation period in seconds
      Statistic: Average
      Threshold: 10 # threshold in seconds
      TreatMissingData: "notBreaching"
      Unit: Seconds

##
# SQS Section
##

  Cics2SqsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], sqs]]
      VisibilityTimeout: 30
      MessageRetentionPeriod: 345600 # 4 days in seconds
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], sqs]]
        - Key: Organization
          Value: !Ref OrgName

  QueuePolicy:
    Type: AWS::SQS::QueueInlinePolicy
    Properties:
      Queue: !Ref Cics2SqsQueue
      PolicyDocument:
        Version: '2012-10-17'
        Id: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], sqs]]
        Statement:
          - Sid: AllowS3ToSendMessage
            Effect: Allow
            Principal: 
              Service: s3.amazonaws.com
            Condition:
              ArnLike:
                aws:SourceArn: 
                  !Join 
                    ['', ['arn:aws:s3:::', !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '-', !Select [0, !Split ['-', !Ref Name]], '-bank*']]
            Action:
              - 'sqs:SendMessage'
            Resource: !GetAtt Cics2SqsQueue.Arn

