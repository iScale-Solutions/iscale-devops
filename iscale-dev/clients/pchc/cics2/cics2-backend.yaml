  ReportsFifoQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], reports, "sqs.fifo"]]
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 900 # 15 minutes in seconds
      MessageRetentionPeriod: 345600 # 4 days in seconds (default)
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportsFifoDlq.Arn
        maxReceiveCount: 10  # Move to DLQ after 3 failed processing attempts
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], reports, "sqs.fifo"]]
        - Key: Organization
