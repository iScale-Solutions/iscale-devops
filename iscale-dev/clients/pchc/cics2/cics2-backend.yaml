AWSTemplateFormatVersion: 2010-09-09
Description: CICS2 Resources and Lambda serverless permissions

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
          - CicsPrereqStackName

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      NetworkStackName:
        default: Network Stack Name
      SNSStackName:
        default: SNS Topic Stack Name
      CicsPrereqStackName:
        default: CICS2 Prerequisite Stack Name

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name)
    Type: String
    MinLength: 3
    MaxLength: 15
    Default: cics2-backend
  OrgName:
    Description: The name of the organization
    Type: String
    Default: pchc
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production # Test for uat
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  NetworkStackName:
    Description: The name of the network stack
    Type: String
    Default: pchc-stg-uw2-cics2-network
    MinLength: 1
  SNSStackName:
    Description: The name of the SNS stack
    Type: String
    Default: pchc-test-uw2-sns
    MinLength: 1
  CicsPrereqStackName:
    Description: The name of the CICS2 prerequisite stack (this stack also contains the documentDB cluster)
    Type: String
    Default: 'pchc-stg-uw2-cics2-prereq'
    MinLength: 1
  BatchAmiId:
    Description: The AMI ID for Amazon Linux 2023
    Type: AWS::EC2::Image::Id
    Default: ami-01102c5e8ab69fb75 # Update this to the latest AL2023 AMI ID for your region
    ConstraintDescription: Must be a valid Amazon Linux 2023 AMI ID.

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml

Resources:

# CICS2 Lambda Bref Deployment User Group, the the github user to this group
# permissions to deploy lambda using serverless.yml

  LambdaDeploymentUserGroup:
    Type: AWS::IAM::Group
    Properties:
      Policies:
        - PolicyName: BrefPolicy1
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: CfnSlsPolicy
                Effect: Allow
                Action:
                  - cloudformation:CancelUpdateStack
                  - cloudformation:ContinueUpdateRollback
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:Describe*
                  - cloudformation:EstimateTemplateCost
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:Get*
                  - cloudformation:List*
                  - cloudformation:UpdateStack
                  - cloudformation:UpdateTerminationProtection
                Resource: !Join ['', ['arn:aws:cloudformation:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':stack/', !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '-', !Select [0, !Split ['-', !Ref Name] ], -sls*]] # update the name from the serverless.yml service name
              - Sid: IamSlsPolicy
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:UpdateAssumeRolePolicy
                Resource: !Join ['', ['arn:aws:iam::', !Ref 'AWS::AccountId', ':role/', !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '-', !Select [0, !Split ['-', !Ref Name] ], -sls*]] # update the name from the serverless.yml service name
              - Sid: LambdaPolicy
                Effect: Allow
                Action:
                  - lambda:*  #TODO
                  - lambda:ListVersionsByFunction
                  - lambda:ListAliases
                Resource: 
                  - !Join ['', ['arn:aws:lambda:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':function:', !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '-', !Select [0, !Split ['-', !Ref Name] ], '*']]
              - Sid: 'LambdaAccessLogsPolicy'
                Effect: Allow
                Action: 
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:TagResource
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DescribeLogStreams
                  - logs:FilterLogEvents
                  - logs:GetLogEvents
                  - logs:PutSubscriptionFilter
                  - logs:DeleteSubscriptionFilter
                Resource: 
                  - !Join ['', ['arn:aws:logs:', !Ref AWS::Region,':', !Ref AWS::AccountId, ':log-group:/aws/lambda/', !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref AWS::Region, Name], '-', !Select [0, !Split ['-', !Ref Name]], '-lambda*']]
              - Sid: AccessToSecrets
                Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:ListSecrets
                Resource: !Join ['', ['arn:aws:secretsmanager:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':secret:', !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '-', !Select [0, !Split ['-', !Ref Name] ], '*']]
              - Sid: ForReview
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PassRole
                  - s3:CreateBucket
                  - iam:TagRole
                Resource: "*"   #TODO
              - Sid: UnrestrictedPermissions1
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - logs:DescribeLogGroups
                  - s3:ListAllMyBuckets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                Resource: "*"
              - Sid: UnrestrictedPermissions2
                Effect: Allow
                Action:
                  - s3:PutBucketTagging
                  - s3:ListBucket
                  - s3:PutBucketTagging
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketPolicy
                Resource: 
                  - !Join ['', ['arn:aws:s3:::', "*"]] #TODO
                  - !Join ['', ['arn:aws:s3:::', "*/*"]] #TODO
              - Sid: ApiGatewayPolicy
                Effect: Allow
                Action:
                  - apigateway:PUT
                  - apigateway:POST
                  - apigateway:PATCH
                  - apigateway:GET
                  - apigateway:DELETE
                  - apigateway:TagResource
                  - apigateway:UntagResource
                Resource: 
                  - !Join ['', ['arn:aws:apigateway:', !Ref 'AWS::Region', '::*restapi*']] #TODO
                  - !Join ['', ['arn:aws:apigateway:', !Ref 'AWS::Region', '::/tags/*']] #TODO
                  - !Join ['', ['arn:aws:apigateway:', !Ref 'AWS::Region', '::/apis/*/*']] #TODO
                  - !Join ['', ['arn:aws:apigateway:', !Ref 'AWS::Region', '::/apis']] #TODO
                  - !Join ['', ['arn:aws:apigateway:', !Ref 'AWS::Region', '::/apis/*']] #TODO
              - Sid: UnrestrictedPermissions3
                Effect: Allow
                Action: 
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:TagResource
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                Resource: !Join ['', ['arn:aws:logs:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', '*']] #TODO
              - Effect: Allow
                Action:
                  - states:CreateStateMachine
                  - states:DescribeStateMachine
                  - states:DeleteStateMachine
                  - states:UpdateStateMachine
                  - states:StartExecution
                  - states:DescribeExecution
                  - states:StopExecution
                  - states:TagResource
                Resource: "*" # TODO need to update naming of serverless step functions
        # - PolicyName: EcrWriteAccess
        #   PolicyDocument:
        #     Version: 2012-10-17
        #     Statement:
        #       - Effect: Allow
        #         Action:
        #           - ecr:CompleteLayerUpload
        #           - ecr:UploadLayerPart
        #           - ecr:InitiateLayerUpload
        #           - ecr:BatchCheckLayerAvailability
        #           - ecr:PutImage
        #         Resource: 
        #           Fn::ImportValue:
        #             !Sub '${CicsPrereqStackName}-PortalEcrArnName'
        #       - Effect: Allow
        #         Action:
        #           - ecr:GetAuthorizationToken
        #         Resource: "*"

# secgroup for lambda, get the secgroup ID and add it to github cicd secrets. this will be attached to all deployed lambdas using serverless.yml

  Cics2LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [ '-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], lambda] ]
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, lambda]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

############## attach this secgroup to documentDB secgroup to allow lambda to connect to docDB
  AllowCics2LambdaIntoDocDB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow connection from Cics2 Lambda
      IpProtocol: TCP
      GroupId: 
        Fn::ImportValue: !Sub '${CicsPrereqStackName}-DocuDBElasticSecurityGroup'
      FromPort: 27017
      ToPort: 27017
      SourceSecurityGroupId: !GetAtt Cics2LambdaSecurityGroup.GroupId

# Generate KMS key
  Cics2KmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Symmetric KMS key for encrypt decrypt Lambda environment variables
      EnableKeyRotation: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      KeyPolicy:
#       {
#   "Id": "key-consolepolicy-3",
#   "Version": "2012-10-17",
#   "Statement": [
#     {
#       "Sid": "Enable IAM User Permissions",
#       "Effect": "Allow",
#       "Principal": {
#         "AWS": "arn:aws:iam::050821737631:root"
#       },
#       "Action": "kms:*",
#       "Resource": "*"
#     },
#     {
#       "Sid": "Allow use of the key",
#       "Effect": "Allow",
#       "Principal": {
#         "AWS": "arn:aws:iam::050821737631:user/pchc-cics2"
#       },
#       "Action": [
#         "kms:Encrypt",
#         "kms:Decrypt",
#         "kms:ReEncrypt*",
#         "kms:GenerateDataKey*",
#         "kms:DescribeKey"
#       ],
#       "Resource": "*"
#     },
#     {
#       "Sid": "Allow attachment of persistent resources",
#       "Effect": "Allow",
#       "Principal": {
#         "AWS": "arn:aws:iam::050821737631:user/pchc-cics2"
#       },
#       "Action": [
#         "kms:CreateGrant",
#         "kms:ListGrants",
#         "kms:RevokeGrant"
#       ],
#       "Resource": "*",
#       "Condition": {
#         "Bool": {
#           "kms:GrantIsForAWSResource": "true"
#         }
#       }
#     }
#   ]
# }

        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccount
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: AllowCics2KmsKey
            Effect: Allow
            Principal: #arn:aws:iam::050821737631:user/pchc-cics2
              AWS: !Join ['', ['arn:aws:iam::',!Ref AWS::AccountId, ':user/', !Ref OrgName, '-', !Select [0, !Split ['-', !Ref Name]]]]
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
          - Sid: AllowCics2KmsKeyGrant
            Effect: Allow
            Principal: #arn:aws:iam::050821737631:user/pchc-cics2
              AWS: !Join ['', ['arn:aws:iam::',!Ref AWS::AccountId, ':user/', !Ref OrgName, '-', !Select [0, !Split ['-', !Ref Name]]]]
            Action:
              - kms:CreateGrant
              - kms:ListGrants
              - kms:RevokeGrant
            Resource: "*"
            Condition:
              Bool:
                kms:GrantIsForAWSResource: true
          - Sid: AllowLambdaService
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey*
            Resource: "*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub lambda.${AWS::Region}.amazonaws.com
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, kms]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName
  
  Cics2KmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: 
        !Join
        - '-'
        - - !Join ['', ["alias/", !Ref OrgName]]
          - !FindInMap [EnvShort, !Ref EnvName, Name]
          - !FindInMap [RegionShort, !Ref 'AWS::Region', Name]
          - !Ref Name
          - key
      TargetKeyId: !Ref Cics2KmsKey

  Bank000S3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], bank000]]
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 3
          Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], bank000]]
        - Key: Organization
          Value: !Ref OrgName

  Bank001S3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], bank001]]
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 3
          Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], bank000]]
        - Key: Organization
          Value: !Ref OrgName
##
# Batch Host
##
  
  QueueingServiceHostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM

  QueueingServiceHostInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: '/'
      Roles:
        - !Ref QueueingServiceHostRole

  QueueingServiceHostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: 
        Fn::ImportValue:
          !Join ['', [!Ref NetworkStackName, '-VpcId']] 
      GroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], queuing, service, security, group]]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId:
            Fn::ImportValue:
              !Join ['', [!Ref NetworkStackName, '-JumpHostSecurityGroupId']]
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], queuing, service, security, group]]


  QueueingServiceHost:
    Type: AWS::EC2::Instance
    Properties:
      # KeyName: iannis-pchc #!Ref KeyName
      InstanceType: t3.small
      ImageId: !Ref BatchAmiId
      IamInstanceProfile: !Ref QueueingServiceHostInstanceProfile
      DisableApiTermination: false
      NetworkInterfaces:
        - DeviceIndex: 0
          GroupSet: 
            - !Ref QueueingServiceHostSecurityGroup
          SubnetId: 
            Fn::ImportValue:
              !Join ['', [!Ref NetworkStackName, '-PrivateSubnetId1']] 
      UserData: 
        Fn::Base64: !Sub |
          #!/bin/bash
          sudo dnf update -y
          sudo dnf install -y aws-cli git
          sudo systemctl start git
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], queuing, service]]
        - Key: Organization
          Value: !Ref OrgName

##
# SQS Section
##

  Cics2SqsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], sqs]]
      VisibilityTimeout: 30
      MessageRetentionPeriod: 345600 # 4 days in seconds
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], sqs]]
        - Key: Organization
          Value: !Ref OrgName

  QueuePolicy:
    Type: AWS::SQS::QueueInlinePolicy
    Properties:
      Queue: !Ref Cics2SqsQueue
      PolicyDocument:
        Version: '2012-10-17'
        Id: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], sqs]]
        Statement:
          - Sid: AllowS3ToSendMessage
            Effect: Allow
            Principal: 
              Service: s3.amazonaws.com
            Condition:
              ArnLike:
                aws:SourceArn: 
                  !Join 
                    ['', ['arn:aws:s3:::', !Ref OrgName, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '-', !FindInMap [RegionShort, !Ref 'AWS::Region', Name], '-', !Select [0, !Split ['-', !Ref Name]], '-bank*']]
            Action:
              - 'sqs:SendMessage'
            Resource: !GetAtt Cics2SqsQueue.Arn

##
# S3 Section
##
  Cics2BankCentralS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], bank, central]]
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 3
          Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Select [0, !Split ['-', !Ref Name]], bank, central]]
        - Key: Organization
          Value: !Ref OrgName

Outputs:

  LambdaDeploymentUserGroup:
    Description: Add the github user into this group
    Value: !Ref LambdaDeploymentUserGroup

  Cics2LambdaSecurityGroupId:
    Description: MIS Lambda Secgroup ID
    Value: !GetAtt Cics2LambdaSecurityGroup.GroupId
    Export: 
      Name: !Sub ${AWS::StackName}-Cics2LambdaSecurityGroupId

