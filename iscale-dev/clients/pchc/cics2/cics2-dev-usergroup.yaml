AWSTemplateFormatVersion: 2010-09-09
Description: CM2 Dev User Group

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name)
    Type: String
    MinLength: 3
    Default: cics2-cm2dev
  OrgName:
    Description: The name of the organization
    Type: String
    Default: pchc
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml

Resources:

  CM2DevUserGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Join ["-", [ !Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'usergroup']]
      Policies:
        - PolicyName: DevCM2Policy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: StepFunctions
                Effect: Allow
                Action:
                  - states:StartExecution
                  - states:Describe*
                  - states:Get*
                  - states:List*
                  - states:ValidateStateMachineDefinition
                  - states:RevealSecrets
                Resource:
                  - !Join ["", [ "arn:aws:states:", !Ref "AWS::Region", ":", !Ref "AWS::AccountId", ":stateMachine:", !Ref OrgName, "-", !FindInMap [EnvShort, !Ref EnvName, Name], "-", !FindInMap [RegionShort, !Ref 'AWS::Region', Name], "-cics2-stepf-OutwardICL*"]]
                  - !Join ["", [ "arn:aws:states:", !Ref "AWS::Region", ":", !Ref "AWS::AccountId", ":execution:", !Ref OrgName, "-", !FindInMap [EnvShort, !Ref EnvName, Name], "-", !FindInMap [RegionShort, !Ref 'AWS::Region', Name], "-cics2-stepf-OutwardICL*:*"]]
                  - !Join ["", [ "arn:aws:states:", !Ref "AWS::Region", ":", !Ref "AWS::AccountId", ":mapRun:", !Ref OrgName, "-", !FindInMap [EnvShort, !Ref EnvName, Name], "-", !FindInMap [RegionShort, !Ref 'AWS::Region', Name], "-cics2-stepf-OutwardICL*/*:*"]]
                  - !Join ["", [ "arn:aws:states:", !Ref "AWS::Region", ":", !Ref "AWS::AccountId", ":express:", !Ref OrgName, "-", !FindInMap [EnvShort, !Ref EnvName, Name], "-", !FindInMap [RegionShort, !Ref 'AWS::Region', Name], "-cics2-stepf-OutwardICL*:*:*"]]
              - Sid: S3
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetBucketNotification
                  - s3:PutBucketNotification
                  - s3:GetBucketPolicy
                  - s3:ListAllMyBuckets
                Resource:
                  - !Join ["", [ "arn:aws:s3:::", !Ref OrgName, "-", !FindInMap [EnvShort, !Ref EnvName, Name], "-", !FindInMap [RegionShort, !Ref 'AWS::Region', Name], "-cics2*"]]
                  - !Join ["", [ "arn:aws:s3:::", !Ref OrgName, "-", !FindInMap [EnvShort, !Ref EnvName, Name], "-", !FindInMap [RegionShort, !Ref 'AWS::Region', Name], "-cics2*/*"]]
              - Sid: KMS
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource:
                  - arn:aws:kms:us-west-2:050821737631:key/b13ecace-f470-400a-9102-c56b6456f5c4
              - Sid: Lambda
                Effect: Allow
                Action:
                  - lambda:Get*
                  - lambda:List*
                  - lambda:AddPermission
                Resource:
                  - !Join ["", [ "arn:aws:lambda:", !Ref "AWS::Region", ":", !Ref "AWS::AccountId", ":function:", !Ref OrgName, "-", !FindInMap [EnvShort, !Ref EnvName, Name], "-", !FindInMap [RegionShort, !Ref 'AWS::Region', Name], "-cics2-*"]]
                  - !Join ["", [ "arn:aws:lambda:", !Ref "AWS::Region", ":", !Ref "AWS::AccountId", ":function:", !Ref OrgName, "-", !FindInMap [EnvShort, !Ref EnvName, Name], "-", !FindInMap [RegionShort, !Ref 'AWS::Region', Name], "-cics2-*:*"]]
                  - !Join ["", [ "arn:aws:lambda:", !Ref "AWS::Region", ":", !Ref "AWS::AccountId", ":code-signing-config:*"]]
                  - !Join ["", [ "arn:aws:lambda:", !Ref "AWS::Region", ":", !Ref "AWS::AccountId", ":layer:*:*"]]
                  - !Join ["", [ "arn:aws:lambda:", !Ref "AWS::Region", ":", !Ref "AWS::AccountId", ":event-source-mapping:*"]]
              - Sid: LogsAndMetrics
                Effect: Allow
                Action:
                  - logs:Get*
                  - logs:List*
                  - logs:Describe*
                  - logs:FilterLogEvents
                  - logs:StartQuery
                  - logs:StopQuery
                  - logs:StartLiveTail
                  - logs:StopLiveTail
                  - logs:Unmask
                  - logs:Test*
                  - logs:GetQueryResults
                  - logs:GetDataProtectionPolicy
                  - cloudwatch:Get*
                  - cloudwatch:List*
                  - cloudwatch:Describe*
                Resource:
                  - !Join ["", [ "arn:aws:logs:", !Ref "AWS::Region", ":", !Ref "AWS::AccountId", ":log-group:*", !Ref OrgName, "-", !FindInMap [EnvShort, !Ref EnvName, Name], "-", !FindInMap [RegionShort, !Ref 'AWS::Region', Name], "-cics2*"]]
                  - !Join ["", [ "arn:aws:logs:", !Ref "AWS::Region", ":", !Ref "AWS::AccountId", ":delivery*"]]
                  - !Join ["", [ "arn:aws:logs:", !Ref "AWS::Region", ":", !Ref "AWS::AccountId", ":destination:*"]]
                  - !Join ["", [ "arn:aws:logs:", !Ref "AWS::Region", ":", !Ref "AWS::AccountId", ":anomaly-detector:*"]]
                  - !Join ["", [ "arn:aws:logs:", !Ref "AWS::Region", ":", !Ref "AWS::AccountId", ":log-group:/aws/*/*", !Ref OrgName, "-", !FindInMap [EnvShort, !Ref EnvName, Name], "-", !FindInMap [RegionShort, !Ref 'AWS::Region', Name], "-cics2*:log-stream:*"]]
              - Sid: SNS
                Effect: Allow
                Action:
                  - sns:Get*
                Resource:
                  - !Join ["", [ "arn:aws:sns:", !Ref "AWS::Region", ":", !Ref "AWS::AccountId", ":", !Ref OrgName, "-", !FindInMap [EnvShort, !Ref EnvName, Name], "-", !FindInMap [RegionShort, !Ref 'AWS::Region', Name], "-cics2*"]]
              - Sid: Misc
                Effect: Allow
                Action:
                  - ec2:DescribeVpcs
                  - sns:ListSubscriptions
                  - logs:DescribeLogGroups
                  - lambda:ListFunctions
                  - s3:ListAllMyBuckets
                  - lambda:ListEventSourceMappings
                  - lambda:GetEventSourceMapping
                  - states:ListStateMachines
                Resource: "*" 
  
  MFAEnforcementPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Join ["-", [ !Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], "MFAEnforcementPolicy"]]
      Description: "Enforces MFA for all users in the group"
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowRestrictedResourcesToSetupMFA
            Effect: Allow
            Action:
              - iam:EnableMFADevice
              - iam:GetUser
              - iam:ListMFADevices
              - iam:DeleteVirtualMFADevice
              - iam:ResyncMFADevice
              - sts:GetSessionToken
              - iam:ChangePassword
            Resource: 
              - arn:aws:iam::*:user/${aws:username}
              - arn:aws:iam::*:mfa/${aws:username}
            Condition:
              BoolIfExists:
                aws:MultiFactorAuthPresent: "false"
          - Sid: AllowUnrestrictedResourcesToSetupMFA
            Effect: Allow
            Action:
              - iam:ListVirtualMFADevices
              - iam:CreateVirtualMFADevice
            Resource: 
              - arn:aws:iam::*:mfa/
              - arn:aws:iam::*:mfa/*
            Condition:
              BoolIfExists:
                aws:MultiFactorAuthPresent: "false"
          - Sid: DenyAllExceptListedIfNoMFA
            Effect: Deny
            NotAction:
              - iam:CreateVirtualMFADevice
              - iam:EnableMFADevice
              - iam:GetUser
              - iam:ListMFADevices
              - iam:ListVirtualMFADevices
              - iam:DeleteVirtualMFADevice
              - iam:ResyncMFADevice
              - sts:GetSessionToken
              - iam:ChangePassword
            Resource: 
              - arn:aws:iam::*:user/${aws:username}
              - arn:aws:iam::*:mfa/${aws:username}
            Condition:
              BoolIfExists:
                aws:MultiFactorAuthPresent: "false"
          

