  RoRComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: RubyOnRails
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 1.0.3
      Description: Installs RoR
      ChangeDescription: Initial version
      Data: |
        name: RoR - InlineData
        description: Installation of RoR
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: InstallRoR
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo su ec2-user
                    - cd /home/ec2-user
                    - command curl -sSL https://rvm.io/mpapis.asc | sudo gpg2 --import -
                    - command curl -sSL https://rvm.io/pkuczynski.asc | sudo gpg2 --import -
                    - \curl -sSL https://get.rvm.io | sudo bash -s stable
                    - source /etc/profile.d/rvm.sh
                    - rvm requirements
                    - rvm install ruby-2.4.1
                    - gem install bundler
                    - gem install sprockets -v 3.7.2
                    - gem install nokogiri -v 1.10.10
                    - gem install rails -v 4.2.8
                    - rvm docs generate all

  MAWSImageRecipe:
    Type: AWS::ImageBuilder::ImageRecipe
    Properties:
      Name: !Join [' ', [!Ref OrgName, 'maws']]
      Version: 1.0.1
      ParentImage: !Join ['', ['arn:aws:imagebuilder:', !Ref AWS::Region, ':', !Ref AWS::AccountId, ':image/', !Ref OrgName, '-amazon-linux/1.1.25']]
      WorkingDirectory: /tmp
      Description: !Join [' ', ['Base image for', !Ref OrgName, 'maws']]
      Components: #Max 20
        - ComponentArn: !Ref MySQLClientComponent
        - ComponentArn: !Ref NginxComponent
        - ComponentArn: !Ref NodeJSComponent
        - ComponentArn: !Ref RoRComponent
        - ComponentArn: !Join [':', ['arn:aws:imagebuilder', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'component/cloudformation-logs/1.0.4']]
        - ComponentArn: !Ref MAWSLogComponent
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: !If [IsImageShared, false, true]
            KmsKeyId: !If [IsImageShared, !Ref 'AWS::NoValue', !Join [':', ['arn:aws:kms', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'alias/aws/ebs']]]
            VolumeType: gp2
            VolumeSize: 8

