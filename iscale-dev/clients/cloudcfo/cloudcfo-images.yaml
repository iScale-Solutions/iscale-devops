AWSTemplateFormatVersion: 2010-09-09
Description: CloudCFO Images Builder

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
      - Label:
          default: Sharing Configuration
        Parameters:
          - ShareImage

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      NetworkStackName:
        default: Network Stack Name
      ShareImage:
        default: Share image with other account? If sharing, encryption will be disabled.
      SNSStackName:
        default: SNS Topic Stack Name

Parameters:
  Name:
    Description: Unique name/identifier (e.g. wordpress).
    Type: String
    Default: appbuilder
    AllowedPattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: cloudcfo
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  NetworkStackName:
    Description: The name of the network stack.
    Type: String
    Default: cloudcfo-prd-uw2-network
    MinLength: 1
  ShareImage:
    Description: Select true to not encrypt the image and share it with other accounts
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  SNSStackName:
    Description: the name of the SNS stack.
    Type: String
    Default: cloudcfo-prd-uw2-sns
    MinLength: 1

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml      
  IsImageShared: !Equals [!Ref ShareImage, true]

Resources:

###
# LAMP Configuration
###

  LAMPComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: Apache PHP 7_4
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 1.0.0
      Description: Installs PHP7.4
      ChangeDescription: Initial version
      Data: |
        name: Apache PHP74 - InlineData
        description: Installation of Apache + PHP7.4
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: IntallPHPApache
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      sudo yum install -y amazon-linux-extras
                      sudo amazon-linux-extras enable php7.4
                      sudo yum clean metadata
                      sudo yum install -y php php-common php-pear
                      sudo yum install -y php-{cgi,curl,mbstring,gd,mysqlnd,gettext,json,xml,fpm,intl,zip}

  PHPINIComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: PHP 7_4 ini 
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 1.0.0
      Description: Installs PHP7.4
      ChangeDescription: Initial version
      Data: |
        name: Apache PHP74 - InlineData
        description: Installation of Apache + PHP7.4 + custom php.ini
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: SetupPHPINI
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      sed -i 's,; max_input_vars = 1000,max_input_vars = 10000,' /etc/php.ini

  PayrollImageRecipe:
    Type: AWS::ImageBuilder::ImageRecipe
    Properties:
      Name: !Join [' ', [!Ref OrgName, payroll]]
      Version: 1.0.1
      ParentImage: !Join ['', ['arn:aws:imagebuilder:', !Ref AWS::Region, ':', !Ref AWS::AccountId, ':image/', !Ref OrgName, '-amazon-linux/1.0.5/1']]
      WorkingDirectory: /tmp
      Description: !Join [' ', [!Ref OrgName, payroll]]
      Components: #Max 20
        - ComponentArn: !Ref LAMPComponent
        - ComponentArn: !Ref PHPINIComponent
        - ComponentArn: !Join [':', ['arn:aws:imagebuilder', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'component/mysql-client/1.0.0/1']]
        - ComponentArn: !Join [':', ['arn:aws:imagebuilder', !Ref 'AWS::Region', 'aws:component/simple-boot-test-linux/1.0.0/1']]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: !If [IsImageShared, false, true]
            KmsKeyId: !If [IsImageShared, !Ref 'AWS::NoValue', !Join [':', ['arn:aws:kms', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'alias/aws/ebs']]]
            VolumeType: gp2
            VolumeSize: 8

  PayrollImageBuilder:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/ec2-image-builder.yaml
      Parameters:
        Name: payroll
        EnvName: !Ref EnvName
        NetworkStackName: !Ref NetworkStackName
        OrgName: !Ref OrgName
        ImageRecipeARN: !Ref PayrollImageRecipe
        ShareImage: !Ref ShareImage
        SNSStackName: !Ref SNSStackName

###
# NodeJS Image builder
###

  NodeJS10181Component:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: Node_10_18_1
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 1.0.6
      Description: Installs NodeJS 10.18.1
      ChangeDescription: Initial version
      Data: |
        name: NodeJS 10.18.1 - InlineData
        description: Installation of NodeJS 10.18.1
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: DownloadRemoteFile
                action: WebDownload
                maxAttempts: 3
                inputs:
                  - source: https://raw.githubusercontent.com/nvm-sh/nvm/v0.34.0/install.sh
                    destination: /home/ec2-user/install.sh
                    overwrite: true
              - name: CreateBashRC
                action: CreateFile
                inputs:
                  - path: /root/.bashrc
                    content: export NVM_DIR=/home/ec2-user/.nvm
                    overwrite: true
                    owner: root
                    group: root
                    permissions: 0755
                  - path: /home/ec2-user/.bashrc
                    content: export NVM_DIR=/home/ec2-user/.nvm
                    overwrite: true
                    owner: ec2-user
                    group: ec2-user
                    permissions: 0755
              - name: InstallNode
                action: ExecuteBash
                inputs:
                  commands:
                    - /bin/bash /home/ec2-user/install.sh
                    - |
                      . /home/ec2-user/.nvm/nvm.sh
                      nvm install 10.18.1
                    - chown -R ec2-user:ec2-user /home/ec2-user/.nvm/

  AppImageRecipe:
    Type: AWS::ImageBuilder::ImageRecipe
    Properties:
      Name: !Join [' ', [!Ref OrgName, app]]
      Version: 1.0.6
      ParentImage: !Join ['', ['arn:aws:imagebuilder:', !Ref AWS::Region, ':', !Ref AWS::AccountId, ':image/', !Ref OrgName, '-amazon-linux/1.0.5/1']]
      WorkingDirectory: /tmp
      Description: !Join [' ', [!Ref OrgName, app]]
      Components: #Max 20
        - ComponentArn: !Ref NodeJS10181Component
        - ComponentArn: !Join [':', ['arn:aws:imagebuilder', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'component/mysql-client/1.0.0/1']]
        - ComponentArn: !Join [':', ['arn:aws:imagebuilder', !Ref 'AWS::Region', 'aws:component/simple-boot-test-linux/1.0.0/1']]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: !If [IsImageShared, false, true]
            KmsKeyId: !If [IsImageShared, !Ref 'AWS::NoValue', !Join [':', ['arn:aws:kms', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'alias/aws/ebs']]]
            VolumeType: gp2
            VolumeSize: 8

  AppImageBuilder:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/ec2-image-builder.yaml
      Parameters:
        Name: app
        EnvName: !Ref EnvName
        NetworkStackName: !Ref NetworkStackName
        OrgName: !Ref OrgName
        ImageRecipeARN: !Ref AppImageRecipe
        ShareImage: !Ref ShareImage
        SNSStackName: !Ref SNSStackName
