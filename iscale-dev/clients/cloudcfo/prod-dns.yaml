  GoogleDomainConnectRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: 
        Fn::GetAtt:
          - HostedZoneStack
          - Outputs.HostedZoneId
      Name: !Join ['.',[_domainconnect, !Ref DomainName]]
      Type: CNAME
      TTL: 300
      ResourceRecords:
      - _domainconnect.gd.domaincontrol.com

  GSuiteMXRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: 
        Fn::GetAtt:
          - HostedZoneStack
          - Outputs.HostedZoneId
      Comment: Google Suite MX Records
      Name: !Ref DomainName
      Type: MX
      TTL: 3600
      ResourceRecords:
        - 1 aspmx.l.google.com.
        - 10 aspmx2.googlemail.com.
        - 10 aspmx3.googlemail.com.
        - 5 alt1.aspmx.l.google.com.
        - 5 alt2.aspmx.l.google.com.

  CombinedTxtRecord: 
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: 
        Fn::GetAtt:
          - HostedZoneStack
          - Outputs.HostedZoneId
      Comment: Google Verification TXT Record
      Name: !Ref DomainName
      Type: TXT
      TTL: 300
      ResourceRecords:
        - '"google-site-verification=ZSpkJgth-jXIYXY0DkqVnzPomaXjOceaG2pHJZ8O7cg"'
        - '"=spf1 include:_spf.google.com ~all"'

  AcmeChallengeTxtRecord: 
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: 
        Fn::GetAtt:
          - HostedZoneStack
          - Outputs.HostedZoneId
      Comment: TXT Verification Record
      Name: !Join ['.',[_acme-challenge, app, !Ref DomainName]]
      Type: TXT
      TTL: 300
      ResourceRecords:
        - '"WqLg1IZFTwRU3Ljsrcu8uNgiaTtH_wE_bSGkcUueUS0"'