  AppCertificateRecordForMobbiz: #To be deleted after migration to CloudCFO account
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: 
        Fn::GetAtt:
          - HostedZoneStack
          - Outputs.HostedZoneId
      Name: !Join ['.',[_41e507b253a2253f0d4c2ef47607b023, app, !Ref DomainName]]
      Type: CNAME
      TTL: 300
      ResourceRecords:
      - _4873a58d534d22f770772940488a2db5.vhzmpjdqfx.acm-validations.aws

