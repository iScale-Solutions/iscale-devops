###
# Dev S3 bucket and associated account
###

  TestBucket:
    Type: AWS::S3::Bucket
    Condition: IsTest
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      LifecycleConfiguration:
        Rules:
        - AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 3
          Status: Enabled
      Tags:
        - Key: Name
          Value: !Join [ '-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], test-bucket]]
        - Key: Organization
          Value: !Ref OrgName

  TestBucketUser:
    Condition: IsTest
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, test-bucket-access]]
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - !Join ['/', [!GetAtt [TestBucket, Arn], '*']]
                  - !GetAtt [TestBucket, Arn]
  
  TestBucketUserKey:
    Condition: IsTest
    Type: AWS::IAM::AccessKey
    Properties:
      UserName:
        Ref: TestBucketUser

Outputs:

  TestBucket:
    Condition: IsTest
    Description: Test Bucket
    Value: !Ref TestBucket
  
  TestBucketUserAccessKeyId:
    Condition: IsTest
    Description: Access Key Id for the S3 bucket
    Value: !Ref TestBucketUserKey
  
  StaticWebsiteUserAccessKeySecret:
    Condition: IsTest
    Description: Secret Key for the S3 bucket
    Value: !GetAtt [TestBucketUserKey, SecretAccessKey]

#   DeploymentUserGroup:
#     Description: Add the BitBucket user into this group
#     Value: 
#       Fn::GetAtt:
#         - DeployStack
#         - Outputs.DeploymentUserGroup
