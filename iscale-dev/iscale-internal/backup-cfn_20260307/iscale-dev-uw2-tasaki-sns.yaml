AWSTemplateFormatVersion: 2010-09-09
Description: This cloudformation template provisions an SNS Topic and sends notifications thru slack and email

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      -
        Label:
          default: "Resource Configuration"
        Parameters:
          - OrgName
          - EnvName
      -
        Label:
          default: "SNS Topic Configuration"
        Parameters:
          - Email
          - OpsidianEndpoint
          - EnableEmailSubscription
          - EnableSlackSubscription

    ParameterLabels:
      OrgName:
        default: "Organization Name"
      EnvName:
        default: "Environment Name"
      Email:
        default: "Recipient Email Address"
      OpsidianEndpoint:
        default: "Opsidian Endpoint"
      EnableEmailSubscription:
        default: "Enable Email Subscription"
      EnableSlackSubscription:
        default: "Enable Slack Subscription"

Parameters:
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Development
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  Email:
    Description: The email address where to send the notifications.
    Type: String
    Default: ""
  OpsidianEndpoint:
    Description: The slack opsidian endpoint.
    Type: String
    Default: https://api.opsidian.ai/sns/211a66ac9405b70666e4e61cb5ea063a
  EnableEmailSubscription:
    Description: Enables email subscription. Otherwise, disabled.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  EnableSlackSubscription:
    Description: Enables slack subscription. Otherwise, disabled.
    Type: String
    Default: true
    AllowedValues:
      - true
      - false

Mappings: 
  EnvShort:
    Production:
      Name: prd
    Staging:
      Name: stg
    Development:
      Name: dev
    Test:
      Name: test
  RegionShort:
    us-east-2:
      Name: ue2
    us-east-1:
      Name: ue1
    us-west-1:
      Name: uw1
    us-west-2:
      Name: uw2
    ap-east-1:
      Name: ae1
    ap-south-1:
      Name: as1
    ap-northeast-1:
      Name: ane1
    ap-northeast-2:
      Name: ane2
    ap-northeast-3:
      Name: ane3
    ap-southeast-1:
      Name: ase1
    ap-southeast-2:
      Name: ase2
    ca-central-1:
      Name: cc1
    cn-north-1:
      Name: cn1
    cn-northwest-1:
      Name: cnw1
    eu-central-1:
      Name: ec1
    eu-west-1:
      Name: ew1
    eu-west-2:
      Name: ew2
    eu-west-3:
      Name: ew3
    eu-north-1:
      Name: en1
    me-south-1:
      Name: ms1
    sa-east-1:
      Name: se1
    us-gov-east-1:
      Name: uge1
    us-gov-west-1:
      Name: ugw1 

Conditions:
  IsEnableEmailSubscription: !Equals [ !Ref EnableEmailSubscription, true ]
  IsEnableSlackSubscription: !Equals [ !Ref EnableSlackSubscription, true ]

Resources:
  DefaultSnsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], tasaki-topic]]
      TopicName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], tasaki-topic]]

  EmailSubscription:
    Type: "AWS::SNS::Subscription"
    Condition: IsEnableEmailSubscription
    Properties:
      Endpoint: !Ref Email
      Protocol: email
      TopicArn: !Ref DefaultSnsTopic
  
  SlackSubscription:
    Type: "AWS::SNS::Subscription"
    Condition: IsEnableSlackSubscription
    Properties:
      Endpoint: !Ref OpsidianEndpoint
      Protocol: https
      TopicArn: !Ref DefaultSnsTopic

  EventTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Id: Default
        Statement:
          - 
            Sid: __Default__1
            Effect: "Allow"
            Principal:
              Service: events.amazonaws.com
            Action: 
              - SNS:Publish
            Resource: !Ref DefaultSnsTopic
          - 
            Sid: __Default__2
            Effect: "Allow"
            Principal:
              AWS: "*"
            Action: 
              - SNS:Publish
            Resource: !Ref DefaultSnsTopic
      Topics: [!Ref DefaultSnsTopic]

Outputs:
  TopicArn: 
    Description: Arn of the SNS Topic
    Value: !Ref DefaultSnsTopic
    Export:
      Name: !Sub "${AWS::StackName}-TopicArn"