AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Deploy Plane (open-source project management) on AL2023 / t3a.medium via
  Docker Compose on a private EC2 instance behind an existing ALB.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Identification
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Network Configuration
        Parameters:
          - NetworkStackName
          - AlbListenerArn
          - AlbSecurityGroupId
          - ListenerRulePriority
          - DomainName
          - HostedZoneId
          - AlbDnsName
          - AlbCanonicalHostedZoneId
      - Label:
          default: Instance Configuration
        Parameters:
          - AmiId
          - KeyName
          - InstanceSize
          - RootVolumeSize
          - DataVolumeSize
      - Label:
          default: Application Configuration
        Parameters:
          - PlaneVersion
          - S3BackupBucket
          - S3BackupPrefix
      - Label:
          default: Scheduler Configuration
        Parameters:
          - StartScheduleExpression
          - StopScheduleExpression
    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      NetworkStackName:
        default: Network Stack Name
      AlbListenerArn:
        default: Existing ALB HTTPS Listener ARN
      AlbSecurityGroupId:
        default: Existing ALB Security Group ID
      ListenerRulePriority:
        default: ALB Listener Rule Priority (unique per listener)
      DomainName:
        default: Application FQDN
      HostedZoneId:
        default: Route 53 Hosted Zone ID
      AlbDnsName:
        default: Existing ALB DNS Name (for Route 53 alias)
      AlbCanonicalHostedZoneId:
        default: ALB Canonical Hosted Zone ID (us-west-2 = Z1H1FL5HABSF5)
      AmiId:
        default: AMI ID (Amazon Linux 2023)
      KeyName:
        default: EC2 Key Pair (emergency console only; SSM is primary access)
      InstanceSize:
        default: EC2 Instance Type
      RootVolumeSize:
        default: Root Volume Size (GB)
      DataVolumeSize:
        default: Data Volume Size (GB) - persists on stack updates
      PlaneVersion:
        default: Plane Docker Image Tag
      S3BackupBucket:
        default: S3 Bucket for Database Backups
      S3BackupPrefix:
        default: S3 Key Prefix for Database Backups
      StartScheduleExpression:
        default: Start Schedule CRON Expression
      StopScheduleExpression:
        default: Stop Schedule CRON Expression

Parameters:
  Name:
    Description: Unique resource identifier (used in all resource names)
    Type: String
    Default: plane
    MinLength: 3
    MaxLength: 16
    AllowedPattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    ConstraintDescription: Lowercase letters, numbers, and hyphens only

  OrgName:
    Description: Organization name
    Type: String
    Default: iscale-dev
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Lowercase letters and hyphens only
    MaxLength: 16

  EnvName:
    Description: Deployment environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test

  NetworkStackName:
    Description: CloudFormation stack name that exports VpcId and PrivateSubnetId1
    Type: String
    Default: iscale-dev-dev-uw2-network
    MinLength: 3
    MaxLength: 63

  AlbListenerArn:
    Description: ARN of the existing ALB HTTPS listener to attach the new host-header rule
    Type: String

  AlbSecurityGroupId:
    Description: Security Group ID of the existing ALB (EC2 ingress is scoped to this SG only)
    Type: AWS::EC2::SecurityGroup::Id

  ListenerRulePriority:
    Description: Priority for the new ALB listener rule - must be unique within the listener
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 50000

  DomainName:
    Description: FQDN for Plane (e.g. plane.iscale-software.com)
    Type: String
    Default: plane.iscale-software.com

  HostedZoneId:
    Description: Route 53 Hosted Zone ID that owns DomainName
    Type: String
    Default: Z3IVOZ67OCE9RL

  AlbDnsName:
    Description: DNS name of the existing ALB used for the Route 53 alias record
    Type: String
    Default: dualstack.iscale-dev-stg-uw2-alb-loadbal-1543139786.us-west-2.elb.amazonaws.com

  AlbCanonicalHostedZoneId:
    Description: Canonical hosted zone ID of the ALB (us-west-2 = Z1H1FL5HABSF5)
    Type: String
    Default: Z1H1FL5HABSF5

  AmiId:
    Description: Amazon Linux 2023 AMI ID for the target region
    Type: AWS::EC2::Image::Id
    Default: ami-0b6d6dacf350ebc82

  KeyName:
    Description: EC2 Key Pair name for emergency break-glass console access
    Type: AWS::EC2::KeyPair::KeyName
    Default: jana-key

  InstanceSize:
    Description: EC2 instance type
    Type: String
    Default: t3a.medium
    AllowedValues:
      - t3a.medium
      - t3a.large
      - t3a.xlarge
      - t3a.2xlarge
      - t3.medium
      - t3.large

  RootVolumeSize:
    Description: Root EBS volume size in GB (OS + Docker images)
    Type: Number
    Default: 30
    MinValue: 20
    MaxValue: 200

  DataVolumeSize:
    Description: Data EBS volume size in GB (Postgres + uploads - DeleteOnTermination=false)
    Type: Number
    Default: 50
    MinValue: 20
    MaxValue: 500

  PlaneVersion:
    Description: Docker image tag for all Plane services
    Type: String
    Default: stable-preview

  S3BackupBucket:
    Description: S3 bucket name for PostgreSQL backup uploads
    Type: String
    Default: iscale-devops
    MinLength: 3
    MaxLength: 63

  S3BackupPrefix:
    Description: S3 key prefix (no leading/trailing slash) for backup files
    Type: String
    Default: iscale-internal-infra/plane/backups
    MinLength: 3
    MaxLength: 128

  StartScheduleExpression:
    Description: EventBridge CRON expression to start the EC2 instance
    Type: String
    Default: "cron(0 0 ? * MON-FRI *)"

  StopScheduleExpression:
    Description: EventBridge CRON expression to stop the EC2 instance
    Type: String
    Default: "cron(0 10 ? * MON-FRI *)"

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Resources:

  # -- Secrets Manager ----------------------------------------------------------
  PlaneSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Description: !Sub 'Auto-generated credentials for ${Name} (${EnvName})'
      GenerateSecretString:
        SecretStringTemplate: |
          {
            "PLANE_DB_NAME": "plane",
            "PLANE_DB_USERNAME": "plane",
            "PLANE_REDIS_URL": "redis://redis:6379/"
          }
        GenerateStringKey: PLANE_DB_PASSWORD
        PasswordLength: 32
        ExcludeCharacters: '"@/\:;`'
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

  # -- IAM Role & Instance Profile ----------------------------------------------
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'ec2-role']]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: S3BackupAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3ListBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${S3BackupBucket}'
              - Sid: S3ReadWrite
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:aws:s3:::${S3BackupBucket}/${S3BackupPrefix}/*'
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref PlaneSecret
        - PolicyName: CloudFormationSignal
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:SignalResource
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'ec2-profile']]
      Roles:
        - !Ref EC2Role

  # -- Security Group ------------------------------------------------------------
  EC2InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'EC2 SG for ${Name} - ingress restricted to ALB SG on port 80'
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          Description: HTTP from ALB security group only
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSecurityGroupId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          Description: Allow all outbound (yum/docker/S3/SSM)
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'sg']]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

  # -- EC2 Instance --------------------------------------------------------------
  PlaneEC2Instance:
    Type: AWS::EC2::Instance
    DependsOn: PlaneSecret
    CreationPolicy:
      ResourceSignal:
        Timeout: PT20M
        Count: 1
    Properties:
      InstanceType: !Ref InstanceSize
      ImageId: !Ref AmiId
      KeyName: !Ref KeyName
      SubnetId:
        Fn::ImportValue: !Sub '${NetworkStackName}-PrivateSubnetId1'
      IamInstanceProfile: !Ref EC2InstanceProfile
      SecurityGroupIds:
        - !Ref EC2InstanceSecurityGroup
      # Enforce IMDSv2 - prevents SSRF-based metadata credential theft
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        InstanceMetadataTags: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
        # Separate data volume so Postgres data survives instance replacement
        - DeviceName: /dev/xvdb
          Ebs:
            VolumeSize: !Ref DataVolumeSize
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: false
