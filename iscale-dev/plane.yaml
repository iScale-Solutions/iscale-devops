      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

  # -- CloudWatch Alarm: auto-recover on system status check failure -------------
  InstanceRecoveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !Ref Name, 'system-check-failed']]
      AlarmDescription: Automatically recover EC2 instance on hardware/system failure
      MetricName: StatusCheckFailed_System
      Namespace: AWS/EC2
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref PlaneEC2Instance
      AlarmActions:
        - !Sub 'arn:aws:automate:${AWS::Region}:ec2:recover'
      TreatMissingData: notBreaching

  # -- ALB Target Group ----------------------------------------------------------
  PlaneTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      Protocol: HTTP
      Port: 80
      TargetType: instance
      Targets:
        - Id: !Ref PlaneEC2Instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200-399
      TargetGroupAttributes:
        - Key: stickiness.enabled
          Value: 'true'
        - Key: stickiness.type
          Value: lb_cookie
        - Key: stickiness.lb_cookie.duration_seconds
          Value: '86400'
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

  # -- ALB Listener Rule (host-header match) -------------------------------------
  HTTPSListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref AlbListenerArn
      Priority: !Ref ListenerRulePriority
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - !Ref DomainName
      Actions:
        - Type: forward
          TargetGroupArn: !Ref PlaneTargetGroup

  # -- Route 53 alias record -----------------------------------------------------
  DNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub '${DomainName}.'
      Type: A
      AliasTarget:
        HostedZoneId: !Ref AlbCanonicalHostedZoneId
        DNSName: !Ref AlbDnsName
        EvaluateTargetHealth: true

  # -- Start/Stop Scheduler -------------------------------------------------------
  SchedulerStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/scheduler.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        StartScheduleExpression: !Ref StartScheduleExpression
        StopScheduleExpression: !Ref StopScheduleExpression
        UseFriendlyNames: 'FALSE'
        EC2InstanceId: !Ref PlaneEC2Instance

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref PlaneEC2Instance
    Export:
      Name: !Sub '${AWS::StackName}-InstanceId'

  PrivateIp:
    Description: Private IP of the EC2 instance
    Value: !GetAtt PlaneEC2Instance.PrivateIp
    Export:
      Name: !Sub '${AWS::StackName}-PrivateIp'

  SecurityGroup:
    Description: EC2 Security Group ID
    Value: !Ref EC2InstanceSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-SecurityGroup'

  TargetGroupArn:
    Description: ALB Target Group ARN
    Value: !Ref PlaneTargetGroup
    Export:
      Name: !Sub '${AWS::StackName}-TargetGroupArn'

  SecretArn:
    Description: Secrets Manager Secret ARN for Plane credentials
    Value: !Ref PlaneSecret
    Export:
      Name: !Sub '${AWS::StackName}-SecretArn'

  ApplicationUrl:
    Description: URL to access Plane
    Value: !Sub 'https://${DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-ApplicationUrl'

  InstanceProfile:
    Description: IAM Instance Profile
    Value: !Ref EC2InstanceProfile
    Export:
      Name: !Sub '${AWS::StackName}-InstanceProfile'

  EC2Role:
    Description: IAM Role attached to the EC2 instance
    Value: !Ref EC2Role
    Export:
      Name: !Sub '${AWS::StackName}-EC2Role'


# -- Deployment commands -------------------------------------------------------
#
# aws cloudformation create-stack \
#   --stack-name iscale-dev-stg-uw2-plane \
#   --template-body file://plane.yaml \
#   --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
#   --parameters \
#     ParameterKey=Name,ParameterValue=plane \
#     ParameterKey=OrgName,ParameterValue=iscale-dev \
#     ParameterKey=EnvName,ParameterValue=Staging \
#     ParameterKey=AlbListenerArn,ParameterValue=<ALB_LISTENER_ARN> \
#     ParameterKey=AlbSecurityGroupId,ParameterValue=<ALB_SG_ID> \
#     ParameterKey=DomainName,ParameterValue=plane.iscale-software.com \
#     ParameterKey=ListenerRulePriority,ParameterValue=20
#
# To monitor bootstrap logs in real time via SSM:
#   aws ssm start-session --target <INSTANCE_ID>
#   tail -f /var/log/user-data.log
