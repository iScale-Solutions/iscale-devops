  ###
  # Groups
  ###

  # Odoo Admin Group
  OdooAdministratorsGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: OdooAdmin
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSLambdaReadOnlyAccess
      Policies:
        - PolicyName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], odoo-admin-policy]]
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: AssumeRole
                Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource:
                  - arn:aws:iam::178070162686:role/iscale-hosting-prd-uw2-odoo-admin-role
              - Sid: InvokeOdooFunctions
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: 
                  - arn:aws:lambda:us-west-2:338284463834:function:iscale-dev-dev-uw2-odoo-scheduler

  # oDoo User Group
  OdooUserGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: Odoo
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSLambdaReadOnlyAccess
      Policies:
        - PolicyName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], odoo-admin-policy]]
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: AssumeRole
                Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource: '*' #user can switch to any role
              - Sid: InvokeOdooFunctions
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - arn:aws:lambda:us-west-2:338284463834:function:iscale-dev-dev-uw2-odoo-scheduler

  DevOpsGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: DevOps
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonECS_FullAccess
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess
        - arn:aws:iam::aws:policy/AutoScalingFullAccess
        - arn:aws:iam::aws:policy/AWSCloudFormationFullAccess
      Policies:
        - PolicyName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], devops-policy]]
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: TerminateSSM
                Effect: Allow
                Action:
                  - ssm:ResumeSession
                  - ssm:TerminateSession
                Resource:
                  - arn:aws:ssm:*:*:session/${aws:username}-*
              - Sid: ManageEC2Instance
                Effect: Allow
                Action:
                  - ec2:*
                  - elasticloadbalancing:*
                Resource: '*'
                Condition:
                  StringEquals:
                    ec2:resourceTag/Environment:
                      - Development
                      - Staging
              - Sid: ManageAutoScalingGroups
                Effect: Allow
                Action:
                  - autoscaling:*
                Resource: '*'
                Condition:
                  StringEquals:
                    autoscaling:resourceTag/Environment:
                      - Development
                      - Staging
              - Sid: AllowSSMinEC2
                Effect: Allow
                Action:
                  - ssm:StartSession
                Resource: 'arn:aws:ec2:*:*:instance/*'
              - Sid: AllowECSfromVirginia
                Effect: Allow
                Action:
                  - ecs:*
                Resource: '*'
                Condition:
                  StringEquals:
                    'aws:RequestedRegion': us-east-1
              - Sid: NoTouchingProdEC2
                Effect: Deny
                Action:
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - autoscaling:CreateTags
                  - autoscaling:DeleteTags
                  - elasticloadbalancing:CreateTags
                  - elasticloadbalancing:DeleteTags
                Resource: '*'
                Condition:
                  StringEqualsIgnoreCase:
                    ec2:resourceTag/Environment:
                      - Production
              - Sid: NoTouchingProdSSM
                Effect: Deny
                Action:
                  - ssm:StartSession
                  - ssm:TerminateSession
                  - ssm:ResumeSession
                Resource: '*'
                Condition:
                  StringEqualsIgnoreCase:
                    ssm:resourceTag/Environment:
                      - Production
              - Sid: NoTouchingProdCFT
                Effect: Deny
                Action:
                  - cloudformation:Delete*
                  - cloudformation:Set*
                  - cloudformation:Update*
                Resource: '*'
                Condition:
                  StringEqualsIgnoreCase:
                    aws:ResourceTag/Environment:
                      - Production

  # Multi-Factor Authentication Group
  MFAUserGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: MFA
      Policies:
        - PolicyName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], mfa-user-policy]]
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: AllowAllUsersToListAccounts
                Effect: Allow
                Action:
                  - iam:ListAccountAliases
                  - iam:ListVirtualMFADevices
                  - iam:GetAccountPasswordPolicy
                Resource: '*'
              - Sid: AllowIndividualUserToSeeAndManageOnlyTheirOwnAccountInformation
                Effect: Allow
                Action:
                  - iam:ChangePassword
                  - iam:CreateAccessKey
                  - iam:CreateLoginProfile
                  - iam:DeleteAccessKey
                  - iam:DeleteLoginProfile
                  - iam:GetLoginProfile
                  - iam:ListAccessKeys
                  - iam:UpdateAccessKey
                  - iam:UpdateLoginProfile
                  - iam:ListServiceSpecificCredentials
                  - iam:ListSigningCertificates
                  - iam:DeleteSigningCertificate
                  - iam:UpdateSigningCertificate
                  - iam:UploadSigningCertificate
                  - iam:ListSSHPublicKeys
                  - iam:GetSSHPublicKey
                  - iam:DeleteSSHPublicKey
                  - iam:UpdateSSHPublicKey
                  - iam:UploadSSHPublicKey
                  - iam:GetUser
                Resource:
                  - "arn:aws:iam::*:user/${aws:username}"
              - Sid: AllowIndividualUserToViewAndManageTheirOwnMFA
                Effect: Allow
                Action:
                  - iam:CreateVirtualMFADevice
                  - iam:DeleteVirtualMFADevice
                  - iam:EnableMFADevice
                  - iam:ListMFADevices
                  - iam:ResyncMFADevice
                Resource:
                  - "arn:aws:iam::*:user/${aws:username}"
                  - "arn:aws:iam::*:mfa/${aws:username}"
              - Sid: AllowIndividualUserToDeactivateOnlyTheirOwnMFAOnlyWhenUsingMFA
                Effect: Allow
                Action:
                  - iam:DeactivateMFADevice
                Resource:
                  - "arn:aws:iam::*:user/${aws:username}"
                  - "arn:aws:iam::*:mfa/${aws:username}"
                Condition:
                  Bool:
                    aws:MultiFactorAuthPresent: true
              - Sid: AssumeRole
                Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource: '*' #user can switch to any role
              - Sid: BlockMostAccessUnlessSignedInWithMFA
                Effect: Deny
                NotAction:
                  - iam:CreateVirtualMFADevice
                  - iam:DeleteVirtualMFADevice
                  - iam:ListVirtualMFADevices
                  - iam:EnableMFADevice
                  - iam:ResyncMFADevice
                  - iam:ListAccountAliases
                  - iam:ListSSHPublicKeys
                  - iam:ListAccessKeys
                  - iam:ListServiceSpecificCredentials
                  - iam:ListMFADevices
                  - iam:GetAccountSummary
                  - sts:GetSessionToken
                  - iam:GetUser
                  - lambda:Get*
                  - lambda:List*
                Resource: '*'
                Condition:
                  BoolIfExists:
                    aws:MultiFactorAuthPresent: false

  AdministratorsGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: Administrators
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  # Read-Only Group
  ReadOnlyGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: ReadOnly
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      Policies:
        - PolicyName: AllowPasswordChange
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: ViewPasswordPolicy
                Effect: Allow
                Action: iam:GetAccountPasswordPolicy
                Resource: '*'
              - Sid: ChangePassword
                Effect: Allow
                Action: iam:ChangePassword
                Resource: !Join [ ':', [ 'arn:aws:iam:', !Ref 'AWS::AccountId', 'user/${aws:username}']]