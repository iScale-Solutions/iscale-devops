AWSTemplateFormatVersion: 2010-09-09
Description: Base Image Builder for Amazon Linux

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
      - Label:
          default: Sharing Configuration
        Parameters:
          - ShareImage

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      NetworkStackName:
        default: Network Stack Name
      ShareImage:
        default: Share image with other account? If sharing, encryption will be disabled.
      SNSStackName:
        default: SNS Topic Stack Name

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    Default: image-builder
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  NetworkStackName:
    Description: The name of the network stack.
    Type: String
    Default: iscale-dev-dev-uw2-network
    MinLength: 1
  ShareImage:
    Description: Select true to not encrypt the image and share it with other accounts
    Type: String
    Default: true
    AllowedValues:
      - true
      - false
  SNSStackName:
    Description: the name of the SNS stack.
    Type: String
    Default: iscale-dev-dev-uw2-sns
    MinLength: 1

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml      
  IsImageShared: !Equals [!Ref ShareImage, true]

Resources:

###
# Common components
###

  CodeDeployComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: CodeDeploy
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 1.0.9
      Description: Installs the CodeDeploy Agent
      ChangeDescription: Initial version
      Data: |
        name: CodeDeploy - InlineData
        description: Installation of CodeDeploy Agent
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: 01_YumInstallWgetRuby
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y wget
                    - sudo yum install -y ruby
              - name: 02_CreateLogsConfig
                action: CreateFile
                inputs:
                  - path: /opt/aws/amazon-cloudwatch-agent-config/codedeploy-logs.json
                    content: |
                      {
                        "logs": {
                          "logs_collected": {
                            "files": {
                              "collect_list": [
                                {
                                  "file_path": "/var/log/aws/codedeploy-agent/codedeploy-agent.log",
                                  "log_group_name": "/var/log/aws/codedeploy-agent/codedeploy-agent.log"
                                },
                                {
                                  "file_path": "/opt/codedeploy-agent/deployment-root/deployment-logs/codedeploy-agent-deployments.log",
                                  "log_group_name": "/var/log/codedeploy-agent-deployments.log"
                                }
                              ]
                            }
                          }
                        }
                      }
                    overwrite: true
              - name: 03_WGetInstall
                action: ExecuteBash
                inputs:
                  commands:
                    - wget -P /tmp https://aws-codedeploy-us-west-2.s3.us-west-2.amazonaws.com/latest/install
              - name: 04_SetInstallPermissions
                action: SetFilePermissions
                inputs:
                  - path: /tmp/install
                    permissions: 700
              - name: 05_ExecuteInstall
                action: ExecuteBash
                inputs:
                  commands:
                    - /tmp/install auto
              - name: 06_CleanupInstall
                action: ExecuteBash
                inputs:
                  commands:
                    - rm -fr /tmp/install
              - name: 07_LinkCFNInit
                action: CreateSymlink
                inputs:
                  - path: /usr/local/bin/cfn-init
                    target: /opt/aws/bin/cfn-init
                    force: true
              - name: 08_LinkCFNHup
                action: CreateSymlink
                inputs:
                  - path: /usr/local/bin/cfn-hup
                    target: /opt/aws/bin/cfn-hup
                    force: true
              - name: 09_LinkCFNSignal
                action: CreateSymlink
                inputs:
                  - path: /usr/local/bin/cfn-signal
                    target: /opt/aws/bin/cfn-signal
                    force: true

  AWSLinuxUtilitiesComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: AWS-Linux-Utilities
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 1.0.2
      Description: Installs EPEL repository, Git, JQuery, EFS, CFN, Telnet, wget
      ChangeDescription: Initial version
      Data: |
        name: AWWS Linux Utilities - InlineData
        description: Linux Utilities Installation
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: EPELInstall
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo amazon-linux-extras install -y epel
              - name: YumUpdate
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum -y update
              - name: InstallGit
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y git
              - name: InstallJQuery
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y jq
              - name: InstallEFS
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y amazon-efs-utils
              - name: InstallCloudFormation
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y aws-cfn-bootstrap
              - name: InstallTelnet
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y telnet
              - name: InstallWget
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y wget
  
  CloudFormationLogsComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: CloudFormation Logs
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 1.0.4
      Description: Setup CloudFormation logging with CloudWatch
      ChangeDescription: Initial version
      Data: |
        name: Application Logs - InlineData
        description: Installation of PCHC Apps CloudWatch Logs
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: 01_CreateCFNLogsConfig
                action: CreateFile
                inputs:
                  - path: /opt/aws/amazon-cloudwatch-agent-config/cloudformation-logs.json
                    content: |
                      {
                        "logs": {
                          "logs_collected": {
                            "files": {
                              "collect_list": [
                                {
                                  "file_path": "/var/log/cfn-hup.log",
                                  "log_group_name": "/var/log/cfn-hup.log"
                                },
                                {
                                  "file_path": "/var/log/cfn-init-cmd.log",
                                  "log_group_name": "/var/log/cfn-init-cmd.log"
                                },
                                {
                                  "file_path": "/var/log/cfn-init.log",
                                  "log_group_name": "/var/log/cfn-init.log"
                                },
                                {
                                  "file_path": "/var/log/cfn-wire.log",
                                  "log_group_name": "/var/log/cfn-wire.log"
                                }
                              ]
                            }
                          }
                        }
                      }
                    overwrite: true
  
  CloudWatchAgentComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: CloudWatchAgent
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 1.0.9
      Description: Installs CloudWatch Agent with basic OS config
      ChangeDescription: Initial version
      Data: |
        name: CloudWatch - InlineData
        description: Installation of CloudWatch Log Agent
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: 01_InstallAgent
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y amazon-cloudwatch-agent
              - name: 02_CreateAsyncAgentRestart
                action: CreateFile
                inputs:
                  - path: /tmp/restartCWAgent.sh
                    content: |
                      echo "Preparing to update CloudWatch Agent Config..." >> /var/log/messages
                      sleep 90
                      cp -v /opt/aws/amazon-cloudwatch-agent-config/* /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.d/
                      service amazon-cloudwatch-agent restart
                      echo "Updated CloudWatch Agent Config." >> /var/log/messages
                    permissions: 755
              - name: 03_CreateExecutionScript
                action: AppendFile
                inputs:
                  - path: /etc/rc.d/rc.local
                    content: |
                      /tmp/restartCWAgent.sh &
              - name: 04_MakeScriptExecutable
                action: SetFilePermissions
                inputs:
                  - path: /etc/rc.d/rc.local
                    permissions: 755
              - name: 05_ConfigureCWAgent
                action: CreateFile
                inputs:
                  - path: /opt/aws/amazon-cloudwatch-agent-config/default
                    content: |
                      {
                        "agent": {
                          "metrics_collection_interval": 30,
                          "run_as_user": "root"
                        },
                        "metrics": {
                          "append_dimensions": {
                            "AutoScalingGroupName": "${aws:AutoScalingGroupName}",
                            "ImageId": "${aws:ImageId}",
                            "InstanceId": "${aws:InstanceId}",
                            "InstanceType": "${aws:InstanceType}"
                          },
                          "metrics_collected": {
                            "cpu": {
                              "measurement": [
                                "cpu_usage_idle",
                                "cpu_usage_iowait",
                                "cpu_usage_user",
                                "cpu_usage_system"
                              ],
                              "metrics_collection_interval": 30,
                              "resources": [
                                "*"
                              ],
                              "totalcpu": true
                            },
                            "disk": {
                              "measurement": [
                                "used_percent",
                                "inodes_free"
                              ],
                              "metrics_collection_interval": 30,
                              "resources": [
                                "*"
                              ]
                            },
                            "diskio": {
                              "measurement": [
                                "io_time"
                              ],
                              "metrics_collection_interval": 30,
                              "resources": [
                                "*"
                              ]
                            },
                            "mem": {
                              "measurement": [
                                "mem_used_percent"
                              ],
                              "metrics_collection_interval": 30
                            },
                            "swap": {
                              "measurement": [
                                "swap_used_percent"
                              ],
                              "metrics_collection_interval": 30
                            }
                          }
                        },
                        "logs": {
                          "logs_collected": {
                            "files": {
                              "collect_list": [
                                {
                                  "file_path": "/opt/aws/amazon-cloudwatch-agent/logs/amazon-cloudwatch-agent.log",
                                  "log_group_name": "amazon-cloudwatch-agent.log"
                                },
                                {
                                  "file_path": "/var/log/messages",
                                  "log_group_name": "/var/log/messages"
                                },
                                {
                                  "file_path": "/var/log/secure",
                                  "log_group_name": "/var/log/secure"
                                },
                                {
                                  "file_path": "/var/log/amazon/ssm/amazon-ssm-agent.log",
                                  "log_group_name": "amazon-ssm-agent.log"
                                },
                                {
                                  "file_path": "/var/log/amazon/ssm/errors.log",
                                  "log_group_name": "amazon-ssm-errors.log"
                                },
                                {
                                  "file_path": "/var/log/cloud-init.log",
                                  "log_group_name": "/var/log/cloud-init.log"
                                },
                                {
                                  "file_path": "/var/log/cloud-init-output.log",
                                  "log_group_name": "/var/log/cloud-init-output.log"
                                }
                              ]
                            }
                          }
                        }
                      }
                    overwrite: true
              - name: 06_SetAutoStart
                action: ExecuteBash
                inputs:
                  commands:
                    - chkconfig amazon-cloudwatch-agent on

