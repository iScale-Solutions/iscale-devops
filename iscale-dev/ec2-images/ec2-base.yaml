  PostgreSQL12ClientComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: PostgreSQL-12-Client
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 1.0.1
      Description: Installs PostgreSQL 12 Client
      ChangeDescription: Initial version
      Data: |
        name: InstallPostgreSQL11 - InlineData
        description: This is the PostgreSQL 12 installation
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: AddRepository
                action: CreateFile
                inputs:
                  - path: /etc/yum.repos.d/pgsql12.repo
                    content: |
                      [pgsql12]
                      name=PostgreSQL 12 for RHEL/CentOS 7 - x86_64
                      baseurl=https://download.postgresql.org/pub/repos/yum/12/redhat/rhel-7-x86_64
                      enabled=1
                      gpgcheck=0
                    overwrite: true
              - name: MakeCache
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum makecache
              - name: Install
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum -y install postgresql12

