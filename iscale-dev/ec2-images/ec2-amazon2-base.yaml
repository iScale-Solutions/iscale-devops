AWSTemplateFormatVersion: 2010-09-09
Description: Base Image Builder for Amazon Linux 2

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
      - Label:
          default: Sharing Configuration
        Parameters:
          - ShareImage

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      NetworkStackName:
        default: Network Stack Name
      ShareImage:
        default: Share image with other account? If sharing, encryption will be disabled.
      SNSStackName:
        default: SNS Topic Stack Name

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    Default: image-builder
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  NetworkStackName:
    Description: The name of the network stack.
    Type: String
    Default: iscale-dev-dev-uw2-network # change this if needed
    MinLength: 1
  ShareImage:
    Description: Select true to not encrypt the image and share it with other accounts
    Type: String
    Default: true
    AllowedValues:
      - true
      - false
  SNSStackName:
    Description: the name of the SNS stack.
    Type: String
    Default: iscale-dev-dev-uw2-sns # change this if needed
    MinLength: 1

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  IsImageShared: !Equals [!Ref ShareImage, true]

Resources:

###
# Common components
###

  CodeDeployComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: CodeDeploy
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 1.0.3
      Description: Installs the CodeDeploy Agent
      ChangeDescription: Initial version
      Data: |
        name: CodeDeploy - InlineData
        description: Installation of CodeDeploy Agent
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: 01_YumInstallWgetRuby
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y wget
                    - sudo yum install -y ruby
              - name: 02_CreateLogsConfig
                action: CreateFile
                inputs:
                  - path: /opt/aws/amazon-cloudwatch-agent-config/codedeploy-logs.json
                    content: |
                      {
                        "logs": {
                          "logs_collected": {
                            "files": {
                              "collect_list": [
                                {
                                  "file_path": "/var/log/aws/codedeploy-agent/codedeploy-agent.log",
                                  "log_group_name": "/var/log/aws/codedeploy-agent/codedeploy-agent.log"
                                },
                                {
                                  "file_path": "/opt/codedeploy-agent/deployment-root/deployment-logs/codedeploy-agent-deployments.log",
                                  "log_group_name": "/var/log/codedeploy-agent-deployments.log"
                                }
                              ]
                            }
                          }
                        }
                      }
                    overwrite: true
              - name: 03_WGetInstall
                action: ExecuteBash
                inputs:
                  commands:
                    - wget -P /tmp https://aws-codedeploy-us-west-2.s3.us-west-2.amazonaws.com/latest/install
              - name: 04_SetInstallPermissions
                action: SetFilePermissions
                inputs:
                  - path: /tmp/install
                    permissions: 700
              - name: 05_ExecuteInstall
                action: ExecuteBash
                inputs:
                  commands:
                    - /tmp/install auto
              - name: 06_CleanupInstall
                action: ExecuteBash
                inputs:
                  commands:
                    - rm -fr /tmp/install
              - name: 07_LinkCFNInit
                action: CreateSymlink
                inputs:
                  - path: /usr/local/bin/cfn-init
                    target: /opt/aws/bin/cfn-init
                    force: true
              - name: 08_LinkCFNHup
                action: CreateSymlink
                inputs:
                  - path: /usr/local/bin/cfn-hup
                    target: /opt/aws/bin/cfn-hup
                    force: true
              - name: 09_LinkCFNSignal
                action: CreateSymlink
                inputs:
                  - path: /usr/local/bin/cfn-signal
                    target: /opt/aws/bin/cfn-signal
                    force: true
              - name: RestartAgent
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a append-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent-config/codedeploy-logs.json

  AWSLinuxUtilitiesComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: AWS-Linux-Utilities
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 1.0.1
      Description: Installs EPEL repository, Git, JQuery, EFS, CFN, Telnet, wget
      ChangeDescription: Initial version
      Data: |
        name: AWWS Linux Utilities - InlineData
        description: Linux Utilities Installation
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: EPELInstall
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo amazon-linux-extras install -y epel
              - name: YumUpdate
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum -y update
              - name: InstallGit
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y git
              - name: InstallJQuery
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y jq
              - name: InstallEFS
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y amazon-efs-utils
              - name: InstallCloudFormation
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y aws-cfn-bootstrap
              - name: InstallTelnet
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y telnet
              - name: InstallWget
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y wget
  
  CloudWatchLogsComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: CloudWatchLogs
      Platform: Linux
      SupportedOsVersions:
        - Amazon Linux 2
      Version: 1.0.1
      Description: Installs CloudWatch Logs Agent with basic OS config
      ChangeDescription: Initial version
      Data: |
        name: CloudWatch - InlineData
        description: Installation of CloudWatch Log Agent
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: InstallCloudWatchLogsAgent
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo yum install -y awslogs
              - name: ConfigureCloudWatchLogsAgent
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      echo "[plugins]" > /etc/awslogs/awscli.conf
                      echo "cwlogs = cwlogs" >> /etc/awslogs/awscli.conf
                      echo "[default]" >> /etc/awslogs/awscli.conf
                      REGION=`curl -s http://169.254.169.254/latest/meta-data/placement/availability-zone | sed 's/\(.*\)[a-z]/\1/'`
                      echo "region = $REGION" >> /etc/awslogs/awscli.conf
              - name: EnableCloudWatchLogsAgent
                action: ExecuteBash
                inputs:
                  commands:
                    - sudo systemctl enable awslogsd.service  

###
# Amazon Linux 2 Base Image
###

  AmazonLinuxImageRecipe:
    Type: AWS::ImageBuilder::ImageRecipe
    Properties:
      Name: !Join [' ', [!Ref OrgName, 'amazon-linux2']]
      Version: 1.0.2
      ParentImage: !Join [':', [arn:aws:imagebuilder, !Ref 'AWS::Region', aws:image/amazon-linux-2-x86/2024.6.21]]
      WorkingDirectory: /tmp
      Description: !Join [' ', ['Base image for', !Ref OrgName, 'amazon-linux']]
      Components: #Max 20
      #  - ComponentArn: !Ref CloudWatchLogsComponent
        - ComponentArn: !Ref AWSLinuxUtilitiesComponent
        - ComponentArn: !Ref CodeDeployComponent
        - ComponentArn: !Join [':', ['arn:aws:imagebuilder', !Ref 'AWS::Region', 'aws:component/aws-cli-version-2-linux/1.0.4/1']]
        - ComponentArn: !Join [':', ['arn:aws:imagebuilder', !Ref 'AWS::Region', 'aws:component/update-linux-kernel-5/1.0.1/1']]
        - ComponentArn: !Join [':', ['arn:aws:imagebuilder', !Ref 'AWS::Region', 'aws:component/update-linux/1.0.2/1']]
        - ComponentArn: !Join [':', ['arn:aws:imagebuilder', !Ref 'AWS::Region', 'aws:component/chrony-time-configuration-test/1.0.1/1']]
        - ComponentArn: !Join [':', ['arn:aws:imagebuilder', !Ref 'AWS::Region', 'aws:component/simple-boot-test-linux/1.0.0/1']]
        - ComponentArn: !Join [':', ['arn:aws:imagebuilder', !Ref 'AWS::Region', 'aws:component/validate-ssh-host-key-generation-linux/1.0.1/1']]
        # - ComponentArn: !Join [':', ['arn:aws:imagebuilder', !Ref 'AWS::Region', 'aws:component/stig-build-linux-high/2023.2.1/1']] # temp remove
        - ComponentArn: !Join [':', ['arn:aws:imagebuilder', !Ref 'AWS::Region', 'aws:component/amazon-cloudwatch-agent-linux/1.0.1/1']]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: !If [IsImageShared, false, true]
            KmsKeyId: !If [IsImageShared, !Ref 'AWS::NoValue', !Join [':', ['arn:aws:kms', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'alias/aws/ebs']]]
            VolumeType: gp2
            VolumeSize: 8

  AmazonLinuxBuilder: 
    Type: AWS::CloudFormation::Stack
    Properties: 
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/ec2-image-builder.yaml
      Parameters: 
        Name: amazon-linux2
        EnvName: !Ref EnvName
        NetworkStackName: !Ref NetworkStackName
        OrgName: !Ref OrgName
        ImageRecipeARN: !Ref AmazonLinuxImageRecipe
        ShareImage: !Ref ShareImage
        SNSStackName: !Ref SNSStackName