AWSTemplateFormatVersion: 2010-09-09
Description: This cloudformation configuration provisions an elasticsearch for Tasaki

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      -
        Label:
          default: "Resource Configuration"
        Parameters:
          - Name
          - OrgName
          - EnvName
      -
        Label:
          default: "Elasticsearch Configuration"
        Parameters:
          - ElasticsearchVersion
          - InstanceType
          - VolumeType
          - VolumeSize
          - AutomatedSnapshotStartHour
          - EncryptAtRestEnabled
          - RestActionMultiAllowExplicitIndexEnabled
          - LogPublishingIndexEnabled
          - LogPublishingSearchEnabled
          - LogPublishingApplicationEnabled
          - ClientDomainName
      -
        Label:
          default: "CloudWatch Configuration"
        Parameters:
          - LogRetentionPeriod
      -
        Label:
          default: "Cloudformation Stack Configuration"
        Parameters:
          - NetworkStackName
          - SNSStackName

    ParameterLabels:
      Name:
        default: "Resource Name"
      OrgName:
        default: "Organization Name"
      EnvName:
        default: "Environment Name"
      ElasticsearchVersion:
        default: "Elasticsearch Version"
      InstanceType:
        default: "Elasticsearch Instance Type"
      VolumeType:
        default: "Volume Type"
      VolumeSize:
        default: "Volume Size"
      RestActionMultiAllowExplicitIndexEnabled:
        default: "Enable Rest Action Multi Allow Explicti Index"
      AutomatedSnapshotStartHour:
        default: "Automated Snapshot Start Hour"
      EncryptAtRestEnabled:
        default: "Enable Encrypt at Rest"
      LogPublishingIndexEnabled:
        default: "Enable Index Log Publishing"
      LogPublishingSearchEnabled:
        default: "Enable Search Log Publishing"
      LogPublishingApplicationEnabled:
        default: "Enable Application Log Publishing"
      ClientDomainName:
        default: "Domain Name"
      LogRetentionPeriod:
        default: "Log Retention Period"
      NetworkStackName:
        default: "Network Stack Name"
      SNSStackName:
        default: "SNS Stack Name"

Parameters: 
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    Default: tasaki-elasticsearch
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
  ElasticsearchVersion:
    Description: The Elasticsearch version
    Type: String
    Default: 6.7
  InstanceType:
    Description: The elasticsearch version
    Type: String
    Default: t2.small.elasticsearch
  VolumeType:
    Description: Values must be [gp2, io1, standard]
    Type: String
    Default: gp2
    AllowedValues:
      - gp2
      - io1
      - standard
  VolumeSize:
    Description: Elasticsearch Volume Size
    Type: Number
    Default: 10
  AutomatedSnapshotStartHour:
    Description: The hour in UTC during which the service takes an automated daily snapshot of the indices in the Amazon ES domain.
    Type: Number
    Default: 0
  EncryptAtRestEnabled:
    Description: Enables encrypt data at rest.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  RestActionMultiAllowExplicitIndexEnabled:
    Description: Specifies whether explicit references to indices are allowed inside the body of HTTP requests. Setting this property to false prevents users from bypassing access control for subresources.
    Type: String
    Default: true
    AllowedValues:
      - true
      - false
  LogPublishingIndexEnabled:
    Description: Enables publishing of the Elasticsearch index logs.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  LogPublishingSearchEnabled:
    Description: Enables publishing of the Elasticsearch searc logs.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  LogPublishingApplicationEnabled:
    Description: Enables publishing of the Elasticsearch application logs.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  ClientDomainName:
    Description: The client's domain name (e.g. example.com, iscale-solutions.com).
    Type: String
    Default: iscale-software.com
  LogRetentionPeriod:
    Description: The number of days to retain the log events in the specified log group
    Type: Number
    Default: 365
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]
  NetworkStackName:
    Description: The name of the cloudformation Network stack
    Type: String
    Default: iscale-dev-dev-uw2-network
  SNSStackName:
    Description: The name of the cloudformation SNS stack
    Type: String
    Default: iscale-dev-dev-uw2-tasaki-sns

Mappings: 
  EnvShort:
    Production:
      Name: prd
    Staging:
      Name: stg
    Development:
      Name: dev
    Test:
      Name: test
  RegionShort:
    us-east-2:
      Name: ue2
    us-east-1:
      Name: ue1
    us-west-1:
      Name: uw1
    us-west-2:
      Name: uw2
    ap-east-1:
      Name: ae1
    ap-south-1:
      Name: as1
    ap-northeast-1:
      Name: ane1
    ap-northeast-2:
      Name: ane2
    ap-northeast-3:
      Name: ane3
    ap-southeast-1:
      Name: ase1
    ap-southeast-2:
      Name: ase2
    ca-central-1:
      Name: cc1
    cn-north-1:
      Name: cn1
    cn-northwest-1:
      Name: cnw1
    eu-central-1:
      Name: ec1
    eu-west-1:
      Name: ew1
    eu-west-2:
      Name: ew2
    eu-west-3:
      Name: ew3
    eu-north-1:
      Name: en1
    me-south-1:
      Name: ms1
    sa-east-1:
      Name: se1
    us-gov-east-1:
      Name: uge1
    us-gov-west-1:
      Name: ugw1

Conditions:

  IsEncrypted: !Equals [!Ref EncryptAtRestEnabled, true]
  IsLogPublishingIndexEnabled: !Equals [!Ref LogPublishingIndexEnabled, true]
  IsLogPublishingSearchEnabled: !Equals [!Ref LogPublishingSearchEnabled, true]
  IsLogPublishingApplicationEnabled: !Equals [!Ref LogPublishingApplicationEnabled, true]

Resources: 

####
# Elasticsearch Section
####

  DefaultElasticsearchDomain:
    Type: AWS::Elasticsearch::Domain
    Properties:
      ElasticsearchVersion: !Ref ElasticsearchVersion
      ElasticsearchClusterConfig:
        InstanceCount: 1
        InstanceType: !Ref InstanceType
      EBSOptions:
        EBSEnabled: true
        VolumeSize: !Ref VolumeSize
        VolumeType: !Ref VolumeType
      # EncryptionAtRestOptions:
      #   Enabled: !Ref EncryptAtRestEnabled
      #   KmsKeyId: !If [IsEncrypted, !Ref DefaultKmsKey, 'AWS::NoValue']
      SnapshotOptions:
        AutomatedSnapshotStartHour: !Ref AutomatedSnapshotStartHour
      AccessPolicies: 
        Version: "2012-10-17"
        Statement: 
          - Effect: "Allow"
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "es:*"
            Resource: "*"
      AdvancedOptions:
        rest.action.multi.allow_explicit_index: !Ref RestActionMultiAllowExplicitIndexEnabled
      LogPublishingOptions:
        INDEX_SLOW_LOGS:
          CloudWatchLogsLogGroupArn: !GetAtt IndexLogLogGroup.Arn
          Enabled: !Ref LogPublishingIndexEnabled
        SEARCH_SLOW_LOGS:
          CloudWatchLogsLogGroupArn: !GetAtt SearchLogLogGroup.Arn
          Enabled: !Ref LogPublishingSearchEnabled
        ES_APPLICATION_LOGS:
          CloudWatchLogsLogGroupArn: !GetAtt ApplicationLogLogGroup.Arn
          Enabled: !Ref LogPublishingApplicationEnabled
      VPCOptions:
        SubnetIds:
          - 
            Fn::ImportValue:
             !Sub "${NetworkStackName}-PublicSubnetId1"
        SecurityGroupIds:
          - !Ref DefaultSecurityGroup
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        - 
          Key: Environment
          Value: !Ref EnvName
        - 
          Key: Organization
          Value: !Ref OrgName

####
# IAM Section
####

  # DefaultPolicy:
  #   Type: 'AWS::IAM::Policy'
  #   Properties:
  #     PolicyName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, cloudwatch-logs]]
  #     PolicyDocument:
  #       Version: 2012-10-17
  #       Statement:
  #         - Effect: "Allow"
  #           Action:
  #             - logs:CreateLogStream
  #             - logs:PutLogEvents
  #           Principal:
  #             Service: "es.amazonaws.com"
  #           Resource: "*"
  
  # DefaultIamRole:
  #   Type: AWS::IAM::Role
  #   Properties:
  #     AssumeRolePolicyDocument:
  #       Version: "2012-10-17"
  #       Statement:
  #         - 
  #           Sid: "1"
  #           Effect: "Allow"
  #           Action: "sts:AssumeRole"
  #           Principal:
  #             Service: "es.amazonaws.com"
  #     Policies:
  #       - 
  #         PolicyName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, cloudwatch-logs]]
  #         PolicyDocument:
