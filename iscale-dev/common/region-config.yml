  VPCPeeringLeastAccessConfigRule:
    DependsOn: ConfigRecorder
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: vpc_peering_least_access
      Scope:
        ComplianceResourceTypes:
          - AWS::EC2::RouteTable
      Description: A config rule to help you ensure routing tables for VPC peering are 'least access'
      Source:
        Owner: CUSTOM_LAMBDA
        SourceIdentifier:
          Fn::GetAtt:
            - LambdaFunctionForVPCPeeringLeastAccessConfigRule
            - Arn
        SourceDetails:
          - EventSource: aws.config
            MessageType: ConfigurationItemChangeNotification
          - EventSource: aws.config
            MessageType: OversizedConfigurationItemChangeNotification
      MaximumExecutionFrequency: TwentyFour_Hours
    DependsOn: LambdaInvokePermissionsForVPCPeeringLeastAccessConfigRule
  
  LambdaInvokePermissionsForVPCPeeringLeastAccessConfigRule:
    DependsOn: ConfigRecorder
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::GetAtt:
          - LambdaFunctionForVPCPeeringLeastAccessConfigRule
          - Arn
      Action: lambda:InvokeFunction
      Principal: config.amazonaws.com
  
  LambdaFunctionForVPCPeeringLeastAccessConfigRule:
    DependsOn: ConfigRecorder
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: LambdaForVPC_peering_least_access
      Handler: index.lambda_handler
      Role:
        Fn::GetAtt:
          - LambdaIamRoleForVPCPeeringLeastAccessConfigRule
          - Arn
      Runtime: python3.8
      Code:
        ZipFile: |
          import boto3
          import json
          def lambda_handler(event, context):
            is_compliant = True
            invoking_event = json.loads(event['invokingEvent'])
            annotation = ''
            route_table_id = invoking_event['configurationItem']['resourceId']
            for route_table in boto3.client('ec2').describe_route_tables(RouteTableIds=[route_table_id])['RouteTables']:
              for route in route_table['Routes']:
                if 'VpcPeeringConnectionId' in route:
                  if int(str(route['DestinationCidrBlock']).split('/', 1)[1]) < 24:
                    is_compliant = False
                    annotation = 'VPC peered route table has a large CIDR block destination.'
              evaluations = [
                {
                  'ComplianceResourceType': invoking_event['configurationItem']['resourceType'],
                  'ComplianceResourceId': route_table_id,
                  'ComplianceType': 'COMPLIANT' if is_compliant else 'NON_COMPLIANT',
                  'OrderingTimestamp': invoking_event['configurationItem']['configurationItemCaptureTime']
                }
              ]
              if annotation: evaluations[0]['Annotation'] = annotation
              response = boto3.client('config').put_evaluations(
              Evaluations = evaluations,
              ResultToken = event['resultToken'])
      Timeout: 300
    DependsOn: LambdaIamRoleForVPCPeeringLeastAccessConfigRule
  
  LambdaIamRoleForVPCPeeringLeastAccessConfigRule:
    DependsOn: ConfigRecorder
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
        - arn:aws:iam::aws:policy/service-role/AWSConfigRulesExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole