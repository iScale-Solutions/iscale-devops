  UnauthorizedAPICallFilter:
    Condition: EnableCIS
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudTrailCloudWatchLogGroup
      FilterPattern: "{ ($.errorCode = \"*UnauthorizedOperation\") || ($.errorCode = \"AccessDenied*\") }"
      MetricTransformations:
        - MetricValue: 1
          MetricNamespace: CloudTrailMetrics
          MetricName: UnauthorizedAPICallCount

  UnauthorizedAPICallAlarm:
    Condition: EnableCIS
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: denied_api_call
      AlarmDescription: A CloudWatch Alarm that triggers when an API call was denied
      MetricName: UnauthorizedAPICallCount
      Namespace: CloudTrailMetrics
      Statistic: Sum
