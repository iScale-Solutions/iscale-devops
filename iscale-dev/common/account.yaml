AWSTemplateFormatVersion: 2010-09-09
Description: This  template provisions basic details for a customer AWS account

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - OrgName
      - Label:
          default: User Roles
        Parameters:
          - AdminUsers
          - CreateReadOnlyUsers
          - EnableConfigRules
          - ConfigAlertEmail
          - EnableCISRules
          - CISAlertEmail
          - ReadOnlyUsers
    
    ParameterLabels:
      AdminUsers:
        default: Administrators
      OrgName:
        default: Organization Name
      CISAlertEmail:
        default: Email for CIS Alerts
      ConfigAlertEmail:
        default: Email for Config Alerts
      EnableCISRules:
        default: Enable CIS compliance
      EnableConfigRules:
        default: Enable AWS Config
      ReadOnlyUsers:
        default: Read-Only Users

Parameters:
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.

  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test

  AdminUsers:
    Description: List of account Administrators
    Type: CommaDelimitedList
    Default: arn:aws:iam::383761724374:user/iannis@iscale-solutions.com, arn:aws:iam::338284463834:user/jean.emmanuel@iscale-solutions.com
  
  CreateReadOnlyUsers:
    Description: Set to true to specify read only users
    Default: false
    Type: String
    AllowedValues: [true, false]

  CISAlertEmail:
    Description: Email address to send CIS Alerts
    Type: String
    Default: ''

  ConfigAlertEmail:
    Description: Email address to send Config Alerts
    Type: String
    Default: ''

  EnableCISRules:
    Description: Set to true to enable CIS compliance
    Default: false
    Type: String
    AllowedValues: [true, false]

  EnableConfigRules:
    Description: Set to true to enable AWS Config
    Default: true
    Type: String
    AllowedValues: [true, false]
  
  ReadOnlyUsers:
    Description: List of Read-Only Users
    Type: CommaDelimitedList
    Default: ''

Conditions:
  ShouldCreateReadOnlyUsers: !Equals [true, !Ref CreateReadOnlyUsers]
  EnableCIS: !Equals [true, !Ref EnableCISRules]
  EnableConfig: !Equals [true, !Ref EnableConfigRules]
  CreateSNSKmsKey: !Or [Condition: EnableCIS, Condition: EnableConfig]
  SendCISEmail: !And [Condition: EnableCIS, !Not [ !Equals ['', !Ref CISAlertEmail]]]
  SendConfigEmail: !And [Condition: EnableConfig, !Not [ !Equals ['', !Ref ConfigAlertEmail]]]

Resources:

###
# CloudTrail
###

  S3Bucket:
    DeletionPolicy: Retain
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Join ['-', [!Ref OrgName, 'cloudtrail']]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 3
          Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref S3BucketAccessLogsBucket
        LogFilePrefix: cloudtrail-access-logs
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Join [ '-', [!Ref OrgName , cloudtrail]]
        - Key: Organization
          Value: !Ref OrgName

  S3BucketAccessLogsBucket:
    DeletionPolicy: Retain
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: LogDeliveryWrite
      BucketName: !Join ['-', [!Ref OrgName, 'cloudtrail-access-logs']]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  S3BucketPolicy:
    DeletionPolicy: Retain
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: S3Bucket
      PolicyDocument: 
        Version: 2012-10-17
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource:
              !Sub |-
                arn:aws:s3:::${S3Bucket}
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource:
              !Sub |-
                arn:aws:s3:::${S3Bucket}/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  CloudTrailKmsKey:
    DeletionPolicy: Retain
    DependsOn:
      - MasterAccountAccessRole
    Type: AWS::KMS::Key
    Properties:
      EnableKeyRotation: true
      KeyPolicy:
        Version: 2012-10-17
        Id: key-policy
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Join ['',['arn:aws:iam::', !Ref 'AWS::AccountId', ':root']]
            Action:
              - kms:*
            Resource: '*'
          - Sid: Allow administration of the key
            Effect: Allow
            Principal:
              AWS: !Join ['',['arn:aws:iam::', !Ref 'AWS::AccountId', ':role/MasterAccountAccessRole']]
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          - Sid: Allow CloudTrail to encrypt and decrypt logs
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
              - kms:ReEncryptFrom
            Resource: '*'
            Condition:
              StringLike:
                kms:EncryptionContext:aws:cloudtrail:arn: !Join [':',['arn:aws:cloudtrail:*', !Ref 'AWS::AccountId', 'trail/*']]
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, cloudtrail]]
        - Key: Organization
          Value: !Ref OrgName

  CloudTrailKmsAlias:
    DeletionPolicy: Retain
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Join ['-',[!Join ['/', [alias, !Ref OrgName]], cloudtrail]]
      TargetKeyId: !Ref CloudTrailKmsKey

  CloudTrailCloudWatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['/', ['/aws/cloudtrail', !Ref OrgName]]

  CloudTrailRole:
    Type: AWS::IAM::Role
    Properties:
      Path: '/'
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudtrail.amazonaws.com
            Action: 
              - sts:AssumeRole
      Policies:
        - PolicyName: CloudTrailLogPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: 
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: 'arn:aws:logs:*:*:*'

  CloudTrail:
    DeletionPolicy: Retain
    DependsOn:
      - S3BucketPolicy
    Type: AWS::CloudTrail::Trail
    Properties:
      CloudWatchLogsLogGroupArn: !GetAtt CloudTrailCloudWatchLogGroup.Arn
      CloudWatchLogsRoleArn: !GetAtt CloudTrailRole.Arn
      EnableLogFileValidation: true
      S3BucketName:
        Ref: S3Bucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      KMSKeyId: !Ref CloudTrailKmsKey
      TrailName: !Join ['-', [!Ref OrgName, trail]]

###
# Basic Roles and groups
###

  AdminGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: Administrators
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  AWSSupportGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: AWSSupportGroup
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSSupportAccess

  BillingGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: Billing
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/job-function/Billing

  ReadOnlyGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: ReadOnly
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/job-function/ViewOnlyAccess

  CloudFormationFullAccessRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Role designed for CloudFormation to change anything
      RoleName: CloudFormationFullAccessRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /

  CloudFormationImportAccessRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Role designed for CloudFormation import and guarantee that no existing resources are modified
      RoleName: CloudFormationImportAccessRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
        - arn:aws:iam::aws:policy/AWSCloudFormationFullAccess
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /

  EC2BasicSSMIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: ec2.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonSSMDirectoryServiceAccess
        - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM
      Policies:
        - PolicyName: EC2LogPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: 'arn:aws:logs:*:*:*'
        - PolicyName: EC2ReadTagPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeTags
                  - ec2:DescribeInstances
                Resource: '*'

  EC2BasicInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: EC2BasicSSMIamRole

  MasterAccountAccessRole:
    DeletionPolicy: Retain
    Type: AWS::IAM::Role
    Properties:
      Description: Administrator access from trusted parties
      RoleName: MasterAccountAccessRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref AdminUsers
            Action:
              - sts:AssumeRole
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: true
      Path: /

  OpsidianAccessRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Opsidian Access
      RoleName: OpsidianAccessRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - arn:aws:iam::326365640391:root
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: iscale-solutions
      Path: /

  ReadOnlyAccountAccessRole:
    Condition: ShouldCreateReadOnlyUsers
    Type: AWS::IAM::Role
    Properties:
      Description: Read only access from trusted parties
      RoleName: ReadOnlyAccountAccessRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref ReadOnlyUsers
            Action:
              - sts:AssumeRole
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: false
      Path: /

###
# AWS Config
###

  ConfigBucket:
    DeletionPolicy: Retain
    Condition: EnableConfig
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256

  ConfigBucketPolicy:
    Condition: EnableConfig
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ConfigBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AWSConfigBucketPermissionsCheck
            Effect: Allow
            Principal:
              Service:
                - config.amazonaws.com
            Action: s3:GetBucketAcl
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${ConfigBucket}'
          - Sid: AWSConfigBucketDelivery
            Effect: Allow
            Principal:
              Service:
                - config.amazonaws.com
            Action: s3:PutObject
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${ConfigBucket}/AWSLogs/${AWS::AccountId}/*'

  ConfigRecorderRole:
    Condition: EnableConfig
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - config.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWS_ConfigRole'

  ConfigRecorder:
    Condition: EnableConfig
    Type: AWS::Config::ConfigurationRecorder
    DependsOn:
      - ConfigBucketPolicy
    Properties:
      RoleARN: !GetAtt ConfigRecorderRole.Arn
      RecordingGroup:
        AllSupported: true
        IncludeGlobalResourceTypes: true

  ConfigDeliveryChannel:
    Condition: EnableConfig
    Type: AWS::Config::DeliveryChannel
    DependsOn:
      - ConfigBucketPolicy
    Properties:
      ConfigSnapshotDeliveryProperties:
        DeliveryFrequency: TwentyFour_Hours
      S3BucketName: !Ref ConfigBucket
      SnsTopicARN: !Ref ConfigTopic

  ConfigTopic:
    Condition: EnableConfig
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'config-topic-${AWS::AccountId}'
      DisplayName: AWS Config Notification Topic
      KmsMasterKeyId: !Ref SNSKmsKey

  ConfigEmailSubscription:
    Condition: SendConfigEmail
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !Ref ConfigAlertEmail
      Protocol: email
      TopicArn: !Ref ConfigTopic

  ConfigTopicPolicy:
    Condition: EnableConfig
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref ConfigTopic
      PolicyDocument:
        Statement:
          - Sid: AWSConfigSNSPolicy
            Action:
              - sns:Publish
            Effect: Allow
            Resource: !Ref ConfigTopic
            Principal:
              Service:
                - config.amazonaws.com

###
# CIS Alarms
###
  
  SNSKmsKey:
    DeletionPolicy: Retain
    Condition: CreateSNSKmsKey
    DependsOn:
      - MasterAccountAccessRole
    Type: AWS::KMS::Key
    Properties:
      EnableKeyRotation: true
      KeyPolicy:
        Version: 2012-10-17
        Id: key-policy
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Join ['',['arn:aws:iam::', !Ref 'AWS::AccountId', ':root']]
            Action:
              - kms:*
            Resource: '*'
          - Sid: Allow administration of the key
            Effect: Allow
            Principal:
              AWS: !Join ['',['arn:aws:iam::', !Ref 'AWS::AccountId', ':role/MasterAccountAccessRole']]
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          - Sid: Allow cloudwatch to decrypt SNS topics
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
              - kms:ReEncryptFrom
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, sns]]
        - Key: Organization
          Value: !Ref OrgName

  SNSKmsAlias:
    DeletionPolicy: Retain
    Condition: CreateSNSKmsKey
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Join ['-',[!Join ['/', [alias, !Ref OrgName]], sns]]
      TargetKeyId: !Ref SNSKmsKey

  CISTopic:
    Condition: EnableCIS
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'cis-topic-${AWS::AccountId}'
      DisplayName: CIS Notification Topic
      KmsMasterKeyId: !Ref SNSKmsKey

  CISEmailSubscription:
    Condition: SendCISEmail
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !Ref CISAlertEmail
      Protocol: email
      TopicArn: !Ref CISTopic

  UnauthorizedAPICallsAlarm:
    Condition: EnableCIS
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: unauthorized_api_calls
      AlarmDescription: A CloudWatch Alarm that triggers if Multiple unauthorized actions or logins attempted.
      MetricName: UnauthorizedAttemptCount
      Namespace: CloudTrailMetrics
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref CISTopic
      TreatMissingData: notBreaching

  ConsoleSigninWithoutMFAFilter:
    Condition: EnableCIS
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudTrailCloudWatchLogGroup
      FilterPattern: "{($.eventName = \"ConsoleLogin\") && ($.additionalEventData.MFAUsed != \"Yes\") && ($.responseElements.ConsoleLogin != \"Failure\") && ($.additionalEventData.SamlProviderArn NOT EXISTS) }"
      MetricTransformations:
        - MetricValue: 1
          MetricNamespace: CloudTrailMetrics
          MetricName: ConsoleSigninWithoutMFA

  ConsoleSigninWithoutMFAAlarm:
    Condition: EnableCIS
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: no_mfa_console_logins
      AlarmDescription: A CloudWatch Alarm that triggers if there is a Management Console sign-in without MFA.
      MetricName: ConsoleSigninWithoutMFA
      Namespace: CloudTrailMetrics
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref CISTopic
      TreatMissingData: notBreaching

  IAMPolicyEventCountFilter:
    Condition: EnableCIS
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudTrailCloudWatchLogGroup
      FilterPattern: "{($.eventName=DeleteGroupPolicy)||($.eventName=DeleteRolePolicy)||($.eventName=DeleteUserPolicy)||($.eventName=PutGroupPolicy)||($.eventName=PutRolePolicy)||($.eventName=PutUserPolicy)||($.eventName=CreatePolicy)||($.eventName=DeletePolicy)||($.eventName=CreatePolicyVersion)||($.eventName=DeletePolicyVersion)||($.eventName=AttachRolePolicy)||($.eventName=DetachRolePolicy)||($.eventName=AttachUserPolicy)||($.eventName=DetachUserPolicy)||($.eventName=AttachGroupPolicy)||($.eventName=DetachGroupPolicy)}"
      MetricTransformations:
        - MetricValue: 1
          MetricNamespace: CloudTrailMetrics
          MetricName: IAMPolicyEventCount

  IAMPolicyChangeAlarm:
    Condition: EnableCIS
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: iam_policy_changes
      AlarmDescription: A CloudWatch Alarm that triggers when changes are made to IAM policies. Events include IAM policy creation/deletion/update operations as well as attaching/detaching policies from IAM users, roles or groups.
      MetricName: IAMPolicyEventCount
      Namespace: CloudTrailMetrics
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref CISTopic
      TreatMissingData: notBreaching

  CloudTrailChangeCountFilter:
    Condition: EnableCIS
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudTrailCloudWatchLogGroup
      FilterPattern: "{ ($.eventName = CreateTrail) || ($.eventName = UpdateTrail) || ($.eventName = DeleteTrail) || ($.eventName = StartLogging) || ($.eventName = StopLogging) }"
      MetricTransformations:
        - MetricValue: 1
          MetricNamespace: CloudTrailMetrics
          MetricName: CloudTrailEventCount

  CloudTrailChangeAlarm:
    Condition: EnableCIS
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cloudtrail_changes
      AlarmDescription: A CloudWatch Alarm that triggers when changes are made to CloudTrail.
      MetricName: CloudTrailEventCount
      Namespace: CloudTrailMetrics
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref CISTopic
      TreatMissingData: notBreaching

  S3BucketChangeCountFilter:
    Condition: EnableCIS
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudTrailCloudWatchLogGroup
      FilterPattern: "{ ($.eventSource = s3.amazonaws.com) && (($.eventName = PutBucketAcl) || ($.eventName = PutBucketPolicy) || ($.eventName = PutBucketCors) || ($.eventName = PutBucketLifecycle) || ($.eventName = PutBucketReplication) || ($.eventName = DeleteBucketPolicy) || ($.eventName = DeleteBucketCors) || ($.eventName = DeleteBucketLifecycle) || ($.eventName = DeleteBucketReplication)) }"
      MetricTransformations:
        - MetricValue: 1
          MetricNamespace: CloudTrailMetrics
          MetricName: S3BucketActivityEventCount

  S3BucketChangeAlarm:
    Condition: EnableCIS
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: s3_changes
      AlarmDescription: A CloudWatch Alarm that triggers when changes are made to an S3 Bucket.
      MetricName: S3BucketActivityEventCount
      Namespace: CloudTrailMetrics
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref CISTopic
      TreatMissingData: notBreaching

  InternetGatewayChangeCountFilter:
    Condition: EnableCIS
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudTrailCloudWatchLogGroup
      FilterPattern: "{ ($.eventName = CreateCustomerGateway) || ($.eventName = DeleteCustomerGateway) || ($.eventName = AttachInternetGateway) || ($.eventName = CreateInternetGateway) || ($.eventName = DeleteInternetGateway) || ($.eventName = DetachInternetGateway) }"
      MetricTransformations:
        - MetricValue: 1
          MetricNamespace: CloudTrailMetrics
          MetricName: GatewayEventCount
  
  InternetGatewayChangeAlarm:
    Condition: EnableCIS
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: igw_changes
      AlarmDescription: A CloudWatch Alarm that triggers when changes are made to an Internet Gateway in a VPC.
      MetricName: GatewayEventCount
      Namespace: CloudTrailMetrics
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref CISTopic
      TreatMissingData: notBreaching

  VpcRouteTableEventCountFilter:
    Condition: EnableCIS
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudTrailCloudWatchLogGroup
      FilterPattern: "{ ($.eventName = AssociateRouteTable) || ($.eventName = CreateRoute) || ($.eventName = CreateRouteTable) || ($.eventName = DeleteRoute) || ($.eventName = DeleteRouteTable) || ($.eventName = ReplaceRoute) || ($.eventName = ReplaceRouteTableAssociation) || ($.eventName = DisassociateRouteTable) }"
      MetricTransformations:
        - MetricValue: 1
          MetricNamespace: CloudTrailMetrics
          MetricName: VpcRouteTableEventCount
          
  VpcRouteTableChangeAlarm:
    Condition: EnableCIS
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vpc_routetable_changes
      AlarmDescription: A CloudWatch Alarm that triggers when changes are made to a VPC's Route Table.
      MetricName: VpcRouteTableEventCount
      Namespace: CloudTrailMetrics
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref CISTopic
      TreatMissingData: notBreaching

  VPCEventCountFilter:
    Condition: EnableCIS
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudTrailCloudWatchLogGroup
      FilterPattern: "{ ($.eventName = CreateVpc) || ($.eventName = DeleteVpc) || ($.eventName = ModifyVpcAttribute) || ($.eventName = AcceptVpcPeeringConnection) || ($.eventName = CreateVpcPeeringConnection) || ($.eventName = DeleteVpcPeeringConnection) || ($.eventName = RejectVpcPeeringConnection) || ($.eventName = AttachClassicLinkVpc) || ($.eventName = DetachClassicLinkVpc) || ($.eventName = DisableVpcClassicLink) || ($.eventName = EnableVpcClassicLink) }"
      MetricTransformations:
        - MetricValue: 1
          MetricNamespace: CloudTrailMetrics
          MetricName: VpcEventCount

  VpcEventCountAlarm:
    Condition: EnableCIS
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vpc_changes
