  AWSConfigAggregator:
    Type: AWS::Config::ConfigurationAggregator
    Properties:
      AccountAggregationSources:
        - AccountIds:
            - !Ref 'AWS::AccountId'
          AllAwsRegions: true
      ConfigurationAggregatorName: !Join ['-', [!Ref OrgName, aws, config, aggregator]]

  CISTopic:
    Condition: EnableCIS
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'cis-topic-${AWS::AccountId}'
      DisplayName: CIS Notification Topic
      KmsMasterKeyId: !Ref SNSKmsKey

  CISEmailSubscription:
    Condition: SendCISEmail
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !Ref CISAlertEmail
      Protocol: email
      TopicArn: !Ref CISTopic

