    Properties:
      ConfigRuleName: ec2_iam_instance_roles
      Scope:
        ComplianceResourceTypes:
          - AWS::EC2::Instance
      Description: A config rule to help you ensure IAM instance roles are used for AWS resource access from instances.
      Source:
        Owner: CUSTOM_LAMBDA
        SourceIdentifier:
          Fn::GetAtt:
            - LambdaFunctionForEC2InstancesConfigRule
            - Arn
        SourceDetails:
          - EventSource: aws.config
            MessageType: ConfigurationItemChangeNotification
          - EventSource: aws.config
            MessageType: OversizedConfigurationItemChangeNotification
    DependsOn: LambdaInvokePermissionsIAMRoleForEC2InstancesConfigRule
  
  LambdaInvokePermissionsIAMRoleForEC2InstancesConfigRule:
    Condition: EnableConfig
    DependsOn: ConfigRecorder
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::GetAtt:
          - LambdaFunctionForEC2InstancesConfigRule
          - Arn
      Action: lambda:InvokeFunction
      Principal: config.amazonaws.com
  
  LambdaFunctionForEC2InstancesConfigRule:
    Condition: EnableConfig
    DependsOn: ConfigRecorder
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: LambdaForEC2_IAM_instance_roles
      Handler: index.lambda_handler
      Role:
        Fn::GetAtt:
          - LambdaIamRoleForIAMRolesForEC2InstancesConfigRule
          - Arn
      Runtime: python3.8
      Code:
        ZipFile: |
          import boto3
          import json
          def evaluate_compliance(config_item, instance_id):
              if (config_item['resourceType'] != 'AWS::EC2::Instance'): 
                  return 'NOT_APPLICABLE'
              if (config_item['configurationItemStatus'] == 'ResourceDeleted'): 
                  return 'NOT_APPLICABLE'
              reservations = boto3.client('ec2').describe_instances(InstanceIds=[instance_id])['Reservations']
              if ((reservations[0]['Instances'][0]['State']['Name']).upper() == 'TERMINATED'):
                  return 'NOT_APPLICABLE'
              if (reservations and 'IamInstanceProfile' in reservations[0]['Instances'][0]): 
                  return 'COMPLIANT'
              else: 
                  return 'NON_COMPLIANT'

          def lambda_handler(event, context):
            invoking_event = json.loads(event['invokingEvent'])
            compliance_value = 'NOT_APPLICABLE'
            instance_id = invoking_event['configurationItem']['resourceId']
            compliance_value = evaluate_compliance(invoking_event['configurationItem'], instance_id)
            config = boto3.client('config')
            response = config.put_evaluations(
                Evaluations=[
                  {
                    'ComplianceResourceType': invoking_event['configurationItem']['resourceType'],
                    'ComplianceResourceId': instance_id,
                    'ComplianceType': compliance_value,
                    'OrderingTimestamp': invoking_event['configurationItem']['configurationItemCaptureTime']
                  },
                ],
                ResultToken=event['resultToken']
            )

      Timeout: 300
    DependsOn: LambdaIamRoleForIAMRolesForEC2InstancesConfigRule
  
  LambdaIamRoleForIAMRolesForEC2InstancesConfigRule:
    Condition: EnableConfig
    DependsOn: ConfigRecorder
    Type: AWS::IAM::Role
    Properties:
      RoleName: IAMRoleForEC2_IAM_instance_roles
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/IAMReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
        - arn:aws:iam::aws:policy/service-role/AWSConfigRulesExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies: []
  
