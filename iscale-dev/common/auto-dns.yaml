AWSTemplateFormatVersion: 2010-09-09
Description: This cloudformation template provisions resources for sonarqube

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Route53 Configuration
        Parameters:
          - RecordFQDN
          - RecordTTL
          - RecordType
          - EC2InstanceId
      - Label:
          default: Stack Configuration
        Parameters:
          - HostedZoneStackName

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      HostedZoneStackName:
        default: Hosted Zone stack name
      RecordFQDN:
        default: FQDN entry to associate
      RecordTTL:
        default: Route53 Record TTL
      RecordType:
        default: Route53 Record Type

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    Default: sonarqube
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Development
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  EC2InstanceId:
    Description: EC2 instance ID to track
    Type: String
    MinLength: 12
  HostedZoneStackName:
    Description: Name of the HostedZone Stack Name
    Type: String
    MinLength: 1
  RecordFQDN:
    Description: Name of the FQDB record to keep up to date (e.g foo.example.com)
    Type: String
    MinLength: 4
  RecordTTL:
    Description: Value of the record TTL
    Type: String
    Default: 300
  RecordType:
    Description: Value of the record Type
    Type: String
    Default: A

Resources:

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Path: "/"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: 
              - sts:AssumeRole
      Policies:
        - PolicyName: AllowDNSUpdate
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: 
                  - route53:ChangeResourceRecordSets
                Resource: !Join 
                  - '/'
                  - - 'arn:aws:route53:::hostedzone'
                    - !ImportValue 
                        'Fn::Sub': '${HostedZoneStackName}-HostedZoneId'
              - Effect: Allow
                Action: 
                  - ec2:DescribeInstances
                Resource: '*' #cannot filter by resource level
        - PolicyName: AllowLogCreation
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: 
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:CreateLogGroup
                Resource: !Join [':', [arn:aws:logs, !Ref 'AWS::Region', !Ref 'AWS::AccountId', log-group, '*']]

  UpateDnsLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Lambda Function updating the DNS recordset each time an instance starts
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn 
      Runtime: python3.6
      Timeout: 60
      Environment:
        Variables:
          ZONE_ID: !ImportValue
            'Fn::Sub': '${HostedZoneStackName}-HostedZoneId'
          NAMES: !Ref RecordFQDN #this could be a comma separated list
          TYPE: !Ref RecordType
          INSTANCE_IDS: !Ref EC2InstanceId
          REGION: !Ref 'AWS::Region'
          TTL: !Ref RecordTTL
      Code:
        ZipFile: |

          import boto3
          import logging
          import os
          import json

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
            zone_id=os.environ['ZONE_ID']
            names=os.environ['NAMES']
            type=os.environ['TYPE']
            instance_ids=os.environ['INSTANCE_IDS']
            region=os.environ['REGION']
            ttl=int(os.environ['TTL'])

            rt = boto3.client('route53')
            ec2 = boto3.client('ec2',region_name=region)

            try:

              logger.info('Event:' + json.dumps(event))
              logger.info("Updating record set")

              # Retrieve the new public ip address
              record_names=names.split(",")
              for name in record_names:
                instance = ec2.describe_instances(InstanceIds=[instance_ids])
                public_ip = instance['Reservations'][0]['Instances'][0]['PublicIpAddress']
                logger.info("Updating DNS entry to " + public_ip)

                response = rt.change_resource_record_sets(
                            HostedZoneId=zone_id,
                            ChangeBatch={
                                'Changes': [
                                    {
                                      'Action': 'UPSERT',
                                      'ResourceRecordSet': {
                                          'Name': name,
                                          'Type': type,
                                          'TTL': ttl,
                                          'ResourceRecords': [
                                              {
                                                  'Value': public_ip
                                              },
                                            ]
                                        } 
                                    },
                                  ]
                              }
                            )

            except Exception:
              logger.exception('Failed to update DNS entry. Error Encountered')

  DnsEventRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Event rule each time an EC2 instance starts
      EventPattern: 
        source: 
          - aws.ec2
        detail-type: 
          - EC2 Instance State-change Notification
        detail: 
          state: 
            - running
          instance-id: 
            - !Ref EC2InstanceId
      State: ENABLED
      Targets:
      - Arn: !GetAtt UpateDnsLambdaFunction.Arn
        Id: !Ref EC2InstanceId

  PermissionForEventsToInvokeUpdateDNSLambda:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpateDnsLambdaFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DnsEventRule.Arn

Outputs:

  HostedZoneId:
    Description: Hosted Zone ID for the domain
    Value: !ImportValue 
      'Fn::Sub': '${HostedZoneStackName}-HostedZoneId'

  HostedZoneDomainName:
    Description: Domain Name for the hosted zone
    Value: !ImportValue 
      'Fn::Sub': '${HostedZoneStackName}-HostedZoneDomainName'
  
  RecordFQDN:
    Description: FQDN to update
    Value: !Ref RecordFQDN