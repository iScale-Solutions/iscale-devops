AWSTemplateFormatVersion: 2010-09-09
Description: This cloudformation configuration provisions an RDS instance with monitoring, replication, backups, HA and DR capabilities

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Database Configuration
        Parameters:
          - MultiAz
          - MasterUser
          - MasterUserPassword
          - DatabaseName
          - DatabaseUser
          - DatabaseUserPassword
          - DeletionProtection
          - Domain
          - ParameterGroup
          - Port
          - StorageEncrypted
          - InstanceType
          - EnablePerformanceInsights
          - Engine
          - EngineVersion
          - AllocatedStorage
          - BackupRetentionPeriod
          - BackupWindow
          - OptionGroupName
          - SnapshotIdentifier
          - SourceDbInstanceIdentifier
          - AutoMinorVersionUpgrade
          - Family
          - MonitoringInterval
          - EnableEnhancedMonitoring
      - Label:
          default: CloudWatch Configuration
        Parameters:
          - LogRetentionPeriod
      - Label:
          default: Cloudformation Stack Configuration
        Parameters:
          - SNSStackName
          - ExportStackValues
      - Label:
          default: Network Configuration
        Parameters:
          - NetworkStackName
          - NetworkType
          - PubliclyAccessible

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      MultiAz:
        default: Multi AZ
      MasterUser:
        default: Root Username
      MasterUserPassword:
        default: Root User Password (leave blank to auto-generate)
      DatabaseName:
        default: Database Name
      DatabaseUser:
        default: Database Username
      DatabaseUserPassword:
        default: Database User Password (leave blank to auto-generate)
      DeletionProtection:
        default: Set to true to protect DB instance or cluster from deletion
      Domain:
        default: Name of the AD domain to link to the DB (SQLServer only - optional)
      Port:
        default: Port
      StorageEncrypted:
        default: Storage Encrypted
      InstanceType:
        default: RDS Instance Type
      EnablePerformanceInsights:
        default: Enable Performance Insights
      Engine:
        default: Engine
      EngineVersion:
        default: Engine Version
      ExportStackValues:
        default: Export output values from the stack
      AllocatedStorage:
        default: Allocated Storage
      BackupRetentionPeriod:
        default: Backup Retention Period
      BackupWindow:
        default: Backup Window
      OptionGroupName:
        default: Option Group Name
      SnapshotIdentifier:
        default: Snapshot Identifier
      SourceDbInstanceIdentifier:
        default: Source Database Instance Identifier
      AutoMinorVersionUpgrade:
        default: Auto-Minor Version Upgrade
      Family:
        default: Family
      MonitoringInterval:
        default: Monitoring Interval
      ParameterGroup:
        default: Parameter Group
      EnableEnhancedMonitoring:
        default: Enable Enhanced Monitoring
      LogRetentionPeriod:
        default: Log Retention Period
      NetworkStackName:
        default: Network Stack
      NetworkType:
        default: Network Type
      PubliclyAccessible:
        default: Publicly Accessible
      SNSStackName:
        default: SNS Stack

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 8
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  DeletionProtection:
    Description: Set to true to protect from deletion
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  Domain:
    Description: Windows Auth AD domain
    Type: String
    Default: ''
  ExportStackValues:
    Description: Set to true to export
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  EnablePerformanceInsights:
    Description: Set to true to enabled performance Insights
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  MultiAz:
    Description: Set to true if MultiAZ is enabled. Otherwise, disabled.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  MasterUser:
    Description: The name of the master user for the database instance.
    Type: String
    Default: root
  MasterUserPassword:
    Description: Master User Password
    NoEcho: true
    Type: String
    Default: ''
  DatabaseName:
    Description: The name of the database
    Type: String
    Default: clientdb
  DatabaseUser:
    Description: The name of the database user
    Type: String
    Default: dbuser
  DatabaseUserPassword:
    Description: The password of the database user
    NoEcho: true
    Type: String
    Default: ''
  ParameterGroup:
    Description: (optional) custom parameter group name
    Type: String
    Default: ''
  Port:
    Description: The port number on which the database accepts connections.
    Type: Number
    Default: 3306
    MinValue: 1
    MaxValue: 65535
  OptionGroupName:
    Description: Optional - Option Group Name. Leave blank for default
    Type: String
    Default: ''
  StorageEncrypted:
    Description: Set to true if DB instance encryption is enabled. Otherwise, disabeld.
    Type: String
    Default: true
    AllowedValues:
      - true
      - false
  InstanceType:
    Description: The compute and memory capacity of the DB instance, for example, db.m4.large.
    Type: String
    Default: db.t3.micro
  Engine:
    Description: The name of the database engine that you want to use for this DB instance.
    Type: String
    Default: aurora-mysql
    AllowedValues:
      - aurora-mysql
      - aurora-postgresql
      - mysql
      - oracle-se2
      - sqlserver-web
      - sqlserver-se
  EngineVersion:
    Description: The version number of the database engine to use.
    Type: String
    Default: 12.2
  AllocatedStorage:
    Description: The amount of storage (in gigabytes) to allocate for the DB instance.
    Type: Number
    Default: 20
    MinValue: 20
  BackupRetentionPeriod:
    Description: The number of days for which automated backups are retained. Setting this parameter to a positive number enables backups. Setting this parameter to 0 disables automated backups.
    Default: 30
    Type: Number
    MinValue: 0
    MaxValue: 35
  BackupWindow:
    Description: The daily time range during which automated backups are created if automated backups are enabled using the BackupRetentionPeriod parameter.
    Type: String
    Default: ''
    ConstraintDescription: Must be in the format hh24:mi-hh24:mi. Must be in Universal Coordinated Time (UTC). Must not conflict with the preferred maintenance window. Must be at least 30 minutes.
  SnapshotIdentifier:
    Description: The name or Amazon Resource Name (ARN) of the DB snapshot to restore. If you specied root user, make sure it matches
    Type: String
    Default: ''
  SourceDbInstanceIdentifier:
    Description: If you want to create a Read Replica DB instance, specify the ID of the source DB instance.
    Type: String
    Default: ''
  AutoMinorVersionUpgrade:
    Description: Set to true to automatically apply minor engine upgrades.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  Family:
    Description: The DB parameter group family name
    Type: String
    Default: postgres12
  MonitoringInterval:
    Description: The interval, in seconds, between points when Enhanced Monitoring metrics are collected for the DB instance
    Type: Number
    Default: 30
  EnableEnhancedMonitoring:
    Description: Set to true if enahanced monitoring is enabled. Otherwise, disabled.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  LogRetentionPeriod:
    Description: The number of days to retain the log events in the specified log group
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]
  NetworkStackName:
    Description: The name of the cloudformation Network stack
    Type: String
    Default: iscale-dev-dev-uw2-network
  NetworkType:
    Description: Type of network to use
    Type: String
    Default: Internal
    AllowedValues:
      - Public
      - Internal
      - Private
  PubliclyAccessible:
    Description: Make the instance publicly accessible (only works when in Public Network)
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  SNSStackName:
    Description: The name of the cloudformation SNS stack
    Type: String
    Default: iscale-dev-dev-uw2-sns

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  IsAuroraPostgreSQL: !Equals [!Ref Engine, aurora-postgresql]
  IsAuroraMySQL: !Equals [!Ref Engine, aurora-mysql]
  IsSQLServer: !Or [!Equals [!Ref Engine, sqlserver-web], !Equals [!Ref Engine, sqlserver-se]]
  IsNotSQLServer: !Not [Condition: IsSQLServer]
  IsProdAndNotSQLServer: !And [Condition: IsProd, Condition: IsNotSQLServer]
  IsSQLServerWithDomain: !And [Condition: IsSQLServer, Condition: HasDomain]
  HasExports: !Equals [!Ref ExportStackValues, true]
  HasNoExports: !Not [Condition: HasExports]
  IsAurora: !Or [Condition: IsAuroraPostgreSQL, Condition: IsAuroraMySQL]
  IsOracle: !Equals [!Ref Engine, oracle-se2]
  HasDBUserPassword: !Not [!Equals [!Ref DatabaseUserPassword, '']]
  HasDBRootPassword: !Not [!Equals [!Ref MasterUserPassword, '']]
  HasDBPasswords: !Or [Condition: HasDBUserPassword, Condition: HasDBRootPassword]
  HasDomain: !Not [!Equals [!Ref Domain, '']]
  HasNoCluster: !Not [Condition: IsAurora]
  HasNoClusterHasExports: !And [Condition: HasNoCluster, Condition: HasExports]
  HasNoClusterHasNoExports: !And [Condition: HasNoCluster, Condition: HasNoExports]
  HasCluster: !Not [Condition: HasNoCluster]
  HasClusterHasExports: !And [Condition: HasCluster, Condition: HasExports]
  HasClusterHasNoExports: !And [Condition: HasCluster, Condition: HasNoExports]
  HasSnapshot: !Not [!Equals [!Ref SnapshotIdentifier, '']]
  HasNoSnapshot: !Not [Condition: HasSnapshot]
  HasClusterSnapshot: !And [Condition: HasCluster, Condition: HasSnapshot]
  HasClusterAndClusterSnapshot: !And [Condition: HasCluster, Condition: HasClusterSnapshot]
  HasExternalParameterGroup: !Not [!Equals [!Ref ParameterGroup, '']]
  HasNoExternalParameterGroup: !Not [Condition: HasExternalParameterGroup]
  HasOptionGroupName: !Not [!Equals [!Ref OptionGroupName, '']]
  HasPerformanceInsights: !Equals [!Ref EnablePerformanceInsights, true]
  HasSnapshotAndNoCluster: !And [Condition: HasSnapshot, Condition: HasNoCluster]
  HasNoSnapshotAndNoCluster: !And [Condition: HasNoSnapshot, Condition: HasNoCluster]
  HasSourceDbInstanceIdentifier: !Not [!Equals [!Ref SourceDbInstanceIdentifier, '']]
  HasBackupWindow: !Not [!Equals [!Ref BackupWindow, '']]
  IsEncrypted: !Equals [!Ref StorageEncrypted, true]
  IsEnableEnhancedMonitoring: !Equals [!Ref EnableEnhancedMonitoring, true]
  IsPublicNetwork: !Equals [!Ref NetworkType, Public]

Resources:

####
# Lambda Section
####

  RDSPasswordGenerator:
    Type: Custom::RDSPasswordGenerator
    Properties:
      ServiceToken: !GetAtt LambdaPasswordGeneratorFunction.Arn

  LambdaPasswordGeneratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.lambda_handler
      Role: !GetAtt LambdaPasswordGeneratorExecutionRole.Arn
      Runtime: python3.9
      Timeout: 60
      Code:
        ZipFile: |

          import cfnresponse
          import json
          import logging
          import time
          import base64
          import string
          import random

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):

            responseData={}
            physicalResourceId={}
            request_type = event['RequestType']

            try:

              if request_type in ['Create', 'Update']:
                responseData['DatabasePassword']=generate_random_password(20)
                responseData['DatabaseRootPassword']=generate_random_password(20)
                responseData['MagentoAdminPassword']=generate_random_password(20)

              send(event, context, cfnresponse.SUCCESS, responseData, physicalResourceId)
              return

            except Exception:

              logger.exception('Error Encountered')
              send(event, context, cfnresponse.FAILED, responseData, physicalResourceId)
              return

          def send(event, context, responseStatus, responseData, physicalResourceId=None):
            resourceId = physicalResourceId or context.log_stream_name
            responseBody = {'Status': responseStatus,
                            'Reason': 'See the details in CloudWatch Log Stream: ' + context.log_stream_name,
                            'PhysicalResourceId': resourceId,
                            'StackId': event['StackId'],
                            'RequestId': event['RequestId'],
                            'LogicalResourceId': event['LogicalResourceId'],
                            'Data': responseData}
            logger.info('RESPONSE BODY:' + json.dumps(responseBody))
            cfnresponse.send(event, context, responseStatus, responseData, resourceId)

          def generate_random_password(password_length=20):
            """
            Generates a random password sent back to CF
            :param password_length: Length of the password in number of characters
            :return: String of the password
            """
            password = ''
            char_set = string.ascii_uppercase + string.ascii_lowercase + string.digits + '-'
            while '-' not in password:
                password = ''.join(random.sample(char_set * 6, int(password_length)))

            return password

####
# RDS Section
####

  RDSSecretManager:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      GenerateSecretString:
        SecretStringTemplate: !Sub
          - |
            {
              "DB_ROOT_USER": "${DB_ROOT_USER}",
              "DB_ROOT_PASSWORD": "${DB_ROOT_PASSWORD}",
              "DB_NAME": "${DB_NAME}",
              "DB_USER": "${DB_USER}",
              "DB_PASSWORD": "${DB_PASSWORD}",
              "MAGENTO_ADMIN_PASSWORD": "${MAGENTO_ADMIN_PASSWORD}"
            }
          - DB_ROOT_USER: !Ref MasterUser
            DB_ROOT_PASSWORD: !If [HasDBRootPassword, !Ref MasterUserPassword, !GetAtt RDSPasswordGenerator.DatabaseRootPassword]
            DB_NAME: !Ref DatabaseName
            DB_USER: !Ref DatabaseUser
            DB_PASSWORD: !If [HasDBUserPassword, !Ref DatabaseUserPassword, !GetAtt RDSPasswordGenerator.DatabasePassword]
            MAGENTO_ADMIN_PASSWORD: !GetAtt RDSPasswordGenerator.MagentoAdminPassword
        GenerateStringKey: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        PasswordLength: 30
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      DBSubnetGroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      SubnetIds: !If
        - IsPublicNetwork
        - - Fn::ImportValue:
              !Sub '${NetworkStackName}-PublicSubnetId1'
          - Fn::ImportValue:
              !Sub '${NetworkStackName}-PublicSubnetId2'
        - - Fn::ImportValue:
              !Sub '${NetworkStackName}-InternalSubnetId1'
          - Fn::ImportValue:
              !Sub '${NetworkStackName}-InternalSubnetId2'
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  RDSParameterGroup:
    Condition: HasNoExternalParameterGroup
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Family: !Ref Family
      Parameters: !If
        - IsAuroraPostgreSQL
        - log_connections: 1
        - !If
          - IsSQLServer
          - default trace enabled: 1
          - !If
            - IsOracle
            - archive_lag_target: 300
            - sql_mode: IGNORE_SPACE #MySQL
              slow_query_log: 1
              long_query_time: 2
              log_bin_trust_function_creators: 1
              log_output: FILE
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
  
  OracleParameterGroup:
    Condition: IsOracle
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Family: !Ref Family
      Parameters:
        archive_lag_target: 300
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  AuroraMySQLDBParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Condition: IsAuroraMySQL
    Properties:
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Family: !Ref Family
      Parameters: 
        sql_mode: IGNORE_SPACE
        log_bin_trust_function_creators: 1
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
  
  RDSCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    DependsOn:
      - RDSIamRole
      - DBSubnetGroup
    Condition: HasCluster
    Properties:
      BackupRetentionPeriod: !Ref BackupRetentionPeriod
      DatabaseName: !Ref DatabaseName
      DBClusterIdentifier: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, cluster]]
      DBClusterParameterGroupName: !If
        - IsAuroraMySQL
        - !Ref AuroraMySQLClusterParameterGroup
        - !Ref AuroraPostgreSQLClusterParameterGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      DeletionProtection: !Ref DeletionProtection
      EnableCloudwatchLogsExports:
        !If [IsAuroraMySQL, [audit, error, slowquery], [postgresql]]
      Engine: !Ref Engine
      EngineVersion: !Ref EngineVersion
      MasterUsername: !If [HasClusterSnapshot, !Ref 'AWS::NoValue', !Ref MasterUser]
      MasterUserPassword: !If 
        - HasClusterSnapshot 
        - !Ref 'AWS::NoValue'
        - !If
          - HasDBRootPassword
          - !Ref MasterUserPassword
          - !GetAtt RDSPasswordGenerator.DatabaseRootPassword
      Port: !Ref Port
      PreferredBackupWindow: !If [ HasBackupWindow, !Ref BackupWindow, !Ref 'AWS::NoValue']
      SnapshotIdentifier: !If [HasClusterSnapshot, !Ref SnapshotIdentifier, !Ref 'AWS::NoValue']
      StorageEncrypted: !If [HasClusterSnapshot, !Ref 'AWS::NoValue', !Ref StorageEncrypted]
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      VpcSecurityGroupIds:
        - !GetAtt RDSSecurityGroup.GroupId

  AuroraMySQLClusterParameterGroup:
    Type: AWS::RDS::DBClusterParameterGroup
    Condition: IsAuroraMySQL
    Properties: 
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Family: !Ref Family
      Parameters: 
        character_set_database: utf32
        sql_mode: IGNORE_SPACE
        log_bin_trust_function_creators: 1
    
  AuroraPostgreSQLClusterParameterGroup:
    Type: AWS::RDS::DBClusterParameterGroup
    Condition: IsAuroraPostgreSQL
    Properties: 
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Family: !Ref Family
      Parameters: 
        client_encoding: UTF8

  DBInstance:
    Type: AWS::RDS::DBInstance
    DependsOn:
      - RDSLogGroup
      - UpgradeLogGroup
      - RDSIamRole
    Properties:
      AllocatedStorage: !If [IsAurora, !Ref 'AWS::NoValue', !Ref AllocatedStorage]
      BackupRetentionPeriod:
        Fn::If:
          - HasNoCluster
          - !Ref BackupRetentionPeriod
          - !Ref 'AWS::NoValue'
      DBInstanceClass: !Ref InstanceType
      AutoMinorVersionUpgrade: !Ref AutoMinorVersionUpgrade
      DBClusterIdentifier: !If [HasCluster, !Ref RDSCluster, !Ref 'AWS::NoValue']
      DBInstanceIdentifier: #only give a name when no cluster. Cluster has a user friendly name
        Fn::If:
          - HasNoCluster
          - !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
          - !Ref 'AWS::NoValue'
      DBName: !If [IsSQLServer, !Ref 'AWS::NoValue', !If [HasNoCluster, !Ref DatabaseName, !Ref 'AWS::NoValue']]
      DBParameterGroupName: !If
        - HasExternalParameterGroup
        - !Ref ParameterGroup
        - !If 
          - IsAuroraMySQL
          - !Ref AuroraMySQLDBParameterGroup
          - !Ref RDSParameterGroup
      DBSnapshotIdentifier: !If [HasSnapshotAndNoCluster, !Ref SnapshotIdentifier, !Ref 'AWS::NoValue']
      DBSubnetGroupName: !Ref DBSubnetGroup
      Domain: !If [IsSQLServerWithDomain, !Ref Domain, !Ref 'AWS::NoValue']
      DomainIAMRoleName: !If [IsSQLServerWithDomain, !Ref RDSDirectoryServiceAccessRole, !Ref 'AWS::NoValue']
      DeletionProtection: !If [HasNoCluster, !Ref DeletionProtection, !Ref 'AWS::NoValue']
      EnablePerformanceInsights: !Ref EnablePerformanceInsights
      PerformanceInsightsRetentionPeriod: !If [HasPerformanceInsights, 731, !Ref 'AWS::NoValue']
      Engine: !Ref Engine
      EngineVersion: !If [HasNoCluster, !Ref EngineVersion, !Ref 'AWS::NoValue']
      LicenseModel: !If [IsOracle, license-included, !If [IsSQLServer, license-included, !Ref 'AWS::NoValue']] 
      MasterUsername: !If [HasNoCluster, !Ref MasterUser, !Ref 'AWS::NoValue']
      MasterUserPassword: !If
        - HasNoSnapshotAndNoCluster
        - !If
          - HasDBRootPassword
          - !Ref MasterUserPassword
          - !GetAtt RDSPasswordGenerator.DatabaseRootPassword
        - !Ref 'AWS::NoValue'
      OptionGroupName: !If [HasOptionGroupName, !Ref OptionGroupName, !Ref 'AWS::NoValue']
      StorageEncrypted: !If [HasNoCluster, !Ref StorageEncrypted, !Ref 'AWS::NoValue']
      StorageType: !If [HasNoCluster, gp2, !Ref 'AWS::NoValue']
      MonitoringRoleArn: !If [IsEnableEnhancedMonitoring, !GetAtt RDSIamRole.Arn, !Ref 'AWS::NoValue']
      MonitoringInterval: !If [IsEnableEnhancedMonitoring, !Ref MonitoringInterval, !Ref 'AWS::NoValue']
      MultiAZ: !Ref MultiAz
      Port: !If [HasNoCluster, !Ref Port, !Ref 'AWS::NoValue']
      PubliclyAccessible: !If [IsPublicNetwork, !Ref PubliclyAccessible, false]
      SourceDBInstanceIdentifier: !If [ HasSourceDbInstanceIdentifier, !Ref SourceDbInstanceIdentifier, !Ref 'AWS::NoValue']
      VPCSecurityGroups: 
        Fn::If:
            - HasNoCluster
            - - !GetAtt RDSSecurityGroup.GroupId
            - !Ref 'AWS::NoValue'
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  RDSEventSubscription:
    Type: AWS::RDS::EventSubscription
    Properties:
      Enabled: true
      EventCategories:
        - availability
        - configuration change
        - creation
        - deletion
        - failover
        - low storage
        - maintenance
        - notification
        - read replica
        - recovery
        - restoration
      SnsTopicArn:
        Fn::ImportValue:
          !Sub '${SNSStackName}-TopicArn'
      SourceIds:
        - !Ref DBInstance
      SourceType: db-instance

####
# VPC Section
####

  #By default, no inbound connection are allowed. The caller (AppServer / Lambda) will need to add itself to the allowed callers list.
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [ '-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], db] ]
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

####
# IAM Section
####

  RDSIamRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: monitoring.rds.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole

  LambdaPasswordGeneratorExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: LambdaPasswordGeneratorFunctionPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:CreateLogGroup
                  - logs:DescribeLogStream
                  - logs:PutLogEvents
                Resource: 'arn:aws:logs:*:*:*'

  RDSDirectoryServiceAccessRole:
    Type: AWS::IAM::Role
    Condition: IsSQLServerWithDomain
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: rds.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSDirectoryServiceAccess

####
# CloudWatch Section
####

  # Database log / metrics / alarms

  RDSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !If [IsProd, 365, !Ref LogRetentionPeriod]
      LogGroupName: !Join [ '/', [/aws/rds/instance, !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]]]

  # Error Denied
  ErrorDeniedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref RDSLogGroup
      FilterPattern: "[timestamp, id, message=\"*password authentication failed*\"]"
      MetricTransformations:
        - MetricValue: 1
          MetricNamespace: LogMetrics
          MetricName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], error-denied]]

  ErrorDeniedCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], db-error-denied]]
      MetricName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], error-denied]]
      Namespace: LogMetrics
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Sum
      Threshold: 0
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      TreatMissingData: notBreaching

  # Fatal Errors
  FatalMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref RDSLogGroup
      FilterPattern: "[time, id, message_type=\"*FATAL*\"]"
      MetricTransformations:
        - MetricValue: 1
          MetricNamespace: LogMetrics
          MetricName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], fatal]]

  # Error Errors
  ErrorsMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: IsProd
    Properties:
      LogGroupName: !Ref RDSLogGroup
      FilterPattern: "[time, id, message_type=\"*ERROR*\"]"
      MetricTransformations:
        - MetricValue: 1
          MetricNamespace: LogMetrics
          MetricName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], errors]]

  ErrorsCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], db-errors]]
      MetricName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], error]]
      Namespace: LogMetrics
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Sum
      Threshold: 0
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      TreatMissingData: notBreaching

  # Error Warnings
  WarningsMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: IsProd
    Properties:
      LogGroupName: !Ref RDSLogGroup
      FilterPattern: "[time, id, message_type=\"*WARNING*\"]"
      MetricTransformations:
        - MetricValue: 1
          MetricNamespace: LogMetrics
          MetricName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], warnings]]

    # Upgrade log
  UpgradeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !If [IsProd, 365, !Ref LogRetentionPeriod]
      LogGroupName: !Join [ '/', [/aws/rds/instance, !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], upgrade]]

  # Standard metrics/alarms
  FreeStorageCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], db-free-storage-space]]
      MetricName: !If [IsAurora, FreeLocalStorage, FreeStorageSpace]
      Namespace: AWS/RDS
      ComparisonOperator: LessThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Average
      Threshold: 5368709120 # 5GB
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: !If [IsAurora, DBClusterIdentifier, DBInstanceIdentifier]
          Value: !If [IsAurora, !Ref RDSCluster, !Ref DBInstance]

  CPUUtilizationCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], db-cpu-utilization]]
      MetricName: CPUUtilization
      Namespace: AWS/RDS
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DBInstance

  CPUCreditBalanceCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProdAndNotSQLServer
    Properties:
      AlarmName: !Join ['-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], db-cpu-credit-balance]]
      MetricName: CPUCreditBalance
      Namespace: AWS/RDS
      ComparisonOperator: LessThanThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Minimum
      Threshold: 25 #Below 25
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DBInstance

Outputs:

  CPUCreditBalanceAlarm:
    Condition: IsProdAndNotSQLServer
    Value: DB CPU Credit Balance Alarm
    Value: !GetAtt CPUCreditBalanceCloudWatchAlarm.Arn

  DBErrorsAlarm:
    Condition: IsProd
    Value: DB Errors Alarm
    Value: !GetAtt ErrorsCloudWatchAlarm.Arn
  
  DBErrorDeniedAlarm:
    Condition: IsProd
    Value: DB Access Denied Alarm
    Value: !GetAtt ErrorDeniedCloudWatchAlarm.Arn
  
  DBLowStorageAlarm:
    Condition: IsProd
    Value: DB low storage alarm
    Value: !GetAtt FreeStorageCloudWatchAlarm.Arn

  DBHighCPUAlarm:
    Condition: IsProd
    Value: DB High CPU Alarm
    Value: !GetAtt CPUUtilizationCloudWatchAlarm.Arn

  DBSecretManagerExport:
    Condition: HasExports
    Description: Secrets Manager containing the DB credentials
    Value: !Ref RDSSecretManager
    Export:
      Name: !Sub ${AWS::StackName}-DBInstanceARN

  DBSecretManager:
    Condition: HasNoExports
    Description: Secrets Manager containing the DB credentials
    Value: !Ref RDSSecretManager

  DBSecretManagerKeyIdExport:
    Condition: HasExports
    Description: Value of the key containing the passwords in the Secret Manager
    Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
    Export:
      Name: !Sub ${AWS::StackName}-DBSecretManagerKeyId

  DBSecretManagerKeyId:
    Condition: HasNoExports
    Description: Value of the key containing the passwords in the Secret Manager
    Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  DBClusterARNExport:
    Condition: HasClusterHasExports
    Description: ARN of the created RDS cluster
    Value: !Join [':', ['arn:aws:rds', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'cluster', !Ref RDSCluster]]
    Export:
      Name: !Sub ${AWS::StackName}-DBClusterARN

  DBClusterARN:
    Condition: HasClusterHasNoExports
    Description: ARN of the created RDS cluster
    Value: !Join [':', ['arn:aws:rds', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'cluster', !Ref RDSCluster]]

  DBInstanceARNExport:
    Condition: HasNoClusterHasExports
    Description: ARN of the created RDS instance
    Value: !Join [':', ['arn:aws:rds', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'db', !Ref DBInstance]]
    Export:
      Name: !Sub ${AWS::StackName}-DBInstanceARN

  DBInstanceARN:
    Condition: HasNoClusterHasNoExports
    Description: ARN of the created RDS instance
    Value: !Join [':', ['arn:aws:rds', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'db', !Ref DBInstance]]

  DBInstanceNameExport:
    Condition: HasNoClusterHasExports
    Description: Name of the created RDS instance
    Value: !Ref DBInstance
    Export:
      Name: !Sub ${AWS::StackName}-DBInstanceName

  DBInstanceName:
    Condition: HasNoClusterHasNoExports
    Description: Name of the created RDS instance
    Value: !Ref DBInstance

  SecurityGroupIdExport:
    Condition: HasExports
    Description: The security group id of the RDS instance
    Value: !GetAtt RDSSecurityGroup.GroupId
    Export:
      Name: !Sub ${AWS::StackName}-SecurityGroupId

  SecurityGroupId:
    Condition: HasNoExports
    Description: The security group id of the RDS instance
    Value: !GetAtt RDSSecurityGroup.GroupId

  DBInstanceAddressExport:
    Condition: HasNoClusterHasExports
    Description: The endpoint address of the RDS instance
    Value: !GetAtt DBInstance.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-DBInstanceAddress

  DBInstanceAddress:
    Condition: HasNoClusterHasNoExports
    Description: The endpoint address of the RDS instance
    Value: !GetAtt DBInstance.Endpoint.Address

  DBInstancePortExport:
    Condition: HasNoClusterHasExports
    Description: The port number of the RDS instance
    Value: !Ref Port
    Export:
      Name: !Sub ${AWS::StackName}-DBInstancePort

  DBInstancePort:
    Condition: HasNoClusterHasNoExports
    Description: The port number of the RDS instance
    Value: !Ref Port

  ClusterPortExport:
    Condition: HasClusterHasExports
    Description: The port number of the RDS cluster
    Value: !Ref Port
    Export:
      Name: !Sub ${AWS::StackName}-ClusterPort

  ClusterPort:
    Condition: HasClusterHasNoExports
    Description: The port number of the RDS cluster
    Value: !Ref Port

  ClusterEndpointAddressExport:
    Condition: HasClusterHasExports
    Description: The endpoint address of the RDS cluster
    Value: !GetAtt RDSCluster.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-ClusterEndpointAddress

  ClusterEndpointAddress:
    Condition: HasClusterHasNoExports
    Description: The endpoint address of the RDS cluster
    Value: !GetAtt RDSCluster.Endpoint.Address

  ClusterReadEndpointAddressExport:
    Condition: HasClusterHasExports
    Description: The read endpoint address of the rds cluster
    Value: !GetAtt RDSCluster.ReadEndpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-ClusterReadEndpointAddress

  ClusterReadEndpointAddress:
    Condition: HasClusterHasNoExports
    Description: The read endpoint address of the rds cluster
    Value: !GetAtt RDSCluster.ReadEndpoint.Address