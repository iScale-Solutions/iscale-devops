AWSTemplateFormatVersion: 2010-09-09
Description: Amazon FSx for Windows File Server

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Other Resources Configuration
        Parameters:
          - NetworkStackName
          - SourceSecurityGroup

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      SourceSecurityGroup:
        default: Source Security Group

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 9
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  NetworkStackName:
    Description: The name of the cloudformation Network stack
    Type: String
    Default: ''
  SourceSecurityGroup:
    Description: Security group of source instance
    Type: String
    Default: ''

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml

Resources:

# NFS

  WindowsFSX:
    Type: AWS::FSx::FileSystem
    Properties:
      FileSystemType: OPENZFS
      OpenZFSConfiguration: 
          AutomaticBackupRetentionDays: 30
          DailyAutomaticBackupStartTime: 01:00
          DeploymentType: SINGLE_AZ_1
          ThroughputCapacity: 1024

      SecurityGroupIds:
        - !Ref FSXSecurityGroup
      StorageCapacity: 100
      StorageType: SSD
      SubnetIds: 
        - Fn::ImportValue:
            Fn::Sub: "${NetworkStackName}-PrivateSubnetId1"
      Tags: 
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, fsx]]

  FSXSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      GroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      SecurityGroupIngress:
        # NFS (OpenZFS): rpcbind 111, nfsd 2049, mountd/status/lockd 20001-20003 — tcp + udp
        - { IpProtocol: tcp, FromPort: 111,   ToPort: 111,   SourceSecurityGroupId: !Ref SourceSecurityGroup }
        - { IpProtocol: udp, FromPort: 111,   ToPort: 111,   SourceSecurityGroupId: !Ref SourceSecurityGroup }
        - { IpProtocol: tcp, FromPort: 2049,  ToPort: 2049,  SourceSecurityGroupId: !Ref SourceSecurityGroup }
        - { IpProtocol: udp, FromPort: 2049,  ToPort: 2049,  SourceSecurityGroupId: !Ref SourceSecurityGroup }
        - { IpProtocol: tcp, FromPort: 20001, ToPort: 20003, SourceSecurityGroupId: !Ref SourceSecurityGroup }
        - { IpProtocol: udp, FromPort: 20001, ToPort: 20003, SourceSecurityGroupId: !Ref SourceSecurityGroup }
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp:
            Fn::ImportValue:
              !Sub '${NetworkStackName}-VpcCidrBlock'
      Tags:
        -
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

Outputs:

  WindowsFSX:
    Description: NFS for windows (FSx OpenZFS)
    Value: !Ref WindowsFSX
  
  