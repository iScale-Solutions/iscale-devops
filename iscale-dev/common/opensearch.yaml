AWSTemplateFormatVersion: 2010-09-09
Description: Provisions an OpenSearch instance

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: OpenSearch Configuration
        Parameters:
          - Version
          - InstanceType
          - InstanceCount
          - VolumeType
          - VolumeSize
          - EncryptAtRestEnabled
          - RestActionMultiAllowExplicitIndexEnabled
          - LogPublishingIndexEnabled
          - LogPublishingSearchEnabled
          - LogPublishingApplicationEnabled
      - Label:
          default: CloudWatch Configuration
        Parameters:
          - LogRetentionPeriod
      - Label:
          default: Cloudformation Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      Version:
        default: OpenSearch Version
      InstanceType:
        default: OpenSearch Instance Type
      InstanceCount:
        default: Opensearch number of instance
      VolumeType:
        default: Volume Type
      VolumeSize:
        default: Volume Size
      RestActionMultiAllowExplicitIndexEnabled:
        default: Enable Rest Action Multi Allow Explicti Index
      EncryptAtRestEnabled:
        default: Enable Encrypt at Rest
      LogPublishingIndexEnabled:
        default: Enable Index Log Publishing
      LogPublishingSearchEnabled:
        default: Enable Search Log Publishing
      LogPublishingApplicationEnabled:
        default: Enable Application Log Publishing
      LogRetentionPeriod:
        default: Log Retention Period
      NetworkStackName:
        default: Network Stack Name
      SNSStackName:
        default: SNS Stack Name

Parameters: 
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    Default: opensearch
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
  Version:
    Description: The OpenSearch version
    Type: String
    Default: 6.7
  InstanceType:
    Description: Instance type
    Type: String
    Default: t3.small.search
  InstanceCount:
    Description: Instance Count
    Type: Number
    Default: 1
  VolumeType:
    Description: Values must be [gp2, io1, standard]
    Type: String
    Default: gp2
    AllowedValues:
      - gp2
      - io1
      - standard
  VolumeSize:
    Description: OpenSearch Volume Size
    Type: Number
    Default: 10
  EncryptAtRestEnabled:
    Description: Enables encrypt data at rest.
    Type: String
    Default: TRUE
    AllowedValues:
      - TRUE
      - FALSE
  RestActionMultiAllowExplicitIndexEnabled:
    Description: Specifies whether explicit references to indices are allowed inside the body of HTTP requests. Setting this property to false prevents users from bypassing access control for subresources.
    Type: String
    Default: TRUE
    AllowedValues:
      - TRUE
      - FALSE
  LogPublishingIndexEnabled:
    Description: Enables publishing of the OpenSearch index logs.
    Type: String
    Default: TRUE
    AllowedValues:
      - TRUE
      - FALSE
  LogPublishingSearchEnabled:
    Description: Enables publishing of the OpenSearch search logs.
    Type: String
    Default: TRUE
    AllowedValues:
      - TRUE
      - FALSE
  LogPublishingApplicationEnabled:
    Description: Enables publishing of the OpenSearch application logs.
    Type: String
    Default: TRUE
    AllowedValues:
      - TRUE
      - FALSE
  LogRetentionPeriod:
    Description: The number of days to retain the log events in the specified log group
    Type: Number
    Default: 365
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]
  NetworkStackName:
    Description: The name of the cloudformation Network stack
    Type: String
    Default: iscale-dev-dev-uw2-network
  SNSStackName:
    Description: The name of the cloudformation SNS stack
    Type: String
    Default: iscale-dev-dev-uw2-sns
  UseFriendlyNames:
    Description: Set to TRUE to have nice object names
    Type: String
    AllowedValues:
      - TRUE
      - FALSE
    Default: TRUE


Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  IsEncrypted: !Equals [!Ref EncryptAtRestEnabled, TRUE]
  IsLogPublishingIndexEnabled: !Equals [!Ref LogPublishingIndexEnabled, TRUE]
  IsLogPublishingSearchEnabled: !Equals [!Ref LogPublishingSearchEnabled, TRUE]
  IsLogPublishingApplicationEnabled: !Equals [!Ref LogPublishingApplicationEnabled, TRUE]
  UseFriendlyNames: !Equals [!Ref UseFriendlyNames, TRUE]

