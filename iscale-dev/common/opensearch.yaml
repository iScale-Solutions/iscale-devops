  OpenSearchLogPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, opensesarchlog-policy]]
      PolicyDocument: "{ \"Version\": \"2012-10-17\", \"Statement\": [ { \"Sid\": \"CloudwatchAccess\", \"Effect\": \"Allow\",\"Principal\":{\"Service\":\"es.amazonaws.com\"},\"Action\":[\"logs:PutLogEvents\",\"logs:CreateLogStream\"],\"Resource\":[\"arn:aws:logs:*:*:*\"]}]}"

  OpenSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      UpdatePolicy:
        EnableVersionUpgrade: True
      DomainName: !If
        - UseFriendlyNames
        - !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        - !Ref 'AWS::NoValue'
      ClusterConfig:
        InstanceCount: !Ref InstanceCount
        InstanceType: !Ref InstanceType
      EBSOptions:
        EBSEnabled: true
        VolumeSize: !Ref VolumeSize
        VolumeType: !Ref VolumeType
      EncryptionAtRestOptions:
        Enabled: !Ref EncryptAtRestEnabled
      AccessPolicies:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: '*'
            Action:
              - es:*
            Resource: '*'
      AdvancedOptions:
        rest.action.multi.allow_explicit_index: !Ref RestActionMultiAllowExplicitIndexEnabled
      LogPublishingOptions:
        INDEX_SLOW_LOGS:
          CloudWatchLogsLogGroupArn: !GetAtt IndexLogLogGroup.Arn
          Enabled: !Ref LogPublishingIndexEnabled
        SEARCH_SLOW_LOGS:
          CloudWatchLogsLogGroupArn: !GetAtt SearchLogLogGroup.Arn
          Enabled: !Ref LogPublishingSearchEnabled
        ES_APPLICATION_LOGS:
          CloudWatchLogsLogGroupArn: !GetAtt ApplicationLogLogGroup.Arn
          Enabled: !Ref LogPublishingApplicationEnabled
      VPCOptions:
        SubnetIds:
          - Fn::ImportValue:
             !Sub '${NetworkStackName}-InternalSubnetId1'
        SecurityGroupIds:
          - !Ref SecurityGroup
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

####
# VPC Section
####

  # #By default, no inbound connection are allowed. The caller (AppServer / Lambda) will need to add itself to the allowed callers list.
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !If
        - UseFriendlyNames
        - !Join [ '-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], opensearch]]
        - !Ref 'AWS::NoValue'
      GroupDescription: !Join [ '-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], opensearch]]
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'

####
# CloudWatch Section
####

  # IndexLog Log Group
  IndexLogLogGroup:
    Condition: IsLogPublishingIndexEnabled
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionPeriod
      LogGroupName: !If
        - UseFriendlyNames
        - !Join ['-',[!Join ['',['/', !Ref OrgName]], !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, index-logs]]
        - !Ref 'AWS::NoValue'

  # SearchLog Log Group
  SearchLogLogGroup:
    Condition: IsLogPublishingSearchEnabled
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionPeriod
      LogGroupName: !If
        - UseFriendlyNames
        - !Join ['-',[!Join ['',['/', !Ref OrgName]], !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, search-logs]]
        - !Ref 'AWS::NoValue'

  # ApplicationLog Log Group
  ApplicationLogLogGroup:
    Condition: IsLogPublishingApplicationEnabled
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionPeriod
      LogGroupName: !If
        - UseFriendlyNames
        - !Join ['-',[!Join ['',['/', !Ref OrgName]], !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, application-logs]]
        - !Ref 'AWS::NoValue'

