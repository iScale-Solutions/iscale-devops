AWSTemplateFormatVersion: 2010-09-09
Description: Backup plan with parameters

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Backup Configuration
        Parameters:
          - BackupARNList
          - BackupTime
          - ColdStorageTrigger
          - DailyExpiration
          - MonthlyExpiration
          - TagName
          - TagValue
          - WeeklyExpiration
          - EnableHourlyBackup
          - HourlyBackupARNList
          - EnableCrossRegionBackup
          - CrossRegionBackupVaultArn

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      BackupTime:
        default: UTC time of the backup
      BackupARNList:
        default: List of ARNs to backup
      ColdStorageTrigger:
        default: Number of days after which the backup goes to cold storage
      DailyExpiration:
        default: Number of days for daily backup expiration
      MonthlyExpiration:
        default: Number of days for monthly backup expiration
      WeeklyExpiration:
        default: Number of days for weekly backup expiration
      EnableHourlyBackup:
        default: Enable hourly incremental backup plan
      EnableHourlyBackup:
        default: Enable hourly incremental backup plan
      HourlyBackupARNList:
        default: ARNs to include in the hourly backup (EFS only recommended)
      EnableCrossRegionBackup:
        default: Enable cross-region copy of backups to a DR vault
      CrossRegionBackupVaultArn:
        default: ARN of the destination backup vault in the DR region

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 9
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
      - PreProd
      - ProductionDR
      - StagingDR
      - DevelopmentDR
      - TestDR
  BackupARNList:
    Description: The list of ARN resources that need to be backed up
    Type: CommaDelimitedList
  BackupTime:
    Description: UTC time for the backup
    Type: Number
    Default: 15 #3PM UTC
    MinValue: 0
    MaxValue: 23
  ColdStorageTrigger:
    Description: Number of days after which the backup goes to cold storage
    Type: Number
    Default: 90 # 3 months
  DailyExpiration:
    Description: Number of days after which the daily backup expires
    Type: Number
    Default: 30 # 1 month
  MonthlyExpiration:
    Description: Number of days after which the monthly backup expires
    Type: Number
    Default: 1825 # 5 years
  TagName:
    Description: Name of the tag name to include
    Type: String
    Default: Name
  TagValue:
    Description: Name of the tag value to include
    Type: String
    Default: ''
  WeeklyExpiration:
    Description: Number of days after which the weekly backup expires
    Type: Number
    Default: 365 # 1 year
  EnableHourlyBackup:
    Description: Enable hourly incremental backup plan (EFS is incremental; only active in Prod or ProductionDR)
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  HourlyBackupARNList:
    Description: Comma-delimited list of ARNs for the hourly backup plan — pass EFS ARNs only to avoid hourly RDS snapshots
    Type: CommaDelimitedList
  EnableCrossRegionBackup:
    Description: Enable cross-region copy of EFS backups to the DR vault on every backup rule
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  CrossRegionBackupVaultArn:
    Description: ARN of the destination backup vault in the DR region (e.g. arn:aws:backup:us-west-2:<account>:backup-vault:<name>)
    Type: String
    Default: ''

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  UseTagInclusion: !And [!Not [!Equals [!Ref TagName, ""]], !Not [!Equals [!Ref TagValue, ""]]]
  IsProdOrProductionDR: !Or
    - Condition: IsProd
    - !Equals [!Ref EnvName, ProductionDR]
  IsNotProdOrProductionDR: !Not [Condition: IsProdOrProductionDR]
  IsHourlyBackupEnabled: !Equals [!Ref EnableHourlyBackup, 'true']
  IsCrossRegionBackupEnabled: !And
    - !Equals [!Ref EnableCrossRegionBackup, 'true']
    - !Not [!Equals [!Ref CrossRegionBackupVaultArn, '']]

Resources:

  ProdBackupVault:
    Condition: IsProdOrProductionDR
    Type: AWS::Backup::BackupVault
    DeletionPolicy: Retain #Prod vaults are retained
    Properties:
      BackupVaultName: !Join [ '-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], vault]]
      BackupVaultTags:
        Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, vault]]
        Environment: !Ref EnvName
        Organization: !Ref OrgName

  NonProdBackupVault:
    Condition: IsNotProdOrProductionDR #No retention for non-prod
    Type: AWS::Backup::BackupVault
    Properties:
      BackupVaultName: !Join [ '-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], vault]]
      BackupVaultTags:
        Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, vault]]
        Environment: !Ref EnvName
        Organization: !Ref OrgName

  ProdBackupPlan:
    Condition: IsProdOrProductionDR
    DependsOn: ProdBackupVault
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, backup,plan]]
        BackupPlanRule:
          - RuleName: DailyBackup
            TargetBackupVault: !Ref ProdBackupVault
            ScheduleExpression: !Join [' ', ['cron(0', !Ref BackupTime, '?', '*', '*', '*)']]
            StartWindowMinutes: 120
            CompletionWindowMinutes: 300
            Lifecycle:
              DeleteAfterDays: !Ref DailyExpiration
            CopyActions: !If
              - IsCrossRegionBackupEnabled
              - - DestinationBackupVaultArn: !Ref CrossRegionBackupVaultArn
                  Lifecycle:
                    DeleteAfterDays: !Ref DailyExpiration
              - !Ref 'AWS::NoValue'
          - RuleName: WeeklyBackup
            TargetBackupVault: !Ref ProdBackupVault
            ScheduleExpression: !Join [' ', ['cron(0', !Ref BackupTime, '?', '*', 7, '*)']]
            StartWindowMinutes: 120
            CompletionWindowMinutes: 300
            Lifecycle:
              MoveToColdStorageAfterDays: !Ref ColdStorageTrigger
              DeleteAfterDays: !Ref WeeklyExpiration
            CopyActions: !If
              - IsCrossRegionBackupEnabled
              - - DestinationBackupVaultArn: !Ref CrossRegionBackupVaultArn
                  Lifecycle:
                    MoveToColdStorageAfterDays: !Ref ColdStorageTrigger
                    DeleteAfterDays: !Ref WeeklyExpiration
              - !Ref 'AWS::NoValue'
          - RuleName: MonthlyBackup
            TargetBackupVault: !Ref ProdBackupVault
            ScheduleExpression: !Join [' ', ['cron(0', !Ref BackupTime, 1, '*', '?', '*)']]
            StartWindowMinutes: 120
            CompletionWindowMinutes: 300
            Lifecycle:
              MoveToColdStorageAfterDays: !Ref ColdStorageTrigger
              DeleteAfterDays: !Ref MonthlyExpiration
            CopyActions: !If
              - IsCrossRegionBackupEnabled
              - - DestinationBackupVaultArn: !Ref CrossRegionBackupVaultArn
                  Lifecycle:
                    MoveToColdStorageAfterDays: !Ref ColdStorageTrigger
                    DeleteAfterDays: !Ref MonthlyExpiration
              - !Ref 'AWS::NoValue'
      BackupPlanTags:
        Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, backup, plan]]
        Environment: !Ref EnvName
        Organization: !Ref OrgName

  NonProdBackupPlan:
    Condition: IsNotProdOrProductionDR
    DependsOn: NonProdBackupVault
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, backup,plan]]
        BackupPlanRule: #only simple daily backup for non prod
          - RuleName: DailyBackup
            TargetBackupVault: !Ref NonProdBackupVault
            ScheduleExpression: "cron(0 5 ? * * *)" #Non prod usually only open during day time
            StartWindowMinutes: 120
            CompletionWindowMinutes: 300
            Lifecycle:
              DeleteAfterDays: !Ref DailyExpiration
            CopyActions: !If
              - IsCrossRegionBackupEnabled
              - - DestinationBackupVaultArn: !Ref CrossRegionBackupVaultArn
                  Lifecycle:
                    DeleteAfterDays: !Ref DailyExpiration
              - !Ref 'AWS::NoValue'
      BackupPlanTags:
        Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, backup, plan]]
        Environment: !Ref EnvName
        Organization: !Ref OrgName

  HourlyBackupPlan:
    Condition: IsHourlyBackupEnabled
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, hourly, backup, plan]]
        BackupPlanRule:
          - RuleName: HourlyBackup
            TargetBackupVault: !If [IsProdOrProductionDR, !Ref ProdBackupVault, !Ref NonProdBackupVault]
            ScheduleExpression: "cron(0 * ? * * *)"
            StartWindowMinutes: 60
            CompletionWindowMinutes: 120
            Lifecycle:
              DeleteAfterDays: 2
            CopyActions: !If
              - IsCrossRegionBackupEnabled
              - - DestinationBackupVaultArn: !Ref CrossRegionBackupVaultArn
                  Lifecycle:
                    DeleteAfterDays: 2
              - !Ref 'AWS::NoValue'
      BackupPlanTags:
        Name: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, hourly, backup, plan]]
        Environment: !Ref EnvName
        Organization: !Ref OrgName

  HourlyBackupSelection:
    Condition: IsHourlyBackupEnabled
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref HourlyBackupPlan
      BackupSelection:
        SelectionName: !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, hourly-backup-selection]]
        IamRoleArn: !GetAtt BackupRole.Arn
        Resources: !Ref HourlyBackupARNList

  BackupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - backup.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
       - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup 
       - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores
       - arn:aws:iam::aws:policy/AWSBackupServiceRolePolicyForS3Backup
       - arn:aws:iam::aws:policy/AWSBackupServiceRolePolicyForS3Restore

  BackupSelection:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !If [IsProdOrProductionDR, !Ref ProdBackupPlan, !Ref NonProdBackupPlan]
      BackupSelection:
        SelectionName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, backup-selection]]
        IamRoleArn: !GetAtt BackupRole.Arn
        Resources: !Ref BackupARNList
        ListOfTags: !If
          - UseTagInclusion
          - - ConditionType: STRINGEQUALS
              ConditionKey: !Ref TagName
              ConditionValue: !Ref TagValue
          - !Ref 'AWS::NoValue'