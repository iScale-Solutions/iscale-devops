AWSTemplateFormatVersion: 2010-09-09
Description: |
  Enables RDS cross-region automated backup replication for a source DB instance
  via a Lambda custom resource (AWS::RDS::DBInstanceAutomatedBackupsReplication is
  not supported in all regions). Deploy in the DESTINATION (DR) region, pointing
  SourceDbInstanceArn to the live region DB. Replicates daily snapshots + transaction
  logs enabling PITR with ~5 minute RPO. On stack delete, replication is stopped.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Replication Configuration
        Parameters:
          - SourceDbInstanceArn
          - BackupRetentionPeriod
          - KmsKeyId

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      SourceDbInstanceArn:
        default: Source DB Instance ARN (live region)
      BackupRetentionPeriod:
        default: Backup Retention Period in DR region (days)
      KmsKeyId:
        default: KMS Key ID for encrypted backup replication (optional)

Parameters:
  Name:
    Description: Unique name/identifier matching the source app stack name
    Type: String
    MinLength: 3
    MaxLength: 12
  OrgName:
    Description: The name of the organization
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen
  EnvName:
    Description: The name of the environment (DR region environment name)
    Type: String
    Default: ProductionDR
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
      - PreProd
      - ProductionDR
      - StagingDR
      - DevelopmentDR
      - TestDR
  SourceDbInstanceArn:
    Description: |
      ARN of the source RDS DB instance in the live region.
      Format: arn:aws:rds:<live-region>:<account-id>:db:<db-instance-identifier>
      Obtain from the live region DBStack output: DBInstanceARN
    Type: String
    AllowedPattern: '^arn:aws:rds:[a-z0-9-]+:[0-9]+:db:[a-z0-9-]+$'
    ConstraintDescription: Must be a valid RDS DB instance ARN
  BackupRetentionPeriod:
    Description: Number of days to retain replicated backups in the DR region (1-35)
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
  KmsKeyId:
    Description: |
      (Optional) KMS Key ARN or ID in the DR region for encrypting replicated backups.
      Required only if the source DB is encrypted with a customer-managed KMS key.
      Leave blank to use the default AWS-managed key.
    Type: String
    Default: ''

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasKmsKey: !Not [!Equals [!Ref KmsKeyId, '']]

Resources:

####
# IAM
####

  ReplicationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RDSReplicationPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - rds:StartDBInstanceAutomatedBackupsReplication
                  - rds:StopDBInstanceAutomatedBackupsReplication
                  - rds:DescribeDBInstanceAutomatedBackups
                Resource: '*'

####
# Lambda custom resource
####

  ReplicationLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Join ['-', [!Ref OrgName, !Ref Name, db, replication]]
      Description: |
        Custom resource Lambda that enables/disables RDS cross-region automated
        backup replication. Calls start/stop replication APIs on Create/Delete.
      Handler: index.lambda_handler
      Role: !GetAtt ReplicationLambdaRole.Arn
      Runtime: python3.12
      Timeout: 60
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
            logger.info(event)
            request_type = event['RequestType']
            props = event['ResourceProperties']

            source_arn = props['SourceDbInstanceArn']
            retention = int(props['BackupRetentionPeriod'])
            kms_key = props.get('KmsKeyId', '')

            rds = boto3.client('rds')

            try:
              if request_type == 'Create':
                kwargs = dict(
                  SourceDbInstanceArn=source_arn,
                  BackupRetentionPeriod=retention
                )
                if kms_key:
                  kwargs['KmsKeyId'] = kms_key
                rds.start_db_instance_automated_backups_replication(**kwargs)
                logger.info(f'Replication started from {source_arn}')

              elif request_type == 'Update':
                # Stop old replication and start new one if source ARN changed
                old_source = event.get('OldResourceProperties', {}).get('SourceDbInstanceArn', source_arn)
                if old_source != source_arn:
                  rds.stop_db_instance_automated_backups_replication(
                    SourceDbInstanceArn=old_source
                  )
                  logger.info(f'Stopped old replication from {old_source}')
                kwargs = dict(
                  SourceDbInstanceArn=source_arn,
                  BackupRetentionPeriod=retention
                )
                if kms_key:
                  kwargs['KmsKeyId'] = kms_key
                rds.start_db_instance_automated_backups_replication(**kwargs)
                logger.info(f'Replication restarted from {source_arn}')

              elif request_type == 'Delete':
                try:
                  rds.stop_db_instance_automated_backups_replication(
                    SourceDbInstanceArn=source_arn
                  )
                  logger.info(f'Replication stopped from {source_arn}')
                except rds.exceptions.DBInstanceAutomatedBackupNotFoundFault:
                  # Replication was never started (e.g. CREATE failed before API call)
                  # Safe to ignore — nothing to stop
                  logger.warning(f'No active replication found for {source_arn} — skipping stop')
                except Exception as e:
                  # Log but do not fail DELETE — always allow stack cleanup
                  logger.warning(f'Could not stop replication: {str(e)} — continuing delete')

              cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                'SourceDbInstanceArn': source_arn,
                'BackupRetentionPeriod': str(retention)
              })

            except Exception as e:
              logger.exception('Error managing replication')
              # On Delete, always succeed to allow stack cleanup
              if request_type == 'Delete':
                logger.warning('Returning SUCCESS on Delete despite error to allow stack cleanup')
                cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              else:
                cfnresponse.send(event, context, cfnresponse.FAILED, {
                  'Error': str(e)
                })

  DBReplication:
    Type: Custom::DBInstanceBackupsReplication
    Properties:
      ServiceToken: !GetAtt ReplicationLambdaFunction.Arn
      SourceDbInstanceArn: !Ref SourceDbInstanceArn
      BackupRetentionPeriod: !Ref BackupRetentionPeriod
      KmsKeyId: !If [HasKmsKey, !Ref KmsKeyId, '']

Outputs:

  SourceDbInstanceArn:
    Description: ARN of the source DB instance being replicated
    Value: !Ref SourceDbInstanceArn

  BackupRetentionPeriod:
    Description: Retention period for replicated backups in DR region
    Value: !Ref BackupRetentionPeriod

  ReplicationNote:
    Description: How to use replicated backups at failover
    Value: !Sub |
      At failover, restore using PITR in ${AWS::Region}.
      Use aws rds restore-db-instance-to-point-in-time
      with --source-db-instance-automated-backups-arn
      or provide the snapshot ARN to the pesonet20 SnapshotIdentifier parameter.
