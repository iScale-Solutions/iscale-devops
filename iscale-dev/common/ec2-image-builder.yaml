AWSTemplateFormatVersion: 2010-09-09
Description: EC2 Image Builder

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
          - ArmBased
          - InstanceTypeName
          - ImageRecipeARN
      - Label:
          default: Sharing Configuration
        Parameters:
          - ShareImage
          - ShareAccountList
          - SecondRegion
          - ThirdRegion
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
      - Label:
          default: DR Configuration
        Parameters:
          - DRRegion
      - Label:
          default: AMI Retention
        Parameters:
          - RetainAmiCount

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      ArmBased:
        default: ARM Based Architecture
      ImageRecipeARN:
        default: Recipe ARN
      InstanceTypeName:
        default: EC2 Instance Type Name
      NetworkStackName:
        default: Network Stack Name
      ShareImage:
        default: set to true to share the image with other accounts
      ShareAccountList:
        default: Comma Delimited List of account Ids to share image to
      SNSStackName:
        default: SNS Topic Stack Name
      SecondRegion:
        default: Second Distribution Region (leave blank to disable)
      ThirdRegion:
        default: Third Distribution Region (leave blank to disable)
      DRRegion:
        default: DR Region (leave blank to disable cross-region AMI distribution)
      RetainAmiCount:
        default: Number of AMI versions to retain (older versions are deleted)

Parameters:
  Name:
    Description: Unique name/identifier (e.g. amazon-linux).
    Type: String
    Default: image-builder
    AllowedPattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale
    AllowedPattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  ArmBased:
    Description: Is the image ARM based architecture?
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  ImageRecipeARN:
    Description: Image Recipe ARN
    Type: String
    MinLength: 1
  InstanceTypeName:
    Description: EC2 Instance Type to use for building the image. Leave blank to use default t3.micro, t3.small, t3.medium or t4g.micro, t4g.small, t4g.medium for ARM based.
    Type: String
    Default: ''
  NetworkStackName:
    Description: The name of the network stack.
    Type: String
    Default: iscale-dev-dev-uw2-network
    MinLength: 1
  ShareAccountList:
    Description: List of accounts to share this image with
    Type: CommaDelimitedList 
    Default: "178070162686" #178070162686: iscale-hosting
  ShareImage:
    Description: Set to true to enable image sharing. Default is private.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  SNSStackName:
    Description: the name of the SNS stack.
    Type: String
    Default: iscale-dev-dev-uw2-sns
    MinLength: 1
  SecondRegion:
    Description: |
      Second region to distribute the AMI to when sharing is enabled (e.g. us-east-1, eu-west-1).
      Leave blank to disable.
    Type: String
    Default: ''
  ThirdRegion:
    Description: |
      Third region to distribute the AMI to when sharing is enabled (e.g. ap-southeast-1, eu-central-1).
      Leave blank to disable.
    Type: String
    Default: ''
  DRRegion:
    Description: |
      DR region to copy the AMI to after every build (e.g. us-west-2, us-east-1, ap-southeast-1).
      Leave blank to disable cross-region distribution.
    Type: String
    Default: ''
  RetainAmiCount:
    Description: |
      Number of most recent AMI versions to keep. Older versions are automatically deleted
      from all distribution regions. Must be between 1 and 100.
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 100

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml      
  IsShareImage: !Equals [!Ref ShareImage, true]
  IsNotShareImage: !Equals [!Ref ShareImage, false]
  HasSecondRegion: !Not [!Equals [!Ref SecondRegion, '']]
  HasThirdRegion: !Not [!Equals [!Ref ThirdRegion, '']]
  IsArmBased: !Equals [!Ref ArmBased, true]
  UseCustomInstanceType: !Not [!Equals [!Ref InstanceTypeName, '']]
  HasDRRegion: !Not [!Equals [!Ref DRRegion, '']]

Resources:

  EC2ImageBuilderInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Path: '/'
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action: 
              - sts:AssumeRole
      ManagedPolicyArns: 
        - arn:aws:iam::aws:policy/EC2InstanceProfileForImageBuilder
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: EC2ReadTagPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeTags
                  - ec2:DescribeInstances
                Resource: '*'
        - PolicyName: CloudWatchMetrics
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                Resource: '*'
        - PolicyName: AllowLogging
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: 'arn:aws:logs:*:*:*'
        - PolicyName: AllowEBSOperation
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:AttachVolume
                  - ec2:CreateTags
                  - ec2:CreateVolume
                  - ec2:DeleteVolume
                  - ec2:DescribeVolumes
                  - ec2:DetachVolume
                Resource: '*'
        - PolicyName: AllowNetworkInterfaceOperation
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:AttachNetworkInterface
                  - ec2:CreateNetworkInterface
                  - ec2:CreateTags
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeNetworkInterfaceAttribute
                  - ec2:DetachNetworkInterface
                Resource: '*'
  EC2ImageInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2ImageBuilderInstanceRole

  ImageInfrastructureConfig:
    Type: AWS::ImageBuilder::InfrastructureConfiguration
    Properties: 
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      InstanceProfileName: !Ref EC2ImageInstanceProfile
      InstanceTypes: !If
        - IsArmBased
        - [ t4g.micro, t4g.small, t4g.medium ]
        - !If
            - UseCustomInstanceType
            - [ !Ref InstanceTypeName ]
            - [ t3.micro, t3.small, t3.medium ]    
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      SecurityGroupIds: 
        - !Ref ImageSecurityGroup
      SnsTopicArn: 
        Fn::ImportValue:
          !Sub "${SNSStackName}-TopicArn"
      SubnetId:
        Fn::ImportValue:
          Fn::Sub: "${NetworkStackName}-PrivateSubnetId1"
      TerminateInstanceOnFailure: true

  ImageSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      VpcId:
        Fn::ImportValue:
          Fn::Sub: "${NetworkStackName}-VpcId"
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName
  # No need to open SSH port since Image Builder uses SSM to connect to the instance for image building and testing
  # ImageSecurityGroupAllowSSH:
  #   Type: AWS::EC2::SecurityGroupIngress
  #   Properties: 
  #     GroupId: !Ref ImageSecurityGroup
  #     IpProtocol: TCP
  #     FromPort: 22
  #     ToPort: 22
  #     CidrIp: 0.0.0.0/0

  ImageDistributionConfigurationShare:
    Condition: IsShareImage
    Type: AWS::ImageBuilder::DistributionConfiguration
    Properties:
      Name: !Join ['-',[!Ref OrgName, !Ref Name, shared]]
      Description: !Join [' ',['Distribution for', !Ref OrgName, !Ref Name]]
      Distributions:
        - Region: !Ref 'AWS::Region'
          AmiDistributionConfiguration:
            # AMI Name
            Name: !Join ['_', [!Ref OrgName, !Ref Name, base-image, '{{ imagebuilder:buildDate }}']]
            Description: !Join [' ', [!Ref OrgName, !Ref Name, base image, '{{ imagebuilder:buildDate }}']]
            AmiTags:
              # output AMI tags
              Name: !Join [' ', [!Ref OrgName, !Ref Name, base image, !Select [2, !Split ['/', !Ref ImageRecipeARN]]]]
              Environment: !Ref EnvName
            LaunchPermissionConfiguration:
              UserIds: !Ref ShareAccountList
        - !If
            - HasSecondRegion
            - Region: !Ref SecondRegion
              AmiDistributionConfiguration:
                # AMI Name
                Name: !Join ['_', [!Ref OrgName, !Ref Name, base-image, '{{ imagebuilder:buildDate }}']]
                Description: !Join [' ', [!Ref OrgName, !Ref Name, base image, '{{ imagebuilder:buildDate }}']]
                AmiTags:
                  # output AMI tags
                  Name: !Join [' ', [!Ref OrgName, !Ref Name, base image, !Select [2, !Split ['/', !Ref ImageRecipeARN]]]]
                  Environment: !Ref EnvName
                LaunchPermissionConfiguration:
                  UserIds: !Ref ShareAccountList
            - !Ref 'AWS::NoValue'
        - !If
            - HasThirdRegion
            - Region: !Ref ThirdRegion
              AmiDistributionConfiguration:
                # AMI Name
                Name: !Join ['_', [!Ref OrgName, !Ref Name, base-image, '{{ imagebuilder:buildDate }}']]
                Description: !Join [' ', [!Ref OrgName, !Ref Name, base image, '{{ imagebuilder:buildDate }}']]
                AmiTags:
                  # output AMI tags
                  Name: !Join [' ', [!Ref OrgName, !Ref Name, base image, !Select [2, !Split ['/', !Ref ImageRecipeARN]]]]
                  Environment: !Ref EnvName
                LaunchPermissionConfiguration:
                  UserIds: !Ref ShareAccountList
            - !Ref 'AWS::NoValue'

  ImageDistributionConfigurationNotShare:
    Condition: IsNotShareImage
    Type: AWS::ImageBuilder::DistributionConfiguration
    Properties:
      Name: !Join ['-',[!Ref OrgName, !Ref Name]]
      Description: !Join [' ',['Distribution for', !Ref OrgName, !Ref Name]]
      Distributions:
        - Region: !Ref 'AWS::Region'
          AmiDistributionConfiguration:
            # AMI Name
            Name: !Join ['_', [!Ref OrgName, !Ref Name, base-image, '{{ imagebuilder:buildDate }}']]
            Description: !Join [' ', [!Ref OrgName, !Ref Name, base image, '{{ imagebuilder:buildDate }}']]
            AmiTags:
              # output AMI tags
              Name: !Join [' ', [!Ref OrgName, !Ref Name, base image, !Select [2, !Split ['/', !Ref ImageRecipeARN]]]]
              Environment: !Ref EnvName

  # ImageDistributionConfigurationWithDR:
  #   Condition: HasDRRegion
  #   Type: AWS::ImageBuilder::DistributionConfiguration
  #   Properties:
  #     Name: !Join ['-', [!Ref OrgName, !Ref Name, dr]]
  #     Description: !Join [' ', ['Distribution for', !Ref OrgName, !Ref Name, 'with DR copy to', !Ref DRRegion]]
  #     Distributions:
  #       - Region: !Ref 'AWS::Region'
  #         AmiDistributionConfiguration:
  #           Name: !Join ['_', [!Ref OrgName, !Ref Name, base-image, !Select [2, !Split ['/', !Ref ImageRecipeARN]], '{{ imagebuilder:buildDate }}']]
  #           Description: !Join [' ', [!Ref OrgName, !Ref Name, base image, '{{ imagebuilder:buildDate }}']]
  #           AmiTags:
  #             Name: !Join [' ', [!Ref OrgName, !Ref Name, base image, !Select [2, !Split ['/', !Ref ImageRecipeARN]]]]
  #             Environment: !Ref EnvName
  #           LaunchPermissionConfiguration: !If
  #             - IsShareImage
  #             - UserIds: !Ref ShareAccountList
  #             - !Ref 'AWS::NoValue'
  #       - Region: !Ref DRRegion
  #         AmiDistributionConfiguration:
  #           Name: !Join ['_', [!Ref OrgName, !Ref Name, dr-image, !Select [2, !Split ['/', !Ref ImageRecipeARN]], '{{ imagebuilder:buildDate }}']]
  #           Description: !Join [' ', [!Ref OrgName, !Ref Name, DR image, '{{ imagebuilder:buildDate }}']]
  #           AmiTags:
  #             Name: !Join [' ', [!Ref OrgName, !Ref Name, dr image, !Select [2, !Split ['/', !Ref ImageRecipeARN]]]]
  #             Environment: !Ref EnvName
  #     Tags:
  #       Name: !Ref Name

  ImagePipeline:
    Type: AWS::ImageBuilder::ImagePipeline
    Properties:
      Name: !Join ['-', [!Ref OrgName, base, !Ref Name]]
      Description: !Join [' ', [!Ref OrgName, !Ref Name, 'Pipeline']]
      ImageRecipeArn: !Ref ImageRecipeARN
      InfrastructureConfigurationArn: !Ref ImageInfrastructureConfig
      DistributionConfigurationArn: !If
        - IsShareImage
        - !Ref ImageDistributionConfigurationShare
        - !Ref ImageDistributionConfigurationNotShare
      ImageTestsConfiguration:
        ImageTestsEnabled: true
        TimeoutMinutes: 60
      Status: ENABLED

# Lifecycle policy to retain only the most recent N AMI versions and delete older ones

  ImageLifecyclePolicyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: imagebuilder.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ImageLifecyclePolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeImages
                  - ec2:DeregisterImage
                  - ec2:DeleteSnapshot
                  - ec2:CreateTags
                  - imagebuilder:GetImage
                  - imagebuilder:DeleteImage
                  - imagebuilder:ListImageBuildVersions
                Resource: '*'

  ImageLifecyclePolicy:
    Type: AWS::ImageBuilder::LifecyclePolicy
    Properties:
      Name: !Join ['-', [!Ref OrgName, !Ref Name, retain, !Ref RetainAmiCount]]
      Description: !Sub 'Keep the ${RetainAmiCount} most recent AMIs — delete older versions across all regions'
      Status: ENABLED
      ExecutionRole: !GetAtt ImageLifecyclePolicyRole.Arn
      ResourceType: AMI_IMAGE
      ResourceSelection:
        TagMap:
          Name: !Join [' ', [!Ref OrgName, !Ref Name, base image, !Select [2, !Split ['/', !Ref ImageRecipeARN]]]]
      PolicyDetails:
        - Action:
            Type: DELETE
            IncludeResources:
              Amis: true
              Snapshots: true
          Filter:
            Type: COUNT
            Value: !Ref RetainAmiCount