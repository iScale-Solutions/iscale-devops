AWSTemplateFormatVersion: 2010-09-09
Description: DocumentDB NoSQL database setup

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Database Configuration
        Parameters:
          - MasterUser
          - Port
          - StorageEncrypted
          - BackupRetentionPeriod
          - BackupWindow
          - SnapshotIdentifier
          - AutoMinorVersionUpgrade
          - ClusterType
          - ShardCapacity
          - ShardCount
          - ShardInstanceCount
      - Label:
          default: CloudWatch Configuration
        Parameters:
          - LogRetentionPeriod
          - EnableCPUCreditAlarm
      - Label:
          default: Cloudformation Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      MasterUser:
        default: Master Username
      Port:
        default: Port
      StorageEncrypted:
        default: Storage Encrypted
      BackupRetentionPeriod:
        default: Backup Retention Period
      BackupWindow:
        default: Backup Window
      SnapshotIdentifier:
        default: Snapshot Identifier
      AutoMinorVersionUpgrade:
        default: Auto-Minor Version Upgrade
      ClusterType:
        default: DocumentDB Cluster Type
      ShardCapacity:
        default: DocumentDB Elastic Shard Capacity
      ShardCount:
        default: DocumentDB Elastic Shard Count
      ShardInstanceCount:
        default: DocumentDB Cluster Type
      LogRetentionPeriod:
        default: Log Retention Period
      EnableCPUCreditAlarm:
        default: Enable CPU Credit Alarm
      NetworkStackName:
        default: Network Stack
      SNSStackName:
        default: SNS Stack

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 9
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  MasterUser:
    Description: The name of the master user for the database instance.
    Type: String
    Default: master
    ConstraintDescription: Can be any printable ASCII character except "/", "\", or "@".
  Port:
    Description: The port number on which the database accepts connections.
    Type: Number
    Default: 27017
    MinValue: 1
    MaxValue: 65535
  StorageEncrypted:
    Description: Set to true if DB instance encryption is enabled. Otherwise, disabeld.
    Type: String
    Default: true
    AllowedValues:
      - true
      - false
  BackupRetentionPeriod:
    Description: The number of days for which automated backups are retained. Setting this parameter to a positive number enables backups. Setting this parameter to 0 disables automated backups.
    Default: 30
    Type: Number
    MinValue: 0
    MaxValue: 35
  BackupWindow:
    Description: The daily time range during which automated backups are created if automated backups are enabled using the BackupRetentionPeriod parameter.
    Type: String
    Default: ""
    ConstraintDescription: Must be in the format hh24:mi-hh24:mi. Must be in Universal Coordinated Time (UTC). Must not conflict with the preferred maintenance window. Must be at least 30 minutes.
  SnapshotIdentifier:
    Description: The name or Amazon Resource Name (ARN) of the DB snapshot that's used to restore the DB instance.
    Type: String
    Default: ""
  AutoMinorVersionUpgrade:
    Description: Set to true to automatically apply minor engine upgrades.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  ClusterType:
    Description: DocumentDB cluster type.
    Type: String
    Default: instance
    AllowedValues:
      - instance
      - elastic
  ShardCapacity:
    Description: The number of vCPUs assigned to each elastic cluster shard. 
    Type: Number
    Default: 2
    AllowedValues: [2, 4, 8, 16, 32, 64]
  ShardCount:
    Description: The number of shards assigned to the elastic cluster.
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 32
    ConstraintDescription: Maximum is 32.
  ShardInstanceCount:
    Description: 'The number of replica instances applying to all shards in the cluster. 
    A shardInstanceCount value of 1 means there is one writer instance, and any additional 
    instances are replicas that can be used for reads and to improve availability.'
    Type: Number
    Default: 1
  LogRetentionPeriod:
    Description: The number of days to retain the log events in the specified log group
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]
  EnableCPUCreditAlarm:
    Description: Set to true if CPU credit alarm is enabled (Applicable only for t* instance types. E.g. t2.small, t3.small). Otherwise, disabled.
    Type: String
    Default: true
    AllowedValues:
      - true
      - false
  NetworkStackName:
    Description: The name of the cloudformation Network stack
    Type: String
    Default: iscale-dev-dev-uw2-network
  SNSStackName:
    Description: The name of the cloudformation SNS stack
    Type: String
    Default: iscale-dev-dev-uw2-sns

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasBackupWindow: !Not [!Equals [!Ref BackupWindow, ""]]
  IsEnableCPUCreditAlarm: !Equals [!Ref EnableCPUCreditAlarm, true]
  IsEncrypted: !Equals [!Ref StorageEncrypted, true]
  InstanceTypeCluster: !Equals [!Ref ClusterType, instance]
  ElasticTypeCluster: !Equals [!Ref ClusterType, elastic]

Resources:

####
# Lambda Section
####

  RDSPasswordGenerator:
    Type: Custom::RDSPasswordGenerator
    Properties:
      ServiceToken: !GetAtt LambdaPasswordGeneratorFunction.Arn

  LambdaPasswordGeneratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      #Do not put function name so that the lambda function can be replaced
      #FunctionName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, password-generator]]
      Handler: index.lambda_handler
      Role: !GetAtt LambdaPasswordGeneratorExecutionRole.Arn
      Runtime: python3.9
      Timeout: 60
      Code:
        ZipFile: |

          import cfnresponse
          import json
          import logging
          import time
          import base64
          import string
          import random

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):

            responseData={}
            physicalResourceId={}
            request_type = event['RequestType']

            try:

              if request_type in ['Create', 'Update']:
                responseData['DatabasePassword']=generate_random_password(20)
                responseData['DatabaseRootPassword']=generate_random_password(20)
                responseData['MagentoAdminPassword']=generate_random_password(20)

              send(event, context, cfnresponse.SUCCESS, responseData, physicalResourceId)
              return

            except Exception:

              logger.exception('Error Encountered')
              send(event, context, cfnresponse.FAILED, responseData, physicalResourceId)
              return

          def send(event, context, responseStatus, responseData, physicalResourceId=None):
            resourceId = physicalResourceId or context.log_stream_name
            responseBody = {'Status': responseStatus,
                            'Reason': 'See the details in CloudWatch Log Stream: ' + context.log_stream_name,
                            'PhysicalResourceId': resourceId,
                            'StackId': event['StackId'],
                            'RequestId': event['RequestId'],
                            'LogicalResourceId': event['LogicalResourceId'],
                            'Data': responseData}
            logger.info('RESPONSE BODY:' + json.dumps(responseBody))
            cfnresponse.send(event, context, responseStatus, responseData, resourceId)

          def generate_random_password(password_length=20):
            """
            Generates a random password sent back to CF
            :param password_length: Length of the password in number of characters
            :return: String of the password
            """
            password = ''
            char_set = string.ascii_uppercase + string.ascii_lowercase + string.digits + '-'
            while '-' not in password:
                password = ''.join(random.sample(char_set * 6, int(password_length)))

            return password

####
# RDS Section
####

  RDSSecretManager:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      GenerateSecretString:
        SecretStringTemplate: !Sub
          - |
            {
              "DB_ROOT_USER": "${DB_ROOT_USER}",
              "DB_ROOT_PASSWORD": "${DB_ROOT_PASSWORD}",
              "DB_USER": "${DB_USER}",
              "DB_PASSWORD": "${DB_PASSWORD}",
              "MAGENTO_ADMIN_PASSWORD": "${MAGENTO_ADMIN_PASSWORD}"
            }
          - DB_ROOT_USER: !Ref MasterUser
            DB_ROOT_PASSWORD: !GetAtt RDSPasswordGenerator.DatabaseRootPassword
            DB_USER: dbuser
            DB_PASSWORD: !GetAtt RDSPasswordGenerator.DatabasePassword
            MAGENTO_ADMIN_PASSWORD: !GetAtt RDSPasswordGenerator.MagentoAdminPassword
        GenerateStringKey: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        PasswordLength: 30
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

# DocumentDB instance type cluster

  DBSubnetGroup:
    Condition: InstanceTypeCluster
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      DBSubnetGroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      SubnetIds:
        - Fn::ImportValue:
            !Sub "${NetworkStackName}-InternalSubnetId1"
        - Fn::ImportValue:
            !Sub "${NetworkStackName}-InternalSubnetId2"
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  DBClusterParameterGroup:
    Condition: InstanceTypeCluster
    Type: AWS::DocDB::DBClusterParameterGroup
    Properties:
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Family: docdb3.6 #hardcoded - no other choice
      Parameters: 
        audit_logs: enabled
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
  
  DBCluster:
    Condition: InstanceTypeCluster
    Type: AWS::DocDB::DBCluster
    Properties: 
      BackupRetentionPeriod: !Ref BackupRetentionPeriod
      DBClusterParameterGroupName: !Ref DBClusterParameterGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      MasterUsername: !Ref MasterUser
      MasterUserPassword: !GetAtt RDSPasswordGenerator.DatabaseRootPassword
      Port: !Ref Port
      PreferredBackupWindow: !If [ HasBackupWindow, !Ref BackupWindow, !Ref 'AWS::NoValue']
      StorageEncrypted: true
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  DBInstance:
    Condition: InstanceTypeCluster
    Type: AWS::DocDB::DBInstance
    Properties:
      AutoMinorVersionUpgrade: true
      DBClusterIdentifier: !Ref DBCluster
      DBInstanceClass: db.t3.medium
      DBInstanceIdentifier: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

# DocumentDB Elastic type cluster

  DocuDBElastic:
    Condition: ElasticTypeCluster
    Type: AWS::DocDBElastic::Cluster
    Properties:
      AdminUserName: !Ref MasterUser
      AdminUserPassword: !GetAtt RDSPasswordGenerator.DatabaseRootPassword
      AuthType: PLAIN_TEXT
      BackupRetentionPeriod: !Ref BackupRetentionPeriod
      ClusterName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      # KmsKeyId:
      PreferredBackupWindow: !If [ HasBackupWindow, !Ref BackupWindow, !Ref 'AWS::NoValue']
      # PreferredMaintenanceWindow:
      ShardCapacity: !Ref ShardCapacity
      ShardCount: !Ref ShardCount
      ShardInstanceCount: !Ref ShardInstanceCount
      SubnetIds:
        - Fn::ImportValue:
            !Sub "${NetworkStackName}-InternalSubnetId1"
        - Fn::ImportValue:
            !Sub "${NetworkStackName}-InternalSubnetId2"
      VpcSecurityGroupIds:
        - !Ref DocuDBElasticSecurityGroup
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

####
# VPC Section
####

  #By default, no inbound connection are allowed. The caller (AppServer / Lambda) will need to add itself to the allowed callers list.
  DBClusterSecurityGroup:
    Condition: InstanceTypeCluster
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [ '-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], db] ]
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

  DocuDBElasticSecurityGroup:
    Condition: ElasticTypeCluster
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [ '-', [!Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], db] ]
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db]]
        - Key: Environment
          Value: !Ref EnvName
        - Key: Organization
          Value: !Ref OrgName

####
# IAM Section
####

  LambdaPasswordGeneratorExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: LambdaPasswordGeneratorFunctionPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:CreateLogGroup
                  - logs:DescribeLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"

####
# CloudWatch Section
####

  # Database log / metrics / alarms

  RDSLogGroup:
    Condition: InstanceTypeCluster
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !If [IsProd, 365, !Ref LogRetentionPeriod]
      LogGroupName: !Join [ '/', [/aws/rds/instance, !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]]]

Outputs:

  DBSecretManager:
    Description: Secrets Manager containing the DB credentials
    Value: !Ref RDSSecretManager

  DBSecretManagerKeyId:
    Description: Value of the key containing the passwords in the Secret Manager
    Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  DBClusterARN:
    Condition: InstanceTypeCluster
    Description: ARN of the created DB cluster
    Value: !Join [":", ["arn:aws:rds", !Ref 'AWS::Region', !Ref 'AWS::AccountId', "cluster", !Ref DBCluster]]

  SecurityGroupId:
    Condition: InstanceTypeCluster
    Description: The security group id of the RDS instance
    Value: !GetAtt DBClusterSecurityGroup.GroupId

  ClusterPort:
    Description: The port number of the RDS cluster
    Value: !Ref Port

  ClusterEndpointAddress:
    Condition: InstanceTypeCluster
    Description: The endpoint address of the RDS cluster
    Value: !GetAtt DBCluster.Endpoint

  ClusterReadEndpointAddress:
    Condition: InstanceTypeCluster
    Description: The read endpoint address of the rds cluster
    Value: !GetAtt DBCluster.ReadEndpoint