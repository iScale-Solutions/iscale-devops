AWSTemplateFormatVersion: 2010-09-09
Description: This cloudformation template provisions all objects for blue green deployment

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - OrgName
          - EnvName
      - Label:
          default: Deployment Configuration
        Parameters:
          - CreateDeployUser
          - CreateCodePipeline
          - PipelineS3Object
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
          - RootStackID

    ParameterLabels:
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      CreateDeployUser:
        default: Create a deploy user ?
      CreateCodePipeline:
        default: Create a Code Pipeline ?
      PipelineS3Object:
        default: Pipeline S3 object to monitor
      BlueGreenTimeStamp:
        default: Blue Green Timestamp
      RootStackID:
        default: Root Stack ID

Parameters:
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Development
    AllowedValues:
      - PreProd
      - Production
      - Staging
      - Development
      - Test
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 16
  BlueGreenTimeStamp: #Reserved Name for Blue Green Auto Scaling Group update
    Description: Blue Green Timestamp (don't update this by hand)
    Type: String
    Default: ''
  CreateCodePipeline:
    Description: Set to TRUE to create a code pipeline
    Type: String
    Default: FALSE
    AllowedValues:
      - FALSE
      - TRUE
  CreateDeployUser:
    Description: Set to TRUE to create a new deploy user
    Type: String
    Default: FALSE
    AllowedValues:
      - FALSE
      - TRUE
  NetworkStackName:
    Description: The name of the cloudformation Network stack
    Type: String
    Default: iscale-dev-dev-uw2-network
  PipelineS3Object:
    Description: ARN of the S3 object to monitor (only if pipeline is created)
    Type: String
    Default: 'latest.zip'
  RootStackID:
    Description: ID of the parent (root) stack. Don't fill if no Blue Green updates are needed
    Type: String
    Default: ''
  SNSStackName:
    Description: The name of the cloudformation SNS stack
    Type: String
    Default: iscale-dev-dev-uw2-sns

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasCodePipeline: !Equals [!Ref CreateCodePipeline, TRUE]
  HasCreateDeployUser: !Equals [!Ref CreateDeployUser, TRUE]
  HasRootStackID: !Not [!Equals [!Ref RootStackID, '']]

Resources:

  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, application]]
      ComputePlatform: Server

  NotifyReadyTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: lambda
          Endpoint: !GetAtt  NotifyReadyFunction.Arn

  NotifyReadyFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: AccessToDeploySetup
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - codedeploy:GetDeployment
                Resource: !Join [":", ["arn:aws:codedeploy", !Ref 'AWS::Region', !Ref 'AWS::AccountId', "deploymentgroup:*"]]
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                Resource: '*'

  NotifyReadyFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Give the IP address of a ready EC2 instance in an AutoScaling group
      Handler: index.lambda_handler
      Role: !GetAtt  NotifyReadyFunctionRole.Arn
      Runtime: python3.6
      Timeout: 60
      Environment:
        Variables:
          ENV_NAME: !Ref EnvName
          REGION: !Ref AWS::Region
          SNS_TOPIC_ARN: 
            Fn::ImportValue:
              !Sub "${SNSStackName}-TopicArn"
      Code:
        ZipFile: |
          import boto3
          import logging
          import os
          import json

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
            logger.info(event)
            logger.info(context)
            
            eventSubject=event[0]['Sns']['Subject']
            eventSubject = eventSubject.split()
            
            deploymentId=eventSubject[3]
            instanceId=eventSubject[8]
            
            logger.info(deploymentId)
            logger.info(instanceId)
            
            codedeploy=boto3.client('codedeploy')
            deployment_details=codedeploy.get_deployment(deploymentId=deploymentId)
            application_name=deployment_details['deploymentInfo']['applicationName']

            region=os.environ['REGION']
            environment=os.environ['ENV_NAME']
            client=boto3.client('ec2',region_name=region)
            instance_details=client.describe_instances(InstanceIds=[instanceId])
            publicIp=instance_details['Reservations'][0]['Instances'][0]['PublicIpAddress']
            message='Deployment ID:' + deploymentId + '\nEC2 ready for '+ application_name + '(' + environment + '). \nInstance ' + instanceId + ' IP address:' +  publicIp
            
            sns = boto3.client('sns')
            logger.info(message)
            
            topic=os.environ['SNS_TOPIC_ARN']
            sns.publish(
              TopicArn=topic,    
              Message=message
            )

  NotifyReadyFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref NotifyReadyFunction
      Principal: sns.amazonaws.com   

  NotifyReadyTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref NotifyReadyTopic
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sns:Publish
            Resource: !Ref NotifyReadyTopic
            Principal:
              AWS: '*'
            Condition:
              ArnLike:
                AWS:SourceArn: !Sub 'arn:aws:*:*:${AWS::AccountId}:*'

  BlueGreenDeploySuccessTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, bluegreen-deploy-OK]]

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentConfigName: !If [IsProd, CodeDeployDefault.AllAtOnce, CodeDeployDefault.OneAtATime]
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      TriggerConfigurations:
        - TriggerEvents:
            - DeploymentSuccess
            - DeploymentFailure
          TriggerName: DeploymentState
          TriggerTargetArn:
            Fn::ImportValue:
              !Sub "${SNSStackName}-TopicArn"
        - TriggerEvents:
            - DeploymentSuccess
          TriggerName: BlueGreenDeploySuccess
          TriggerTargetArn: !Ref BlueGreenDeploySuccessTopic
        - TriggerEvents:
            - InstanceReady
          TriggerName: InstanceReady
          TriggerTargetArn: !Ref NotifyReadyTopic
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
      Ec2TagFilters: #Iannis - Need to make this an auto-scaling group
      - Key: Name
        Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        Type: KEY_AND_VALUE

  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - !Join [".", [codedeploy, !Ref 'AWS::Region', amazonaws, com]]
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRole

  DeploymentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, code-deploy]]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 3
          Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, code-deploy]]
        - Key: Environment
          Value: !Ref EnvName

  DeploymentUserGroup:
    Type: AWS::IAM::Group
    Properties:
      Policies:
        - PolicyName: S3DeployBucketWriteAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Join ['',[!GetAtt DeploymentBucket.Arn, "/*"]]
        - PolicyName: DeploymentAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetDeployment
                Resource: !Join [':', ['arn:aws:codedeploy', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'deploymentgroup', !Join ['/', [!Ref CodeDeployApplication, !Ref CodeDeployDeploymentGroup]]]]
              - Effect: Allow
                Action:
                  - codedeploy:GetDeploymentConfig
                Resource:
                  - !Join [':', ['arn:aws:codedeploy', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'deploymentconfig', 'CodeDeployDefault.OneAtATime']]
                  - !Join [':', ['arn:aws:codedeploy', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'deploymentconfig', 'CodeDeployDefault.AllAtOnce']]
              - Effect: Allow
                Action:
                  - codedeploy:RegisterApplicationRevision
                  - codedeploy:GetApplicationRevision
                Resource: !Join [':', ['arn:aws:codedeploy', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'application', !Ref CodeDeployApplication]]

  CodePipelineApprovalUserGroup:
    Condition: HasCodePipeline
    Type: AWS::IAM::Group
    Properties:
      Policies:
        - PolicyName: ApproveRelease
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - codepipeline:PutApprovalResult
                Resource: !Join [':', [arn:aws:codepipeline, !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', [!Ref CodePipeline, Approval, Approval]]]]
              - Effect: Allow
                Action:
                  - codepipeline:RetryStageExecution
                Resource: !Join [':', [arn:aws:codepipeline, !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', [!Ref CodePipeline, Release]]]]

  CodePipelineServiceRole:
    Condition: HasCodePipeline
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codepipeline.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRole
      Policies:
        - PolicyName: CodeBuildAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
            - Effect: Allow
              Action:
                - codebuild:*
              Resource: 
                - !Join [':', [arn:aws:codebuild, !Ref 'AWS::Region', !Ref 'AWS::AccountId', '*' ]]
        - PolicyName: CodePipelineAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
            - Effect: Allow
              Action:
                - codedeploy:Get*
                - codedeploy:Create*
                - codedeploy:Register*
              Resource: 
                # - !Join ['', [!Join [':', [arn:aws:codedeploy, !Ref 'AWS::Region', !Ref 'AWS::AccountId', application, !Ref CodeDeployApplication]], '/*' ]]
                - !Join [':', [arn:aws:codedeploy, !Ref 'AWS::Region', !Ref 'AWS::AccountId', '*' ]]
            - Effect: Allow
              Action:
                - codepipeline:Get*
                - codepipeline:List*
                - codepipeline:Poll*
              Resource: !Join [':', ['arn:aws:codepipeline:', !Ref 'AWS::Region', !Ref 'AWS::AccountId', '*']]
            - Effect: Allow
              Action:
                - codepipeline:*
              Resource: !Join [':', ['arn:aws:codepipeline:', !Ref 'AWS::Region', !Ref 'AWS::AccountId', '*']]
        - PolicyName: S3DeploymentBucketAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
            - Effect: Allow
              Action:
                - s3:Get*
              Resource: !Join ['/', [!GetAtt DeploymentBucket.Arn, !Ref PipelineS3Object]]
            - Effect: Allow
              Action:
                - s3:Get*
                - s3:List*
                - s3:Put*
              Resource: 
                - !Join ['/', [!GetAtt DeploymentBucket.Arn, '*']]
                - !GetAtt DeploymentBucket.Arn
            - Effect: Allow
              Action:
                - s3:Put*
              Resource: !Join ['/', [!GetAtt DeploymentBucket.Arn, '*']]
 
  CodePipeline:
    Condition: HasCodePipeline
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, pipeline]]
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: S3
              OutputArtifacts:
                - Name: SourceOutput
              Configuration:
                S3Bucket: !Ref DeploymentBucket #!Select [ 1, !Split [ ':::', !Select [ 0, !Split [ '/', !Ref PipelineS3Object ]]]]
                S3ObjectKey: !Ref PipelineS3Object #!Select [ 1, !Split [ '/', !Ref PipelineS3Object ]]
              RunOrder: 1
        - Name: Approval
          Actions:
            - Name: Approval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Version: 1
                Provider: Manual
              Configuration:
                NotificationArn: 
                  Fn::ImportValue:
                    !Sub "${SNSStackName}-TopicArn"
                CustomData: Approval or Reject this change after running Exploratory Tests
        - Name: Release
          Actions:
            - Name: Release
              InputArtifacts:
                - Name: SourceOutput
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: 1
                Provider: CodeDeploy
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref CodeDeployDeploymentGroup
              RunOrder: 1
      ArtifactStore:
        Type: S3
        Location: !Ref DeploymentBucket

  DeploymentUser:
    Condition: HasCreateDeployUser
    Type: AWS::IAM::User
    Properties:
      UserName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, deploy-user]]
      Groups:
        - !Ref DeploymentUserGroup
  
  DeploymentUserAccessKey:
    Condition: HasCreateDeployUser
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref DeploymentUser

###
# Blue Green Section
###

# 1. When deployment succeeds, notify a topic
# 2. Lambda subscribes to topic
# 3. lambda looks at latest ASG name for app / dep group
# 4. lambda invoke top stack Id with new timestamp to refresh everything
# Need Top stack ID to be passed
# Need AutoScaling Group name to be an output

  LambdaGetBlueGreenASGNameFunctionExecutionRole:
    Condition: HasRootStackID
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal: {Service: [lambda.amazonaws.com]}
          Action: ['sts:AssumeRole']
      Path: "/"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AutoScalingReadOnlyAccess
      Policies:
        - PolicyName: AccessDeploymentGroup
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - codedeploy:GetDeploymentGroup
                Resource: !Join [':', ['arn:aws:codedeploy', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'deploymentgroup', !Join ['/', [!Ref CodeDeployApplication, !Ref CodeDeployDeploymentGroup]]]]

  LambdaGetBlueGreenASGNameFunction:
    Condition: HasRootStackID
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.lambda_handler
      Role: !GetAtt LambdaGetBlueGreenASGNameFunctionExecutionRole.Arn
      Runtime: python3.6
      Code:
        ZipFile: |
          import cfnresponse
          import json
          import logging
          import time
          import base64
          import string
          import random
          import boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def get_asg_instance_ids(AutoScalingGroupName):
              instance_ids=[];
              asg = boto3.client('autoscaling');
              instances = asg.describe_auto_scaling_groups(AutoScalingGroupNames=[AutoScalingGroupName])['AutoScalingGroups'][0]['Instances'];
              for inst in instances:
                instance_ids.append(inst['InstanceId']);
              return instance_ids;
              
          def lambda_handler(event, context):

              responseData={}
              physicalResourceId={}
              request_type = event['RequestType']
              
              try:
                logger.info('EVENT BODY:' + json.dumps(event))
              
                if request_type in ['Create', 'Update']:
                  client = boto3.client('codedeploy');
                  appname = event["ResourceProperties"]["ApplicationName"]
                  grpname = event["ResourceProperties"]["DeployGroupName"]
                  groupdef = client.get_deployment_group(applicationName=appname, deploymentGroupName=grpname)
                  if groupdef["deploymentGroupInfo"]["deploymentStyle"]["deploymentType"] == 'BLUE_GREEN':
                    asgname = groupdef["deploymentGroupInfo"]["autoScalingGroups"][0]["name"]
                    instances = get_asg_instance_ids(asgname)
                    responseData['BlueGreenAutoScalingGroupName'] = asgname
                    responseData['BlueGreenAutoScalingInstances'] = instances
                  else:
                    responseData['BlueGreenAutoScalingGroupName'] = ''
                    responseData['BlueGreenAutoScalingInstances'] = ''
                
                logger.info('RESPONSE BODY:' + json.dumps(responseData))
                send(event, context, cfnresponse.SUCCESS, responseData, physicalResourceId)
                return
              
                send(event, context, cfnresponse.SUCCESS, responseData, physicalResourceId)
                return
              
              except Exception:
              
                logger.exception('Error Encountered')
                send(event, context, cfnresponse.FAILED, responseData, physicalResourceId)
                return

          def send(event, context, responseStatus, responseData, physicalResourceId=None):
              resourceId = physicalResourceId or context.log_stream_name
              responseBody = {'Status': responseStatus,
                              'Reason': 'See the details in CloudWatch Log Stream: ' + context.log_stream_name,
                              'PhysicalResourceId': resourceId,
                              'StackId': event['StackId'],
                              'RequestId': event['RequestId'],
                              'LogicalResourceId': event['LogicalResourceId'],
                              'Data': responseData}
              
              logger.info('RESPONSE BODY:' + json.dumps(responseBody))
              cfnresponse.send(event, context, responseStatus, responseData, resourceId)
  
  LambdaUpdateRootStackFunctionExecutionRole:
    Condition: HasRootStackID
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal: {Service: [lambda.amazonaws.com]}
          Action: ['sts:AssumeRole']
      Path: "/"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AccessRootStack
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:UpdateStack
                Resource: !Ref RootStackID

  LambdaUpdateRootStackFunction:
    Condition: HasRootStackID
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.lambda_handler
      Role: !GetAtt LambdaUpdateRootStackFunctionExecutionRole.Arn
      Runtime: python3.6
      Environment:
        Variables:
          ROOT_STACK_ID: !Ref RootStackID
      Code:
        ZipFile: |
          import cfnresponse
          import json
          import logging
          import time
          import base64
          import string
          import os
          import random
          import boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def get_stack_params(stackname):
            resultparams=[];
            cf = boto3.client('cloudformation');
            logger.info('Requesting param for: ' + stackname)
            stacks = cf.describe_stacks(StackName=stackname)
            stack = stacks['Stacks'][0]
            params = stack["Parameters"]
            for param in params:
              resultparams.append(param['ParameterKey']);
            return resultparams;

          def refresh_stack(stackid, sameparams, timestamp):
            cf = boto3.client('cloudformation');
            logger.info('Updating params for: ' + stackid)
            
            stacks = cf.describe_stacks(StackName=stackid)
            updatedparams = []
            for sameparam in sameparams:
              if sameparam == 'BlueGreenTimeStamp':
                updatedparams.append({'ParameterKey': 'TimeStamp', 'ParameterValue': timestamp});
              else:
                updatedparams.append({'ParameterKey': sameparam, 'UsePreviousValue': True});
            
            logger.info('Updating params: ' + json.dumps(updatedparams))
            # cf.update_stacK(
            #   StackName=stackid,
            #   UsePreviousTemplate=True,
            #   Parameters=updatedparams,
            #   Capabilities=['CAPABILITY_IAM', 'CAPABILITY_NAMED_IAM', 'CAPABILITY_AUTO_EXPAND']
            # )
              
          def lambda_handler(event, context):
            try:
              logger.info('EVENT BODY:' + json.dumps(event))

              responseData={}
              physicalResourceId={}
              request_type = event['RequestType']
              stackid = os.environ['ROOT_STACK_ID']
              params = get_stack_params(stackid)
              logger.info('Stack Params:' + json.dumps(params))
              randomparam=''.join(random.choice(string.ascii_uppercase + string.digits) for _ in range(10))
              logger.info('Updating stack with timestamp:' + randomparam)
              
              refresh_stack(stackid, params, randomparam)
              
              responseData["BlueGreenTimeStamp"] = randomparam
              logger.info('RESPONSE BODY:' + json.dumps(responseData))
              send(event, context, cfnresponse.SUCCESS, responseData, physicalResourceId)
              return
            
              send(event, context, cfnresponse.SUCCESS, responseData, physicalResourceId)
              return
            
            except Exception:
            
              logger.exception('Error Encountered')
              send(event, context, cfnresponse.FAILED, responseData, physicalResourceId)
              return

          def send(event, context, responseStatus, responseData, physicalResourceId=None):
            resourceId = physicalResourceId or context.log_stream_name
            responseBody = {'Status': responseStatus,
                            'Reason': 'See the details in CloudWatch Log Stream: ' + context.log_stream_name,
                            'PhysicalResourceId': resourceId,
                            'StackId': event['StackId'],
                            'RequestId': event['RequestId'],
                            'LogicalResourceId': event['LogicalResourceId'],
                            'Data': responseData}
            
            logger.info('RESPONSE BODY:' + json.dumps(responseBody))
            cfnresponse.send(event, context, responseStatus, responseData, resourceId)

  BlueGreenDeploymentSuccessSubscription:
    Condition: HasRootStackID
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: lambda
      Endpoint: !GetAtt LambdaUpdateRootStackFunction.Arn
      TopicArn: !Ref BlueGreenDeploySuccessTopic

  # BlueGreenDeployment: #Enable only once Lambda is working / tested
  #   Condition: HasRootStackID
  #   Type: Custom::BlueGreenDeployment
  #   Properties:
  #     ServiceToken: !GetAtt LambdaGetBlueGreenASGNameFunction.Arn
  #     ApplicationName: !Ref CodeDeployApplication
  #     DeployGroupName: !Ref CodeDeployDeploymentGroup
  #     TimeStamp: !Ref BlueGreenTimeStamp

Outputs:

  DeploymentBucketArn:
    Description: The Arn of the Deployment Bucket
    Value: !GetAtt DeploymentBucket.Arn

  DeploymentBucketName:
    Description: The Name of the Deployment S3 Bucket
    Value: !Ref DeploymentBucket

  DeploymentUserAccessKey:
    Condition: HasCreateDeployUser
    Description: Access Key for the Deployment User
    Value: !Ref DeploymentUserAccessKey

  DeploymentUserSecretKey:
    Condition: HasCreateDeployUser
    Description: Secret Key for the Deployment User
    Value: !GetAtt DeploymentUserAccessKey.SecretAccessKey

  DeploymentUserGroup:
    Description: The Arn of the group allowed to perform deployment
    Value: !Ref DeploymentUserGroup

  CodeDeployApplicationName:
    Description: The name of the CodeDeploy application
    Value: !Ref CodeDeployApplication

