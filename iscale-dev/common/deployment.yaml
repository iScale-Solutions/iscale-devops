AWSTemplateFormatVersion: 2010-09-09
Description: This cloudformation template provisions all objects for blue green deployment

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - OrgName
          - EnvName
      - Label:
          default: Deployment Configuration
        Parameters:
          - CreateDeployUser
          - CreateCodePipeline
          - PipelineS3Object
      - Label:
          default: Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
      - Label:
          default: Disaster Recovery
        Parameters:
          - ReplicationDestinationBucketArn

    ParameterLabels:
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      CreateDeployUser:
        default: Create a deploy user ?
      CreateCodePipeline:
        default: Create a Code Pipeline ?
      PipelineS3Object:
        default: Pipeline S3 object to monitor
      ReplicationDestinationBucketArn:
        default: DR Region CodeDeploy Bucket ARN (CRR destination — leave blank for DR stacks)

Parameters:
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Development
    AllowedValues:
      - PreProd
      - Production
      - Staging
      - Development
      - Test
      - ProductionDR
      - StagingDR
      - DevelopmentDR
      - TestDR
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 16
  BlueGreenTimeStamp: #Reserved Name for Blue Green Auto Scaling Group update
    Description: Blue Green Timestamp (don't update this by hand)
    Type: String
    Default: ''
  CreateCodePipeline:
    Description: Set to TRUE to create a code pipeline
    Type: String
    Default: FALSE
    AllowedValues:
      - FALSE
      - TRUE
  CreateDeployUser:
    Description: Set to TRUE to create a new deploy user
    Type: String
    Default: FALSE
    AllowedValues:
      - FALSE
      - TRUE
  NetworkStackName:
    Description: The name of the cloudformation Network stack
    Type: String
    Default: iscale-dev-dev-uw2-network
  PipelineS3Object:
    Description: ARN of the S3 object to monitor (only if pipeline is created)
    Type: String
    Default: 'latest.zip'
  RootStackID:
    Description: ID of the parent (root) stack. Don't fill if no Blue Green updates are needed
    Type: String
    Default: ''
  SNSStackName:
    Description: The name of the cloudformation SNS stack
    Type: String
    Default: iscale-dev-dev-uw2-sns
  ReplicationDestinationBucketArn:
    Description: ARN of the DR region CodeDeploy bucket to replicate artifacts to. Leave blank for non-DR source stacks.
    Type: String
    Default: ''

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasCodePipeline: !Equals [!Ref CreateCodePipeline, TRUE]
  HasCreateDeployUser: !Equals [!Ref CreateDeployUser, TRUE]
  HasReplicationDestination: !Not [!Equals [!Ref ReplicationDestinationBucketArn, '']]

Resources:

  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, application]]
      ComputePlatform: Server

  NotifyReadyTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: lambda
          Endpoint: !GetAtt  NotifyReadyFunction.Arn

  NotifyReadyFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: AccessToDeploySetup
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - codedeploy:GetDeployment
                Resource: !Join [":", ["arn:aws:codedeploy", !Ref 'AWS::Region', !Ref 'AWS::AccountId', "deploymentgroup:*"]]
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                Resource: '*'

  NotifyReadyFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Give the IP address of a ready EC2 instance in an AutoScaling group
      Handler: index.lambda_handler
      Role: !GetAtt  NotifyReadyFunctionRole.Arn
      Runtime: python3.12
      Timeout: 60
      Environment:
        Variables:
          ENV_NAME: !Ref EnvName
          REGION: !Ref AWS::Region
          SNS_TOPIC_ARN: 
            Fn::ImportValue:
              !Sub "${SNSStackName}-TopicArn"
      Code:
        ZipFile: |
          import boto3
          import logging
          import os
          import json

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
            logger.info(event)
            logger.info(context)
            
            eventSubject=event[0]['Sns']['Subject']
            eventSubject = eventSubject.split()
            
            deploymentId=eventSubject[3]
            instanceId=eventSubject[8]
            
            logger.info(deploymentId)
            logger.info(instanceId)
            
            codedeploy=boto3.client('codedeploy')
            deployment_details=codedeploy.get_deployment(deploymentId=deploymentId)
            application_name=deployment_details['deploymentInfo']['applicationName']

            region=os.environ['REGION']
            environment=os.environ['ENV_NAME']
            client=boto3.client('ec2',region_name=region)
            instance_details=client.describe_instances(InstanceIds=[instanceId])
            publicIp=instance_details['Reservations'][0]['Instances'][0]['PublicIpAddress']
            message='Deployment ID:' + deploymentId + '\nEC2 ready for '+ application_name + '(' + environment + '). \nInstance ' + instanceId + ' IP address:' +  publicIp
            
            sns = boto3.client('sns')
            logger.info(message)
            
            topic=os.environ['SNS_TOPIC_ARN']
            sns.publish(
              TopicArn=topic,    
              Message=message
            )

  NotifyReadyFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref NotifyReadyFunction
      Principal: sns.amazonaws.com   

  NotifyReadyTopicAccessPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref NotifyReadyTopic
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sns:Publish
            Resource: !Ref NotifyReadyTopic
            Principal:
              AWS: '*'
            Condition:
              ArnLike:
                AWS:SourceArn: !Sub 'arn:aws:*:*:${AWS::AccountId}:*'

  CodeDeployStatusTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, codedeploy-status]]

  CodeDeployStatusTopicAccessPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref CodeDeployStatusTopic
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sns:Publish
            Resource: !Ref CodeDeployStatusTopic
            Principal:
              AWS: '*'
            Condition:
              ArnLike:
                AWS:SourceArn: !Sub 'arn:aws:*:*:${AWS::AccountId}:*'

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentConfigName: !If [IsProd, CodeDeployDefault.AllAtOnce, CodeDeployDefault.OneAtATime]
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      TriggerConfigurations:
        - TriggerEvents:
            - DeploymentSuccess
            - DeploymentFailure
          TriggerName: DeploymentState
          TriggerTargetArn:
            Fn::ImportValue:
              !Sub "${SNSStackName}-TopicArn"
        - TriggerEvents:
            - DeploymentSuccess
            - DeploymentFailure
          TriggerName: Deployment
          TriggerTargetArn: !Ref CodeDeployStatusTopic
        - TriggerEvents:
            - InstanceReady
          TriggerName: InstanceReady
          TriggerTargetArn: !Ref NotifyReadyTopic
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
      Ec2TagFilters: #Iannis - Need to make this an auto-scaling group
      - Key: Name
        Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        Type: KEY_AND_VALUE

  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - !Join [".", [codedeploy, !Ref 'AWS::Region', amazonaws, com]]
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRole
      Policies:
        - PolicyName: AccessToDeploySetup
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - iam:PassRole
                  - ec2:CreateTags
                  - ec2:RunInstances
                Resource: "*"

  DeploymentBucketReplicationRole:
    Condition: HasReplicationDestination
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3ReplicationPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetReplicationConfiguration
                Resource:
                  - !Join ['', ['arn:aws:s3:::', !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'code-deploy']]]]
                  - !Join ['', ['arn:aws:s3:::', !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, 'code-deploy']], '/*']]
              - Effect: Allow
                Action:
                  - s3:ReplicateObject
                  - s3:ReplicateDelete
                  - s3:ReplicateTags
                Resource: !Join ['/', [!Ref ReplicationDestinationBucketArn, '*']]

  DeploymentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, code-deploy]]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 3
          Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      ReplicationConfiguration: !If
        - HasReplicationDestination
        - Role: !GetAtt DeploymentBucketReplicationRole.Arn
          Rules:
            - Id: ReplicateToDR
              Status: Enabled
              Destination:
                Bucket: !Ref ReplicationDestinationBucketArn
                StorageClass: STANDARD
        - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, code-deploy]]
        - Key: Environment
          Value: !Ref EnvName

  DeploymentUserGroup:
    Type: AWS::IAM::Group
    Properties:
      Policies:
        - PolicyName: S3DeployBucketWriteAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Join ['',[!GetAtt DeploymentBucket.Arn, "/*"]]
        - PolicyName: DeploymentAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetDeployment
                  - codedeploy:ListDeploymentInstances
                Resource: !Join [':', ['arn:aws:codedeploy', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'deploymentgroup', !Join ['/', [!Ref CodeDeployApplication, !Ref CodeDeployDeploymentGroup]]]]
              - Effect: Allow
                Action:
                  - codedeploy:GetDeploymentConfig
                Resource:
                  - !Join [':', ['arn:aws:codedeploy', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'deploymentconfig', 'CodeDeployDefault.OneAtATime']]
                  - !Join [':', ['arn:aws:codedeploy', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'deploymentconfig', 'CodeDeployDefault.AllAtOnce']]
              - Effect: Allow
                Action:
                  - codedeploy:RegisterApplicationRevision
                  - codedeploy:GetApplicationRevision
                Resource: !Join [':', ['arn:aws:codedeploy', !Ref 'AWS::Region', !Ref 'AWS::AccountId', 'application', !Ref CodeDeployApplication]]
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances # add conditions to describe instances with certain tags (org-region-xxxx)
                Resource: '*'

  CodePipelineApprovalUserGroup:
    Condition: HasCodePipeline
    Type: AWS::IAM::Group
    Properties:
      Policies:
        - PolicyName: ApproveRelease
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - codepipeline:PutApprovalResult
                Resource: !Join [':', [arn:aws:codepipeline, !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', [!Ref CodePipeline, Approval, Approval]]]]
              - Effect: Allow
                Action:
                  - codepipeline:RetryStageExecution
                Resource: !Join [':', [arn:aws:codepipeline, !Ref 'AWS::Region', !Ref 'AWS::AccountId', !Join ['/', [!Ref CodePipeline, Release]]]]

  CodePipelineServiceRole:
    Condition: HasCodePipeline
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codepipeline.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRole
      Policies:
        - PolicyName: CodeBuildAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
            - Effect: Allow
              Action:
                - codebuild:*
              Resource: 
                - !Join [':', [arn:aws:codebuild, !Ref 'AWS::Region', !Ref 'AWS::AccountId', '*' ]]
        - PolicyName: CodePipelineAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
            - Effect: Allow
              Action:
                - codedeploy:Get*
                - codedeploy:Create*
                - codedeploy:Register*
              Resource: 
                # - !Join ['', [!Join [':', [arn:aws:codedeploy, !Ref 'AWS::Region', !Ref 'AWS::AccountId', application, !Ref CodeDeployApplication]], '/*' ]]
                - !Join [':', [arn:aws:codedeploy, !Ref 'AWS::Region', !Ref 'AWS::AccountId', '*' ]]
            - Effect: Allow
              Action:
                - codepipeline:Get*
                - codepipeline:List*
                - codepipeline:Poll*
              Resource: !Join [':', ['arn:aws:codepipeline:', !Ref 'AWS::Region', !Ref 'AWS::AccountId', '*']]
            - Effect: Allow
              Action:
                - codepipeline:*
              Resource: !Join [':', ['arn:aws:codepipeline:', !Ref 'AWS::Region', !Ref 'AWS::AccountId', '*']]
        - PolicyName: S3DeploymentBucketAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
            - Effect: Allow
              Action:
                - s3:Get*
              Resource: !Join ['/', [!GetAtt DeploymentBucket.Arn, !Ref PipelineS3Object]]
            - Effect: Allow
              Action:
                - s3:Get*
                - s3:List*
                - s3:Put*
              Resource: 
                - !Join ['/', [!GetAtt DeploymentBucket.Arn, '*']]
                - !GetAtt DeploymentBucket.Arn
            - Effect: Allow
              Action:
                - s3:Put*
              Resource: !Join ['/', [!GetAtt DeploymentBucket.Arn, '*']]
 
  CodePipeline:
    Condition: HasCodePipeline
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, pipeline]]
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: S3
              OutputArtifacts:
                - Name: SourceOutput
              Configuration:
                S3Bucket: !Ref DeploymentBucket #!Select [ 1, !Split [ ':::', !Select [ 0, !Split [ '/', !Ref PipelineS3Object ]]]]
                S3ObjectKey: !Ref PipelineS3Object #!Select [ 1, !Split [ '/', !Ref PipelineS3Object ]]
              RunOrder: 1
        - Name: Approval
          Actions:
            - Name: Approval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Version: 1
                Provider: Manual
              Configuration:
                NotificationArn: 
                  Fn::ImportValue:
                    !Sub "${SNSStackName}-TopicArn"
                CustomData: Approval or Reject this change after running Exploratory Tests
        - Name: Release
          Actions:
            - Name: Release
              InputArtifacts:
                - Name: SourceOutput
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: 1
                Provider: CodeDeploy
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref CodeDeployDeploymentGroup
              RunOrder: 1
      ArtifactStore:
        Type: S3
        Location: !Ref DeploymentBucket

  DeploymentUser:
    Condition: HasCreateDeployUser
    Type: AWS::IAM::User
    Properties:
      UserName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, deploy-user]]
      Groups:
        - !Ref DeploymentUserGroup
  
  DeploymentUserAccessKey:
    Condition: HasCreateDeployUser
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref DeploymentUser  

###
# Alarm management for Auto Scaling Group
###
  
  CPUUtilizationCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, cpu]]
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Average
      Threshold: 80
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'

  StatusChecksCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, status, check]]
      MetricName: StatusCheckFailed
      Namespace: AWS/EC2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Minimum
      Threshold: 1
      AlarmActions:
        - Fn::ImportValue: 
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'

  CPUCreditBalanceCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, cpu, credit]]
      MetricName: CPUCreditBalance
      Namespace: AWS/EC2
      ComparisonOperator: LessThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 300
      Statistic: Minimum
      Threshold: 24
      AlarmActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'
      OKActions:
        - Fn::ImportValue:
            !Sub '${SNSStackName}-TopicArn'

  UpdateAlarmLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, update, alarm]]
      Handler: index.lambda_handler
      Role: !GetAtt LambdaUpdateAlarmExecutionRole.Arn
      Runtime: python3.12
      Timeout: 900
      Environment:
        Variables:
          ASG_ALARMS: !Join [',',[!Ref CPUUtilizationCloudWatchAlarm, !Ref StatusChecksCloudWatchAlarm, !Ref CPUCreditBalanceCloudWatchAlarm]]
      Code:
        ZipFile: |

          import boto3
          import os
          import json
          import time

          def lambda_handler(event, context):

              cd = boto3.client('codedeploy')
              cw = boto3.client('cloudwatch')
              cloudwatch = boto3.resource('cloudwatch')
              asg = boto3.client('autoscaling')

              print('Event:' + json.dumps(event))

              SNS_MSG=event['Records'][0]['Sns']['Message']
              MSG=json.loads(SNS_MSG)

              STATUS=MSG['status']
              DEPLOYMENT_ID=MSG['deploymentId']
              # Get the new asg from the last successful deployment
              response=cd.get_deployment(deploymentId=DEPLOYMENT_ID)
              ASG=response['deploymentInfo']['targetInstances']['autoScalingGroups'][0]
              print("SNS Message:= " + SNS_MSG)
              print("Deployment Status:= " + STATUS)
              print("Deployment ID:= " + DEPLOYMENT_ID)
              print("AutoScaling Group:= " + ASG)

              if STATUS == 'SUCCEEDED':

                print("Updating cloudwatch AutoScaling group alarms")
                # Update cloudwatch alarm with the new ASG
                for ALARM in os.environ['ASG_ALARMS'].split(","):
                  # Get the existing parameters
                  # This will be used to update the new alarm
                  params = cw.describe_alarms(AlarmNames=[ALARM])

                  print("Changing alarm: " + params['MetricAlarms'][0]['AlarmName'] )
                  # Update the alarm with dimensions
                  metric = cloudwatch.Metric(params['MetricAlarms'][0]['Namespace'],
                                            params['MetricAlarms'][0]['MetricName'])
                  metric.put_alarm(
                      AlarmName=params['MetricAlarms'][0]['AlarmName'],
                      MetricName=params['MetricAlarms'][0]['MetricName'],
                      Namespace=params['MetricAlarms'][0]['Namespace'],
                      ComparisonOperator=params['MetricAlarms'][0]['ComparisonOperator'],
                      EvaluationPeriods=params['MetricAlarms'][0]['EvaluationPeriods'],
                      Period=params['MetricAlarms'][0]['Period'],
                      Statistic=params['MetricAlarms'][0]['Statistic'],
                      Threshold=params['MetricAlarms'][0]['Threshold'],
                      AlarmActions=params['MetricAlarms'][0]['AlarmActions'],
                      OKActions=params['MetricAlarms'][0]['OKActions'],
                      Dimensions=[
                          {
                              'Name': 'AutoScalingGroupName',
                              'Value': ASG
                          },]
                      )

              elif STATUS == 'FAILED':

                # wait for 10 minutes before actually deleting the asg
                time.sleep(600)
                print("deleting autoscaling group:= " + ASG)
                # Remove ASG after deployment
                asg.delete_auto_scaling_group(AutoScalingGroupName=ASG,ForceDelete=True)

  UpdateAlarmLambdaFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref UpdateAlarmLambdaFunction
      Principal: sns.amazonaws.com   

  LambdaUpdateAlarmExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Path: '/'
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: 
              - sts:AssumeRole
      Policies:
        - PolicyName: LambdaExecutionPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: 
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DescribeAlarms
                Resource: '*'
              - Effect: Allow
                Action: 
                  - codedeploy:GetDeploymentGroup
                  - codedeploy:UpdateDeploymentGroup
                  - codedeploy:GetDeployment
                  - autoscaling:DeleteAutoScalingGroup
                Resource: '*'
              - Effect: Allow
                Action: 
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*

  UpdateAlarmSubscriptionToCodeDeployStatusTopic:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !GetAtt UpdateAlarmLambdaFunction.Arn
      Protocol: lambda
      TopicArn: !Ref CodeDeployStatusTopic

Outputs:

  DeploymentBucketArn:
    Description: The Arn of the Deployment Bucket
    Value: !GetAtt DeploymentBucket.Arn

  DeploymentBucketName:
    Description: The Name of the Deployment S3 Bucket
    Value: !Ref DeploymentBucket

  DeploymentUserAccessKey:
    Condition: HasCreateDeployUser
    Description: Access Key for the Deployment User
    Value: !Ref DeploymentUserAccessKey

  DeploymentUserSecretKey:
    Condition: HasCreateDeployUser
    Description: Secret Key for the Deployment User
    Value: !GetAtt DeploymentUserAccessKey.SecretAccessKey

  DeploymentUserGroup:
    Description: The Arn of the group allowed to perform deployment
    Value: !Ref DeploymentUserGroup

  CodeDeployApplicationName:
    Description: The name of the CodeDeploy application
    Value: !Ref CodeDeployApplication

  CodeDeployDeploymentGroupName:
    Description: The Arn of the deployment group for the stack
    Value: !Ref CodeDeployDeploymentGroup

  BlueGreenAutoScalingGroupName:
    Description: The Arn of the deployment group for the stack
    # Value: !GetAtt BlueGreenDeployment.BlueGreenAutoScalingGroupName
    Value: ""
