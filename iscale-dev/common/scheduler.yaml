        - !Ref 'AWS::NoValue'
      Description: !Join [' ',[ "Stop", !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], "at a specified time"]]
      ScheduleExpression: !Ref StopScheduleExpression
      State: ENABLED
      Targets:
      - 
        Arn: !GetAtt StopDBClusterFunction.Arn
        Id: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, dbstop]]

  StopScheduledDBInstanceEventRule:
    Type: AWS::Events::Rule
    Condition: HasDBInstanceAndStopSchedule
    Properties:
      Name: !If
        - UseFriendlyNames
        - !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, db, stop]]
        - !Ref 'AWS::NoValue'
      Description: !Join [' ',[ "Stop", !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], "at a specified time"]]
      ScheduleExpression: !Ref StopScheduleExpression
      State: ENABLED
      Targets:
      - 
        Arn: !GetAtt StopDBInstanceFunction.Arn
        Id: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, dbstop]]

  StopScheduledASGEventRule:
    Type: AWS::Events::Rule
    Condition: HasCodeDeployAndStopSchedule
    Properties:
      Name: !If
        - UseFriendlyNames
        - !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, asg, stop]]
        - !Ref 'AWS::NoValue'
      Description: !Join [' ',[ "Stop", !Join ['-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]], "at a specified time"]]
      ScheduleExpression: !Ref StopScheduleExpression
      State:  ENABLED
      Targets:
      -
        Arn: !GetAtt StopDeploymentASGFunction.Arn
        Id: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, autoscalingstop]]

  ScheduledEventPermissionToStopDBCluster:
    Condition: HasDBClusterAndStopSchedule
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StopDBClusterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt StopScheduledDBClusterEventRule.Arn

  ScheduledEventPermissionToStopDBInstance:
    Condition: HasDBInstanceAndStopSchedule
    Type: AWS::Lambda::Permission
    Properties:
