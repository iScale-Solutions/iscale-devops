  ###
  # Stop AutoScaling Group
  ###

  StopDeploymentASGFunction:
    Condition: HasCodeDeployAndStopSchedule
    Type: AWS::Lambda::Function
    Properties:
      Description: Lambda Function bringing an autoscaling group size to 0
      Handler: index.lambda_handler
      Role: !GetAtt LambdaScheduleAutoScalingRole.Arn
      Runtime: python3.6
      Timeout: 60
      Environment:
        Variables:
          REGION: !Ref AWS::Region
          CODEDEPLOY_APP: !Ref CodeDeployApplicationName
          CODEDEPLOY_GROUP: !Ref CodeDeployDeploymentGroupName
      Code:
        ZipFile: |
          import boto3
          import logging
          import os

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
            region=os.environ['REGION']
            appName=os.environ['CODEDEPLOY_APP']
            groupName=os.environ['CODEDEPLOY_GROUP']

            try:
              codedeploy = boto3.client('codedeploy',region_name=region)

              logger.info('Retrieving Deployment Group details for : ' + str(appName) + '/' + str(groupName))
              response = codedeploy.get_deployment_group(
                            applicationName=appName,
                            deploymentGroupName=groupName
                          )
              
              logger.info(response)

              asgToStop=response['deploymentGroupInfo']['autoScalingGroups'][0]['name']
              logger.info('AutoScaling Group to reduce is : ' + str(asgToStop))

              logger.info('Making: ' + str(asgToStop) + ' desired size to 0.')
              autoscaling = boto3.client('autoscaling',region_name=region)
              response = autoscaling.set_desired_capacity(
                          AutoScalingGroupName=asgToStop,
                          DesiredCapacity=0,
                          HonorCooldown=False
                        )

              logger.info('AutoScaling group reduction complete with response: ' + str(response))

            except Exception:
              logger.exception('Error Encountered')

  StopDeploymentASGFunctionPermission:
