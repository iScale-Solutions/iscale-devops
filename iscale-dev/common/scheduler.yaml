            Resource: !GetAtt StopDeploymentASGFunction.Arn
      PolicyName: AllowStopAutoScalingGroup

  ###
  # Start AutoScaling Group
  ###

  StartDeploymentASGFunction:
    Condition: HasCodeDeployAndStartSchedule
    Type: AWS::Lambda::Function
    Properties:
      Description: Lambda Function bringing an autoscaling group size to 1
      Handler: index.lambda_handler
      Role: !GetAtt LambdaScheduleAutoScalingRole.Arn
      Runtime: python3.6
      Timeout: 60
      Environment:
        Variables:
          REGION: !Ref AWS::Region
          CODEDEPLOY_APP: !Ref CodeDeployApplicationName
          CODEDEPLOY_GROUP: !Ref CodeDeployDeploymentGroupName
          ASG_DESIRED_SIZE: !Ref CodeDeployASGDesiredSize
      Code:
        ZipFile: |
          import boto3
          import logging
          import os

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
            region=os.environ['REGION']
            appName=os.environ['CODEDEPLOY_APP']
            groupName=os.environ['CODEDEPLOY_GROUP']
            desiredSize=int(os.environ['ASG_DESIRED_SIZE'])

            try:
              codedeploy = boto3.client('codedeploy',region_name=region)

              logger.info('Retrieving Deployment Group details for : ' + str(appName) + '/' + str(groupName))
              response = codedeploy.get_deployment_group(
                            applicationName=appName,
                            deploymentGroupName=groupName
                          )
              
              logger.info(response)

              asgToStart=response['deploymentGroupInfo']['autoScalingGroups'][0]['name']
              logger.info('AutoScaling Group to augment is : ' + str(asgToStart))

              logger.info('Making: ' + str(asgToStart) + ' desired size to ' + str(desiredSize) + '.')
              autoscaling = boto3.client('autoscaling',region_name=region)
              response = autoscaling.set_desired_capacity(
                          AutoScalingGroupName=asgToStart,
                          DesiredCapacity=desiredSize,
                          HonorCooldown=False
                        )

              logger.info('AutoScaling group augmentation complete with response: ' + str(response))

            except Exception:
              logger.exception('Error Encountered')

  StartDeploymentASGFunctionPermission:
    Condition: HasCodeDeployAndStartSchedule
    Type: AWS::IAM::Policy
    Properties:
      Groups:
        - !Ref UserPermissionsGroup
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource: !GetAtt StartDeploymentASGFunction.Arn
      PolicyName: AllowStartAutoScalingGroup

####
# CloudWatch Section
####

  StartScheduledDBClusterEventRule:
    Type: AWS::Events::Rule
    Condition: HasDBClusterAndStartSchedule
    Properties:
      Name: !If
        - UseFriendlyNames
