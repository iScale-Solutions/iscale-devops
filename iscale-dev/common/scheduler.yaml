AWSTemplateFormatVersion: 2010-09-09
Description: A scheduler for Databases, individual EC2 instances, and autoscaling groups

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      -
        Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      
        Label:
          default: Scheduled Objects
        Parameters:
          - DatabaseClusterArn
          - DatabaseKInstanceArn
          - CodeDeployApplicationName
          - CodeDeployDeploymentGroupName

        Label:
          default: Schedules
        Parameters:
          - StartScheduleExpression
          - StopScheduleExpression

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      CodeDeployApplicationName:
        default: CodeDeploy Application name
      CodeDeployDeploymentGroupName:
        default: CodeDeploy Deployment Group name
      DatabaseClusterArn:
        default: Database Cluster ARN
      DatabaseInstanceArn:
        default: Database Instance ARN
      StartScheduleExpression:
        default: Start Schedule CRON Expression
      StopScheduleExpression:
        default: Stop Schedule CRON Expression

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 9
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  CodeDeployApplicationName:
    Description: Name of the CodeDeploy Application
    Type: String
    Default: ""
  CodeDeployDeploymentGroupName:
    Description: Name of the CodeDeploy Deployment Group for the application
    Type: String
    Default: ""
  DatabaseClusterArn:
    Description: The name of a database cluster
    Type: String
    Default: ""
  DatabaseInstanceArn:
    Description: The name of a database instance
    Type: String
    Default: ""
  StartScheduleExpression:
    Description: Schedule expression when to start the objects
    Type: String
    Default: cron(0 0 ? * MON-FRI *)
  StopScheduleExpression:
    Description: Schedule expression when to stop the objects
    Type: String
    Default: cron(0 10 ? * MON-FRI *)
  UseFriendlyNames:
    Description: Set to TRUE to have nice formatted scheduler event names
    Type: String
    AllowedValues:
      - TRUE
      - FALSE
    Default: TRUE

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasStartSchedule: !Not [!Equals [!Ref StartScheduleExpression, ""]]
  HasStopSchedule: !Not [!Equals [!Ref StopScheduleExpression, ""]]
  HasDBCluster: !Not [!Equals [!Ref DatabaseClusterArn, ""]]
  HasDBInstance: !Not [!Equals [!Ref DatabaseInstanceArn, ""]]
  HasDBClusterAndStartSchedule: !And [Condition: HasDBCluster, Condition: HasStartSchedule]
  HasDBInstanceAndStartSchedule: !And [Condition: HasDBInstance, Condition: HasStartSchedule]
  HasDBClusterAndStopSchedule: !And [Condition: HasDBCluster, Condition: HasStopSchedule]
  HasDBInstanceAndStopSchedule: !And [Condition: HasDBInstance, Condition: HasStopSchedule]
  HasCodeDeploy: !And [!Not [!Equals [!Ref CodeDeployApplicationName, ""]], !Not [!Equals [!Ref CodeDeployDeploymentGroupName, ""]]]
  HasCodeDeployAndStartSchedule: !And [Condition: HasCodeDeploy, Condition: HasStartSchedule]
  HasCodeDeployAndStopSchedule: !And [Condition: HasCodeDeploy, Condition: HasStopSchedule]
  UseFriendlyNames: !Equals [!Ref UseFriendlyNames, TRUE]

Resources:

####
# IAM Section
####

  LambdaScheduleDBClusterRole:
    Condition: HasDBCluster
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        -
          PolicyName: ScheduleDBClusterPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              -
                Effect: Allow
                Action:
                  - rds:DescribeDBClusters
                  - rds:StopDBCluster
                  - rds:StartDBCluster
                Resource: !Ref DatabaseClusterArn
              -
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"

  LambdaScheduleDBInstanceRole:
    Condition: HasDBInstance
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        -
          PolicyName: ScheduleDBClusterPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              -
                Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                  - rds:StopDBInstance
                  - rds:StartDBInstance
                Resource: !Ref DatabaseInstanceArn
              -
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"

  LambdaScheduleAutoScalingRole:
    Condition: HasCodeDeploy
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        -
          PolicyName: ScheduleAutoScalingPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              -
                Effect: Allow
                Action:
                  - codedeploy:GetDeploymentGroup
                Resource: !Join [":", ["arn:aws:codedeploy", !Ref 'AWS::Region', !Ref 'AWS::AccountId', "deploymentgroup", !Join ['/', [!Ref CodeDeployApplicationName, !Ref CodeDeployDeploymentGroupName]]]]
              -
                Effect: Allow
                Action:
                  - autoscaling:SetDesiredCapacity
                  #the auto scaling group name will change dynamically with blue green and needs to be made a bit wide here. However client name should still be there
                Resource: !Join [":", ["arn:aws:autoscaling", !Ref 'AWS::Region', !Ref 'AWS::AccountId', "autoScalingGroup", '*', !Join ['', ['autoScalingGroupName/', !Join ['', ['*', !Ref Name, '*']]]]]]

####
# Lambda Section
####

  StartDBClusterFunction:
    Condition: HasDBClusterAndStartSchedule
    Type: AWS::Lambda::Function
    Properties:
      Description: Lambda Function starting a DB cluster
      Handler: index.lambda_handler
      Role: !GetAtt LambdaScheduleDBClusterRole.Arn
      Runtime: python3.6
      Timeout: 60
      Environment:
        Variables:
          REGION: !Ref AWS::Region
          CLUSTER_ID: !Ref DatabaseClusterArn
      Code:
        ZipFile: |

          import boto3
          import logging
          import os

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
              
          def lambda_handler(event, context):
            region=os.environ['REGION']
            ClusterID=os.environ['CLUSTER_ID']
            
            try:
              rds = boto3.client('rds',region_name=region)

              logger.info('Starting DB Cluster : ' + str(ClusterID))
              rds.start_db_cluster(DBClusterIdentifier=ClusterID)

            except Exception:
              logger.exception('Error Encountered')

  StartDBInstanceFunction:
    Condition: HasDBInstanceAndStartSchedule
    Type: AWS::Lambda::Function
    Properties:
      Description: Lambda Function starting a DB instance
      Handler: index.lambda_handler
      Role: !GetAtt LambdaScheduleDBInstanceRole.Arn
      Runtime: python3.6
      Timeout: 60
      Environment:
        Variables:
          REGION: !Ref AWS::Region
          INSTANCE_ID: !Ref DatabaseInstanceArn
      Code:
        ZipFile: |

          import boto3
          import logging
          import os

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
              
          def lambda_handler(event, context):
            region=os.environ['REGION']
            InstanceID=os.environ['INSTANCE_ID']
            
            try:
              rds = boto3.client('rds',region_name=region)

              logger.info('Starting DB Instance : ' + str(InstanceID))
              rds.start_db_Instance(DBInstanceIdentifier=InstanceID)

            except Exception:
              logger.exception('Error Encountered')

