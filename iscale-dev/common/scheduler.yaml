    Condition: HasDBClusterAndStopSchedule
    Type: AWS::Lambda::Function
    Properties:
      Description: Lambda Function stopping a DB cluster
      Handler: index.lambda_handler
      Role: !GetAtt LambdaScheduleDBClusterRole.Arn
      Runtime: python3.6
      Timeout: 60
      Environment:
        Variables:
          REGION: !Ref AWS::Region
          CLUSTER_ID: !Ref DatabaseClusterArn
      Code:
        ZipFile: |

          import boto3
          import logging
          import os

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
              
          def lambda_handler(event, context):
