Outputs:

  LoadBalancerArn: 
    Description: The Arn of the Load Balancer
    Value: !Ref LoadBalancer
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerArn"

  CanonicalHostedZoneID: 
    Description: The ID of the Amazon Route 53 hosted zone associated with the load balancer
    Value: !GetAtt LoadBalancer.CanonicalHostedZoneID
    Export:
      Name: !Sub "${AWS::StackName}-CanonicalHostedZoneID"

  DNSName: 
    Description: The DNS name for the load balancer
    Value: !GetAtt LoadBalancer.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-DNSName"

  LoadBalancerFullName: 
    Description: The full name of the load balancer
    Value: !GetAtt LoadBalancer.LoadBalancerFullName
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerFullName"

  LoadBalancerName: 
    Description: The name of the load balancer
    Value: !GetAtt LoadBalancer.LoadBalancerName
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerName"

  SecurityGroupId: 
    Description: The security group ID of the load balancer
    Value: !GetAtt ELBSecurityGroup.GroupId
    Export:
      Name: !Sub "${AWS::StackName}-SecurityGroupId"

  HttpListenerArn: 
    Description: The HTTP listener arn of the application load balancer 
    Value: !Ref LoadBalancerHTTPListener
    Export:
      Name: !Sub "${AWS::StackName}-HttpListenerArn"
  
  ApplicationListenerArn:
    Condition: IsApplication
    Description: The HTTPS listener arn of the application load balancer 
    Value: !Ref LoadBalancerHTTPSListener
    Export:
      Name: !Sub "${AWS::StackName}-ApplicationListenerArn"

  NetworkListenerArn:
    Condition: IsNetwork
    Description: The listener arn of the network load balancer 
    Value: !Ref LoadBalancerNetworkListener
    Export:
      Name: !Sub "${AWS::StackName}-NetworkListenerArn"