AWSTemplateFormatVersion: 2010-09-09
Description: This cloudformation template provisions a load balancer

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Load Balancer Configuration
        Parameters:
          - DeletionProtection
          - ElbType
          - Scheme
          - ElbSource
          - ElbHTTPPort
          - ElbHTTPSPort
          - ElbProtocol
          - IdleTimeout
          - InstancePort
          - UseFriendlyNames
          - TargetType
          - XForwardedForHeader
          - PreserveHostHeader
          - TgStickinessEnable
          - TgStickinessType
          - TgStickinessAppCookieName
          - TgStickinessAppCookieDuration
          - TgDeregistrationDelay
      - Label:
          default: Network Configuration
        Parameters:
          - CustomSubnet1
          - CustomSubnet2
          - CustomSubnet3
      - Label:
          default: Certificate Configuration
        Parameters:
          - CertificateId
          - SslPolicy

    ParameterLabels:
      Name:
        default: Resource Name
      CustomSubnet1:
        defaut: Custom Subnet to use (only if not using AZ1 and AZ2) - Works only for ALB
      CustomSubnet2:
        defaut: Custom Subnet to use (only if not using AZ1 and AZ2) - Works only for ALB
      CustomSubnet3:
        defaut: Custom Subnet to use (only if not using AZ1 and AZ2) - Works only for ALB
      DeletionProtection:
        default: Deletion Protection
      ElbType:
        default: Load Balancer Type
      Scheme:
        default: Load Balancer Scheme
      ElbSource:
        default: Load Balancer Source CiDR Block
      ElbHTTPPort:
        default: Load Balancer HTTP Port
      ElbHTTPSPort:
        default: Load Balancer HTTPS Port
      ElbProtocol:
        default: Load Balancer Protocol
      TargetType:
        default: Target type
      IdleTimeout:
        default: Idle Timeout
      XForwardedForHeader:
        default: X-Forwarded-For header
      PreserveHostHeader:
        default: Preserve host header
      TgStickinessEnable:
        default: Stickiness
      TgStickinessType:
        default: Stickiness Type
      TgStickinessAppCookieName:
        default: App cookie name
      TgStickinessAppCookieDuration:
        default: App cookie stickiness duration
      TgDeregistrationDelay:
        default: Target deregistration delay
      InstancePort:
        default: Instance Port
      CertificateId:
        default: Certificate ID
      SslPolicy:
        default: SSL Policy
      UseFriendlyNames:
        default: Use friendly names

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 16
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  CustomSubnet1:
    Description: Custom subnet 1 to use
    Type: String
    Default: ''
  CustomSubnet2:
    Description: Custom subnet 2 to use
    Type: String
    Default: ''
  CustomSubnet3:
    Description: Custom subnet 3 to use
    Type: String
    Default: ''
  DeletionProtection:
    Description: Set to true to enable deletion protection (for production only)
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  ElbType:
    Description: The type of Load Balancer.
    Type: String
    Default: application
    AllowedValues:
      - application
      - network
  Scheme:
    Description: Whether your Load Balancer is public (internet-facing) or private (internal).
    Type: String
    Default: internet-facing
    AllowedValues:
      - internal
      - internet-facing
  SslPolicy:
    Description: The SSL Policy used by the load balancer
    Type: String
    Default: ELBSecurityPolicy-TLS13-1-2-2021-06 #ELBSecurityPolicy-TLS-1-2-2017-01
  ElbSource:
    Description: The source CiDR block which the load balancer accepts traffic.
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '((\d{1,3})\.){3}\d{1,3}/\d{1,2}'
  ElbHTTPPort:
    Description: The Load Balancer HTTP port. Set to 0 to disable HTTP
    Type: Number
    Default: 80
  ElbHTTPSPort:
    Description: The Load Balancer HTTPS port.
    Type: Number
    Default: 443
  ElbProtocol:
    Description: The Load Balancer protocol.
    Type: String
    Default: HTTPS
    AllowedValues:
      - HTTP
      - HTTPS
      - TCP
      - TCP_UDP
      - TLS
      - UDP
  TargetType:
    Description: Target type.
    Type: String
    Default: instance
    AllowedValues:
      - instance
      - ip
      - lambda
      - alb
  HealthCheckIntervalSeconds:
    Description: The approximate amount of time, in seconds, between health checks of an individual target
    Type: Number
    Default: 10
  HealthCheckPath:
    Description: The ping path that is the destination on the targets for health checks
    Type: String
    Default: /health.php
  HealthCheckTimeoutSeconds:
    Description: The amount of time, in seconds, during which no response from a target means a failed health check.
    Type: Number
    Default: 2
  HealthyThresholdCount:
    Description: The number of consecutive health checks successes required before considering an unhealthy target healthy
    Type: Number
    Default: 2
  UnhealthyThresholdCount:
    Description: The number of consecutive health check failures required before considering a target unhealthy
    Type: Number
    Default: 3
  HttpCodes:
    Description: The HTTP codes to use when checking for a successful response from a target
    Type: Number
    Default: 200
  IdleTimeout:
    Description: The number of Idle seconds before timeout
    Type: Number
    Default: 300
  XForwardedForHeader:
    Description: Preserve or remove the X-Forwarded-For header in the HTTP request before the ALB sends the request to the target
    Type: String
    Default: append
    AllowedValues:
      - append
      - preserve
      - remove
  PreserveHostHeader:
    Description: Indicates whether the ALB should preserve the Host header in the HTTP request and send it to the target without any change
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  TgStickinessEnable:
    Description: Enable target stickiness or not
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  TgStickinessType:
    Description: Stickiness Type
    Type: String
    Default: app_cookie
    AllowedValues:
      - app_cookie
      - lb_cookie
  TgStickinessAppCookieName:
    Description: Name of the application-based cookie
    Type: String
    Default: ''
  TgStickinessAppCookieDuration:
    Description: Timeout seconds which requests from a client should be routed to the same target. After this time period expires, the application-based cookie is considered stale.
    Type: Number
    Default: 86400 # 1 day
  TgDeregistrationDelay:
    Description: Target deregistration delay (seconds)
    Type: Number
    Default: 300
  InstancePort:
    Description: The port on which the targets receive traffic.
    Type: Number
    Default: 80
  CertificateArn:
    Description: The default certificate Arn to be attached to the Load Balancer.
    Type: String
    Default: ''
  EnableWebAcl:
    Description: Set to true to enable Web ACL. Otherwise, set to false.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  EnableAlarm:
    Description: Set to true to enable cloudwatch alarm. Otherwise, set to false.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  DeployPaidResources:
    Description: |
      Option 1 (default, true): Deploy everything — Load Balancer, EIPs, access log bucket, and listeners are created.
      Option 2 (false): Deploy only free-tier resources. Load Balancer, EIPs, access log bucket, and all listeners are suppressed. Target groups and security groups are still created.
    Type: String
    Default: true
    AllowedValues:
      - true
      - false
  NetworkStackName:
    Description: The name of the cloudformation Network stack
    Type: String
    Default: iscale-dev-dev-uw2-network
  SNSStackName:
    Description: The name of the cloudformation SNS stack
    Type: String
    Default: iscale-dev-dev-uw2-sns
  UseCustomSubnets:
    Description: Set to true to enable custom subnets
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  UseFriendlyNames:
    Description: Set to true to enable friendly names
    Type: String
    Default: true
    AllowedValues:
      - true
      - false

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasCustomSubnets: !Not [!Equals [!Ref CustomSubnet1, '']]
  HasCustomSubnet2: !Not [!Equals [!Ref CustomSubnet2, '']]
  HasCustomSubnet3: !Not [!Equals [!Ref CustomSubnet3, '']]
  HasSSLCert: !Not [!Equals [!Ref CertificateArn, '']]
  IsApplication: !Equals [!Ref ElbType, application]
  IsHTTPEnabled: !Not [!Equals [!Ref ElbHTTPPort, 0]]
  IsApplicationHTTPEnabled: !And [Condition: IsApplication, Condition: IsHTTPEnabled]
  IsNetwork: !Equals [!Ref ElbType, network]
  IsInstanceSsl: !Equals [!Ref InstancePort, 443]
  IsInternalFacing: !Equals [!Ref Scheme, internal]
  IsInternetFacing: !Not [Condition: IsInternalFacing]
  IsInternalApplication: !And [Condition: IsApplication, Condition: IsInternalFacing, Condition: IsHTTPEnabled]
  IsInternetApplication: !And [Condition: IsApplication, Condition: IsInternetFacing, Condition: IsHTTPEnabled]
  IsInternetApplicationSSL: !And [Condition: IsApplication, Condition: IsInternetFacing, Condition: HasSSLCert]
  IsEnableWebAcl: !Equals [!Ref EnableWebAcl, true]
  IsEnableAlarm: !Equals [!Ref EnableAlarm, true]
  UseFriendlyNames: !Equals [!Ref UseFriendlyNames, true]
  IsStickinessEnabled: !Equals [!Ref TgStickinessEnable, true]
  IsDeployPaidResources: !Equals [!Ref DeployPaidResources, true]
  IsNetworkAndPaid: !And [Condition: IsNetwork, Condition: IsDeployPaidResources]
  IsInternetApplicationAndPaid: !And [Condition: IsInternetApplication, Condition: IsDeployPaidResources]
  IsInternalApplicationAndPaid: !And [Condition: IsInternalApplication, Condition: IsDeployPaidResources]
  IsInternetApplicationSSLAndPaid: !And [Condition: IsInternetApplicationSSL, Condition: IsDeployPaidResources]
  IsApplicationHTTPEnabledAndPaid: !And [Condition: IsApplicationHTTPEnabled, Condition: IsDeployPaidResources]
  IsEnableWebAclAndPaid: !And [Condition: IsEnableWebAcl, Condition: IsDeployPaidResources]

Resources: 

####
# VPC Section
####

  ELBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsApplication
    Properties:
      GroupName: !If
        - UseFriendlyNames
        - !Join [ '-', [ !Ref Name, !FindInMap [ ElbTypeShort, !Ref ElbType, Name ]]]
        - !Ref 'AWS::NoValue'
      GroupDescription: !Join [ '-', [ !Ref Name, !FindInMap [ ElbTypeShort, !Ref ElbType, Name ]]]
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'
      Tags:
        - Key: Name
          Value: !Join [ '-', [ !Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, !FindInMap [ ElbTypeShort, !Ref ElbType, Name ]]]

  ELBSecurityGroupHTTPSIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: IsInternetApplicationSSL
    Properties:
      GroupId: !GetAtt ELBSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: !Ref ElbHTTPSPort
      ToPort: !Ref ElbHTTPSPort
      CidrIp: !Ref ElbSource

  ELBSecurityGroupHTTPIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: IsInternetApplication
    Properties:
      GroupId: !GetAtt ELBSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: !Ref ElbHTTPPort
      ToPort: !Ref ElbHTTPPort
      CidrIp: !Ref ElbSource

  ELBSecurityGroupEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: IsApplication
    Properties:
      GroupId: !GetAtt ELBSecurityGroup.GroupId
      IpProtocol: -1
      FromPort: -1
      ToPort: -1
      CidrIp:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcCidrBlock'

  ELBElasticIp1:
    Type: AWS::EC2::EIP
    Condition: IsNetworkAndPaid
    Properties:
      Domain: vpc

  ELBElasticIp2:
    Type: AWS::EC2::EIP
    Condition: IsNetworkAndPaid
    Properties:
      Domain: vpc

  LoadBalancerAccessLogsBucket:
    Type: AWS::S3::Bucket
    Condition: IsDeployPaidResources
    Properties:
      #AccessControl: LogDeliveryWrite
      BucketName: !Join [ '-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !FindInMap [ ElbTypeShort, !Ref ElbType, Name ], !Ref Name, access, logs]]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 3
          Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  LoadBalancerAccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: IsDeployPaidResources
    Properties:
      Bucket: !Ref LoadBalancerAccessLogsBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowWrite
            Effect: Allow
            Principal:
              AWS: !Join [':', [arn, aws, 'iam:', !FindInMap [RegionElbAccount, !Ref 'AWS::Region', Account], root]]
            Action: s3:PutObject
            Resource: !Join ["/", [!GetAtt LoadBalancerAccessLogsBucket.Arn, AWSLogs, !Ref 'AWS::AccountId', '*']]
          - Sid: AWSLogDeliveryWrite
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: s3:PutObject
            Resource: !Join ["/", [!GetAtt LoadBalancerAccessLogsBucket.Arn, AWSLogs, !Ref 'AWS::AccountId', '*']]
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
          - Sid: AWSLogDeliveryAclCheck
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt LoadBalancerAccessLogsBucket.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !FindInMap [RegionElbAccount, !Ref 'AWS::Region', Account]

  LoadBalancer:
    DependsOn: LoadBalancerAccessLogsBucketPolicy
    Condition: IsDeployPaidResources
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      IpAddressType: ipv4
      LoadBalancerAttributes: !If
        - IsNetwork
        - - Key: deletion_protection.enabled
            Value: !If [IsProd, !Ref DeletionProtection, false]
          - Key: access_logs.s3.enabled
            Value: true
          - Key: access_logs.s3.bucket
            Value: !Ref LoadBalancerAccessLogsBucket
        - - Key: idle_timeout.timeout_seconds
            Value: !Ref IdleTimeout
          - Key: deletion_protection.enabled
            Value: !If [IsProd, !Ref DeletionProtection, false]
          - Key: access_logs.s3.enabled
            Value: true
          - Key: access_logs.s3.bucket
            Value: !Ref LoadBalancerAccessLogsBucket
          - Key: routing.http.xff_header_processing.mode
            Value: !Ref XForwardedForHeader
          - Key: routing.http.preserve_host_header.enabled
            Value: !Ref PreserveHostHeader
      Name: !Join [ '-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !FindInMap [ ElbTypeShort, !Ref ElbType, Name ], !Ref Name]]
      # Name: !If
      #   - UseFriendlyNames
      #   - !Join [ '-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !FindInMap [ ElbTypeShort, !Ref ElbType, Name ], !Ref Name]]
      #   - !Ref 'AWS::NoValue'
      Scheme: !Ref Scheme
      SecurityGroups: [!If [ IsApplication, !GetAtt ELBSecurityGroup.GroupId, !Ref 'AWS::NoValue']]
      Subnets: !If
        - IsApplication
        - !If
          - HasCustomSubnets
          - !If
              - HasCustomSubnet3
              - - !Ref CustomSubnet1
                - !Ref CustomSubnet2
                - !Ref CustomSubnet3
              - !If
                - HasCustomSubnet2
                - - !Ref CustomSubnet1
                  - !Ref CustomSubnet2
                - - !Ref CustomSubnet1
          - !If
            - IsInternetFacing
            - - Fn::ImportValue:
                  !Sub '${NetworkStackName}-PublicSubnetId1'
              - Fn::ImportValue:
                  !Sub '${NetworkStackName}-PublicSubnetId2'
            - - Fn::ImportValue:
                  !Sub '${NetworkStackName}-PrivateSubnetId1'
              - Fn::ImportValue:
                  !Sub '${NetworkStackName}-PrivateSubnetId2'
        - !Ref 'AWS::NoValue'
      SubnetMappings: !If
        - IsNetwork
        - !If
          - IsInternetFacing
          - - SubnetId:
                Fn::ImportValue:
                  !Sub '${NetworkStackName}-PublicSubnetId1'
              AllocationId: !GetAtt ELBElasticIp1.AllocationId
            - SubnetId:
                Fn::ImportValue:
                  !Sub '${NetworkStackName}-PublicSubnetId2'
              AllocationId: !GetAtt ELBElasticIp2.AllocationId
          - !Ref 'AWS::NoValue'
        - !Ref 'AWS::NoValue'
      Type: !Ref ElbType
      Tags:
        - Key: Name
          Value: !Join [ '-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, !FindInMap [ ElbTypeShort, !Ref ElbType, Name ]]]

  # This listener redirects HTTP request to https
  LoadBalancerHTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: IsInternetApplicationAndPaid
    Properties:
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: !Ref ElbHTTPSPort
            Host: '#{host}'
            Path: '/#{path}'
            Query: '#{query}'
            StatusCode: HTTP_301
      LoadBalancerArn: !Ref LoadBalancer
      Port: !Ref ElbHTTPPort
      Protocol: HTTP

  LoadBalancerHTTPListenerInternal:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: IsInternalApplicationAndPaid
    Properties:
      Port: !Ref ElbHTTPPort
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApplicationTargetGroup
      LoadBalancerArn: !Ref LoadBalancer

  # Listener for application load balancer
  LoadBalancerHTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: IsInternetApplicationSSLAndPaid
    Properties:
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApplicationTargetGroup
      LoadBalancerArn: !Ref LoadBalancer
      Port: !Ref ElbHTTPSPort
      Protocol: HTTPS
      SslPolicy: !Ref SslPolicy

  # Listener for application load balancer
  LoadBalancerNetworkListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: IsNetworkAndPaid
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref NetworkTargetGroup
      LoadBalancerArn: !Ref LoadBalancer
      Port: !Ref ElbHTTPSPort
      Protocol: !Ref ElbProtocol

  # Application Target Group
  ApplicationTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: IsApplication
    Properties:
      HealthCheckIntervalSeconds: !Ref HealthCheckIntervalSeconds
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckProtocol: !If [IsInstanceSsl, HTTPS, HTTP]
      HealthCheckTimeoutSeconds: !Ref HealthCheckTimeoutSeconds
      HealthyThresholdCount: !Ref HealthyThresholdCount
      UnhealthyThresholdCount: !Ref UnhealthyThresholdCount
      Matcher:
        HttpCode: !Ref HttpCodes
      Port: !Ref InstancePort
      Protocol: !If [IsInstanceSsl, HTTPS, HTTP]
      TargetType: !Ref TargetType
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'
      TargetGroupAttributes: !If
        - IsStickinessEnabled
        - - Key: stickiness.enabled
            Value: !Ref TgStickinessEnable
          - Key: stickiness.type
            Value: !Ref TgStickinessType
          - Key: stickiness.app_cookie.cookie_name
            Value: !Ref TgStickinessAppCookieName
          - Key: stickiness.app_cookie.duration_seconds
            Value: !Ref TgStickinessAppCookieDuration
          - Key: deregistration_delay.timeout_seconds
            Value: !Ref TgDeregistrationDelay
        - - Key: deregistration_delay.timeout_seconds
            Value: !Ref TgDeregistrationDelay
      Tags:
        - Key: Name
          Value: !Join [ '-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !FindInMap [ ElbTypeShort, !Ref ElbType, Name ], !Ref Name]]

  # Network Target Group
  NetworkTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: IsNetwork
    Properties:
      Port: !Ref InstancePort
      Protocol: !Ref ElbProtocol
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'
      Tags:
        - Key: Name
          Value: !Join [ '-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !FindInMap [ ElbTypeShort, !Ref ElbType, Name ], !Ref Name]]

####
# WAF Section
####

  WebAcl:
    Type: AWS::WAFRegional::WebACL
    Condition: IsEnableWebAclAndPaid
    Properties:
      Name: !Join ['-', [!Ref Name,webacl]]
      MetricName: !Join
        - ''
        - - !Select [0, !Split ['-', !Sub '${AWS::StackName}']]
          - !Select [1, !Split ['-', !Sub '${AWS::StackName}']]
          - !Select [2, !Split ['-', !Sub '${AWS::StackName}']]
      DefaultAction: 
        Type: ALLOW

  WebAclAssociation:
    Type: AWS::WAFRegional::WebACLAssociation
    Condition: IsEnableWebAclAndPaid
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLId: !Ref WebAcl

Outputs:

  LoadBalancerArn:
    Condition: IsDeployPaidResources
    Description: The Arn of the Load Balancer
    Value: !Ref LoadBalancer
    Export:
      Name: !Sub '${AWS::StackName}-LoadBalancerArn'

  CanonicalHostedZoneID:
    Condition: IsDeployPaidResources
    Description: The ID of the Amazon Route 53 hosted zone associated with the load balancer
    Value: !GetAtt LoadBalancer.CanonicalHostedZoneID
    Export:
      Name: !Sub '${AWS::StackName}-CanonicalHostedZoneID'

  DNSName:
    Condition: IsDeployPaidResources
    Description: The DNS name for the load balancer
    Value: !GetAtt LoadBalancer.DNSName
    Export:
      Name: !Sub '${AWS::StackName}-DNSName'

  LoadBalancerFullName:
    Condition: IsDeployPaidResources
    Description: The full name of the load balancer
    Value: !GetAtt LoadBalancer.LoadBalancerFullName
    Export:
      Name: !Sub '${AWS::StackName}-LoadBalancerFullName'

  LoadBalancerName:
    Condition: IsDeployPaidResources
    Description: The name of the load balancer
    Value: !GetAtt LoadBalancer.LoadBalancerName
    Export:
      Name: !Sub '${AWS::StackName}-LoadBalancerName'

  LoadBalancerType:
    Condition: IsDeployPaidResources
    Description: The type of the load balancer
    Value: !If [IsApplication, 'Application', 'Network']
    Export:
      Name: !Sub '${AWS::StackName}-LoadBalancerType'

  SecurityGroupId:
    Condition: IsApplication
    Description: The security group ID of the load balancer
    Value: !GetAtt ELBSecurityGroup.GroupId
    Export:
      Name: !Sub '${AWS::StackName}-SecurityGroupId'

  HttpListenerArn:
    Condition: IsApplicationHTTPEnabledAndPaid
    Description: The HTTP listener ARN of the application load balancer
    Value: !If
      - IsInternetApplication
      - !Ref LoadBalancerHTTPListener
      - !Ref LoadBalancerHTTPListenerInternal
    Export:
      Name: !Sub '${AWS::StackName}-HttpListenerArn'

  ApplicationListenerArn:
    Condition: IsInternetApplicationSSLAndPaid
    Description: The HTTPS listener ARN of the application load balancer
    Value: !Ref LoadBalancerHTTPSListener
    Export:
      Name: !Sub '${AWS::StackName}-ApplicationListenerArn'

  NetworkListenerArn:
    Condition: IsNetworkAndPaid
    Description: The listener ARN of the network load balancer
    Value: !Ref LoadBalancerNetworkListener
    Export:
      Name: !Sub '${AWS::StackName}-NetworkListenerArn'

  ApplicationTargetGroup:
    Condition: IsApplication
    Description: The Application Target Group ARN
    Value: !Ref ApplicationTargetGroup
    Export:
      Name: !Sub '${AWS::StackName}-ApplicationTargetGroup'