AWSTemplateFormatVersion: 2010-09-09
Description: Template for Google-Slack integration

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Google and Slack info
        Parameters:
          - GoogleDelegatedUser
          - SlackApiUserToken
          - ServiceAccountInfo
      - Label:
          default: Scheduler Configuration
        Parameters:
          - ScheduleExpression

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      GoogleDelegatedUser:
        default: Google Delegated User
      SlackApiUserToken:
        default: Slack API User Token
      ServiceAccountInfo:
        default: Service Account Info
      ScheduleExpression:
        default: CRON Schedule

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 20
    Default: evilcorp-gslack
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
  
  GoogleDelegatedUser:
    Description: Google delegated user email address
    Type: String
    Default: ''
  SlackApiUserToken:
    Description: Slack API Token
    Type: String
    Default: ''
  ServiceAccountInfo:
    Description: Service account info in json format
    Type: String
    Default: 'skip-this'

  ScheduleExpression:
    Description: schedule cron timer
    Type: String
    Default: cron(0 0 ? * MON-FRI *)

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
      
Resources:

####
# Secrets
####
  DefaultSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, secrets]]
      GenerateSecretString:
        SecretStringTemplate: !Sub
          - |
            {
              "GOOGLE_DELEGATED_USER": "${GOOGLE_DELEGATED_USER}",
              "SLACK_API_USER_TOKEN": "${SLACK_API_USER_TOKEN}",
              "SERVICE_ACCOUNT_INFO": "${SERVICE_ACCOUNT_INFO}"
            }
          - GOOGLE_DELEGATED_USER: !Ref GoogleDelegatedUser
            SLACK_API_USER_TOKEN: !Ref SlackApiUserToken
            SERVICE_ACCOUNT_INFO: !Ref ServiceAccountInfo
        GenerateStringKey: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        PasswordLength: 30
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

####
# Lambda
####

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Path: "/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Principal:
              Service:
                - "lambda.amazonaws.com" 
            Action: 
              - "sts:AssumeRole"
      Policies:
        - PolicyName: "Lambda-LogPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"
        - PolicyName: "Lambda-SecretsAccess"
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DefaultSecret#
  LayerLibrary:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, layer]]
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, dependencies]]
      Content:
        S3Bucket: iscale-dev-cloudformation
        S3Key: lambda/python-gslack-modules.zip
      CompatibleRuntimes: 
        - python3.9#
  GoogleSlackFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Description: Lambda Function for Google-Slack integration
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.9
      Timeout: 900
      Environment:
        Variables:
          REGION: !Ref AWS::Region
          SECRETS_ID: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      Layers: 
        - !Ref LayerLibrary
      Code:
        ZipFile: |
          import json
          import boto3
          from botocore.exceptions import ClientError
          import os
          import base64
          from slack_sdk import WebClient
          from slack_sdk.errors import SlackApiError
          from googleapiclient.discovery import build
          from google.oauth2 import service_account
          from googleapiclient.errors import HttpError
          import requests#
          def lambda_handler(event, context):#
              # use lambda environment variables
              #secret_name = "bryd-slack-secrets"
              secret_name = os.environ['SECRETS_ID']#
              #region_name = "us-west-2"
              region_name = os.environ['REGION']#
              # Create a Secrets Manager client
              session = boto3.session.Session()
              client = session.client(
                  service_name='secretsmanager',
                  region_name=region_name
              )#
              # Retrieve the secret value
              get_secret_value_response = client.get_secret_value(SecretId=secret_name)
              secret = get_secret_value_response['SecretString']#
              # Parse JSON
              secret_dict = json.loads(secret)#
              # Google API credentials
              GOOGLE_DELEGATED_USER = secret_dict['GOOGLE_DELEGATED_USER']
              SERVICE_ACCOUNT_INFO = json.loads(secret_dict['SERVICE_ACCOUNT_INFO'])
              SCOPES = ['https://www.googleapis.com/auth/admin.directory.user']#

              # Slack API credentials
              SLACK_API_USER_TOKEN = secret_dict['SLACK_API_USER_TOKEN']          #
              # Google API authentication
              credentials = service_account.Credentials.from_service_account_info(
                  SERVICE_ACCOUNT_INFO, scopes=SCOPES)
              delegated_credentials = credentials.with_subject(GOOGLE_DELEGATED_USER)
              google_service = build('admin', 'directory_v1', credentials=delegated_credentials)#
              # Slack API authentication
              slack_client = WebClient(SLACK_API_USER_TOKEN)#
              def base64url_to_base64(base64url_str):
                  padding_needed = len(base64url_str) % 4
                  if padding_needed:
                      base64url_str += '=' * (4 - padding_needed)
                  return base64url_str.replace('-', '+').replace('_', '/')#
              def get_image_data(google_service, user_id):
                  try:
                      response = google_service.users().photos().get(userKey=user_id).execute()
                      print(response)
                      if 'photoData' in response:
                          photo_data = response['photoData']
                          return base64.b64decode(base64url_to_base64(photo_data))
                  except HttpError as error:
                      if error.resp.status == 404:
                          print(f"No photo found for user: {user_id}")
                      else:
                          print(f"An error occurred: {error}")#
                  return None#

              # Get a list of Google users
              google_users_response = google_service.users().list(customer='my_customer', maxResults=10, orderBy='email', projection='full').execute()
              google_users = google_users_response['users']
              print(google_users)#
              # Get a list of Slack users
              slack_users_by_email = {}
              try:
                  slack_users_response = slack_client.users_list()
                  slack_users = slack_users_response['members']
                  for slack_user in slack_users:
                      if 'email' in slack_user['profile']:
                          slack_user_email = slack_user['profile']['email']
                          slack_users_by_email[slack_user_email] = slack_user['profile']
                          slack_users_by_email[slack_user_email]['id'] = slack_user['id']
              except SlackApiError as e:
                  print("Error: {}".format(e))#
              # Update Slack users with Google user names
              for google_user in google_users:
                  if google_user['primaryEmail'] in slack_users_by_email:
                      slack_user = slack_users_by_email[google_user['primaryEmail']]
                      print(slack_user)
                      full_name = google_user['name']['fullName']
                      given_name = google_user['name']['givenName']
                      family_name = google_user['name']['familyName']
                      display_name = google_user['name'].get('displayName', None) 
                      job_title = google_user['organizations'][0]['title'] if 'organizations' in google_user and len(google_user['organizations']) > 0 else ""
                      phone_number = google_user['phones'][0]['value'] if 'phones' in google_user and len(google_user['phones']) > 0 else ""#
                      profile = {
                          "first_name": given_name,
                          "last_name": family_name,
                          "title": job_title,
                          "phone": phone_number
                      }         #
                      if display_name:
                          profile["display_name"] = display_name#

                      try:
                          response = slack_client.users_profile_set(
                              user=slack_user['id'],
                              profile=profile
                          )
                          print(f"Profile updated:  {slack_user['id']} {profile}")
                      except SlackApiError as e:
                          print("Error: {}".format(e))#
                      # Sync profile picture
                      #image_data = get_image_data(google_service, google_user['id'])
                      # Download the user's profile image
                      image_data = get_image_data(google_service, google_user['id'])#
                      # Save the image to a file
                      if image_data:
                          try:
                              response = slack_client.users_setPhoto(
                                  user=slack_user['id'],
                                  image=image_data
                              )
                              print(f"Profile picture updated: {slack_user['id']}")
                          except SlackApiError as e:
                              print(f"Error updating profile picture: {e}")#

###
# Cron
####
  LambdaScheduledEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GoogleSlackFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LambdaScheduler.Arn#
  LambdaScheduler:
    DependsOn:
      - GoogleSlackFunction
    Type: AWS::Events::Rule
    Properties:
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, cron]]
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Arn: !GetAtt GoogleSlackFunction.Arn
          Id: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, cron]]

  Outputs:
    LambdaFunction:
      Description: Lambda Function
      Value: !Ref GoogleSlackFunction

    LambdaScheduler:
      Description: Lambda Scheduler
      Value: !Ref LambdaScheduler