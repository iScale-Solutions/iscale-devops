      #             - 'logs:DeleteResourcePolicy'
      #           Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'
      AdvancedOptions:
        rest.action.multi.allow_explicit_index: !Ref RestActionMultiAllowExplicitIndexEnabled
      # LogPublishingOptions:
