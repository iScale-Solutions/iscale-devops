AWSTemplateFormatVersion: 2010-09-09
Description: This cloudformation configuration provisions an elasticsearch for Tasaki

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Elasticsearch Configuration
        Parameters:
          - ElasticsearchVersion
          - InstanceType
          - VolumeType
          - VolumeSize
          - AutomatedSnapshotStartHour
          - EncryptAtRestEnabled
          - RestActionMultiAllowExplicitIndexEnabled
          - LogPublishingIndexEnabled
          - LogPublishingSearchEnabled
          - LogPublishingApplicationEnabled
          - ClientDomainName
      - Label:
          default: CloudWatch Configuration
        Parameters:
          - LogRetentionPeriod
      - Label:
          default: Cloudformation Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      ElasticsearchVersion:
        default: Elasticsearch Version
      InstanceType:
        default: Elasticsearch Instance Type
      VolumeType:
        default: Volume Type
      VolumeSize:
        default: Volume Size
      RestActionMultiAllowExplicitIndexEnabled:
        default: Enable Rest Action Multi Allow Explicti Index
      AutomatedSnapshotStartHour:
        default: Automated Snapshot Start Hour
      EncryptAtRestEnabled:
        default: Enable Encrypt at Rest
      LogPublishingIndexEnabled:
        default: Enable Index Log Publishing
      LogPublishingSearchEnabled:
        default: Enable Search Log Publishing
      LogPublishingApplicationEnabled:
        default: Enable Application Log Publishing
      ClientDomainName:
        default: Domain Name
      LogRetentionPeriod:
        default: Log Retention Period
      NetworkStackName:
        default: Network Stack Name
      SNSStackName:
        default: SNS Stack Name

Parameters: 
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    Default: tasaki-elasticsearch
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Staging
  ElasticsearchVersion:
    Description: The Elasticsearch version
    Type: String
    Default: 6.7
  InstanceType:
    Description: The elasticsearch version
    Type: String
    Default: t3.medium.elasticsearch
  VolumeType:
    Description: Values must be [gp2, io1, standard]
    Type: String
    Default: gp2
    AllowedValues:
      - gp2
      - io1
      - standard
  VolumeSize:
    Description: Elasticsearch Volume Size
    Type: Number
    Default: 10
  AutomatedSnapshotStartHour:
    Description: The hour in UTC during which the service takes an automated daily snapshot of the indices in the Amazon ES domain.
    Type: Number
    Default: 0
  EncryptAtRestEnabled:
    Description: Enables encrypt data at rest.
    Type: String
    Default: true
    AllowedValues:
      - true
      - false
  RestActionMultiAllowExplicitIndexEnabled:
    Description: Specifies whether explicit references to indices are allowed inside the body of HTTP requests. Setting this property to false prevents users from bypassing access control for subresources.
    Type: String
    Default: true
    AllowedValues:
      - true
      - false
  LogPublishingIndexEnabled:
    Description: Enables publishing of the Elasticsearch index logs.
    Type: String
    Default: true
    AllowedValues:
      - true
      - false
  LogPublishingSearchEnabled:
    Description: Enables publishing of the Elasticsearch search logs.
    Type: String
    Default: true
    AllowedValues:
      - true
      - false
  LogPublishingApplicationEnabled:
    Description: Enables publishing of the Elasticsearch application logs.
    Type: String
    Default: true
    AllowedValues:
      - true
      - false
  ClientDomainName:
    Description: The client's domain name (e.g. example.com, iscale-solutions.com).
    Type: String
    Default: iscale-software.com
  LogRetentionPeriod:
    Description: The number of days to retain the log events in the specified log group
    Type: Number
    Default: 365
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]
  NetworkStackName:
    Description: The name of the cloudformation Network stack
    Type: String
    Default: iscale-dev-dev-uw2-network
  SNSStackName:
    Description: The name of the cloudformation SNS stack
    Type: String
    Default: iscale-dev-dev-uw2-tasaki-sns

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  IsEncrypted: !Equals [!Ref EncryptAtRestEnabled, true]
  IsLogPublishingIndexEnabled: !Equals [!Ref LogPublishingIndexEnabled, true]
  IsLogPublishingSearchEnabled: !Equals [!Ref LogPublishingSearchEnabled, true]
  IsLogPublishingApplicationEnabled: !Equals [!Ref LogPublishingApplicationEnabled, true]

