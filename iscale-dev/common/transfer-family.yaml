AWSTemplateFormatVersion: 2010-09-09
Description: Transfer Family SFTP Server

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: DNS Configuration
        Parameters:
          - HostedZoneName
          - Hostname
      - Label:
          default: Dependent Stack Names
        Parameters:
          - NetworkStackName
          - SNSStackName
      - Label:
          default: SFTP Server Configuration
        Parameters:
          - UseDefaultSecGroup
          - EndpointType
          - Domain
      - Label:
          default: Disaster Recovery
        Parameters:
          - DeployPaidResources

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      HostedZoneName:
        default: Domain name
      Hostname:
        default: SFTP host name
      NetworkStackName:
        default: Network Stack
      SNSStackName:
        default: SNS Stack
      UseDefaultSecGroup:
        default: Use Default Security Group (0.0.0.0/0)
      EndpointType:
        default: SFTP Endpoint Type
      Domain:
        default: Storage Domain
      DeployPaidResources:
        default: Deploy Paid Resources (false = DR standby, true = active/failover)

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name)
    Type: String
    MinLength: 3
    MaxLength: 9
    Default: sftp
  OrgName:
    Description: The name of the organization
    Type: String
    Default: iscale-dev
    AllowedPattern: '^[a-z]+(-[a-z]+)*$'
    ConstraintDescription: Organization must only contain lowercase letters and hyphens
    MaxLength: 10
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  HostedZoneName:
    Type: String
    Description: Domain Name
    Default: iscale-software.com
  Hostname:
    Type: String
    Description: Hostname for the SFTP Server
    Default: ''
  NetworkStackName:
    Description: The name of the cloudformation Network stack
    Type: String
    Default: iscale-dev-dev-uw2-network
  SNSStackName:
    Description: The name of the cloudformation SNS stack
    Type: String
    Default: iscale-dev-dev-uw2-sns
  UseDefaultSecGroup:
    Description: Set to TRUE to use default security group 0.0.0.0/0
    Type: String
    Default: TRUE
    AllowedValues:
      - TRUE
      - FALSE
  EndpointType:
    Description: >-
      PUBLIC = AWS-managed public endpoint (CNAME, no static IP, no security groups).
      VPC_INTERNET = endpoint hosted in your VPC with an Elastic IP (internet-facing, static IP, security groups).
      VPC_INTERNAL = endpoint hosted in your VPC reachable only from within the VPC / peered networks / VPN / Direct Connect (no public IP).
    Type: String
    Default: PUBLIC
    AllowedValues:
      - PUBLIC
      - VPC_INTERNET
      - VPC_INTERNAL
  Domain:
    Description: Specifies the domain of the storage system that is used for file transfers
    Type: String
    Default: S3
    AllowedValues:
      - S3
      - EFS
  DeployPaidResources:
    Description: |
      true (default): Deploy all paid resources — SFTP server, IAM roles, and DNS records. Normal operation for all environments.
      false: DR standby mode — suppress all paid resources to minimize idle cost. Only S3 bucket stays alive.
      DR failover: set back to true to activate SFTP server and update DNS to this region.
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  IsPaidResources: !Equals [!Ref DeployPaidResources, 'true']
  HasCustomHostname: !Not [!Equals [!Ref Hostname, '']]
  UseDefaultSecGroup: !Equals [!Ref UseDefaultSecGroup, TRUE]
  UsePUBLIC: !Equals [!Ref EndpointType, PUBLIC]
  # VPC endpoint, internet-facing: hosted in the VPC and fronted by an Elastic IP.
  UseVpcPublic: !Equals [!Ref EndpointType, VPC_INTERNET]
  # VPC endpoint, internal only: hosted in the VPC with no public IP attached.
  UseVpcPrivate: !Equals [!Ref EndpointType, VPC_INTERNAL]
  # True for either VPC variant; used for resources common to both (server, security group).
  UseVPC: !Or
    - !Condition UseVpcPublic
    - !Condition UseVpcPrivate
  # Combined conditions — gate paid resources behind DeployPaidResources=true
  IsPaidAndUseDefaultSecGroup: !And
    - !Condition IsPaidResources
    - !Condition UseDefaultSecGroup
  IsPaidAndUseVPC: !And
    - !Condition IsPaidResources
    - !Condition UseVPC
  IsPaidAndUseVpcPublic: !And
    - !Condition IsPaidResources
    - !Condition UseVpcPublic
  IsPaidAndUsePUBLIC: !And
    - !Condition IsPaidResources
    - !Condition UsePUBLIC

Resources:
  
  SFTPServerSecurityGroup:
    Condition: IsPaidResources
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join [' ', [!Ref Name, SFTP Server Security Group]]
      VpcId:
        Fn::ImportValue:
          !Sub '${NetworkStackName}-VpcId'

  SFTPDefaultSecurityGroup:
    Condition: IsPaidAndUseDefaultSecGroup
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      IpProtocol: TCP
      GroupId: !Ref SFTPServerSecurityGroup
      FromPort: 22
      ToPort: 22
      CidrIp: 0.0.0.0/0
  
  SFTPServerEIP:
    Condition: IsPaidAndUseVpcPublic
    Type: AWS::EC2::EIP

  SFTPServerVPC:
    Condition: IsPaidAndUseVPC
    Type: AWS::Transfer::Server
    Properties:
      Protocols:
        - SFTP
      EndpointType: VPC
      Domain: !Ref Domain
      EndpointDetails:
        # Attach the Elastic IP only for the internet-facing variant; internal endpoints get no public IP.
        AddressAllocationIds: !If
          - UseVpcPublic
          - - !GetAtt SFTPServerEIP.AllocationId
          - !Ref AWS::NoValue
        SecurityGroupIds:
          - !Ref SFTPServerSecurityGroup
        SubnetIds:
          - Fn::ImportValue: !Sub '${NetworkStackName}-PublicSubnetId1'
        VpcId: 
          Fn::ImportValue:
            !Sub '${NetworkStackName}-VpcId'
      LoggingRole: !Sub 'arn:aws:iam::${AWS::AccountId}:role/service-role/AWSTransferLoggingAccess'
      PreAuthenticationLoginBanner: This system is for the use of authorized users only. Individuals using this computer system without authority, or in excess of their authority, are subject to having all of their activities on this system monitored and recorded by system personnel.
      SecurityPolicyName: TransferSecurityPolicy-2022-03
  
  SFTPServerPublic:
    Condition: IsPaidAndUsePUBLIC
    Type: AWS::Transfer::Server
    Properties:
      Protocols:
        - SFTP
      EndpointType: PUBLIC
      Domain: !Ref Domain
      LoggingRole: !Sub 'arn:aws:iam::${AWS::AccountId}:role/service-role/AWSTransferLoggingAccess'
      PreAuthenticationLoginBanner: This system is for the use of authorized users only. Individuals using this computer system without authority, or in excess of their authority, are subject to having all of their activities on this system monitored and recorded by system personnel.
      SecurityPolicyName: TransferSecurityPolicy-2022-03

## Update DNS Records

  # Internet-facing VPC endpoint: point an A record at the Elastic IP.
  # Internal (VPC_INTERNAL) endpoints have no public IP and CloudFormation does not expose
  # the private ENI addresses, so no public DNS record is created for that variant — clients
  # resolve it via the VPC endpoint's interface within the VPC / peered networks.
  SFTPServerDNSRecordVPC:
    Condition: IsPaidAndUseVpcPublic
    Type: AWS::Route53::RecordSet
    Properties:
      Name: !If
        - HasCustomHostname
        - !Join ['', [!Ref Hostname, '.', !Ref HostedZoneName]]
        - !If
          - IsProd
          - !Join ['', ['sftp-', !Ref Name, '.', !Ref HostedZoneName]]
          - !Join ['', ['sftp-', !Ref Name, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '.', !Ref HostedZoneName]]
      HostedZoneName: !Join ['', [!Ref HostedZoneName, '.']]
      Type: A
      Comment: SFTP custom hostname
      TTL: 300
      ResourceRecords:
        - !Ref SFTPServerEIP

  SFTPServerDNSRecordPUBLIC:
    Condition: IsPaidAndUsePUBLIC
    Type: AWS::Route53::RecordSet
    Properties:
      Name: !If
        - HasCustomHostname
        - !Join ['', [!Ref Hostname, '.', !Ref HostedZoneName]]
        - !If
          - IsProd
          - !Join ['', ['sftp-', !Ref Name, '.', !Ref HostedZoneName]]
          - !Join ['', ['sftp-', !Ref Name, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '.', !Ref HostedZoneName]]
      HostedZoneName: !Join ['', [!Ref HostedZoneName, '.']]
      Type: CNAME
      Comment: SFTP custom hostname
      TTL: 300
      ResourceRecords:
        - !Join ['.', [!GetAtt SFTPServerPublic.ServerId, server.transfer, !Ref 'AWS::Region', amazonaws.com]]

## Create S3 Bucket

# For DR setup, manually configure S3 Cross region replication from primary to DR bucket.

  SFTPServerS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Join [ '-', [!Ref OrgName , !FindInMap [EnvShort, !Ref EnvName, Name],  !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, ftp, server]]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 3
          Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Join [ '-', [!Ref OrgName , s3, data]]
        - Key: Organization
          Value: !Ref OrgName

  SFTPServerUserSessionRWPolicy:
    Condition: IsPaidResources
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Join [ '-', [!Ref OrgName , !FindInMap [EnvShort, !Ref EnvName, Name],  !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, ftp, user, session, rw, policy]]
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - s3:ListBucket
            Resource: !GetAtt SFTPServerS3Bucket.Arn
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:GetObjectVersion
              - s3:GetObjectACL
              - s3:PutObjectACL
            Resource: !Join ['/', [!GetAtt SFTPServerS3Bucket.Arn, '*']]        

  SFTPServerRole:
    Condition: IsPaidResources
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - transfer.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      RoleName: !Join [ '-', [!Ref OrgName , !FindInMap [EnvShort, !Ref EnvName, Name],  !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, ftp, user, role]]
      ManagedPolicyArns:
        - !Ref SFTPServerUserSessionRWPolicy
      Policies:
        - PolicyName: AllowHomeDirectoryOperations
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: 'arn:aws:s3:::${transfer:HomeBucket}'
                Condition:
                  StringLike:
                    's3:prefix': 
                      - '${transfer:HomeFolder}/*'
                      - '${transfer:HomeFolder}'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:GetObjectVersion
                  - s3:GetObjectACL
                  - s3:PutObjectACL
                Resource: 'arn:aws:s3:::${transfer:HomeDirectory}/*'

Outputs:

  HostName:
    Description: FTP Hostname
    Value: !If
      - IsProd
      - !Join ['', ['sftp-', !Ref Name, '.', !Ref HostedZoneName]]
      - !Join ['', ['sftp-', !Ref Name, '-', !FindInMap [EnvShort, !Ref EnvName, Name], '.', !Ref HostedZoneName]]

  SecurityGroup:
    Condition: IsPaidResources
    Description: FTP Security Group
    Value: !Ref SFTPServerSecurityGroup

  S3Bucket:
    Description: S3 Bucket
    Value: !Ref SFTPServerS3Bucket
  
  S3BucketARN:
    Description: S3 Bucket ARN
    Value: !GetAtt SFTPServerS3Bucket.Arn