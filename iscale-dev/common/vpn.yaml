AWSTemplateFormatVersion: 2010-09-09
Description: VPN Setup
Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Network Configuration
        Parameters:
          - VpcCidrBlock
          - CidrCount
          - MaskSize
      - Label:
          default: VPN Configuration
        Parameters:
          - AuthenticationType
          - ClientCidrBlock
          - ClientRootCertificateChainArn
          - ServerCertificateArn
    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      AuthenticationType:
        default: Type of VPN authentication
      ClientCidrBlock:
        default: VPN Client CIDR Block
      ClientRootCertificateChainArn:
        default: Client Root Certificate Chain ARN
      ServerCertificateArn:
        default: VPN Server certificate ARN
      VpcCidrBlock:
        default: VPN VPC CIDR Block
      CidrCount:
        default: VPN VPC CIDR Count

Parameters: 
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    Default: network
    MinLength: 3
    MaxLength: 13
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
    MaxLength: 12
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Development
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  AuthenticationType:
    Description: The type of VPN authentication
    Type: String
    Default: certificate-authentication
    AllowedValues:
      - certificate-authentication
  ClientCidrBlock:
    Description: The CIDR block for the VPN client (e.g. 10.0.0.0/23)
    Type: String
    Default: '172.16.0.0/22'
    AllowedPattern: '((\d{1,3})\.){3}\d{1,3}/\d{1,2}'
  ClientRootCertificateChainArn:
    Description: Client root certificate Chain ARN
    Type: String
    MinLength: 1
  CidrCount:
    Description: The number of CIDR to generate from the VPC CIDR Block
    Type: Number
    Default: 4
    MinValue: 1
    MaxValue: 256
  MaskSize:
    Description: The number of subnet bits for the CIDR (e.g. /32-XXX, specifying a value "8" creates a CIDR with a mask of "/24", 32-8)
    Type: Number
    Default: 5
  ServerCertificateArn:
    Description: Server root certificate Chain ARN
    Type: String
    MinLength: 1
  VpcCidrBlock:
    Description: The CIDR block for the VPC (e.g. 10.0.0.0/23)
    Type: String
    Default: '10.0.4.0/25'
    AllowedPattern: '((\d{1,3})\.){3}\d{1,3}/\d{1,2}'

Mappings:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml

Resources:

####
# Ne Section
####

  VPCStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://iscale-dev-cloudformation.s3-us-west-2.amazonaws.com/common/network.yaml
      Parameters:
        Name: !Ref Name
        EnvName: !Ref EnvName
        OrgName: !Ref OrgName
        CidrCount: !Ref CidrCount
        MaskSize: !Ref MaskSize
        VpcCidrBlock: !Ref VpcCidrBlock
        PublicSubnet1Index: 0
        InternalSubnet1Index: 1
        PublicSubnet2Index: 2
        InternalSubnet2Index: 3

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, endpoint,security,group]]
      GroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, endpoint,security,group]]
      VpcId: !GetAtt [VPCStack, Outputs.VpcId]
      Tags:
        - Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, endpoint,security,group]]
  
  ClientVPNEndpointLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, endpoint]]
      RetentionInDays: !If [IsProd, 1827, 180]

  ClientVPNEndpoint:
    Type: AWS::EC2::ClientVpnEndpoint
    Properties:
      AuthenticationOptions:
        - Type: !Ref AuthenticationType
          MutualAuthentication:
            ClientRootCertificateChainArn: !Ref ClientRootCertificateChainArn
      ClientCidrBlock: !Ref ClientCidrBlock
      ConnectionLogOptions:
        CloudwatchLogGroup: !Ref ClientVPNEndpointLogGroup
        Enabled: true
      Description: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, client, endpoint]]
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      SelfServicePortal: disabled
      ServerCertificateArn: !Ref ServerCertificateArn
      SplitTunnel: true
      TagSpecifications:
        - ResourceType: client-vpn-endpoint
          Tags:
            - Key: Name
              Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, client, endpoint]]
      TransportProtocol: udp
      VpcId: !GetAtt [VPCStack, Outputs.VpcId]
      VpnPort: 443

  PublicSubnet1Assoc:
    Type: AWS::EC2::ClientVpnTargetNetworkAssociation
    Properties:
      ClientVpnEndpointId: !Ref ClientVPNEndpoint
      SubnetId: !GetAtt [VPCStack, Outputs.PublicSubnetId1]

  PublicSubnet2Assoc:
    Type: AWS::EC2::ClientVpnTargetNetworkAssociation
    Properties:
      ClientVpnEndpointId: !Ref ClientVPNEndpoint
      SubnetId: !GetAtt [VPCStack, Outputs.PublicSubnetId2]

  AccessToVPNVPC:
    Type: AWS::EC2::ClientVpnAuthorizationRule
    Properties: 
      AuthorizeAllGroups: true
      ClientVpnEndpointId: !Ref ClientVPNEndpoint
      Description: !Join 
        - ' '
        - - Access to
          - !GetAtt [VPCStack, Outputs.VpcId]
      TargetNetworkCidr: !GetAtt [VPCStack, Outputs.VpcCidrBlock]

Outputs:

  VpcId:
    Description: VpcId of the VPN VPC
    Value: !GetAtt [VPCStack, Outputs.VpcId]

  VpcCidrBlock:
    Description: VpcCidrBlock of the VPN VPC
    Value: !GetAtt [VPCStack, Outputs.VpcCidrBlock]

  PublicRouteTable:
    Description: Public Route Table of the VPN VPC
    Value: !GetAtt [VPCStack, Outputs.PublicRouteTable]

  ClientVPNEndpoint:
    Description: Client VPN Endpoint Id
    Value: !Ref ClientVPNEndpoint