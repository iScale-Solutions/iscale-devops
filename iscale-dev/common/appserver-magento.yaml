AWSTemplateFormatVersion: 2010-09-09
Description: Magento EC2 instance using Amazon Linux with all surrounding objects

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - OrgName
          - EnvName
      - Label:
          default: Cloudformation Stack Configuration
        Parameters:
          - LoadBalancerStackName
          - NetworkStackName
          - SNSStackName
      - Label:
          default: Instance Configuration
        Parameters:
          - InstanceKeyName
          - InstanceAMI
          - InstancePort
          - InstanceSpotPrice
          - InstanceType
          - InstanceOS
      - Label:
          default: Load Balancer Configuration
        Parameters:
          - LoadBalancerPriority
          - LoadBalancerHostName
      - Label:
          default: Domain Configuration
        Parameters:
          - ClientDomainName
      - Label:
          default: Cache Configuration
        Parameters:
          - CacheEndpoint
          - CachePort
          - CacheSecurityGroupId
      - Label:
          default: Database Configuration
        Parameters:
          - DatabaseClusterARN
          - DatabaseEndpoint
          - DatabasePort
          - DatabaseSecurityGroupId
      - Label:
          default: Magento Repository Access
        Parameters:
          - MagentoPublicKey
          - MagentoPrivateKey
      - Label:
          default: Shared Configuration
        Parameters:
          - SharedSecretId

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      CacheEndpoint:
        default: Elasticache Endpoint
      CachePort:
        default: Elasticache Port
      CacheSecurityGroupId:
        default: Elasticache Security Group
      DatabaseClusterARN:
        default: Database Cluster ARN
      DatabaseEndpoint:
        default: Database Endpoint
      DatabasePort:
        default: Database Port
      DatabaseSecurityGroupId:
        default: Database Security Group
      InstanceAMI:
        default: Instance AMI ID
      InstanceKeyName:
        default: Instance Key Name
      InstanceOS:
        default: Instance OS
      InstancePort:
        default: Instance Application Port
      InstanceSpotPrice:
        default: Spot price
      InstanceType:
        default: Instance Type
      LoadBalancerHostName:
        default: Load Balancer Hostname
      LoadBalancerPriority:
        default: Load Balancer Priority
      LoadBalancerStackName:
        default: Load Balancer Stack Name
      NetworkStackName:
        default: Network Stack Name
      SharedSecretId:
        default: Shared Secret ID
      SNSStackName:
        default: SNS Topic Stack Name
      ClientDomainName:
        default: Domain Name
      MagentoPublicKey:
        default: Magento Public Key
      MagentoPrivateKey:
        default: Magento Private Key

Parameters:
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Development
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  CacheEndpoint:
    Description: The endpoint of the cache cluster
    Type: String
    Default: ''
  CachePort:
    Description: Cache Port Number
    Type: Number
    MinValue: 1
    MaxValue: 65535
    Default: 6379
  CacheSecurityGroupId:
    Description: Cache Security Group
    Type: String
    Default: ''
  ClientDomainName:
    Description: The client's domain name (e.g. example.com, iscale-software.com).
    Type: String
    Default: iscale-software.com
    MinLength: 1
  DatabaseClusterARN:
    Description: Database Cluster ARN
    Type: String
    MinLength: 1
  DatabaseEndpoint:
    Description: Database Endpoint
    Type: String
    MinLength: 1
  DatabasePort:
    Description: Database Port Number
    Type: Number
    MinValue: 1
    MaxValue: 65535
  DatabaseSecurityGroupId:
    Description: Database Security Group
    Type: String
    MinLength: 1
  ExternalEFSSecurityGroup:
    Description: Compatibility argument - leave blank
    Type: String
    Default: ''
  InstanceAMI:
    Description: Instance AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-0841edc20334f9287 #Basic Amazon Linux AMI
  InstanceKeyName:
    Description: Instance Key Name
    Type: String
    Default: ''
  InstanceOS:
    Description: The OS of the EC2 instance
    Type: String
    Default: Linux
    AllowedValues:
      - Linux
      - CentOS
  InstancePort:
    Description: Database Port Number
    Type: Number
    Default: 80
    MinValue: 1
    MaxValue: 65535
  InstanceSpotPrice:
    Description: Spot price to set (set to 0 to use on demand)
    Type: Number
    Default: 0
  InstanceType:
    Description: The type of EC2 instance
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.small
      - t3.medium
      - t3.large
  LoadBalancerHostName:
    Description: (Optional) Custom Hostname for load balancer URL
    Type: String
    Default: ''
    MaxLength: 14
  LoadBalancerPriority:
    Description: The priority for ELB Listener.
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 50000
  LoadBalancerStackName:
    Description: Name of the ELB Stack Name
    Type: String
    MinLength: 1
  MagentoPublicKey: 
    NoEcho: true
    Description: Magento Repository Public Key
    Type: String
    MinLength: 1
  MagentoPrivateKey: 
    NoEcho: true
    Description: Magento Repository Private Key
    Type: String
    MinLength: 1
  MagentoRepoSecrets: 
    Description: Magento Repository Secrets Manager ARN
    Type: String
    Default: ''
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 8
  NetworkStackName:
    Description: The name of the cloudformation Network stack
    Type: String
    Default: iscale-dev-dev-uw2-network
    MinLength: 1
  SharedSecretId:
    Description: Name of the secret Id to use. Can leave blank for default.
    Type: String
    Default: ''
  SNSStackName:
    Description: The name of the cloudformation SNS stack
    Type: String
    Default: iscale-dev-dev-uw2-sns
    MinLength: 1
  UseFriendlyNames:
    Description: Set to TRUE to have nice object names
    Type: String
    AllowedValues:
      - TRUE
      - FALSE
    Default: TRUE

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml
  HasInstanceKey: !Not [!Equals [!Ref InstanceKeyName, '']]
  HasLoadBalancerHostName: !Not [!Equals [!Ref LoadBalancerHostName, '']]
  HasLoadBalancerStackName: !Equals [1, 1] #true - we only support for ELB for now
  HasCache: !Not [!Equals [!Ref CacheEndpoint, '']]
  HasMagentoRepoSecrets: !Not [!Equals [!Ref MagentoRepoSecrets, '']]
  HasSharedSecretId: !Equals [1, 0] #false - we don't support this for now
  HasSpotPrice: !Not [!Equals [!Ref InstanceSpotPrice, 0]]
  UseExternalEFS: !Equals [1, 0] #false - we only support internal EFS for now
  UseInternalEFS: !Not [!Condition UseExternalEFS] #true - we only support internal EFS for now
  UseFriendlyNames: !Equals [!Ref UseFriendlyNames, TRUE]
  IsLinux: !Equals [!Ref InstanceOS, 'Linux']
  IsCentOS: !Equals [!Ref InstanceOS, 'CentOS']
  

Resources:
  
  #Include common resources for the app server (regardless of appserver type)
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/appserver.yaml
  
####
# AutoScaling Group 
####

  AppServerLaunchConfig: 
    Type: AWS::AutoScaling::LaunchConfiguration
    Metadata: 
      AWS::CloudFormation::Init: 
        configSets: 
          Linux: 
            - InstallLogAgent_Linux
            - InstallCustomData
            - InstallEFS_Linux
            - InstallMySQLClient
            - InstallPHP_Linux
            - SetupApache
            - SetupComposer
            - InstallCodeDeployAgent
          CentOS: 
            # - InstallLogAgent_Centos
            - InstallCustomData
            # # - InstallEFS_Centos
            # - InstallMySQLClient
            # - InstallLAMP_Centos
            # - InstallAWSCLI_Centos
            # #- SetupApache
            # - SetupComposer
            # - InstallCodeDeployAgent
          Test:
            - InstallLAMP_Centos
            
        InstallLogAgent_Linux:
          Fn::Transform:
            Name: AWS::Include
            Parameters:
              Location: s3://iscale-dev-cloudformation/include/installLogAgent.yaml

        InstallLogAgent_Centos:
          Fn::Transform:
            Name: AWS::Include
            Parameters:
              Location: s3://iscale-dev-cloudformation/include/centos/installLogAgent.yaml

        InstallCustomData:
          packages:
            yum: 
              jq: []
          files:
            /var/lib/cloud/instance/custom-data.sh: 
              content: !Sub
                - |
                  STACK_NAME=${AWS::StackName}
                  AWS_REGION=${AWS::Region}
                  DOMAIN=${DOMAIN}
                  ENVIRONMENT=${ENVIRONMENT}
                  CLIENT_NAME=${CLIENT_NAME}
                  APPLICATION_SITE=${APPLICATION_SITE}
                  INSTANCE_ROLE=${INSTANCE_ROLE}
                  SECRET_ID=${SECRET_ID}
                  BASE_URL=https://${DOMAIN}/
                  BUCKET_NAME=${BUCKET_NAME}
                  EFS_ID=${EFS_ID}
                  MAGENTO_PUB_KEY=${MAGENTO_PUB_KEY}
                  MAGENTO_PRIVATE_KEY=${MAGENTO_PRIVATE_KEY}
                  MAGENTO_REPOS_SECRET_ARN=${MAGENTO_REPOS_SECRET_ARN}
                  DB_CLUSTER_ARN=${DB_CLUSTER_ARN}
                  DB_HOST=${DB_HOST}
                  DB_PORT=${DB_PORT}
                - DOMAIN: !Join ['.', [!Join ['-',[!Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name]]], !Ref ClientDomainName]]
                  ENVIRONMENT: !Ref EnvName
                  CLIENT_NAME: !Ref Name
                  APPLICATION_SITE: !Ref OrgName
                  INSTANCE_ROLE: !Ref AppServerIamRole
                  EFS_ID: !Ref AppServerFileSystem
                  SECRET_ID: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
                  BUCKET_NAME: !Ref DataS3Bucket
                  MAGENTO_PUB_KEY: !Ref MagentoPublicKey
                  MAGENTO_PRIVATE_KEY: !Ref MagentoPrivateKey
                  MAGENTO_REPOS_SECRET_ARN: !If 
                    - HasMagentoRepoSecrets
                    - !Ref MagentoRepoSecrets
                    - ''
                  DB_CLUSTER_ARN: !Ref DatabaseClusterARN
                  DB_HOST: !Ref DatabaseEndpoint
                  DB_PORT: !Ref DatabasePort
              permissions: 0700
              owner: root
              group: root
        
        InstallCodeDeployAgent:
          Fn::Transform:
            Name: AWS::Include
            Parameters:
              Location: s3://iscale-dev-cloudformation/include/installCodeDeploy.yaml
        
        InstallEFS_Centos:
          Fn::Transform:
            Name: AWS::Include
            Parameters:
              Location: s3://iscale-dev-cloudformation/include/centos/installEFS.yaml
        
        InstallEFS_Linux:
          Fn::Transform:
            Name: AWS::Include
            Parameters:
              Location: s3://iscale-dev-cloudformation/include/installEFS.yaml
        
        InstallMySQLClient:
          Fn::Transform:
            Name: AWS::Include
            Parameters:
              Location: s3://iscale-dev-cloudformation/include/installMySQLClient.yaml
        
        InstallLAMP_Centos:
          packages:
            yum: 
              epel-release: []
              yum-utils: []
          commands:
            01_UseRemi_RPM:
              command: yum install -y http://rpms.remirepo.net/enterprise/remi-release-7.rpm
            02_Disable_Remi54:
              command: yum-config-manager --disable remi-php54
            03_Enable_Remi73:
              command: yum-config-manager --enable remi-php73        
            04_PHP:
              command: yum install -y php
            05_PHP_CLI:
              command: yum install -y php-cli
            06_PHP_FPM:
              command: yum install -y php-fpm
            07_PHP_Mysqlnd:
              command: yum install -y php-mysqlnd
            # 08_PHP_Devel:
            #   command: yum install -y php-devel
            09_PHP_Gd:
              command: yum install -y php-gd
            10_PHP_Curl:
              command: yum install -y php-curl
            11_PHP_ZIP:
              command: yum install -y php-zip
            12_PHP_Mcrypt:
              command: yum install -y php-mcrypt
            13_PHP_MbString:
              command: yum install -y php-mbstring
            14_PHP_XML:
              command: yum install -y php-xml
            15_PHP_Pear:
              command: yum install -y php-pear
            16_PHP_BcMath:
              command: yum install -y php-bcmath
            17_PHP_JSON:
              command: yum install -y php-json
            18_PHP_Intl:
              command: yum install -y php-intl
            19_PHP_Sodium:
              command: yum install -y php-pecl-libsodium
            20_PHP_SOAP:
              command: yum install -y php-soap
            21_Set_Memory_Limit: 
              command: sed -i 's,^memory_limit =.*$,memory_limit = 2048M,' /etc/php.ini
            # 20_HTTPD:
            #   command: yum install -y httpd

        InstallPHP_Linux:
          commands:
            01_Intall_Extras:
              command: yum install -y amazon-linux-extras
            02_Enable_PHP_73:
              command: amazon-linux-extras enable php7.3
            03_Clean_Metadata:
              command: yum clean metadata
            04_Install_PHP:
              command: yum install -y php
            05_Install_BcMath:
              command: yum install -y php-bcmath
            06_Install_Gd:
              command: yum install -y php-gd
            07_Install_PHP_Intl:
              command: yum install -y php-intl
            08_Install_PHP_MbString:
              command: yum install -y php-mbstring
            09_Install_PHP_Mysqlnd:
              command: yum install -y php-mysqlnd
            10_Install_PHP_XML:
              command: yum install -y php-xml
            11_Install_PHP_SOAP:
              command: yum install -y php-soap
            12_Install_PHP_Sodium:
              command: yum install -y php-sodium
            13_Install_HTTPD:
              command: yum install -y httpd
              # mod24_security.x86_64: []

        InstallAWSCLI_Centos:
          Fn::Transform:
            Name: AWS::Include
            Parameters:
              Location: s3://iscale-dev-cloudformation/include/centos/installAWSCLI.yaml

        SetupApache:
          files:
            /var/www/html/pub/health.php:
              content: !Sub
                |
                <?php
                echo "OK";
                ?>
            /var/www/html/info.php:
              content: !Sub
                |
                <?php
                phpinfo();
                ?>
            /etc/httpd/conf.modules.d/remoteip.conf:
              content: !Sub
                |
                RemoteIPHeader X-Forwarded-For
            /etc/httpd/conf.d/magentosite.conf: 
              content: !Sub
                - |
                  UseCanonicalName On
                  <VirtualHost _default_:80>
                          ServerAlias ${DOMAIN}
                          ServerAdmin webmaster@localhost
                          ServerName ${DOMAIN}

                          DocumentRoot /var/www/html/pub
                          <Directory /var/www/html/pub>
                                  Options FollowSymLinks
                                  AllowOverride All
                                  Require all granted
                          </Directory>

                          ErrorLog /var/log/httpd/error.log
                          CustomLog /var/log/httpd/access.log combined

                          RewriteEngine on
                  </VirtualHost>
                - DOMAIN: !Join ['.', [!Join ['-',[!Ref Name, !FindInMap [EnvShort, !Ref EnvName, Name]]], !Ref ClientDomainName]]
              permissions: 0700
              owner: root
              group: root
            /etc/awslogs/config/httpd_error.conf: #This is for AWS Log Manager
              content: !Sub
                |
                [/var/log/httpd/error.log]
                datetime_format = %b %d %H:%M:%S
                file = /var/log/httpd/error.log
                buffer_duration = 5000
                log_stream_name = {instance_id}
                initial_position = start_of_file
                log_group_name = /var/log/httpd/error.log
            /etc/awslogs/config/httpd_access.conf: #This is for AWS Log Manager
              content: !Sub
                |
                [/var/log/httpd/access.log]
                datetime_format = %b %d %H:%M:%S
                file = /var/log/httpd/access.log
                buffer_duration = 5000
                log_stream_name = {instance_id}
                initial_position = start_of_file
                log_group_name = /var/log/httpd/access.log
          commands:
            01_Chown_Html_Apache:
              command: chown -Rf apache:apache /var/www/html/
            # command03: #quote escape error - will need to rework this
            #   command: "sed -i 's/LogFormat \"%h %l %u %t \\"%r\\" %>s %b \\"%{Referer}i\\" \\"%{User-Agent}i\\"\" combined/LogFormat \"%a %l %u %t \\"%r\\" %>s %O \\"%{Referer}i\\" \\"%{User-Agent}i\\"\" combined/' /etc/httpd/conf/httpd.conf"
            02_Set_Memory_Limit: 
              command: sed -i 's,^memory_limit =.*$,memory_limit = 4096M,' /etc/php.ini
            03_Set_Post_Max_Size: 
              command: sed -i 's,^post_max_size =.*$,post_max_size = 50M,' /etc/php.ini
            04_Set_Upload_Max_Size:
              command: sed -i 's,^upload_max_filesize =.*$,upload_max_filesize = 10M,' /etc/php.ini
            05_Start_HTTPD:
              command: service httpd start
            06_ChkConfig_HTTPD:
              command: chkconfig httpd on

        SetupComposer:
          commands:
            01_Curl_Installer:
              command: php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
              cwd: /tmp
            02_Execute_Installer:
              command: php ./composer-setup.php --version=1.10.17
              env: 
                HOME: /tmp
                COMPOSER_HOME: /tmp
              cwd: /tmp
            03_Move_Local_Bin:
              command: mv composer.phar /usr/local/bin/composer
              cwd: /tmp
            04_Setup_Symlink:
              command: ln -s /usr/local/bin/composer /usr/bin/composer

    Properties:
      KeyName: !If [HasInstanceKey, !Ref InstanceKeyName, !Ref 'AWS::NoValue']
      ImageId: !Ref InstanceAMI
      SecurityGroups: [!GetAtt AppServerSecurityGroup.GroupId]
      InstanceType: !Ref InstanceType
      AssociatePublicIpAddress: true
      IamInstanceProfile: !GetAtt AppServerIamProfile.Arn
      InstanceMonitoring: true
      SpotPrice: !If [HasSpotPrice, !Ref InstanceSpotPrice, !Ref 'AWS::NoValue']    
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash -xe
            # yum update -y
            # Install the files and packages from the metadata
            ${BOOT_INSTALL}
            /opt/aws/bin/cfn-init -v --stack ${AWS::StackName} --resource AppServerLaunchConfig -c ${OSTYPE} --region ${AWS::Region} --role ${ROLE}
            ${BOOT_AFTER_CFN}
            # Start up the cfn-hup daemon to listen for changes to the EC2 metadata
            # /opt/aws/bin/cfn-hup || error_exit 'Failed to start cfn-hup'
            # Signal the status from cfn-init
            # /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource AppServerLaunchConfig  --region ${AWS::Region}
          - ROLE: !Ref AppServerIamRole
            OSTYPE: !Ref InstanceOS
            BOOT_INSTALL: !If
              - IsLinux
              - yum install -y aws-cfn-bootstrap
              - yum install -y epel-release && yum install -y https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-latest.amzn1.noarch.rpm && ln -s /usr/local/lib/python2.7/site-packages/cfnbootstrap /usr/lib/python2.7/site-packages/cfnbootstrap
            BOOT_AFTER_CFN: !If
              - IsLinux
              - service codedeploy-agent status
              - service codedeploy-agent start

  AppServerAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    UpdatePolicy:
      AutoScalingReplacingUpdate:
        WillReplace: true
    # CreationPolicy:
    #   AutoScalingCreationPolicy:
    #     MinSuccessfulInstancesPercent: 100
      # ResourceSignal:
      #   Count: 1
      #   Timeout: PT5M
    Properties:
      Cooldown: 60
      MaxSize: 1
      MinSize: 0
      DesiredCapacity: 0 #Make it zero as it will be taken away by blue green
      AutoScalingGroupName: !If
        - UseFriendlyNames
        - !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name, default, ASG]]
        - !Ref 'AWS::NoValue'
      VPCZoneIdentifier:
        -
          Fn::ImportValue:
            !Sub "${NetworkStackName}-PublicSubnetId1"
        -
          Fn::ImportValue:
            !Sub "${NetworkStackName}-PublicSubnetId2"
      TargetGroupARNs: [!Ref AppServerTargetGroup]
      LaunchConfigurationName: !Ref AppServerLaunchConfig
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
          PropagateAtLaunch: True
        - 
          Key: Environment
          Value: !Ref EnvName
          PropagateAtLaunch: True
        - 
          Key: Organization
          Value: !Ref OrgName
          PropagateAtLaunch: True

  # Application Server ELB Target Group 
  AppServerTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /health.php
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: 
        HttpCode: 200
      Name: !Join [ '-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !Ref Name]]
      Port: 80
      Protocol: HTTP
      VpcId:  
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
        - 
          Key: Name
          Value: !Join [ '-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !Ref Name]]
  
  # When the setup has a cache, allow the cache access from the AppServer
  AllowCacheAccessFromAppServer:
    Condition: HasCache
    Type: AWS::EC2::SecurityGroupIngress
    Properties: 
      IpProtocol: TCP
      GroupId: !Ref CacheSecurityGroupId
      FromPort: !Ref CachePort
      ToPort: !Ref CachePort
      SourceSecurityGroupId: !GetAtt AppServerSecurityGroup.GroupId

Outputs:

  AppServerEFSArn:
    Description: ARN of the AppServer EFS
    Value: !GetAtt AppServerFileSystem.Arn

  AppServerTargetGroup:
    Description: Target Group for the AppServer
    Value: !Ref AppServerTargetGroup