AWSTemplateFormatVersion: 2010-09-09
Description: This cloudformation template provisions a load balancer for Device Management System

Metadata:
  AWS::CloudFormation::Interface: 
    ParameterGroups:
      -
        Label:
          default: "Resource Configuration"
        Parameters:
          - Name
          - OrgName
          - EnvName
      -
        Label:
          default: "Load Balancer Configuration"
        Parameters:
          - ElbType
          - Scheme
          - ElbSource
          - ElbPort
          - ElbProtocol
          - InstancePort
          - EnableWebAcl
          - EnableAlarm
      -
        Label:
          default: "Stack Configuration"
        Parameters:
          - NetworkStackName
          - SNSStackName
      -
        Label:
          default: "Certificate Configuration"
        Parameters:
          - ClientDomainName

    ParameterLabels:
      Name:
        default: "Resource Name"
      OrgName:
        default: "Organization Name"
      EnvName:
        default: "Environment Name"
      NetworkStackName:
        default: "Network Stack Name"
      SNSStackName:
        default: "SNS Topic Stack Name"
      ElbType:
        default: "Load Balancer Type"
      Scheme:
        default: "Load Balancer Scheme"
      ElbSource:
        default: "Load Balancer Source CiDR Block"
      ElbPort:
        default: "Load Balancer Port"
      ElbProtocol:
        default: "Load Balancer Protocol"
      InstancePort:
        default: "Instance Port"
      EnableWebAcl:
        default: "Enable Web ACL"
      IsEnableAlarm:
        default: "Enable Cloudwatch Alarm"
      ClientDomainName:
        default: "Client Domain Name"

Parameters:
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Production
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  NetworkStackName:
    Description: The name of the network stack.
    Type: String
    Default: iscale-dev-ue2-network
  SNSStackName:
    Description: the name of the SNS stack.
    Type: String
    Default: iscale-dev-ue2-sns
  ElbType:
    Description: The type of Load Balancer.
    Type: String
    Default: application
    AllowedValues:
      - application
      - network
  Scheme:
    Description: Whether your Load Balancer is public (internet-facing) or private (internal).
    Type: String
    Default: internet-facing
    AllowedValues:
      - internal
      - internet-facing
  SslPolicy:
    Description: The SSL Policy used by the load balancer
    Type: String
    Default: ELBSecurityPolicy-TLS-1-2-2017-01
  ElbSource:
    Description: The source CiDR block which the load balancer accepts traffic.
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '((\d{1,3})\.){3}\d{1,3}/\d{1,2}'
  ElbPort:
    Description: The Load Balancer port.
    Type: Number
    Default: 443
  ElbProtocol:
    Description: The Load Balancer protocol.
    Type: String
    Default: HTTPS
    AllowedValues:
      - HTTP
      - HTTPS
      - TCP
      - TCP_UDP
      - TLS
      - UDP
  HealthCheckIntervalSeconds:
    Description: The approximate amount of time, in seconds, between health checks of an individual target
    Type: Number
    Default: 10
  HealthCheckPath:
    Description: The ping path that is the destination on the targets for health checks
    Type: String
    Default: /health.php
  HealthCheckTimeoutSeconds:
    Description: The amount of time, in seconds, during which no response from a target means a failed health check.
    Type: Number
    Default: 2
  HealthyThresholdCount:
    Description: The number of consecutive health checks successes required before considering an unhealthy target healthy
    Type: Number
    Default: 2
  UnhealthyThresholdCount:
    Description: The number of consecutive health check failures required before considering a target unhealthy
    Type: Number
    Default: 3
  HttpCodes:
    Description: The HTTP codes to use when checking for a successful response from a target
    Type: Number
    Default: 200
  InstancePort:
    Description: The port on which the targets receive traffic.
    Type: Number
    Default: 80
  EnableWebAcl:
    Description: Set to true to enable Web ACL. Otherwise, set to false.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  EnableAlarm:
    Description: Set to true to enable cloudwatch alarm. Otherwise, set to false.
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
  ClientDomainName:
    Description: The client's domain name (e.g. example.com, iscale-solutions.com).
    Type: String
    Default: iscale-software.com

Mappings: 
  ElbTypeShort:
    application:
      Name: alb
    network:
      Name: nlb
  EnvShort:
    Production:
      Name: prd
    Staging:
      Name: stg
    Development:
      Name: dev
    Test:
      Name: test
  RegionShort:
    us-east-2:
      Name: ue2
    us-east-1:
      Name: ue1
    us-west-1:
      Name: uw1
    us-west-2:
      Name: uw2
    ap-east-1:
      Name: ae1
    ap-south-1:
      Name: as1
    ap-northeast-1:
      Name: ane1
    ap-northeast-2:
      Name: ane2
    ap-northeast-3:
      Name: ane3
    ap-southeast-1:
      Name: ase1
    ap-southeast-2:
      Name: ase2
    ca-central-1:
      Name: cc1
    cn-north-1:
      Name: cn1
    cn-northwest-1:
      Name: cnw1
    eu-central-1:
      Name: ec1
    eu-west-1:
      Name: ew1
    eu-west-2:
      Name: ew2
    eu-west-3:
      Name: ew3
    eu-north-1:
      Name: en1
    me-south-1:
      Name: ms1
    sa-east-1:
      Name: se1
    us-gov-east-1:
      Name: uge1
    us-gov-west-1:
      Name: ugw1

Conditions:
  IsApplication: !Equals [!Ref ElbType, application]
  IsNetwork: !Equals [!Ref ElbType, network]
  IsElbSsl: !Equals [!Ref ElbPort, 443]
  IsInstanceSsl: !Equals [!Ref InstancePort, 443]
  IsEnableWebAcl: !Equals [!Ref EnableWebAcl, true]
  IsEnableAlarm: !Equals [!Ref EnableAlarm, true]

Resources: 

####
# VPC Section
####

  DefaultSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name],  !FindInMap [ElbTypeShort, !Ref ElbType, Name],]]
      GroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name],  !FindInMap [ElbTypeShort, !Ref ElbType, Name]]]
      VpcId: 
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
          - 
            Key: Name
            Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name],  !FindInMap [ElbTypeShort, !Ref ElbType, Name]]]

  DefultSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt DefaultSecurityGroup.GroupId
      IpProtocol: "tcp"
      FromPort: !Ref ElbPort
      ToPort: !Ref ElbPort
      CidrIp: !Ref ElbSource
  
  DefultSecurityGroupIngress2:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt DefaultSecurityGroup.GroupId
      IpProtocol: "tcp"
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref ElbSource

  DefultSecurityGroupEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt DefaultSecurityGroup.GroupId
      IpProtocol: -1
      FromPort: -1
      ToPort: -1
      CidrIp:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcCidrBlock"

####
# EC2 Section
####

  DefaultLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties: 
      IpAddressType: ipv4
      LoadBalancerAttributes: 
        - 
          Key: idle_timeout.timeout_seconds
          Value: 300
      Name: !Join [ '-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !FindInMap [ ElbTypeShort, !Ref ElbType, Name]]]
      Scheme: !Ref Scheme
      SecurityGroups: [!If [ IsApplication, !GetAtt DefaultSecurityGroup.GroupId, !Ref 'AWS::NoValue']]
      Subnets:
        - 
          Fn::ImportValue:
            !Sub "${NetworkStackName}-PublicSubnetId1"
        - 
          Fn::ImportValue:
            !Sub "${NetworkStackName}-PublicSubnetId2"
      Type: !Ref ElbType
      Tags:
          - 
            Key: Name
            Value: !Join [ '-', [!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !FindInMap [ ElbTypeShort, !Ref ElbType, Name]]]
          - 
            Key: Environment
            Value: !Ref EnvName
          - 
            Key: Organization
            Value: !Ref OrgName

  # This listener redirects HTTP request to https
  DefaultLoadBalancerListener1:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: IsApplication
    Properties:
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: 443
            Host: "#{host}"
            Path: "/#{path}"
            Query: "#{query}"
            StatusCode: HTTP_301
      LoadBalancerArn: !Ref DefaultLoadBalancer
      Port: 80
      Protocol: HTTP

  # Listener for application load balancer
  DefaultLoadBalancerListener2:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: IsApplication
    Properties: 
      Certificates:
        - CertificateArn: arn:aws:acm:us-east-2:510735018444:certificate/c21bb9ec-eb04-45b7-8179-957781b11edd
      DefaultActions: 
        - Type: "forward"
          TargetGroupArn: !Ref ApplicationTargetGroup
      LoadBalancerArn: !Ref DefaultLoadBalancer
      Port: !Ref ElbPort
      Protocol: !If [IsElbSsl, HTTPS, HTTP]
      SslPolicy: !Ref SslPolicy

  # Listener for application load balancer
  DefaultLoadBalancerListener3:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: IsNetwork
    Properties: 
      DefaultActions: 
        - Type: "forward"
          TargetGroupArn: !Ref NetworkTargetGroup
      LoadBalancerArn: !Ref DefaultLoadBalancer
      Port: !Ref ElbPort
      Protocol: !Ref ElbProtocol

  # Default Target Group

  # Application Target Group
  ApplicationTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: IsApplication
    Properties:
      HealthCheckIntervalSeconds: !Ref HealthCheckIntervalSeconds
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckProtocol: !If [IsInstanceSsl, "HTTPS", "HTTP"]
      HealthCheckTimeoutSeconds: !Ref HealthCheckTimeoutSeconds
      HealthyThresholdCount: !Ref HealthyThresholdCount
      UnhealthyThresholdCount: !Ref UnhealthyThresholdCount
      Matcher: 
        HttpCode: !Ref HttpCodes
      Port: !Ref InstancePort
      Protocol: !If [IsInstanceSsl, "HTTPS", "HTTP"]
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name],  !FindInMap [ElbTypeShort, !Ref ElbType, Name]]]

  # Network Target Group
  NetworkTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: IsNetwork
    Properties:
      Port: !Ref InstancePort
      Protocol: !Ref InstancePort
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name],  !FindInMap [ElbTypeShort, !Ref ElbType, Name]]]

####
# WAF Section
####

  DefaultWebAcl:
    Type: AWS::WAFRegional::WebACL
    Condition: IsEnableWebAcl
    Properties: 
      Name: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name]]]
      MetricName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name]]]
      DefaultAction: 
        Type: ALLOW

  DefaultWebAclAssociation:
    Type: AWS::WAFRegional::WebACLAssociation
    Condition: IsEnableWebAcl
    Properties: 
      ResourceArn: !Ref DefaultLoadBalancer
      WebACLId: !Ref DefaultWebAcl

####
# Cloudwatch Section
####

  UnhealthyHostCountCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsEnableAlarm
    Properties:
      AlarmName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], unhealthy-host-count]]
      MetricName: UnHealthyHostCount
      Namespace: "AWS/ApplicationELB"
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Period: 60
      Statistic: Maximum
      Threshold: 1
      AlarmActions:
        -
          Fn::ImportValue:
            !Sub "${SNSStackName}-TopicArn"
      OKActions:
        -
          Fn::ImportValue:
            !Sub "${SNSStackName}-TopicArn"
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt DefaultLoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt ApplicationTargetGroup.TargetGroupFullName

Outputs:

  LoadBalancerArn: 
    Description: The Arn of the Load Balancer
    Value: !Ref DefaultLoadBalancer
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerArn"

  CanonicalHostedZoneID: 
    Description: The ID of the Amazon Route 53 hosted zone associated with the load balancer
    Value: !GetAtt DefaultLoadBalancer.CanonicalHostedZoneID
    Export:
      Name: !Sub "${AWS::StackName}-CanonicalHostedZoneID"

  DNSName: 
    Description: The DNS name for the load balancer
    Value: !GetAtt DefaultLoadBalancer.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-DNSName"

  LoadBalancerFullName: 
    Description: The full name of the load balancer
    Value: !GetAtt DefaultLoadBalancer.LoadBalancerFullName
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerFullName"

  LoadBalancerName: 
    Description: The name of the load balancer
    Value: !GetAtt DefaultLoadBalancer.LoadBalancerName
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerName"

  SecurityGroupId: 
    Description: The security group ID of the load balancer
    Value: !GetAtt DefaultSecurityGroup.GroupId
    Export:
      Name: !Sub "${AWS::StackName}-SecurityGroupId"

  HttpListenerArn: 
    Description: The HTTP listener arn of the application load balancer 
    Value: !Ref DefaultLoadBalancerListener1
    Export:
      Name: !Sub "${AWS::StackName}-HttpListenerArn"
  
  ApplicationListenerArn:
    Condition: IsApplication
    Description: The HTTPS listener arn of the application load balancer 
    Value: !Ref DefaultLoadBalancerListener2
    Export:
      Name: !Sub "${AWS::StackName}-ApplicationListenerArn"

  NetworkListenerArn:
    Condition: IsNetwork
    Description: The listener arn of the network load balancer 
    Value: !Ref DefaultLoadBalancerListener3
    Export:
      Name: !Sub "${AWS::StackName}-NetworkListenerArn"

  ApplicationTargetGroupArn:
    Description: The target group arn of the application load balancer
    Condition: IsApplication
    Value: !Ref ApplicationTargetGroup
    Export:
      Name: !Sub "${AWS::StackName}-ApplicationTargetGroupArn"

  ApplicationTargetGroupFullName:
    Description: The application target group's full name
    Condition: IsApplication
    Value: !GetAtt ApplicationTargetGroup.TargetGroupFullName
    Export:
      Name: !Sub "${AWS::StackName}-ApplicationTargetGroupFullName"

  ApplicationTargetGroupName:
    Description: The application target group's name
    Condition: IsApplication
    Value: !GetAtt ApplicationTargetGroup.TargetGroupName
    Export:
      Name: !Sub "${AWS::StackName}-ApplicationTargetGroupName"

  NetworkTargetGroupArn:
    Description: The target group arn of the network load balancer
    Condition: IsNetwork
    Value: !Ref NetworkTargetGroup
    Export:
      Name: !Sub "${AWS::StackName}-NetworkTargetGroupArn"

  NetworkTargetGroupFullName:
    Description: The network target group's full name
    Condition: IsNetwork
    Value: !GetAtt NetworkTargetGroup.TargetGroupFullName
    Export:
      Name: !Sub "${AWS::StackName}-NetworkTargetGroupFullName"

  NetworkTargetGroupName:
    Description: The network target group's name
    Condition: IsNetwork
    Value: !GetAtt NetworkTargetGroup.TargetGroupName
    Export:
      Name: !Sub "${AWS::StackName}-NetworkTargetGroupName"