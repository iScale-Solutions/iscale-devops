AWSTemplateFormatVersion: 2010-09-09
Description: This cloudformation template provisions resources for Taiga Docker

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Resource Configuration
        Parameters:
          - Name
          - OrgName
          - EnvName
      - Label:
          default: Cloudformation Stack Configuration
        Parameters:
          - NetworkStackName
          - SNSStackName
      - Label:
          default: Instance Configuration
        Parameters:
          - InstanceAMI
          - InstanceType
          - VolumeName
          - VolumeSize
          - VolumeType
          - DomainName

    ParameterLabels:
      Name:
        default: Resource Name
      OrgName:
        default: Organization Name
      EnvName:
        default: Environment Name
      NetworkStackName:
        default: Network Stack Name
      SNSStackName:
        default: SNS Topic Stack Name
      InstanceAMI:
        default: Instance AMI ID
      InstanceType:
        default: Instance Type
      VolumeName:
        default: Volume Device Name
      VolumeSize:
        default: Volume Disk Size
      VolumeType:
        default: Volume Disk Type 
      DomainName:
        default: Domain Name

Parameters:
  Name:
    Description: Unique name/identifier (Can be client name or resource name).
    Type: String
    MinLength: 3
    MaxLength: 15
  OrgName:
    Description: The name of the organization.
    Type: String
    Default: iscale-dev
    AllowedPattern: "^[a-z]+(-[a-z]+)*$"
    ConstraintDescription: Organization must only contain lowercase letters, numbers and hyphen.
  EnvName:
    Description: The name of the environment
    Type: String
    Default: Development
    AllowedValues:
      - Production
      - Staging
      - Development
      - Test
  NetworkStackName:
    Description: The name of the cloudformation Network stack
    Type: String
    Default: iscale-dev-dev-uw2-network
    MinLength: 1
  SNSStackName:
    Description: The name of the cloudformation SNS stack
    Type: String
    Default: iscale-dev-dev-uw2-sns
    MinLength: 1
  InstanceAMI:
    Description: Instance AMI ID
    Type: AWS::EC2::Image::Id
    Default: ami-004a489de6bc83be4 # base amazon-linux2 AMI
  InstanceType:
    Description: Instance Type
    Type: String
    Default: t3.small
  VolumeName:
    Description: Amazon Linux 2 AMI uses /dev/xvda ; Ubuntu and Windows uses /dev/sda1
    Type: String
    Default: /dev/xvda
    AllowedValues:
      - /dev/xvda
      - /dev/sda1
  VolumeSize:
    Description: Size in GB
    Type: Number
    Default: 8
  VolumeType:
    Type: String
    Default: gp3
  DomainName:
    Type: String
    Description: Taiga domain name in subdomain (test.example.com)
    Default: 'taiga.iscale-software.com'
    MinLength: 1

Mappings: 
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/mappings.yaml

Conditions:
  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: s3://iscale-dev-cloudformation/include/conditions.yaml

Resources:

####
# EC2 Section
####

  TaigaInstance:
    Type: AWS::EC2::Instance
    Properties: 
      ImageId: !Ref InstanceAMI
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref Ec2IamProfile
      Monitoring: true
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeviceIndex: 0
          GroupSet: [!GetAtt DefaultSecurityGroup.GroupId]
          SubnetId:
            Fn::ImportValue:
              !Sub '${NetworkStackName}-PrivateSubnetId1'
      BlockDeviceMappings:
        - DeviceName: !Ref VolumeName
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: !Ref VolumeType
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash -xe
            # Install dependencies
            yum install docker git -y
            sudo curl -L https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m) -o /usr/bin/docker-compose
            sudo chmod +x /usr/bin/docker-compose
            cd /home/ec2-user/
            git clone https://github.com/taigaio/taiga-docker && cd taiga-docker && git checkout stable
            sed -i '/listen 80 default_server;/a server_name ${SITE_URL};' taiga-gateway/taiga.conf
          - SITE_URL: !Ref DomainName
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
        - 
          Key: Environment
          Value: !Ref EnvName
        - 
          Key: Organization
          Value: !Ref OrgName

####
# Security Group Section
####

  DefaultSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      GroupDescription: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]
      VpcId:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcId"
      Tags:
        - 
          Key: Name
          Value: !Join ['-',[!Ref OrgName, !FindInMap [EnvShort, !Ref EnvName, Name], !FindInMap [RegionShort, !Ref 'AWS::Region', Name], !Ref Name]]

  # Security group rules
  DefaultSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt DefaultSecurityGroup.GroupId
      IpProtocol: -1
      FromPort: -1
      ToPort: -1
      CidrIp:
        Fn::ImportValue:
          !Sub "${NetworkStackName}-VpcCidrBlock"
  
  DefaultSecurityGroupEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt DefaultSecurityGroup.GroupId
      IpProtocol: -1
      FromPort: -1
      ToPort: -1
      CidrIp: "0.0.0.0/0"

####
# IAM Section
####

  Ec2IamProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: Ec2IamRole

  Ec2IamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 1
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: ec2.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: AccessCloudWatchMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - ec2:DescribeTags
                Resource: '*'
        - PolicyName: CloudFormationDescribe
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStackResource
                Resource: '*'
