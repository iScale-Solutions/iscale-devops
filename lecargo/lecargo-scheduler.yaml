AWSTemplateFormatVersion: 2010-09-09
Description: This Creates a lambda function that starts/stops the instance every 6AM and 9PM (weekday) respectively and during weekends.

Parameters: 
  Name:
    Description: Unique name/identifier (Can be client name or resource name)
    Type: String
    Default: iscale-stg-ec1-lecargo-scheduler
  TagKey:
    Description: Tag key of the target asg/instance
    Type: String
    Default: Environment
  TagValue:
    Description: The value of the tag key
    Type: String
    Default: Staging
  
Resources:

####
# Cloudwatch Section
####

  SchedulerLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['/', ['/aws/lambda', !Ref SchedulerLambdaFunction]]

  ScheduledEventRuleStop:
    Type: AWS::Events::Rule
    Properties:
      Description: Stops the instance every day at 21:00 GMT+8 (Mon-Fri)
      Name: !Join ['-', [!Ref Name, stop]]
      ScheduleExpression: "cron(0 13 ? * MON-FRI *)"
      State:  "ENABLED"
      Targets:
      - 
        Arn: !GetAtt SchedulerLambdaFunction.Arn
        Id: !Join ['-', [!Ref Name, stop]]

  PermissionForEventsToInvokeLambdaStop:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SchedulerLambdaFunction
      Action:  "lambda:InvokeFunction"
      Principal:  "events.amazonaws.com"
      SourceArn: !GetAtt ScheduledEventRuleStop.Arn

  ScheduledEventRuleStart:
    Type: AWS::Events::Rule
    Properties:
      Description: Starts the instance every day at 06:00 GMT+8 (Mon-Fri)
      Name: !Join ['-', [!Ref Name, start]]
      ScheduleExpression: "cron(0 22 ? * SUN-THU *)"
      State:  "ENABLED"
      Targets:
      - 
        Arn: !GetAtt SchedulerLambdaFunction.Arn 
        Id: !Join [ '-', [!Ref Name, start] ]

  PermissionForEventsToInvokeLambdaStart:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SchedulerLambdaFunction
      Action:  "lambda:InvokeFunction"
      Principal:  "events.amazonaws.com"
      SourceArn: !GetAtt ScheduledEventRuleStart.Arn

####
# IAM Section
####

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: 
              - sts:AssumeRole
      Policies:
        - 
          PolicyName: SchedulerExecutionPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - 
                Effect: Allow
                Action: 
                  - ec2:Start*
                  - ec2:Stop*
                  - ec2:DescribeInstances
                  - ec2:ReportInstanceStatus
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:SuspendProcesses
                  - autoscaling:ResumeProcesses
                Resource: "*"
              - 
                Effect: Allow
                Action: 
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*

####
# Lambda Section
####

  SchedulerLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: "Lambda Function which starts/stops the instance on a given schedule"
      FunctionName: !Ref Name
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn 
      Runtime: python3.6
      Timeout: 900
      Environment:
        Variables:
          REGION: !Ref AWS::Region
          KEY: !Ref TagKey
          VALUE: !Ref TagValue
      Code:
        ZipFile: |

          import boto3
          import logging
          import os

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          asg = boto3.client('autoscaling')

          def get_auto_scaling_group_name(region,key,value):
            names=[]
            client = boto3.client('autoscaling', region_name=region)
            paginator = client.get_paginator('describe_auto_scaling_groups')
            page_iterator = paginator.paginate()
            
            filter='AutoScalingGroups[] | [?contains(Tags[?Key==`{}`].Value, `{}`)]'
            asgs = page_iterator.search(filter.format(key, value))
            
            for asg in asgs:
              names.append(asg["AutoScalingGroupName"])

            return names[0]

          def get_instance_ids(AutoScalingGroupName):
            instance_ids=[]
            instances = asg.describe_auto_scaling_groups(AutoScalingGroupNames=[AutoScalingGroupName])['AutoScalingGroups'][0]['Instances']
            for inst in instances:
              instance_ids.append(inst['InstanceId'])

            return instance_ids
              
          def lambda_handler(event, context):
            region=os.environ['REGION']
            key=os.environ['KEY']
            value=os.environ['VALUE']
            
            # Get the event details
            resources=', '.join(event["resources"])
            stop=resources.find("stop")
            start=resources.find("start")

            try:
              ec2 = boto3.client('ec2',region_name=region)

              autoScalingGroupName = get_auto_scaling_group_name(region,key,value)
              instanceIds=get_instance_ids(autoScalingGroupName)

              # Checks if trigger/event is start or shutdown
              if stop >= 0:
                # Suspends HealthCheck and ReplaceUnhealthy
                logger.info('Suspending HealthCheck and ReplaceUnhealthy')
                logger.info('AutoScalingGroupName: ' + autoScalingGroupName)
                asg.suspend_processes(
                                    AutoScalingGroupName=autoScalingGroupName,
                                    ScalingProcesses=[
                                        'HealthCheck',
                                        'ReplaceUnhealthy'
                                    ]
                                    )

                # Stops the instance
                logger.info('Stopping Instance: ' + str(instanceIds))
                ec2.stop_instances(InstanceIds=instanceIds,DryRun=False)
              elif start >= 0:
                # Starts the instance
                logger.info('Starting Instance: ' + str(instanceIds))
                ec2.start_instances(InstanceIds=instanceIds,DryRun=False)

                # Wait for instance to start
                logger.info('Waiting instance to start: ' + str(instanceIds))
                waiter = ec2.get_waiter('instance_running')
                waiter.wait(InstanceIds=instanceIds)
                logger.info('Instance started: ' + str(instanceIds))

                # Resume HealthCheck and ReplaceUnhealthy
                logger.info('Resuming HealthCheck and ReplaceUnhealthy')
                logger.info('AutoScalingGroupName: ' + autoScalingGroupName)
                asg.resume_processes(
                                    AutoScalingGroupName=autoScalingGroupName,
                                    ScalingProcesses=[
                                        'HealthCheck',
                                        'ReplaceUnhealthy'
                                    ]
                                  )

            except Exception:
              logger.exception('Error Encountered')