name: Canon AWS Plan

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region
        required: true
        default: ap-southeast-1
      stack_name:
        description: Canon CloudFormation stack name
        required: true
        default: canon-prd-iam
      template_path:
        description: Template path in this repository
        required: true
        default: clients/canon/canon-iam.yaml
      create_change_set:
        description: Create a CloudFormation change set without executing it
        required: true
        type: boolean
        default: false
      execute_change_set:
        description: Execute the change set. Only allowed for the bootstrap stack.
        required: true
        type: boolean
        default: false
      continue_rollback:
        description: Continue rollback for the Canon IAM stack after a failed update
        required: true
        type: boolean
        default: false
      rollback_resources_to_skip:
        description: Optional comma-separated logical resource IDs to skip while continuing rollback
        required: false
        default: ""
      existing_change_set_name:
        description: Optional existing change set name to execute after manual review
        required: false
        default: ""
      inspect_stack_only:
        description: Print stack status/events without creating or executing a change set
        required: true
        type: boolean
        default: false
      cleanup_delightful_rds_schedule:
        description: Delete orphaned Delightful staging RDS schedule resources after CloudFormation cleanup permission recovery
        required: true
        type: boolean
        default: false
      enable_delightful_staging_rds_schedule:
        description: Override Delightful staging RDS schedule parameter for this deployment
        required: true
        type: choice
        options:
          - previous
          - "true"
          - "false"
        default: previous
      enable_delightful_prod_eb_environment:
        description: Override Delightful production Elastic Beanstalk environment parameter for this deployment
        required: true
        type: choice
        options:
          - previous
          - "true"
          - "false"
        default: previous
      delightful_staging_db_snapshot_identifier:
        description: Optional staging DB snapshot ARN/name for a deliberate staging DB replacement
        required: false
        default: ""
      delightful_staging_db_snapshot_secret_arn:
        description: Optional secret ARN that matches the staging DB snapshot credentials
        required: false
        default: ""
  pull_request:
    paths:
      - clients/canon/**
      - .github/workflows/canon-*.yml
  push:
    branches:
      - master
    paths:
      - clients/canon/**
      - .github/workflows/canon-*.yml

permissions:
  contents: read
  # Required for GitHub OIDC. Do not add static AWS access keys to this workflow.
  id-token: write

env:
  CANON_AWS_ACCOUNT_ID: "780347486043"
  DEFAULT_CANON_AWS_REGION: ap-southeast-1
  CANON_BOOTSTRAP_STACK_NAME: canon-prd-ase1-github-actions-bootstrap
  CANON_BOOTSTRAP_TEMPLATE_PATH: clients/canon/bootstrap/github-actions-role.yaml
  CANON_IAM_STACK_NAME: canon-prd-iam
  CANON_IAM_TEMPLATE_PATH: clients/canon/canon-iam.yaml
  CANON_DELIGHTFUL_STACK_NAME: canon-stg-delightfulapp
  CANON_DELIGHTFUL_TEMPLATE_PATH: clients/canon/delightfulapp.yaml
  CANON_DELIGHTFUL_STG_EB_APP_NAME: CMP Delightful App Staging ase1
  CANON_DELIGHTFUL_PROD_STACK_NAME: canon-prd-ase1-delightfulapp
  CANON_DELIGHTFUL_PROD_TEMPLATE_PATH: clients/canon/delightfulapp.yaml
  CANON_DELIGHTFUL_PROD_EB_APP_NAME: CMP Delightful App Production
  CANON_DELIGHTFUL_SYSTEM_NAME: delightful
  CANON_DELIGHTFUL_PROD_VPC_ID: vpc-0940b2efc7b4cf2c5
  CANON_DELIGHTFUL_PROD_PUBLIC_SUBNET_IDS: subnet-05cab077a7d3aa68b,subnet-04eb4f6dab658751c
  CANON_DELIGHTFUL_PROD_PRIVATE_SUBNET_IDS: subnet-0bcf598c03ec5dd3f,subnet-0c4e218892ad9558f
  CANON_DELIGHTFUL_VPC_STACK_NAME: canon-prd-ase1-delightful-vpc
  CANON_DELIGHTFUL_VPC_TEMPLATE_PATH: clients/canon/delightful-vpc.yaml

jobs:
  validate:
    name: Validate Canon templates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        if: ${{ vars.CANON_AWS_ROLE_TO_ASSUME != '' && github.event_name != 'pull_request' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CANON_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ github.event.inputs.aws_region || env.DEFAULT_CANON_AWS_REGION }}

      - name: Confirm Canon AWS account
        if: ${{ vars.CANON_AWS_ROLE_TO_ASSUME != '' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "${actual_account_id}" != "${CANON_AWS_ACCOUNT_ID}" ]]; then
            echo "Expected Canon AWS account ${CANON_AWS_ACCOUNT_ID}, got ${actual_account_id}."
            exit 1
          fi

      - name: Validate Canon CloudFormation templates
        if: ${{ vars.CANON_AWS_ROLE_TO_ASSUME != '' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r template; do
            echo "Validating ${template}"
            aws cloudformation validate-template --template-body "file://${template}" >/dev/null
          done < <(find clients/canon -type f \( -name '*.yaml' -o -name '*.yml' \) | sort)

      - name: Skip AWS validation when role is not configured
        if: ${{ vars.CANON_AWS_ROLE_TO_ASSUME == '' || github.event_name == 'pull_request' }}
        shell: bash
        run: |
          echo "AWS validation is skipped until this run is allowed to assume the Canon role."

  change-set:
    name: Prepare change set
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CANON_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Confirm Canon AWS account
        shell: bash
        run: |
          set -euo pipefail
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "${actual_account_id}" != "${CANON_AWS_ACCOUNT_ID}" ]]; then
            echo "Expected Canon AWS account ${CANON_AWS_ACCOUNT_ID}, got ${actual_account_id}."
            exit 1
          fi

      - name: Create non-executed change set
        id: change-set
        shell: bash
        env:
          STACK_NAME: ${{ github.event.inputs.stack_name }}
          TEMPLATE_PATH: ${{ github.event.inputs.template_path }}
          ROLLBACK_RESOURCES_TO_SKIP: ${{ github.event.inputs.rollback_resources_to_skip }}
          EXISTING_CHANGE_SET_NAME: ${{ github.event.inputs.existing_change_set_name }}
          ENABLE_DELIGHTFUL_STAGING_RDS_SCHEDULE: ${{ github.event.inputs.enable_delightful_staging_rds_schedule }}
          ENABLE_DELIGHTFUL_PROD_EB_ENVIRONMENT: ${{ github.event.inputs.enable_delightful_prod_eb_environment }}
          DELIGHTFUL_STAGING_DB_SNAPSHOT_IDENTIFIER: ${{ github.event.inputs.delightful_staging_db_snapshot_identifier }}
          DELIGHTFUL_STAGING_DB_SNAPSHOT_SECRET_ARN: ${{ github.event.inputs.delightful_staging_db_snapshot_secret_arn }}
        run: |
          set -euo pipefail
          change_set_name="canon-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          describe_delightful_prod_eb() {
            if [[ "${STACK_NAME}" != "${CANON_DELIGHTFUL_PROD_STACK_NAME}" || "${TEMPLATE_PATH}" != "${CANON_DELIGHTFUL_PROD_TEMPLATE_PATH}" ]]; then
              return
            fi
            local client_code="${STACK_NAME%%-*}"
            local environment_code
            local region_code
            case "${STACK_NAME}" in
              *-prd-*) environment_code="prd" ;;
              *-stg-*) environment_code="stg" ;;
              *) environment_code="prd" ;;
            esac
            case "${AWS_REGION}" in
              ap-southeast-1) region_code="ase1" ;;
              *) region_code="${AWS_REGION}" ;;
            esac
            local eb_environment_name="${client_code}-${environment_code}-${region_code}-${CANON_DELIGHTFUL_SYSTEM_NAME}"
            aws elasticbeanstalk describe-environments \
              --application-name "${CANON_DELIGHTFUL_PROD_EB_APP_NAME}" \
              --environment-names "${eb_environment_name}" \
              --query 'Environments[].{EnvironmentName:EnvironmentName,Status:Status,Health:Health,HealthStatus:HealthStatus,VersionLabel:VersionLabel,AbortableOperationInProgress:AbortableOperationInProgress,EndpointURL:EndpointURL}' \
              --output table || true
            aws elasticbeanstalk describe-events \
              --application-name "${CANON_DELIGHTFUL_PROD_EB_APP_NAME}" \
              --environment-name "${eb_environment_name}" \
              --max-records 40 \
              --query 'Events[].{Time:EventDate,Severity:Severity,Message:Message}' \
              --output table || true
          }

          if [[ "${{ github.event.inputs.inspect_stack_only }}" == "true" ]]; then
            aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME}" \
              --query 'Stacks[0].{StackName:StackName,StackStatus:StackStatus,StackStatusReason:StackStatusReason}' \
              --output table
            aws cloudformation describe-stack-events \
              --stack-name "${STACK_NAME}" \
              --query 'StackEvents[0:80].{Time:Timestamp,LogicalResourceId:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' \
              --output table
            describe_delightful_prod_eb
            exit 0
          fi

          if [[ "${{ github.event.inputs.cleanup_delightful_rds_schedule }}" == "true" ]]; then
            if [[ "${STACK_NAME}" != "${CANON_DELIGHTFUL_STACK_NAME}" || "${TEMPLATE_PATH}" != "${CANON_DELIGHTFUL_TEMPLATE_PATH}" ]]; then
              echo "Refusing cleanup outside the Delightful staging stack."
              exit 1
            fi

            physical_id_for() {
              local logical_id="$1"
              aws cloudformation describe-stack-resources \
                --stack-name "${STACK_NAME}" \
                --logical-resource-id "${logical_id}" \
                --query 'StackResources[0].PhysicalResourceId' \
                --output text 2>/dev/null || true
            }

            delete_rule() {
              local logical_id="$1"
              local rule_name
              rule_name="$(physical_id_for "${logical_id}")"
              if [[ -z "${rule_name}" || "${rule_name}" == "None" ]]; then
                echo "${logical_id}: no physical rule found."
                return
              fi

              echo "Deleting EventBridge rule ${rule_name}."
              target_ids="$(aws events list-targets-by-rule \
                --rule "${rule_name}" \
                --query 'Targets[].Id' \
                --output text 2>/dev/null || true)"
              if [[ -n "${target_ids}" && "${target_ids}" != "None" ]]; then
                aws events remove-targets --rule "${rule_name}" --ids ${target_ids}
              fi
              aws events delete-rule --name "${rule_name}" || true
            }

            delete_rule StartRDSRule
            delete_rule StopRDSRule

            function_name="$(physical_id_for RDSStartStopFunction)"
            if [[ -n "${function_name}" && "${function_name}" != "None" ]]; then
              echo "Deleting Lambda function ${function_name}."
              aws lambda delete-function --function-name "${function_name}" || true
            else
              echo "RDSStartStopFunction: no physical function found."
            fi

            role_name="$(physical_id_for RDSStartStopRole)"
            if [[ -n "${role_name}" && "${role_name}" != "None" ]]; then
              echo "Deleting IAM role ${role_name}."
              policy_names="$(aws iam list-role-policies \
                --role-name "${role_name}" \
                --query 'PolicyNames[]' \
                --output text 2>/dev/null || true)"
              for policy_name in ${policy_names}; do
                aws iam delete-role-policy --role-name "${role_name}" --policy-name "${policy_name}" || true
              done
              aws iam delete-role --role-name "${role_name}" || true
            else
              echo "RDSStartStopRole: no physical role found."
            fi

            echo "Delightful staging RDS schedule cleanup completed."
            exit 0
          fi

          if [[ "${{ github.event.inputs.continue_rollback }}" == "true" ]]; then
            if [[ "${STACK_NAME}" != "${CANON_IAM_STACK_NAME}" && "${STACK_NAME}" != "${CANON_DELIGHTFUL_STACK_NAME}" && "${STACK_NAME}" != "${CANON_DELIGHTFUL_PROD_STACK_NAME}" ]]; then
              echo "Refusing rollback recovery for this stack."
              exit 1
            fi

            stack_status="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].StackStatus' --output text)"
            echo "${STACK_NAME} status: ${stack_status}"
            case "${stack_status}" in
              UPDATE_ROLLBACK_COMPLETE)
                echo "Rollback already completed for ${STACK_NAME}."
                exit 0
                ;;
              UPDATE_ROLLBACK_FAILED)
                echo "Continuing rollback for ${STACK_NAME}."
                if [[ -n "${ROLLBACK_RESOURCES_TO_SKIP}" ]]; then
                  IFS=',' read -ra resources_to_skip <<< "${ROLLBACK_RESOURCES_TO_SKIP}"
                  aws cloudformation continue-update-rollback \
                    --stack-name "${STACK_NAME}" \
                    --resources-to-skip "${resources_to_skip[@]}"
                else
                  aws cloudformation continue-update-rollback --stack-name "${STACK_NAME}"
                fi
                ;;
              UPDATE_ROLLBACK_IN_PROGRESS|UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS)
                echo "Rollback is already in progress for ${STACK_NAME}; waiting for completion."
                ;;
              *)
                echo "Refusing to continue rollback from ${stack_status}."
                exit 1
                ;;
            esac

            for attempt in {1..60}; do
              stack_status="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].StackStatus' --output text)"
              echo "${STACK_NAME} status: ${stack_status}"
              case "${stack_status}" in
                UPDATE_ROLLBACK_COMPLETE)
                  echo "Rollback completed for ${STACK_NAME}."
                  exit 0
                  ;;
                UPDATE_ROLLBACK_FAILED|ROLLBACK_FAILED)
                  echo "Rollback failed for ${STACK_NAME}."
                  exit 1
                  ;;
              esac
              sleep 10
            done
            echo "Timed out waiting for rollback to complete for ${STACK_NAME}."
            exit 1
          fi

          if [[ -n "${EXISTING_CHANGE_SET_NAME}" ]]; then
            change_set_name="${EXISTING_CHANGE_SET_NAME}"
            change_set_type="$(aws cloudformation describe-change-set \
              --stack-name "${STACK_NAME}" \
              --change-set-name "${change_set_name}" \
              --query 'ChangeSetType' \
              --output text)"
          else
            change_set_type="UPDATE"
            parameter_args=()
            tag_args=()
            saw_enable_elastic_beanstalk_environment_parameter="false"
            saw_staging_database_snapshot_identifier_parameter="false"
            saw_staging_database_snapshot_secret_arn_parameter="false"
            resolved_staging_database_snapshot_secret_arn="${DELIGHTFUL_STAGING_DB_SNAPSHOT_SECRET_ARN}"
            stack_parameters_file="$(mktemp)"
            if aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME}" \
              --query 'Stacks[0].Parameters[].ParameterKey' \
              --output json > "${stack_parameters_file}"; then
              if [[ "${STACK_NAME}" == "${CANON_DELIGHTFUL_STACK_NAME}" && "${TEMPLATE_PATH}" == "${CANON_DELIGHTFUL_TEMPLATE_PATH}" && -n "${DELIGHTFUL_STAGING_DB_SNAPSHOT_IDENTIFIER}" && -z "${resolved_staging_database_snapshot_secret_arn}" ]]; then
                resolved_staging_database_snapshot_secret_arn="$(aws cloudformation describe-stacks \
                  --stack-name "${STACK_NAME}" \
                  --query 'Stacks[0].Outputs[?OutputKey==`DatabaseSecretArn`].OutputValue | [0]' \
                  --output text)"
                if [[ -z "${resolved_staging_database_snapshot_secret_arn}" || "${resolved_staging_database_snapshot_secret_arn}" == "None" ]]; then
                  echo "Could not resolve current DatabaseSecretArn output for staging snapshot restore."
                  exit 1
                fi
                echo "Using current staging DatabaseSecretArn output for snapshot restore."
              fi
              while IFS= read -r parameter_key; do
                if [[ "${parameter_key}" == "CanonDelightfulCloudWatchStackName" || "${parameter_key}" == "DeveloperGroup" ]]; then
                  continue
                fi
                if [[ "${parameter_key}" == "EnableStagingRdsSchedule" && "${ENABLE_DELIGHTFUL_STAGING_RDS_SCHEDULE}" != "previous" ]]; then
                  if [[ "${STACK_NAME}" != "${CANON_DELIGHTFUL_STACK_NAME}" || "${TEMPLATE_PATH}" != "${CANON_DELIGHTFUL_TEMPLATE_PATH}" ]]; then
                    echo "Refusing staging RDS schedule override for this stack."
                    exit 1
                  fi
                  parameter_args+=("ParameterKey=${parameter_key},ParameterValue=${ENABLE_DELIGHTFUL_STAGING_RDS_SCHEDULE}")
                elif [[ "${parameter_key}" == "EnableElasticBeanstalkEnvironment" && "${ENABLE_DELIGHTFUL_PROD_EB_ENVIRONMENT}" != "previous" ]]; then
                  saw_enable_elastic_beanstalk_environment_parameter="true"
                  if [[ "${STACK_NAME}" != "${CANON_DELIGHTFUL_PROD_STACK_NAME}" || "${TEMPLATE_PATH}" != "${CANON_DELIGHTFUL_PROD_TEMPLATE_PATH}" ]]; then
                    echo "Refusing prod EB environment override for this stack."
                    exit 1
                  fi
                  parameter_args+=("ParameterKey=${parameter_key},ParameterValue=${ENABLE_DELIGHTFUL_PROD_EB_ENVIRONMENT}")
                elif [[ "${parameter_key}" == "ElasticBeanstalkApplicationName" && "${STACK_NAME}" == "${CANON_DELIGHTFUL_STACK_NAME}" && "${TEMPLATE_PATH}" == "${CANON_DELIGHTFUL_TEMPLATE_PATH}" ]]; then
                  parameter_args+=("ParameterKey=${parameter_key},ParameterValue=${CANON_DELIGHTFUL_STG_EB_APP_NAME}")
                elif [[ "${parameter_key}" == "ElasticBeanstalkApplicationName" && "${STACK_NAME}" == "${CANON_DELIGHTFUL_PROD_STACK_NAME}" && "${TEMPLATE_PATH}" == "${CANON_DELIGHTFUL_PROD_TEMPLATE_PATH}" ]]; then
                  parameter_args+=("ParameterKey=${parameter_key},ParameterValue=${CANON_DELIGHTFUL_PROD_EB_APP_NAME}")
                elif [[ "${parameter_key}" == "StagingDatabaseSnapshotIdentifier" && -n "${DELIGHTFUL_STAGING_DB_SNAPSHOT_IDENTIFIER}" ]]; then
                  saw_staging_database_snapshot_identifier_parameter="true"
                  if [[ "${STACK_NAME}" != "${CANON_DELIGHTFUL_STACK_NAME}" || "${TEMPLATE_PATH}" != "${CANON_DELIGHTFUL_TEMPLATE_PATH}" ]]; then
                    echo "Refusing staging DB snapshot override for this stack."
                    exit 1
                  fi
                  parameter_args+=("ParameterKey=${parameter_key},ParameterValue=${DELIGHTFUL_STAGING_DB_SNAPSHOT_IDENTIFIER}")
                elif [[ "${parameter_key}" == "StagingDatabaseSnapshotSecretArn" && -n "${resolved_staging_database_snapshot_secret_arn}" ]]; then
                  saw_staging_database_snapshot_secret_arn_parameter="true"
                  if [[ "${STACK_NAME}" != "${CANON_DELIGHTFUL_STACK_NAME}" || "${TEMPLATE_PATH}" != "${CANON_DELIGHTFUL_TEMPLATE_PATH}" ]]; then
                    echo "Refusing staging DB snapshot secret override for this stack."
                    exit 1
                  fi
                  parameter_args+=("ParameterKey=${parameter_key},ParameterValue=${resolved_staging_database_snapshot_secret_arn}")
                else
                  parameter_args+=("ParameterKey=${parameter_key},UsePreviousValue=true")
                fi
              done < <(jq -r '.[]?' "${stack_parameters_file}")
            else
              change_set_type="CREATE"
            fi

            if [[ "${change_set_type}" == "UPDATE" && "${STACK_NAME}" == "${CANON_DELIGHTFUL_STACK_NAME}" && "${TEMPLATE_PATH}" == "${CANON_DELIGHTFUL_TEMPLATE_PATH}" ]]; then
              if [[ -n "${DELIGHTFUL_STAGING_DB_SNAPSHOT_IDENTIFIER}" && "${saw_staging_database_snapshot_identifier_parameter}" == "false" ]]; then
                parameter_args+=("ParameterKey=StagingDatabaseSnapshotIdentifier,ParameterValue=${DELIGHTFUL_STAGING_DB_SNAPSHOT_IDENTIFIER}")
              fi
              if [[ -n "${resolved_staging_database_snapshot_secret_arn}" && "${saw_staging_database_snapshot_secret_arn_parameter}" == "false" ]]; then
                parameter_args+=("ParameterKey=StagingDatabaseSnapshotSecretArn,ParameterValue=${resolved_staging_database_snapshot_secret_arn}")
              fi
            fi

            if [[ "${change_set_type}" == "UPDATE" && "${STACK_NAME}" == "${CANON_DELIGHTFUL_PROD_STACK_NAME}" && "${TEMPLATE_PATH}" == "${CANON_DELIGHTFUL_PROD_TEMPLATE_PATH}" && "${ENABLE_DELIGHTFUL_PROD_EB_ENVIRONMENT}" != "previous" && "${saw_enable_elastic_beanstalk_environment_parameter}" == "false" ]]; then
              parameter_args+=("ParameterKey=EnableElasticBeanstalkEnvironment,ParameterValue=${ENABLE_DELIGHTFUL_PROD_EB_ENVIRONMENT}")
            fi

            if [[ "${change_set_type}" == "CREATE" && "${STACK_NAME}" == "${CANON_DELIGHTFUL_PROD_STACK_NAME}" && "${TEMPLATE_PATH}" == "${CANON_DELIGHTFUL_PROD_TEMPLATE_PATH}" ]]; then
              parameter_args+=("ParameterKey=DeploymentMode,ParameterValue=production")
              parameter_args+=("ParameterKey=ElasticBeanstalkApplicationName,ParameterValue=${CANON_DELIGHTFUL_PROD_EB_APP_NAME}")
              parameter_args+=("ParameterKey=VpcId,ParameterValue=${CANON_DELIGHTFUL_PROD_VPC_ID}")
              parameter_args+=("ParameterKey=SubnetIds,ParameterValue=${CANON_DELIGHTFUL_PROD_PUBLIC_SUBNET_IDS//,/\\,}")
              parameter_args+=("ParameterKey=PrivateSubnetIds,ParameterValue=${CANON_DELIGHTFUL_PROD_PRIVATE_SUBNET_IDS//,/\\,}")
              parameter_args+=("ParameterKey=EnableStagingRdsSchedule,ParameterValue=false")
              parameter_args+=("ParameterKey=EnableElasticBeanstalkEnvironment,ParameterValue=true")
            fi

            if [[ "${STACK_NAME}" == "${CANON_DELIGHTFUL_STACK_NAME}" && "${TEMPLATE_PATH}" == "${CANON_DELIGHTFUL_TEMPLATE_PATH}" ]]; then
              stack_tags_file="$(mktemp)"
              if aws cloudformation describe-stacks \
                --stack-name "${STACK_NAME}" \
                --query 'Stacks[0].Tags' \
                --output json > "${stack_tags_file}"; then
                while IFS= read -r tag; do
                  tag_args+=("${tag}")
                done < <(jq -r '
                  (
                    map(select(.Key != "Environment" and .Key != "DeploymentMode"))
                    + [
                      {"Key":"Environment","Value":"Staging"},
                      {"Key":"DeploymentMode","Value":"Staging"}
                    ]
                  )
                  | .[]
                  | "Key=\(.Key),Value=\(.Value)"
                ' "${stack_tags_file}")
              else
                tag_args+=("Key=Environment,Value=Staging")
                tag_args+=("Key=DeploymentMode,Value=Staging")
              fi
            fi

            if [[ "${STACK_NAME}" == "${CANON_DELIGHTFUL_PROD_STACK_NAME}" && "${TEMPLATE_PATH}" == "${CANON_DELIGHTFUL_PROD_TEMPLATE_PATH}" ]]; then
              stack_tags_file="$(mktemp)"
              if aws cloudformation describe-stacks \
                --stack-name "${STACK_NAME}" \
                --query 'Stacks[0].Tags' \
                --output json > "${stack_tags_file}"; then
                while IFS= read -r tag; do
                  tag_args+=("${tag}")
                done < <(jq -r '
                  (
                    map(select(.Key != "System" and .Key != "Environment" and .Key != "DeploymentMode"))
                    + [
                      {"Key":"System","Value":"Delightful"},
                      {"Key":"Environment","Value":"Production"},
                      {"Key":"DeploymentMode","Value":"Production"}
                    ]
                  )
                  | .[]
                  | "Key=\(.Key),Value=\(.Value)"
                ' "${stack_tags_file}")
              else
                tag_args+=("Key=System,Value=Delightful")
                tag_args+=("Key=Environment,Value=Production")
                tag_args+=("Key=DeploymentMode,Value=Production")
              fi
            fi

            if [[ "${STACK_NAME}" == "${CANON_DELIGHTFUL_VPC_STACK_NAME}" && "${TEMPLATE_PATH}" == "${CANON_DELIGHTFUL_VPC_TEMPLATE_PATH}" ]]; then
              stack_tags_file="$(mktemp)"
              if aws cloudformation describe-stacks \
                --stack-name "${STACK_NAME}" \
                --query 'Stacks[0].Tags' \
                --output json > "${stack_tags_file}"; then
                while IFS= read -r tag; do
                  tag_args+=("${tag}")
                done < <(jq -r '
                  (
                    map(select(.Key != "System" and .Key != "Environment"))
                    + [
                      {"Key":"System","Value":"Delightful"},
                      {"Key":"Environment","Value":"Production"}
                    ]
                  )
                  | .[]
                  | "Key=\(.Key),Value=\(.Value)"
                ' "${stack_tags_file}")
              else
                tag_args+=("Key=System,Value=Delightful")
                tag_args+=("Key=Environment,Value=Production")
              fi
            fi

            create_change_set_args=(
              --stack-name "${STACK_NAME}"
              --change-set-name "${change_set_name}"
              --change-set-type "${change_set_type}"
              --template-body "file://${TEMPLATE_PATH}"
              --capabilities CAPABILITY_NAMED_IAM
              --description "Prepared by GitHub Actions run ${GITHUB_RUN_ID}; not executed by this workflow."
            )
            if [[ "${#parameter_args[@]}" -gt 0 ]]; then
              create_change_set_args+=(--parameters "${parameter_args[@]}")
            fi
            if [[ "${#tag_args[@]}" -gt 0 ]]; then
              create_change_set_args+=(--tags "${tag_args[@]}")
            fi

            aws cloudformation create-change-set \
              "${create_change_set_args[@]}"

            echo "Waiting for change set creation..."
            if ! aws cloudformation wait change-set-create-complete \
              --stack-name "${STACK_NAME}" \
              --change-set-name "${change_set_name}"; then
              status_reason="$(aws cloudformation describe-change-set \
                --stack-name "${STACK_NAME}" \
                --change-set-name "${change_set_name}" \
                --query 'StatusReason' \
                --output text)"
              echo "${status_reason}"
              if [[ "${status_reason}" == *"The submitted information didn't contain changes"* || "${status_reason}" == *"No updates are to be performed"* ]]; then
                exit 0
              fi
              exit 1
            fi
          fi

          change_set_file="$(mktemp)"
          aws cloudformation describe-change-set \
            --stack-name "${STACK_NAME}" \
            --change-set-name "${change_set_name}" \
            --query 'Changes[].ResourceChange.{Action:Action,LogicalResourceId:LogicalResourceId,ResourceType:ResourceType,Replacement:Replacement}' \
            --output table
          aws cloudformation describe-change-set \
            --stack-name "${STACK_NAME}" \
            --change-set-name "${change_set_name}" \
            --include-property-values \
            --output json > "${change_set_file}"
          jq -r '
            .Changes[].ResourceChange
            | [
                .Action,
                .LogicalResourceId,
                .ResourceType,
                (.Replacement // "N/A"),
                (
                  [
                    .Details[]?
                    | "\(.Target.Attribute):\(.Target.Name // "N/A"):\(.Target.Path // "N/A"):\(.Target.AttributeChangeType // "N/A"):\(.Evaluation):before=\(.Target.BeforeValue // "N/A"):after=\(.Target.AfterValue // "N/A")"
                  ]
                  | if length == 0 then "No detail entries" else join("; ") end
                )
              ]
            | @tsv
          ' "${change_set_file}" | column -t -s $'\t'

          if [[ "${{ github.event.inputs.execute_change_set }}" == "true" ]]; then
            if [[ ! ( "${STACK_NAME}" == "${CANON_BOOTSTRAP_STACK_NAME}" && "${TEMPLATE_PATH}" == "${CANON_BOOTSTRAP_TEMPLATE_PATH}" ) && ! ( "${STACK_NAME}" == "${CANON_IAM_STACK_NAME}" && "${TEMPLATE_PATH}" == "${CANON_IAM_TEMPLATE_PATH}" ) && ! ( "${STACK_NAME}" == "${CANON_DELIGHTFUL_STACK_NAME}" && "${TEMPLATE_PATH}" == "${CANON_DELIGHTFUL_TEMPLATE_PATH}" ) && ! ( "${STACK_NAME}" == "${CANON_DELIGHTFUL_PROD_STACK_NAME}" && "${TEMPLATE_PATH}" == "${CANON_DELIGHTFUL_PROD_TEMPLATE_PATH}" ) && ! ( "${STACK_NAME}" == "${CANON_DELIGHTFUL_VPC_STACK_NAME}" && "${TEMPLATE_PATH}" == "${CANON_DELIGHTFUL_VPC_TEMPLATE_PATH}" ) ]]; then
              echo "Refusing to execute change set for this stack/template."
              exit 1
            fi

            echo "Executing change set ${change_set_name} for ${STACK_NAME}."
            aws cloudformation execute-change-set \
              --stack-name "${STACK_NAME}" \
              --change-set-name "${change_set_name}"
            if [[ "${change_set_type}" == "CREATE" ]]; then
              waiter_name="stack-create-complete"
            else
              waiter_name="stack-update-complete"
            fi
            if ! aws cloudformation wait "${waiter_name}" --stack-name "${STACK_NAME}"; then
              aws cloudformation describe-stack-events \
                --stack-name "${STACK_NAME}" \
                --query 'StackEvents[0:80].{Time:Timestamp,LogicalResourceId:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' \
                --output table
              describe_delightful_prod_eb
              exit 1
            fi
            echo "Stack update completed for ${STACK_NAME}."
          else
            echo "Created change set ${change_set_name}. Review it in CloudFormation; this workflow did not execute it."
          fi
