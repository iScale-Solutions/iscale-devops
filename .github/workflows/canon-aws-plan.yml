name: Canon AWS Plan

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region
        required: true
        default: ap-southeast-1
      stack_name:
        description: Canon CloudFormation stack name
        required: true
        default: canon-prd-iam
      template_path:
        description: Template path in this repository
        required: true
        default: clients/canon/canon-iam.yaml
      create_change_set:
        description: Create a CloudFormation change set without executing it
        required: true
        type: boolean
        default: false
      execute_change_set:
        description: Execute the change set. Only allowed for the bootstrap stack.
        required: true
        type: boolean
        default: false
      continue_rollback:
        description: Continue rollback for the Canon IAM stack after a failed update
        required: true
        type: boolean
        default: false
      rollback_resources_to_skip:
        description: Optional comma-separated logical resource IDs to skip while continuing rollback
        required: false
        default: ""
      existing_change_set_name:
        description: Optional existing change set name to execute after manual review
        required: false
        default: ""
      inspect_stack_only:
        description: Print stack status/events without creating or executing a change set
        required: true
        type: boolean
        default: false
      cleanup_delightful_rds_schedule:
        description: Delete orphaned Delightful staging RDS schedule resources after CloudFormation cleanup permission recovery
        required: true
        type: boolean
        default: false
      repair_delightful_app_zip_uploader:
        description: Recreate the missing Delightful app zip uploader Lambda from CloudFormation metadata
        required: true
        type: boolean
        default: false
      enable_delightful_staging_rds_schedule:
        description: Override Delightful staging RDS schedule parameter for this deployment
        required: true
        type: choice
        options:
          - previous
          - "true"
          - "false"
        default: previous
  pull_request:
    paths:
      - clients/canon/**
      - .github/workflows/canon-*.yml
  push:
    branches:
      - master
    paths:
      - clients/canon/**
      - .github/workflows/canon-*.yml

permissions:
  contents: read
  # Required for GitHub OIDC. Do not add static AWS access keys to this workflow.
  id-token: write

env:
  CANON_AWS_ACCOUNT_ID: "780347486043"
  DEFAULT_CANON_AWS_REGION: ap-southeast-1
  CANON_BOOTSTRAP_STACK_NAME: canon-prd-ase1-github-actions-bootstrap
  CANON_BOOTSTRAP_TEMPLATE_PATH: clients/canon/bootstrap/github-actions-role.yaml
  CANON_IAM_STACK_NAME: canon-prd-iam
  CANON_IAM_TEMPLATE_PATH: clients/canon/canon-iam.yaml
  CANON_DELIGHTFUL_STACK_NAME: canon-stg-delightfulapp
  CANON_DELIGHTFUL_TEMPLATE_PATH: clients/canon/delightfulapp.yaml
  CANON_DELIGHTFUL_VPC_STACK_NAME: canon-prd-ase1-delightful-vpc
  CANON_DELIGHTFUL_VPC_TEMPLATE_PATH: clients/canon/delightful-vpc.yaml

jobs:
  lint:
    name: Lint Canon changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install lint tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user cfn-lint
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Lint Canon files
        shell: bash
        env:
          TEMPLATE_PATH: ${{ github.event.inputs.template_path }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            files=(
              ".github/workflows/canon-aws-plan.yml"
              ".github/workflows/canon-aws-audit.yml"
              "clients/canon/lint-canon.sh"
              "clients/canon/audit/export-canon-aws-inventory.sh"
            )
            if [[ -n "${TEMPLATE_PATH}" ]]; then
              files+=("${TEMPLATE_PATH}")
            fi
            clients/canon/lint-canon.sh --files "${files[@]}"
          else
            if [[ "${EVENT_NAME}" == "pull_request" ]]; then
              base_ref="${PR_BASE_SHA}"
            elif [[ "${PUSH_BEFORE_SHA}" =~ ^0+$ ]]; then
              base_ref="HEAD~1"
            else
              base_ref="${PUSH_BEFORE_SHA}"
            fi
            clients/canon/lint-canon.sh --changed "${base_ref}" "${GITHUB_SHA}"
          fi

  validate:
    name: Validate Canon templates
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        if: ${{ vars.CANON_AWS_ROLE_TO_ASSUME != '' && github.event_name != 'pull_request' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CANON_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ github.event.inputs.aws_region || env.DEFAULT_CANON_AWS_REGION }}

      - name: Confirm Canon AWS account
        if: ${{ vars.CANON_AWS_ROLE_TO_ASSUME != '' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "${actual_account_id}" != "${CANON_AWS_ACCOUNT_ID}" ]]; then
            echo "Expected Canon AWS account ${CANON_AWS_ACCOUNT_ID}, got ${actual_account_id}."
            exit 1
          fi

      - name: Validate Canon CloudFormation templates
        if: ${{ vars.CANON_AWS_ROLE_TO_ASSUME != '' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r template; do
            echo "Validating ${template}"
            aws cloudformation validate-template --template-body "file://${template}" >/dev/null
          done < <(find clients/canon -type f \( -name '*.yaml' -o -name '*.yml' \) | sort)

      - name: Skip AWS validation when role is not configured
        if: ${{ vars.CANON_AWS_ROLE_TO_ASSUME == '' || github.event_name == 'pull_request' }}
        shell: bash
        run: |
          echo "AWS validation is skipped until this run is allowed to assume the Canon role."

  change-set:
    name: Prepare change set
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.create_change_set == 'true' || github.event.inputs.execute_change_set == 'true' || github.event.inputs.continue_rollback == 'true' || github.event.inputs.existing_change_set_name != '' || github.event.inputs.inspect_stack_only == 'true' || github.event.inputs.cleanup_delightful_rds_schedule == 'true' || github.event.inputs.repair_delightful_app_zip_uploader == 'true') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CANON_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Confirm Canon AWS account
        shell: bash
        run: |
          set -euo pipefail
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "${actual_account_id}" != "${CANON_AWS_ACCOUNT_ID}" ]]; then
            echo "Expected Canon AWS account ${CANON_AWS_ACCOUNT_ID}, got ${actual_account_id}."
            exit 1
          fi

      - name: Create non-executed change set
        id: change-set
        shell: bash
        env:
          STACK_NAME: ${{ github.event.inputs.stack_name }}
          TEMPLATE_PATH: ${{ github.event.inputs.template_path }}
          ROLLBACK_RESOURCES_TO_SKIP: ${{ github.event.inputs.rollback_resources_to_skip }}
          EXISTING_CHANGE_SET_NAME: ${{ github.event.inputs.existing_change_set_name }}
          ENABLE_DELIGHTFUL_STAGING_RDS_SCHEDULE: ${{ github.event.inputs.enable_delightful_staging_rds_schedule }}
        run: |
          set -euo pipefail
          change_set_name="canon-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          if [[ "${{ github.event.inputs.inspect_stack_only }}" == "true" ]]; then
            aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME}" \
              --query 'Stacks[0].{StackName:StackName,StackStatus:StackStatus,StackStatusReason:StackStatusReason}' \
              --output table
            aws cloudformation describe-stack-events \
              --stack-name "${STACK_NAME}" \
              --query 'StackEvents[0:20].{Time:Timestamp,LogicalResourceId:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' \
              --output table
            exit 0
          fi

          if [[ "${{ github.event.inputs.cleanup_delightful_rds_schedule }}" == "true" ]]; then
            if [[ "${STACK_NAME}" != "${CANON_DELIGHTFUL_STACK_NAME}" || "${TEMPLATE_PATH}" != "${CANON_DELIGHTFUL_TEMPLATE_PATH}" ]]; then
              echo "Refusing cleanup. This mode is only allowed for ${CANON_DELIGHTFUL_STACK_NAME} using ${CANON_DELIGHTFUL_TEMPLATE_PATH}."
              exit 1
            fi

            physical_id_for() {
              local logical_id="$1"
              aws cloudformation describe-stack-resources \
                --stack-name "${STACK_NAME}" \
                --logical-resource-id "${logical_id}" \
                --query 'StackResources[0].PhysicalResourceId' \
                --output text 2>/dev/null || true
            }

            delete_rule() {
              local logical_id="$1"
              local rule_name
              rule_name="$(physical_id_for "${logical_id}")"
              if [[ -z "${rule_name}" || "${rule_name}" == "None" ]]; then
                echo "${logical_id}: no physical rule found."
                return
              fi

              echo "Deleting EventBridge rule ${rule_name}."
              target_ids="$(aws events list-targets-by-rule \
                --rule "${rule_name}" \
                --query 'Targets[].Id' \
                --output text 2>/dev/null || true)"
              if [[ -n "${target_ids}" && "${target_ids}" != "None" ]]; then
                aws events remove-targets --rule "${rule_name}" --ids ${target_ids}
              fi
              aws events delete-rule --name "${rule_name}" || true
            }

            delete_rule StartRDSRule
            delete_rule StopRDSRule

            function_name="$(physical_id_for RDSStartStopFunction)"
            if [[ -n "${function_name}" && "${function_name}" != "None" ]]; then
              echo "Deleting Lambda function ${function_name}."
              aws lambda delete-function --function-name "${function_name}" || true
            else
              echo "RDSStartStopFunction: no physical function found."
            fi

            role_name="$(physical_id_for RDSStartStopRole)"
            if [[ -n "${role_name}" && "${role_name}" != "None" ]]; then
              echo "Deleting IAM role ${role_name}."
              policy_names="$(aws iam list-role-policies \
                --role-name "${role_name}" \
                --query 'PolicyNames[]' \
                --output text 2>/dev/null || true)"
              for policy_name in ${policy_names}; do
                aws iam delete-role-policy --role-name "${role_name}" --policy-name "${policy_name}" || true
              done
              aws iam delete-role --role-name "${role_name}" || true
            else
              echo "RDSStartStopRole: no physical role found."
            fi

            echo "Delightful staging RDS schedule cleanup completed."
            exit 0
          fi

          if [[ "${{ github.event.inputs.repair_delightful_app_zip_uploader }}" == "true" ]]; then
            if [[ "${STACK_NAME}" != "${CANON_DELIGHTFUL_STACK_NAME}" || "${TEMPLATE_PATH}" != "${CANON_DELIGHTFUL_TEMPLATE_PATH}" ]]; then
              echo "Refusing app zip uploader repair. This mode is only allowed for ${CANON_DELIGHTFUL_STACK_NAME} using ${CANON_DELIGHTFUL_TEMPLATE_PATH}."
              exit 1
            fi

            physical_id_for() {
              local logical_id="$1"
              aws cloudformation describe-stack-resources \
                --stack-name "${STACK_NAME}" \
                --logical-resource-id "${logical_id}" \
                --query 'StackResources[0].PhysicalResourceId' \
                --output text
            }

            function_name="$(physical_id_for AppZipUploaderFunction)"
            if [[ -z "${function_name}" || "${function_name}" == "None" ]]; then
              echo "AppZipUploaderFunction has no CloudFormation physical ID."
              exit 1
            fi

            if aws lambda get-function --function-name "${function_name}" >/dev/null 2>&1; then
              echo "Lambda function ${function_name} already exists."
              exit 0
            fi

            role_name="$(physical_id_for AppZipUploaderFunctionRole)"
            bucket_name="$(physical_id_for AppSourceBucket)"
            app_s3_key="$(aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME}" \
              --query "Stacks[0].Parameters[?ParameterKey=='AppS3Key'].ParameterValue | [0]" \
              --output text)"
            role_arn="$(aws iam get-role --role-name "${role_name}" --query 'Role.Arn' --output text)"

            repair_dir="$(mktemp -d)"
            cat > "${repair_dir}/index.py" <<'PY'
          import boto3
          import io
          import json
          import os
          import urllib.request
          import zipfile

          S3_BUCKET = os.environ["BUCKET"]
          S3_KEY = os.environ["KEY"]


          def send_response(event, context, response_status, reason=None):
              response_url = event["ResponseURL"]
              response_body = {
                  "Status": response_status,
                  "Reason": reason or f"See the details in CloudWatch Log Stream: {context.log_stream_name}",
                  "PhysicalResourceId": context.log_stream_name,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": {},
              }
              body = json.dumps(response_body)
              headers = {"content-type": "", "content-length": str(len(body))}
              request = urllib.request.Request(response_url, data=body.encode(), headers=headers, method="PUT")
              try:
                  with urllib.request.urlopen(request) as response:
                      response.read()
              except Exception as exc:
                  print(f"send_response failed: {exc}")


          def handler(event, context):
              try:
                  s3 = boto3.client("s3")
                  request_type = event.get("RequestType")
                  if request_type == "Delete":
                      try:
                          s3.delete_object(Bucket=S3_BUCKET, Key=S3_KEY)
                      except Exception as exc:
                          print(f"S3 delete_object failed: {exc}")
                      send_response(event, context, "SUCCESS")
                      return
                  if request_type == "Update":
                      send_response(event, context, "SUCCESS")
                      return

                  zip_buffer = io.BytesIO()
                  with zipfile.ZipFile(zip_buffer, "w", zipfile.ZIP_DEFLATED) as archive:
                      archive.writestr("index.php", b'<?php echo "Hello, World!";')
                  zip_buffer.seek(0)
                  s3.put_object(Bucket=S3_BUCKET, Key=S3_KEY, Body=zip_buffer.read())
                  send_response(event, context, "SUCCESS")
              except Exception as exc:
                  print(f"Lambda error: {exc}")
                  send_response(event, context, "FAILED", reason=str(exc))
          PY
            (cd "${repair_dir}" && zip -q function.zip index.py)
            environment_file="$(mktemp)"
            jq -n --arg bucket "${bucket_name}" --arg key "${app_s3_key}" \
              '{Variables:{BUCKET:$bucket,KEY:$key}}' > "${environment_file}"

            echo "Recreating missing Lambda function ${function_name}."
            aws lambda create-function \
              --function-name "${function_name}" \
              --runtime python3.12 \
              --handler index.handler \
              --role "${role_arn}" \
              --timeout 60 \
              --zip-file "fileb://${repair_dir}/function.zip" \
              --environment "file://${environment_file}"
            exit 0
          fi

          if [[ "${{ github.event.inputs.continue_rollback }}" == "true" ]]; then
            if [[ "${STACK_NAME}" != "${CANON_IAM_STACK_NAME}" && "${STACK_NAME}" != "${CANON_DELIGHTFUL_STACK_NAME}" ]]; then
              echo "Refusing to continue rollback. Rollback recovery is only allowed for ${CANON_IAM_STACK_NAME} or ${CANON_DELIGHTFUL_STACK_NAME}."
              exit 1
            fi

            stack_status="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].StackStatus' --output text)"
            echo "${STACK_NAME} status: ${stack_status}"
            case "${stack_status}" in
              UPDATE_ROLLBACK_COMPLETE)
                echo "Rollback already completed for ${STACK_NAME}."
                exit 0
                ;;
              UPDATE_ROLLBACK_FAILED)
                echo "Continuing rollback for ${STACK_NAME}."
                if [[ -n "${ROLLBACK_RESOURCES_TO_SKIP}" ]]; then
                  IFS=',' read -ra resources_to_skip <<< "${ROLLBACK_RESOURCES_TO_SKIP}"
                  aws cloudformation continue-update-rollback \
                    --stack-name "${STACK_NAME}" \
                    --resources-to-skip "${resources_to_skip[@]}"
                else
                  aws cloudformation continue-update-rollback --stack-name "${STACK_NAME}"
                fi
                ;;
              UPDATE_ROLLBACK_IN_PROGRESS|UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS)
                echo "Rollback is already in progress for ${STACK_NAME}; waiting for completion."
                ;;
              *)
                echo "Refusing to continue rollback from ${stack_status}."
                exit 1
                ;;
            esac

            for attempt in {1..60}; do
              stack_status="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].StackStatus' --output text)"
              echo "${STACK_NAME} status: ${stack_status}"
              case "${stack_status}" in
                UPDATE_ROLLBACK_COMPLETE)
                  echo "Rollback completed for ${STACK_NAME}."
                  exit 0
                  ;;
                UPDATE_ROLLBACK_FAILED|ROLLBACK_FAILED)
                  echo "Rollback failed for ${STACK_NAME}."
                  exit 1
                  ;;
              esac
              sleep 10
            done
            echo "Timed out waiting for rollback to complete for ${STACK_NAME}."
            exit 1
          fi

          if [[ -n "${EXISTING_CHANGE_SET_NAME}" ]]; then
            change_set_name="${EXISTING_CHANGE_SET_NAME}"
            change_set_type="$(aws cloudformation describe-change-set \
              --stack-name "${STACK_NAME}" \
              --change-set-name "${change_set_name}" \
              --query 'ChangeSetType' \
              --output text)"
          else
            change_set_type="UPDATE"
            parameter_args=()
            tag_args=()
            stack_parameters_file="$(mktemp)"
            if aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME}" \
              --query 'Stacks[0].Parameters[].ParameterKey' \
              --output json > "${stack_parameters_file}"; then
              while IFS= read -r parameter_key; do
                if [[ "${parameter_key}" == "CanonDelightfulCloudWatchStackName" ]]; then
                  continue
                fi
                if [[ "${parameter_key}" == "EnableStagingRdsSchedule" && "${ENABLE_DELIGHTFUL_STAGING_RDS_SCHEDULE}" != "previous" ]]; then
                  if [[ "${STACK_NAME}" != "${CANON_DELIGHTFUL_STACK_NAME}" || "${TEMPLATE_PATH}" != "${CANON_DELIGHTFUL_TEMPLATE_PATH}" ]]; then
                    echo "Refusing EnableStagingRdsSchedule override outside ${CANON_DELIGHTFUL_STACK_NAME} using ${CANON_DELIGHTFUL_TEMPLATE_PATH}."
                    exit 1
                  fi
                  parameter_args+=("ParameterKey=${parameter_key},ParameterValue=${ENABLE_DELIGHTFUL_STAGING_RDS_SCHEDULE}")
                else
                  parameter_args+=("ParameterKey=${parameter_key},UsePreviousValue=true")
                fi
              done < <(jq -r '.[]?' "${stack_parameters_file}")
            else
              change_set_type="CREATE"
            fi

            if [[ "${STACK_NAME}" == "${CANON_DELIGHTFUL_STACK_NAME}" && "${TEMPLATE_PATH}" == "${CANON_DELIGHTFUL_TEMPLATE_PATH}" ]]; then
              stack_tags_file="$(mktemp)"
              if aws cloudformation describe-stacks \
                --stack-name "${STACK_NAME}" \
                --query 'Stacks[0].Tags' \
                --output json > "${stack_tags_file}"; then
                while IFS= read -r tag; do
                  tag_args+=("${tag}")
                done < <(jq -r '
                  (map(select(.Key != "Environment")) + [{"Key":"Environment","Value":"Staging"}])
                  | .[]
                  | "Key=\(.Key),Value=\(.Value)"
                ' "${stack_tags_file}")
              else
                tag_args+=("Key=Environment,Value=Staging")
              fi
            fi

            if [[ "${STACK_NAME}" == "${CANON_DELIGHTFUL_VPC_STACK_NAME}" && "${TEMPLATE_PATH}" == "${CANON_DELIGHTFUL_VPC_TEMPLATE_PATH}" ]]; then
              stack_tags_file="$(mktemp)"
              if aws cloudformation describe-stacks \
                --stack-name "${STACK_NAME}" \
                --query 'Stacks[0].Tags' \
                --output json > "${stack_tags_file}"; then
                while IFS= read -r tag; do
                  tag_args+=("${tag}")
                done < <(jq -r '
                  (
                    map(select(.Key != "System" and .Key != "Environment"))
                    + [
                      {"Key":"System","Value":"Delightful"},
                      {"Key":"Environment","Value":"Production"}
                    ]
                  )
                  | .[]
                  | "Key=\(.Key),Value=\(.Value)"
                ' "${stack_tags_file}")
              else
                tag_args+=("Key=System,Value=Delightful")
                tag_args+=("Key=Environment,Value=Production")
              fi
            fi

            create_change_set_args=(
              --stack-name "${STACK_NAME}"
              --change-set-name "${change_set_name}"
              --change-set-type "${change_set_type}"
              --template-body "file://${TEMPLATE_PATH}"
              --capabilities CAPABILITY_NAMED_IAM
              --description "Prepared by GitHub Actions run ${GITHUB_RUN_ID}; not executed by this workflow."
            )
            if [[ "${#parameter_args[@]}" -gt 0 ]]; then
              create_change_set_args+=(--parameters "${parameter_args[@]}")
            fi
            if [[ "${#tag_args[@]}" -gt 0 ]]; then
              create_change_set_args+=(--tags "${tag_args[@]}")
            fi

            aws cloudformation create-change-set \
              "${create_change_set_args[@]}"

            echo "Waiting for change set creation..."
            if ! aws cloudformation wait change-set-create-complete \
              --stack-name "${STACK_NAME}" \
              --change-set-name "${change_set_name}"; then
              status_reason="$(aws cloudformation describe-change-set \
                --stack-name "${STACK_NAME}" \
                --change-set-name "${change_set_name}" \
                --query 'StatusReason' \
                --output text)"
              echo "${status_reason}"
              if [[ "${status_reason}" == *"The submitted information didn't contain changes"* || "${status_reason}" == *"No updates are to be performed"* ]]; then
                exit 0
              fi
              exit 1
            fi
          fi

          change_set_file="$(mktemp)"
          aws cloudformation describe-change-set \
            --stack-name "${STACK_NAME}" \
            --change-set-name "${change_set_name}" \
            --query 'Changes[].ResourceChange.{Action:Action,LogicalResourceId:LogicalResourceId,ResourceType:ResourceType,Replacement:Replacement}' \
            --output table
          aws cloudformation describe-change-set \
            --stack-name "${STACK_NAME}" \
            --change-set-name "${change_set_name}" \
            --include-property-values \
            --output json > "${change_set_file}"
          jq -r '
            .Changes[].ResourceChange
            | [
                .Action,
                .LogicalResourceId,
                .ResourceType,
                (.Replacement // "N/A"),
                (
                  [
                    .Details[]?
                    | "\(.Target.Attribute):\(.Target.Name // "N/A"):\(.Target.Path // "N/A"):\(.Target.AttributeChangeType // "N/A"):\(.Evaluation):before=\(.Target.BeforeValue // "N/A"):after=\(.Target.AfterValue // "N/A")"
                  ]
                  | if length == 0 then "No detail entries" else join("; ") end
                )
              ]
            | @tsv
          ' "${change_set_file}" | column -t -s $'\t'

          if [[ "${{ github.event.inputs.execute_change_set }}" == "true" ]]; then
            if [[ ! ( "${STACK_NAME}" == "${CANON_BOOTSTRAP_STACK_NAME}" && "${TEMPLATE_PATH}" == "${CANON_BOOTSTRAP_TEMPLATE_PATH}" ) && ! ( "${STACK_NAME}" == "${CANON_IAM_STACK_NAME}" && "${TEMPLATE_PATH}" == "${CANON_IAM_TEMPLATE_PATH}" ) && ! ( "${STACK_NAME}" == "${CANON_DELIGHTFUL_STACK_NAME}" && "${TEMPLATE_PATH}" == "${CANON_DELIGHTFUL_TEMPLATE_PATH}" ) && ! ( "${STACK_NAME}" == "${CANON_DELIGHTFUL_VPC_STACK_NAME}" && "${TEMPLATE_PATH}" == "${CANON_DELIGHTFUL_VPC_TEMPLATE_PATH}" ) ]]; then
              echo "Refusing to execute change set. Execution is only allowed for ${CANON_BOOTSTRAP_STACK_NAME} using ${CANON_BOOTSTRAP_TEMPLATE_PATH}, ${CANON_IAM_STACK_NAME} using ${CANON_IAM_TEMPLATE_PATH}, ${CANON_DELIGHTFUL_STACK_NAME} using ${CANON_DELIGHTFUL_TEMPLATE_PATH}, or ${CANON_DELIGHTFUL_VPC_STACK_NAME} using ${CANON_DELIGHTFUL_VPC_TEMPLATE_PATH}."
              exit 1
            fi

            echo "Executing change set ${change_set_name} for ${STACK_NAME}."
            aws cloudformation execute-change-set \
              --stack-name "${STACK_NAME}" \
              --change-set-name "${change_set_name}"
            if [[ "${change_set_type}" == "CREATE" ]]; then
              waiter_name="stack-create-complete"
            else
              waiter_name="stack-update-complete"
            fi
            if ! aws cloudformation wait "${waiter_name}" --stack-name "${STACK_NAME}"; then
              aws cloudformation describe-stack-events \
                --stack-name "${STACK_NAME}" \
                --query 'StackEvents[0:20].{Time:Timestamp,LogicalResourceId:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' \
                --output table
              exit 1
            fi
            echo "Stack update completed for ${STACK_NAME}."
          else
            echo "Created change set ${change_set_name}. Review it in CloudFormation; this workflow did not execute it."
          fi
