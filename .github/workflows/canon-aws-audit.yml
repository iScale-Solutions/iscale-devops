name: Canon AWS Audit

on:
  workflow_dispatch:
    inputs:
      regions:
        description: Comma-separated AWS regions to inventory for regional services
        required: true
        default: ap-southeast-1
      include_iam:
        description: Include IAM users/groups/roles/policies. This can be slow in large accounts.
        required: true
        type: boolean
        default: true
      include_cloudformation:
        description: Include CloudFormation stack metadata/templates. This can be slow in large accounts.
        required: true
        type: boolean
        default: false
      include_drift:
        description: Include CloudFormation drift detection. This can be slow.
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - clients/canon/**
      - .github/workflows/canon-*.yml
  push:
    branches:
      - master
    paths:
      - clients/canon/**
      - .github/workflows/canon-*.yml

permissions:
  contents: read
  # Required for GitHub OIDC. Do not add static AWS access keys to this workflow.
  id-token: write

env:
  CANON_AWS_ACCOUNT_ID: "780347486043"
  DEFAULT_CANON_AWS_REGION: ap-southeast-1

jobs:
  lint:
    name: Lint Canon changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install lint tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user cfn-lint
          sudo apt-get update
          sudo apt-get install -y shellcheck
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Lint Canon files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            clients/canon/lint-canon.sh --files \
              ".github/workflows/canon-aws-audit.yml" \
              "clients/canon/lint-canon.sh" \
              "clients/canon/audit/export-canon-aws-inventory.sh"
          else
            if [[ "${EVENT_NAME}" == "pull_request" ]]; then
              base_ref="${PR_BASE_SHA}"
            elif [[ "${PUSH_BEFORE_SHA}" =~ ^0+$ ]]; then
              base_ref="HEAD~1"
            else
              base_ref="${PUSH_BEFORE_SHA}"
            fi
            clients/canon/lint-canon.sh --changed "${base_ref}" "${GITHUB_SHA}"
          fi

  audit:
    name: Export Canon AWS inventory
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CANON_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.DEFAULT_CANON_AWS_REGION }}

      - name: Confirm Canon AWS account
        shell: bash
        run: |
          set -euo pipefail
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "${actual_account_id}" != "${CANON_AWS_ACCOUNT_ID}" ]]; then
            echo "Expected Canon AWS account ${CANON_AWS_ACCOUNT_ID}, got ${actual_account_id}."
            exit 1
          fi

      - name: Export inventory
        shell: bash
        run: |
          set -euo pipefail
          chmod +x clients/canon/audit/export-canon-aws-inventory.sh
          clients/canon/audit/export-canon-aws-inventory.sh canon-audit "${{ github.event.inputs.regions }}" "${{ github.event.inputs.include_iam }}" "${{ github.event.inputs.include_cloudformation }}" "${{ github.event.inputs.include_drift }}"

      - name: Upload inventory artifact
        uses: actions/upload-artifact@v6
        with:
          name: canon-aws-audit-${{ github.run_id }}
          path: canon-audit
          retention-days: 14
